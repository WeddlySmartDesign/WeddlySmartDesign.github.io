<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weddly Smart Design · Guests · Essential</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#ece7de;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#2c2a26}button{font:inherit}
#public,#admin{display:none}.public #public{display:block}.admin #admin{display:block}
.invite{width:min(100%,620px);margin:0 auto;background:#f4efe6;min-height:100vh}.artWrap{position:relative;width:100%;background:#f4efe6}.art{display:block;width:100%;height:auto}.hotspots{position:absolute;inset:0;pointer-events:none}.hotspot{position:absolute;border:0;background:transparent;padding:0;margin:0;pointer-events:auto;cursor:pointer;border-radius:12px}.hotspot:focus-visible{outline:3px solid #9a7438;outline-offset:2px}
/* Los porcentajes se calculan sobre la lámina aprobada completa 587×1672. No mueven ni deforman el arte. */
#locCeremony{left:17.8%;top:68.1%;width:27.4%;height:5.7%}
#locParty{left:54.4%;top:68.1%;width:28%;height:5.7%}
#confirmHotspot{left:13%;top:78.2%;width:74%;height:11.8%}
#contactHotspot{left:25%;top:91.2%;width:50%;height:5.2%}
.loading,.fatal{padding:40px 24px;text-align:center;color:#6f675e}.fatal button{margin-top:12px;border:0;border-radius:999px;padding:12px 18px;background:#2c2a26;color:white;font-weight:700}
.modal{position:fixed;inset:0;z-index:100;background:#0008;display:none;align-items:flex-end}.modal.on{display:flex}.modalPanel{width:min(100%,620px);height:min(92vh,860px);margin:0 auto;background:#f5f1ea;border-radius:24px 24px 0 0;overflow:hidden;box-shadow:0 -18px 50px #0004}.modalHead{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:white;border-bottom:1px solid #ddd5c8;font-weight:800}.modalHead button{border:0;width:40px;height:40px;border-radius:50%;background:#eee8df;font-size:22px}.modal iframe{width:100%;height:calc(100% - 60px);border:0;background:#f5f1ea}
.adminTop{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd5c8;padding:11px 14px;display:flex;gap:12px;align-items:center}.adminTop button{border:0;border-radius:15px;background:#eee8df;padding:11px 14px;font-weight:800}.adminTop b{display:block;font-size:18px}.adminTop small{display:block;color:#726d67;margin-top:2px}.adminPage{width:min(100%,760px);margin:auto;padding:16px 12px 60px}.card{background:#fff;border:1px solid #dbd1c2;border-radius:24px;padding:16px;margin-bottom:18px}.cardHead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}.cardHead h2{margin:0;font:500 30px Georgia,serif}.cardHead p{margin:4px 0 0;color:#716c65;font-size:13px}.cardHead button{border:0;border-radius:14px;background:#2c2a26;color:white;padding:12px 14px;font-weight:800}.previewViewport{height:560px;border-radius:18px;overflow:hidden;background:#eee8df;border:1px solid #ddd1bf}.previewViewport iframe{width:100%;height:100%;border:0;display:block;pointer-events:none;background:#f4efe6}.editorCard{background:#fff;border:1px solid #dbd1c2;border-radius:24px;overflow:hidden}.editorCard iframe{width:100%;min-height:1350px;border:0;display:block;background:#f5f1ea}@media(max-width:520px){.adminPage{padding:14px 10px 55px}.cardHead{display:block}.cardHead button{width:100%;margin-top:12px}.previewViewport{height:500px}}
</style>
</head>
<body>
<div id="public">
 <main class="invite">
  <div id="mount" class="loading">Cargando invitación…</div>
 </main>
</div>
<div id="admin">
 <header class="adminTop"><button id="back">← Volver</button><div><b>RSVP</b><small>Essential · diseño cerrado</small></div></header>
 <main class="adminPage">
  <section class="card"><div class="cardHead"><div><h2>Essential</h2><p>La invitación se muestra como una única lámina aprobada. El RSVP sigue siendo el de Guests.</p></div><button id="openPreview">Ver como invitado</button></div><div class="previewViewport"><iframe id="previewFrame" title="Vista previa Essential"></iframe></div></section>
  <section class="editorCard"><iframe id="adminFrame" title="Configuración RSVP"></iframe></section>
 </main>
</div>
<div class="modal" id="modal"><div class="modalPanel"><div class="modalHead"><span>Confirmación de asistencia</span><button id="closeModal" aria-label="Cerrar">×</button></div><iframe id="rsvpFrame" title="Formulario RSVP"></iframe></div></div>
<script>
(()=>{
 const q=new URLSearchParams(location.search);
 const IS_PUBLIC=q.get('guest')==='1'||q.get('preview')==='1';
 const TOKEN=q.get('t')||'sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8';
 const PARTS=['full-000.b64','full-001.b64','full-002.b64','full-003.b64','full-004.b64','full-005.b64','full-006.b64','full-007.b64'].map(n=>'assets/essential-exact-v3/'+n+'?v=paper7');
 let artwork='';
 async function loadArtwork(){
  const rs=await Promise.all(PARTS.map(u=>fetch(u,{cache:'no-store'})));
  if(rs.some(r=>!r.ok))throw new Error('No se han podido cargar todos los fragmentos del arte');
  const txt=await Promise.all(rs.map(r=>r.text()));
  const b64=txt.join('').replace(/\s+/g,'');
  if(!b64.startsWith('/9j/')||b64.length<100000)throw new Error('El arte aprobado está incompleto');
  artwork='data:image/jpeg;base64,'+b64;
  await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{if(im.naturalWidth!==587||im.naturalHeight!==1672)reject(new Error('Dimensiones inesperadas'));else resolve()};im.onerror=()=>reject(new Error('JPEG no válido'));im.src=artwork});
 }
 function guestUrl(){const u=new URL('guests-rsvp-essential-paper-v1.html',location.href);u.searchParams.set('guest','1');u.searchParams.set('t',TOKEN);u.searchParams.set('v','paper7');return u.toString()}
 function openRSVP(){const g=q.get('g')||'';document.getElementById('rsvpFrame').src='guests-rsvp-v105-mobile.html?guest=1&t='+encodeURIComponent(TOKEN)+(g?'&g='+encodeURIComponent(g):'')+'&embed=1&v=paper7-'+Date.now();document.getElementById('modal').classList.add('on');document.body.style.overflow='hidden'}
 function closeRSVP(){document.getElementById('modal').classList.remove('on');document.body.style.overflow='';setTimeout(()=>document.getElementById('rsvpFrame').src='about:blank',150)}
 function maps(which){const query=which==='ceremony'?'Finca La Alquería, Murcia':'Jardín norte, Murcia';window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query),'_blank','noopener')}
 function contact(){location.href='tel:600123123'}
 function mountPublic(){const m=document.getElementById('mount');m.className='';m.innerHTML=`<div class="artWrap"><img class="art" src="${artwork}" alt="Invitación Essential"><div class="hotspots"><button id="locCeremony" class="hotspot" aria-label="Ver ubicación de la ceremonia"></button><button id="locParty" class="hotspot" aria-label="Ver ubicación de la celebración"></button><button id="confirmHotspot" class="hotspot" aria-label="Confirmar asistencia"></button><button id="contactHotspot" class="hotspot" aria-label="Contactar con los novios"></button></div></div>`;document.getElementById('locCeremony').onclick=()=>maps('ceremony');document.getElementById('locParty').onclick=()=>maps('party');document.getElementById('confirmHotspot').onclick=openRSVP;document.getElementById('contactHotspot').onclick=contact}
 function fatal(err){const m=document.getElementById('mount');m.className='fatal';m.innerHTML='No se ha podido cargar la invitación aprobada.<br><button id="retry">Reintentar</button>';document.getElementById('retry').onclick=()=>location.reload()}
 function patchEmbeddedRSVP(){const f=document.getElementById('rsvpFrame');try{const d=f.contentDocument;if(!d||f.src==='about:blank')return;let s=d.getElementById('essentialEmbed');if(!s){s=d.createElement('style');s.id='essentialEmbed';d.head.appendChild(s)}s.textContent='.back,.brand,.hero,#admin{display:none!important}html,body,.wrap{background:#f5f1ea!important}.wrap{max-width:none!important;padding:14px 16px 70px!important}#public{display:block!important}.card{box-shadow:none!important}'}catch{}}
 function patchAdminFrame(){const f=document.getElementById('adminFrame');try{const d=f.contentDocument;if(!d)return;d.querySelector('.back')?.style.setProperty('display','none','important');d.querySelector('.brand')?.style.setProperty('display','none','important');const h=d.querySelector('h1');if(h)h.style.display='none';const w=d.querySelector('.wrap');if(w){w.style.maxWidth='none';w.style.padding='16px 16px 70px'}const ro=new ResizeObserver(()=>{try{f.style.height=Math.max(1350,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch{}});ro.observe(d.body);f.style.height=Math.max(1350,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch{}}
 async function renderPublic(){document.body.className='public';try{await loadArtwork();mountPublic()}catch(e){fatal(e)}}
 async function renderAdmin(){document.body.className='admin';const pf=document.getElementById('previewFrame'),af=document.getElementById('adminFrame');pf.src=guestUrl()+'&preview=1';af.src='guests-rsvp-v105-mobile.html?v=paper7';document.getElementById('openPreview').onclick=()=>window.open(guestUrl(),'_blank','noopener');document.getElementById('back').onclick=()=>history.length>1?history.back():location.href='guests-personalized-functional-v5.html#invitados';af.addEventListener('load',()=>{patchAdminFrame();setTimeout(patchAdminFrame,250);setTimeout(patchAdminFrame,800)})}
 document.getElementById('closeModal').onclick=closeRSVP;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeRSVP()};document.getElementById('rsvpFrame').addEventListener('load',()=>{patchEmbeddedRSVP();setTimeout(patchEmbeddedRSVP,200)});
 IS_PUBLIC?renderPublic():renderAdmin();
})();
</script>
</body>
</html>
