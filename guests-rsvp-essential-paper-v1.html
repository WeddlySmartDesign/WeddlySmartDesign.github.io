<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weddly Smart Design · RSVP Essential Paper</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efeae1;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#2c2a26}
#bar{height:66px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #ddd5c8;position:relative;z-index:10}#bar.hidden{display:none}.back{border:0;background:#eee8df;color:#2c2a26;border-radius:13px;padding:11px 14px;font-weight:800;font-size:15px}.barcopy b{display:block;font-size:15px}.barcopy small{display:block;color:#706b65;margin-top:2px}.frame{display:block;width:100%;height:calc(100% - 66px);border:0;background:#f5f1ea}.frame.full{height:100%}
</style>
</head>
<body>
<div id="bar"><button class="back" id="back">← Volver</button><div class="barcopy"><b>RSVP</b><small>Essential · papelería conectada</small></div></div>
<iframe id="frame" class="frame" title="RSVP"></iframe>
<script>
(()=>{
const PKEY='weddly_personalization_v2',TOKEN_KEY='weddly_shared_wedding_token';
const PAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-personalization';
const RAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp';
const ART_B64='assets/essential-canva-bg-exact-v2.webp.base64';
const q=new URLSearchParams(location.search),PUBLIC=q.get('guest')==='1'||q.has('t');
const bar=document.getElementById('bar'),frame=document.getElementById('frame');
if(PUBLIC){bar.classList.add('hidden');frame.classList.add('full')}
let S={p1:'Alba',p2:'Leo',date:'2027-09-12',place:'Murcia',photo:''};
try{S={...S,...(JSON.parse(localStorage.getItem(PKEY)||'null')||{})}}catch{}
let art='';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function day(){return S.date&&/^\d{4}-\d{2}-\d{2}/.test(S.date)?S.date.slice(8,10):'12'}
function month(){if(!S.date)return'SEPTIEMBRE';return new Date(S.date+'T12:00:00').toLocaleDateString('es-ES',{month:'long'}).toUpperCase()}
function year(){return S.date&&/^\d{4}/.test(S.date)?S.date.slice(0,4):'2027'}
function fmtDate(){if(!S.date)return'12 septiembre 2027';const d=new Date(S.date+'T12:00:00');return Number.isNaN(d.getTime())?S.date:d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}
function photo(){return S.photo||'https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=1200&q=88'}
async function loadArt(){if(art)return art;try{const r=await fetch(ART_B64,{cache:'no-store'});if(!r.ok)throw 0;const b=(await r.text()).replace(/\s+/g,'');art='data:image/webp;base64,'+b}catch{art=''}return art}
async function loadRemote(){const token=q.get('t')||'';if(!token)return;try{const r=await fetch(PAPI+'?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(r.ok&&x.ok&&x.personalization){S={...S,...x.personalization};try{localStorage.setItem(PKEY,JSON.stringify(S))}catch{}}}catch{}}
function eventData(d){const hero=d.querySelector('#public .hero'),cells=hero?[...hero.querySelectorAll('.where>div')]:[];return{hero,time:cells[0]?.textContent?.replace(/^Hora/i,'').trim()||d.getElementById('time')?.value||'18:00',venue:cells[1]?.textContent?.replace(/^Lugar/i,'').trim()||d.getElementById('venue')?.value||'Finca Los Olivos'}}
function artImg(){return art?`<img class="paperArt" src="${art}" alt="">`:''}
function icon(type){if(type==='cal')return '<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14" rx="1"/><path d="M8 3v6M16 3v6M4 10h16"/></svg>';if(type==='clock')return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>';return '<svg viewBox="0 0 24 24"><path d="M12 21s6-6.2 6-11a6 6 0 1 0-12 0c0 4.8 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></svg>'}
function cover(ev,mini=false){return `<section class="paperPage cover ${mini?'miniCover':''}">${artImg()}<div class="coverLayer"><div class="scriptTop">¡Nos casamos!</div><div class="caps">Y NOS GUSTARÍA INVITARTE A NUESTRA BODA<br>¿TE APUNTAS?</div><div class="heart"><img src="${esc(photo())}" alt="Foto de la pareja"></div><div class="names">${esc(S.p1)} y ${esc(S.p2)}</div><div class="facts"><div>${icon('cal')}<b>${day()} ${month()}<br>${year()}</b></div><div>${icon('clock')}<b>${esc(ev.time)} H</b></div><div>${icon('pin')}<b>${esc(ev.venue)}</b></div></div><div class="wait">¡TE ESPERAMOS!</div><div class="city">${esc(S.place||'Murcia')}</div></div></section>`}
function page(inner,cls=''){return `<section class="paperPage ${cls}">${artImg()}<div class="pageLayer">${inner}</div></section>`}
function fullMarkup(ev){return `<div id="wsdEssentialPaper">${cover(ev)}${page(`<div class="ey">AGENDA</div><h2>Así será el día.</h2><div class="timeline"><div class="trow"><time>${esc(ev.time)}</time><div><b>Ceremonia</b><small>${esc(ev.venue)}</small></div></div><div class="trow"><time>19:00</time><div><b>Cóctel</b><small>Jardín norte</small></div></div><div class="trow"><time>21:00</time><div><b>Cena</b><small>Salón principal</small></div></div><div class="trow"><time>00:00</time><div><b>Fiesta</b><small>Hasta que el cuerpo aguante</small></div></div></div>`,'agendaPage')}${page(`<div class="ey">DÓNDE</div><h2>El lugar.</h2><div class="placeBlock"><span>CEREMONIA</span><strong>${esc(ev.venue)}</strong><small>${esc(ev.time)} · ${esc(S.place||'Murcia')}</small></div><div class="placeBlock second"><span>CELEBRACIÓN</span><strong>${esc(ev.venue)}</strong><small>19:00 · ${esc(S.place||'Murcia')}</small></div>`,'wherePage')}${page(`<div class="ey">CONFIRMACIÓN</div><h2>¿Vienes?</h2><p class="lead">Este es el formulario RSVP de Guests. Las respuestas siguen volviendo a vuestra lista, igual que antes.</p><div id="wsdFormSlot"></div>`,'formPage')}${page(`<div class="ey">NOS VEMOS PRONTO</div><h2 class="closing">${esc(S.p1)} y ${esc(S.p2)}</h2><div class="closingMeta">${esc(fmtDate())} · ${esc(S.place||'Murcia')}</div>`,'closingPage')}</div>`}
function css(){return `
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap');
html,body{background:#e8e2d8!important;color:#7d5d22!important}.wrap{max-width:540px!important;padding:0!important;background:#f1ede5!important;box-shadow:0 20px 60px #493b2a22}.publicOriginalHero,#public>.brand,#public>.hero{display:none!important}#public{padding:0!important}.paperPage{position:relative;overflow:hidden;background:#efebe2;color:#876626}.paperArt{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;z-index:0;pointer-events:none}.cover{aspect-ratio:1090/1536}.coverLayer,.pageLayer{position:relative;z-index:2}.coverLayer{height:100%;text-align:center}.scriptTop,.names,.paperPage h2,.closing{font-family:'Parisienne',cursive;font-weight:400}.scriptTop{position:absolute;top:4.1%;left:8%;right:8%;font-size:clamp(38px,10vw,58px);line-height:1}.caps{position:absolute;top:10.2%;left:7%;right:7%;font:600 clamp(8px,2.35vw,13px)/1.55 'DM Sans',sans-serif;letter-spacing:.21em}.heart{position:absolute;left:17.5%;top:18.7%;width:65%;height:43.7%;clip-path:polygon(50% 9%,57% 4%,66% 1%,76% 2%,86% 8%,93% 18%,97% 31%,96% 43%,92% 55%,86% 66%,79% 75%,70% 84%,60% 92%,50% 100%,40% 92%,30% 84%,21% 75%,14% 66%,8% 55%,4% 43%,3% 31%,7% 18%,14% 8%,24% 2%,34% 1%,43% 4%);overflow:hidden}.heart img{width:100%;height:100%;object-fit:cover}.names{position:absolute;top:64.4%;left:7%;right:7%;font-size:clamp(42px,10vw,62px);line-height:1}.facts{position:absolute;left:14%;right:14%;top:73.1%;display:grid;grid-template-columns:repeat(3,1fr);text-align:center}.facts>div{min-height:78px;padding:2px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center}.facts>div+div{border-left:1px solid #9d7c38}.facts svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;margin-bottom:8px}.facts b{font:500 clamp(8px,2.1vw,12px)/1.45 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase}.wait{position:absolute;left:8%;right:8%;bottom:9.5%;font:700 clamp(9px,2.3vw,13px) 'DM Sans',sans-serif;letter-spacing:.2em}.city{position:absolute;left:8%;right:8%;bottom:6.3%;font:500 clamp(8px,2vw,11px) 'DM Sans',sans-serif;letter-spacing:.14em}.paperPage:not(.cover){min-height:680px}.pageLayer{min-height:680px;padding:76px 48px}.ey{text-align:center;font:700 10px 'DM Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase}.paperPage h2{text-align:center;font-size:54px;line-height:1;margin:10px 0 46px}.timeline{max-width:390px;margin:auto}.trow{display:grid;grid-template-columns:95px 1fr;gap:24px;padding:22px 0;border-bottom:1px solid #bfa46e;align-items:baseline}.trow time{font:500 28px 'Cormorant Garamond',serif}.trow b{display:block;font:500 28px 'Cormorant Garamond',serif}.trow small{display:block;margin-top:5px;color:#6f6659;font:500 13px 'DM Sans',sans-serif}.placeBlock{max-width:390px;margin:35px auto 0;padding:28px 0;border-top:1px solid #bfa46e;border-bottom:1px solid #bfa46e}.placeBlock.second{margin-top:45px}.placeBlock span{display:block;font:700 9px 'DM Sans',sans-serif;letter-spacing:.2em}.placeBlock strong{display:block;font:500 35px 'Cormorant Garamond',serif;margin:10px 0 6px}.placeBlock small{font:500 13px 'DM Sans',sans-serif;color:#6f6659}.lead{max-width:390px;margin:-24px auto 24px;text-align:center;font:500 16px/1.55 'Cormorant Garamond',serif;color:#635849}.formPage{min-height:760px}.formPage .pageLayer{padding-left:34px;padding-right:34px}.formPage #wsdFormSlot>.card{background:#f9f4eacc!important;border:1px solid #cdb98f!important;border-radius:18px!important;box-shadow:none!important;padding:20px!important;color:#54452d!important}.formPage .field,.formPage .answer{background:#fffaf2!important;border-color:#d1bd95!important;border-radius:10px!important;color:#40382f!important}.formPage .answer.sel{outline:2px solid #9d7734!important}.formPage .btn{background:#9a7331!important;color:#fff!important;border-radius:999px!important}.formPage .toggle{border-color:#eadfcd!important}.closingPage{min-height:560px}.closingPage .pageLayer{display:flex;min-height:560px;flex-direction:column;align-items:center;justify-content:center}.closing{font-size:64px!important;margin:15px 0 10px!important}.closingMeta{font:600 10px 'DM Sans',sans-serif;letter-spacing:.18em;text-transform:uppercase}.adminEssential{margin:0 0 20px;background:#f4efe6;border:1px solid #d8c7a5;border-radius:22px;padding:16px}.adminEssential .tag{font:800 10px 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7d5d22;margin-bottom:12px}.adminMini{max-width:270px;margin:auto;border-radius:16px;overflow:hidden;box-shadow:0 12px 26px #6a563522}.adminMini .miniCover{width:100%;aspect-ratio:1090/1536}.adminMini .miniCover .scriptTop{font-size:30px}.adminMini .miniCover .caps{font-size:6px}.adminMini .miniCover .names{font-size:32px}.adminMini .miniCover .facts b{font-size:5.5px}.adminMini .miniCover .facts svg{width:11px;height:11px;margin-bottom:4px}.adminMini .miniCover .wait{font-size:6px}.adminMini .miniCover .city{font-size:5.5px}.adminEssential p{color:#70665a;font-size:12px;line-height:1.45;margin:12px 2px 0}.previewBackFixed{position:fixed!important;z-index:9999!important;left:10px!important;top:10px!important;border-radius:999px!important}@media(max-width:520px){.paperPage:not(.cover),.pageLayer{min-height:620px}.pageLayer{padding:60px 30px}.paperPage h2{font-size:47px}.trow{grid-template-columns:78px 1fr;gap:16px}.trow time{font-size:25px}.trow b{font-size:25px}.formPage .pageLayer{padding-left:22px;padding-right:22px}.closingPage,.closingPage .pageLayer{min-height:500px}.closing{font-size:52px!important}}
`}
function token(d){try{return [...d.scripts].map(s=>s.textContent||'').join('\n').match(/PT='([^']+)'/)?.[1]||q.get('t')||''}catch{return q.get('t')||''}}
function designedLink(d,id=''){return location.origin+'/guests-rsvp-essential-paper-v1.html?guest=1&t='+encodeURIComponent(token(d))+(id?'&g='+encodeURIComponent(id):'')+'&v=1'}
function patchShare(d){if(d.documentElement.dataset.wsdPaperShare)return;d.documentElement.dataset.wsdPaperShare='1';d.addEventListener('click',async e=>{const copy=e.target.closest?.('[data-copy]'),wa=e.target.closest?.('[data-wa]');if(!copy&&!wa)return;const id=copy?copy.dataset.copy:wa.dataset.wa,link=designedLink(d,id);e.preventDefault();e.stopImmediatePropagation();if(copy){try{await navigator.clipboard.writeText(link)}catch{}return}const row=wa.closest('.recipient'),name=row?.querySelector('.rhead b')?.textContent?.trim()||'',raw=row?.querySelector('.contactline')?.textContent?.trim()||'',phone=raw.replace(/\D/g,'');const text=`Hola ${name}, te enviamos nuestro RSVP. Puedes responder aquí: ${link}`;try{fetch(RAPI,{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-weddly-token':localStorage.getItem(TOKEN_KEY)||''},body:JSON.stringify({action:'delivery',token:token(d),guest_key:id,status:'sent'})})}catch{}if(phone)location.href=`https://wa.me/${phone}?text=${encodeURIComponent(text)}`},true)}
function decorateAdmin(d){const admin=d.getElementById('admin');if(!admin||getComputedStyle(admin).display==='none')return;const ev=eventData(d);let x=d.getElementById('wsdAdminPaper');if(!x){x=d.createElement('section');x.id='wsdAdminPaper';x.className='adminEssential';admin.querySelector('.tabs')?.before(x)}x.innerHTML=`<div class="tag">DISEÑO ESSENTIAL · PAPELERÍA</div><div class="adminMini">${cover(ev,true)}</div><p>Este diseño usa la plantilla de papelería aprobada como imagen base. No reconstruye las ramas ni el fondo. El formulario y las respuestas siguen siendo los de Guests.</p>`;patchShare(d)}
function decoratePublic(d){const pub=d.getElementById('public');if(!pub||getComputedStyle(pub).display==='none')return;if(pub.querySelector('.success')){pub.querySelector('.success').style.cssText='min-height:100vh;display:grid;place-items:center;text-align:center;background:#f2ede4;color:#7d5d22;padding:40px';return}const ev=eventData(d);if(ev.hero)ev.hero.classList.add('publicOriginalHero');const card=[...pub.children].find(n=>n.classList?.contains('card'));if(!card)return;let root=d.getElementById('wsdEssentialPaper');if(!root){const box=d.createElement('div');box.innerHTML=fullMarkup(ev);root=box.firstElementChild;pub.insertBefore(root,pub.firstChild)}d.getElementById('wsdFormSlot')?.appendChild(card);const pb=d.getElementById('previewBack');if(pb)pb.classList.add('previewBackFixed')}
function install(){try{const d=frame.contentDocument;if(!d)return;let st=d.getElementById('wsd-paper-v1-style');if(!st){st=d.createElement('style');st.id='wsd-paper-v1-style';d.head.appendChild(st)}st.textContent=css();decorateAdmin(d);decoratePublic(d);patchShare(d);if(!d.documentElement.dataset.wsdPaperObs){d.documentElement.dataset.wsdPaperObs='1';new MutationObserver(()=>{decorateAdmin(d);decoratePublic(d);patchShare(d)}).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']})}}catch(e){console.warn('Essential paper',e)}}
document.getElementById('back').onclick=()=>history.length>1?history.back():location.href='guests-personalized-functional-v5.html?v=paper';
frame.addEventListener('load',()=>{install();setTimeout(install,120);setTimeout(install,650)});
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='wsd-personalization-update'){S={...S,...e.data.value};try{localStorage.setItem(PKEY,JSON.stringify(S))}catch{}install()}});
(async()=>{await loadArt();if(PUBLIC)await loadRemote();frame.src='guests-rsvp-v105-mobile.html'+location.search+(location.search?'&':'?')+'v=essential-paper-v1'})();
})();
</script>
</body>
</html>
