<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weddly Smart Design · Guests · Essential</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;600;700&family=Parisienne&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#ece7de;color:#7f5d27;font-family:DM Sans,system-ui,sans-serif}button,input,textarea{font:inherit}.hidden{display:none!important}
/* public invitation */
#public{display:none}.public #public{display:block}.site{width:min(100%,480px);margin:0 auto;background:#f0ece3;box-shadow:0 0 38px #5f4c2b18}.sheet{position:relative;width:100%;aspect-ratio:1090/1536;overflow:hidden;background:#f2eee5;container-type:inline-size}.paper{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;z-index:0}.ink{position:absolute;inset:0;z-index:1}.script{font-family:Parisienne,cursive;font-weight:400;color:#946b27}.serif{font-family:Cormorant Garamond,Georgia,serif}.ey{font-size:2.6cqw;letter-spacing:.22em;text-transform:uppercase;font-weight:700}.brand{font-size:2.45cqw;letter-spacing:.17em;text-transform:uppercase;font-weight:700;color:#765725}.tier{font:500 4.4cqw/1 Cormorant Garamond,serif;border:1px solid #b69456;border-radius:999px;padding:1.2cqw 4.2cqw}.heroTop{position:absolute;left:7%;right:7%;top:3.1%;height:4.8%;display:flex;align-items:center;justify-content:space-between}.heroTitle{position:absolute;left:7%;right:7%;top:9.2%;text-align:center;font-size:12.5cqw;line-height:.95}.heroSub{position:absolute;left:9%;right:9%;top:17.5%;text-align:center;font-size:2.75cqw;line-height:1.55;letter-spacing:.18em;font-weight:700;text-transform:uppercase}.heart{position:absolute;left:20%;top:25%;width:60%;height:35%}.names{position:absolute;left:5%;right:5%;top:62.5%;text-align:center;font-size:10.8cqw;line-height:1}.facts{position:absolute;left:12%;right:12%;top:72%;height:10%;display:grid;grid-template-columns:repeat(3,1fr)}.fact{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:0 5%;font-size:2.15cqw;line-height:1.45;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.fact+.fact{border-left:1px solid #ad8748}.fact svg{width:5.2cqw;height:5.2cqw;stroke:currentColor;fill:none;stroke-width:1.45;margin-bottom:1.5cqw}.wait{position:absolute;left:10%;right:10%;top:85.3%;text-align:center;font-size:2.65cqw;letter-spacing:.2em;font-weight:700}.city{position:absolute;left:10%;right:10%;top:89%;text-align:center;font:500 3cqw Cormorant Garamond,serif;letter-spacing:.08em}
/* story + agenda */
.storyEy{position:absolute;left:8%;top:6%;}.storyTitle{position:absolute;left:8%;right:8%;top:9%;font-size:9.1cqw;line-height:1.03}.storyCopy{position:absolute;left:8%;top:21%;width:39%;font:500 4.05cqw/1.5 Cormorant Garamond,serif;color:#514537}.storyPhoto{position:absolute;right:7%;top:21%;width:40%;height:26%;overflow:hidden;border-radius:45% 55% 48% 52%/43% 46% 54% 57%}.storyPhoto img{width:100%;height:100%;object-fit:cover}.storyNote{position:absolute;right:5%;top:43%;font:400 5.5cqw/1.05 Parisienne,cursive;transform:rotate(-5deg)}.littleHeart{position:absolute;left:25%;top:43.5%;font:400 5.5cqw Cormorant Garamond,serif}.agendaEy{position:absolute;left:8%;top:55%}.agendaTitle{position:absolute;left:8%;right:8%;top:58%;font-size:9.8cqw;line-height:1}.agenda{position:absolute;left:5.5%;right:5.5%;top:69%;display:grid;grid-template-columns:repeat(4,1fr);gap:2%}.moment{text-align:center;color:#765725}.ico{width:13.2cqw;height:13.2cqw;margin:0 auto 2.2cqw;border:1px solid #c0a268;border-radius:50%;background:#f8f4ebd9;display:grid;place-items:center}.ico svg{width:50%;height:50%;stroke:currentColor;fill:none;stroke-width:1.35}.moment time{display:block;font-size:2.8cqw;font-weight:700}.moment strong{display:block;margin-top:.8cqw;font:400 5.2cqw/1 Parisienne,cursive}.moment small{display:block;margin-top:1cqw;font-size:2.1cqw;line-height:1.35;color:#675a48}
/* where + confirm + contact */
.whereEy{position:absolute;left:8%;top:5.5%}.whereTitle{position:absolute;left:8%;right:8%;top:8.5%;font-size:9.6cqw;line-height:1}.places{position:absolute;left:7%;right:7%;top:17%;height:33%;display:grid;grid-template-columns:1fr 1fr;gap:4%}.place{border:1px solid #c2a36a;background:#f7f2e8df;padding:5%;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center}.place svg{width:76%;height:31%;stroke:#98702d;fill:none;stroke-width:1.2}.place h3{margin:2cqw 0 .8cqw;font:400 6.2cqw/1 Parisienne,cursive}.place p{min-height:6.5cqw;margin:0 0 2cqw;font-size:2.05cqw;line-height:1.35;letter-spacing:.07em;text-transform:uppercase}.place button,.goldBtn{border:0;border-radius:999px;background:#aa8036;color:#fff;font-weight:700;cursor:pointer}.place button{padding:2cqw 3.8cqw;font-size:2.2cqw}.confirmEy{position:absolute;left:8%;top:55%}.confirmTitle{position:absolute;left:8%;right:8%;top:58%;font-size:10.2cqw;line-height:1}.confirmLead{position:absolute;left:12%;right:12%;top:66%;text-align:center;font:500 3.4cqw/1.35 Cormorant Garamond,serif;color:#584b3a}.confirmButton{position:absolute;left:21%;right:21%;top:72.8%;padding:3.3cqw 4cqw;font-size:3.2cqw}.contactEy{position:absolute;left:8%;top:82%}.contactTitle{position:absolute;left:8%;right:8%;top:84.3%;font-size:8.1cqw;line-height:1}.contactLine{position:absolute;left:8%;right:8%;top:90.7%;text-align:center;font:600 3cqw/1.4 Cormorant Garamond,serif;color:#584b3a}.contactButton{position:absolute;left:34%;right:34%;top:94%;padding:2.1cqw 3cqw;background:#f7f2e9;border:1px solid #aa8036;border-radius:999px;color:#805e28;font-weight:700;font-size:2.45cqw;cursor:pointer}
/* modal with real Guests RSVP */
.modal{position:fixed;z-index:100;inset:0;background:#0008;display:none;align-items:flex-end}.modal.on{display:flex}.modalPanel{width:min(100%,620px);height:min(91vh,850px);margin:auto;background:#f5f1ea;border-radius:24px 24px 0 0;overflow:hidden;box-shadow:0 -15px 50px #0004}.modalHead{height:60px;background:#fff;border-bottom:1px solid #ddd5c8;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#2c2a26;font-weight:800}.modalHead button{border:0;background:#eee8df;border-radius:50%;width:40px;height:40px;font-size:22px}.modal iframe{width:100%;height:calc(100% - 60px);border:0;background:#f5f1ea}
/* admin manager */
#admin{display:none}.admin #admin{display:block}.adminTop{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd5c8;padding:11px 14px;display:flex;gap:12px;align-items:center}.adminTop button{border:0;border-radius:15px;background:#eee8df;padding:11px 14px;font-weight:800}.adminTop b{display:block;color:#2c2a26;font-size:18px}.adminTop small{display:block;color:#726d67;margin-top:2px}.adminPage{width:min(100%,760px);margin:auto;padding:16px 12px 60px}.previewCard{background:#fff;border:1px solid #dbd1c2;border-radius:24px;padding:16px;margin-bottom:18px}.previewHead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:13px;color:#2c2a26}.previewHead h2{margin:0;font:500 30px Cormorant Garamond,serif}.previewHead p{margin:4px 0 0;color:#716c65;font-size:13px}.previewHead button{border:0;border-radius:14px;background:#2c2a26;color:#fff;padding:12px 14px;font-weight:800}.previewViewport{height:520px;border-radius:18px;overflow:hidden;background:#eee8df;border:1px solid #ddd1bf}.previewViewport iframe{width:100%;height:100%;border:0;display:block;pointer-events:none;background:#f2eee5}.editorCard{background:#fff;border:1px solid #dbd1c2;border-radius:24px;overflow:hidden}.editorCard iframe{width:100%;min-height:1350px;border:0;display:block;background:#f5f1ea}@media(max-width:520px){.site{box-shadow:none}.adminPage{padding:14px 10px 55px}.previewHead{display:block}.previewHead button{width:100%;margin-top:12px}.previewViewport{height:490px}}
</style>
</head>
<body>
<div id="public"><main class="site" id="site"></main></div>
<div id="admin">
 <header class="adminTop"><button id="back">← Volver</button><div><b>RSVP</b><small>Essential · papelería conectada</small></div></header>
 <main class="adminPage">
  <section class="previewCard"><div class="previewHead"><div><h2>Essential</h2><p>Diseño visual cerrado. El RSVP y las respuestas siguen siendo los de Guests.</p></div><button id="openPreview">Ver como invitado</button></div><div class="previewViewport"><iframe id="previewFrame" title="Vista previa Essential"></iframe></div></section>
  <section class="editorCard"><iframe id="adminFrame" title="Configuración RSVP"></iframe></section>
 </main>
</div>
<div class="modal" id="modal"><div class="modalPanel"><div class="modalHead"><span>Confirmación de asistencia</span><button id="closeModal">×</button></div><iframe id="rsvpFrame" title="Formulario RSVP"></iframe></div></div>
<script>
(()=>{
 const q=new URLSearchParams(location.search), IS_PUBLIC=q.get('guest')==='1'||q.get('preview')==='1';
 const PT='sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8';
 const RAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp';
 const PAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-personalization';
 const PAPER_B64='assets/essential-canva-bg-exact-v2.webp.base64?v=paper5';
 const PKEY='weddly_personalization_v2';
 let paperData='', S={p1:'Daniela',p2:'Sergio',date:'2027-09-12',place:'Murcia',photo:''}, cfg={title:'Daniela & Sergio',date:'12 septiembre 2027',time:'18:00',venue:'Finca La Alquería, Murcia',intro:'Nos encantará celebrar este día contigo.'};
 try{S={...S,...(JSON.parse(localStorage.getItem(PKEY)||'null')||{})}}catch{}
 const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
 function couple(){let t=String(cfg.title||'').trim();if(t&&/[&y]/i.test(t)){let a=t.split(/\s*&\s*|\s+y\s+/i);if(a.length>1)return[a[0],a.slice(1).join(' y ')];}return[S.p1||'Daniela',S.p2||'Sergio']}
 function dateParts(){let raw=S.date||cfg.date||'2027-09-12',dt;if(/^\d{4}-\d{2}-\d{2}$/.test(raw))dt=new Date(raw+'T12:00:00');else dt=new Date('2027-09-12T12:00:00');return{day:String(dt.getDate()).padStart(2,'0'),month:dt.toLocaleDateString('es-ES',{month:'long'}).toUpperCase(),year:String(dt.getFullYear())}}
 function photo(){return S.photo||'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=1000&q=88'}
 function paper(){return `<img class="paper" src="${paperData}" alt="">`}
 function icon(type){if(type==='cal')return'<svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="14"/><path d="M8 3v6M16 3v6M4 10h16"/></svg>';if(type==='clock')return'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>';return'<svg viewBox="0 0 24 24"><path d="M12 21s6-6 6-11a6 6 0 1 0-12 0c0 5 6 11 6 11Z"/><circle cx="12" cy="10" r="2"/></svg>'}
 function mini(i){if(i===0)return'<svg viewBox="0 0 32 32"><circle cx="12" cy="18" r="7"/><circle cx="20" cy="18" r="7"/></svg>';if(i===1)return'<svg viewBox="0 0 32 32"><path d="M8 5h7l-1 9a3 3 0 0 1-5 0L8 5Zm9 0h7l-1 9a3 3 0 0 1-5 0l-1-9Z"/></svg>';if(i===2)return'<svg viewBox="0 0 32 32"><path d="M7 25h18M9 24a7 7 0 0 1 14 0"/></svg>';return'<svg viewBox="0 0 32 32"><path d="M8 23V11l9-4v13"/><circle cx="6" cy="24" r="3"/><circle cx="15" cy="21" r="3"/></svg>'}
 function heart(){return `<svg class="heart" viewBox="0 0 100 90"><defs><clipPath id="heartClip"><path d="M50 88C44 81 7 60 7 30C7 13 19 4 33 4C42 4 48 9 50 14C52 9 58 4 67 4C81 4 93 13 93 30C93 60 56 81 50 88Z"/></clipPath></defs><image href="${esc(photo())}" width="100" height="90" preserveAspectRatio="xMidYMid slice" clip-path="url(#heartClip)"/></svg>`}
 function hero(){let c=couple(),d=dateParts();return `<section class="sheet">${paper()}<div class="ink"><div class="heroTop"><div class="brand">Weddly Smart Design · Guests</div><div class="tier">Essential</div></div><div class="script heroTitle">¡Nos casamos!</div><div class="heroSub">Y NOS GUSTARÍA INVITARTE A NUESTRA BODA<br>¿TE APUNTAS?</div>${heart()}<div class="script names">${esc(c[0])} y ${esc(c[1])}</div><div class="facts"><div class="fact">${icon('cal')}<span>${d.day} ${d.month}<br>${d.year}</span></div><div class="fact">${icon('clock')}<span>${esc(cfg.time||'18:00')} H</span></div><div class="fact">${icon('pin')}<span>${esc(cfg.venue||'Finca La Alquería')}</span></div></div><div class="wait">¡TE ESPERAMOS!</div><div class="city">${esc(S.place||'Murcia')}</div></div></section>`}
 function story(){let a=[['18:00','Ceremonia',cfg.venue||'Finca La Alquería'],['19:00','Cóctel','Jardín norte'],['21:00','Cena','Salón principal'],['00:00','Fiesta','Hasta que el cuerpo aguante']];return `<section class="sheet">${paper()}<div class="ink"><div class="ey storyEy">NUESTRA HISTORIA</div><div class="script storyTitle">Nos encantará celebrarlo contigo.</div><div class="storyCopy">Hemos preparado este espacio para que tengas toda la información del día, sin perder el carácter de una invitación diseñada para nosotros.</div><div class="storyPhoto"><img src="${esc(photo())}" alt=""></div><div class="storyNote">Juntos<br>es mejor ♡</div><div class="littleHeart">♡</div><div class="ey agendaEy">AGENDA</div><div class="script agendaTitle">Así será el día.</div><div class="agenda">${a.map((x,i)=>`<div class="moment"><div class="ico">${mini(i)}</div><time>${esc(x[0])}</time><strong>${esc(x[1])}</strong><small>${esc(x[2])}</small></div>`).join('')}</div></div></section>`}
 function where(){return `<section class="sheet">${paper()}<div class="ink"><div class="ey whereEy">DÓNDE</div><div class="script whereTitle">Te esperamos aquí</div><div class="places"><div class="place"><svg viewBox="0 0 120 70"><path d="M12 58h96M24 58V28l25-14 24 14v30M48 58V39h17v19M80 58V25h17v33"/></svg><h3>Ceremonia</h3><p>${esc(cfg.time||'18:00')} · ${esc(cfg.venue||'Finca La Alquería')}</p><button data-loc="ceremony">⌖ Ver ubicación</button></div><div class="place"><svg viewBox="0 0 120 70"><path d="M12 58h96M20 58c6-13 17-20 29-22 13-3 25 1 35 8 8-7 15-10 25-11"/></svg><h3>Celebración</h3><p>19:00 · Jardín norte</p><button data-loc="party">⌖ Ver ubicación</button></div></div><div class="ey confirmEy">CONFIRMACIÓN</div><div class="script confirmTitle">¿Te apuntas?</div><div class="confirmLead">Nos hará mucha ilusión que formes parte de este día tan especial. Tu respuesta se guardará directamente en Guests.</div><button class="goldBtn confirmButton" id="confirmBtn">Confirmar asistencia</button><div class="ey contactEy">CONTACTO</div><div class="script contactTitle">Si tienes dudas</div><div class="contactLine">Ana · 600 123 123</div><button class="contactButton" id="contactBtn">Escríbenos</button></div></section>`}
 async function loadPaper(){try{let r=await fetch(PAPER_B64,{cache:'no-store'});let b=(await r.text()).replace(/\s+/g,'');if(b.length<5000)throw 0;paperData='data:image/webp;base64,'+b}catch{paperData='assets/essential-canva-bg-original.jpg?v=paper5'}}
 async function loadData(){let t=q.get('t')||PT;try{let r=await fetch(PAPI+'?token='+encodeURIComponent(t),{cache:'no-store'}),x=await r.json();if(r.ok&&x?.personalization)S={...S,...x.personalization}}catch{}try{let r=await fetch(RAPI+'?token='+encodeURIComponent(t),{cache:'no-store'}),x=await r.json();if(r.ok&&x?.form?.config)cfg={...cfg,...x.form.config}}catch{}}
 function publicUrl(id=''){let u=new URL('guests-rsvp-essential-paper-v1.html',location.href);u.searchParams.set('guest','1');u.searchParams.set('t',q.get('t')||PT);if(id)u.searchParams.set('g',id);u.searchParams.set('v','paper5');return u.toString()}
 function openRSVP(){let t=q.get('t')||PT,g=q.get('g')||'';let u='guests-rsvp-v105-mobile.html?guest=1&t='+encodeURIComponent(t)+(g?'&g='+encodeURIComponent(g):'')+'&embed=1&v=paper5-'+Date.now();document.getElementById('rsvpFrame').src=u;document.getElementById('modal').classList.add('on');document.body.style.overflow='hidden'}
 function closeRSVP(){document.getElementById('modal').classList.remove('on');document.body.style.overflow='';setTimeout(()=>document.getElementById('rsvpFrame').src='about:blank',180)}
 function patchPublicForm(){let f=document.getElementById('rsvpFrame');try{let d=f.contentDocument;if(!d||f.src==='about:blank')return;let s=d.getElementById('paperEmbed')||d.head.appendChild(Object.assign(d.createElement('style'),{id:'paperEmbed'}));s.textContent='.back,.brand,.hero,#admin{display:none!important}html,body,.wrap{background:#f5f1ea!important}.wrap{max-width:none!important;padding:14px 16px 70px!important}#public{display:block!important}.card{box-shadow:none!important}';}catch{}}
 async function renderPublic(){document.body.className='public';await Promise.all([loadPaper(),loadData()]);document.getElementById('site').innerHTML=hero()+story()+where();document.getElementById('confirmBtn').onclick=openRSVP;document.getElementById('contactBtn').onclick=()=>location.href='tel:600123123';document.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{let s=b.dataset.loc==='ceremony'?(cfg.venue||'Finca La Alquería'):'Jardín norte';window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s+' Murcia'),'_blank','noopener')})}
 function patchAdmin(){let f=document.getElementById('adminFrame');try{let d=f.contentDocument;if(!d)return;d.querySelector('.back')?.classList.add('hide');d.querySelector('.brand')?.classList.add('hide');let h=d.querySelector('h1');if(h)h.style.display='none';let w=d.querySelector('.wrap');if(w){w.style.maxWidth='none';w.style.padding='16px 16px 70px'}let p=d.getElementById('preview');if(p&&!p.dataset.paper5){p.dataset.paper5='1';p.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();window.open(publicUrl(),'_blank','noopener')},true)}let ro=new ResizeObserver(()=>{try{f.style.height=Math.max(1350,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch{}});ro.observe(d.body);f.style.height=Math.max(1350,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch{}}
 async function renderAdmin(){document.body.className='admin';await loadPaper();let pf=document.getElementById('previewFrame'),af=document.getElementById('adminFrame');pf.src=publicUrl()+'&preview=1';af.src='guests-rsvp-v105-mobile.html?v=paper5';document.getElementById('openPreview').onclick=()=>window.open(publicUrl(),'_blank','noopener');document.getElementById('back').onclick=()=>history.length>1?history.back():location.href='guests-personalized-functional-v5.html#invitados';af.addEventListener('load',()=>{patchAdmin();setTimeout(patchAdmin,200);setTimeout(patchAdmin,700)})}
 document.getElementById('closeModal').onclick=closeRSVP;document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeRSVP()};document.getElementById('rsvpFrame').addEventListener('load',()=>{patchPublicForm();setTimeout(patchPublicForm,180)});
 IS_PUBLIC?renderPublic():renderAdmin();
})();
</script>
</body>
</html>
