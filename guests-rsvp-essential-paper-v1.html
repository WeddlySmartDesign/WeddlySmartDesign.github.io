<body>
<div id="bar"><button class="back" id="back">← Volver</button><div class="barcopy"><b>RSVP</b><small>Essential · papelería</small></div></div>
<button id="previewReturn">← Volver a edición</button>
<iframe id="frame" class="frame" title="RSVP"></iframe>
<script>
(()=>{
const PKEY='weddly_personalization_v2',TOKEN_KEY='weddly_shared_wedding_token';
const PAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-personalization';
const RAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp';
const q=new URLSearchParams(location.search),PUBLIC=q.get('guest')==='1'||q.has('t'),PREVIEW=q.get('preview')==='1';
const bar=document.getElementById('bar'),frame=document.getElementById('frame'),previewReturn=document.getElementById('previewReturn');
if(PUBLIC){bar.classList.add('hidden');frame.classList.add('full')}if(PREVIEW)previewReturn.classList.add('on');
let S={p1:'Alba',p2:'Leo',date:'2027-09-12',place:'Murcia',photo:'',invitePhoto:'',storyPhoto:''};
try{S={...S,...(JSON.parse(localStorage.getItem(PKEY)||'null')||{})}}catch{}
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function day(){return S.date&&/^\d{4}-\d{2}-\d{2}/.test(S.date)?S.date.slice(8,10):'12'}
function month(){if(!S.date)return'SEPTIEMBRE';return new Date(S.date+'T12:00:00').toLocaleDateString('es-ES',{month:'long'}).toUpperCase()}
function year(){return S.date&&/^\d{4}/.test(S.date)?S.date.slice(0,4):'2027'}
function fmtDate(){if(!S.date)return'12 septiembre 2027';const d=new Date(S.date+'T12:00:00');return Number.isNaN(d.getTime())?S.date:d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}
function heroPhoto(){return S.invitePhoto||'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=1200&q=86'}
function secondPhoto(){return S.storyPhoto||S.invitePhoto||'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1200&q=84'}
async function loadRemote(){const token=q.get('t')||'';if(!token)return;try{const r=await fetch(PAPI+'?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(r.ok&&x.ok&&x.personalization){S={...S,...x.personalization};try{localStorage.setItem(PKEY,JSON.stringify(S))}catch{}}}catch{}}
function eventData(d){const hero=d.querySelector('#public .hero'),cells=hero?[...hero.querySelectorAll('.where>div')]:[];return{hero,time:cells[0]?.textContent?.replace(/^Hora/i,'').trim()||d.getElementById('time')?.value||'18:00',venue:cells[1]?.textContent?.replace(/^Lugar/i,'').trim()||d.getElementById('venue')?.value||'Finca Los Olivos',intro:hero?.querySelector('p')?.textContent?.trim()||d.getElementById('intro')?.value||'Nos encantará celebrar este día contigo.'}}
function icon(type){const common='viewBox="0 0 32 32" aria-hidden="true"';if(type==='rings')return `<svg ${common}><circle cx="12" cy="17" r="7"/><circle cx="20" cy="15" r="7"/><path d="M9 8l3-4 3 4M17 6l3-4 3 4"/></svg>`;if(type==='glasses')return `<svg ${common}><path d="M7 5l4 8v11M25 5l-4 8v11M6 25h10M16 25h10M5 5h7l-1 8H7zM20 5h7l-2 8h-4z"/></svg>`;if(type==='cloche')return `<svg ${common}><path d="M5 22h22M8 20a8 8 0 0 1 16 0M16 10V7M13 7h6"/></svg>`;if(type==='music')return `<svg ${common}><path d="M13 8v14a4 4 0 1 1-2-3.46V11l13-3v11a4 4 0 1 1-2-3.46V5z"/></svg>`;if(type==='cal')return `<svg ${common}><rect x="6" y="8" width="20" height="18" rx="1"/><path d="M10 4v7M22 4v7M6 13h20"/></svg>`;if(type==='clock')return `<svg ${common}><circle cx="16" cy="16" r="11"/><path d="M16 9v7l5 3"/></svg>`;return `<svg ${common}><path d="M16 29s9-9.3 9-17a9 9 0 1 0-18 0c0 7.7 9 17 9 17Z"/><circle cx="16" cy="12" r="3"/></svg>`}
function venueSketch(type){if(type==='church')return `<svg viewBox="0 0 260 130" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M35 110h190M78 110V58l52-31 52 31v52M104 110V72h52v38M121 110V84h18v26M130 27V12M124 18h12M63 110V78h15M182 110V78h15M91 66h78M48 110c7-20 14-29 22-36M208 110c-5-19-12-29-22-37M25 110c14-8 21-21 23-39M235 110c-14-7-21-20-24-38"/></g></svg>`;return `<svg viewBox="0 0 260 130" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M30 111h202M62 111V73h136v38M78 73V48h104v25M92 48l38-22 38 22M111 111V82h38v29M45 111V60M38 60h14M45 60c-8-10-8-19 0-28 8 9 8 18 0 28M215 111V52M208 52h14M215 52c-8-10-8-19 0-28 8 9 8 18 0 28M82 63h96M96 58h68"/></g></svg>`}
function cover(ev){return `<section class="cover section"><header class="inviteHeader"><span>WEDDLY SMART DESIGN · GUESTS</span><span class="tier">Essential</span><span class="menu">☰</span></header><div class="coverTop"><div class="scriptTop">¡Nos casamos!</div><div class="caps">Y NOS GUSTARÍA INVITARTE A NUESTRA BODA<br>¿TE APUNTAS?</div></div><div class="heart"><img src="${esc(heroPhoto())}" alt="Foto de la pareja"></div><div class="names">${esc(S.p1)} y ${esc(S.p2)}</div><div class="facts"><div>${icon('cal')}<b>${day()} ${month()}<br>${year()}</b></div><div>${icon('clock')}<b>${esc(ev.time)} H</b></div><div>${icon('pin')}<b>${esc(ev.venue)}</b></div></div><div class="wait">¡TE ESPERAMOS!</div><div class="city">${esc(S.place||'Murcia')}</div></section>`}
function fullMarkup(ev){return `<div id="wsdApprovedEssential">${cover(ev)}<section class="story section"><div class="ey">NUESTRA HISTORIA</div><h2>Nos encantará celebrarlo contigo.</h2><div class="storyGrid"><div class="storyCopy"><p>Hemos preparado este espacio para que tengas toda la información del día, sin perder el carácter de una invitación diseñada para nosotros.</p><div class="heartRule"><span></span>♡<span></span></div></div><div class="storyImage"><img src="${esc(secondPhoto())}" alt=""><em>Juntos<br>es mejor ♡</em></div></div></section><section class="agendaSection section"><div class="ey">AGENDA</div><h2>Así será el día.</h2><div class="agendaLine"><article><div class="roundIcon">${icon('rings')}</div><b>${esc(ev.time)}</b><strong>Ceremonia</strong><small>${esc(ev.venue)}</small></article><i>♡</i><article><div class="roundIcon">${icon('glasses')}</div><b>19:00</b><strong>Cóctel</strong><small>Jardín norte</small></article><i>♡</i><article><div class="roundIcon">${icon('cloche')}</div><b>21:00</b><strong>Cena</strong><small>Salón principal</small></article><i>♡</i><article><div class="roundIcon">${icon('music')}</div><b>00:00</b><strong>Fiesta</strong><small>Hasta que el cuerpo aguante</small></article></div></section><section class="whereSection section"><div class="ey">DÓNDE</div><h2>Te esperamos aquí</h2><div class="placeCards"><article><div class="venueSketch">${venueSketch('church')}</div><h3>Ceremonia</h3><p>${esc(ev.time)} · ${esc(ev.venue)}</p><button type="button">⌖ Ver ubicación</button></article><article><div class="venueSketch">${venueSketch('venue')}</div><h3>Celebración</h3><p>19:00 · Jardín Norte</p><button type="button">⌖ Ver ubicación</button></article></div></section><section class="confirmSection section"><div class="ey">CONFIRMACIÓN</div><h2>¿Te apuntas?</h2><p class="lead">Nos hará mucha ilusión que formes parte de este día tan especial.</p><div id="wsdFormSlot"></div></section><section class="contactSection section"><div class="ey">CONTACTO</div><h2>Si tienes dudas</h2><p>Puedes escribirnos o llamarnos. ¡Estaremos encantados de ayudarte!</p><div class="contactLine">☎ Ana · 600 123 123</div><button type="button" class="writeBtn">↗ Escríbenos</button><div class="finalNames">${esc(S.p1)} y ${esc(S.p2)}</div><div class="finalMeta">${esc(fmtDate())} · ${esc(S.place||'Murcia')}</div><div class="thanks">GRACIAS POR SER PARTE DE NUESTRA HISTORIA</div></section></div>`}
function css(){return `
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap');
html,body{background:#e8e1d6!important;color:#7c5b24!important}body{margin:0!important}.wrap{max-width:540px!important;padding:0!important;background:#f4efe6!important;box-shadow:0 18px 60px #5e4b3024}.publicOriginalHero,#public>.brand,#public>.hero{display:none!important}#public{padding:0!important}#wsdApprovedEssential{background:#f2ede4;color:#7c5b24}.section{position:relative;overflow:hidden;background:#f3eee5 url('assets/essential-canva-bg-user.jpg') center/100% 100% no-repeat;border-bottom:1px solid #fff9}.section:after{content:'';position:absolute;inset:auto -18% -12% -16%;height:32%;background:#e8e0d2;opacity:.26;transform:rotate(-8deg);border-radius:45%;z-index:0;pointer-events:none}.section>*{position:relative;z-index:2}.inviteHeader{height:52px;display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:0 22px;background:#fffaf2dd;border-bottom:1px solid #d7c8aa;font:700 8px 'DM Sans',sans-serif;letter-spacing:.16em;color:#5a4a31}.tier{font:500 11px 'Cormorant Garamond',serif;border:1px solid #bda57b;border-radius:999px;padding:4px 14px;letter-spacing:0}.menu{font-size:15px;letter-spacing:0}.cover{aspect-ratio:1090/1536;text-align:center}.coverTop{position:absolute;top:8.4%;left:7%;right:7%}.scriptTop,.names,.section h2,.placeCards h3,.finalNames{font-family:'Parisienne',cursive;font-weight:400}.scriptTop{font-size:clamp(39px,10vw,58px);line-height:1}.caps{margin-top:7px;font:700 clamp(7px,2vw,11px)/1.5 'DM Sans',sans-serif;letter-spacing:.20em}.heart{position:absolute;left:18%;top:19%;width:64%;height:42%;clip-path:polygon(50% 8%,57% 3%,66% 0,76% 2%,86% 8%,93% 18%,97% 31%,96% 43%,92% 55%,86% 66%,79% 75%,70% 84%,60% 92%,50% 100%,40% 92%,30% 84%,21% 75%,14% 66%,8% 55%,4% 43%,3% 31%,7% 18%,14% 8%,24% 2%,34% 0,43% 3%);overflow:hidden}.heart img,.storyImage img{width:100%;height:100%;object-fit:cover}.names{position:absolute;top:63.7%;left:6%;right:6%;font-size:clamp(43px,10vw,62px);line-height:1}.facts{position:absolute;left:13%;right:13%;top:73%;display:grid;grid-template-columns:repeat(3,1fr)}.facts>div{min-height:78px;padding:3px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center}.facts>div+div{border-left:1px solid #a17d3c}.facts svg,.roundIcon svg{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.facts svg{width:21px;height:21px;margin-bottom:7px}.facts b{font:600 clamp(7px,1.9vw,10px)/1.42 'DM Sans',sans-serif;letter-spacing:.15em;text-transform:uppercase}.wait{position:absolute;left:8%;right:8%;bottom:9.2%;font:700 clamp(8px,2vw,11px) 'DM Sans',sans-serif;letter-spacing:.20em}.city{position:absolute;left:8%;right:8%;bottom:6.5%;font:500 clamp(8px,1.8vw,10px) 'DM Sans',sans-serif;letter-spacing:.12em}.story{padding:28px 38px 42px;min-height:390px}.ey{text-align:center;font:700 8px 'DM Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase}.section h2{text-align:center;font-size:clamp(36px,8vw,48px);line-height:1;margin:8px 0 24px}.storyGrid{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;align-items:center}.storyCopy p{font:500 14px/1.45 'Cormorant Garamond',serif;color:#5c5247;margin:0}.heartRule{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:23px;font-size:17px}.heartRule span{width:44px;border-top:1px solid #b89b65}.storyImage{position:relative;height:185px;border-radius:48% 52% 42% 58%/55% 42% 58% 45%;overflow:hidden}.storyImage em{position:absolute;right:7px;bottom:8px;background:#f6efe4dd;padding:5px 7px;font:400 17px/1.05 'Parisienne',cursive}.agendaSection{padding:28px 18px 36px;min-height:350px}.agendaLine{display:grid;grid-template-columns:1fr 18px 1fr 18px 1fr 18px 1fr;align-items:start;gap:2px;position:relative}.agendaLine:before{content:'';position:absolute;left:8%;right:8%;top:31px;border-top:1px solid #bca16e;z-index:0}.agendaLine article{text-align:center;position:relative;z-index:2}.agendaLine>i{font-style:normal;text-align:center;margin-top:23px;background:#f3eee5;padding:0 2px;z-index:2}.roundIcon{width:58px;height:58px;border:1px solid #c9b78e;border-radius:50%;background:#f8f3ea;display:grid;place-items:center;margin:0 auto 9px}.roundIcon svg{width:30px;height:30px}.agendaLine b,.agendaLine strong,.agendaLine small{display:block}.agendaLine b{font:700 10px 'DM Sans',sans-serif}.agendaLine strong{font:500 20px/1 'Cormorant Garamond',serif;font-style:italic;margin:3px 0}.agendaLine small{font:600 8px/1.3 'DM Sans',sans-serif;letter-spacing:.04em;color:#7a6f61}.whereSection{padding:30px 34px 38px;min-height:420px}.placeCards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.placeCards article{border:1px solid #c6ad7a;background:#faf6edc7;padding:14px 12px 16px;text-align:center;clip-path:polygon(0 7%,7% 0,93% 0,100% 7%,100% 93%,93% 100%,7% 100%,0 93%)}.venueSketch{height:86px;color:#92723a}.venueSketch svg{width:100%;height:100%}.placeCards h3{font-size:30px;margin:0 0 4px}.placeCards p{font:600 8px 'DM Sans',sans-serif;letter-spacing:.08em;margin:0 0 10px}.placeCards button,.writeBtn{border:0;border-radius:999px;background:#a67b34;color:#fff;padding:9px 14px;font-weight:700;font-size:11px}.confirmSection{padding:26px 32px 38px;min-height:430px}.confirmSection h2{margin-bottom:8px}.lead{text-align:center;margin:0 auto 16px;max-width:390px;font:500 13px 'Cormorant Garamond',serif;color:#62584b}.confirmSection #wsdFormSlot>.card{background:#fbf7efb8!important;border:1px solid #d4c29e!important;border-radius:11px!important;box-shadow:none!important;padding:16px!important;color:#514634!important;margin:0!important}.confirmSection .field,.confirmSection .answer{background:#fffaf2d9!important;border-color:#d8c7a4!important;border-radius:7px!important;color:#40382f!important;font-size:13px!important;padding:10px!important}.confirmSection .answer.sel{outline:2px solid #9e7a39!important}.confirmSection .btn{background:#a47b34!important;color:#fff!important;border-radius:999px!important;font-size:13px!important;padding:11px 1 `}
function token(d){try{return [...d.scripts].map(s=>s.textContent||'').join('\n').match(/PT='([^']+)'/)?.[1]||q.get('t')||''}catch{return q.get('t')||''}}
function designedLink(d,id='',preview=false){return location.origin+'/guests-rsvp-essential-paper-v1.html?guest=1&t='+encodeURIComponent(token(d))+(id?'&g='+encodeURIComponent(id):'')+(preview?'&preview=1':'')+'&v=approved-2'}
function openPreview(d){const save=d.getElementById('saveConfig');try{save?.click()}catch{}setTimeout(()=>location.href=designedLink(d,'',true),950)}
function patchAdminActions(d){if(d.documentElement.dataset.wsdApprovedActions)return;d.documentElement.dataset.wsdApprovedActions='1';d.addEventListener('click',e=>{const preview=e.target.closest?.('#preview,#wsdPreview');if(preview){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();openPreview(d);return}const copy=e.target.closest?.('[data-copy]'),wa=e.target.closest?.('[data-wa]');if(!copy&&!wa)return;const id=copy?copy.dataset.copy:wa.dataset.wa,link=designedLink(d,id,false);e.preventDefault();e.stopImmediatePropagation();if(copy){navigator.clipboard?.writeText(link);return}const row=wa.closest('.recipient'),name=row?.querySelector('.rhead b')?.textContent?.trim()||'',raw=row?.querySelector('.contactline')?.textContent?.trim()||'',phone=raw.replace(/\D/g,'');const text=`Hola ${name}, te enviamos nuestro RSVP. Puedes responder aquí: ${link}`;try{fetch(RAPI,{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-weddly-token':localStorage.getItem(TOKEN_KEY)||''},body:JSON.stringify({action:'delivery',token:token(d),guest_key:id,status:'sent'})})}catch{}if(phone)location.href=`https://wa.me/${phone}?text=${encodeURIComponent(text)}`},true)}
function decorateAdmin(d){const admin=d.getElementById('admin');if(!admin||getComputedStyle(admin).display==='none')return;let x=d.getElementById('wsdAdminApproved');if(!x){x=d.createElement('section');x.id='wsdAdminApproved';x.className='adminApproved';admin.querySelector('.tabs')?.before(x)}x.innerHTML=`<div class="tag">DISEÑO ESSENTIAL ACTIVO</div><div class="title">Papelería romántica</div><div class="copy">El diseño visual es independiente del RSVP. Formulario, preguntas, envíos y respuestas siguen siendo los de Guests.</div><button id="wsdPreview" type="button">Ver invitación</button>`;patchAdminActions(d)}
function decoratePublic(d){const pub=d.getElementById('public');if(!pub||getComputedStyle(pub).display==='none')return false;if(pub.querySelector('.success')){pub.querySelector('.success').style.cssText='min-height:100vh;display:grid;place-items:center;text-align:center;background:#f3eee5;color:#7c5b24;padding:40px';return true}const ev=eventData(d);if(ev.hero)ev.hero.classList.add('publicOriginalHero');const card=[...pub.children].find(n=>n.classList?.contains('card'));if(!card)return false;let root=d.getElementById('wsdApprovedEssential');if(!root){const box=d.createElement('div');box.innerHTML=fullMarkup(ev);root=box.firstElementChild;pub.insertBefore(root,pub.firstChild)}const slot=d.getElementById('wsdFormSlot');if(slot&&card.parentNode!==slot)slot.appendChild(card);return true}
function install(){try{const d=frame.contentDocument;if(!d)return;let st=d.getElementById('wsd-approved-essential-style');if(!st){st=d.createElement('style');st.id='wsd-approved-essential-style';d.head.appendChild(st)}st.textContent=css();patchAdminActions(d);decorateAdmin(d);if(PUBLIC)decoratePublic(d)}catch(e){console.warn('WSD Essential approved',e)}}
function poll(){let n=0;const t=setInterval(()=>{install();if(++n>25)clearInterval(t)},180)}
document.getElementById('back').onclick=()=>history.length>1?history.back():location.href='guests-personalized-functional-v5.html?v=approved-2';
previewReturn.onclick=()=>location.href='guests-rsvp-essential-paper-v1.html?v=approved-2';
frame.addEventListener('load',()=>{install();poll()});
(async()=>{if(PUBLIC)await loadRemote();frame.src='guests-rsvp-v105-mobile.html'+location.search+(location.search?'&':'?')+'core=approved-essential-2'})();
})();
</script>
