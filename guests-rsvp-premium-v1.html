alic;font-size:clamp(68px,15vw,104px);line-height:.84}.wsdPremiumWrap[data-design='botanica'] .wsdPremiumHero{border-radius:110px 18px 110px 18px}.wsdPremiumWrap[data-design='botanica'] .wsdPhoto{width:72%;height:330px;margin:-70px auto 32px;border-radius:180px 180px 18px 18px;padding:11px}.wsdPremiumWrap[data-design='botanica'] .wsdPhoto img{border-radius:170px 170px 10px 10px}.wsdPremiumWrap[data-design='blacktie']{--pi-bg:#0d1113;--pi-ink:#f4ead8;--pi-section:#11171a;--pi-section-ink:#f4ead8;--pi-accent:#d0ad72;--pi-muted:#baa98e;--pi-rule:#5a4b35;--pi-display:'Prata',serif;--pi-body:'DM Sans',sans-serif;--pi-pad:64px 34px 44px;--pi-name-margin:auto 0 24px}.wsdPremiumWrap[data-design='blacktie'] .wsdPremiumHero{border-radius:0}.wsdPremiumWrap[data-design='blacktie'] .wsdPremiumInner{text-align:center;align-items:center}.wsdPremiumWrap[data-design='blacktie'] .wsdEyebrow,.wsdPremiumWrap[data-design='blacktie'] .wsdMeta{color:#d9bd89}.wsdPremiumWrap[data-design='blacktie'] .wsdNames{font-size:clamp(55px,12vw,86px);line-height:1}.wsdPremiumWrap[data-design='blacktie'] .wsdPhoto{width:88%;height:300px;margin:-15px auto 0;padding:8px;background:#d8c6a6}.wsdPremiumWrap[data-design='blacktie'] .wsdPhoto img{filter:grayscale(1) contrast(1.06)}.wsdPremiumWrap[data-design='blacktie'] .wsdEvent{background:#0d1113}.wsdPremiumWrap[data-design='mediterranea']{--pi-bg:#f3eadc;--pi-ink:#16465a;--pi-section:#fffaf2;--pi-section-ink:#16465a;--pi-accent:#b55f43;--pi-muted:#6f7c7e;--pi-rule:#dccab5;--pi-display:'Bodoni Moda',serif;--pi-body:'DM Sans',sans-serif;--pi-pad:54px 90px 42px 34px;--pi-name-margin:120px 0 20px}.wsdPremiumWrap[data-design='mediterranea'] .wsdPremiumHero{border-radius:0;background:linear-gradient(90deg,#f3eadc 0 76%,#174f69 76%)}.wsdPremiumWrap[data-design='mediterranea'] .wsdNames{font-size:clamp(64px,14vw,98px);color:#16465a}.wsdPremiumWrap[data-design='mediterranea'] .wsdPhoto{width:55%;height:260px;margin:-100px 30px 34px auto;border:8px solid #fff6e8}.wsdPremiumWrap[data-design='mediterranea'] .wsdPhoto img{border-radius:0}.wsdPremiumWrap[data-design='romance']{--pi-bg:linear-gradient(180deg,#fffafd,#ecdce4);--pi-ink:#6d4655;--pi-section:#fffafd;--pi-section-ink:#5e414c;--pi-accent:#a57588;--pi-muted:#88747d;--pi-rule:#ead4de;--pi-display:'Cormorant Garamond',serif;--pi-body:'DM Sans',sans-serif;--pi-pad:58px 32px 46px;--pi-name-margin:auto 0 20px}.wsdPremiumWrap[data-design='romance'] .wsdPremiumHero{border-radius:34px}.wsdPremiumWrap[data-design='romance'] .wsdPremiumInner{text-align:center;align-items:center}.wsdPremiumWrap[data-design='romance'] .wsdNames{font-style:italic;font-size:clamp(68px,15vw,100px);line-height:.86}.wsdPremiumWrap[data-design='romance'] .wsdPhoto{width:66%;height:310px;margin:-80px auto 34px;border-radius:50% 50% 22px 22px;padding:10px}.wsdPremiumWrap[data-design='romance'] .wsdPhoto img{border-radius:50% 50% 15px 15px}.wsdPremiumWrap[data-design='romance'] .wsdDays{border-radius:4px}.wsdPremiumWrap~.wsdConfirmHead+ .card,.wsdPremiumWrap~.card{box-shadow:none!important}.wsdPublicMode .wrap{max-width:760px!important;padding-top:0!important}.wsdPublicMode #public>.brand{display:none!important}.wsdPublicMode #public>.card{border-radius:18px!important;box-shadow:none!important;padding:22px!important}.wsdPublicMode #public>.card .answer{border-radius:12px!important}.wsdPublicMode #public>.card .btn{border-radius:12px!important}.wsdPublicMode .success h1{font-family:var(--pi-display)!important}.wsdPublicMode .back{display:none!important}@media(max-width:560px){.wsdDesignGrid{grid-template-columns:1fr 1fr}.wsdPremiumHero,.wsdPremiumInner{min-height:470px}.wsdPremiumWrap[data-design='atelier']{--pi-pad:42px 28px 38px}.wsdPremiumWrap[data-design='atelier'] .wsdPremiumInner{max-width:88%}.wsdPremiumWrap[data-design='atelier'] .wsdPhoto{width:58%;height:205px;margin:-85px 22px 28px auto}.wsdPremiumWrap[data-design='botanica']{--pi-pad:42px 26px 38px;--pi-name-margin:95px 0 18px}.wsdPremiumWrap[data- function getDoc(){try{return core.contentDocument}catch{return null}}
function installStyle(d){let st=d.getElementById('wsd-premium-v2-style');if(!st){st=d.createElement('style');st.id='wsd-premium-v2-style';d.head.appendChild(st)}st.textContent=styleText()}
function pickerHTML(){return `<section id="wsdRsvpDesignPicker"><div class="wsdPickerHead"><div><b>Diseño de la invitación</b><small>Independiente del color de vuestra app. Elegid el estilo que recibirán los invitados.</small></div></div><div class="wsdDesignGrid">${Object.entries(designs).map(([id,x])=>`<button class="wsdDesign ${design===id?'on':''}" data-rsvp-design="${id}"><div class="wsdThumb ${id}"></div><b>${x.label}</b><span>${x.sub}</span></button>`).join('')}</div></section>`}
function installPicker(d){if(PUBLIC)return;const pane=d.getElementById('paneForm');if(!pane)return;let p=d.getElementById('wsdRsvpDesignPicker');if(!p){const tmp=d.createElement('div');tmp.innerHTML=pickerHTML();p=tmp.firstElementChild;const hero=pane.querySelector('.hero');if(hero)hero.after(p);else pane.prepend(p)}p.querySelectorAll('[data-rsvp-design]').forEach(b=>{b.classList.toggle('on',b.dataset.rsvpDesign===design);b.onclick=()=>{design=b.dataset.rsvpDesign;localStorage.setItem(DESIGN_KEY,design);p.querySelectorAll('[data-rsvp-design]').forEach(x=>x.classList.toggle('on',x===b))}})}
function eventData(d){const pub=d.getElementById('public');const hero=pub?.querySelector('.hero');let intro='Nos encantará celebrar este día contigo.',time='18:00',venue=person.place||'Lugar de celebración';if(hero){intro=hero.querySelector('p')?.textContent?.trim()||intro;const cells=[...hero.querySelectorAll('.where>div')];if(cells[0])time=cells[0].textContent.replace(/^Hora/i,'').trim()||time;if(cells[1])venue=cells[1].textContent.replace(/^Lugar/i,'').trim()||venue}return{intro,time,venue,hero}}
function decoFor(id){if(id==='botanica')return `<svg class="wsdBotanical" viewBox="0 0 180 250" aria-hidden="true"><path d="M155 8C132 51 135 103 115 143C97 180 62 205 24 239M139 47c-24 6-39 20-50 41M132 78c20 4 33 17 39 38M111 132c-28 0-47 12-61 34M87 177c17 5 28 15 36 31"/></svg>`;if(id==='blacktie')return `<div class="wsdArch"></div>`;if(id==='mediterranea')return `<div class="wsdSun"></div><div class="wsdSideDate">${esc(fmtDate())}</div>`;if(id==='romance')return `<div class="wsdRibbon"></div>`;return `<div class="wsdDoubleFrame"></div><div class="wsdSideDate">${esc(fmtDate())}</div>`}
function photoHTML(){return person.photo?`<figure class="wsdPhoto"><img src="${person.photo}" alt="Foto de ${esc(person.p1)} y ${esc(person.p2)}"></figure>`:''}
function buildPublic(d){const pub=d.getElementById('public');if(!pub||getComputedStyle(pub).display==='none')return false;installStyle(d);d.body.classList.add('wsdPublicMode');const ev=eventData(d);if(ev.hero)ev.hero.classList.add('wsdOriginalHero');let old=d.getElementById('wsdPremiumWrap');if(old)old.remove();const wrap=d.createElement('div');wrap.id='wsdPremiumWrap';wrap.className='wsdPremiumWrap';wrap.dataset.design=design;wrap.innerHTML=`<section class="wsdPremiumHero">${decoFor(design)}<div class="wsdPremiumInner"><div class="wsdEyebrow">Estáis invitados</div><div class="wsdMonogram">${esc(initials())}</div><h1 class="wsdNames">${esc(person.p1)} & ${esc(person.p2)}</h1><div class="wsdMeta">${esc(fmtDate())}${ev.venue?' · '+esc(ev.venue):''}</div>${days()?`<span class="wsdDays">${esc(days())}</span>`:''}</div></section>${photoHTML()}<section class="wsdEvent"><div class="wsdEventLabel">Nuestra boda</div><div class="wsdEventTitle">${esc(ev.intro)}</div><div class="wsdEventGrid"><div class="wsdEventCell"><small>Fecha</small><b>${esc(fmtDate())}</b></div><div class="wsdEventCell"><small>Hora</small><b>${esc(ev.time)}</b></div><div class="wsdEventCell"><small>Lugar</small><b>${esc(ev.venue)}</b></div></div></section>`;pub.insertBefore(wrap,pub.firstChild);let ch=d.getElementById('wsdConfirmHead');if(ch)ch.remove();const card=pub.querySelector(':scope>.card');if(card){ch=d.createElement('div');ch.id='wsdConfirmHead';ch.className='wsdConfirmHead';ch.innerHTML='<div class="ey">RSVP</div><h2>Confirma tu asistencia</h2><p>Cuéntanos lo necesario para que podamos dejarlo todo preparado para ti.</p>';card.parentNode.insertBefore(ch,card)}return true}
function retryPublic(d,n=0){if(buildPublic(d))return;if(n<16)setTimeout(()=>retryPublic(d,n+1),120)}
function interceptLinks(d){if(d.documentElement.dataset.wsdPremiumLinks)return;d.documentElement.dataset.wsdPremiumLinks='1';d.addEventListener('click',e=>{const copy=e.target.closest?.('[data-copy]'),wa=e.target.closest?.('[data-wa]'),preview=e.target.closest?.('#preview');if(preview){setTimeout(()=>retryPublic(d),120);return}if(copy){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();navigator.clipboard?.writeText(premiumLink(copy.dataset.copy));copy.textContent='Enlace copiado';setTimeout(()=>copy.textContent='Copiar enlace',1200);return}if(wa){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.();const id=wa.dataset.wa,rec=wa.closest('.recipient'),name=rec?.querySelector('b')?.textContent?.trim()||'',raw=rec?.querySelector('.contactline')?.textContent?.trim()||'',p=normalizePhone(raw);if(!p||p.length<9||p.length>15){alert('Revisa el teléfono.');return}const text=`Hola ${name}, te enviamos la invitación de nuestra boda. Puedes confirmar aquí: ${premiumLink(id)}`;const mt=localStorage.getItem(TOKEN_KEY)||'';if(mt)fetch(API,{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-weddly-token':mt},body:JSON.stringify({action:'delivery',token:PT,guest_key:id,status:'sent'})}).catch(()=>{});location.href=`https://wa.me/${p}?text=${encodeURIComponent(text)}`}},true)}
function patch(){const d=getDoc();if(!d)return;installStyle(d);const innerBack=d.querySelector('.back');if(innerBack&&!PUBLIC)innerBack.style.display='none';installPicker(d);interceptLinks(d);if(PUBLIC)retryPublic(d);else{const preview=d.getElementById('preview');if(preview&&!preview.dataset.wsdBound){preview.dataset.wsdBound='1';preview.addEventListener('click',()=>setTimeout(()=>retryPublic(d),160))}}}

(async()=>{if(PUBLIC){await loadRemoteIdentity();setTimeout(()=>{const d=getDoc();if(d)retryPublic(d)},250)}})();
