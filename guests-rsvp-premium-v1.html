<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weddly Smart Design · RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg,#f7f2eb);color:var(--ink,#28231f);font-family:'DM Sans',system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 16px 80px}.back{display:inline-flex;align-items:center;gap:7px;border:0;background:var(--soft);color:var(--ink);padding:11px 14px;border-radius:999px;font-weight:700;font-size:14px;margin:0 0 14px}.brand{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--muted)}h1,h2,h3,p{margin-top:0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 18px}.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:13px;border-radius:14px;font-weight:700}.tab.on{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.pane{display:none}.pane.on{display:block}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin:0 0 14px;box-shadow:0 12px 34px rgba(40,30,20,.05)}.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:var(--surface);color:var(--ink);font:500 16px 'DM Sans',sans-serif;margin:6px 0 13px}.split{display:flex;gap:10px;flex-wrap:wrap}.split>*{flex:1;min-width:140px}.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.toggle input{width:22px;height:22px;accent-color:var(--accent)}.btn{border:0;background:var(--accent);color:var(--accentText);padding:14px 16px;border-radius:13px;font-weight:700;font-size:15px}.btn.soft{background:var(--soft);color:var(--ink)}.btn.outline{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.mini{padding:9px 11px;font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions>*{flex:1;min-width:125px}.small{color:var(--muted);font-size:14px;line-height:1.45}.feedback{display:none;margin:10px 0;padding:11px 12px;border-radius:12px;background:#f5e7da;color:#81582e}.feedback.on{display:block}.feedback.ok{background:#e6efe8;color:#45634c}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.metric{padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:14px}.metric b{font-size:26px}.recipient{padding:15px 0;border-bottom:1px solid var(--line)}.recipient:last-child{border-bottom:0}.rhead{display:flex;justify-content:space-between;gap:10px}.chip{display:inline-block;margin:6px 4px 0 0;padding:6px 9px;border-radius:999px;background:var(--soft);font-size:12px;font-weight:700}.chip.ok{background:#e6efe8;color:#45634c}.answer{width:100%;display:block;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:15px;font-size:16px;margin:8px 0}.answer.sel{outline:2px solid var(--accent)}.party{padding:14px;border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--surface)}.hide{display:none!important}.sheet{display:none;position:fixed;z-index:100;inset:0;background:#0007;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:760px;margin:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
/* shared invitation */
.invite{position:relative;overflow:hidden;margin:0 0 18px;min-height:470px;border-radius:var(--inviteRadius);background:var(--inviteBg);color:var(--inviteInk);box-shadow:var(--inviteShadow)}.invitePhoto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.invite.hasPhoto:after{content:'';position:absolute;inset:0;background:var(--photoOverlay)}.inviteInner{position:relative;z-index:2;height:100%;min-height:470px;padding:var(--invitePad);display:flex;flex-direction:column}.eyebrow{font:700 10px/1 'DM Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase}.names{font-family:var(--display);font-size:clamp(50px,11vw,82px);line-height:.92;letter-spacing:var(--nameSpacing);font-weight:var(--nameWeight);margin:var(--nameMargin)}.dateLine{font-size:14px;line-height:1.35}.countdown{display:inline-flex;align-items:center;margin-top:12px;padding:8px 11px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:700;width:max-content}.invite.hasPhoto .inviteInner{color:#fff}.invite.hasPhoto .countdown{background:#ffffffea;color:#28231f;border-color:#ffffffaa}.eventCard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px 20px;margin:0 0 18px;text-align:center}.eventIntro{font-family:var(--display);font-size:30px;line-height:1.15;margin-bottom:20px}.eventGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.eventCell{background:var(--soft);padding:13px 9px;border-radius:12px}.eventCell small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;margin-bottom:4px}.confirmHead{text-align:center;padding:12px 8px 4px}.confirmHead h2{font-family:var(--display);font-size:38px;font-weight:400;margin:5px 0 7px}.confirmHead p{color:var(--muted);font-size:14px;max-width:500px;margin:0 auto 14px}.success{text-align:center;padding:80px 20px}.success h1{font-family:var(--display);font-size:58px;font-weight:400}
/* six genuinely different directions */
body.theme-atelier{--bg:#f3ecdf;--surface:#fffaf2;--soft:#eee0cc;--ink:#2b2118;--muted:#756453;--line:#d8c4a7;--accent:#9f7d55;--accentText:#fffaf2;--radius:12px;--display:'Bodoni Moda',serif;--inviteRadius:8px;--inviteBg:linear-gradient(90deg,#fff9ef 0 66%,#b89a75 66%);--inviteInk:#2a2017;--inviteShadow:0 22px 55px rgba(68,46,23,.12);--invitePad:34px 30px;--nameSpacing:-.04em;--nameWeight:500;--nameMargin:70px 0 18px;--photoOverlay:linear-gradient(90deg,rgba(23,17,11,.72),rgba(23,17,11,.2))}body.theme-atelier .invite:before{content:'';position:absolute;inset:22px;border:1px solid #8f7556;z-index:1}body.theme-atelier .inviteInner{max-width:76%}body.theme-atelier .eyebrow{color:#866d50}
body.theme-oliva{--bg:#eef0e8;--surface:#fbfcf7;--soft:#dfe6d9;--ink:#2e392d;--muted:#707d6c;--line:#c9d2c2;--accent:#63765f;--accentText:#fff;--radius:24px;--display:'Cormorant Garamond',serif;--inviteRadius:42px 42px 130px 42px;--inviteBg:linear-gradient(145deg,#5f735d,#84937c);--inviteInk:#fffaf2;--inviteShadow:0 24px 58px rgba(40,62,37,.15);--invitePad:38px 30px;--nameSpacing:0;--nameWeight:400;--nameMargin:auto 0 14px;--photoOverlay:linear-gradient(0deg,rgba(27,40,25,.72),rgba(27,40,25,.1))}body.theme-oliva .invite:before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;top:-80px;border:1px solid #eef4e650}body.theme-oliva .names{font-size:clamp(58px,13vw,90px);font-style:italic}
body.theme-siena{--bg:#f6ebe3;--surface:#fffaf6;--soft:#efd8c9;--ink:#3a261f;--muted:#80665b;--line:#dfc3b2;--accent:#a85f43;--accentText:#fff;--radius:18px;--display:'Cormorant Garamond',serif;--inviteRadius:0;--inviteBg:#a75e43;--inviteInk:#3a261f;--inviteShadow:0 24px 54px rgba(114,61,38,.14);--invitePad:28px;--nameSpacing:0;--nameWeight:500;--nameMargin:22px 0 18px;--photoOverlay:linear-gradient(0deg,rgba(73,34,20,.7),rgba(73,34,20,.08))}body.theme-siena .inviteInner{margin:28px;background:#fff6ee;min-height:414px;padding:32px;justify-content:center}body.theme-siena .invite.hasPhoto .inviteInner{background:#fff6eeea;color:#3a261f}body.theme-siena .invite.hasPhoto .countdown{background:#fff;color:#3a261f;border-color:#9f705d}body.theme-siena .eyebrow{color:#a85f43}
body.theme-perla{--bg:#fbf3f7;--surface:#fffafd;--soft:#f0e2e9;--ink:#503842;--muted:#866d79;--line:#ead0dc;--accent:#9f7487;--accentText:#fff;--radius:30px;--display:'Italiana',serif;--inviteRadius:34px;--inviteBg:linear-gradient(180deg,#fff9fc,#ead5df);--inviteInk:#513943;--inviteShadow:0 25px 60px rgba(100,58,77,.12);--invitePad:38px 28px;--nameSpacing:.01em;--nameWeight:400;--nameMargin:auto 0 18px;--photoOverlay:linear-gradient(0deg,rgba(55,29,41,.63),rgba(55,29,41,.04))}body.theme-perla .invite:before,body.theme-perla .invite:after{content:'';position:absolute;border:1px solid #b78ca044;border-radius:50%;width:240px;height:240px}body.theme-perla .invite:before{right:-105px;top:-90px}body.theme-perla .invite:after{left:-120px;bottom:-130px}body.theme-perla .inviteInner{text-align:center;align-items:center}body.theme-perla .eyebrow{color:#9f7487}.theme-perla .names{font-size:clamp(52px,12vw,80px)}
body.theme-noche{--bg:#0a1420;--surface:#132335;--soft:#1c3147;--ink:#f7efe4;--muted:#c6b7a4;--line:#31465a;--accent:#d0ae75;--accentText:#17202a;--radius:14px;--display:'Bodoni Moda',serif;--inviteRadius:8px;--inviteBg:linear-gradient(135deg,#0c1725,#17304a 70%,#b59563);--inviteInk:#f8ecd9;--inviteShadow:0 26px 70px rgba(0,0,0,.35);--invitePad:40px 30px;--nameSpacing:-.04em;--nameWeight:500;--nameMargin:auto 0 18px;--photoOverlay:linear-gradient(0deg,rgba(6,12,20,.78),rgba(6,12,20,.15))}body.theme-noche .invite:before{content:'';position:absolute;inset:22px;border:1px solid #d0ae7599}body.theme-noche .eyebrow,body.theme-noche .dateLine{color:#dfc89f}body.theme-noche .countdown{border-color:#d0ae75}
body.theme-cielo{--bg:#edf5f8;--surface:#fbfeff;--soft:#dcebf0;--ink:#27414a;--muted:#6d858c;--line:#c7dce3;--accent:#6f97a5;--accentText:#fff;--radius:22px;--display:'Italiana',serif;--inviteRadius:140px 24px 140px 24px;--inviteBg:linear-gradient(180deg,#d8e9ee,#8fb1bd);--inviteInk:#27414a;--inviteShadow:0 24px 56px rgba(61,101,114,.14);--invitePad:34px 30px;--nameSpacing:.01em;--nameWeight:400;--nameMargin:auto 0 16px;--photoOverlay:linear-gradient(0deg,rgba(35,68,78,.65),rgba(35,68,78,.05))}body.theme-cielo .inviteInner{text-align:center;align-items:center}body.theme-cielo .invite:before{content:'';position:absolute;left:15%;right:15%;top:48%;height:1px;background:#ffffff99}body.theme-cielo .eyebrow{color:#4f727d}
@media(max-width:560px){.wrap{padding:14px 13px 70px}.invite,.inviteInner{min-height:430px}.eventGrid{grid-template-columns:1fr}.eventCell{padding:11px}.names{font-size:56px}.theme-siena .inviteInner{margin:18px;min-height:394px;padding:25px}.theme-atelier .inviteInner{max-width:82%}.metrics{grid-template-columns:repeat(3,1fr)}.metric{padding:10px}}
</style>
</head>
<body class="theme-oliva">
<main class="wrap">
<section id="admin">
<button id="back" class="back">← Volver a Invitados</button>
<div class="brand">Weddly Smart Design · RSVP</div>
<h1 style="font:500 52px var(--display);margin:8px 0 12px">RSVP</h1>
<div class="tabs"><button id="tabForm" class="tab on">Formulario</button><button id="tabSend" class="tab">Envíos y respuestas</button></div>
<section id="paneForm" class="pane on">
<div id="adminInvite"></div>
<div class="card"><label>Título</label><input id="title" class="field"><label>Fecha</label><input id="date" class="field"><div class="split"><div><label>Hora</label><input id="time" class="field" placeholder="18:00"></div><div style="flex:2"><label>Lugar</label><input id="venue" class="field"></div></div><label>Mensaje</label><textarea id="intro" rows="3" class="field"></textarea><b>Preguntas</b><label class="toggle"><span>Menú</span><input id="mealQ" type="checkbox"></label><label class="toggle"><span>Alergias / intolerancias</span><input id="allergyQ" type="checkbox"></label><label class="toggle"><span>Ofrecemos transporte</span><input id="transportQ" type="checkbox"></label><label class="toggle"><span>Permitir acompañante / +1</span><input id="plusQ" type="checkbox"></label><div id="saveFb" class="feedback"></div><div class="actions" style="margin-top:14px"><button id="saveConfig" class="btn">Guardar RSVP</button><button id="preview" class="btn soft">Ver como invitado</button></div></div>
</section>
<section id="paneSend" class="pane"><div class="card"><b>Envíos y respuestas</b><p class="small">Contactos, envíos y respuestas de esta misma lista.</p></div><div id="adminFb" class="feedback"></div><div id="metrics"></div><button id="refresh" class="btn soft" style="width:100%;margin-bottom:12px">Actualizar respuestas</button><div id="recipients" class="card"></div></section>
</section>
<section id="public" style="display:none"></section>
</main>
<div id="sheet" class="sheet"><div id="panel" class="panel"></div></div>
<script>
(()=>{
const RSVP_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp',PERS_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-personalization',PT='sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8',GKEY='weddly_guests_qa_v67',PKEY='weddly_personalization_v2',TOKEN_KEY='weddly_shared_wedding_token',el=id=>document.getElementById(id),norm=s=>String(s||'').trim().toLowerCase();
let cfg={title:'Daniela & Sergio',date:'12 septiembre 2027',time:'18:00',venue:'Finca La Alquería, Murcia',intro:'Nos encantará celebrar este día contigo.',transportOffered:true,questions:{meal:true,allergy:true,transport:true,plusone:true}},remote={submissions:[],contacts:[],delivery:[]},P=loadPers();
function loadPers(){try{return{theme:'oliva',p1:'Daniela',p2:'Sergio',date:'2027-09-12',place:'Murcia',photo:'',...(JSON.parse(localStorage.getItem(PKEY)||'null')||{})}}catch{return{theme:'oliva',p1:'Daniela',p2:'Sergio',date:'2027-09-12',place:'Murcia',photo:''}}}
function member(){try{return localStorage.getItem(TOKEN_KEY)||''}catch{return''}}
function guests(){try{const s=JSON.parse(localStorage.getItem(GKEY))||{};return Object.entries(s.guests||{}).map(([id,g])=>({id,...g}))}catch{return[]}}
function safe(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(x=P.date){if(!x)return'Fecha pendiente';const d=/^\d{4}-\d{2}-\d{2}$/.test(x)?new Date(x+'T12:00:00'):null;return d&&!Number.isNaN(d.getTime())?d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}):x}
function days(){if(!P.date||!/^\d{4}-\d{2}-\d{2}$/.test(P.date))return'';const a=new Date();a.setHours(0,0,0,0);const b=new Date(P.date+'T00:00:00'),n=Math.ceil((b-a)/86400000);return n>=0?'Faltan '+n+' días':''}
function setTheme(){document.body.className='theme-'+(P.theme||'oliva')}
function inviteHTML(){return `<section class="invite ${P.photo?'hasPhoto':''}">${P.photo?`<img class="invitePhoto" src="${P.photo}" alt="">`:''}<div class="inviteInner"><div class="eyebrow">Nuestra boda</div><div class="names">${safe(P.p1)} & ${safe(P.p2)}</div><div class="dateLine">${safe(fmtDate())}${P.place?' · '+safe(P.place):''}</div>${days()?`<span class="countdown">${safe(days())}</span>`:''}</div></section>`}
function renderAdminInvite(){el('adminInvite').innerHTML=inviteHTML()}
async function fetchJSON(url,opt={},timeout=8000){const c=new AbortController(),t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{...opt,signal:c.signal}),x=await r.json().catch(()=>({}));if(!r.ok||x.ok===false)throw new Error(x.error||'request_failed');return x}finally{clearTimeout(t)}}
async function api(path='',opt={}){return fetchJSON(RSVP_API+path,opt)}
async function claim(){const m=member();if(!m)throw new Error('invalid_access');return api('',{method:'POST',headers:{'content-type':'application/json','x-weddly-token':m},body:JSON.stringify({action:'claim',token:PT})})}
async function loadManage(){const m=member();if(!m)throw new Error('invalid_access');const x=await api('?manage=1',{headers:{'x-weddly-token':m}});remote=x;const f=x.forms?.[0];if(f?.config)cfg={...cfg,...f.config,questions:{...cfg.questions,...f.config.questions}};return x}
function fillAdmin(){el('title').value=cfg.title||'';el('date').value=cfg.date||'';el('time').value=cfg.time||'';el('venue').value=cfg.venue||'';el('intro').value=cfg.intro||'';el('mealQ').checked=cfg.questions?.meal!==false;el('allergyQ').checked=cfg.questions?.allergy!==false;el('transportQ').checked=cfg.transportOffered!==false&&cfg.questions?.transport!==false;el('plusQ').checked=cfg.questions?.plusone!==false}
function readCfg(){return{title:el('title').value.trim()||`${P.p1} & ${P.p2}`,date:el('date').value.trim(),time:el('time').value.trim(),venue:el('venue').value.trim(),intro:el('intro').value.trim(),transportOffered:el('transportQ').checked,questions:{meal:el('mealQ').checked,allergy:el('allergyQ').checked,transport:el('transportQ').checked,plusone:el('plusQ').checked}}}
async function saveConfig(){cfg=readCfg();const fb=el('saveFb');fb.className='feedback on';if(!member()){fb.className='feedback on ok';fb.textContent='Vista guardada en este dispositivo. Con acceso compartido se sincronizará para los invitados.';return true}fb.textContent='Guardando…';try{await claim();await api('',{method:'POST',headers:{'content-type':'application/json','x-weddly-token':member()},body:JSON.stringify({action:'config',token:PT,config:cfg})});fb.className='feedback on ok';fb.textContent='RSVP actualizado.';return true}catch(e){fb.textContent='No se ha podido sincronizar ('+e.message+').';return false}}
function setTab(which){el('tabForm').classList.toggle('on',which==='form');el('tabSend').classList.toggle('on',which==='send');el('paneForm').classList.toggle('on',which==='form');el('paneSend').classList.toggle('on',which==='send');if(which==='send')refreshManage()}
el('tabForm').onclick=()=>setTab('form');el('tabSend').onclick=()=>setTab('send');el('saveConfig').onclick=saveConfig;el('preview').onclick=()=>{cfg=readCfg();renderPublic(cfg,true)};el('refresh').onclick=refreshManage;
function latestFor(g){return(remote.submissions||[]).filter(x=>(x.guest_key&&x.guest_key===g.id)||(!x.guest_key&&norm(x.name)===norm(g.name))).sort((a,b)=>new Date(b.received_at)-new Date(a.received_at))[0]}
function contactFor(id){return(remote.contacts||[]).find(x=>x.guest_key===id)||{}}function deliveryFor(id){return(remote.delivery||[]).find(x=>x.guest_key===id)||{}}
function renderManage(){const gs=guests(),sent=gs.filter(g=>deliveryFor(g.id).status==='sent').length,answered=gs.filter(latestFor).length;el('metrics').innerHTML=`<div class="metrics"><div class="metric"><b>${gs.length}</b><div class="small">invitados</div></div><div class="metric"><b>${sent}</b><div class="small">enviados</div></div><div class="metric"><b>${answered}</b><div class="small">respuestas</div></div></div>`;el('recipients').innerHTML=gs.map(g=>{const c=contactFor(g.id),a=latestFor(g),d=deliveryFor(g.id);return `<div class="recipient"><div class="rhead"><div><b>${safe(g.name)}</b><div class="small">${safe(c.phone||c.email||'Sin contacto')}</div></div><button class="btn soft mini" data-contact="${safe(g.id)}">Contacto</button></div><span class="chip ${d.status==='sent'?'ok':''}">${d.status==='sent'?'Enviado':'Sin enviar'}</span><span class="chip ${a?'ok':''}">${a?(a.attend?'Confirmado':'No asiste'):'Sin respuesta'}</span><div class="actions" style="margin-top:9px">${c.phone?`<button class="btn mini" data-wa="${safe(g.id)}">Enviar por WhatsApp</button>`:''}<button class="btn outline mini" data-copy="${safe(g.id)}">Copiar enlace</button><button class="btn outline mini" data-manual="${safe(g.id)}">Respuesta manual</button></div></div>`}).join('')||'<p class="small">Aún no hay invitados.</p>';el('recipients').querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>openContact(b.dataset.contact));el('recipients').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard?.writeText(publicLink(b.dataset.copy)));el('recipients').querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>sendWA(b.dataset.wa));el('recipients').querySelectorAll('[data-manual]').forEach(b=>b.onclick=()=>openManual(b.dataset.manual))}
async function refreshManage(){const fb=el('adminFb');if(!member()){remote={submissions:[],contacts:[],delivery:[]};renderManage();fb.className='feedback on ok';fb.textContent='Modo local: puedes preparar el RSVP y los contactos sin bloquear la app.';return}fb.className='feedback on';fb.textContent='Actualizando…';try{await claim();await loadManage();fillAdmin();renderManage();fb.className='feedback on ok';fb.textContent='Respuestas actualizadas.'}catch(e){fb.textContent='No se ha podido actualizar ('+e.message+').'}}
function publicLink(id=''){return location.origin+'/guests-rsvp-premium-v1.html?guest=1&t='+encodeURIComponent(PT)+(id?'&g='+encodeURIComponent(id):'')}
function phone(raw){const o=String(raw||'').trim();let d=o.replace(/\D/g,'');if(o.startsWith('00'))d=d.slice(2);if(o.startsWith('+'))return d;if(d.length===9&&/^[6789]/.test(d))return'34'+d;return d}
async function sendWA(id){const g=guests().find(x=>x.id===id),c=contactFor(id),p=phone(c.phone);if(!g||!p)return;location.href=`https://wa.me/${p}?text=${encodeURIComponent(`Hola ${g.name}, te enviamos nuestro RSVP. Puedes responder aquí: ${publicLink(id)}`)}`;if(member())api('',{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-weddly-token':member()},body:JSON.stringify({action:'delivery',token:PT,guest_key:id,status:'sent'})}).catch(()=>{})}
function openContact(id){const g=guests().find(x=>x.id===id),c=contactFor(id);el('panel').innerHTML=`<h2>${safe(g?.name||'Contacto')}</h2><label>Teléfono</label><input id="cp" class="field" inputmode="tel" value="${safe(c.phone||'')}"><label>Email</label><input id="ce" class="field" value="${safe(c.email||'')}"><div class="actions"><button id="closeSheet" class="btn soft">Volver</button><button id="saveC" class="btn">Guardar</button></div>`;el('sheet').classList.add('on');el('closeSheet').onclick=closeSheet;el('saveC').onclick=async()=>{if(!member()){remote.contacts=[...(remote.contacts||[]).filter(x=>x.guest_key!==id),{guest_key:id,phone:el('cp').value.trim(),email:el('ce').value.trim()}];closeSheet();renderManage();return}await claim();await api('',{method:'POST',headers:{'content-type':'application/json','x-weddly-token':member()},body:JSON.stringify({action:'contact',token:PT,guest_key:id,phone:el('cp').value.trim(),email:el('ce').value.trim()})});closeSheet();refreshManage()}}
function closeSheet(){el('sheet').classList.remove('on');el('panel').innerHTML=''}el('sheet').onclick=e=>{if(e.target===el('sheet'))closeSheet()};
function mealOptions(selected='Estándar'){return['Estándar','Vegetariano','Vegano','Celíaco','Sin lactosa','Infantil','Sin menú'].map(x=>`<option${x===selected?' selected':''}>${x}</option>`).join('')}
function childRows(count){return Array.from({length:count},(_,i)=>`<div class="party"><b>Niño/a ${i+1}</b><label>Nombre</label><input class="field" data-kid-name="${i}"><label>Edad</label><input class="field" data-kid-age="${i}" type="number" min="0" max="17"><label>Su menú</label><select class="field" data-kid-meal="${i}">${mealOptions('Infantil')}</select><label>Alergias o intolerancias</label><input class="field" data-kid-allergy="${i}"></div>`).join('')}
function buildResponseForm(mode,g){const ro=mode==='manual';return `<div class="card"><label>Nombre y apellidos</label><input id="rName" class="field" value="${safe(g?.name||'')}" ${ro?'readonly':''}><b>¿Vienes?</b><button id="rYes" class="answer sel" type="button">Sí, allí estaré</button><button id="rNo" class="answer" type="button">No podré asistir</button><div id="attendingBlock"><div id="adultMeal"><label>Tu menú</label><select id="rMeal" class="field">${mealOptions()}</select><label>Alergias o intolerancias</label><input id="rAllergy" class="field"></div><label class="toggle"><span>¿Vendrán niños contigo?</span><input id="rKids" type="checkbox"></label><div id="kidsBlock" class="hide"><label>Número de niños</label><input id="rKidsN" class="field" type="number" min="1" max="8" value="1"><div id="kidsRows"></div></div><div id="plusWrap"><label class="toggle"><span>¿Vendrá un acompañante / +1?</span><input id="rPlus" type="checkbox"></label><div id="plusBlock" class="hide party"><label>Nombre</label><input id="rPlusName" class="field"><label>Su menú</label><select id="rPlusMeal" class="field">${mealOptions()}</select><label>Alergias o intolerancias</label><input id="rPlusAllergy" class="field"></div></div><div id="transportWrap"><label class="toggle"><span>Necesitamos transporte</span><input id="rTransport" type="checkbox"></label><div id="transportSeats" class="hide"><label>Plazas necesarias</label><input id="rTransportN" class="field" type="number" min="1" max="20" value="1"></div></div></div><div id="rFb" class="feedback"></div><button id="rSend" class="btn" style="width:100%;margin-top:16px">${mode==='manual'?'Guardar respuesta':'Enviar respuesta'}</button></div>`}
function wireResponse(root,mode,g){let attend=true;const yes=root.querySelector('#rYes'),no=root.querySelector('#rNo'),ab=root.querySelector('#attendingBlock'),kids=root.querySelector('#rKids'),kb=root.querySelector('#kidsBlock'),kn=root.querySelector('#rKidsN'),kr=root.querySelector('#kidsRows'),plus=root.querySelector('#rPlus'),pb=root.querySelector('#plusBlock'),tr=root.querySelector('#rTransport'),ts=root.querySelector('#transportSeats');yes.onclick=()=>{attend=true;yes.classList.add('sel');no.classList.remove('sel');ab.classList.remove('hide')};no.onclick=()=>{attend=false;no.classList.add('sel');yes.classList.remove('sel');ab.classList.add('hide')};const drawKids=()=>kr.innerHTML=childRows(Math.max(1,Math.min(8,Number(kn.value)||1)));kids.onchange=()=>{kb.classList.toggle('hide',!kids.checked);if(kids.checked)drawKids()};kn.oninput=drawKids;plus.onchange=()=>pb.classList.toggle('hide',!plus.checked);tr.onchange=()=>ts.classList.toggle('hide',!tr.checked);if(cfg.questions?.meal===false)root.querySelector('#adultMeal').classList.add('hide');if(cfg.questions?.plusone===false)root.querySelector('#plusWrap').classList.add('hide');if(cfg.transportOffered===false||cfg.questions?.transport===false)root.querySelector('#transportWrap').classList.add('hide');root.querySelector('#rSend').onclick=async()=>{const name=root.querySelector('#rName').value.trim();if(!name)return root.querySelector('#rName').focus();const children=kids.checked?Array.from({length:Math.max(1,Math.min(8,Number(kn.value)||1))},(_,i)=>{const meal=root.querySelector(`[data-kid-meal="${i}"]`)?.value||'Sin menú';return{name:root.querySelector(`[data-kid-name="${i}"]`)?.value.trim()||'',age:root.querySelector(`[data-kid-age="${i}"]`)?.value===''?null:Number(root.querySelector(`[data-kid-age="${i}"]`)?.value),meal_required:meal!=='Sin menú',meal:meal==='Sin menú'?'':meal,allergy:root.querySelector(`[data-kid-allergy="${i}"]`)?.value.trim()||''}}):[];const pm=root.querySelector('#rPlusMeal')?.value||'Sin menú',meal=root.querySelector('#rMeal')?.value||'Sin menú',payload={action:mode==='manual'?'manual_submit':'submit',token:PT,client_submission_id:(crypto.randomUUID?crypto.randomUUID():'r_'+Date.now()),guest_key:g?.id||new URLSearchParams(location.search).get('g')||'',name,attend,meal_required:attend&&cfg.questions?.meal!==false?meal!=='Sin menú':null,meal:attend&&meal!=='Sin menú'?meal:'',allergy:attend?root.querySelector('#rAllergy')?.value.trim()||'':'',children:attend?children:[],plusone_details:attend&&plus.checked?{name:root.querySelector('#rPlusName').value.trim(),meal_required:pm!=='Sin menú',meal:pm==='Sin menú'?'':pm,allergy:root.querySelector('#rPlusAllergy').value.trim()}:null,transport:attend&&tr.checked,transport_seats:attend&&tr.checked?Math.max(1,Number(root.querySelector('#rTransportN').value)||1):0};const b=root.querySelector('#rSend'),fb=root.querySelector('#rFb');b.disabled=true;b.textContent='Guardando…';try{if(mode==='manual')await claim();await api('',{method:'POST',headers:mode==='manual'?{'content-type':'application/json','x-weddly-token':member()}:{'content-type':'application/json'},body:JSON.stringify(payload)});if(mode==='manual'){closeSheet();refreshManage()}else{el('public').innerHTML='<div class="success"><div class="brand">Respuesta enviada</div><h1>Gracias</h1><p>Tu respuesta se ha registrado correctamente.</p></div>'}}catch(e){b.disabled=false;b.textContent=mode==='manual'?'Guardar respuesta':'Enviar respuesta';fb.className='feedback on';fb.textContent='No se ha podido guardar ('+e.message+').'}}}
function openManual(id){const g=guests().find(x=>x.id===id);el('panel').innerHTML='<h2>Respuesta manual</h2>'+buildResponseForm('manual',g);el('sheet').classList.add('on');wireResponse(el('panel'),'manual',g)}
function renderPublic(c,preview=false){cfg={...cfg,...c,questions:{...cfg.questions,...c.questions}};el('admin').style.display='none';const p=el('public');p.style.display='block';p.innerHTML=`${preview?'<button id="previewBack" class="back">← Volver a edición</button>':''}${inviteHTML()}<section class="eventCard"><div class="eventIntro">${safe(cfg.intro||'Nos encantará celebrar este día contigo.')}</div><div class="eventGrid"><div class="eventCell"><small>Fecha</small><b>${safe(fmtDate(cfg.date||P.date))}</b></div><div class="eventCell"><small>Hora</small><b>${safe(cfg.time||'—')}</b></div><div class="eventCell"><small>Lugar</small><b>${safe(cfg.venue||P.place||'—')}</b></div></div></section><div class="confirmHead"><div class="brand">RSVP</div><h2>Confirma tu asistencia</h2><p>Completa los datos para que podamos dejarlo todo preparado para ti.</p></div>${buildResponseForm('guest',null)}`;wireResponse(p,'guest',null);if(preview)el('previewBack').onclick=()=>{p.style.display='none';el('admin').style.display='block'}}
async function loadPublicPersonalization(token){if(!token)return;try{const x=await fetchJSON(PERS_API+'?token='+encodeURIComponent(token),{},5000);if(x.personalization){P={...P,...x.personalization};try{localStorage.setItem(PKEY,JSON.stringify(P))}catch{};setTheme()}}catch{}}
async function init(){setTheme();renderAdminInvite();fillAdmin();renderManage();const q=new URLSearchParams(location.search);if(q.get('guest')==='1'){const token=q.get('t')||PT;await loadPublicPersonalization(token);try{const x=await api('?token='+encodeURIComponent(token));renderPublic(x.form.config,false)}catch{el('admin').style.display='none';el('public').style.display='block';el('public').innerHTML='<div class="card"><h2>RSVP no disponible</h2><p class="small">Prueba de nuevo o pide que te reenvíen el enlace.</p></div>'}return}if(member()){loadManage().then(()=>{fillAdmin();renderManage()}).catch(()=>{})}}
el('back').onclick=()=>{if(history.length>1)history.back();else location.href='guests-v114-integrated.html?v=131#invitados'};
init();
})();
</script>
</body></html>
