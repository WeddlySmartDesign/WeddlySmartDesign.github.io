<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · RSVP QA</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1ea;color:#2c2a26;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:620px;margin:auto;padding:24px 22px 90px}.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase}.back{display:inline-block;margin:8px 0 18px;color:#2c2a26;text-decoration:none;font-weight:700}.hero{background:#fff;border:1px solid #ddd5c8;border-radius:22px;padding:22px;margin-bottom:16px}h1{font:500 52px Georgia,serif;margin:10px 0 18px}.small{color:#706b65;line-height:1.45}.field{width:100%;padding:14px;border:1px solid #ccc5bb;border-radius:13px;font-size:16px;margin:6px 0 13px;background:#fff}.btn{border:0;border-radius:13px;padding:14px 16px;background:#2c2a26;color:#fff;font-weight:700;font-size:16px}.soft{background:#eee8df;color:#2c2a26}.card{background:#fff;border:1px solid #ddd5c8;border-radius:20px;padding:18px;margin:16px 0}.toggle{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.toggle:last-child{border-bottom:0}.toggle input{width:22px;height:22px}.preview{background:#f7f3ed;border:1px solid #ddd5c8;border-radius:22px;padding:28px 22px;text-align:center;margin-top:16px}.preview h2{font:500 36px Georgia,serif;margin:8px 0}.date{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.actions{display:flex;gap:10px;margin-top:16px}.actions>*{flex:1}.public{display:none}.public.on{display:block}.builder.hide{display:none}.answer{display:block;width:100%;padding:16px;border:1px solid #ccc5bb;border-radius:15px;background:#fff;text-align:left;font-size:16px;margin:8px 0}.answer.sel{outline:2px solid #2c2a26}.success{text-align:center;padding:40px 10px}.badge{display:inline-block;background:#eee8df;border-radius:999px;padding:7px 10px;font-weight:700}</style></head><body><main class="wrap"><a class="back" href="guests-v081-integrated.html?v=83-rsvp-fixed#invitados">← Volver</a><div class="brand">Weddly Smart Design · RSVP</div><section id="builder" class="builder"><h1>RSVP</h1><div class="hero"><b id="statusTitle">Crea tu RSVP conectado</b><p class="small">Las respuestas vuelven a Guests. Si ya tienes lista, se cruzan con ella; si no, empiezas desde aquí.</p></div><div class="card"><label>Título</label><input id="title" class="field"><label>Fecha</label><input id="date" class="field"><label>Mensaje</label><textarea id="intro" class="field" rows="3"></textarea><b>Preguntas</b><label class="toggle"><span>Menú</span><input id="meal" type="checkbox"></label><label class="toggle"><span>Alergias / intolerancias</span><input id="allergy" type="checkbox"></label><label class="toggle"><span>Transporte</span><input id="transport" type="checkbox"></label><label class="toggle"><span>Acompañante / +1</span><input id="plusone" type="checkbox"></label><div class="preview"><div id="pdate" class="date"></div><h2 id="ptitle"></h2><p id="pintro"></p></div><div class="actions"><button id="save" class="btn">Guardar RSVP</button><button id="previewBtn" class="btn soft">Ver como invitado</button></div></div><div id="responses"></div></section><section id="public" class="public"><div class="hero"><button id="backBuilder" class="btn soft">← Volver</button><div class="brand" style="margin-top:28px">Weddly Smart Design</div><h1 id="pubTitle"></h1><div id="pubDate" class="small"></div><p id="pubIntro"></p></div><div class="card"><label>Nombre y apellidos</label><input id="name" class="field" placeholder="Tu nombre"><b>¿Asistirás?</b><button class="answer sel" data-att="1">Sí, allí estaré</button><button class="answer" data-att="0">No podré asistir</button><div id="qMeal"><label>Menú</label><select id="mealAns" class="field"><option>Estándar</option><option>Vegetariano</option><option>Vegano</option><option>Celíaco</option><option>Sin lactosa</option><option>Infantil</option></select></div><div id="qAllergy"><label>Alergias o intolerancias</label><input id="allergyAns" class="field" placeholder="Lo que debemos saber"></div><label id="qTransport" class="toggle"><span>Necesito transporte</span><input id="transportAns" type="checkbox"></label><div id="qPlus"><label>Acompañante / +1</label><input id="plusAns" class="field" placeholder="Nombre, si aplica"></div><button id="send" class="btn" style="width:100%;margin-top:18px">Enviar respuesta</button></div></section></main><script>const KEY='weddly_guests_rsvp_v82';const def={active:false,title:'Daniela & Sergio',date:'12 septiembre 2027',intro:'Nos encantará celebrar este día contigo.',questions:{meal:true,allergy:true,transport:true,plusone:true},responses:[]};let R;try{R=JSON.parse(localStorage.getItem(KEY))||structuredClone(def)}catch(e){R=structuredClone(def)}const $=id=>document.getElementById(id);function saveR(){localStorage.setItem(KEY,JSON.stringify(R))}function fill(){title.value=R.title;date.value=R.date;intro.value=R.intro;meal.checked=R.questions.meal;allergy.checked=R.questions.allergy;transport.checked=R.questions.transport;plusone.checked=R.questions.plusone;statusTitle.textContent=R.active?'RSVP activo':'Crea tu RSVP conectado';syncPreview();renderResponses()}function syncPreview(){pdate.textContent=date.value;ptitle.textContent=title.value;pintro.textContent=intro.value}['title','date','intro'].forEach(id=>$(id).addEventListener('input',syncPreview));save.onclick=()=>{R.title=title.value.trim()||'Nuestra boda';R.date=date.value.trim();R.intro=intro.value.trim();R.questions={meal:meal.checked,allergy:allergy.checked,transport:transport.checked,plusone:plusone.checked};R.active=true;saveR();fill()};previewBtn.onclick=()=>{save.click();builder.classList.add('hide');public.classList.add('on');pubTitle.textContent=R.title;pubDate.textContent=R.date;pubIntro.textContent=R.intro;qMeal.style.display=R.questions.meal?'block':'none';qAllergy.style.display=R.questions.allergy?'block':'none';qTransport.style.display=R.questions.transport?'flex':'none';qPlus.style.display=R.questions.plusone?'block':'none'};backBuilder.onclick=()=>{public.classList.remove('on');builder.classList.remove('hide')};let attend=true;document.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>{attend=b.dataset.att==='1';document.querySelectorAll('[data-att]').forEach(x=>x.classList.toggle('sel',x===b))});send.onclick=()=>{const n=name.value.trim();if(!n){name.focus();return}R.responses.push({name:n,attend,meal:R.questions.meal?mealAns.value:'',allergy:R.questions.allergy?allergyAns.value.trim():'',transport:R.questions.transport?transportAns.checked:false,plusone:R.questions.plusone?plusAns.value.trim():'',applied:false,at:Date.now()});saveR();public.innerHTML='<div class="success"><div class="brand">Respuesta enviada</div><h1>Gracias</h1><p>Tu respuesta ha quedado registrada.</p><a class="btn soft" style="display:inline-block;text-decoration:none" href="guests-v081-integrated.html?v=83-rsvp-fixed#invitados">Volver</a></div>'};function renderResponses(){const p=R.responses.filter(x=>!x.applied);responses.innerHTML=p.length?`<div class="card"><b>Respuestas recibidas <span class="badge">${p.length}</span></b><p class="small">Vuelve a Guests para incorporarlas a la lista.</p>${p.map(x=>`<div style="padding:10px 0;border-top:1px solid #eee"><b>${x.name}</b><div class="small">${x.attend?'Asiste':'No asiste'}${x.meal?' · '+x.meal:''}${x.transport?' · Transporte':''}</div></div>`).join('')}<a class="btn" style="display:inline-block;text-decoration:none;margin-top:10px" href="guests-v081-integrated.html?v=83-rsvp-fixed#invitados">Ir a Invitados</a></div>`:''}fill()</script></body></html>
