<!doctype html>
<html lang="es" data-theme="nordic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>WeddlySmartDesign · RSVP · Envíos y respuestas</title>
<style>
:root{--bg:#F2EFE9;--paper:#FBF8F3;--line:#E4DED2;--soft:#EEF0E9;--accent:#6E7A5C;--dark:#525C43;--ink:#2C2A26;--muted:#736F63;--ok:#61765F;--danger:#9a4537}
:root[data-theme="blush"]{--bg:#F5EEEC;--paper:#FFF9F7;--line:#E9DAD6;--soft:#F5E9E7;--accent:#B48683;--dark:#825F5D}
:root[data-theme="sand"]{--bg:#F1EAE1;--paper:#FCF8F2;--line:#DED3C5;--soft:#F2E9DE;--accent:#9B7F62;--dark:#725A45;--ink:#302B26}
:root[data-theme="slate"]{--bg:#EEF1F3;--paper:#F8FAFB;--line:#D8DEE2;--soft:#E9EEF1;--accent:#73808A;--dark:#4C5963;--ink:#252A2E}
:root[data-theme="editorial"]{--bg:#F0ECE8;--paper:#FBF8F5;--line:#DED6D0;--soft:#EFE8E4;--accent:#6B5B52;--dark:#443833;--ink:#2A2421}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100vh}.app{max-width:680px;min-height:100vh;margin:auto;background:var(--paper);padding:calc(16px + env(safe-area-inset-top)) 18px calc(42px + env(safe-area-inset-bottom));box-shadow:0 0 40px #2c2a2608}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}.brand{font-family:Georgia,serif;color:var(--dark);line-height:1.02}.brand b{display:block;font-size:19px;font-weight:500}.brand span{display:block;font-size:13px;margin-top:2px}.topActions{display:flex;gap:7px}.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--dark);color:#fff;font-weight:750;font-size:14px;cursor:pointer}.btn.soft{background:var(--soft);color:var(--ink)}.btn.line{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.mini{padding:9px 11px;font-size:13px}.btn:disabled{opacity:.5}.eyebrow{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:750}h1{font:500 38px Georgia,serif;margin:5px 0 8px}.lead{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 22px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.metric b{display:block;font-size:25px}.metric span{font-size:12px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin-bottom:12px}.recipient{padding:15px 0;border-bottom:1px solid var(--line)}.recipient:last-child{border-bottom:0}.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.name{font-weight:800}.contact{font-size:13px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{display:inline-block;border-radius:999px;padding:6px 9px;background:var(--soft);font-size:12px;font-weight:700}.chip.ok{background:#e7eee8;color:#4e6656}.chip.bad{background:#f6e8e4;color:#8a4035}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.notice{display:none;margin:0 0 12px;padding:11px 12px;border-radius:12px;background:var(--soft);color:var(--dark);font-size:13px;line-height:1.4}.notice.on{display:block}.notice.err{background:#f6e8e4;color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:26px 12px}.sheet{display:none;position:fixed;z-index:100;inset:0;background:#0005;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:680px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.panel h2{font-size:27px;margin:3px 0 16px}.field{width:100%;padding:13px;border:1px solid #ccc5bb;border-radius:12px;font-size:16px;margin:6px 0 13px;background:#fff;color:var(--ink)}label{display:block;font-size:13px;font-weight:750;margin-top:7px}.toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 0}.toggle input{width:22px;height:22px}.panelActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.spinner{padding:60px 10px;text-align:center;color:var(--muted)}
@media(max-width:480px){h1{font-size:34px}.metrics{grid-template-columns:repeat(3,1fr)}.metric{padding:10px}.toolbar{grid-template-columns:1fr}.topActions .editLabel{display:none}.actions .btn{flex:1;min-width:130px}}
</style>
</head>
<body><main class="app"><div class="top"><div class="brand"><b>Weddly</b><span>Smart Design</span></div><div class="topActions"><button class="btn line" id="editInvitation"><span class="editLabel">Editar </span>invitación</button><button class="btn soft" id="back">← Invitados</button></div></div><div class="eyebrow">RSVP</div><h1>Envíos y respuestas</h1><p class="lead">Aquí gestionas el RSVP del día a día. La invitación queda aparte: solo vuelve a editarla cuando quieras cambiar el diseño o la información.</p><div id="notice" class="notice" aria-live="polite"></div><div id="metrics" class="metrics"><div class="metric"><b>—</b><span>invitados</span></div><div class="metric"><b>—</b><span>enviados</span></div><div class="metric"><b>—</b><span>respuestas</span></div></div><div class="toolbar"><button class="btn" id="refresh">Actualizar respuestas</button><button class="btn soft" id="copyAll">Copiar enlace general</button></div><section class="card"><div class="eyebrow">INVITADOS</div><div id="recipients"><div class="spinner">Cargando RSVP…</div></div></section></main><div id="sheet" class="sheet"><div id="panel" class="panel"></div></div>
<script>
(()=>{
const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp',FALLBACK='sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8',GKEY='weddly_guests_qa_v67',RKEY='weddly_guests_rsvp_v82',TOKEN_KEY='weddly_shared_wedding_token';
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),norm=s=>String(s||'').trim().toLowerCase();let remote={forms:[],submissions:[],contacts:[],delivery:[]},PT=FALLBACK;
function theme(){try{const x=localStorage.getItem('weddly_personal_theme_v51')||localStorage.getItem('weddly_personal_theme_v20')||'nordic';return['nordic','blush','sand','slate','editorial'].includes(x)?x:'nordic'}catch{return'nordic'}}document.documentElement.dataset.theme=theme();
const mt=()=>{try{return localStorage.getItem(TOKEN_KEY)||''}catch{return''}};
function guests(){try{const s=JSON.parse(localStorage.getItem(GKEY))||{};return Object.entries(s.guests||{}).map(([id,g])=>({id,...g}))}catch{return[]}}
function localR(){try{return JSON.parse(localStorage.getItem(RKEY))||{contacts:{},delivery:{},responses:[]}}catch{return{contacts:{},delivery:{},responses:[]}}}
function phone(raw){const o=String(raw||'').trim();let d=o.replace(/\D/g,'');if(o.startsWith('00'))d=d.slice(2);if(o.startsWith('+'))return d;if(d.length===9&&/^[6789]/.test(d))return'34'+d;return d}
function show(msg,err=false){const n=$('notice');n.textContent=msg;n.className='notice on'+(err?' err':'');clearTimeout(show.t);show.t=setTimeout(()=>n.className='notice',2600)}
async function req(path='',opt={}){const r=await fetch(API+path,opt),x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||'request_failed');return x}
async function claim(token){if(!mt())throw new Error('missing_access');return req('',{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'claim',token})})}
async function load(){if(!mt())throw new Error('missing_access');remote=await req('?manage=1',{headers:{'x-weddly-token':mt()},cache:'no-store'});const f=remote.forms?.[0];if(f?.public_token)PT=f.public_token;else{try{await claim(PT);remote=await req('?manage=1',{headers:{'x-weddly-token':mt()},cache:'no-store'});if(remote.forms?.[0]?.public_token)PT=remote.forms[0].public_token}catch{}}render()}
function latest(g){return(remote.submissions||[]).filter(x=>(x.guest_key&&x.guest_key===g.id)||(!x.guest_key&&norm(x.name)===norm(g.name))).sort((a,b)=>new Date(b.received_at)-new Date(a.received_at))[0]}
function contact(g){const r=(remote.contacts||[]).find(x=>x.guest_key===g.id)||{},l=localR().contacts?.[g.id]||{};return{phone:r.phone||l.phone||g.phone||'',email:r.email||l.email||g.email||''}}
function delivery(id){const r=(remote.delivery||[]).find(x=>x.guest_key===id)||{},l=localR().delivery?.[id]||{};return Object.keys(r).length?r:l}
function publicLink(id=''){return location.origin+'/guests-rsvp-v105.html?guest=1&t='+encodeURIComponent(PT)+(id?'&g='+encodeURIComponent(id):'')}
function render(){const gs=guests(),sent=gs.filter(g=>delivery(g.id).status==='sent').length,answered=gs.filter(latest).length;$('metrics').innerHTML=`<div class="metric"><b>${gs.length}</b><span>invitados</span></div><div class="metric"><b>${sent}</b><span>enviados</span></div><div class="metric"><b>${answered}</b><span>respuestas</span></div>`;$('recipients').innerHTML=gs.map(g=>{const c=contact(g),a=latest(g),d=delivery(g.id),p=a?.payload||{},kids=Array.isArray(p.children)?p.children.length:0,status=a?(a.attend?'Confirmado':'No asiste'):(g.rsvp==='confirmed'?'Confirmado':g.rsvp==='declined'?'No asiste':'Sin respuesta');return`<article class="recipient"><div class="rhead"><div><div class="name">${safe(g.name||'Sin nombre')}</div><div class="contact">${safe(c.phone||c.email||'Sin contacto')}</div></div><button class="btn soft mini" data-contact="${safe(g.id)}">Contacto</button></div><div class="chips"><span class="chip ${d.status==='sent'?'ok':''}">${d.status==='sent'?'Enviado':'Sin enviar'}</span><span class="chip ${status==='Confirmado'?'ok':status==='No asiste'?'bad':''}">${status}</span></div>${a?`<div class="contact" style="margin-top:8px">${safe(a.source==='manual'?'Respuesta manual':'Respuesta recibida')}${kids?' · '+kids+' niño'+(kids===1?'':'s'):''}${a.meal?' · '+safe(a.meal):''}</div>`:''}<div class="actions">${c.phone?`<button class="btn mini" data-wa="${safe(g.id)}">${d.status==='sent'?'Reenviar':'Enviar por WhatsApp'}</button>`:''}<button class="btn line mini" data-copy="${safe(g.id)}">Copiar enlace</button><button class="btn line mini" data-manual="${safe(g.id)}">Respuesta manual</button></div></article>`}).join('')||'<div class="empty">Aún no hay invitados.</div>';bind()}
function bind(){$('recipients').querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>openContact(b.dataset.contact));$('recipients').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(publicLink(b.dataset.copy)));$('recipients').querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>sendWA(b.dataset.wa));$('recipients').querySelectorAll('[data-manual]').forEach(b=>b.onclick=()=>openManual(b.dataset.manual))}
function openSheet(html){$('panel').innerHTML=html;$('sheet').classList.add('on');$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()}}
function closeSheet(){$('sheet').classList.remove('on');$('panel').innerHTML=''}
function openContact(id){const g=guests().find(x=>x.id===id);if(!g)return;const c=contact(g),can=!!navigator.contacts?.select;openSheet(`<div class="eyebrow">CONTACTO</div><h2>${safe(g.name)}</h2>${can?'<button id="pick" class="btn soft" style="width:100%;margin-bottom:12px">Elegir de mi agenda</button>':''}<label>Teléfono</label><input id="cp" class="field" inputmode="tel" value="${safe(c.phone)}"><label>Email</label><input id="ce" class="field" inputmode="email" value="${safe(c.email)}"><div id="cfb" class="notice"></div><div class="panelActions"><button id="cc" class="btn soft">Cancelar</button><button id="cs" class="btn">Guardar</button></div>`);$('cc').onclick=closeSheet;$('cs').onclick=()=>saveContact(id);if(can)$('pick').onclick=()=>pickContact(id)}
async function pickContact(id){const fb=$('cfb');try{const props=navigator.contacts.getProperties?await navigator.contacts.getProperties():['name','tel','email'],wanted=['name','tel','email'].filter(x=>props.includes(x)),items=await navigator.contacts.select(wanted,{multiple:false});if(!items?.length)return;const c=items[0];if(c.tel?.[0])$('cp').value=c.tel[0];if(c.email?.[0])$('ce').value=c.email[0];if(c.name?.[0]){fb.textContent='Contacto seleccionado: '+c.name[0];fb.className='notice on'}}catch(e){if(e?.name!=='AbortError'){fb.textContent='Este navegador no ha permitido abrir la agenda. Puedes introducir el contacto manualmente.';fb.className='notice on err'}}}
async function saveContact(id){const phone=$('cp').value.trim(),email=$('ce').value.trim(),b=$('cs');b.disabled=true;b.textContent='Guardando…';try{await req('',{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'contact',token:PT,guest_key:id,phone,email})});await load();closeSheet();show('Contacto guardado.')}catch{b.disabled=false;b.textContent='Guardar';$('cfb').textContent='No se ha podido guardar.';$('cfb').className='notice on err'}}
async function copy(text){try{await navigator.clipboard.writeText(text);show('Enlace copiado.')}catch{prompt('Copia este enlace:',text)}}
async function sendWA(id){const g=guests().find(x=>x.id===id);if(!g)return;const c=contact(g),p=phone(c.phone);if(p.length<9||p.length>15){openContact(id);return}try{req('',{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'delivery',token:PT,guest_key:id,status:'sent'})}).catch(()=>{});const R=localR();R.delivery=R.delivery||{};R.delivery[id]={status:'sent',sentAt:Date.now()};localStorage.setItem(RKEY,JSON.stringify(R));const text=`Hola ${g.name||''}, te enviamos nuestro RSVP. Puedes responder aquí: ${publicLink(id)}`;location.href=`https://wa.me/${p}?text=${encodeURIComponent(text)}`;}catch{show('No se ha podido abrir WhatsApp.',true)}}
function openManual(id){const g=guests().find(x=>x.id===id);if(!g)return;openSheet(`<div class="eyebrow">RSVP</div><h2>Respuesta manual</h2><p class="contact">${safe(g.name)}</p><label>Asistencia</label><select id="ma" class="field"><option value="yes">Asiste</option><option value="no">No asiste</option></select><label class="toggle"><span>Necesita menú</span><input id="mn" type="checkbox" checked></label><label>Menú</label><select id="mm" class="field"><option>Estándar</option><option>Vegetariano</option><option>Vegano</option><option>Celíaco</option><option>Sin lactosa</option><option>Infantil</option></select><label>Alergias o intolerancias</label><input id="mal" class="field"><label class="toggle"><span>Necesita transporte</span><input id="mt" type="checkbox"></label><label>Acompañante / +1</label><input id="mp" class="field"><div id="mfb" class="notice"></div><div class="panelActions"><button id="mc" class="btn soft">Cancelar</button><button id="ms" class="btn">Guardar respuesta</button></div>`);$('mc').onclick=closeSheet;$('ms').onclick=()=>saveManual(id)}
async function saveManual(id){const g=guests().find(x=>x.id===id),b=$('ms');if(!g)return;b.disabled=true;b.textContent='Guardando…';const attend=$('ma').value==='yes',need=$('mn').checked,payload={action:'manual_submit',client_submission_id:(crypto.randomUUID?crypto.randomUUID():'manual_'+Date.now()),guest_key:id,name:g.name,attend,age:null,meal_required:need,meal:need?$('mm').value:'',allergy:$('mal').value.trim(),transport:$('mt').checked,plusone:$('mp').value.trim()};try{await req('',{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify(payload)});try{const S=JSON.parse(localStorage.getItem(GKEY))||{};if(S.guests?.[id]){S.guests[id].rsvp=attend?'confirmed':'declined';S.guests[id].meal=payload.meal;S.guests[id].mealRequired=payload.meal_required;S.guests[id].transport=payload.transport;if(!attend)S.guests[id].table='';localStorage.setItem(GKEY,JSON.stringify(S))}}catch{}closeSheet();await load();show('Respuesta guardada.')}catch{b.disabled=false;b.textContent='Guardar respuesta';$('mfb').textContent='No se ha podido guardar. Reintenta con conexión.';$('mfb').className='notice on err'}}
$('back').onclick=()=>location.assign('guests.html#invitados');$('editInvitation').onclick=()=>location.assign('guests-rsvp-design-manage.html');$('refresh').onclick=async()=>{show('Actualizando…');try{await load();show('Respuestas actualizadas.')}catch{show('No se han podido actualizar las respuestas.',true)}};$('copyAll').onclick=()=>copy(publicLink());
load().catch(e=>{show(e.message==='missing_access'?'Este dispositivo no tiene acceso a la boda.':'No se ha podido cargar el RSVP.',true);$('recipients').innerHTML='<div class="empty">No se han podido cargar los envíos y respuestas.</div>'});
})();
</script></body></html>
