<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><title>Weddly Smart Design · Invitación</title><style>:root{--bg:#f3efe8;--paper:#fffdf9;--ink:#282722;--muted:#777168;--line:#e4ddd2;--accent:#576548;--soft:#eef0e9}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh}.screen{min-height:100vh;display:none}.screen.on{display:flex;flex-direction:column}.cover{position:relative;overflow:hidden;background:#d8d4cb;min-height:100vh}.photos{position:absolute;inset:0;display:grid;grid-template-columns:1fr}.photos.two{grid-template-columns:1fr 1fr}.photos img{width:100%;height:100%;object-fit:cover;min-width:0}.fallback{position:absolute;inset:0;background:linear-gradient(145deg,#d5d0c6,#aeb5a1)}.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,20,17,.64),rgba(20,20,17,.06) 62%,rgba(20,20,17,.18))}.coverContent{position:relative;z-index:2;margin-top:auto;padding:44px 24px calc(32px + env(safe-area-inset-bottom));color:#fff}.brand{font:500 17px/1.05 Georgia,serif;margin-bottom:28px}.brand span{display:block;font-size:12px;margin-top:2px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;opacity:.86}.cover h1{font:500 clamp(46px,14vw,72px)/.94 Georgia,serif;margin:10px 0 14px;max-width:620px}.cover p{font-size:18px;line-height:1.45;max-width:520px;margin:0 0 24px}.btn{appearance:none;border:0;border-radius:14px;background:var(--accent);color:#fff;min-height:52px;padding:14px 18px;font-size:16px;font-weight:850;text-decoration:none;display:flex;align-items:center;justify-content:center;width:100%}.btn.light{background:#fff;color:var(--ink)}.details{max-width:620px;width:100%;margin:auto;padding:24px 18px calc(42px + env(safe-area-inset-bottom))}.topBrand{font:500 20px/1 Georgia,serif;color:var(--accent);margin-bottom:38px}.topBrand span{display:block;font-size:13px;margin-top:3px}.details h1{font:500 43px/1 Georgia,serif;margin:0 0 12px}.intro{color:var(--muted);font-size:16px;line-height:1.5;margin:0 0 24px}.info{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}.infoRow{padding:12px 0;border-bottom:1px solid #eee8df}.infoRow:last-child{border:0}.infoRow small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:850;margin-bottom:4px}.infoRow b{font-size:17px}.map{display:inline-flex;color:var(--accent);font-weight:850;margin-top:8px;text-underline-offset:3px}.rsvp{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px}.rsvp h2{font:500 31px/1 Georgia,serif;margin:0 0 6px}.member{padding:14px 0;border-bottom:1px solid #eee8df}.member:last-of-type{border-bottom:0}.member b{display:block;margin-bottom:9px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;min-height:48px;font-weight:800;font-size:15px}.choice.on{background:var(--accent);border-color:var(--accent);color:#fff}.send{margin-top:16px}.note{display:none;margin-top:12px;border-radius:12px;padding:11px 12px;background:#f6e8e4;color:#86473d;font-size:13px}.note.on{display:block}.success{text-align:center;padding:34px 0}.successMark{width:62px;height:62px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:30px;font-weight:900}.success h2{font:500 38px/1 Georgia,serif;margin:0 0 10px}.summary{margin:20px 0;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px}.summary div{padding:7px 0;border-bottom:1px solid #eee8df}.summary div:last-child{border:0}.successActions{display:grid;gap:9px}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px;color:var(--muted)}@media(min-width:700px){.coverContent{padding-left:8vw;padding-right:8vw}.btn{max-width:360px}.details{padding-top:48px}}</style></head><body><div id="loading" class="loading"><div><div style="font:500 28px Georgia,serif;color:#576548">Weddly<br><span style="font-size:18px">Smart Design</span></div><p>Cargando invitación…</p></div></div><section id="cover" class="screen cover"><div id="photoWrap" class="photos"><div class="fallback"></div></div><div class="shade"></div><div class="coverContent"><div class="brand">Weddly<span>Smart Design</span></div><div class="eyebrow" id="coverEyebrow">INVITACIÓN</div><h1 id="coverTitle">Evento</h1><p id="coverSubtitle"></p><button class="btn light" id="detailsBtn">Ver detalles</button></div></section><section id="details" class="screen"><main class="details"><div class="topBrand">Weddly<span>Smart Design</span></div><div class="eyebrow" id="detailsEyebrow">INVITACIÓN</div><h1 id="eventTitle"></h1><p class="intro" id="recipientIntro"></p><div class="info" id="eventInfo"></div><div class="rsvp" id="rsvpBox"><h2 id="rsvpTitle">¿Vienes?</h2><p class="intro" id="rsvpLead">Confírmanos vuestra asistencia.</p><div id="members"></div><div id="note" class="note"></div><button class="btn send" id="sendBtn">Enviar respuesta</button></div><div id="success" class="success" style="display:none"><div class="successMark">✓</div><h2 id="thanksTitle">¡Gracias!</h2><p class="intro" id="thanksText">Hemos recibido vuestra respuesta.</p><div id="answerSummary" class="summary"></div><div class="successActions"><button class="btn secondary" id="viewAgain">Ver invitación</button><a class="btn" id="calendarBtn" target="_top" rel="noopener">Añadir a Google Calendar</a></div></div></main></section><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-event-invite',q=new URLSearchParams(location.search),token=q.get('t')||'',es=(navigator.language||'es').toLowerCase().startsWith('es');const T=(a,b)=>es?a:b,$=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=null,answers={};function fmtDate(s){if(!s)return'';const d=new Date(s+'T12:00:00');return Number.isNaN(d.getTime())?s:d.toLocaleDateString(es?'es-ES':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function mapsUrl(ev){const x=[ev.venue,ev.address].filter(Boolean).join(', ');return x?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x):''}function addDays(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function calUrl(ev){if(!ev?.date)return'#';const basic=x=>x.replaceAll('-',''),next=basic(addDays(ev.date,1));let dates=basic(ev.date)+'/'+next;if(ev.time){const s=new Date(ev.date+'T'+ev.time+':00'),e=new Date(s.getTime()+3*3600000),f=x=>[x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';dates=f(s)+'/'+f(e)}const p=new URLSearchParams({action:'TEMPLATE',text:ev.name||T('Evento','Event'),dates,location:[ev.venue,ev.address].filter(Boolean).join(', '),details:T('Invitación de Weddly Smart Design','Weddly Smart Design invitation')});try{const z=Intl.DateTimeFormat().resolvedOptions().timeZone;if(z)p.set('ctz',z)}catch{}return'https://calendar.google.com/calendar/render?'+p.toString()}async function load(){if(!token){fail();return}try{const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(!r.ok||!x.ok)throw 0;data=x;paint()}catch{fail()}}function fail(){$('#loading').innerHTML='<div><div style="font:500 32px Georgia,serif;color:#576548">Invitación no disponible</div><p>Pideles que te reenvíen el enlace.</p></div>'}function paint(){const ev=data.event||{},p=data.invitation||{},rec=data.recipient||{},members=Array.isArray(rec.members)?rec.members:[];answers={...(rec.response||{})};document.title=(p.title||ev.name||'Evento')+' · Weddly Smart Design';$('#loading').style.display='none';const imgs=[p.heroPhoto,p.secondPhoto].filter(Boolean),w=$('#photoWrap');if(imgs.length){w.className='photos'+(imgs.length>1?' two':'');w.innerHTML=imgs.map(x=>'<img alt="" src="'+x+'">').join('')}$('#coverEyebrow').textContent=T('INVITACIÓN','INVITATION');$('#coverTitle').textContent=p.title||ev.name||T('Evento','Event');$('#coverSubtitle').textContent=p.subtitle||T('Nos encantará compartir este momento contigo.','We would love to share this moment with you.');$('#detailsEyebrow').textContent=T('DETALLES','DETAILS');$('#eventTitle').textContent=ev.name||p.title||T('Evento','Event');$('#recipientIntro').textContent=rec.label?T('Esta invitación es para '+rec.label+'.','This invitation is for '+rec.label+'.'):'';const map=mapsUrl(ev);$('#eventInfo').innerHTML=`<div class="infoRow"><small>${T('Fecha','Date')}</small><b>${safe(fmtDate(ev.date))}${ev.time?' · '+safe(ev.time):''}</b></div>${ev.venue?`<div class="infoRow"><small>${T('Lugar','Venue')}</small><b>${safe(ev.venue)}</b>${ev.address?`<div style="margin-top:4px;color:#777168">${safe(ev.address)}</div>`:''}${map?`<a class="map" target="_top" rel="noopener" href="${safe(map)}">${T('Cómo llegar','Get directions')}</a>`:''}</div>`:''}`;$('#rsvpTitle').textContent=members.length>1?T('¿Quién viene?','Who is coming?'):T('¿Vienes?','Are you coming?');$('#rsvpLead').textContent=T('Confirma la asistencia a este evento. La boda principal se gestiona por separado.','Confirm attendance for this event. The main wedding is managed separately.');$('#members').innerHTML=members.map(m=>`<div class="member" data-id="${safe(m.id)}"><b>${safe(m.name)}</b><div class="choices"><button class="choice ${answers[m.id]==='yes'?'on':''}" data-answer="yes">${T('Sí, allí estaré','Yes, I’ll be there')}</button><button class="choice ${answers[m.id]==='no'?'on':''}" data-answer="no">${T('No podré ir','I can’t make it')}</button></div></div>`).join('');$('#members').querySelectorAll('.member').forEach(row=>row.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answers[row.dataset.id]=b.dataset.answer;row.querySelectorAll('[data-answer]').forEach(x=>x.classList.toggle('on',x===b))}));$('#calendarBtn').href=calUrl(ev);$('#cover').classList.add('on');if(members.length&&members.every(m=>answers[m.id]==='yes'||answers[m.id]==='no')&&rec.responded_at)showSuccess()}function showDetails(){$('#cover').classList.remove('on');$('#details').classList.add('on');window.scrollTo(0,0)}function showSuccess(){$('#rsvpBox').style.display='none';$('#success').style.display='block';const ms=data.recipient.members||[];$('#answerSummary').innerHTML=ms.map(m=>`<div><b>${safe(m.name)}</b> · ${answers[m.id]==='yes'?T('Asiste','Attending'):T('No asiste','Not attending')}</div>`).join('')}async function submit(){const ms=data.recipient.members||[],missing=ms.filter(m=>!answers[m.id]);if(missing.length){const n=$('#note');n.textContent=T('Indica la respuesta de cada persona antes de enviar.','Answer for each person before sending.');n.classList.add('on');return}$('#sendBtn').disabled=true;$('#sendBtn').textContent=T('Enviando…','Sending…');try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'respond',token,response:answers})}),x=await r.json();if(!r.ok||!x.ok)throw 0;data.recipient.response={...answers};data.recipient.responded_at=x.responded_at;showSuccess()}catch{const n=$('#note');n.textContent=T('No se ha podido guardar. Comprueba la conexión e inténtalo de nuevo.','Could not save. Check your connection and try again.');n.classList.add('on');$('#sendBtn').disabled=false;$('#sendBtn').textContent=T('Enviar respuesta','Send response')}}$('#detailsBtn').onclick=showDetails;$('#sendBtn').onclick=submit;$('#viewAgain').onclick=()=>{$('#success').style.display='none';$('#rsvpBox').style.display='block';$('#details').classList.remove('on');$('#cover').classList.add('on');window.scrollTo(0,0)};load()})();</script></body></html>
