/* ===== AZULEJO · cerámica pintada a mano, cobalto ===== */
html[data-skin=azulejo]{--title:'Chorus',var(--script);--serif:'Lora',Georgia,serif;--label:'Lora',Georgia,serif;--num:'Lora',Georgia,serif;--label-case:uppercase;--label-track:.24em;--label-size:.68}

html[data-skin=azulejo] .moment-time{font-style:italic}
html[data-skin=azulejo] .agenda-track{left:22px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 11px)}
html[data-skin=azulejo] .moment-node{width:22px;height:22px;left:12px;top:16px;background:#fbf8f2;box-shadow:inset 0 0 0 3px #fbf8f2}
html[data-skin=azulejo] .moment.on .moment-node{background:var(--accent);box-shadow:inset 0 0 0 3px #fbf8f2,0 0 0 4px rgba(35,64,138,.14)}

/* ===== GALA · art déco, laca negra y oro ===== */
html[data-skin=gala]{--title:var(--script);--serif:'Baskerville',Georgia,serif;--label:'Adventor',Futura,sans-serif;--num:'Adventor',Futura,sans-serif;--label-case:uppercase;--label-track:.32em;--label-size:.6;--gold:linear-gradient(100deg,#6e5016 0%,#a8822f 30%,#d2b06a 48%,#9a7428 66%,#6e5016 100%)}

html[data-skin=gala] .practical-item::before{letter-spacing:.12em;color:#94712d;padding-top:4px}
html[data-skin=gala] .link{color:#7d5f22}
html[data-skin=gala] h2{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}

html[data-skin=gala] .moment-time{grid-column:1;text-align:right;align-self:center;font-size:15px;letter-spacing:.22em}
html[data-skin=gala] .moment-label{grid-column:2;grid-row:1;align-self:center;font-size:clamp(19px,5vw,23px)}

/* ===== INVERNADERO · cristal, hierro blanco y verde ===== */
html[data-skin=invernadero]{--title:'Pagella',Palatino,serif;--label:'Poppins',sans-serif;--num:'Poppins',sans-serif;--label-case:uppercase;--label-track:.3em;--label-size:.6}
html[data-skin=invernadero]{--glyph:'❦';--pr-style:lower-roman;--numeral-font:italic 400 40px/1 'Pagella',serif}
html[data-skin=invernadero] .link{font-weight:400;font-size:11.5px;letter-spacing:.22em}
html[data-skin=invernadero] h2{font-style:italic;font-size:clamp(44px,12vw,66px);letter-spacing:-.01em}
html[data-skin=invernadero] .agenda-track{left:24px;width:2px;background:rgba(61,106,81,.18);border-radius:2px}
html[data-skin=invernadero] .agenda-track::after{background:linear-gradient(#7aa56f,#3d6a51)}
html[data-skin=invernadero] .moment-node{left:9px;top:12px;width:30px;height:30px;border:0;background:none;transform:scale(0) rotate(-40deg);transform-origin:20% 80%}
html[data-skin=invernadero] .moment-node::before{content:"";position:absolute;inset:3px 3px 3px 10px;background:linear-gradient(135deg,#9cc58e,#3d6a51);border-radius:0 80% 0 80%}
html[data-skin=invernadero] .moment:nth-child(odd) .moment-node::before{inset:3px 10px 3px 3px;border-radius:80% 0 80% 0}
html[data-skin=invernadero] .moment.on .moment-node{transform:scale(1) rotate(0);background:none;box-shadow:none}

/* ===== REFLEJO · agua, crepúsculo y rosa ===== */
html[data-skin=reflejo]{--title:'Lora',Georgia,serif;--serif:'Lora',Georgia,serif;--label:'GaramondSC',Georgia,serif;--num:'Garamond',Georgia,serif;--label-track:.18em;--label-size:.9}
html[data-skin=reflejo]{--glyph:'○';--pr-style:upper-roman;--numeral-font:italic 400 38px/1 'Lora',serif}
html[data-skin=reflejo] .link{font:italic 400 17px/1.2 var(--serif);text-transform:none;letter-spacing:.02em}
html[data-skin=reflejo] h2{font-style:italic;font-size:clamp(48px,13vw,72px);position:relative;margin-bottom:46px}
html[data-skin=reflejo] h2::after{content:attr(data-text);position:absolute;left:0;right:0;top:82%;transform:scaleY(-1);opacity:.22;-webkit-mask-image:linear-gradient(to top,#000,transparent 70%);mask-image:linear-gradient(to top,#000,transparent 70%);animation:ripple 5s ease-in-out infinite;pointer-events:none;filter:blur(.6px)}
@keyframes ripple{0%,100%{transform:scaleY(-1) skewX(0)}50%{transform:scaleY(-1.06) skewX(-4deg)}}
html[data-skin=reflejo] .rule-orn{display:none}
@keyframes ring{from{transform:scale(.6);opacity:.6}to{transform:scale(1.8);opacity:0}}
html[data-skin=reflejo] .moment-node{border-radius:50%;transform:scale(.6)}
html[data-skin=reflejo] .moment.on .moment-node{transform:scale(1)}
html[data-skin=reflejo] .moment.on .moment-node::after{content:"";position:absolute;inset:-1px;border:1px solid var(--accent);border-radius:50%;animation:ring 2.6s ease-out infinite}
html[data-skin=reflejo] .moment-time{font-style:italic;font-size:21px}

/* ===== CAJA DE MÚSICA · latón, terciopelo y pentagrama ===== */
html[data-skin=caja]{--serif:'Bonum',Georgia,serif;--label:'Bonum',Georgia,serif;--num:'Bonum',Georgia,serif;--label-case:uppercase;--label-track:.26em;--label-size:.62;--brass:linear-gradient(100deg,#7e5a2a,#c99a55 35%,#f0d29a 50%,#b5853f 70%,#7e5a2a);--brass-ink:linear-gradient(100deg,#5e3f17,#9a6c2c 35%,#c79a55 50%,#8a5f26 70%,#5e3f17)}
html[data-skin=caja]{--glyph:'♪';--pr-style:upper-roman;--numeral-font:italic 400 38px/1 'Bonum',serif}
html[data-skin=caja] .practical-item::before{background:var(--brass-ink);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-skin=caja] .link{color:#7a5222}
html[data-skin=caja] h2{background:var(--brass-ink);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
html[data-skin=caja] .agenda-track{left:16px;width:22px;background:repeating-linear-gradient(to right,rgba(138,97,49,.35) 0 1px,transparent 1px 5.25px);opacity:.9}
html[data-skin=caja] .agenda-track::after{left:9px;width:4px;background:linear-gradient(#f0d29a,#b5853f);box-shadow:0 0 10px rgba(240,210,154,.8)}
html[data-skin=caja] .moment-node{border:0;background:none;transform:scale(.6);left:10px;top:6px;width:34px;height:36px}
html[data-skin=caja] .moment-node::before{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font:400 34px/1 Georgia,serif;color:rgba(138,97,49,.45)}
html[data-skin=caja] .moment.on .moment-node{background:none;box-shadow:none;transform:scale(1);animation:note 1.6s ease-in-out infinite}
html[data-skin=caja] .moment.on .moment-node::before{color:#a8782f;text-shadow:0 0 12px rgba(240,210,154,.9)}
@keyframes note{0%,100%{translate:0 0}50%{translate:0 -4px}}
html[data-skin=caja] .moment-time{font-style:italic;letter-spacing:.06em;font-size:19px}
@media(prefers-reduced-motion:reduce){html[data-skin] h2::after,html[data-skin] .moment-node,html[data-skin] .pr-icon::after{animation:none!important}}

/* ===== INVERNADERO · interior propio: tallo que crece, sobres de semillas, fotos fundidas ===== */
html.iv body{background:url(media/x11a0deeb1351572b.jpg) center top/100% auto repeat-y #f5f3ee}

.iv-fade{display:block;max-width:none!important;width:calc(100% + 60px);margin:20px -30px 0;height:300px;object-fit:cover;

function installMotion(){
 rvObs?.disconnect();

const fx=id('fx'),fctx=fx.getContext('2d');let fxOn=false,fxRaf=0,fxT0=performance.now(),parts=[],sprites=[];

const rnd=(a,b)=>a+Math.random()*(b-a);

function spawn(init){const W=innerWidth,H=innerHeight,k=FX.kind;
 if(k==='dust'||k==='rise')return {x:rnd(0,W),y:init?rnd(0,H):(k==='rise'?H+10:-10),r:rnd(.6,2.1),vy:k==='rise'?rnd(-14,-6):rnd(4,11),vx:rnd(-4,4),ph:rnd(0,6.3),tw:rnd(1.2,3)};
 if(k==='petals')return {x:rnd(-20,W),y:init?rnd(-40,H):-30,s:rnd(14,24),vy:rnd(16,30),vx:rnd(-6,10),rot:rnd(0,6.3),vr:rnd(-.8,.8),ph:rnd(0,6.3),fz:rnd(.8,1.8),im:(Math.random()*sprites.length)|0};
 if(k==='doves'||k==='butterflies'){const dir=Math.random()<.5?1:-1;return {x:dir>0?-90:W+90,y:rnd(H*.15,H*.75),dir,vx:dir*rnd(k==='doves'?48:26,k==='doves'?62:38),vy:rnd(-12,4),s:k==='doves'?rnd(46,62):rnd(26,36),ph:rnd(0,6.3),born:performance.now()}}
 return null}
function fxReset(){parts=[];const n=FX.kind==='dust'||FX.kind==='rise'?(FX.count||34):FX.kind==='petals'?(FX.count||9):0;for(let i=0;i<n;i++)parts.push(spawn(true))}
let nextFlyer=0;
function fxFrame(now){if(!fxOn){fxRaf=0;return}const W=innerWidth,H=innerHeight,dt=Math.min(.05,(now-fxT0)/1000);fxT0=now;fctx.clearRect(0,0,W,H);const k=FX.kind,t=now/1000;
 if(k==='dust'||k==='rise'){for(const p of parts){p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(t*.6+p.ph)*5)*dt;if(p.y<-12||p.y>H+12)Object.assign(p,spawn(false));const a=.35+.45*Math.max(0,Math.sin(t*p.tw+p.ph));const g=fctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,`rgba(${FX.color},${a})`);g.addColorStop(1,`rgba(${FX.color},0)`);fctx.fillStyle=g;fctx.beginPath();fctx.arc(p.x,p.y,p.r*4,0,6.3);fctx.fill()}}
 else if(k==='petals'){for(const p of parts){p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(t*.9+p.ph)*14)*dt;p.rot+=p.vr*dt;if(p.y>H+30)Object.assign(p,spawn(false));const im=sprites[p.im];if(!im?.complete)continue;fctx.save();fctx.globalAlpha=.85;fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.scale(1,Math.cos(t*p.fz+p.ph));fctx.drawImage(im,-p.s/2,-p.s/2*im.height/im.width,p.s,p.s*im.height/im.width);fctx.restore()}}
 else{ // aves o mariposas que cruzan de vez en cuando, una a una
  if(!parts.length&&now>nextFlyer){parts.push(spawn(false))}
  for(const p of parts){p.x+=p.vx*dt;p.y+=(p.vy+Math.sin(t*1.3+p.ph)*(k==='butterflies'?22:8))*dt;
   fctx.save();fctx.translate(p.x,p.y);fctx.scale(p.dir<0?-1:1,1);
   if(k==='doves'&&sprites.length){const n=sprites.length,ph=(t*4.2+p.ph)%(2*(n-1)),i=ph<n?Math.floor(ph):Math.floor(2*(n-1)-ph);const im=sprites[Math.max(0,Math.min(n-1,i))];if(im.complete){const w=p.s*im.width/170;fctx.globalAlpha=.95;fctx.drawImage(im,-w/2,-w/2*im.height/im.width,w,w*im.height/im.width)}}
   else if(sprites[0]?.complete){const im=sprites[0];fctx.scale(.35+.65*Math.abs(Math.cos(t*9+p.ph)),1);fctx.globalAlpha=.92;fctx.drawImage(im,-p.s/2,-p.s/2*im.height/im.width,p.s,p.s*im.height/im.width)}
   fctx.restore()}
  parts=parts.filter(p=>p.x>-120&&p.x<W+120);if(!parts.length&&nextFlyer<now)nextFlyer=now+(FX.every||7000)}

function setFx(on){if(!FX.kind||reduced())return;if(on===fxOn)return;fxOn=on;fx.classList.toggle('on',on);if(on){fxSize();if(!parts.length)fxReset();fxT0=performance.now();if(!fxRaf)fxRaf=requestAnimationFrame(fxFrame)}}
