 -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 80%,transparent 100%),linear-gradient(to right,transparent 0%,#000 10%,#000 90%,transparent 100%);

/* ---------- movimiento premium de las escenas interiores ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:0;transition:opacity .9s ease}

.in .motif,.motif.in{opacity:1;transform:none}
.motif.idle-rotate{animation:motifRotate 60s linear infinite}

@keyframes motifRotate{to{rotate:360deg}}
@keyframes motifFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}

.section-kicker,h2,.rule-orn{will-change:opacity}

.rv.in{opacity:1;transform:none}

@media(prefers-reduced-motion:reduce){.rv,.rv-head .section-kicker,.rv-head h2,img.feather.rv,.motif{opacity:1!important;transform:none!important;clip-path:none!important;filter:none!important;letter-spacing:.11em;transition:none!important;animation:none!important}.rv-head .rule-orn path{stroke-dashoffset:0}.rv-head .rule-orn circle{opacity:1}#fx{display:none}}
/* mientras se vuelve a ver, los textos se apartan para ver la escena entera; vuelven al terminar */

/* franjas de continuidad: quedan detrás de la primera y la última sección, sin trozos de fondo vacío */
main>img[class$="-band"]{position:relative;z-index:0}

/* ===== composición editorial sin tarjetas: numeración, filetes y adornos tipográficos ===== */
.pr-icon{display:none}

.practical-item summary{font-family:var(--label);text-transform:var(--label-case);font-size:12.5px;letter-spacing:.16em;color:var(--accent)}
.location-type{font-family:var(--label);text-transform:var(--label-case);letter-spacing:calc(var(--label-track) + .06em)}

/* ===== AZULEJO · cerámica pintada a mano, cobalto ===== */
html[data-skin=azulejo]{--title:'Chorus',var(--script);--serif:'Lora',Georgia,serif;--label:'Lora',Georgia,serif;--num:'Lora',Georgia,serif;--label-case:uppercase;--label-track:.24em;--label-size:.68}
html[data-skin=azulejo]{--glyph:'◆';--pr-style:upper-roman;--numeral-font:400 44px/1 'Chorus',serif}
html[data-skin=azulejo] h2{font-size:clamp(50px,13vw,74px);letter-spacing:.01em}
html[data-skin=azulejo] .moment-time{font-style:italic}
html[data-skin=azulejo] .agenda-track{left:22px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 11px)}
html[data-skin=azulejo] .moment-node{width:22px;height:22px;left:12px;top:16px;background:#fbf8f2;box-shadow:inset 0 0 0 3px #fbf8f2}
html[data-skin=azulejo] .moment.on .moment-node{background:var(--accent);box-shadow:inset 0 0 0 3px #fbf8f2,0 0 0 4px rgba(35,64,138,.14)}

/* ===== GALA · art déco, laca negra y oro ===== */
html[data-skin=gala]{--title:var(--script);--serif:'Baskerville',Georgia,serif;--label:'Adventor',Futura,sans-serif;--num:'Adventor',Futura,sans-serif;--label-case:uppercase;--label-track:.32em;--label-size:.6;--gold:linear-gradient(100deg,#6e5016 0%,#a8822f 30%,#d2b06a 48%,#9a7428 66%,#6e5016 100%)}
html[data-skin=gala]{--glyph:'◆';--pr-style:decimal-leading-zero;--numeral-font:400 24px/1.2 'Adventor',sans-serif}
html[data-skin=gala] .practical-item::before{letter-spacing:.12em;color:#94712d;padding-top:4px}
html[data-skin=gala] .link{color:#7d5f22}
html[data-skin=gala] h2{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
html[data-skin=gala] .agenda-list{max-width:380px}
html[data-skin=gala] .agenda-track{left:50%;background:rgba(148,113,45,.35)}
html[data-skin=gala] .agenda-track::after{background:linear-gradient(#d9bd78,#94712d)}
html[data-skin=gala] .moment{grid-template-columns:1fr 1fr;column-gap:44px;padding:16px 0;transform:translateY(12px)}
html[data-skin=gala] .moment.on{transform:none}
html[data-skin=gala] .moment-node{left:calc(50% - 9px);top:21px;width:18px;height:18px;border-color:#b8923f}
html[data-skin=gala] .moment.on .moment-node{background:#d9bd78;box-shadow:0 0 14px rgba(217,189,120,.7)}
html[data-skin=gala] .moment-time{grid-column:1;text-align:right;align-self:center;font-size:15px;letter-spacing:.22em}
html[data-skin=gala] .moment-label{grid-column:2;grid-row:1;align-self:center;font-size:clamp(19px,5vw,23px)}

/* ===== INVERNADERO · cristal, hierro blanco y verde ===== */
html[data-skin=invernadero]{--title:'Pagella',Palatino,serif;--label:'Poppins',sans-serif;--num:'Poppins',sans-serif;--label-case:uppercase;--label-track:.3em;--label-size:.6}
html[data-skin=invernadero]{--glyph:'❦';--pr-style:lower-roman;--numeral-font:italic 400 40px/1 'Pagella',serif}
html[data-skin=invernadero] .link{font-weight:400;font-size:11.5px;letter-spacing:.22em}
html[data-skin=invernadero] h2{font-style:italic;font-size:clamp(44px,12vw,66px);letter-spacing:-.01em}
html[data-skin=invernadero] .agenda-track{left:24px;width:2px;background:rgba(61,106,81,.18);border-radius:2px}
html[data-skin=invernadero] .agenda-track::after{background:linear-gradient(#7aa56f,#3d6a51)}
html[data-skin=invernadero] .moment-node{left:9px;top:12px;width:30px;height:30px;border:0;background:none;transform:scale(0) rotate(-40deg);transform-origin:20% 80%}
html[data-skin=invernadero] .moment-node::before{content:"";position:absolute;inset:3px 3px 3px 10px;background:linear-gradient(135deg,#9cc58e,#3d6a51);border-radius:0 80% 0 80%}
html[data-skin=invernadero] .moment:nth-child(odd) .moment-node::before{inset:3px 10px 3px 3px;border-radius:80% 0 80% 0}
html[data-skin=invernadero] .moment.on .moment-node{transform:scale(1) rotate(0);background:none;box-shadow:none}
html[data-skin=invernadero] .moment-time{font-weight:300;font-size:14px;letter-spacing:.24em}

/* ===== REFLEJO · agua, crepúsculo y rosa ===== */
html[data-skin=reflejo]{--title:'Lora',Georgia,serif;--serif:'Lora',Georgia,serif;--label:'GaramondSC',Georgia,serif;--num:'Garamond',Georgia,serif;--label-track:.18em;--label-size:.9}
html[data-skin=reflejo]{--glyph:'○';--pr-style:upper-roman;--numeral-font:italic 400 38px/1 'Lora',serif}
html[data-skin=reflejo] .link{font:italic 400 17px/1.2 var(--serif);text-transform:none;letter-spacing:.02em}
html[data-skin=reflejo] h2{font-style:italic;font-size:clamp(48px,13vw,72px);position:relative;margin-bottom:46px}
html[data-skin=reflejo] h2::after{content:attr(data-text);position:absolute;left:0;right:0;top:82%;transform:scaleY(-1);opacity:.22;-webkit-mask-image:linear-gradient(to top,#000,transparent 70%);mask-image:linear-gradient(to top,#000,transparent 70%);animation:ripple 5s ease-in-out infinite;pointer-events:none;filter:blur(.6px)}
@keyframes ripple{0%,100%{transform:scaleY(-1) skewX(0)}50%{transform:scaleY(-1.06) skewX(-4deg)}}
html[data-skin=reflejo] .rule-orn{display:none}
@keyframes ring{from{transform:scale(.6);opacity:.6}to{transform:scale(1.8);opacity:0}}
html[data-skin=reflejo] .moment-node{border-radius:50%;transform:scale(.6)}
html[data-skin=reflejo] .moment.on .moment-node{transform:scale(1)}
html[data-skin=reflejo] .moment.on .moment-node::after{content:"";position:absolute;inset:-1px;border:1px solid var(--accent);border-radius:50%;animation:ring 2.6s ease-out infinite}
html[data-skin=reflejo] .moment-time{font-style:italic;font-size:21px}

/* ===== CAJA DE MÚSICA · latón, terciopelo y pentagrama ===== */
html[data-skin=caja]{--serif:'Bonum',Georgia,serif;--label:'Bonum',Georgia,serif;--num:'Bonum',Georgia,serif;--label-case:uppercase;--label-track:.26em;--label-size:.62;--brass:linear-gradient(100deg,#7e5a2a,#c99a55 35%,#f0d29a 50%,#b5853f 70%,#7e5a2a);--brass-ink:linear-gradient(100deg,#5e3f17,#9a6c2c 35%,#c79a55 50%,#8a5f26 70%,#5e3f17)}
html[data-skin=caja]{--glyph:'♪';--pr-style:upper-roman;--numeral-font:italic 400 38px/1 'Bonum',serif}
html[data-skin=caja] .practical-item::before{background:var(--brass-ink);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-skin=caja] .link{color:#7a5222}
html[data-skin=caja] h2{background:var(--brass-ink);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
html[data-skin=caja] .agenda-track{left:16px;width:22px;background:repeating-linear-gradient(to right,rgba(138,97,49,.35) 0 1px,transparent 1px 5.25px);opacity:.9}
html[data-skin=caja] .agenda-track::after{left:9px;width:4px;background:linear-gradient(#f0d29a,#b5853f);box-shadow:0 0 10px rgba(240,210,154,.8)}
html[data-skin=caja] .moment-node{border:0;background:none;transform:scale(.6);left:10px;top:6px;width:34px;height:36px}
html[data-skin=caja] .moment-node::before{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font:400 34px/1 Georgia,serif;color:rgba(138,97,49,.45)}
html[data-skin=caja] .moment.on .moment-node{background:none;box-shadow:none;transform:scale(1);animation:note 1.6s ease-in-out infinite}
html[data-skin=caja] .moment.on .moment-node::before{color:#a8782f;text-shadow:0 0 12px rgba(240,210,154,.9)}
@keyframes note{0%,100%{translate:0 0}50%{translate:0 -4px}}
html[data-skin=caja] .moment-time{font-style:italic;letter-spacing:.06em;font-size:19px}
@media(prefers-reduced-motion:reduce){html[data-skin] h2::after,html[data-skin] .moment-node,html[data-skin] .pr-icon::after{animation:none!important}}

/* ===== GALA · interior propio: reloj déco, tiques de guardarropa, fotos fundidas ===== */
html.ga body{background:url(media/x216a685f63f05b39.jpg) center top/100% auto repeat-y #f4ede1}
html.ga [data-bg]{background:none!important;min-height:0!important;display:block;padding:38px 30px 32px!important;color:#2d2618;font:400 19px/1.5 'Baskerville',Georgia,serif}
.ga-band{display:block;width:100%;height:auto;max-width:none!important;margin:0}
.ga-in{position:relative;max-width:420px;margin:0 auto;text-align:center}
.ga-kicker{font:400 10.5px/1.2 'Adventor',sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#7d5f22;margin:0 0 4px}
.ga-title{font:400 54px/1.32 'Pinyon',cursive;margin:0 0 4px;padding:0 .12em .12em;background:linear-gradient(100deg,#6e5016 0%,#a8822f 30%,#d2b06a 48%,#9a7428 66%,#6e5016 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ga-p{font-size:19.5px;line-height:1.6;max-width:29ch;margin:0 auto;white-space:pre-line;overflow-wrap:anywhere}
.ga-rv{opacity:0;transform:translateY(16px);transition:opacity 1.1s ease,transform 1.3s cubic-bezier(.2,.8,.2,1)}
.ga-rv.in{opacity:1;transform:none}
/* abanico déco entre secciones: se dibuja al llegar */
.ga-fan{display:block;width:120px;height:44px;margin:0 auto 16px;color:#a8822f}
.ga-fan path{fill:none;stroke:currentColor;stroke-width:.9;stroke-dasharray:80;stroke-dashoffset:80;transition:stroke-dashoffset 1.6s ease}
.ga-fan.in path{stroke-dashoffset:0}
.ga-rule{display:block;width:150px;height:12px;margin:2px auto 22px;color:#a8822f}
.ga-rule path{fill:none;stroke:currentColor;stroke-width:.9}
/* fotos fundidas */
.ga-fade{display:block;max-width:none!important;width:calc(100% + 60px);margin:20px -30px 0;height:300px;object-fit:cover;
 -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 76%,transparent 100%),linear-gradient(to right,transparent 0%,#000 14%,#000 86%,transparent 100%);-webkit-mask-composite:source-in;
 mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 76%,transparent 100%),linear-gradient(to right,transparent 0%,#000 14%,#000 86%,transparent 100%);mask-composite:intersect}
.ga-fade[data-fit=full]{object-fit:contain;height:auto;max-height:420px;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 88%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 88%,transparent 100%)}
.ga-fade.ga-rv{transform:scale(1.05);filter:blur(4px);transition:opacity 1.6s ease,transform 2.6s cubic-bezier(.2,.8,.2,1),filter 1.6s}
.ga-fade.ga-rv.in{transform:none;filter:none}
/* lugares */
.ga-venue{padding:8px 0 22px}.ga-venue+.ga-venue{padding-top:26px;background:linear-gradient(90deg,transparent,rgba(168,130,47,.55),transparent) top/70% 1px no-repeat}
.ga-v-k{font:400 10.5px/1 'Adventor',sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#7d5f22}
.ga-v-name{font:400 29px/1.15 'Baskerville',Georgia,serif;margin:10px 0 4px;overflow-wrap:anywhere}
.ga-v-time{font:400 15px/1 'Adventor',sans-serif;letter-spacing:.24em;color:#7d5f22}
.ga-v-addr{font-style:italic;color:#6b5a3e;font-size:17.5px;margin-top:6px;overflow-wrap:anywhere}
.ga-links{display:flex;flex-wrap:wrap;justify-content:center;gap:0 22px;margin-top:4px}
html.ga a.link{display:inline-flex;align-items:center;min-height:44px;padding:12px 0 6px;border:0;border-bottom:1px solid rgba(168,130,47,.55);border-radius:0;background:none;font:400 10.5px/1 'Adventor',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#7d5f22;text-decoration:none}
html.ga a.link::after{content:none}
.ga-dress{margin:22px auto 0;font-style:italic;color:#6b5a3e}
/* agenda: reloj déco cuya aguja avanza */
.ga-clock{position:relative;width:min(250px,72vw);aspect-ratio:1;margin:18px auto 0}
.ga-clock svg{position:absolute;inset:0;width:100%;height:100%}
.ga-dial circle{fill:none;stroke:#a8822f}
.ga-dial line{stroke:#a8822f}
.ga-dial text{font:400 9px 'Adventor',sans-serif;fill:#7d5f22;letter-spacing:.1em}
.ga-hand{transition:transform 1.4s cubic-bezier(.3,.9,.25,1);transform-origin:50% 50%}
.ga-hand line{stroke:#2d2618;stroke-width:1.4;stroke-linecap:round}
.ga-hand circle{fill:#2d2618}
.ga-mk{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;background:none;padding:0;cursor:pointer}
.ga-mk::before{content:"";position:absolute;left:50%;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;transform:rotate(45deg) scale(.8);background:#f4ede1;box-shadow:inset 0 0 0 1px #a8822f;transition:transform .5s cubic-bezier(.3,1.6,.5,1),background .4s,box-shadow .4s}
.ga-mk.on::before{background:#c9a35a}
.ga-mk.cur::before{transform:rotate(45deg) scale(1.35);background:#a8822f;box-shadow:0 0 12px rgba(210,176,106,.85)}
.ga-mk:focus-visible{outline:1px solid #a8822f;outline-offset:-8px;border-radius:50%}
.ga-now{display:grid;margin-top:18px}
.ga-now div{grid-area:1/1;opacity:0;transform:translateY(8px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.ga-now div.on{opacity:1;transform:none}
.ga-tm{display:block;font:400 15px/1 'Adventor',sans-serif;letter-spacing:.3em;color:#7d5f22}
.ga-lb{display:block;font:400 42px/1.2 'Pinyon',cursive;color:#2d2618;margin-top:6px;overflow-wrap:anywhere}
.ga-tap{font-style:italic;color:#6b5a3e;font-size:15.5px;margin:8px 0 0}
/* detalles: tiques dorados de guardarropa */
.ga-tix{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:330px;margin:14px auto 0}
.ga-tk{position:relative;height:84px;border:0;padding:0;cursor:pointer;color:#2d2618;background:#fbf6ea;
 -webkit-mask:radial-gradient(circle 8px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
 mask:radial-gradient(circle 8px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 8px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
 box-shadow:inset 0 0 0 1px rgba(168,130,47,.7),inset 0 0 0 4px #fbf6ea,inset 0 0 0 5px rgba(168,130,47,.35);transition:transform .7s cubic-bezier(.2,.8,.2,1),background .5s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ga-tk.solo{grid-column:1/-1}
.ga-no{font:400 10px/1 'Adventor',sans-serif;letter-spacing:.4em;color:#a8822f}
.ga-tl{font:400 11px/1.2 'Adventor',sans-serif;letter-spacing:.26em;text-transform:uppercase}
.ga-tk[aria-expanded=true]{background:#121114;color:#e9d6a8;transform:translateY(-4px);box-shadow:inset 0 0 0 1px rgba(210,176,106,.8),inset 0 0 0 4px #121114,inset 0 0 0 5px rgba(210,176,106,.4)}
.ga-tk:focus-visible{outline:2px solid #a8822f;outline-offset:3px}
.ga-hint{font-style:italic;color:#6b5a3e;font-size:16px;margin:14px 0 0}
.ga-tray{max-width:340px;margin:0 auto;overflow:hidden;height:0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.ga-tray-in{margin-top:16px;padding:24px 22px 20px;text-align:center;background:#121114;color:#efe3c8;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
.ga-tray-in h3{margin:0 0 8px;font:400 38px/1.2 'Pinyon',cursive;background:linear-gradient(100deg,#b8923f,#f1dca0 50%,#b8923f);-webkit-background-clip:text;background-clip:text;color:transparent}
.ga-tray-in p{margin:0 0 6px;font-size:18.5px;overflow-wrap:anywhere;white-space:pre-line}
.ga-tt{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 30px;margin:10px 0}
.ga-tt span{display:flex;flex-direction:column;font:400 10px/1.5 'Adventor',sans-serif;letter-spacing:.32em;text-transform:uppercase;color:#d2b06a}
.ga-tt b{font:400 22px/1.1 'Adventor',sans-serif;color:#fff6e2;letter-spacing:.06em}
html.ga .ga-tray-in a.link{color:#e9d6a8;border-bottom-color:rgba(210,176,106,.6)}
.ga-tray-in details{margin-top:4px}.ga-tray-in summary{display:inline-flex;align-items:center;min-height:44px;cursor:pointer;list-style:none;font:400 10.5px/1 'Adventor',sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#e9d6a8;border-bottom:1px solid rgba(210,176,106,.6)}
.ga-tray-in summary::-webkit-details-marker{display:none}
/* galería */
html.ga #gallery-items{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;width:calc(100% + 60px);max-width:none;margin:8px -30px 0;overscroll-behavior-x:contain}
html.ga #gallery-items::-webkit-scrollbar{display:none}
html.ga #gallery-items img{flex:0 0 100%;width:100%!important;min-width:100%;max-width:none!important;margin:0!important;height:360px;scroll-snap-align:center;scroll-snap-stop:always}
.ga-dots{display:flex;justify-content:center;gap:2px;margin-top:4px}
html.ga .gallery-dot{width:42px;height:42px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
html.ga .gallery-dot::before{content:"";width:7px;height:7px;transform:rotate(45deg);box-shadow:inset 0 0 0 1px #a8822f}
html.ga .gallery-dot[aria-current=true]::before{background:#a8822f}
@media(max-width:360px){.ga-title{font-size:46px}.ga-lb{font-size:35px}.ga-v-name{font-size:25px}}
@media(prefers-reduced-motion:reduce){.ga-rv,.ga-fade.ga-rv{opacity:1;transform:none;filter:none;transition:none}.ga-fan path{stroke-dashoffset:0}.ga-hand{transition:none}}
/* === repaso v14 === tipografía de la portada, lugar tipo carta sobre aguada, fotos con borde de acuarela */
html.ga [data-bg]{font:400 20px/1.5 'Garamond',Georgia,serif;color:#2d2618}
.ga-kicker{font:400 15.5px/1.2 'GaramondSC',Georgia,serif!important;letter-spacing:.16em!important;text-transform:lowercase!important;color:#6b5a3e!important}
.ga-title{font:400 44px/1.3 'Pinyon',cursive!important;letter-spacing:0!important;color:#8a6a24!important;background:none!important;-webkit-text-fill-color:currentColor;margin:0 0 14px!important;padding:0 .1em .1em!important;white-space:normal}
.ga-title::after{content:none!important}
.ga-gap{display:block;height:34px}
.ga-lb{font:italic 400 30px/1.2 'Garamond',Georgia,serif!important;color:#2d2618!important;letter-spacing:0!important}
.ga-tray-in h3{font:italic 400 28px/1.2 'Garamond',Georgia,serif!important;-webkit-text-fill-color:currentColor;background:none!important}
.ga-tray-in h3{color:inherit}
.ga-places{position:relative;max-width:360px;margin:26px auto 0;padding:34px 18px 30px}
.ga-places::before{content:"";position:absolute;inset:0 -6px;background:url(media/x24e0075371f6f928.webp) center/100% 100% no-repeat;pointer-events:none}
.ga-venue{position:relative;display:grid;grid-template-columns:76px 1px 1fr;gap:0 16px;align-items:start;text-align:left;padding:12px 0!important;background:none!important}
.ga-venue::before{content:none!important}
.ga-venue::after{content:"";grid-column:2;grid-row:1;width:1px;height:100%;background:linear-gradient(transparent,#8a6a2488 20%,#8a6a2488 80%,transparent)}
.ga-v-time{grid-column:1;grid-row:1;text-align:right;font:400 26px/1.1 'Garamond',Georgia,serif!important;letter-spacing:.02em!important;color:#8a6a24!important;padding-top:20px}
.ga-v-info{grid-column:3;grid-row:1}
.ga-v-k{display:block;font:400 15px/1 'GaramondSC',Georgia,serif!important;letter-spacing:.16em!important;text-transform:lowercase!important;color:#6b5a3e!important}
.ga-v-name{font:italic 400 25px/1.2 'Garamond',Georgia,serif!important;color:#2d2618!important;margin:6px 0 2px!important;overflow-wrap:anywhere}
.ga-v-addr{color:#6b5a3e;font-size:17px;font-style:normal;margin:0;overflow-wrap:anywhere}
.ga-places .ga-links{justify-content:flex-start;gap:0 18px}
.ga-fade{width:calc(100% + 40px)!important;margin:22px -20px 0!important;-webkit-mask:url(media/xaf8be81dd42054fa.png) center/100% 100% no-repeat!important;mask:url(media/xaf8be81dd42054fa.png) center/100% 100% no-repeat!important}
.ga-fade.ga-rv.in,#gallery-items .ga-fade{filter:sepia(.26) saturate(.8) brightness(1.03) contrast(.93)}
html.ga #gallery-items{width:calc(100% + 40px);margin:8px -20px 0}
@media(max-width:360px){.ga-title{font-size:40px!important}.ga-lb{font-size:26px!important}.ga-v-name{font-size:22px!important}.ga-venue{grid-template-columns:62px 1px 1fr;gap:0 12px}.ga-v-time{font-size:22px!important}}
html.ga a.link{font:400 15px/1 'GaramondSC',Georgia,serif!important;letter-spacing:.16em!important;text-transform:lowercase!important;font-style:normal!important}

.ga-no{display:block;width:7px;height:7px;transform:rotate(45deg);box-shadow:inset 0 0 0 1px #a8822f}

 if(k==='doves'||k==='butterflies'){const dir=Math.random()<.5?1:-1;return {x:dir>0?-90:W+90,y:rnd(H*.15,H*.75),dir,vx:dir*rnd(k==='doves'?48:26,k==='doves'?62:38),vy:rnd(-12,4),s:k==='doves'?rnd(46,62):rnd(26,36),ph:rnd(0,6.3),born:performance.now()}}
 return null}
function fxReset(){parts=[];const n=FX.kind==='dust'||FX.kind==='rise'?(FX.count||34):FX.kind==='petals'?(FX.count||9):0;for(let i=0;i<n;i++)parts.push(spawn(true))}
let nextFlyer=0;
function fxFrame(now){if(!fxOn){fxRaf=0;return}const W=innerWidth,H=innerHeight,dt=Math.min(.05,(now-fxT0)/1000);fxT0=now;fctx.clearRect(0,0,W,H);const k=FX.kind,t=now/1000;
 if(k==='dust'||k==='rise'){for(const p of parts){p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(t*.6+p.ph)*5)*dt;if(p.y<-12||p.y>H+12)Object.assign(p,spawn(false));const a=.35+.45*Math.max(0,Math.sin(t*p.tw+p.ph));const g=fctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,`rgba(${FX.color},${a})`);g.addColorStop(1,`rgba(${FX.color},0)`);fctx.fillStyle=g;fctx.beginPath();fctx.arc(p.x,p.y,p.r*4,0,6.3);fctx.fill()}}
 else if(k==='petals'){for(const p of parts){p.y+=p.vy*dt;p.x+=(p.vx+Math.sin(t*.9+p.ph)*14)*dt;p.rot+=p.vr*dt;if(p.y>H+30)Object.assign(p,spawn(false));const im=sprites[p.im];if(!im?.complete)continue;fctx.save();fctx.globalAlpha=.85;fctx.translate(p.x,p.y);fctx.rotate(p.rot);fctx.scale(1,Math.cos(t*p.fz+p.ph));fctx.drawImage(im,-p.s/2,-p.s/2*im.height/im.width,p.s,p.s*im.height/im.width);fctx.restore()}}
 else{ // aves o mariposas que cruzan de vez en cuando, una a una
  if(!parts.length&&now>nextFlyer){parts.push(spawn(false))}
  for(const p of parts){p.x+=p.vx*dt;p.y+=(p.vy+Math.sin(t*1.3+p.ph)*(k==='butterflies'?22:8))*dt;
   fctx.save();fctx.translate(p.x,p.y);fctx.scale(p.dir<0?-1:1,1);
   if(k==='doves'&&sprites.length){const n=sprites.length,ph=(t*4.2+p.ph)%(2*(n-1)),i=ph<n?Math.floor(ph):Math.floor(2*(n-1)-ph);const im=sprites[Math.max(0,Math.min(n-1,i))];if(im.complete){const w=p.s*im.width/170;fctx.globalAlpha=.95;fctx.drawImage(im,-w/2,-w/2*im.height/im.width,w,w*im.height/im.width)}}
   else if(sprites[0]?.complete){const im=sprites[0];fctx.scale(.35+.65*Math.abs(Math.cos(t*9+p.ph)),1);fctx.globalAlpha=.92;fctx.drawImage(im,-p.s/2,-p.s/2*im.height/im.width,p.s,p.s*im.height/im.width)}
   fctx.restore()}
  parts=parts.filter(p=>p.x>-120&&p.x<W+120);if(!parts.length&&nextFlyer<now)nextFlyer=now+(FX.every||7000)}
 fxRaf=requestAnimationFrame(fxFrame)}
function setFx(on){if(!FX.kind||reduced())return;if(on===fxOn)return;fxOn=on;fx.classList.toggle('on',on);if(on){fxSize();if(!parts.length)fxReset();fxT0=performance.now();if(!fxRaf)fxRaf=requestAnimationFrame(fxFrame)}}
