.location-links{gap:4px 24px}
.practical-item summary{font-family:var(--label);text-transform:var(--label-case);font-size:12.5px;letter-spacing:.16em;color:var(--accent)}

.time-value,.location-time{font-family:var(--num)}

/* ===== AZULEJO · cerámica pintada a mano, cobalto ===== */
html[data-skin=azulejo]{--title:'Chorus',var(--script);--serif:'Lora',Georgia,serif;--label:'Lora',Georgia,serif;--num:'Lora',Georgia,serif;--label-case:uppercase;--label-track:.24em;--label-size:.68}
html[data-skin=azulejo]{--glyph:'◆';--pr-style:upper-roman;--numeral-font:400 44px/1 'Chorus',serif}
html[data-skin=azulejo] h2{font-size:clamp(50px,13vw,74px);letter-spacing:.01em}
html[data-skin=azulejo] .moment-time{font-style:italic}
html[data-skin=azulejo] .agenda-track{left:22px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 11px)}
html[data-skin=azulejo] .moment-node{width:22px;height:22px;left:12px;top:16px;background:#fbf8f2;box-shadow:inset 0 0 0 3px #fbf8f2}
html[data-skin=azulejo] .moment.on .moment-node{background:var(--accent);box-shadow:inset 0 0 0 3px #fbf8f2,0 0 0 4px rgba(35,64,138,.14)}

/* ===== GALA · art déco, laca negra y oro ===== */
html[data-skin=gala]{--title:var(--script);--serif:'Baskerville',Georgia,serif;--label:'Adventor',Futura,sans-serif;--num:'Adventor',Futura,sans-serif;--label-case:uppercase;--label-track:.32em;--label-size:.6;--gold:linear-gradient(100deg,#6e5016 0%,#a8822f 30%,#d2b06a 48%,#9a7428 66%,#6e5016 100%)}
html[data-skin=gala]{--glyph:'◆';--pr-style:decimal-leading-zero;--numeral-font:400 24px/1.2 'Adventor',sans-serif}
html[data-skin=gala] .practical-item::before{letter-spacing:.12em;color:#94712d;padding-top:4px}
html[data-skin=gala] .link{color:#7d5f22}
html[data-skin=gala] h2{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
html[data-skin=gala] .agenda-list{max-width:380px}
html[data-skin=gala] .agenda-track{left:50%;background:rgba(148,113,45,.35)}
html[data-skin=gala] .agenda-track::after{background:linear-gradient(#d9bd78,#94712d)}
html[data-skin=gala] .moment{grid-template-columns:1fr 1fr;column-gap:44px;padding:16px 0;transform:translateY(12px)}
html[data-skin=gala] .moment.on{transform:none}
html[data-skin=gala] .moment-node{left:calc(50% - 9px);top:21px;width:18px;height:18px;border-color:#b8923f}
html[data-skin=gala] .moment.on .moment-node{background:#d9bd78;box-shadow:0 0 14px rgba(217,189,120,.7)}
html[data-skin=gala] .moment-time{grid-column:1;text-align:right;align-self:center;font-size:15px;letter-spacing:.22em}
html[data-skin=gala] .moment-label{grid-column:2;grid-row:1;align-self:center;font-size:clamp(19px,5vw,23px)}

/* ===== INVERNADERO · cristal, hierro blanco y verde ===== */
html[data-skin=invernadero]{--title:'Pagella',Palatino,serif;--label:'Poppins',sans-serif;--num:'Poppins',sans-serif;--label-case:uppercase;--label-track:.3em;--label-size:.6}
html[data-skin=invernadero]{--glyph:'❦';--pr-style:lower-roman;--numeral-font:italic 400 40px/1 'Pagella',serif}
html[data-skin=invernadero] .link{font-weight:400;font-size:11.5px;letter-spacing:.22em}
html[data-skin=invernadero] h2{font-style:italic;font-size:clamp(44px,12vw,66px);letter-spacing:-.01em}
html[data-skin=invernadero] .agenda-track{left:24px;width:2px;background:rgba(61,106,81,.18);border-radius:2px}
html[data-skin=invernadero] .agenda-track::after{background:linear-gradient(#7aa56f,#3d6a51)}
html[data-skin=invernadero] .moment-node{left:9px;top:12px;width:30px;height:30px;border:0;background:none;transform:scale(0) rotate(-40deg);transform-origin:20% 80%}
html[data-skin=invernadero] .moment-node::before{content:"";position:absolute;inset:3px 3px 3px 10px;background:linear-gradient(135deg,#9cc58e,#3d6a51);border-radius:0 80% 0 80%}
html[data-skin=invernadero] .moment:nth-child(odd) .moment-node::before{inset:3px 10px 3px 3px;border-radius:80% 0 80% 0}
html[data-skin=invernadero] .moment.on .moment-node{transform:scale(1) rotate(0);background:none;box-shadow:none}
html[data-skin=invernadero] .moment-time{font-weight:300;font-size:14px;letter-spacing:.24em}

/* ===== REFLEJO · agua, crepúsculo y rosa ===== */
html[data-skin=reflejo]{--title:'Lora',Georgia,serif;--serif:'Lora',Georgia,serif;--label:'GaramondSC',Georgia,serif;--num:'Garamond',Georgia,serif;--label-track:.18em;--label-size:.9}
html[data-skin=reflejo]{--glyph:'○';--pr-style:upper-roman;--numeral-font:italic 400 38px/1 'Lora',serif}
html[data-skin=reflejo] .link{font:italic 400 17px/1.2 var(--serif);text-transform:none;letter-spacing:.02em}
html[data-skin=reflejo] h2{font-style:italic;font-size:clamp(48px,13vw,72px);position:relative;margin-bottom:46px}
html[data-skin=reflejo] h2::after{content:attr(data-text);position:absolute;left:0;right:0;top:82%;transform:scaleY(-1);opacity:.22;-webkit-mask-image:linear-gradient(to top,#000,transparent 70%);mask-image:linear-gradient(to top,#000,transparent 70%);animation:ripple 5s ease-in-out infinite;pointer-events:none;filter:blur(.6px)}
@keyframes ripple{0%,100%{transform:scaleY(-1) skewX(0)}50%{transform:scaleY(-1.06) skewX(-4deg)}}
html[data-skin=reflejo] .rule-orn{display:none}
@keyframes ring{from{transform:scale(.6);opacity:.6}to{transform:scale(1.8);opacity:0}}
html[data-skin=reflejo] .moment-node{border-radius:50%;transform:scale(.6)}
html[data-skin=reflejo] .moment.on .moment-node{transform:scale(1)}
html[data-skin=reflejo] .moment.on .moment-node::after{content:"";position:absolute;inset:-1px;border:1px solid var(--accent);border-radius:50%;animation:ring 2.6s ease-out infinite}
html[data-skin=reflejo] .moment-time{font-style:italic;font-size:21px}

/* ===== CAJA DE MÚSICA · latón, terciopelo y pentagrama ===== */
html[data-skin=caja]{--serif:'Bonum',Georgia,serif;--label:'Bonum',Georgia,serif;--num:'Bonum',Georgia,serif;--label-case:uppercase;--label-track:.26em;--label-size:.62;--brass:linear-gradient(100deg,#7e5a2a,#c99a55 35%,#f0d29a 50%,#b5853f 70%,#7e5a2a);--brass-ink:linear-gradient(100deg,#5e3f17,#9a6c2c 35%,#c79a55 50%,#8a5f26 70%,#5e3f17)}
html[data-skin=caja]{--glyph:'♪';--pr-style:upper-roman;--numeral-font:italic 400 38px/1 'Bonum',serif}
html[data-skin=caja] .practical-item::before{background:var(--brass-ink);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-skin=caja] .link{color:#7a5222}
html[data-skin=caja] h2{background:var(--brass-ink);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
html[data-skin=caja] .agenda-track{left:16px;width:22px;background:repeating-linear-gradient(to right,rgba(138,97,49,.35) 0 1px,transparent 1px 5.25px);opacity:.9}
html[data-skin=caja] .agenda-track::after{left:9px;width:4px;background:linear-gradient(#f0d29a,#b5853f);box-shadow:0 0 10px rgba(240,210,154,.8)}
html[data-skin=caja] .moment-node{border:0;background:none;transform:scale(.6);left:10px;top:6px;width:34px;height:36px}
html[data-skin=caja] .moment-node::before{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font:400 34px/1 Georgia,serif;color:rgba(138,97,49,.45)}
html[data-skin=caja] .moment.on .moment-node{background:none;box-shadow:none;transform:scale(1);animation:note 1.6s ease-in-out infinite}
html[data-skin=caja] .moment.on .moment-node::before{color:#a8782f;text-shadow:0 0 12px rgba(240,210,154,.9)}
@keyframes note{0%,100%{translate:0 0}50%{translate:0 -4px}}
html[data-skin=caja] .moment-time{font-style:italic;letter-spacing:.06em;font-size:19px}
@media(prefers-reduced-motion:reduce){html[data-skin] h2::after,html[data-skin] .moment-node,html[data-skin] .pr-icon::after{animation:none!important}}

/* ===== REFLEJO · interior propio: velas flotantes sobre el agua, espejos, fotos fundidas ===== */
html.rf body{background:url(./media/266bafaa5084bf36eeaf33a4.jpg) center top/100% auto repeat-y #f3eee9}
html.rf [data-bg]{background:none!important;min-height:0!important;display:block;padding:38px 30px 32px!important;color:#3b2f33;font:400 18.5px/1.55 'Lora',Georgia,serif}
.rf-band{display:block;width:100%;height:auto;max-width:none!important;margin:0}
.rf-in{position:relative;max-width:420px;margin:0 auto;text-align:center}
.rf-kicker{font:400 15px/1.2 'GaramondSC',Georgia,serif;letter-spacing:.2em;color:#8a5a63;margin:0 0 2px;text-transform:lowercase}
.rf-title{position:relative;white-space:nowrap;font:italic 400 clamp(32px,10vw,54px)/1.15 'Lora',Georgia,serif;color:#3b2f33;margin:0 0 40px;letter-spacing:-.01em}
.rf-title::after{content:attr(data-text);position:absolute;left:0;right:0;top:86%;transform:scaleY(-1);opacity:.16;filter:blur(.7px);pointer-events:none;
 -webkit-mask-image:linear-gradient(to top,#000,transparent 72%);mask-image:linear-gradient(to top,#000,transparent 72%)}
.rf-p{font-size:19px;line-height:1.62;max-width:29ch;margin:0 auto;white-space:pre-line;overflow-wrap:anywhere}
.rf-rv{opacity:0;transform:translateY(16px);transition:opacity 1.1s ease,transform 1.3s cubic-bezier(.2,.8,.2,1)}
.rf-rv.in{opacity:1;transform:none}
/* entre secciones: un pétalo se posa y deja una onda */
.rf-drop{position:relative;display:block;width:80px;height:34px;margin:0 auto 14px}
.rf-drop i{position:absolute;left:50%;top:4px;width:26px;height:24px;margin-left:-13px;background:url(./media/312d8dc6a17e3ea5d2eca440.webp) center/contain no-repeat;transform:translateY(-16px) rotate(-30deg);opacity:0}
.rf-drop::after{content:"";position:absolute;left:50%;top:24px;width:70px;height:10px;margin-left:-35px;border-radius:50%;box-shadow:0 0 0 1px rgba(138,90,99,.28);transform:scale(.2);opacity:0}
.rf-drop.in i{transform:none;opacity:1;transition:transform 2s cubic-bezier(.2,.8,.2,1),opacity 1s}
.rf-drop.in::after{transform:scale(1);opacity:1;transition:transform 2.4s 1.2s cubic-bezier(.2,.8,.2,1),opacity 1s 1.2s}
/* fotos fundidas */
.rf-fade{display:block;max-width:none!important;width:calc(100% + 60px);margin:20px -30px 0;height:300px;object-fit:cover;
 -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 76%,transparent 100%),linear-gradient(to right,transparent 0%,#000 14%,#000 86%,transparent 100%);-webkit-mask-composite:source-in;
 mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 76%,transparent 100%),linear-gradient(to right,transparent 0%,#000 14%,#000 86%,transparent 100%);mask-composite:intersect}
.rf-fade[data-fit=full]{object-fit:contain;height:auto;max-height:420px;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 88%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 88%,transparent 100%)}
.rf-fade.rf-rv{transform:scale(1.05);filter:blur(4px);transition:opacity 1.6s ease,transform 2.6s cubic-bezier(.2,.8,.2,1),filter 1.6s}
.rf-fade.rf-rv.in{transform:none;filter:none}
/* lugares */
.rf-venue{padding:8px 0 22px}.rf-venue+.rf-venue{padding-top:24px;background:radial-gradient(closest-side,rgba(138,90,99,.35),transparent) top center/60% 1px no-repeat}
.rf-v-k{font:400 15px/1 'GaramondSC',Georgia,serif;letter-spacing:.2em;text-transform:lowercase;color:#8a5a63}
.rf-v-name{font:italic 400 30px/1.15 'Lora',Georgia,serif;margin:8px 0 4px;overflow-wrap:anywhere}
.rf-v-time{font:400 22px/1.1 'Garamond',Georgia,serif;letter-spacing:.06em;color:#6d5c61}
.rf-v-addr{color:#6d5c61;font-size:17px;margin-top:4px;overflow-wrap:anywhere}
.rf-links{display:flex;flex-wrap:wrap;justify-content:center;gap:0 24px;margin-top:2px}
html.rf a.link{display:inline-flex;align-items:center;min-height:44px;padding:10px 0 4px;border:0;border-bottom:1px solid rgba(138,90,99,.4);border-radius:0;background:none;font:italic 400 17px/1.2 'Lora',Georgia,serif;letter-spacing:.02em;text-transform:none;color:#8a5a63;text-decoration:none}
html.rf a.link::after{content:none}
.rf-dress{margin:22px auto 0;font-style:italic;color:#6d5c61}
/* agenda: velas flotantes que se encienden y se reflejan en el agua */
.rf-pond{position:relative;display:flex;justify-content:center;gap:clamp(4px,3vw,16px);margin:0 auto;padding-bottom:30px}
.rf-pond::after{content:"";position:absolute;left:4%;right:4%;top:calc(100% - 34px);height:1px;background:linear-gradient(90deg,transparent,rgba(138,90,99,.35),transparent)}
.rf-cd{position:relative;width:44px;height:56px;border:0;padding:0;background:none;cursor:pointer}
.rf-cd .off,.rf-cd .lit{animation:rf-bob 5s ease-in-out infinite;animation-delay:var(--d)}
.rf-cd span{position:absolute;left:3px;right:3px;top:12px;bottom:4px;background:center bottom/contain no-repeat}
.rf-cd .off{background-image:url(./media/e947f881ff866cac47ad2858.webp)}
.rf-cd .lit{background-image:url(./media/f8155d5cee309257df688356.webp);opacity:0;transition:opacity .9s ease}
.rf-cd .rx{top:calc(100% - 4px);bottom:-36px;transform:scaleY(-1);opacity:.28;filter:blur(1px);background-image:url(./media/e947f881ff866cac47ad2858.webp);-webkit-mask-image:linear-gradient(to bottom,transparent 30%,#000);mask-image:linear-gradient(to bottom,transparent 30%,#000)}
.rf-cd::before{content:"";position:absolute;left:50%;top:0;width:40px;height:40px;margin-left:-20px;border-radius:50%;background:radial-gradient(rgba(255,196,120,.55),rgba(255,196,120,0) 70%);opacity:0;transition:opacity 1.2s}
.rf-cd.on .lit{opacity:1}.rf-cd.on .rx{background-image:url(./media/f8155d5cee309257df688356.webp)}
.rf-cd.cur::before{opacity:1}
.rf-cd.cur .off,.rf-cd.cur .lit{translate:0 -3px;transition:translate .6s}
.rf-cd:focus-visible{outline:1px solid #8a5a63;outline-offset:2px;border-radius:6px}
@keyframes rf-bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-3px) rotate(1deg)}}
.rf-now{display:grid;margin-top:14px}
.rf-now div{grid-area:1/1;opacity:0;transform:translateY(8px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.rf-now div.on{opacity:1;transform:none}
.rf-tm{display:block;font:400 22px/1 'Garamond',Georgia,serif;letter-spacing:.08em;color:#8a5a63}
.rf-lb{display:block;font:italic 400 34px/1.2 'Lora',Georgia,serif;color:#3b2f33;margin-top:6px;overflow-wrap:anywhere}
.rf-tap{font-style:italic;color:#6d5c61;font-size:15.5px;margin:10px 0 0}
/* detalles: espejos ovalados; al tocarlos, un destello los recorre */
.rf-mirrors{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 18px;max-width:320px;margin:10px auto 0}
.rf-mr{border:0;padding:0;background:none;cursor:pointer;color:inherit;display:flex;flex-direction:column;align-items:center;gap:10px}
.rf-mr.solo{grid-column:1/-1}
.rf-gl{position:relative;width:84px;height:110px;border-radius:50%;overflow:hidden;background:radial-gradient(ellipse at 35% 28%,#ffffff 0%,#ece6e4 38%,#cfc5c6 100%);box-shadow:0 0 0 1px rgba(138,90,99,.45),0 0 0 5px #f3eee9,0 0 0 6px rgba(138,90,99,.25),0 8px 18px rgba(59,47,51,.12)}
.rf-gl::before{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.95) 50%,transparent 60%);transform:translateX(-70%)}
.rf-gl b{position:absolute;inset:0;display:grid;place-items:center;font:400 18px/1 'Garamond',Georgia,serif;color:#8a5a63;letter-spacing:.08em}
.rf-mr[aria-expanded=true] .rf-gl::before{transform:translateX(70%);transition:transform 1.2s cubic-bezier(.3,.7,.3,1)}
.rf-mr[aria-expanded=true] .rf-gl{box-shadow:0 0 0 1px rgba(138,90,99,.8),0 0 0 5px #f3eee9,0 0 0 6px rgba(138,90,99,.5),0 10px 22px rgba(59,47,51,.18)}
.rf-mr-lb{font:400 15.5px/1.2 'GaramondSC',Georgia,serif;letter-spacing:.16em;text-transform:lowercase;color:#3b2f33;padding:6px 2px;border-bottom:1px solid transparent}
.rf-mr[aria-expanded=true] .rf-mr-lb{border-bottom-color:#8a5a63}
.rf-mr:focus-visible .rf-gl{outline:2px solid #8a5a63;outline-offset:8px}
.rf-hint{font-style:italic;color:#6d5c61;font-size:16px;margin:14px 0 0}
.rf-tray{max-width:340px;margin:0 auto;overflow:hidden;height:0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.rf-tray-in{margin-top:16px;padding:22px 20px 18px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.25));border-radius:2px;box-shadow:inset 0 1px 0 rgba(138,90,99,.3),inset 0 -1px 0 rgba(138,90,99,.3)}
.rf-tray-in h3{margin:0 0 8px;font:italic 400 30px/1.2 'Lora',Georgia,serif;color:#3b2f33}
.rf-tray-in p{margin:0 0 6px;font-size:18px;overflow-wrap:anywhere;white-space:pre-line}
.rf-tt{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 28px;margin:10px 0}
.rf-tt span{display:flex;flex-direction:column;font:400 14px/1.4 'GaramondSC',Georgia,serif;letter-spacing:.16em;text-transform:lowercase;color:#8a5a63}
.rf-tt b{font:400 26px/1.1 'Garamond',Georgia,serif;color:#3b2f33;letter-spacing:.04em}
.rf-tray-in details{margin-top:4px}.rf-tray-in summary{display:inline-flex;align-items:center;min-height:44px;cursor:pointer;list-style:none;font:italic 400 17px/1.2 'Lora',Georgia,serif;color:#8a5a63;border-bottom:1px solid rgba(138,90,99,.4)}
.rf-tray-in summary::-webkit-details-marker{display:none}
/* galería */
html.rf #gallery-items{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;width:calc(100% + 60px);max-width:none;margin:8px -30px 0;overscroll-behavior-x:contain}
html.rf #gallery-items::-webkit-scrollbar{display:none}
html.rf #gallery-items img{flex:0 0 100%;width:100%!important;min-width:100%;max-width:none!important;margin:0!important;height:360px;scroll-snap-align:center;scroll-snap-stop:always}
.rf-dots{display:flex;justify-content:center;gap:2px;margin-top:4px}
html.rf .gallery-dot{width:42px;height:42px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
html.rf .gallery-dot::before{content:"";width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1px #8a5a63}
html.rf .gallery-dot[aria-current=true]::before{background:#8a5a63}
@media(max-width:360px){.rf-lb{font-size:29px}.rf-v-name{font-size:26px}.rf-gl{width:76px;height:100px}}
@media(prefers-reduced-motion:reduce){.rf-rv,.rf-fade.rf-rv{opacity:1;transform:none;filter:none;transition:none}.rf-drop i,.rf-drop::after{opacity:1;transform:none;transition:none}.rf-cd .off,.rf-cd .lit{animation:none}.rf-gl::before{transition:none}}
/* === repaso v14 === tipografía de la portada, lugar tipo carta sobre aguada, fotos con borde de acuarela */
html.rf [data-bg]{font:400 20px/1.5 'Garamond',Georgia,serif;color:#3b2f33}
.rf-kicker{font:400 15.5px/1.2 'GaramondSC',Georgia,serif!important;letter-spacing:.16em!important;text-transform:lowercase!important;color:#6d5c61!important}
.rf-title{font:400 44px/1.3 'Pinyon',cursive!important;letter-spacing:0!important;color:#6e4a52!important;background:none!important;-webkit-text-fill-color:currentColor;margin:0 0 14px!important;padding:0 .1em .1em!important}

.rf-gap{display:block;height:34px}
.rf-lb{font:italic 400 30px/1.2 'Garamond',Georgia,serif!important;color:#3b2f33!important;letter-spacing:0!important}
.rf-tray-in h3{font:italic 400 28px/1.2 'Garamond',Georgia,serif!important;-webkit-text-fill-color:currentColor;background:none!important}
.rf-tray-in h3{color:inherit}
.rf-places{position:relative;max-width:360px;margin:26px auto 0;padding:34px 18px 30px}
.rf-places::before{content:"";position:absolute;inset:0 -6px;background:url(./media/5c9bfa6d0eee86f24a60ffa9.webp) center/100% 100% no-repeat;pointer-events:none}
.rf-venue{position:relative;display:grid;grid-template-columns:76px 1px 1fr;gap:0 16px;align-items:start;text-align:left;padding:12px 0!important;background:none!important}
.rf-venue::before{content:none!important}
.rf-venue::after{content:"";grid-column:2;grid-row:1;width:1px;height:100%;background:linear-gradient(transparent,#6e4a5288 20%,#6e4a5288 80%,transparent)}
.rf-v-time{grid-column:1;grid-row:1;text-align:right;font:400 26px/1.1 'Garamond',Georgia,serif!important;letter-spacing:.02em!important;color:#6e4a52!important;padding-top:20px}
.rf-v-info{grid-column:3;grid-row:1}
.rf-v-k{display:block;font:400 15px/1 'GaramondSC',Georgia,serif!important;letter-spacing:.16em!important;text-transform:lowercase!important;color:#6d5c61!important}
