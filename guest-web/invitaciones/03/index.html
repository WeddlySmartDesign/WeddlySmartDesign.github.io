*{box-sizing:border-box}html{scroll-behavior:smooth}

 -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 80%,transparent 100%),linear-gradient(to right,transparent 0%,#000 10%,#000 90%,transparent 100%);
 -webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 80%,transparent 100%),linear-gradient(to right,transparent 0%,#000 10%,#000 90%,transparent 100%);mask-composite:intersect}

/* ---------- movimiento premium de las escenas interiores ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:0;transition:opacity .9s ease}
#fx.on{opacity:1}
.motif{display:block;width:clamp(78px,22vw,104px);height:auto;margin:0 auto 14px;opacity:0;transform:translateY(14px) scale(.9);transition:opacity 1.4s ease,transform 1.6s cubic-bezier(.2,.8,.2,1)}
.in .motif,.motif.in{opacity:1;transform:none}
.motif.idle-rotate{animation:motifRotate 60s linear infinite}
.motif.idle-float{animation:motifFloat 6s ease-in-out infinite}
.motif.idle-flap{animation:motifFlap 1.9s ease-in-out infinite}
.motif.idle-glow{animation:motifGlow 4.5s ease-in-out infinite}
@keyframes motifRotate{to{rotate:360deg}}
@keyframes motifFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes motifFlap{0%,100%{scale:1 1}50%{scale:.62 1}}
@keyframes motifGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,215,150,0))}50%{filter:drop-shadow(0 0 10px rgba(255,215,150,.75))}}
.section-kicker,h2,.rule-orn{will-change:opacity}
.rv-head .section-kicker{opacity:0;letter-spacing:.32em;transition:opacity 1.1s ease,letter-spacing 1.6s cubic-bezier(.2,.8,.2,1)}
.rv-head h2{clip-path:inset(-20% 100% -20% 0);transition:clip-path 1.7s cubic-bezier(.6,.05,.2,1) .25s}

.rv-head .rule-orn circle{opacity:0;transition:opacity .6s ease 1.9s}
.rv-head.in .section-kicker{opacity:1;letter-spacing:var(--label-track)}
.rv-head.in h2{clip-path:inset(-20% -5% -20% 0)}
.rv-head.in .rule-orn path{stroke-dashoffset:0}.rv-head.in .rule-orn circle{opacity:1}
.rule-orn{display:block;width:150px;height:14px;margin:-8px auto 16px;color:var(--accent)}
.rv{opacity:0;transform:translate3d(0,26px,0);transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
img.feather.rv{transform:scale(1.07);filter:blur(3px);transition:opacity 1.5s ease,transform 2.4s cubic-bezier(.2,.8,.2,1),filter 1.4s ease}
img.feather.rv.in{transform:none;filter:none}
@media(prefers-reduced-motion:reduce){.rv,.rv-head .section-kicker,.rv-head h2,img.feather.rv,.motif{opacity:1!important;transform:none!important;clip-path:none!important;filter:none!important;letter-spacing:.11em;transition:none!important;animation:none!important}.rv-head .rule-orn path{stroke-dashoffset:0}.rv-head .rule-orn circle{opacity:1}#fx{display:none}}
/* mientras se vuelve a ver, los textos se apartan para ver la escena entera; vuelven al terminar */
#cover.replaying .cover-text,#cover.replaying .cover-scrim,#cover.replaying .cover-bottom,#closing.replaying .closing-text,#closing.replaying .closing-scrim{opacity:0!important;pointer-events:none}
/* volver a ver portada y cierre: discreto, aparece cuando ya se han visto */
.replay{position:absolute;z-index:3;top:max(14px,calc(env(safe-area-inset-top) + 10px));right:12px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(20,20,28,.16);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s ease}

#cover.opened .replay,#closing.revealed .replay{opacity:.85;pointer-events:auto}
.replay:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* franjas de continuidad: quedan detrás de la primera y la última sección, sin trozos de fondo vacío */
main>img[class$="-band"]{position:relative;z-index:0}
#cover+img[class$="-band"]{-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
main>img[class$="-band"]:not(#cover+img){-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}

/* ===== composición editorial sin tarjetas: numeración, filetes y adornos tipográficos ===== */
.pr-icon{display:none}
#practical-items{display:block;max-width:400px;margin:6px auto 0;counter-reset:pr}
.practical-item{position:relative;counter-increment:pr;display:grid;grid-template-columns:54px 1fr;column-gap:14px;align-items:start;text-align:left;width:100%;max-width:none;padding:28px 0 24px}

.practical-title{margin:0 0 6px;font-size:calc(clamp(16px,4.4vw,19px)*var(--label-size));text-align:left;font-family:var(--label);text-transform:var(--label-case);letter-spacing:calc(var(--label-track) + .02em)}
.practical-details{margin:0 0 8px;max-width:none;text-align:left}
.practical-item .location-links{justify-content:flex-start;gap:4px 22px}
.practical-item.times .practical-details{justify-content:flex-start}
.travel-time{align-items:flex-start}
.practical-item details{margin:2px 0 0;width:auto}
.practical-item summary{justify-content:flex-start;padding:8px 0}
.location{position:relative;margin:0 auto;padding:20px 0 18px;max-width:400px}
.location+.location{border-top:1px solid var(--line);margin-top:10px;padding-top:30px}
.link{border-radius:0;background:transparent;border:0;border-bottom:1px solid currentColor;padding:12px 0 5px;min-height:44px;font:500 12.5px/1.2 var(--label);text-transform:uppercase;letter-spacing:.18em;color:var(--accent)}
.link::after{content:"";display:inline-block;width:14px;height:1px;margin-left:8px;background:currentColor;vertical-align:middle;transition:width .3s}
.link:hover::after{width:22px}
.location-links{gap:4px 24px}
.practical-item summary{font-family:var(--label);text-transform:var(--label-case);font-size:12.5px;letter-spacing:.16em;color:var(--accent)}
.location-type{font-family:var(--label);text-transform:var(--label-case);letter-spacing:calc(var(--label-track) + .06em)}
.travel-time .time-label{font-family:var(--label);text-transform:var(--label-case)}
.time-value,.location-time{font-family:var(--num)}

/* ===== AZULEJO · cerámica pintada a mano, cobalto ===== */
html[data-skin=azulejo]{--title:'Chorus',var(--script);--serif:'Lora',Georgia,serif;--label:'Lora',Georgia,serif;--num:'Lora',Georgia,serif;--label-case:uppercase;--label-track:.24em;--label-size:.68}

html[data-skin=azulejo] h2{font-size:clamp(50px,13vw,74px);letter-spacing:.01em}
html[data-skin=azulejo] .moment-time{font-style:italic}
html[data-skin=azulejo] .agenda-track{left:22px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 11px)}
html[data-skin=azulejo] .moment-node{width:22px;height:22px;left:12px;top:16px;background:#fbf8f2;box-shadow:inset 0 0 0 3px #fbf8f2}
html[data-skin=azulejo] .moment.on .moment-node{background:var(--accent);box-shadow:inset 0 0 0 3px #fbf8f2,0 0 0 4px rgba(35,64,138,.14)}

/* ===== GALA · art déco, laca negra y oro ===== */
html[data-skin=gala]{--title:var(--script);--serif:'Baskerville',Georgia,serif;--label:'Adventor',Futura,sans-serif;--num:'Adventor',Futura,sans-serif;--label-case:uppercase;--label-track:.32em;--label-size:.6;--gold:linear-gradient(100deg,#6e5016 0%,#a8822f 30%,#d2b06a 48%,#9a7428 66%,#6e5016 100%)}
html[data-skin=gala]{--glyph:'◆';--pr-style:decimal-leading-zero;--numeral-font:400 24px/1.2 'Adventor',sans-serif}
html[data-skin=gala] .practical-item::before{letter-spacing:.12em;color:#94712d;padding-top:4px}
html[data-skin=gala] .link{color:#7d5f22}
html[data-skin=gala] h2{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
html[data-skin=gala] .agenda-list{max-width:380px}
html[data-skin=gala] .agenda-track{left:50%;background:rgba(148,113,45,.35)}
html[data-skin=gala] .agenda-track::after{background:linear-gradient(#d9bd78,#94712d)}
html[data-skin=gala] .moment{grid-template-columns:1fr 1fr;column-gap:44px;padding:16px 0;transform:translateY(12px)}
html[data-skin=gala] .moment.on{transform:none}
html[data-skin=gala] .moment-node{left:calc(50% - 9px);top:21px;width:18px;height:18px;border-color:#b8923f}
html[data-skin=gala] .moment.on .moment-node{background:#d9bd78;box-shadow:0 0 14px rgba(217,189,120,.7)}
html[data-skin=gala] .moment-time{grid-column:1;text-align:right;align-self:center;font-size:15px;letter-spacing:.22em}
html[data-skin=gala] .moment-label{grid-column:2;grid-row:1;align-self:center;font-size:clamp(19px,5vw,23px)}

/* ===== INVERNADERO · cristal, hierro blanco y verde ===== */
html[data-skin=invernadero]{--title:'Pagella',Palatino,serif;--label:'Poppins',sans-serif;--num:'Poppins',sans-serif;--label-case:uppercase;--label-track:.3em;--label-size:.6}
html[data-skin=invernadero]{--glyph:'❦';--pr-style:lower-roman;--numeral-font:italic 400 40px/1 'Pagella',serif}
html[data-skin=invernadero] .link{font-weight:400;font-size:11.5px;letter-spacing:.22em}
html[data-skin=invernadero] h2{font-style:italic;font-size:clamp(44px,12vw,66px);letter-spacing:-.01em}
html[data-skin=invernadero] .agenda-track{left:24px;width:2px;background:rgba(61,106,81,.18);border-radius:2px}
html[data-skin=invernadero] .agenda-track::after{background:linear-gradient(#7aa56f,#3d6a51)}
html[data-skin=invernadero] .moment-node{left:9px;top:12px;width:30px;height:30px;border:0;background:none;transform:scale(0) rotate(-40deg);transform-origin:20% 80%}
html[data-skin=invernadero] .moment-node::before{content:"";position:absolute;inset:3px 3px 3px 10px;background:linear-gradient(135deg,#9cc58e,#3d6a51);border-radius:0 80% 0 80%}
html[data-skin=invernadero] .moment:nth-child(odd) .moment-node::before{inset:3px 10px 3px 3px;border-radius:80% 0 80% 0}
html[data-skin=invernadero] .moment.on .moment-node{transform:scale(1) rotate(0);background:none;box-shadow:none}
html[data-skin=invernadero] .moment-time{font-weight:300;font-size:14px;letter-spacing:.24em}

/* ===== REFLEJO · agua, crepúsculo y rosa ===== */
html[data-skin=reflejo]{--title:'Lora',Georgia,serif;--serif:'Lora',Georgia,serif;--label:'GaramondSC',Georgia,serif;--num:'Garamond',Georgia,serif;--label-track:.18em;--label-size:.9}
html[data-skin=reflejo]{--glyph:'○';--pr-style:upper-roman;--numeral-font:italic 400 38px/1 'Lora',serif}
html[data-skin=reflejo] .link{font:italic 400 17px/1.2 var(--serif);text-transform:none;letter-spacing:.02em}
html[data-skin=reflejo] h2{font-style:italic;font-size:clamp(48px,13vw,72px);position:relative;margin-bottom:46px}
html[data-skin=reflejo] h2::after{content:attr(data-text);position:absolute;left:0;right:0;top:82%;transform:scaleY(-1);opacity:.22;-webkit-mask-image:linear-gradient(to top,#000,transparent 70%);mask-image:linear-gradient(to top,#000,transparent 70%);animation:ripple 5s ease-in-out infinite;pointer-events:none;filter:blur(.6px)}
@keyframes ripple{0%,100%{transform:scaleY(-1) skewX(0)}50%{transform:scaleY(-1.06) skewX(-4deg)}}
html[data-skin=reflejo] .rule-orn{display:none}
@keyframes ring{from{transform:scale(.6);opacity:.6}to{transform:scale(1.8);opacity:0}}
html[data-skin=reflejo] .moment-node{border-radius:50%;transform:scale(.6)}
html[data-skin=reflejo] .moment.on .moment-node{transform:scale(1)}
html[data-skin=reflejo] .moment.on .moment-node::after{content:"";position:absolute;inset:-1px;border:1px solid var(--accent);border-radius:50%;animation:ring 2.6s ease-out infinite}
html[data-skin=reflejo] .moment-time{font-style:italic;font-size:21px}

/* ===== CAJA DE MÚSICA · latón, terciopelo y pentagrama ===== */
html[data-skin=caja]{--serif:'Bonum',Georgia,serif;--label:'Bonum',Georgia,serif;--num:'Bonum',Georgia,serif;--label-case:uppercase;--label-track:.26em;--label-size:.62;--brass:linear-gradient(100deg,#7e5a2a,#c99a55 35%,#f0d29a 50%,#b5853f 70%,#7e5a2a);--brass-ink:linear-gradient(100deg,#5e3f17,#9a6c2c 35%,#c79a55 50%,#8a5f26 70%,#5e3f17)}
html[data-skin=caja]{--glyph:'♪';--pr-style:upper-roman;--numeral-font:italic 400 38px/1 'Bonum',serif}
html[data-skin=caja] .practical-item::before{background:var(--brass-ink);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-skin=caja] .link{color:#7a5222}
html[data-skin=caja] h2{background:var(--brass-ink);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
html[data-skin=caja] .agenda-track{left:16px;width:22px;background:repeating-linear-gradient(to right,rgba(138,97,49,.35) 0 1px,transparent 1px 5.25px);opacity:.9}
html[data-skin=caja] .agenda-track::after{left:9px;width:4px;background:linear-gradient(#f0d29a,#b5853f);box-shadow:0 0 10px rgba(240,210,154,.8)}
html[data-skin=caja] .moment-node{border:0;background:none;transform:scale(.6);left:10px;top:6px;width:34px;height:36px}
html[data-skin=caja] .moment-node::before{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font:400 34px/1 Georgia,serif;color:rgba(138,97,49,.45)}
html[data-skin=caja] .moment.on .moment-node{background:none;box-shadow:none;transform:scale(1);animation:note 1.6s ease-in-out infinite}
html[data-skin=caja] .moment.on .moment-node::before{color:#a8782f;text-shadow:0 0 12px rgba(240,210,154,.9)}
@keyframes note{0%,100%{translate:0 0}50%{translate:0 -4px}}
html[data-skin=caja] .moment-time{font-style:italic;letter-spacing:.06em;font-size:19px}
@media(prefers-reduced-motion:reduce){html[data-skin] h2::after,html[data-skin] .moment-node,html[data-skin] .pr-icon::after{animation:none!important}}

/* ===== ABANICO · interior propio: seda marfil con reflejos y filos dorados; un solo abanico, el del programa ===== */
/* La seda verde salvia de la portada se aclara a marfil y vuelve a la salvia antes del cierre. */
html.ab{background:#efeee4}
html.ab body{background:linear-gradient(180deg,#efeee4 0%,#f3f1e7 30%,#f1efe5 60%,#e9ebe0 84%,#e2e7db 100%) top/100% 100% no-repeat,url(media/xb27d7c5ae6c0e4a9.jpg) center top/100% auto repeat-y transparent;background-blend-mode:multiply}
html.ab [data-bg]{background:none!important;min-height:0!important;display:block;padding:40px 30px 34px!important;color:#2f3b2f;font:400 20px/1.6 'Garamond',Georgia,serif}
.ab-band{display:block;width:100%;height:auto;max-width:none!important;margin:0}
.ab-in{position:relative;max-width:420px;margin:0 auto;text-align:center}
.ab-kicker{font:400 15px/1.35 'GaramondSC',Georgia,serif;letter-spacing:.22em;text-transform:uppercase;color:#56654f;margin:0}
.ab-title{font:400 54px/1.15 'Pinyon',cursive;color:#2b3a2c;margin:4px 0 16px}
.ab-p{font-size:20px;line-height:1.65;max-width:30ch;margin:0 auto;white-space:pre-line;overflow-wrap:anywhere}
.ab-rv{opacity:0;transform:translateY(16px);transition:opacity 1.1s ease,transform 1.3s cubic-bezier(.2,.8,.2,1)}
.ab-rv.in{opacity:1;transform:none}
/* fotos: sin marco ni forma, bordes fundidos con la seda y un destello dorado que las cruza */
.ab-ph{position:relative;width:calc(100% + 40px);margin:22px -20px 0;-webkit-mask:url(media/x2edfdcc753584409.png) center/100% 100% no-repeat;mask:url(media/x2edfdcc753584409.png) center/100% 100% no-repeat}
.ab-ph img{display:block;width:100%;height:320px;object-fit:cover;max-width:none!important;filter:saturate(.92) brightness(1.02)}
.ab-ph[data-fit=full] img{object-fit:contain;height:auto;max-height:440px}
.ab-shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(255,236,190,.5) 49%,rgba(255,236,190,.12) 53%,transparent 62%) -160% 0/250% 100% no-repeat;mix-blend-mode:screen}
.ab-ph.ab-rv{transform:scale(1.03);filter:blur(6px)}
.ab-ph.ab-rv.in{transform:none;filter:none;transition:opacity 1.5s ease,transform 2.4s cubic-bezier(.2,.8,.2,1),filter 1.8s ease}
.ab-ph.in .ab-shine{animation:abshine 2.6s .9s cubic-bezier(.4,.1,.3,1) forwards}
@keyframes abshine{to{background-position:160% 0}}
/* lugar: hoja de abanico de seda marfil con doble filo dorado */
.ab-places{position:relative;max-width:360px;margin:26px auto 0;padding:30px 22px 26px;background:linear-gradient(180deg,rgba(255,252,243,.92),rgba(250,246,234,.8));border-radius:50% 50% 14px 14px/64px 64px 14px 14px;box-shadow:0 0 0 1px #c9a75f,0 0 0 5px rgba(255,252,243,.6),0 0 0 6px rgba(201,167,95,.55),0 18px 30px -16px rgba(47,59,47,.35)}
.ab-venue{position:relative;display:grid;grid-template-columns:62px 1px 1fr;gap:0 14px;align-items:start;text-align:left;padding:10px 0}
.ab-venue+.ab-venue{margin-top:6px;border-top:1px solid rgba(201,167,95,.35);padding-top:16px}
.ab-venue::after{content:"";grid-column:2;grid-row:1;width:1px;height:100%;background:linear-gradient(transparent,rgba(168,132,63,.6) 20%,rgba(168,132,63,.6) 80%,transparent)}
.ab-v-time{grid-column:1;grid-row:1;text-align:right;font:400 30px/1 'Pinyon',cursive;color:#2b3a2c;padding-top:18px}
.ab-v-info{grid-column:3;grid-row:1;min-width:0}
.ab-v-k{display:block;font:400 14px/1.35 'GaramondSC',Georgia,serif;letter-spacing:.24em;text-transform:uppercase;color:#56654f}
.ab-v-name{font:400 23px/1.25 'Garamond',Georgia,serif;font-style:italic;color:#24312a;margin:5px 0 2px;overflow-wrap:anywhere}
.ab-v-addr{color:#4b5a47;font-size:18px;line-height:1.4;overflow-wrap:anywhere}
.ab-links{display:flex;flex-wrap:wrap;justify-content:center;gap:0 22px;margin-top:2px}
.ab-places .ab-links{justify-content:flex-start;gap:0 16px}
html.ab a.link{display:inline-flex;align-items:center;min-height:44px;padding:10px 0 4px;border:0;border-bottom:1px solid rgba(168,132,63,.7);border-radius:0;background:none;font:400 14px/1 'GaramondSC',Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:#2b3a2c;text-decoration:none;white-space:nowrap}
html.ab a.link::after{content:none}
.ab-dress{margin:22px auto 0;font-style:italic;color:#4b5a47}
/* agenda: el abanico real (tela pintada a pinceladas, varillas de marfil, borla) que se abre al bajar */
.ab-sky{position:relative;width:100%;max-width:330px;aspect-ratio:680/584;margin:14px auto 0}
.ab-sky svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ab-body{filter:drop-shadow(0 10px 10px rgba(40,52,40,.22)) drop-shadow(0 1px 2px rgba(40,52,40,.25))}
.ab-mk{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border:0;padding:0;background:none;cursor:pointer}
.ab-mk i{position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#e9dfc7;box-shadow:0 0 0 1px rgba(150,120,60,.5);opacity:0;transition:all .6s cubic-bezier(.3,1.4,.5,1)}
.ab-mk.on i{opacity:1;background:radial-gradient(circle,#fff8e2 0 25%,#d1ac5e 65%);box-shadow:0 0 6px 1px rgba(209,172,94,.45)}
.ab-mk.cur i{width:13px;height:13px;margin:-6.5px;background:radial-gradient(circle,#fff 0 18%,#ebcd84 50%,#c39a4c 80%);box-shadow:0 0 12px 4px rgba(225,190,110,.5)}
.ab-mk:focus-visible{outline:1px solid #2b3a2c;outline-offset:-8px;border-radius:50%}
.ab-now{display:block;max-width:330px;margin:16px auto 0}
.ab-now div{display:grid;grid-template-columns:74px 1fr;gap:0 14px;align-items:baseline;text-align:left;padding:10px 4px;border-top:1px solid rgba(168,132,63,.3);cursor:pointer;opacity:.72;transition:opacity .6s ease,background .6s ease}
.ab-now div:last-child{border-bottom:1px solid rgba(168,132,63,.3)}
.ab-now div.on{opacity:1;background:radial-gradient(ellipse at 20% 50%,rgba(225,196,128,.26),transparent 70%)}
.ab-tm{position:relative;font:400 18px/1.2 'GaramondSC',Georgia,serif;letter-spacing:.08em;color:#4b5a47;text-align:right}
.ab-now div.on .ab-tm::before{content:"";position:absolute;left:-2px;top:50%;width:7px;height:7px;margin-top:-4px;border-radius:50%;background:radial-gradient(circle,#fff8e2 0 25%,#c39a4c 65%);box-shadow:0 0 8px 2px rgba(209,172,94,.6)}
.ab-lb{font:italic 400 23px/1.25 'Garamond',Georgia,serif;color:#24312a;overflow-wrap:anywhere}
/* detalles: muestras de seda marfil con filo dorado; un reflejo las recorre hasta el primer toque */
.ab-sws{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 14px;max-width:330px;margin:16px auto 0}
.ab-sw{position:relative;overflow:hidden;min-height:66px;border:0;border-radius:6px;padding:12px 10px;cursor:pointer;color:#2f3b2f;background:linear-gradient(160deg,#fbf8ef 0%,#f1ecdd 45%,#faf6eb 62%,#ece5d2 100%);box-shadow:inset 0 0 0 1px rgba(195,161,96,.8),inset 0 0 0 4px rgba(251,248,239,.9),inset 0 0 0 5px rgba(195,161,96,.45),0 8px 14px -8px rgba(40,52,40,.35);transition:transform .7s cubic-bezier(.2,.9,.25,1),box-shadow .7s}
.ab-sw.solo{grid-column:1/-1}
.ab-sw::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 46%,rgba(255,240,205,.35) 52%,transparent 66%) -150% 0/220% 100% no-repeat;animation:absilk 3.4s ease-in-out infinite;animation-delay:calc(var(--i) * .5s);pointer-events:none}
.ab-sws.used .ab-sw::before{animation:none;opacity:0}
@keyframes absilk{0%{background-position:-150% 0}55%,100%{background-position:150% 0}}
.ab-sw-lb{position:relative;font:400 14px/1.35 'GaramondSC',Georgia,serif;letter-spacing:.12em;text-transform:uppercase}
.ab-sw-lb::after{content:" +";color:#a8843f}
.ab-sw[aria-expanded=true]{transform:translateY(-3px);box-shadow:inset 0 0 0 1px #b8924c,inset 0 0 0 4px rgba(251,248,239,.9),inset 0 0 0 5px #c9a75f,0 14px 22px -10px rgba(40,52,40,.4),0 0 20px rgba(225,190,110,.35)}
.ab-sw[aria-expanded=true] .ab-sw-lb::after{content:" −"}
.ab-sw:focus-visible{outline:2px solid #2b3a2c;outline-offset:3px}
.ab-hint{font-style:italic;color:#4b5a47;font-size:16.5px;margin:14px 0 0}
.ab-tray{max-width:340px;margin:0 auto;overflow:hidden;height:0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.ab-tray-in{margin-top:16px;padding:20px 20px 16px;text-align:center;background:radial-gradient(ellipse at 50% 0,rgba(225,196,128,.26),transparent 70%)}
.ab-tray-in h3{margin:0 0 6px;font:400 40px/1.2 'Pinyon',cursive;color:#2b3a2c}
.ab-tray-in p{margin:0 0 6px;font-size:19px;overflow-wrap:anywhere;white-space:pre-line}
.ab-tt{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 30px;margin:10px 0}
.ab-tt span{display:flex;flex-direction:column;font:400 14px/1.6 'GaramondSC',Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:#56654f}
.ab-tt b{font:400 32px/1.1 'Pinyon',cursive;color:#2b3a2c;letter-spacing:0;text-transform:none}
.ab-tray-in details{margin-top:4px}.ab-tray-in summary{display:inline-flex;align-items:center;min-height:44px;cursor:pointer;list-style:none;font:400 14px/1 'GaramondSC',Georgia,serif;letter-spacing:.2em;text-transform:uppercase;color:#2b3a2c;border-bottom:1px solid rgba(168,132,63,.7)}
.ab-tray-in summary::-webkit-details-marker{display:none}
/* galería: fotos a sangre con bordes fundidos; los puntos son remaches dorados */
html.ab #gallery-items{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;width:calc(100% + 40px);max-width:none;margin:8px -20px 0;overscroll-behavior-x:contain;-webkit-mask:url(media/x2edfdcc753584409.png) center/100% 100% no-repeat;mask:url(media/x2edfdcc753584409.png) center/100% 100% no-repeat}
html.ab #gallery-items::-webkit-scrollbar{display:none}
html.ab #gallery-items img{flex:0 0 100%;width:100%!important;min-width:100%;max-width:none!important;margin:0!important;height:380px;object-fit:cover;scroll-snap-align:center;scroll-snap-stop:always;filter:saturate(.92)}
html.ab #gallery-items img[data-fit=full]{object-fit:contain}
.ab-dots{display:flex;justify-content:center;gap:2px;margin-top:4px}
html.ab .gallery-dot{width:42px;height:42px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
html.ab .gallery-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:#e9e3d2;box-shadow:0 0 0 1px rgba(86,101,79,.5);transition:all .5s}
html.ab .gallery-dot[aria-current=true]::before{width:10px;height:10px;background:radial-gradient(circle,#fff8e2 0 22%,#c39a4c 70%);box-shadow:0 0 0 1px #f3dfa8,0 0 10px 2px rgba(209,172,94,.5)}
/* portada y cierre */
html.ab .cover-tag{font:400 15px/1.35 'GaramondSC',Georgia,serif;letter-spacing:.36em;text-transform:uppercase}
html.ab .cover-names{font:400 clamp(58px,15.5vw,92px)/1 'Pinyon',cursive}
html.ab .cover-names .amp{font:400 .5em/1.2 'Pinyon',cursive}
html.ab .cover-date,html.ab .countdown,html.ab .cover-place{font-family:'GaramondSC',Georgia,serif;letter-spacing:.24em}
html.ab .cover-date{font-size:17px}html.ab .countdown{font-size:15px}
html.ab .tap-hint{top:max(24svh,calc(env(safe-area-inset-top) + 120px));bottom:auto;font:400 36px/1.2 'Pinyon',cursive;letter-spacing:.02em}
html.ab .entry-button,html.ab .rsvp-button{font:400 14.5px/1.2 'GaramondSC',Georgia,serif;letter-spacing:.22em;text-transform:uppercase}
html.ab .closing-caption{font:italic 400 clamp(20px,5.4vw,26px)/1.3 'Garamond',Georgia,serif}
html.ab .closing-sign{font:400 clamp(44px,12vw,66px)/1.05 'Pinyon',cursive}
html.ab .close-date{font-family:'GaramondSC',Georgia,serif;letter-spacing:.22em;font-size:16px}
/* música */
.ab-snd{position:fixed;right:14px;top:max(14px,env(safe-area-inset-top));z-index:70;width:42px;height:42px;border-radius:50%;border:1px solid rgba(195,154,76,.7);background:rgba(243,241,231,.85);color:#7c6230;font:400 18px/1 Georgia,serif;cursor:pointer;display:none;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 0 12px rgba(225,190,110,.3)}
.ab-snd.show{display:grid}.ab-snd[aria-pressed=false]{opacity:.7;text-decoration:line-through}
/* cierre: «Os esperamos» llega cuando el abanico se ha cerrado y queda su silueta de luz; el resto debajo */
.ab-wait{position:absolute;z-index:2;left:22px;right:22px;top:max(7svh,calc(env(safe-area-inset-top) + 34px));margin:0;text-align:center;font:400 clamp(46px,12.5vw,64px)/1.1 'Pinyon',cursive;color:#fbf6e9;text-shadow:0 1px 14px rgba(0,0,0,.6),0 0 30px rgba(20,32,24,.6);opacity:0;transform:translateY(10px);transition:opacity 1.4s ease,transform 1.4s ease;pointer-events:none}
.ab-wait.on{opacity:1;transform:none}
#closing.replaying .ab-wait{opacity:0}
html.ab .closing-text{top:calc(max(7svh,calc(env(safe-area-inset-top) + 34px)) + 74px)!important}

<script>/* ABANICO · interior propio. Mismo modelo neutro del cuestionario; texto variable siempre con textContent. */
(()=>{'use strict';
document.documentElement.classList.add('ab');
const SVG='http://www.w3.org/2000/svg';
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e};
const reducedMotion=()=>typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function head(inner,kicker,title){inner.append(el('p','ab-kicker ab-rv',kicker),el('h2','ab-title ab-rv',title))}
function img(p,cls,alt,h){const w=el('div','ab-ph '+cls);const i=el('img');i.src=p.src;i.alt=p.alt||alt;i.loading='lazy';i.dataset.fit=p.fit;w.dataset.fit=p.fit;i.style.objectPosition=p.fx+'% '+p.fy+'%';if(h&&p.fit!=='full')i.style.height=h+'px';w.append(i,el('span','ab-shine'));return w}
function links(list){const r=el('div','ab-links');for(const [u,l] of list){const a=el('a','link',l);a.href=u;a.target='_blank';a.rel='noopener noreferrer';r.append(a)}return r}
function scene(sec,show){sec.classList.toggle('invisible',!show);sec.replaceChildren();const inner=el('div','ab-in');sec.append(inner);return inner}
let A=null,openFan=null,io=null;
function render(vm){
 if(!document.querySelector('.ab-band')){const t=el('img','ab-band');t.src='media/x35b6ab55182082b7.jpg';t.alt='';t.setAttribute('aria-hidden','true');document.getElementById('cover').after(t);
  const b=el('img','ab-band');b.src='media/x7b7f40e5db7dad31.jpg';b.alt='';b.setAttribute('aria-hidden','true');document.getElementById('closing').before(b)}
 const order=[];const mark=s=>{order.push(s);return order.length===1};
 let sec=document.getElementById('story'),inner=scene(sec,vm.story.show);
 if(vm.story.show){head(inner,'Nuestra historia','Érase una vez…',mark(sec));if(vm.story.text)inner.append(el('p','ab-p ab-rv',vm.story.text));if(vm.story.photo)inner.append(img(vm.story.photo,'ab-rv','Fotografía de la pareja'))}
 // lugar: sobre una hoja de abanico de seda marfil con filo dorado
 sec=document.getElementById('locations');inner=scene(sec,vm.venues.length>0);
 if(vm.venues.length){head(inner,'Nos vemos aquí','El gran día',mark(sec));if(vm.venuePhoto)inner.append(img(vm.venuePhoto,'ab-rv','Fotografía del lugar',250));
  const places=el('div','ab-places ab-rv');vm.venues.forEach(v=>{const a=el('div','ab-venue');const info=el('div','ab-v-info');info.append(el('span','ab-v-k',v.label),el('div','ab-v-name',v.name));if(v.address)info.append(el('div','ab-v-addr',v.address));if(v.links.length)info.append(links(v.links));a.append(el('div','ab-v-time',v.time||''),info);places.append(a)});inner.append(places)
  if(vm.dress)inner.append(el('p','ab-dress ab-rv','Código de vestimenta: '+vm.dress))}
 // agenda: un abanico que se abre al bajar; cada varilla es un momento y se puede tocar
 const M=vm.moments;sec=document.getElementById('agenda');inner=scene(sec,M.length>0);A=null;
 if(M.length){head(inner,'Para que no te pierdas nada','El programa',mark(sec));const sky=el('div','ab-sky ab-rv');sky.setAttribute('role','group');sky.setAttribute('aria-label','Momentos del día');
  const svg=document.createElementNS(SVG,'svg');svg.setAttribute('viewBox',`0 0 ${FW} ${FH}`);svg.setAttribute('aria-hidden','true');
  let defs='',body='';const ord=WG.map((c,j)=>[c,j]).sort((x,y)=>Math.abs(x[0])-Math.abs(y[0]));
  WG.forEach((c,j)=>{defs+=`<clipPath id="ab-w${j}"><path d="${sector(j?c-WW/2-.5:-178,j<NW-1?c+WW/2+.5:178)}"/></clipPath>`});
  ord.forEach(([c,j])=>{body+=`<g class="ab-wg" data-j="${j}"><image href="media/x52ce9d8d1c74d3f8.webp" width="${FW}" height="${FH}" clip-path="url(#ab-w${j})"/></g>`});
  svg.innerHTML=`<defs>${defs}</defs><g class="ab-body">${body}</g><image href="media/x86745cf33ffa9d84.webp" width="${FW}" height="${FH}"/>`;sky.append(svg);
  const wgs=[...svg.querySelectorAll('.ab-wg')].map(g=>[g,WG[+g.dataset.j]]);
  const now=el('div','ab-now');
  const pts=M.map((m,i)=>{const b=el('button','ab-mk');b.type='button';b.setAttribute('aria-label',(m.time?m.time+' ':'')+m.label);b.append(el('i'));b.onclick=()=>{A.pick=i;A.pickY=scrollY;tick()};sky.append(b);
   const d=el('div');d.append(el('span','ab-tm',m.time||''));if(m.label)d.append(el('span','ab-lb',m.label));d.onclick=()=>{A.pick=i;A.pickY=scrollY;tick()};now.append(d);return {b,d,f:M.length<2?.5:i/(M.length-1)}});
  inner.append(sky,now);if(M.length>1)inner.append(el('p','ab-hint ab-rv','Toca un momento para resaltarlo'));A={sky,svg,wgs,pts,n:M.length,pick:null};
  let x0=null;now.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});now.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)<40)return;const c=A.pts.findIndex(t=>t.d.classList.contains('on'));A.pick=Math.max(0,Math.min(A.n-1,c+(dx<0?1:-1)));A.pickY=scrollY;tick()},{passive:true})}
 // detalles: muestras de seda marfil con filo dorado; un reflejo las recorre hasta el primer toque
 const D=vm.details;sec=document.getElementById('practical');inner=scene(sec,D.length>0);openFan=null;
 if(D.length){head(inner,'Todo lo que necesitas saber','Los detalles',mark(sec));const grid=el('div','ab-sws ab-rv'),tray=el('div','ab-tray'),tin=el('div','ab-tray-in');tray.id='ab-tray';tray.append(tin);
  D.forEach((x,i)=>{const b=el('button','ab-sw'+(D.length%2&&i===D.length-1?' solo':''));b.type='button';b.setAttribute('aria-expanded','false');b.setAttribute('aria-controls','ab-tray');
   b.style.setProperty('--i',i);b.append(el('span','ab-sw-lb',x.title));
   b.onclick=()=>{grid.classList.add('used');if(openFan===b){b.setAttribute('aria-expanded','false');openFan=null;tray.style.height='0px';return}openFan?.setAttribute('aria-expanded','false');openFan=b;b.setAttribute('aria-expanded','true');fill(tin,x);tray.style.height=(tin.offsetHeight+16)+'px'};grid.append(b)});
  inner.append(grid,el('p','ab-hint ab-rv',D.length>1?'Toca cada seda para abrir su información':'Toca la seda para abrir su información'),tray)}
 const G=vm.gallery;sec=document.getElementById('gallery');inner=scene(sec,G.length>0);
 if(G.length){head(inner,'Un poco de nosotros','Recuerdos',mark(sec));const track=el('div','ab-rv');track.id='gallery-items';track.setAttribute('role','region');track.setAttribute('aria-label','Galería de fotografías');
  G.forEach((p,i)=>{const im=el('img','ab-gimg');im.src=p.src;im.alt=p.alt||'Fotografía de la pareja';im.dataset.fit=p.fit;im.style.objectPosition=p.fx+'% '+p.fy+'%';im.loading=i?'lazy':'eager';im.setAttribute('aria-label','Fotografía '+(i+1)+' de '+G.length);track.append(im)});inner.append(track);
  if(G.length>1){const dots=el('div','ab-dots');const bs=G.map((_,i)=>{const b=el('button','gallery-dot');b.type='button';b.setAttribute('aria-label','Ver foto '+(i+1));b.onclick=()=>track.scrollTo({left:i*track.clientWidth,behavior:reducedMotion()?'auto':'smooth'});dots.append(b);return b});
   const upd=()=>{const k=Math.max(0,Math.min(bs.length-1,Math.round(track.scrollLeft/Math.max(1,track.clientWidth))));bs.forEach((b,i)=>b.setAttribute('aria-current',i===k?'true':'false'))};track.addEventListener('scroll',upd,{passive:true});inner.append(dots);upd()}}
 io?.disconnect();const items=[...document.querySelectorAll('.ab-rv')];
 if(reducedMotion()||typeof IntersectionObserver!=='function')items.forEach(e=>e.classList.add('in'));
 else{io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});items.forEach((e,i)=>{e.style.transitionDelay=(i%4)*110+'ms';io.observe(e)})}
 tick()}
function fill(tin,x){tin.replaceChildren(el('h3',null,x.title));const times=x.lines.filter(l=>/^(Ida|Vuelta):/.test(l)),rest=x.lines.filter(l=>!/^(Ida|Vuelta):/.test(l));
 for(const l of rest.slice(0,1))tin.append(el('p',null,l));if(times.length){const tt=el('div','ab-tt');for(const l of times){const m=l.match(/^(Ida|Vuelta):\s*(.*)$/);const s=el('span',null,m[1]);s.append(el('b',null,m[2]));tt.append(s)}tin.append(tt)}
 for(const l of rest.slice(1))tin.append(el('p',null,l));if(x.links.length)tin.append(links(x.links));
 if(x.more){const d=el('details');d.append(el('summary',null,x.more.label));for(const l of x.more.lines)d.append(el('p',null,l));d.addEventListener('toggle',()=>{document.getElementById('ab-tray').style.height=(tin.offsetHeight+16)+'px'});tin.append(d)}}
// el abanico del programa: el abanico real (tela pintada a pinceladas) cortado en gajos que giran sobre el remache; se abre según se baja
const FW=680,FH=584,CX=347.53,CY=381.55,RL=374.97,T0=-68.93,T1=66.11,NW=24,WW=(T1-T0+3)/NW;
const WG=Array.from({length:NW},(_,j)=>T0-1.5+WW*(j+.5));
const P=(deg,r)=>{const a=(deg-90)*Math.PI/180;return [CX+Math.cos(a)*r,CY+Math.sin(a)*r]};
const f2=v=>v.toFixed(1);
function sector(a,b){const [x1,y1]=P(a,RL*1.3),[x2,y2]=P(b,RL*1.3);return `M${f2(CX)} ${f2(CY)} L${f2(x1)} ${f2(y1)} A${f2(RL*1.3)} ${f2(RL*1.3)} 0 ${b-a>180?1:0} 1 ${f2(x2)} ${f2(y2)} Z`}
function tick(){if(!A)return;const vh=innerHeight,y=A.sky.getBoundingClientRect().top;const q=reducedMotion()?1:Math.max(0,Math.min(1,(vh*.9-y)/(vh*.5)));
 const k=.03+.97*(q*q*(3-2*q));let cur=0;
 A.wgs.forEach(([g,c])=>g.setAttribute('transform',`rotate(${f2((k-1)*c)} ${CX} ${CY})`));
 A.pts.forEach((t,i)=>{const deg=k*(T0+8+(T1-T0-16)*t.f),[mx,my]=P(deg,RL+20);t.b.style.left=(mx/FW*100)+'%';t.b.style.top=(my/FH*100)+'%';const on=q>.2+.75*(A.n<2?0:i/(A.n-1))||q>=1;t.b.classList.toggle('on',on);if(on)cur=i});
 if(A.pick!=null&&Math.abs(scrollY-(A.pickY||0))>90)A.pick=null;if(A.pick!=null)cur=A.pick;
 A.pts.forEach((t,i)=>{t.d.classList.toggle('on',i===cur);t.b.classList.toggle('cur',i===cur);if(i===cur)t.b.classList.add('on')})}
let raf=0;addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;tick()})},{passive:true});addEventListener('resize',()=>tick());
// sin música (decisión de la autora)
addEventListener('DOMContentLoaded',()=>{
 const xv=document.getElementById('closing-video');
 // «Os esperamos» llega cuando el abanico se ha cerrado y queda su silueta de luz
 const cl=document.getElementById('closing');if(cl&&!cl.querySelector('.ab-wait')){const w=el('p','ab-wait','Os esperamos');w.setAttribute('aria-hidden','true');cl.append(w);
  if(xv){xv.addEventListener('timeupdate',()=>{if(xv.currentTime>=5.6)w.classList.add('on')});xv.addEventListener('play',()=>{if(xv.currentTime<.5)w.classList.remove('on')})}
  if(reducedMotion())w.classList.add('on');new MutationObserver(()=>{if(cl.classList.contains('revealed'))w.classList.add('on')}).observe(cl,{attributes:true,attributeFilter:['class']})}
});
window.__GUEST_INTERIOR__={render};
})();
</script>
<script>
(()=>{'use strict';
const TEMPLATE={id:'design-12',version:'1.0.0'};
const BG5=["media/x42d3a2d25d662a41.jpg","media/xbbddd12c27edf975.jpg","media/x76ec14d9dd8b8446.jpg","media/x90ca6b284dddaeb7.jpg","media/xf24803387eab0de4.jpg"],BG4=["media/x00f2842050354dd6.jpg","media/x061f41373a6968ce.jpg","media/x4f023d950bdf423b.jpg","media/x4d8444ac72b44c5c.jpg"];
const COVER_TEXT_AT=4.4,CLOSING_TEXT_AT=6.6;
const id=x=>document.getElementById(x),hidden=(e,on)=>e.classList.toggle('invisible',!!on),text=(e,v)=>{e.textContent=String(v??'')};
const txt=v=>v==null?'':String(v).trim();
const node=(tag,cls,content)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)text(e,content);return e};
const safeUrl=v=>{if(!v)return null;try{const u=new URL(v,document.baseURI);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}};
const photoUrl=p=>{const s=typeof p==='string'?p:p?.src;if(!s||typeof s!=='string')return null;try{const u=new URL(s,document.baseURI);if(u.protocol==='data:')return /^data:image\//.test(s)?s:null;return ['https:','http:','blob:'].includes(u.protocol)?u.href:null}catch{return null}};
const clamp=(v,d=50)=>Math.max(0,Math.min(100,Number.isFinite(Number(v))?Number(v):d));
const reduced=()=>typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function setImage(el,p){const url=photoUrl(p);hidden(el,!url);if(!url){el.removeAttribute('src');return}el.src=url;el.dataset.fit=p?.fit==='full'?'full':'crop';el.style.objectPosition=clamp(p?.focusX)+'% '+clamp(p?.focusY)+'%';if(p?.alt)el.alt=p.alt}
function link(url,label){const href=safeUrl(url);if(!href)return null;const a=node('a','link',label);a.href=href;a.rel='noopener noreferrer';a.target='_blank';return a}
const st={config:null};
// Textos predefinidos del cuestionario común (idénticos a STORY del backend guest-invitation-flow).
const STORY_PRESETS={'story-01':'Llevamos años compartiendo planes, viajes, domingos tranquilos y muchas risas. Ahora nos hace muchísima ilusión celebrar el siguiente capítulo con vosotros.','story-02':'No sabemos exactamente cuándo empezó todo, pero sí sabemos que desde entonces la vida es mucho más divertida juntos. Y este día no tendría sentido sin vosotros.','story-03':'Entre planes improvisados, viajes, cenas que se alargan y días de sofá, hemos ido construyendo lo nuestro. Ahora toca celebrarlo con nuestra gente.','story-04':'Después de tantos momentos compartidos, ha llegado uno que queremos vivir rodeados de las personas que forman parte de nuestra historia: vosotros.','story-05':'Nos elegimos hace tiempo y seguimos eligiéndonos cada día. Ahora queremos celebrarlo como más nos gusta: con nuestra familia y amigos cerca.'};
const dateLabel=d=>{const iso=String(d||'');const v=/^\d{4}-\d{2}-\d{2}$/.test(iso)?new Date(iso+'T12:00:00'):null;return v&&!isNaN(v)?new Intl.DateTimeFormat(st.config?.locale==='en'?'en-GB':'es-ES',{day:'numeric',month:'long',year:'numeric'}).format(v):iso};
const ICON={
 times:'<svg viewBox="0 0 32 32"><rect x="5" y="6" width="22" height="17" rx="3"/><path d="M5 15h22M10 6v9M16 6v9M22 6v9"/><circle cx="10.5" cy="25.5" r="2.2"/><circle cx="21.5" cy="25.5" r="2.2"/></svg>',
 accommodation:'<svg viewBox="0 0 32 32"><path d="M4 25V9M4 19h24v6M4 15h6a3 3 0 0 1 3 3v1M13 19v-4h11a4 4 0 0 1 4 4"/><circle cx="8" cy="13" r="2"/></svg>',
 gift:'<svg viewBox="0 0 32 32"><rect x="5" y="12" width="22" height="15" rx="1"/><path d="M3.5 12h25M16 12v15M16 12c-3-6-9-6-8-2 .5 2 5 2 8 2zM16 12c3-6 9-6 8-2-.5 2-5 2-8 2z"/></svg>',
 playlist:'<svg viewBox="0 0 32 32"><path d="M12 23V7l14-3v16"/><ellipse cx="8.5" cy="23.5" rx="3.6" ry="2.8"/><ellipse cx="22.5" cy="20.5" rx="3.6" ry="2.8"/><path d="M12 12l14-3"/></svg>',
 ceremony:'<svg viewBox="0 0 32 32"><circle cx="12.5" cy="18" r="7"/><circle cx="19.5" cy="18" r="7"/><path d="M14 6l2-3 2 3-2 2z"/></svg>',
 celebration:'<svg viewBox="0 0 32 32"><path d="M8 4h7l-.5 6a3 3 0 0 1-6 0zM17 4h7l-.5 6a3 3 0 0 1-6 0zM11.5 13v11M20.5 13v11M8 26h7M17 26h7"/></svg>'};
const icon=k=>{const e=node('span','pr-icon');e.innerHTML=ICON[k]||'';e.setAttribute('aria-hidden','true');return e};
/* ---- lugares ---- */
function placeSection(i){const a=node('article','location '+(i.type||'shared'));a.append(icon(i.type==='celebration'?'celebration':'ceremony'));a.append(node('p','location-type',i.type==='ceremony'?'Ceremonia':i.type==='celebration'?'Celebración':'Ceremonia y celebración'));a.append(node('h3','location-name',i.name||''));if(txt(i.time))a.append(node('p','location-time',i.time));if(txt(i.address))a.append(node('p','location-address',i.address));const links=node('div','location-links');const ml=link(i.mapsUrl,'Cómo llegar'),wl=link(i.websiteUrl,'Web');if(ml)links.append(ml);if(wl)links.append(wl);if(links.childElementCount)a.append(links);return a}
/* ---- práctico (mapeo canónico del cuestionario; nunca inventar CTA) ---- */
function addLines(container,lines){const items=lines.map(txt).filter(Boolean);if(!items.length)return;const p=node('p','practical-details');for(const item of items){const s=node('span','practical-line');const m=item.match(/^(Ida|Vuelta):\s*(.*)$/);if(m){s.classList.add('travel-time');s.append(node('span','time-label',m[1]),node('strong','time-value',m[2]))}else s.textContent=item;p.append(s)}container.append(p)}
function addBlock(root,title,lines,links=[],more=null,kind=''){

/* ---- volver a ver: reproduce de nuevo sin ocultar los datos ni el botón de confirmar ---- */
function replay(v,scene){let t=null;const done=()=>{scene.classList.remove('replaying');clearTimeout(t)};v.addEventListener('ended',done);
 return e=>{e.stopPropagation();scene.classList.add('replaying');try{v.currentTime=0}catch{}const pr=v.play();if(pr&&pr.catch)pr.catch(done);clearTimeout(t);t=setTimeout(done,((v.duration||12)+1.5)*1000)}}
