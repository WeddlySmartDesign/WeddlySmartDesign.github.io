*{box-sizing:border-box}html{scroll-behavior:smooth}

/* ---------- escenas interiores ---------- */
[data-scene]{position:relative;isolation:isolate;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(50px,7svh,76px) max(30px,env(safe-area-inset-right)) max(64px,env(safe-area-inset-bottom));overflow:hidden;background-color:var(--paper);background-size:100% 100%;background-repeat:no-repeat;background-position:50% 50%}

h1,h2,h3,p{margin-top:0}h1,h2{font-weight:400}
h2{font:400 clamp(54px,14vw,84px)/1.05 var(--title);margin:0 0 18px;color:var(--accent)}

.scene-paragraph{font-size:clamp(20px,5.2vw,24px);line-height:1.42;overflow-wrap:anywhere;white-space:pre-line;max-width:31ch;margin:0 auto 14px}

.feather{display:block;border:0;border-radius:0;box-shadow:none;background:transparent;
 -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 80%,transparent 100%),linear-gradient(to right,transparent 0%,#000 10%,#000 90%,transparent 100%);
 -webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 80%,transparent 100%),linear-gradient(to right,transparent 0%,#000 10%,#000 90%,transparent 100%);mask-composite:intersect}
.feather[data-fit="full"]{-webkit-mask-image:none;mask-image:none;object-fit:contain!important;height:auto!important;max-height:46svh}
#story-photo{width:min(100%,470px);height:clamp(230px,37svh,360px);margin:6px auto 0;object-fit:cover}
.link,.rsvp-button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 18px;border:1px solid var(--line);border-radius:999px;text-decoration:none;font:500 15px/1.2 var(--smallcaps);letter-spacing:.06em;color:var(--ink);background:var(--btn);max-width:100%;overflow-wrap:anywhere}
.link:focus-visible,.rsvp-button:focus-visible,.entry-button:focus-visible,summary:focus-visible,.gallery-dot:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* lugares */
.location-photo{margin:4px auto 20px;max-width:min(100%,460px)}
.location-hero-photo{width:100%;height:clamp(210px,29svh,286px);object-fit:cover}
.location{margin:16px auto 0}.location+.location{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.location-type{font:600 15px/1.3 var(--smallcaps);letter-spacing:.14em;margin:0 0 4px;color:var(--soft)}
.location-name{font:400 clamp(27px,7vw,38px)/1.05 var(--serif);margin:0 0 4px}
.location-time{font:400 23px/1.1 var(--serif);margin:0 0 6px}

.location-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:4px}
/* agenda */
.agenda-list{position:relative;max-width:360px;margin:18px auto 0;text-align:left;--p:0}
.agenda-track{position:absolute;top:8px;bottom:8px;left:22px;width:1px;background:var(--line)}
.agenda-track::after{content:"";position:absolute;left:-1px;top:0;width:3px;height:calc(var(--p)*100%);background:var(--accent);border-radius:2px;transition:height .25s linear}
.moment{position:relative;display:grid;grid-template-columns:1fr;row-gap:2px;padding:14px 0 14px 60px;opacity:.32;transform:translateX(10px);transition:opacity .7s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.moment.on{opacity:1;transform:none}
.moment-node{position:absolute;left:13px;top:19px;width:19px;height:19px;border:1px solid var(--accent);background:var(--paper);transform:rotate(45deg) scale(.7);transition:transform .6s cubic-bezier(.3,1.6,.5,1),background .4s}
.moment.on .moment-node{background:var(--accent);transform:rotate(45deg) scale(1)}
.moment-time{font:400 18px/1 var(--num);color:var(--accent);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.moment-label{font:400 clamp(22px,5.8vw,27px)/1.15 var(--serif);overflow-wrap:anywhere}
/* práctico */
.practical-item{margin:0 auto;max-width:350px;padding:14px 0}

.practical-details{font:400 clamp(19px,4.9vw,22px)/1.3 var(--serif);margin:0 auto 8px;overflow-wrap:anywhere;max-width:33ch}
.practical-line{display:block;white-space:pre-line}.practical-line+.practical-line{margin-top:3px}
.practical-item.times .practical-details{display:flex;flex-wrap:wrap;justify-content:center;column-gap:22px;row-gap:3px}
.practical-item.times .practical-line:not(.travel-time){flex:1 1 100%}
.travel-time{display:inline-flex!important;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums}
.time-label{font:500 14px/1.2 var(--smallcaps);letter-spacing:.1em;color:var(--soft)}.time-value{font:500 22px/1.15 var(--serif)}
.practical-item.accommodation .practical-details>.practical-line:first-child{font-size:clamp(22px,5.7vw,27px);line-height:1.17}
.practical-item details{margin:6px auto 0;width:min(100%,310px)}
.practical-item summary{list-style:none;display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 6px;cursor:pointer;font:500 16px/1.2 var(--smallcaps);letter-spacing:.05em;border-bottom:1px solid var(--line)}
.practical-item summary::-webkit-details-marker{display:none}.practical-item summary::marker{content:""}
.practical-item details .practical-details{margin-top:10px;font-size:clamp(18px,4.7vw,20px)}

/* galería: carrusel, nunca collage */

.gallery-dots{display:flex;justify-content:center;gap:2px}

/* ---------- portada ---------- */
#cover,#closing{padding:0;min-height:100svh;min-height:100dvh;display:block;overflow:hidden;background:var(--cover-bg)}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;z-index:0}
.cover-text,.closing-text{position:absolute;z-index:2;left:22px;right:22px;text-align:center;color:var(--cover-ink);text-shadow:var(--cover-halo);opacity:0;transform:translateY(10px);transition:opacity 1.2s ease,transform 1.2s ease}
.cover-text{top:max(7svh,calc(env(safe-area-inset-top) + 34px))}
#cover.opened .cover-text,#closing.revealed .closing-text{opacity:1;transform:none}
.cover-scrim,.closing-scrim{position:absolute;left:0;right:0;z-index:1;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.cover-scrim{top:0;height:48%;background:linear-gradient(180deg,rgba(255,240,226,.55) 0%,rgba(255,240,226,.3) 55%,rgba(255,240,226,0) 100%)}
#cover.opened .cover-scrim,#closing.revealed .closing-scrim{opacity:1}
.cover-tag{font:600 clamp(15px,4vw,19px)/1.2 var(--smallcaps);letter-spacing:.16em;margin:0 0 6px}

.cover-bottom{position:absolute;z-index:3;left:20px;right:20px;bottom:max(6svh,calc(env(safe-area-inset-bottom) + 18px));display:flex;justify-content:center;opacity:0;transition:opacity 1s ease .4s;pointer-events:none}
#cover.opened .cover-bottom{opacity:1;pointer-events:auto}
.entry-button{font:600 16px/1.2 var(--smallcaps);letter-spacing:.08em;border:1px solid var(--cover-btn-line);border-radius:999px;padding:13px 26px;min-height:50px;background:var(--cover-btn);color:var(--cover-btn-ink);cursor:pointer;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.tap-hint{position:absolute;z-index:3;left:0;right:0;bottom:max(9svh,calc(env(safe-area-inset-bottom) + 30px));display:flex;flex-direction:column;align-items:center;gap:12px;border:0;background:none;color:var(--hint-ink);cursor:pointer;font:500 clamp(17px,4.6vw,20px)/1.2 var(--serif);font-style:italic;letter-spacing:.1em;text-shadow:var(--hint-halo);transition:opacity .6s;padding:14px 0;min-height:64px}
.tap-hint .dot{width:11px;height:11px;border-radius:50%;background:var(--hint-ink);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--hint-pulse)}100%{box-shadow:0 0 0 24px rgba(0,0,0,0)}}
#cover.playing .tap-hint,#cover.opened .tap-hint{opacity:0;pointer-events:none}

.close-date{font:600 15px/1.2 var(--smallcaps);letter-spacing:.14em;margin:0 0 8px}
.closing-text .rsvp-button{min-width:220px;min-height:52px;font-size:16px;color:var(--closing-btn-ink);background:var(--closing-btn);border-color:var(--closing-btn-line);text-shadow:none}
[data-scene].is-first,[data-scene].is-last{min-height:88svh}[data-scene].is-last{padding-bottom:max(19svh,120px)}
#cover.long-names .cover-names{font-size:clamp(44px,11.2vw,72px)}#cover.long-names .cover-tag{margin-bottom:2px}
@media(max-width:360px){[data-scene]{padding-inline:22px}h2{font-size:46px}.cover-names{font-size:52px}#cover.long-names .cover-names{font-size:40px}.cover-date{font-size:15px;letter-spacing:.12em}.location-name{font-size:26px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.tap-hint .dot{animation:none}.cover-text,.closing-text,.cover-bottom,.cover-scrim,.closing-scrim{transition:none}}

/* ---------- movimiento premium de las escenas interiores ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:0;transition:opacity .9s ease}
#fx.on{opacity:1}
.motif{display:block;width:clamp(78px,22vw,104px);height:auto;margin:0 auto 14px;opacity:0;transform:translateY(14px) scale(.9);transition:opacity 1.4s ease,transform 1.6s cubic-bezier(.2,.8,.2,1)}
.in .motif,.motif.in{opacity:1;transform:none}
.motif.idle-rotate{animation:motifRotate 60s linear infinite}
.motif.idle-float{animation:motifFloat 6s ease-in-out infinite}
.motif.idle-flap{animation:motifFlap 1.9s ease-in-out infinite}
.motif.idle-glow{animation:motifGlow 4.5s ease-in-out infinite}
@keyframes motifRotate{to{rotate:360deg}}
@keyframes motifFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes motifFlap{0%,100%{scale:1 1}50%{scale:.62 1}}
@keyframes motifGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,215,150,0))}50%{filter:drop-shadow(0 0 10px rgba(255,215,150,.75))}}
.section-kicker,h2,.rule-orn{will-change:opacity}
.rv-head .section-kicker{opacity:0;letter-spacing:.32em;transition:opacity 1.1s ease,letter-spacing 1.6s cubic-bezier(.2,.8,.2,1)}
.rv-head h2{clip-path:inset(-20% 100% -20% 0);transition:clip-path 1.7s cubic-bezier(.6,.05,.2,1) .25s}
.rv-head .rule-orn path{stroke-dasharray:240;stroke-dashoffset:240;transition:stroke-dashoffset 1.8s ease .8s}
.rv-head .rule-orn circle{opacity:0;transition:opacity .6s ease 1.9s}
.rv-head.in .section-kicker{opacity:1;letter-spacing:var(--label-track)}
.rv-head.in h2{clip-path:inset(-20% -5% -20% 0)}
.rv-head.in .rule-orn path{stroke-dashoffset:0}.rv-head.in .rule-orn circle{opacity:1}
.rule-orn{display:block;width:150px;height:14px;margin:-8px auto 16px;color:var(--accent)}
.rv{opacity:0;transform:translate3d(0,26px,0);transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
img.feather.rv{transform:scale(1.07);filter:blur(3px);transition:opacity 1.5s ease,transform 2.4s cubic-bezier(.2,.8,.2,1),filter 1.4s ease}
img.feather.rv.in{transform:none;filter:none}
@media(prefers-reduced-motion:reduce){.rv,.rv-head .section-kicker,.rv-head h2,img.feather.rv,.motif{opacity:1!important;transform:none!important;clip-path:none!important;filter:none!important;letter-spacing:.11em;transition:none!important;animation:none!important}.rv-head .rule-orn path{stroke-dashoffset:0}.rv-head .rule-orn circle{opacity:1}#fx{display:none}}
/* mientras se vuelve a ver, los textos se apartan para ver la escena entera; vuelven al terminar */
#cover.replaying .cover-text,#cover.replaying .cover-scrim,#cover.replaying .cover-bottom,#closing.replaying .closing-text,#closing.replaying .closing-scrim{opacity:0!important;pointer-events:none}
/* volver a ver portada y cierre: discreto, aparece cuando ya se han visto */
.replay{position:absolute;z-index:3;top:max(14px,calc(env(safe-area-inset-top) + 10px));right:12px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(20,20,28,.16);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s ease}
.replay svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}
#cover.opened .replay,#closing.revealed .replay{opacity:.85;pointer-events:auto}
.replay:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* franjas de continuidad: quedan detrás de la primera y la última sección, sin trozos de fondo vacío */
main>img[class$="-band"]{position:relative;z-index:0}
#cover+img[class$="-band"]{-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
main>img[class$="-band"]:not(#cover+img){-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
main>[data-bg]{position:relative;z-index:1}
/* ===== composición editorial sin tarjetas: numeración, filetes y adornos tipográficos ===== */
.pr-icon{display:none}
#practical-items{display:block;max-width:400px;margin:6px auto 0;counter-reset:pr}
.practical-item{position:relative;counter-increment:pr;display:grid;grid-template-columns:54px 1fr;column-gap:14px;align-items:start;text-align:left;width:100%;max-width:none;padding:28px 0 24px}
.practical-item::before{content:counter(pr,var(--pr-style,upper-roman));grid-column:1;grid-row:1/span 8;font:var(--numeral-font,400 40px/1 var(--title));color:var(--accent);opacity:.9;text-align:center;padding-top:1px}
.practical-item>*{grid-column:2}
.practical-item+.practical-item{border-top:1px solid var(--line)}
.practical-item+.practical-item::after,.location+.location::before{content:var(--glyph,"◆");position:absolute;left:50%;top:0;transform:translate(-50%,-55%);padding:0 12px;background:var(--paper);color:var(--accent);font:400 13px/1 Georgia,'DejaVu Serif',serif}
.practical-title{margin:0 0 6px;font-size:calc(clamp(16px,4.4vw,19px)*var(--label-size));text-align:left;font-family:var(--label);text-transform:var(--label-case);letter-spacing:calc(var(--label-track) + .02em)}
.practical-details{margin:0 0 8px;max-width:none;text-align:left}
.practical-item .location-links{justify-content:flex-start;gap:4px 22px}
.practical-item.times .practical-details{justify-content:flex-start}
.travel-time{align-items:flex-start}
.practical-item details{margin:2px 0 0;width:auto}
.practical-item summary{justify-content:flex-start;padding:8px 0}
.location{position:relative;margin:0 auto;padding:20px 0 18px;max-width:400px}
.location+.location{border-top:1px solid var(--line);margin-top:10px;padding-top:30px}
.link{border-radius:0;background:transparent;border:0;border-bottom:1px solid currentColor;padding:12px 0 5px;min-height:44px;font:500 12.5px/1.2 var(--label);text-transform:uppercase;letter-spacing:.18em;color:var(--accent)}
.link::after{content:"";display:inline-block;width:14px;height:1px;margin-left:8px;background:currentColor;vertical-align:middle;transition:width .3s}
.link:hover::after{width:22px}
.location-links{gap:4px 24px}
.practical-item summary{font-family:var(--label);text-transform:var(--label-case);font-size:12.5px;letter-spacing:.16em;color:var(--accent)}
.location-type{font-family:var(--label);text-transform:var(--label-case);letter-spacing:calc(var(--label-track) + .06em)}
.travel-time .time-label{font-family:var(--label);text-transform:var(--label-case)}
.time-value,.location-time{font-family:var(--num)}

/* ===== AZULEJO · cerámica pintada a mano, cobalto ===== */
html[data-skin=azulejo]{--title:'Chorus',var(--script);--serif:'Lora',Georgia,serif;--label:'Lora',Georgia,serif;--num:'Lora',Georgia,serif;--label-case:uppercase;--label-track:.24em;--label-size:.68}
html[data-skin=azulejo]{--glyph:'◆';--pr-style:upper-roman;--numeral-font:400 44px/1 'Chorus',serif}

/* El fondo pasa del melocotón del atardecer al lila de la noche, igual que van del vídeo de portada al de cierre. */
html.lm{background:#f5e0ce}

.lm-in{position:relative;max-width:420px;margin:0 auto;text-align:center}

.lm-bl.lm-rv{transform:none;transition:opacity 2s ease}

 -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 76%,transparent 100%),linear-gradient(to right,transparent 0%,#000 14%,#000 86%,transparent 100%);-webkit-mask-composite:source-in;
 mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 76%,transparent 100%),linear-gradient(to right,transparent 0%,#000 14%,#000 86%,transparent 100%);mask-composite:intersect}
.lm-fade[data-fit=full]{object-fit:contain;height:auto;max-height:420px;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 88%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 10%,#000 88%,transparent 100%)}
.lm-fade.lm-rv{transform:scale(1.05);filter:blur(4px) saturate(.9);transition:opacity 1.6s ease,transform 2.6s cubic-bezier(.2,.8,.2,1),filter 1.6s}

 background:radial-gradient(circle,#fff3c4 0%,#f8d27a 38%,var(--sun,#f0a860) 62%,rgba(240,168,96,0) 72%);box-shadow:0 0 34px 12px rgba(248,196,120,.45);transition:left 1.3s cubic-bezier(.3,.9,.25,1),top 1.3s cubic-bezier(.3,.9,.25,1)}

 linear-gradient(to bottom left,transparent calc(50% - .6px),rgba(119,89,104,.18) 50%,transparent calc(50% + .6px)) 100% 0/50% 100% no-repeat,
 linear-gradient(160deg,#fffaf3,#f6ece2);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 6px 14px rgba(86,61,75,.13);transition:transform .9s cubic-bezier(.3,.9,.25,1),box-shadow .9s}
