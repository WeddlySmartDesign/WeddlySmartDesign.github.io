<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Factura · GUEST by WeddlySmartDesign</title>
  <link rel="icon" href="../assets/brand/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../css/fonts.css?v=43">
  <style>
    /* Factura para la pareja: se lee bien en el móvil y se guarda en PDF desde el navegador. */
    :root { --paper: #fbf7f4; --envelope: #f0c4bc; --ink: #1b2650; --ink-soft: #4a5480; --postmark: #b3263a; --line: #e3d6d1; --white: #fff; --display: 'Abril Fatface', Georgia, serif; --mono: 'Courier Prime', 'Courier New', monospace; --text: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.55 var(--text); -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    .wrap { max-width: 46rem; margin: 0 auto; padding: 1.25rem 16px 3rem; }
    .actions { display: flex; justify-content: flex-end; margin-bottom: 1rem; }
    .btn { display: inline-flex; align-items: center; gap: .5rem; min-height: 48px; padding: 0 1.1rem; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--ink); color: var(--paper); font: 600 1rem var(--text); cursor: pointer; }
    .btn:active { transform: scale(.97); }
    .sheet { position: relative; overflow: hidden; background: var(--white); border-radius: 12px; padding: clamp(1.25rem, 4vw, 2.75rem); box-shadow: 0 1px 2px rgba(27, 38, 80, .08), 0 24px 48px -30px rgba(27, 38, 80, .5); }
    .head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem 2rem; padding-bottom: 1.25rem; border-bottom: 1.5px solid var(--line); }
    .brand b { display: block; font: 400 1.9rem/1 var(--display); }
    .brand span { font: 400 .8rem/1 var(--mono); }
    .doc { text-align: left; }
    @media (min-width: 640px) { .doc { text-align: right; } }
    .doc h1 { margin: 0; font: 400 clamp(1.5rem, 4vw, 2rem)/1.1 var(--display); }
    .doc p { margin: .3rem 0 0; font: 700 .9375rem/1.3 var(--mono); }
    .parties { display: grid; gap: 1.25rem; margin: 1.5rem 0; }
    .parties h2 { margin: 0 0 .3rem; font: 700 .75rem/1 var(--mono); color: var(--ink-soft); }
    .parties p { margin: 0; font-size: .9375rem; }
    .ref { margin: 0 0 1.25rem; padding: .75rem .9rem; border-radius: 8px; background: #fdf1e6; font-size: .9375rem; }
    table { width: 100%; border-collapse: collapse; font-size: .9375rem; }
    th { text-align: left; font: 700 .75rem/1 var(--mono); color: var(--ink-soft); padding: 0 0 .6rem; border-bottom: 1.5px solid var(--line); }
    td { padding: .9rem 0; vertical-align: top; border-bottom: 1px solid var(--line); }
    .num { text-align: right; white-space: nowrap; padding-left: 1rem; }
    .totals { margin: 1rem 0 0 auto; width: min(100%, 20rem); font-size: .9375rem; }
    .totals div { display: flex; justify-content: space-between; padding: .3rem 0; }
    .totals .grand { margin-top: .4rem; padding-top: .7rem; border-top: 1.5px solid var(--ink); font-weight: 700; font-size: 1.125rem; }
    .foot { margin-top: 1.75rem; font-size: .8125rem; color: var(--ink-soft); }
    .foot code { font: 400 .75rem var(--mono); word-break: break-all; }
    .test { position: absolute; top: 1.4rem; right: -3.2rem; rotate: 35deg; padding: .3rem 4rem; background: var(--postmark); color: var(--white); font: 700 .75rem/1 var(--mono); letter-spacing: .1em; }
    .state { padding: 3rem 16px; text-align: center; color: var(--ink-soft); }
    .state h1 { color: var(--ink); font: 400 2rem/1.1 var(--display); margin: 0 0 .5rem; }
    @media (min-width: 640px) { .parties { grid-template-columns: 1fr 1fr; } }
    @media print {
      @page { size: A4; margin: 16mm; }
      body { background: #fff; }
      .actions { display: none; }
      .wrap { padding: 0; max-width: none; }
      .sheet { box-shadow: none; padding: 0; border-radius: 0; }
      .parties { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
<main class="wrap">
  <div class="state" id="state"><h1>Abriendo la factura</h1><p>Un momento.</p></div>
  <div id="doc" hidden>
    <div class="actions"><button class="btn" type="button" onclick="print()">Guardar en PDF</button></div>
    <article class="sheet">
      <span class="test" id="test" hidden>PRUEBA · SIN VALIDEZ</span>
      <header class="head">
        <div class="brand"><b>GUEST</b><span>by WeddlySmartDesign</span></div>
        <div class="doc"><h1 id="title">Factura simplificada</h1><p id="number"></p><p id="date"></p></div>
      </header>
      <section class="parties">
        <div><h2>Emite</h2><p id="issuer"></p></div>
        <div><h2>Cliente</h2><p id="buyer"></p></div>
      </section>
      <p class="ref" id="ref" hidden></p>
      <table>
        <thead><tr><th>Concepto</th><th class="num">Importe</th></tr></thead>
        <tbody><tr><td id="concept"></td><td class="num" id="line"></td></tr></tbody>
      </table>
      <div class="totals">
        <div><span>Base imponible</span><span id="base"></span></div>
        <div><span id="vatLabel">IVA</span><span id="vat"></span></div>
        <div class="grand"><span>Total</span><span id="total"></span></div>
      </div>
      <p class="foot">Pago con tarjeta a través de Stripe. Huella del registro: <code id="hash"></code></p>
    </article>
  </div>
</main>
<script>
(() => {
'use strict';
const API = 'https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/guest-automation';
const $ = (id) => document.getElementById(id);
const eur = (c) => (c / 100).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });
const day = (d) => new Date(d).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'Europe/Madrid' });
function fail() { $('state').innerHTML = '<h1>No hemos podido abrir la factura</h1><p>Responded al email en el que os llegó y os la mandamos de nuevo.</p>'; }
(async () => {
  const token = new URLSearchParams(location.search).get('f') || '';
  if (!token) return fail();
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'invoice', token }) });
    const j = await r.json();
    if (!r.ok || !j.ok) throw Error(j.error);
    const i = j.invoice, s = j.issuer, rect = i.kind === 'rectificative';
    $('title').textContent = rect ? 'Factura rectificativa' : 'Factura simplificada';
    $('number').textContent = 'Nº ' + i.number;
    $('date').textContent = day(i.issuedAt);
    $('issuer').innerHTML = '';
    [s.name, 'NIF ' + s.nif, s.address, s.email].forEach((t) => { const l = document.createElement('span'); l.textContent = t; $('issuer').append(l, document.createElement('br')); });
    [i.buyerName, i.buyerEmail].filter(Boolean).forEach((t) => { const l = document.createElement('span'); l.textContent = t; $('buyer').append(l, document.createElement('br')); });
    if (rect && i.rectifies) { $('ref').hidden = false; $('ref').textContent = `Rectifica la factura ${i.rectifies.number} del ${day(i.rectifies.issued_at)} por devolución del importe.`; }
    $('concept').textContent = i.concept;
    $('line').textContent = eur(i.totalCents);
    $('base').textContent = eur(i.baseCents);
    $('vatLabel').textContent = `IVA (${i.vatRate} %)`;
    $('vat').textContent = eur(i.vatCents);
    $('total').textContent = eur(i.totalCents);
    $('hash').textContent = i.hash;
    $('test').hidden = !i.test;
    document.title = `Factura ${i.number} · GUEST`;
    $('state').hidden = true; $('doc').hidden = false;
  } catch { fail(); }
})();
})();
</script>
</body>
</html>
