<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    /* App de pedidos de la propietaria. Pensada para el móvil: una bandeja con lo que le toca,
       y cada pedido con su invitación ya montada y un único botón para avanzar. */
    :root {
      --paper: #fbf7f4; --envelope: #f0c4bc; --envelope-soft: #f6dcd6; --ink: #1b2650; --ink-soft: #4a5480;
      --postmark: #b3263a; --line: #e3d6d1; --white: #fff; --ok: #2f6b45; --ok-soft: #e4efe7; --wait-soft: #eef0f7;
      --display: 'Abril Fatface', Georgia, serif; --mono: 'Courier Prime', 'Courier New', monospace;
      --text: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --top: calc(56px + env(safe-area-inset-top, 0px));
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.5 var(--text); -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    svg { flex: none; }

    .bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .5rem; min-height: var(--top); padding: env(safe-area-inset-top, 0px) 8px 0 16px; background: var(--envelope); }
    .bar h1 { margin: 0; font: 400 1.5rem/1 var(--display); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ib { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
    .ib:active { background: rgba(27, 38, 80, .08); }
    .ib svg { width: 22px; height: 22px; }
    .ib.spin svg { animation: spin 800ms linear infinite; }
    @keyframes spin { to { rotate: 360deg; } }
    .back { margin-left: -8px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 52px; padding: 0 1.25rem; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 1.0625rem; cursor: pointer; text-decoration: none; transition: transform 140ms var(--ease-out), opacity 160ms ease; }
    .btn:active { transform: scale(.97); }
    .btn.line { background: transparent; color: var(--ink); }
    .btn.wide { width: 100%; }
    .btn[disabled] { opacity: .5; pointer-events: none; }

    /* Entrar */
    .login { max-width: 26rem; margin: 0 auto; padding: 14vh 16px 2rem; display: grid; gap: 1rem; }
    .login h2 { margin: 0; font: 400 2.6rem/1.02 var(--display); }
    .login p { margin: 0; color: var(--ink-soft); }
    input[type="password"], input[type="search"] { width: 100%; min-height: 52px; padding: .8rem .9rem; border: 1.5px solid var(--line); border-radius: 10px; background: var(--white); color: var(--ink); font: 400 1.0625rem var(--text); }
    input:focus { outline: none; border-color: var(--ink); }
    .msg { margin: 0; color: var(--postmark); font-size: .9375rem; }
    .msg:empty { display: none; }

    /* Bandeja */
    .view { padding: 1rem 16px calc(6rem + env(safe-area-inset-bottom, 0px)); max-width: 44rem; margin: 0 auto; }
    .hello { margin: .5rem 0 1.25rem; }
    .hello strong { display: block; font: 400 clamp(2rem, 6vw, 2.6rem)/1.04 var(--display); }
    .hello span { display: block; margin-top: .35rem; color: var(--ink-soft); }
    .sec { margin-top: 1.75rem; }
    .sec:first-of-type { margin-top: 0; }
    .sec > h3 { display: flex; align-items: baseline; gap: .5rem; margin: 0 0 .6rem; font: 700 .8125rem/1 var(--mono); color: var(--ink-soft); }
    .sec > h3 b { color: var(--ink); }
    .cards { display: grid; gap: .6rem; }
    .card { display: grid; grid-template-columns: 52px 1fr auto; gap: .9rem; align-items: center; width: 100%; padding: .7rem .8rem .7rem .7rem; border: 0; border-radius: 12px; background: var(--white); box-shadow: 0 1px 2px rgba(27, 38, 80, .08), 0 10px 24px -18px rgba(27, 38, 80, .5); text-align: left; cursor: pointer; transition: transform 140ms var(--ease-out); }
    .card:active { transform: scale(.985); }
    .card img, .card .ph { width: 52px; height: 70px; border-radius: 6px; object-fit: cover; background: var(--envelope-soft); }
    .card b { display: block; font-weight: 600; font-size: 1.0625rem; line-height: 1.3; }
    .card small { display: block; margin-top: .15rem; font-size: .875rem; color: var(--ink-soft); }
    .card .chev { width: 20px; height: 20px; color: var(--ink-soft); }
    .card.flat { box-shadow: none; background: transparent; border-top: 1px solid var(--line); border-radius: 0; padding-inline: 0; }
    .pill { display: inline-block; margin-top: .4rem; padding: .25rem .5rem; border-radius: 6px; font: 700 .75rem/1.2 var(--mono); background: var(--wait-soft); color: var(--ink-soft); }
    .pill.you { background: var(--postmark); color: var(--white); }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }
    .calm { padding: 1.25rem; border-radius: 12px; background: var(--white); color: var(--ink-soft); }
    .calm b { display: block; color: var(--ink); font: 400 1.35rem/1.15 var(--display); margin-bottom: .25rem; }
    .search { margin-bottom: .9rem; }
    .chips { display: flex; gap: .4rem; overflow-x: auto; margin: 0 -16px .9rem; padding: 0 16px 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; min-height: 38px; padding: 0 .9rem; border: 1.5px solid var(--line); border-radius: 99px; background: var(--white); font-weight: 600; font-size: .9375rem; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

    .tabs { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr 1fr; padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--white) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
    .tab { display: grid; justify-items: center; gap: 2px; min-height: 52px; padding-top: 6px; border: 0; background: none; font-size: .8125rem; font-weight: 600; color: var(--ink-soft); cursor: pointer; position: relative; }
    .tab svg { width: 24px; height: 24px; }
    .tab[aria-current="page"] { color: var(--ink); }
    .tab .dot { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--postmark); color: var(--white); font: 700 .6875rem/18px var(--text); }

    /* Pedido */
    .order { padding: 1rem 16px calc(7.5rem + env(safe-area-inset-bottom, 0px)); max-width: 64rem; margin: 0 auto; }
    .o-head .pill { margin: 0 0 .5rem; }
    .o-head h2 { margin: 0; font: 400 clamp(2rem, 6.5vw, 2.8rem)/1.02 var(--display); overflow-wrap: anywhere; }
    .o-head p { margin: .35rem 0 0; color: var(--ink-soft); }
    .o-grid { display: grid; gap: 1.25rem; margin-top: 1.25rem; }
    .stage { position: relative; display: grid; justify-items: center; }
    .phone { width: min(78vw, 320px); aspect-ratio: 390 / 760; border-radius: 30px; padding: 8px; background: var(--ink); box-shadow: 0 24px 48px -24px rgba(27, 38, 80, .65); }
    .screen { position: relative; width: 100%; height: 100%; border-radius: 23px; overflow: hidden; background: var(--envelope-soft); display: grid; place-items: center; text-align: center; color: var(--ink-soft); font-size: .9375rem; }
    .screen p { padding: 1.25rem; margin: 0; }
    .screen iframe { width: 100%; height: 100%; }
    .grow { margin-top: .75rem; display: inline-flex; align-items: center; gap: .4rem; min-height: 44px; padding: 0 .9rem; border: 0; border-radius: 10px; background: transparent; font-weight: 600; cursor: pointer; }
    .grow svg { width: 18px; height: 18px; }
    .grow:active { background: rgba(27, 38, 80, .06); }

    .box { padding: 1.1rem; border-radius: 12px; background: var(--white); box-shadow: 0 1px 2px rgba(27, 38, 80, .08), 0 14px 30px -24px rgba(27, 38, 80, .5); }
    .box h3 { margin: 0 0 .35rem; font: 400 1.35rem/1.15 var(--display); }
    .box p { margin: 0; color: var(--ink-soft); font-size: .9375rem; }
    .ask { margin-top: .8rem; padding: .85rem 1rem; border-radius: 10px; background: #fdf1e6; font-size: .9375rem; white-space: pre-line; }
    .ask b { display: block; margin-bottom: .2rem; }

    .steps { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; }
    .steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: .75rem; align-items: center; min-height: 44px; position: relative; color: var(--ink-soft); }
    .steps li::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--line); }
    .steps li:first-child::before { top: 50%; }
    .steps li:last-child::before { bottom: 50%; }
    .steps i { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); display: grid; place-items: center; }
    .steps li.done { color: var(--ink); }
    .steps li.done i { background: var(--ink); border-color: var(--ink); }
    .steps li.done i::after { content: ""; width: 9px; height: 5px; border: solid var(--paper); border-width: 0 0 2px 2px; rotate: -45deg; translate: 0 -1px; }
    .steps li.now { color: var(--ink); font-weight: 600; }
    .steps li.now i { border-color: var(--postmark); box-shadow: 0 0 0 4px rgba(179, 38, 58, .14); }
    .steps small { font-size: .8125rem; color: var(--ink-soft); font-weight: 400; }

    .rows { margin: .3rem 0 0; padding: 0; list-style: none; }
    .rows li { border-top: 1px solid var(--line); }
    .rows li:first-child { border-top: 0; }
    .rows a, .rows button { display: flex; align-items: center; gap: .75rem; width: 100%; min-height: 52px; padding: .4rem 0; border: 0; background: none; text-align: left; text-decoration: none; cursor: pointer; }
    .rows svg { width: 20px; height: 20px; color: var(--ink-soft); }
    .rows span { flex: 1; min-width: 0; }
    .rows small { display: block; font-size: .8125rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rows .chev { width: 18px; height: 18px; }

    .dock { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; padding: .75rem 16px calc(.75rem + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--white) 95%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
    .dock-in { max-width: 44rem; margin: 0 auto; display: grid; gap: .5rem; }
    .dock .msg { text-align: center; }
    .d-act { display: none; gap: .5rem; margin-top: 1rem; justify-items: start; }

    /* Invitación a pantalla completa */
    .full { position: fixed; inset: 0; z-index: 50; background: var(--ink); }
    .full-host { position: absolute; inset: 0; }
    .full-host iframe { width: 100%; height: 100%; }
    .full .ib { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; z-index: 2; background: rgba(27, 38, 80, .72); color: var(--paper); border-radius: 50%; }

    .toast { position: fixed; z-index: 60; left: 50%; bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)); translate: -50% 0; max-width: calc(100vw - 32px); padding: .75rem 1rem; border-radius: 10px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: .9375rem; box-shadow: 0 12px 30px -12px rgba(27, 38, 80, .7); transition: opacity 200ms ease, translate 260ms var(--ease-out); }
    .toast.out { opacity: 0; translate: -50% 10px; pointer-events: none; }
    .skel { display: grid; gap: .6rem; }
    .skel i { display: block; height: 94px; border-radius: 12px; background: linear-gradient(90deg, var(--white), var(--envelope-soft), var(--white)); background-size: 200% 100%; }
    @media (prefers-reduced-motion: no-preference) { .skel i { animation: shimmer 1.4s linear infinite; } @keyframes shimmer { to { background-position: -200% 0; } } }
    @media (prefers-reduced-motion: reduce) { .ib.spin svg { animation: none; } }

    @media (min-width: 900px) {
      .o-grid { grid-template-columns: 340px minmax(0, 1fr); align-items: start; column-gap: 2.5rem; }
      .stage { position: sticky; top: calc(var(--top) + 1rem); }
      .phone { width: 320px; }
      .tabs { left: 50%; right: auto; bottom: 16px; translate: -50% 0; width: 22rem; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 30px -18px rgba(27, 38, 80, .5); }
      .dock { display: none !important; }
      .d-act { display: grid !important; }
    }
  </style>
  <script src="../js/catalog.js?v=41" defer></script>
  <script src="catalog/guest-catalog-owner-viewer-v2.js" defer></script>
</head>

<script>
(() => {
'use strict';
const OWNER = 'https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-owner-manager';
const FLOW = 'https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/guest-invitation-flow-qa';
const KEY = 'weddly_owner_manager_token_v1';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } }, set: (v) => { try { localStorage.setItem(KEY, v); } catch {} }, clear: () => { try { localStorage.removeItem(KEY); } catch {} } };

// Cada estado en palabras, a quién le toca y en qué grupo de la bandeja va.
const STATUS = {
  draft: { label: 'Rellenando el cuestionario', who: 'them', group: 'waiting' },
  submitted: { label: 'Lista para enviar', who: 'you', group: 'send' },
  designing: { label: 'Lista para enviar', who: 'you', group: 'send' },
  review_ready: { label: 'Lista para enviar', who: 'you', group: 'send' },
  review_sent: { label: 'Revisándola la pareja', who: 'them', group: 'waiting' },
  changes_requested: { label: 'Corrigiendo la pareja', who: 'them', group: 'waiting' },
  approved: { label: 'Aprobada: entregar', who: 'you', group: 'deliver' },
  delivered: { label: 'Entregada', who: 'done', group: 'done' }
};
const FILTERS = [['all', 'Todos'], ['you', 'Te toca'], ['them', 'Esperando'], ['done', 'Entregados']];
let orders = [], filter = 'all', current = null, registry = null, toastTimer = null;

/* ---- Utilidades ---- */
async function call(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-weddly-manager': store.get() }, body: JSON.stringify(body), cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403 && j?.error === 'manager_required') { store.clear(); showLogin('La sesión ha caducado. Vuelve a entrar.'); throw Error('manager_required'); }
  if (!r.ok || !j?.ok) { const e = Error(j?.error || 'request_failed'); e.data = j; throw e; }
  return j;
}
const flow = (b) => call(FLOW, b);
const design = (id) => (window.GUEST_CATALOG || []).find((d) => d.id === id) || { name: id || 'Diseño', image: '' };
const day = (d, withYear = true) => { if (!d) return ''; const x = new Date(String(d).length === 10 ? d + 'T12:00:00' : d); return isNaN(x) ? '' : x.toLocaleDateString('es-ES', withYear ? { day: 'numeric', month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' }); };
const ago = (d) => { if (!d) return ''; const m = Math.round((Date.now() - new Date(d)) / 60000); if (m < 2) return 'ahora mismo'; if (m < 60) return `hace ${m} min`; const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`; const dd = Math.round(h / 24); return dd === 1 ? 'ayer' : dd < 7 ? `hace ${dd} días` : day(d, false); };
const couple = (o) => o.label || o.buyerEmail || 'Sin nombres todavía';
function toast(text) { const t = $('toast'); t.textContent = text; t.classList.remove('out'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('out'), 2400); }
async function copy(text, done = 'Enlace copiado') { try { await navigator.clipboard.writeText(text); toast(done); } catch { prompt('Copia el enlace:', text); } }

/* ---- Entrar ---- */
function showLogin(text = '') {
  ['inbox', 'all', 'order', 'tabs', 'dock', 'refresh', 'back'].forEach((x) => { $(x).hidden = true; });
  $('title').textContent = 'Pedidos'; $('login').hidden = false; $('loginMsg').textContent = text; $('master').focus();
}
$('enter').onclick = async () => {
  const code = $('master').value.trim();
  if (!code) { $('loginMsg').textContent = 'Escribe el código.'; return; }
  $('enter').disabled = true; $('loginMsg').textContent = '';
  try {
    const r = await fetch(OWNER, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'login', recoveryCode: code }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j?.managerToken) throw Error('login');
    store.set(j.managerToken); $('master').value = ''; $('login').hidden = true; await refresh(); route();
  } catch { $('loginMsg').textContent = 'Ese código no vale.'; }
  finally { $('enter').disabled = false; }
};
$('master').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('enter').click(); });
$('logout').onclick = () => { store.clear(); location.hash = ''; showLogin(); };

/* ---- Tarjetas ---- */
function card(o, flat = false) {
  const s = STATUS[o.status] || { label: o.status, who: '' }, d = design(o.templateId);
  const when = o.status === 'approved' ? 'Aprobada ' + ago(o.approvedAt || o.updatedAt) : o.status === 'submitted' ? 'Recibida ' + ago(o.submittedAt || o.updatedAt) : ago(o.updatedAt);
  return `<button class="card${flat ? ' flat' : ''}" type="button" data-id="${esc(o.id)}">
    ${d.image ? `<img src="../${esc(d.image)}" alt="" loading="lazy">` : '<span class="ph"></span>'}
    <span><b>${esc(couple(o))}</b><small>${esc(d.name)}${o.weddingDate ? ' · boda el ' + esc(day(o.weddingDate)) : ''}</small>
    <span class="pill ${s.who === 'you' ? 'you' : s.who === 'done' ? 'ok' : ''}">${esc(s.label)}${o.revisionCount ? ` · ${o.revisionCount} ${o.revisionCount === 1 ? 'cambio' : 'cambios'}` : ''}</span>
    <small>${esc(when)}${o.mode === 'test' ? ' · prueba' : ''}</small></span>
    <svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></button>`;
}
document.addEventListener('click', (e) => { const c = e.target.closest('.card[data-id]'); if (c) location.hash = '#/pedido/' + c.dataset.id; });

function renderInbox() {
  const g = (k) => orders.filter((o) => STATUS[o.status]?.group === k);
  const send = g('send'), deliver = g('deliver'), waiting = g('waiting'), mine = send.length + deliver.length;
  const sec = (title, list, flat) => list.length ? `<section class="sec"><h3><b>${list.length}</b> ${title}</h3><div class="cards">${list.map((o) => card(o, flat)).join('')}</div></section>` : '';
  $('inbox').innerHTML = `
    <div class="hello"><strong>${mine ? (mine === 1 ? 'Tienes 1 pendiente.' : `Tienes ${mine} pendientes.`) : 'Todo al día.'}</strong>
    <span>${mine ? 'Ábrela, mira la invitación y pulsa el botón.' : 'Cuando una pareja envíe su cuestionario o apruebe su invitación, aparecerá aquí.'}</span></div>
    ${sec(send.length === 1 ? 'para enviar a revisar' : 'para enviar a revisar', send)}
    ${sec(deliver.length === 1 ? 'aprobada para entregar' : 'aprobadas para entregar', deliver)}
    ${!mine ? '<div class="calm"><b>Nada pendiente</b>Las parejas están rellenando o revisando. No tienes que hacer nada.</div>' : ''}
    ${sec('esperando a la pareja', waiting, true)}`;
  $('dot').hidden = !mine; $('dot').textContent = mine;
}
function renderAll() {
  $('chips').innerHTML = FILTERS.map(([k, t]) => `<button class="chip" type="button" data-f="${k}" aria-pressed="${filter === k}">${t}</button>`).join('');
  const q = $('q').value.trim().toLowerCase();
  const list = orders.filter((o) => (filter === 'all' || STATUS[o.status]?.who === filter) && (!q || `${o.label} ${o.buyerEmail} ${design(o.templateId).name}`.toLowerCase().includes(q)));
  $('allList').innerHTML = list.length ? list.map((o) => card(o)).join('') : `<div class="calm">${orders.length ? 'Ningún pedido coincide.' : 'Todavía no hay pedidos.'}</div>`;
}
$('chips').addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; renderAll(); } });
$('q').addEventListener('input', renderAll);

/* ---- Pedido ---- */
function next(o) {
  const s = o.status;
  if (['submitted', 'designing', 'review_ready'].includes(s)) return { title: o.revision_count ? 'Ya la han corregido' : 'Mírala y envíasela', text: o.revision_count ? 'La invitación se ha vuelto a montar con lo que han cambiado. Si la ves bien, les mandamos la nueva versión.' : 'Está montada con lo que han escrito en el cuestionario. Si la ves bien, se la mandamos por email para que la revisen.', btn: 'Enviar a la pareja', run: sendReview };
  if (s === 'review_sent') return { title: 'Esperando a la pareja', text: 'Tienen el enlace para aprobarla o cambiar una parte. Te avisará la bandeja cuando la aprueben.' };
  if (s === 'changes_requested') return { title: 'La pareja está corrigiendo', text: 'Han abierto la parte que querían cambiar. Cuando la envíen, volverá a tu bandeja ya montada de nuevo.' };
  if (s === 'approved') return { title: 'Aprobada', text: 'Al entregar, les llega por email el enlace definitivo para sus invitados y el acceso a la app de invitados.', btn: 'Entregar', run: deliver };
  if (s === 'delivered') return { title: 'Entregada', text: 'Ya tienen su invitación y el acceso a la app. No tienes que hacer nada más.' };
  return { title: 'Rellenando el cuestionario', text: 'Aún no lo han enviado. No tienes que hacer nada.' };
}
function timeline(o) {
  const order = ['draft', 'submitted', 'review_sent', 'approved', 'delivered'];
  const pos = { draft: 0, submitted: 1, designing: 1, review_ready: 1, changes_requested: 2, review_sent: 2, approved: 3, delivered: 4 }[o.status] ?? 0;
  const items = [['Pagada', o.created_at], ['Cuestionario recibido', o.submitted_at], ['Enviada a revisar', o.review_sent_at], ['Aprobada', o.approved_at], ['Entregada', o.delivered_at]];
  return `<ol class="steps">${items.map(([t, d], i) => `<li class="${i <= pos ? 'done' : i === pos + 1 ? 'now' : ''}"><i></i><span>${t}${i === 2 && o.status === 'changes_requested' ? ' · <small>la están corrigiendo</small>' : ''}</span><small>${i <= pos && d ? esc(day(d, false)) : ''}</small></li>`).join('')}</ol>`;
}
async function preview(config, o, host) {
  try {
    registry = registry || await fetch('GUEST_CATALOG_OWNER_RENDERERS_V2.json', { cache: 'no-store' }).then((r) => r.json());
    await window.GUEST_CATALOG_OWNER_VIEWER_V2.show({ order: { template_id: o.template_id, template_version: String(config.template.version || o.template_version), mode: 'test' }, config, host, registry });
    return true;
  } catch (e) { host.innerHTML = '<p>No se ha podido montar la invitación. Toca actualizar arriba.</p>'; console.warn(e); return false; }
}

async function openOrder(id) {
  showView('order'); $('back').hidden = false;
  const row = orders.find((x) => x.id === id);
  $('title').textContent = row ? couple(row) : 'Pedido';
  $('order').innerHTML = '<div class="skel"><i style="height:60px"></i><i style="height:420px"></i></div>';
  $('dock').hidden = true;
  try {
    let { order: o } = await flow({ action: 'detail', orderId: id });
    let config = o.hydratedConfig;
    // Recién enviado o recién corregido: se monta solo a partir del cuestionario.
    if (o.status === 'submitted') {
      const j = await flow({ action: 'start_design', orderId: id });
      config = j.config; o = { ...o, status: 'designing' };
      if (row) row.status = 'designing';
    }
    current = o;
    const q = o.questionnaire || {}, c = q.couple || {}, d = design(o.template_id), a = next(o), s = STATUS[o.status] || { label: o.status };
    const names = c.name1 && c.name2 ? `${c.name1} & ${c.name2}` : o.buyer_email || 'Pedido';
    const email = q.contact?.email || o.buyer_email || '';
    const reqs = (o.revision_requests || []).slice().reverse();
    const finalUrl = o.delivery_url || (location.origin + '/guest/catalog-final.html?p=' + encodeURIComponent(o.publicToken));
    const reviewUrl = location.origin + '/guest-review-v1.html?t=' + encodeURIComponent(o.reviewToken);
    $('title').textContent = names;
    $('order').innerHTML = `
      <div class="o-head"><span class="pill ${s.who === 'you' ? 'you' : s.who === 'done' ? 'ok' : ''}">${esc(s.label)}</span><h2>${esc(names)}</h2>
        <p>${esc(d.name)}${c.date ? ' · boda el ' + esc(day(c.date)) : ''}${o.mode === 'test' ? ' · prueba sin pago' : ''}</p></div>
      <div class="o-grid">
        <div class="stage">
          <div class="phone"><div class="screen" id="screen"><p>${config?.template ? 'Montando la invitación…' : 'Se verá aquí cuando envíen el cuestionario.'}</p></div></div>
          ${config?.template ? '<button class="grow" id="grow" type="button"><svg aria-hidden="true"><use href="#i-expand"/></svg>Verla a pantalla completa</button>' : ''}
        </div>
        <div style="display:grid;gap:1rem">
          <div class="box"><h3>${esc(a.title)}</h3><p>${esc(a.text)}</p>
            ${a.btn ? `<div class="d-act"><button class="btn" data-act type="button">${esc(a.btn)}</button><p class="msg" role="alert"></p></div>` : ''}
            ${reqs.length && ['designing', 'review_ready'].includes(o.status) ? `<div class="ask"><b>Lo que pidieron cambiar${reqs.length > 1 ? ` (la última de ${reqs.length} veces)` : ''}</b>${esc(reqs[0].note)}</div>` : ''}</div>
          <div class="box"><h3>Cómo va</h3>${timeline(o)}</div>
          <div class="box"><h3>La pareja</h3><ul class="rows">
            ${email ? `<li><a href="mailto:${esc(email)}"><svg aria-hidden="true"><use href="#i-mail"/></svg><span>Escribirles<small>${esc(email)}</small></span><svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></a></li>` : ''}
            <li><a href="catalog-questionnaire.html?t=${encodeURIComponent(o.questionnaireToken)}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-doc"/></svg><span>Ver su cuestionario<small>Lo que han rellenado</small></span><svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></a></li>
            ${['review_sent', 'changes_requested', 'approved'].includes(o.status) ? `<li><button type="button" data-copy="${esc(reviewUrl)}"><svg aria-hidden="true"><use href="#i-link"/></svg><span>Copiar su enlace de revisión<small>Por si no les llega el email</small></span></button></li>` : ''}
            ${o.status === 'delivered' ? `<li><a href="${esc(finalUrl)}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-link"/></svg><span>Abrir la invitación final<small>La que comparten con sus invitados</small></span><svg class="chev" aria-hidden="true"><use href="#i-chev"/></svg></a></li><li><button type="button" data-copy="${esc(finalUrl)}"><svg aria-hidden="true"><use href="#i-link"/></svg><span>Copiar el enlace final</span></button></li>` : ''}
          </ul></div>
        </div>
      </div>`;
    $('order').querySelectorAll('[data-copy]').forEach((b) => b.onclick = () => copy(b.dataset.copy));
    if (a.btn) {
      $('dockIn').innerHTML = `<button class="btn wide" data-act type="button">${esc(a.btn)}</button><p class="msg" role="alert"></p>`;
      $('dock').hidden = false;
      document.querySelectorAll('[data-act]').forEach((b) => { b.onclick = () => a.run(o, b); });
    }
    if (config?.template) {
      preview(config, o, $('screen'));
      $('grow').onclick = async () => { $('full').hidden = false; document.body.style.overflow = 'hidden'; await preview(config, o, $('fullHost')); };
    }
  } catch (e) { if (e.message !== 'manager_required') $('order').innerHTML = '<div class="calm"><b>No se ha podido abrir</b>Comprueba la conexión y toca actualizar arriba.</div>'; }
}
$('closeFull').onclick = () => { $('full').hidden = true; $('fullHost').replaceChildren(); document.body.style.overflow = ''; };

async function busyRun(b, fn, okText) {
  const msg = b.parentElement.querySelector('.msg'), old = b.textContent; b.disabled = true; b.textContent = 'Un momento…'; msg.textContent = '';
  try { await fn(); toast(okText); await refresh(); openOrder(current.id); }
  catch (e) {
    if (e.message === 'manager_required') return;
    const errs = e.data?.errors;
    msg.textContent = errs?.length ? 'Falta en su cuestionario: ' + errs.join(' ') : 'No ha salido. Prueba otra vez en un momento.';
    b.disabled = false; b.textContent = old;
  }
}
function sendReview(o, b) {
  return busyRun(b, async () => {
    if (o.status !== 'review_ready') await flow({ action: 'mark_review_ready', orderId: o.id });
    await flow({ action: 'send_review', orderId: o.id });
  }, 'Enviada. Les ha llegado por email.');
}
function deliver(o, b) {
  return busyRun(b, async () => {
    await flow({ action: 'deliver', orderId: o.id, invitationUrl: location.origin + '/guest/catalog-final.html?p=' + encodeURIComponent(o.publicToken) });
  }, 'Entregada. Ya tienen su invitación.');
}

/* ---- Navegación ---- */
function showView(v) {
  ['inbox', 'all', 'order'].forEach((x) => { $(x).hidden = x !== v; });
  $('tabs').hidden = v === 'order'; $('dock').hidden = true; $('refresh').hidden = false; $('back').hidden = v !== 'order';
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-current', t.dataset.tab === v ? 'page' : 'false'));
  if (v !== 'order') { $('title').textContent = v === 'all' ? 'Todos los pedidos' : 'Pedidos'; current = null; }
  scrollTo({ top: 0 });
}
function route() {
  if (!store.get()) { showLogin(); return; }
  const h = location.hash;
  if (h.startsWith('#/pedido/')) return openOrder(decodeURIComponent(h.slice(9)));
  if (h === '#/todos') { showView('all'); renderAll(); return; }
  showView('inbox'); renderInbox();
}
document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { location.hash = t.dataset.tab === 'all' ? '#/todos' : '#/'; });
$('back').onclick = () => (history.length > 1 ? history.back() : (location.hash = '#/'));
addEventListener('hashchange', route);

async function refresh() {
  const r = $('refresh'); r.classList.add('spin');
  try { const j = await flow({ action: 'list' }); orders = j.orders || []; }
  catch (e) { if (e.message !== 'manager_required') toast('Sin conexión. Prueba otra vez.'); throw e; }
  finally { r.classList.remove('spin'); }
}
$('refresh').onclick = async () => { try { await refresh(); route(); } catch {} };
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && store.get() && !current) { try { await refresh(); route(); } catch {} } });

addEventListener('DOMContentLoaded', async () => {
  if (!store.get()) { showLogin(); return; }
  $('inbox').hidden = false; $('inbox').innerHTML = '<div class="skel"><i></i><i></i><i></i></div>';
  try { await refresh(); } catch { return; }
  route();
});
})();
</script>
</body>
</html>
