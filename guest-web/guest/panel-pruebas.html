<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f0c4bc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pedidos">
  <title>Pedidos · GUEST</title>
  <link rel="manifest" href="pedidos.webmanifest">
  <link rel="icon" href="../assets/brand/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/fonts.css?v=44">
  <style>
    /* App de pedidos de la propietaria. Pensada para el móvil: una bandeja con lo que le toca,
       y cada pedido con su invitación ya montada y un único botón para avanzar. */
    :root {
      --paper: #fbf7f4; --envelope: #f0c4bc; --envelope-soft: #f6dcd6; --ink: #1b2650; --ink-soft: #4a5480;
      --postmark: #b3263a; --line: #e3d6d1; --white: #fff; --ok: #2f6b45; --ok-soft: #e4efe7; --wait-soft: #eef0f7;
      --display: 'Abril Fatface', Georgia, serif; --mono: 'Courier Prime', 'Courier New', monospace;
      --text: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      --top: calc(56px + env(safe-area-inset-top, 0px));
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.5 var(--text); -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    svg { flex: none; }

    .bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: .5rem; min-height: var(--top); padding: env(safe-area-inset-top, 0px) 8px 0 16px; background: var(--envelope); }
    .bar h1 { margin: 0; font: 400 1.5rem/1 var(--display); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ib { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; }
    .ib:active { background: rgba(27, 38, 80, .08); }
    .ib svg { width: 22px; height: 22px; }
    .ib.spin svg { animation: spin 800ms linear infinite; }
    @keyframes spin { to { rotate: 360deg; } }
    .back { margin-left: -8px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 52px; padding: 0 1.25rem; border: 1.5px solid var(--ink); border-radius: 10px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 1.0625rem; cursor: pointer; text-decoration: none; transition: transform 140ms var(--ease-out), opacity 160ms ease; }
    .btn:active { transform: scale(.97); }
    .btn.line { background: transparent; color: var(--ink); }
    .btn.wide { width: 100%; }
    .btn.small { min-height: 44px; padding: 0 1rem; font-size: .9375rem; }
    .btn[disabled] { opacity: .5; pointer-events: none; }

    /* Entrar */
    .login { max-width: 26rem; margin: 0 auto; padding: 14vh 16px 2rem; display: grid; gap: 1rem; }
    .login h2 { margin: 0; font: 400 2.6rem/1.02 var(--display); }
    .login p { margin: 0; color: var(--ink-soft); }
    input[type="password"], input[type="search"] { width: 100%; min-height: 52px; padding: .8rem .9rem; border: 1.5px solid var(--line); border-radius: 10px; background: var(--white); color: var(--ink); font: 400 1.0625rem var(--text); }
    input:focus { outline: none; border-color: var(--ink); }
    .msg { margin: 0; color: var(--postmark); font-size: .9375rem; }
    .msg:empty { display: none; }

    /* Bandeja */
    .view { padding: 1rem 16px calc(6rem + env(safe-area-inset-bottom, 0px)); max-width: 44rem; margin: 0 auto; }
    .hello { margin: .5rem 0 1.25rem; }
    .hello strong { display: block; font: 400 clamp(2rem, 6vw, 2.6rem)/1.04 var(--display); }
    .hello span { display: block; margin-top: .35rem; color: var(--ink-soft); }
    .sec { margin-top: 1.75rem; }
    .sec:first-of-type { margin-top: 0; }
    .sec > h3 { display: flex; align-items: baseline; gap: .5rem; margin: 0 0 .6rem; font: 700 .8125rem/1 var(--mono); color: var(--ink-soft); }
    .sec > h3 b { color: var(--ink); }
    .cards { display: grid; gap: .6rem; }
    .card { display: grid; grid-template-columns: 52px 1fr auto; gap: .9rem; align-items: center; width: 100%; padding: .7rem .8rem .7rem .7rem; border: 0; border-radius: 12px; background: var(--white); box-shadow: 0 1px 2px rgba(27, 38, 80, .08), 0 10px 24px -18px rgba(27, 38, 80, .5); text-align: left; cursor: pointer; transition: transform 140ms var(--ease-out); }
    .card:active { transform: scale(.985); }
    .card img, .card .ph { width: 52px; height: 70px; border-radius: 6px; object-fit: cover; background: var(--envelope-soft); }
    .card b { display: block; font-weight: 600; font-size: 1.0625rem; line-height: 1.3; }
    .card small { display: block; margin-top: .15rem; font-size: .875rem; color: var(--ink-soft); }
    .card .chev { width: 20px; height: 20px; color: var(--ink-soft); }
    .card.flat { box-shadow: none; background: transparent; border-top: 1px solid var(--line); border-radius: 0; padding-inline: 0; }
    .pill { display: inline-block; margin-top: .4rem; padding: .25rem .5rem; border-radius: 6px; font: 700 .75rem/1.2 var(--mono); background: var(--wait-soft); color: var(--ink-soft); }
    .pill.you { background: var(--postmark); color: var(--white); }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }
    .due { font-weight: 600; color: var(--ok) !important; }
    .due.soon { color: #a4590d !important; }
    .due.late { color: var(--postmark) !important; }
    .deadline { display: grid; gap: .1rem; margin: 0 0 .9rem !important; padding: .75rem .9rem; border-radius: 10px; background: var(--ok-soft); color: var(--ok) !important; }
    .deadline b { font: 400 1.35rem/1.1 var(--display); }
    .deadline.soon { background: #fbecd9; color: #8a4a0a !important; }
    .deadline.late { background: #fbe4e6; color: var(--postmark) !important; }
    .btn.danger { background: var(--postmark); border-color: var(--postmark); color: var(--white); }
    .refund-confirm p { margin: .9rem 0 .6rem; color: var(--ink); }
    .refund-go { margin-top: .9rem; }
    .btns { display: flex; flex-wrap: wrap; gap: .6rem; }
    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .6rem; }
    .tile { display: grid; gap: .15rem; padding: 1rem; border-radius: 12px; background: var(--white); box-shadow: 0 1px 2px rgba(27, 38, 80, .08), 0 10px 24px -18px rgba(27, 38, 80, .5); }
    .tile span { font: 700 .75rem/1 var(--mono); color: var(--ink-soft); }
    .tile b { font: 400 1.6rem/1.15 var(--display); }
    .tile small { font-size: .8125rem; color: var(--ink-soft); }
    .bars { display: grid; gap: .55rem; padding: 1rem; border-radius: 12px; background: var(--white); }
    .bar-row { display: grid; grid-template-columns: 6.5rem 1fr 2rem; gap: .6rem; align-items: center; font-size: .9375rem; }
    .bar-row i { display: block; height: 10px; width: var(--w); min-width: 6px; border-radius: 5px; background: var(--ink); }
    .bar-row b { text-align: right; font-variant-numeric: tabular-nums; }
    .tiles + .sec { margin-top: 1.75rem; }
    .hint { margin: 1.25rem 0 .5rem; font-size: .875rem; color: var(--ink-soft); }
    .sums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin: .2rem 0 .9rem; }
    .sums div { display: grid; gap: .2rem; }
    .sums span { font: 700 .6875rem/1 var(--mono); color: var(--ink-soft); }
    .sums b { font: 700 1.0625rem/1.2 var(--text); font-variant-numeric: tabular-nums; }
    .book-actions { display: grid; gap: .5rem; margin-top: .9rem; }
    .book-actions .btn { width: 100%; }
    .rows .amt { flex: none; font-weight: 600; font-variant-numeric: tabular-nums; }
    .rows .neg { color: var(--postmark); }
    .link-btn { min-height: 44px; border: 0; background: none; font-weight: 600; text-decoration: underline; text-underline-offset: .25em; cursor: pointer; }
    .calm { padding: 1.25rem; border-radius: 12px; background: var(--white); color: var(--ink-soft); }
    .calm b { display: block; color: var(--ink); font: 400 1.35rem/1.15 var(--display); margin-bottom: .25rem; }
    .search { margin-bottom: .9rem; }
    .chips { display: flex; gap: .4rem; overflow-x: auto; margin: 0 -16px .9rem; padding: 0 16px 2px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; min-height: 38px; padding: 0 .9rem; border: 1.5px solid var(--line); border-radius: 99px; background: var(--white); font-weight: 600; font-size: .9375rem; cursor: pointer; }
    .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

    .tabs { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 12px calc(6px + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--white) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
    .tab { display: grid; justify-items: center; gap: 2px; min-height: 52px; padding-top: 6px; border: 0; background: none; font-size: .8125rem; font-weight: 600; color: var(--ink-soft); cursor: pointer; position: relative; }
    .tab svg { width: 24px; height: 24px; }
    .tab[aria-current="page"] { color: var(--ink); }
    .tab .dot { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--postmark); color: var(--white); font: 700 .6875rem/18px var(--text); }

    /* A medida */
    .brief { display: grid; gap: .85rem; }
    .brief dl { margin: 0; display: grid; gap: .7rem; }
    .brief dt { font: 700 .75rem/1 var(--mono); color: var(--ink-soft); }
    .brief dd { margin: .25rem 0 0; white-space: pre-line; overflow-wrap: anywhere; }
    .brief .base-row { display: flex; align-items: center; gap: .7rem; }
    .brief .base-row img { width: 40px; height: 54px; border-radius: 5px; object-fit: cover; }
    .tags { display: flex; flex-wrap: wrap; gap: .35rem; }
    .tags span { padding: .25rem .55rem; border-radius: 6px; background: var(--wait-soft); font-size: .875rem; font-weight: 600; }
    .pics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; }
    .pics a { display: block; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--envelope-soft); }
    .pics img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .q-form { display: grid; gap: .9rem; margin-top: .9rem; }
    .q-form label { display: grid; gap: .35rem; font-size: .875rem; font-weight: 700; }
    .q-form input, .q-form textarea, .notes { width: 100%; min-height: 52px; padding: .8rem .9rem; border: 1.5px solid var(--line); border-radius: 10px; background: var(--white); color: var(--ink); font: 400 1.0625rem/1.4 var(--text); }
    .q-form textarea, .notes { min-height: 96px; resize: vertical; }
    .q-form input:focus, .q-form textarea:focus, .notes:focus { outline: none; border-color: var(--ink); }
    .amounts { display: grid; grid-template-columns: repeat(3, 1fr); gap: .45rem; }
    .amounts button { min-height: 48px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--white); font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; transition: transform 140ms var(--ease-out); }
    .amounts button:active { transform: scale(.96); }
    .amounts button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .two-in { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; align-items: end; }
    .split { margin: 0; padding: .7rem .85rem; border-radius: 10px; background: var(--wait-soft); font-size: .9375rem; }
    .guide { margin: .2rem 0 0; padding-left: 1.1rem; color: var(--ink-soft); font-size: .9375rem; }
    .guide li { margin-top: .3rem; }
    .acts { display: grid; gap: .5rem; margin-top: .9rem; }
    .acts .btn { width: 100%; }
    .meter { display: flex; gap: .35rem; margin-top: .5rem; }
    .meter i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
    .meter i.on { background: var(--ink); }
    .meter i.extra { background: #f1d3d7; }
    .meter i.on.extra { background: var(--postmark); }

    /* Pedido */
    .order { padding: 1rem 16px calc(7.5rem + env(safe-area-inset-bottom, 0px)); max-width: 64rem; margin: 0 auto; }
    .o-head .pill { margin: 0 0 .5rem; }
    .o-head h2 { margin: 0; font: 400 clamp(2rem, 6.5vw, 2.8rem)/1.02 var(--display); overflow-wrap: anywhere; }
    .o-head p { margin: .35rem 0 0; color: var(--ink-soft); }
    .o-grid { display: grid; gap: 1.25rem; margin-top: 1.25rem; }
    .stage { position: relative; display: grid; justify-items: center; }
    .phone { width: min(78vw, 320px); aspect-ratio: 390 / 760; border-radius: 30px; padding: 8px; background: var(--ink); box-shadow: 0 24px 48px -24px rgba(27, 38, 80, .65); }
    .screen { position: relative; width: 100%; height: 100%; border-radius: 23px; overflow: hidden; background: var(--envelope-soft); display: grid; place-items: center; text-align: center; color: var(--ink-soft); font-size: .9375rem; }
    .screen p { padding: 1.25rem; margin: 0; }
    .screen iframe { width: 100%; height: 100%; }
    .grow { margin-top: .75rem; display: inline-flex; align-items: center; gap: .4rem; min-height: 44px; padding: 0 .9rem; border: 0; border-radius: 10px; background: transparent; font-weight: 600; cursor: pointer; }
    .grow svg { width: 18px; height: 18px; }
    .grow:active { background: rgba(27, 38, 80, .06); }

    .box { padding: 1.1rem; border-radius: 12px; background: var(--white); box-shadow: 0 1px 2px rgba(27, 38, 80, .08), 0 14px 30px -24px rgba(27, 38, 80, .5); }
    .box h3 { margin: 0 0 .35rem; font: 400 1.35rem/1.15 var(--display); }
    .box p { margin: 0; color: var(--ink-soft); font-size: .9375rem; }
    .ask { margin-top: .8rem; padding: .85rem 1rem; border-radius: 10px; background: #fdf1e6; font-size: .9375rem; white-space: pre-line; }
    .ask b { display: block; margin-bottom: .2rem; }

    .steps { list-style: none; margin: .4rem 0 0; padding: 0; display: grid; }
    .steps li { display: grid; grid-template-columns: 22px 1fr auto; gap: .75rem; align-items: center; min-height: 44px; position: relative; color: var(--ink-soft); }
    .steps li::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--line); }
    .steps li:first-child::before { top: 50%; }
    .steps li:last-child::before { bottom: 50%; }
    .steps i { position: relative; z-index: 1; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--paper); display: grid; place-items: center; }
    .steps li.done { color: var(--ink); }
    .steps li.done i { background: var(--ink); border-color: var(--ink); }
    .steps li.done i::after { content: ""; width: 9px; height: 5px; border: solid var(--paper); border-width: 0 0 2px 2px; rotate: -45deg; translate: 0 -1px; }
    .steps li.now { color: var(--ink); font-weight: 600; }
    .steps li.now i { border-color: var(--postmark); box-shadow: 0 0 0 4px rgba(179, 38, 58, .14); }
    .steps small { font-size: .8125rem; color: var(--ink-soft); font-weight: 400; }

    .rows { margin: .3rem 0 0; padding: 0; list-style: none; }
    .rows li { border-top: 1px solid var(--line); }
    .rows li:first-child { border-top: 0; }
    .rows a, .rows button { display: flex; align-items: center; gap: .75rem; width: 100%; min-height: 52px; padding: .4rem 0; border: 0; background: none; text-align: left; text-decoration: none; cursor: pointer; }
    .rows svg { width: 20px; height: 20px; color: var(--ink-soft); }
    .rows span { flex: 1; min-width: 0; }
    .rows small { display: block; font-size: .8125rem; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rows .chev { width: 18px; height: 18px; }

    .dock { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; padding: .75rem 16px calc(.75rem + env(safe-area-inset-bottom, 0px)); background: color-mix(in srgb, var(--white) 95%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
    .dock-in { max-width: 44rem; margin: 0 auto; display: grid; gap: .5rem; }
    .dock .msg { text-align: center; }
    .d-act { display: none; gap: .5rem; margin-top: 1rem; justify-items: start; }

    /* Invitación a pantalla completa */
    .full { position: fixed; inset: 0; z-index: 50; background: var(--ink); }
    .full-host { position: absolute; inset: 0; }
    .full-host iframe { width: 100%; height: 100%; }
    .full .ib { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; z-index: 2; background: rgba(27, 38, 80, .72); color: var(--paper); border-radius: 50%; }

    .toast { position: fixed; z-index: 60; left: 50%; bottom: calc(6.5rem + env(safe-area-inset-bottom, 0px)); translate: -50% 0; max-width: calc(100vw - 32px); padding: .75rem 1rem; border-radius: 10px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: .9375rem; box-shadow: 0 12px 30px -12px rgba(27, 38, 80, .7); transition: opacity 200ms ease, translate 260ms var(--ease-out); }
    .toast.out { opacity: 0; translate: -50% 10px; pointer-events: none; }
    .skel { display: grid; gap: .6rem; }
    .skel i { display: block; height: 94px; border-radius: 12px; background: linear-gradient(90deg, var(--white), var(--envelope-soft), var(--white)); background-size: 200% 100%; }
    @media (prefers-reduced-motion: no-preference) { .skel i { animation: shimmer 1.4s linear infinite; } @keyframes shimmer { to { background-position: -200% 0; } } }
    @media (prefers-reduced-motion: reduce) { .ib.spin svg { animation: none; } }

    @media (min-width: 900px) {
      .o-grid { grid-template-columns: 340px minmax(0, 1fr); align-items: start; column-gap: 2.5rem; }
      .stage { position: sticky; top: calc(var(--top) + 1rem); }
      .phone { width: 320px; }
      .tabs { left: 50%; right: auto; bottom: 16px; translate: -50% 0; width: 32rem; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 30px -18px rgba(27, 38, 80, .5); }
      .dock { display: none !important; }
      .d-act { display: grid !important; }
    }
    .texts h4 { margin: .9rem 0 .4rem; font: 600 .75rem/1.2 var(--text); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
    .tx-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .6rem; }
    .tx { padding: .75rem .85rem; border-radius: 10px; background: var(--paper); }
    .tx > b { display: block; font-size: .8125rem; color: var(--ink-soft); font-weight: 600; margin-bottom: .2rem; }
    .tx p { color: var(--ink); white-space: pre-line; overflow-wrap: anywhere; }
    .tx .tx-was { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: rgba(179, 38, 58, .6); font-size: .875rem; }
    .tx .tx-is { margin-top: .15rem; }
    .tx mark { background: none; color: var(--postmark); text-decoration: underline wavy var(--postmark); text-underline-offset: 3px; }
    .tx .tx-note { margin-top: .3rem; color: var(--postmark); font-size: .875rem; }
    .texts .tx-ok { color: var(--ok); }
    .tx-fix { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .5rem; }
    .tx-fix button { min-height: 36px; padding: 0 .75rem; border: 1px solid var(--line); border-radius: 999px; background: var(--white); color: var(--ink); font: 500 .875rem var(--text); cursor: pointer; transition: transform 160ms var(--ease-out); }
    .tx-fix button:active { transform: scale(.97); }
    .tx-fix button.used { background: var(--ok-soft); border-color: transparent; }
    .tx-fix span { font-size: .8125rem; color: var(--ink-soft); }
    .tx-edit { margin-top: .5rem; }
    .tx-edit summary { cursor: pointer; font-size: .875rem; font-weight: 600; min-height: 32px; display: inline-flex; align-items: center; }
    .tx-edit textarea { width: 100%; margin-top: .4rem; padding: .6rem .7rem; border: 1px solid var(--line); border-radius: 8px; font: 400 1rem/1.45 var(--text); color: var(--ink); background: var(--white); resize: vertical; }
    .tx-go { display: flex; align-items: center; gap: .6rem; margin-top: .5rem; flex-wrap: wrap; }

    /* Editor de estilo: la invitación en un móvil a tamaño real, y los ajustes debajo (o al lado). */
    .studio { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-rows: auto minmax(0, 1fr); background: var(--paper); }
    .st-bar { display: flex; align-items: center; gap: .5rem; min-height: var(--top); padding: env(safe-area-inset-top, 0px) 10px 0 8px; background: var(--envelope); }
    .st-bar .st-ttl { flex: 1; min-width: 0; }
    .st-bar .st-ttl b { display: block; font: 400 1.3rem/1.05 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .st-bar .st-ttl small { display: block; font: 700 .6875rem/1.3 var(--mono); color: var(--ink-soft); }
    .st-bar .st-ttl small.dirty { color: var(--postmark); }
    .st-body { display: grid; grid-template-rows: 42dvh minmax(0, 1fr); min-height: 0; }
    .st-stage { display: grid; place-items: center; min-height: 0; padding: .6rem 0; background: var(--envelope-soft); }

<script>
(() => {
'use strict';
const OWNER = 'https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-owner-manager';
const FLOW = 'https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/'+(/^(localhost|127\.0\.0\.1)$|^(?!guest-lanzamiento\.).*\.pages\.dev$/.test(location.hostname)?'guest-invitation-flow-qa':'guest-order-flow');
const AUTO = 'https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/guest-automation';
const CUSTOM = 'https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/'+(/^(localhost|127\.0\.0\.1)$|^(?!guest-lanzamiento\.).*\.pages\.dev$/.test(location.hostname)?'guest-custom-qa':'guest-order-custom');
const KEY = 'weddly_owner_manager_token_v1';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } }, set: (v) => { try { localStorage.setItem(KEY, v); } catch {} }, clear: () => { try { localStorage.removeItem(KEY); } catch {} } };

// Cada estado en palabras, a quién le toca y en qué grupo de la bandeja va.
const STATUS = {
  draft: { label: 'Rellenando el cuestionario', who: 'them', group: 'waiting' },
  submitted: { label: 'Lista para enviar', who: 'you', group: 'send' },
  designing: { label: 'Lista para enviar', who: 'you', group: 'send' },
  review_ready: { label: 'Lista para enviar', who: 'you', group: 'send' },
  review_sent: { label: 'Revisándola la pareja', who: 'them', group: 'waiting' },
  changes_requested: { label: 'Corrigiendo la pareja', who: 'them', group: 'waiting' },
  approved: { label: 'Aprobada: entregar', who: 'you', group: 'deliver' },
  delivered: { label: 'Entregada', who: 'done', group: 'done' },
  cancelled: { label: 'Devuelto', who: 'done', group: 'done' }
};
const FILTERS = [['all', 'Todos'], ['you', 'Te toca'], ['them', 'Esperando'], ['done', 'Terminados']];
let orders = [], filter = 'all', current = null, registry = null, toastTimer = null;

/* ---- Utilidades ---- */
async function call(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-weddly-manager': store.get() }, body: JSON.stringify(body), cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403 && j?.error === 'manager_required') { store.clear(); showLogin('La sesión ha caducado. Vuelve a entrar.'); throw Error('manager_required'); }
  if (!r.ok || !j?.ok) { const e = Error(j?.error || 'request_failed'); e.data = j; throw e; }
  return j;
}
const flow = (b) => call(FLOW, b);
const design = (id) => (window.GUEST_CATALOG || []).find((d) => d.id === id) || { name: id || 'Diseño', image: '' };
const day = (d, withYear = true) => { if (!d) return ''; const x = new Date(String(d).length === 10 ? d + 'T12:00:00' : d); return isNaN(x) ? '' : x.toLocaleDateString('es-ES', withYear ? { day: 'numeric', month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' }); };
const ago = (d) => { if (!d) return ''; const m = Math.round((Date.now() - new Date(d)) / 60000); if (m < 2) return 'ahora mismo'; if (m < 60) return `hace ${m} min`; const h = Math.round(m / 60); if (h < 24) return `hace ${h} h`; const dd = Math.round(h / 24); return dd === 1 ? 'ayer' : dd < 7 ? `hace ${dd} días` : day(d, false); };
const couple = (o) => o.label || o.buyerEmail || 'Sin nombres todavía';
// Plazos: la web promete la propuesta en 48–72 h desde el cuestionario; la entrega tras aprobar
// no tiene plazo público y usamos 48 h como plazo interno. Mismas reglas que los avisos por email.
const HOUR = 3600000;
function due(o) {
  if (o.customRequestId || o.custom_request_id) return null;
  const st = o.status, sub = Date.parse(o.submittedAt || o.submitted_at || ''), app = Date.parse(o.approvedAt || o.approved_at || '');
  if (['submitted', 'designing', 'review_ready'].includes(st) && sub) return { at: sub + 72 * HOUR, goal: sub + 48 * HOUR, what: 'Enviar' };
  if (st === 'approved' && app) return { at: app + 48 * HOUR, goal: app + 24 * HOUR, what: 'Entregar' };
  return null;
}
function dueText(d) {
  const ms = d.at - Date.now(), h = Math.floor(Math.abs(ms) / HOUR);
  const span = h >= 24 ? `${Math.floor(h / 24)} d ${h % 24} h` : h >= 1 ? `${h} h` : `${Math.max(1, Math.round(Math.abs(ms) / 60000))} min`;
  const at = new Date(d.at).toLocaleString('es-ES', { weekday: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  return { level: ms <= 0 ? 'late' : ms < 24 * HOUR ? 'soon' : 'ok', short: ms <= 0 ? `Vencido hace ${span}` : `Quedan ${span}`, long: `${d.what} antes del ${at}` };
}
function toast(text) { const t = $('toast'); t.textContent = text; t.classList.remove('out'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('out'), 2400); }

/* ---- Entrar ---- */
function showLogin(text = '') {

/* ---- Tarjetas ---- */
function card(o, flat = false) {

function timeline(o) {
  const order = ['draft', 'submitted', 'review_sent', 'approved', 'delivered'];
  const pos = { draft: 0, submitted: 1, designing: 1, review_ready: 1, changes_requested: 2, review_sent: 2, approved: 3, delivered: 4 }[o.status] ?? 0;
  const items = [['Pagada', o.created_at], ['Cuestionario recibido', o.submitted_at], ['Enviada a revisar', o.review_sent_at], ['Aprobada', o.approved_at], ['Entregada', o.delivered_at]];

}

/* ---- Libro de facturas ---- */
let book = null, bookYear = null, bookQ = 0;
const quarter = (d) => Math.floor(new Date(d).getMonth() / 3) + 1;
async function renderBook() {
  const host = $('book')?.querySelector('.box'); if (!host) return;
  try {
    if (!book) book = (await auto({ action: 'invoice_book' })).invoices;
    const mine = book.filter((f) => f.test === showTest);
    const years = [...new Set(mine.map((f) => new Date(f.issuedAt).getFullYear()))].sort((a, b) => b - a);
    if (!years.length) { host.innerHTML = `<div class="calm" style="padding:1rem 0">${showTest ? 'Aún no hay facturas de prueba.' : 'Aún no hay facturas. La primera saldrá sola con tu primera venta.'}</div>`; return; }
    if (!years.includes(bookYear)) bookYear = years[0];
    const list = mine.filter((f) => new Date(f.issuedAt).getFullYear() === bookYear && (!bookQ || quarter(f.issuedAt) === bookQ));
    const sum = (k) => list.reduce((a, f) => a + f[k], 0);
    const sales = list.filter((f) => f.kind === 'invoice').length, refunds = list.length - sales;
    const chip = (attr, val, text, on) => `<button class="chip" type="button" ${attr}="${val}" aria-pressed="${on}">${text}</button>`;
    host.innerHTML = `
      ${years.length > 1 ? `<div class="chips">${years.map((y) => chip('data-y', y, y, y === bookYear)).join('')}</div>` : ''}
      <div class="chips">${chip('data-q', 0, 'Todo ' + bookYear, !bookQ)}${[1, 2, 3, 4].map((q) => chip('data-q', q, q + 'º trimestre', bookQ === q)).join('')}</div>
      <div class="sums"><div><span>Base</span><b>${esc(eur(sum('baseCents')))}</b></div><div><span>IVA</span><b>${esc(eur(sum('vatCents')))}</b></div><div><span>Total</span><b>${esc(eur(sum('totalCents')))}</b></div></div>
      <p class="hint" style="margin:0 0 .4rem">${sales} ${sales === 1 ? 'factura' : 'facturas'}${refunds ? ` y ${refunds} ${refunds === 1 ? 'devolución' : 'devoluciones'}` : ''}${bookQ ? ` en el ${bookQ}º trimestre` : ` en ${bookYear}`}.</p>
      <ul class="rows">${list.map((f) => `<li><a href="${esc(f.url)}" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-receipt"/></svg><span>${esc(f.number)} · ${esc(f.buyerName || f.buyerEmail || '')}<small>${f.kind === 'rectificative' ? 'Devolución' + (f.rectifies ? ' de ' + esc(f.rectifies) : '') : 'Venta'} · ${esc(day(f.issuedAt))}</small></span><b class="amt${f.totalCents < 0 ? ' neg' : ''}">${esc(eur(f.totalCents))}</b></a></li>`).join('') || '<li><span style="display:block;padding:.8rem 0;color:var(--ink-soft)">Ninguna en este periodo.</span></li>'}</ul>
      ${list.length ? `<div class="book-actions"><button class="btn" type="button" id="csv">Descargar para la gestoría (Excel)</button></div>
      <p class="hint" style="margin:.6rem 0 0">Es el libro de facturas emitidas del periodo. Con la base y el IVA de arriba rellenas el modelo 303 de cada trimestre.</p>` : ''}`;
    host.querySelectorAll('[data-y]').forEach((b) => { b.onclick = () => { bookYear = +b.dataset.y; renderBook(); }; });
    host.querySelectorAll('[data-q]').forEach((b) => { b.onclick = () => { bookQ = +b.dataset.q; renderBook(); }; });
    if ($('csv')) $('csv').onclick = () => downloadBook(list);
  } catch (e) { if (e.message !== 'manager_required') host.innerHTML = '<div class="calm" style="padding:1rem 0">No se han podido cargar las facturas.</div>'; }
}
function downloadBook(list) {
  // Punto y coma y coma decimal: así lo abre bien Excel en español.
  const n = (c) => (c / 100).toFixed(2).replace('.', ',');
  const cell = (v) => { const t = String(v ?? ''); return /[;"\n]/.test(t) ? '"' + t.replaceAll('"', '""') + '"' : t; };
  const head = ['Número', 'Fecha', 'Tipo', 'Rectifica a', 'Cliente', 'Email', 'Concepto', 'Base imponible', 'Tipo IVA', 'Cuota IVA', 'Total'];
  const rows = [...list].reverse().map((f) => [f.number, new Date(f.issuedAt).toLocaleDateString('es-ES', { timeZone: 'Europe/Madrid' }), f.kind === 'rectificative' ? 'Rectificativa' : 'Simplificada', f.rectifies || '', f.buyerName || '', f.buyerEmail || '', f.concept, n(f.baseCents), f.vatRate + ' %', n(f.vatCents), n(f.totalCents)]);
  const csv = '\ufeff' + [head, ...rows].map((r) => r.map(cell).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `facturas-guest-${bookYear}${bookQ ? '-T' + bookQ : ''}${showTest ? '-prueba' : ''}.csv`;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---- Navegación ---- */
function showView(v) {
  ['inbox', 'all', 'sales', 'custom', 'order'].forEach((x) => { $(x).hidden = x !== v; });
  $('tabs').hidden = v === 'order'; $('dock').hidden = true; $('refresh').hidden = false; $('back').hidden = v !== 'order';
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-current', t.dataset.tab === v ? 'page' : 'false'));
  if (v !== 'order') { $('title').textContent = v === 'all' ? 'Todos los pedidos' : v === 'sales' ? 'Ventas' : v === 'custom' ? 'A medida' : 'Pedidos'; current = null; }
  scrollTo({ top: 0 });
}
function route() {
  if (!store.get()) { showLogin(); return; }
  const h = location.hash;
  if (h.startsWith('#/pedido/')) return openOrder(decodeURIComponent(h.slice(9)));
  if (h.startsWith('#/medida/')) return openCustom(decodeURIComponent(h.slice(9)));
  if (h === '#/medida') { showView('custom'); renderCustom(); return; }
  if (h === '#/todos') { showView('all'); renderAll(); return; }
  if (h === '#/ventas') { showView('sales'); renderSales(); return; }
  showView('inbox'); renderInbox();
}
document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { location.hash = { all: '#/todos', sales: '#/ventas', custom: '#/medida' }[t.dataset.tab] || '#/'; });
$('back').onclick = () => (history.length > 1 ? history.back() : (location.hash = '#/'));
addEventListener('hashchange', route);

async function refresh() {
  book = null;
  const r = $('refresh'); r.classList.add('spin');
  loadCustom();
  try { const j = await flow({ action: 'list' }); orders = j.orders || []; }
  catch (e) { if (e.message !== 'manager_required') toast('Sin conexión. Prueba otra vez.'); throw e; }
  finally { r.classList.remove('spin'); }
}
$('refresh').onclick = async () => { try { await refresh(); route(); } catch {} };
document.addEventListener('visibilitychange', async () => { if (document.visibilityState === 'visible' && store.get() && !current) { try { await refresh(); route(); } catch {} } });

addEventListener('DOMContentLoaded', async () => {
  if (!store.get()) { showLogin(); return; }
  $('inbox').hidden = false; $('inbox').innerHTML = '<div class="skel"><i></i><i></i><i></i></div>';
  try { await refresh(); } catch { return; }
  route();
});
})();
</script>
