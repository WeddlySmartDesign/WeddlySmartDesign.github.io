<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="no-referrer">
  <title>Pedidos · GUEST</title>
  <link rel="icon" href="../assets/brand/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../css/fonts.css?v=43">
  <style>
    /* Panel de pedidos (circuito de prueba). Una pantalla: lista a la izquierda,
       el pedido abierto a la derecha con su invitación ya montada y un único botón. */
    :root { --paper: #fbf7f4; --envelope: #f0c4bc; --envelope-soft: #f6dcd6; --ink: #1b2650; --ink-soft: #4a5480; --postmark: #b3263a; --line: #e3d6d1; --white: #fff; --ok: #2f6b45; --display: 'Abril Fatface', Georgia, serif; --mono: 'Courier Prime', 'Courier New', monospace; --text: 'Hanken Grotesk', system-ui, -apple-system, sans-serif; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.5 var(--text); -webkit-font-smoothing: antialiased; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; }
    .top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 16px; background: var(--envelope); }
    .top b { font: 400 1.4rem/1 var(--display); }
    .top span { font: 700 .8125rem/1 var(--mono); color: var(--ink-soft); }
    .link { background: none; border: 0; padding: .4rem 0; font-weight: 600; text-decoration: underline; text-underline-offset: .25em; cursor: pointer; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 50px; padding: 0 1.2rem; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--ink); color: var(--paper); font-weight: 600; cursor: pointer; text-decoration: none; transition: transform 140ms var(--ease-out), opacity 160ms ease; }
    .btn:active { transform: scale(.97); }
    .btn.line { background: transparent; color: var(--ink); }
    .btn[disabled] { opacity: .5; pointer-events: none; }

    .login { max-width: 26rem; margin: 12vh auto 0; padding: 0 16px; display: grid; gap: 1rem; }
    .login h1 { margin: 0; font: 400 2.4rem/1.05 var(--display); }
    .login p { margin: 0; color: var(--ink-soft); }
    input { width: 100%; min-height: 52px; padding: .8rem .9rem; border: 1.5px solid var(--line); border-radius: 8px; background: var(--white); color: var(--ink); font: 400 1.0625rem var(--text); }
    input:focus { outline: none; border-color: var(--ink); }
    .msg { margin: 0; color: var(--postmark); font-size: .9375rem; }
    .msg:empty { display: none; }

    .app { display: grid; min-height: calc(100dvh - 58px); }
    .list { padding: 1rem 16px 2rem; }
    .tabs { display: flex; gap: 1.25rem; margin-bottom: .75rem; }
    .tabs button { background: none; border: 0; padding: .5rem 0; font-weight: 600; color: var(--ink-soft); border-bottom: 2px solid transparent; cursor: pointer; }
    .tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--postmark); }
    .orders { display: grid; }
    .o { display: grid; grid-template-columns: 44px 1fr; gap: .15rem .8rem; align-items: center; padding: .8rem .5rem; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; cursor: pointer; border-radius: 6px; }
    .o:hover { background: var(--white); }
    .o[aria-current="true"] { background: var(--white); box-shadow: inset 3px 0 0 var(--postmark); }
    .o img { grid-row: span 2; width: 44px; height: 60px; object-fit: cover; border-radius: 4px; }
    .o b { display: block; font-weight: 600; }
    .o small { display: block; font-size: .875rem; color: var(--ink-soft); }
    .tag { justify-self: start; font: 700 .75rem/1 var(--mono); padding: .35rem .5rem; border-radius: 4px; background: var(--envelope-soft); white-space: nowrap; }
    .tag.you { background: var(--postmark); color: var(--white); }
    .tag.done { background: #e3efe6; color: var(--ok); }
    .empty { padding: 2rem .5rem; color: var(--ink-soft); }

    .detail { padding: 1rem 16px 2rem; border-top: 1.5px solid var(--line); }
    .d-head h2 { margin: 0; font: 400 clamp(1.8rem, 2vw + 1.2rem, 2.4rem)/1.05 var(--display); }
    .d-head p { margin: .3rem 0 0; color: var(--ink-soft); }
    .d-grid { display: grid; gap: 1.5rem; margin-top: 1.25rem; }
    .phone { width: min(100%, 340px); aspect-ratio: 390 / 780; border-radius: 28px; padding: 8px; background: var(--ink); box-shadow: 0 24px 48px -24px rgba(27, 38, 80, .6); justify-self: center; }
    .screen { width: 100%; height: 100%; border-radius: 21px; overflow: hidden; background: var(--paper); display: grid; place-items: center; color: var(--ink-soft); font-size: .9375rem; text-align: center; padding: 0; }
    .screen p { padding: 1rem; }
    .screen iframe { width: 100%; height: 100%; }
    .next { padding: 1.1rem; background: var(--white); border-radius: 10px; box-shadow: 0 1px 2px rgba(27, 38, 80, .08), 0 18px 36px -24px rgba(27, 38, 80, .45); display: grid; gap: .7rem; }
    .next h3 { margin: 0; font: 400 1.4rem/1.15 var(--display); }
    .next p { margin: 0; color: var(--ink-soft); font-size: .9375rem; }
    .next .btns { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .2rem; }
    .changes { margin-top: .4rem; padding: .85rem 1rem; background: #fdf1e6; border-radius: 8px; font-size: .9375rem; white-space: pre-line; }
    .changes b { display: block; margin-bottom: .2rem; }
    .facts { margin: 0; display: grid; grid-template-columns: minmax(7rem, 32%) 1fr; gap: .35rem .9rem; font-size: .9375rem; }
    .facts dt { color: var(--ink-soft); }
    .facts dd { margin: 0; overflow-wrap: anywhere; }
    .facts a { color: var(--ink); font-weight: 600; text-underline-offset: .25em; }
    .pick { padding: 3rem 16px; color: var(--ink-soft); }

    @media (min-width: 900px) {
      .app { grid-template-columns: 360px 1fr; }
      .list { border-right: 1.5px solid var(--line); max-height: calc(100dvh - 58px); overflow: auto; position: sticky; top: 0; }
      .detail { border-top: 0; padding: 1.75rem 2rem 3rem; }
      .d-grid { grid-template-columns: 340px minmax(0, 1fr); align-items: start; column-gap: 2rem; }
      .phone { justify-self: start; }
    }
  </style>
  <script src="../js/catalog.js?v=41" defer></script>
  <script src="catalog/guest-catalog-owner-viewer-v2.js" defer></script>
</head>
<body>
<header class="top"><b>Pedidos</b><span>Circuito de prueba</span></header>

<section class="login" id="login" hidden>
  <h1>Entrar</h1>
  <p>Con tu código maestro. Se queda guardado en este dispositivo.</p>
  <input id="master" type="password" autocomplete="current-password" aria-label="Código maestro">
  <button class="btn" id="enter" type="button">Entrar</button>
  <p class="msg" id="loginMsg" role="alert"></p>
</section>

<main class="app" id="app" hidden>
  <section class="list">
    <div class="tabs"><button type="button" data-filter="you" aria-pressed="true">Para ti</button><button type="button" data-filter="all" aria-pressed="false">Todos</button><button class="link" id="logout" type="button" style="margin-left:auto">Salir</button></div>
    <div class="orders" id="orders"></div>
  </section>
  <section class="detail" id="detail"><p class="pick">Elige un pedido.</p></section>
</main>

<script>
(() => {
'use strict';
const OWNER = 'https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-owner-manager';
const FLOW = 'https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/guest-invitation-flow-qa';
const KEY = 'weddly_owner_manager_token_v1';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get: () => { try { return localStorage.getItem(KEY) || ''; } catch { return ''; } }, set: (v) => { try { localStorage.setItem(KEY, v); } catch {} }, clear: () => { try { localStorage.removeItem(KEY); } catch {} } };
// Estados en palabras: lo que pasa y si te toca a ti.
const STATUS = {
  draft: ['Rellenando el cuestionario', ''],
  submitted: ['Cuestionario recibido', 'you'],
  designing: ['Lista para enviar', 'you'],
  review_ready: ['Lista para enviar', 'you'],
  review_sent: ['Revisando la pareja', ''],
  changes_requested: ['Corrigiendo la pareja', ''],
  approved: ['Aprobada: entregar', 'you'],
  delivered: ['Entregada', 'done']
};
let orders = [], filter = 'you', current = null, registry = null;

async function call(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', 'x-weddly-manager': store.get() }, body: JSON.stringify(body), cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (r.status === 403 && j?.error === 'manager_required') { store.clear(); showLogin('La sesión ha caducado. Vuelve a entrar.'); throw Error('manager_required'); }
  if (!r.ok || !j?.ok) { const e = Error(j?.error || 'request_failed'); e.data = j; throw e; }
  return j;
}
const flow = (b) => call(FLOW, b);
const design = (id) => (window.GUEST_CATALOG || []).find((d) => d.id === id) || { name: id, image: '' };
const fmtDate = (d) => { if (!d) return ''; const x = new Date(d.length === 10 ? d + 'T12:00:00' : d); return isNaN(x) ? d : x.toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }); };

function showLogin(text = '') { $('app').hidden = true; $('login').hidden = false; $('loginMsg').textContent = text; $('master').focus(); }
$('enter').onclick = async () => {
  const code = $('master').value.trim();
  if (!code) { $('loginMsg').textContent = 'Escribe el código.'; return; }
  $('enter').disabled = true; $('loginMsg').textContent = '';
  try {
    const r = await fetch(OWNER, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'login', recoveryCode: code }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j?.managerToken) throw Error('login');
    store.set(j.managerToken); $('master').value = ''; start();
  } catch { $('loginMsg').textContent = 'Ese código no vale.'; }
  finally { $('enter').disabled = false; }
};
$('master').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('enter').click(); });
$('logout').onclick = () => { store.clear(); showLogin(); };
document.querySelectorAll('[data-filter]').forEach((b) => b.onclick = () => { filter = b.dataset.filter; document.querySelectorAll('[data-filter]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); renderList(); });

function renderList() {
  const rows = orders.filter((o) => filter === 'all' || STATUS[o.status]?.[1] === 'you');
  $('orders').innerHTML = rows.length ? rows.map((o) => {
    const [label, kind] = STATUS[o.status] || [o.status, ''], d = design(o.templateId);
    return `<button class="o" type="button" data-id="${esc(o.id)}" aria-current="${current?.id === o.id}">
      ${d.image ? `<img src="../${esc(d.image)}" alt="">` : '<span></span>'}
      <span><b>${esc(o.label || o.buyerEmail || 'Sin nombres todavía')}</b><small>${esc(d.name)}${o.weddingDate ? ' · ' + esc(fmtDate(o.weddingDate)) : ''}${o.mode === 'test' ? ' · prueba' : ''}</small></span>
      <span class="tag ${kind}">${esc(label)}</span></button>`;
  }).join('') : `<p class="empty">${filter === 'you' ? 'Nada pendiente. Cuando una pareja envíe su cuestionario o apruebe su invitación, aparecerá aquí.' : 'Todavía no hay pedidos.'}</p>`;
  $('orders').querySelectorAll('.o').forEach((b) => b.onclick = () => open(b.dataset.id));
}
async function loadList() { const j = await flow({ action: 'list' }); orders = j.orders || []; renderList(); }

async function preview(config, order) {
  const host = $('screen');
  try {
    registry = registry || await fetch('GUEST_CATALOG_OWNER_RENDERERS_V2.json', { cache: 'no-store' }).then((r) => r.json());
    await window.GUEST_CATALOG_OWNER_VIEWER_V2.show({ order: { template_id: order.template_id, template_version: String(config.template.version || order.template_version), mode: 'test' }, config, host, registry });
  } catch (e) { host.innerHTML = `<p>No se ha podido montar la vista previa (${esc(e.message)}).</p>`; }
}

function actionFor(o) {
  const s = o.status;
  if (['submitted', 'designing', 'review_ready'].includes(s)) return { title: 'Mírala y envíasela', text: 'Está montada con lo que han escrito en el cuestionario. Si la ves bien, se la mandamos por email para que la revisen.', btn: 'Enviar a la pareja', run: sendReview };
  if (s === 'review_sent') return { title: 'Esperando a la pareja', text: 'Tienen el enlace para aprobarla o cambiar una parte. Te aparecerá en «Para ti» cuando la aprueben.', link: ['Abrir lo que ven ellos', '../guest-review-v1.html?t=' + encodeURIComponent(o.reviewToken)] };
  if (s === 'changes_requested') return { title: 'La pareja está corrigiendo', text: 'Han abierto la parte que querían cambiar. Cuando la envíen, volverá aquí montada de nuevo.' };
  if (s === 'approved') return { title: 'Aprobada', text: 'Al entregar, les llega el enlace definitivo para sus invitados y el acceso a la app.', btn: 'Entregar', run: deliver };
  if (s === 'delivered') return { title: 'Entregada', text: 'Este es el enlace que comparten con sus invitados.', link: ['Abrir la invitación final', o.delivery_url || ('catalog-final.html?p=' + encodeURIComponent(o.publicToken))] };
  return { title: 'Rellenando el cuestionario', text: 'Aún no lo han enviado. No tienes que hacer nada.' };
}

async function open(id) {
  $('detail').innerHTML = '<p class="pick">Abriendo…</p>';
  try {
    let { order: o } = await flow({ action: 'detail', orderId: id });
    let config = o.hydratedConfig;
    // Recién enviado o recién corregido: se monta solo a partir del cuestionario.
    if (o.status === 'submitted') {
      const j = await flow({ action: 'start_design', orderId: id });
      config = j.config; o = { ...o, status: 'designing' };
      const row = orders.find((x) => x.id === id); if (row) row.status = 'designing';
    }
    current = o; renderList();
    const q = o.questionnaire || {}, c = q.couple || {}, d = design(o.template_id), a = actionFor(o);
    const reqs = (o.revision_requests || []).slice().reverse();
    $('detail').innerHTML = `
      <div class="d-head"><h2>${esc(c.name1 && c.name2 ? `${c.name1} & ${c.name2}` : o.buyer_email || 'Pedido')}</h2><p>${esc(d.name)}${c.date ? ' · ' + esc(fmtDate(c.date)) : ''} · ${esc((STATUS[o.status] || [o.status])[0])}</p></div>
      <div class="d-grid">
        <div class="phone"><div class="screen" id="screen"><p>${config?.template ? 'Montando la invitación…' : 'Se verá aquí cuando envíen el cuestionario.'}</p></div></div>
        <div style="display:grid;gap:1.25rem">
          <div class="next"><h3>${esc(a.title)}</h3><p>${esc(a.text)}</p>
            ${reqs.length && ['designing', 'review_ready'].includes(o.status) ? `<div class="changes"><b>Lo último que pidieron (${reqs.length} ${reqs.length === 1 ? 'vez' : 'veces'})</b>${esc(reqs[0].note)}</div>` : ''}
            <div class="btns">${a.btn ? `<button class="btn" id="act" type="button">${esc(a.btn)}</button>` : ''}${a.link ? `<a class="btn line" href="${esc(a.link[1])}" target="_blank" rel="noopener">${esc(a.link[0])}</a>` : ''}</div>
            <p class="msg" id="actMsg" role="alert"></p></div>
          <dl class="facts">
            <dt>Email</dt><dd>${esc(q.contact?.email || o.buyer_email || '')}</dd>
            <dt>Diseño</dt><dd>${esc(d.name)}</dd>
            <dt>Pedido</dt><dd>${esc(fmtDate(o.created_at))}${o.mode === 'test' ? ' · prueba sin pago' : ''}</dd>
            <dt>Cuestionario</dt><dd><a href="catalog-questionnaire.html?t=${encodeURIComponent(o.questionnaireToken)}" target="_blank" rel="noopener">Abrir el de la pareja</a></dd>
          </dl>
        </div>
      </div>`;
    if (a.btn) $('act').onclick = () => a.run(o);
    if (config?.template) preview(config, o);
  } catch (e) { if (e.message !== 'manager_required') $('detail').innerHTML = `<p class="pick">No se ha podido abrir (${esc(e.message)}).</p>`; }
}

async function busyRun(fn) {
  const b = $('act'); b.disabled = true; const old = b.textContent; b.textContent = 'Un momento…'; $('actMsg').textContent = '';
  try { await fn(); } catch (e) {
    if (e.message === 'manager_required') return;
    const errs = e.data?.errors;
    $('actMsg').textContent = errs?.length ? 'Falta en el cuestionario: ' + errs.join(' ') : 'No ha salido (' + e.message + '). Prueba otra vez.';
    b.disabled = false; b.textContent = old;
  }
}
function sendReview(o) {
  return busyRun(async () => {
    if (o.status !== 'review_ready') await flow({ action: 'mark_review_ready', orderId: o.id });
    await flow({ action: 'send_review', orderId: o.id });
    await loadList(); await open(o.id);
  });
}
function deliver(o) {
  return busyRun(async () => {
    const invitationUrl = location.origin + '/guest/catalog-final.html?p=' + encodeURIComponent(o.publicToken);
    await flow({ action: 'deliver', orderId: o.id, invitationUrl });
    await loadList(); await open(o.id);
  });
}

async function start() {
  $('login').hidden = true; $('app').hidden = false;
  try { await loadList(); const first = orders.find((o) => STATUS[o.status]?.[1] === 'you'); if (first && matchMedia('(min-width: 900px)').matches) open(first.id); }
  catch (e) { if (e.message !== 'manager_required') $('orders').innerHTML = '<p class="empty">No se han podido cargar los pedidos.</p>'; }
}
addEventListener('DOMContentLoaded', () => (store.get() ? start() : showLogin()));
})();
</script>
</body>
</html>
