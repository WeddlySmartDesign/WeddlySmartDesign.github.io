<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><title>RSVP</title><style>:root{--bg:#f5f1ea;--paper:#fff;--line:#ddd5c8;--ink:#2c2a26;--muted:#706b65;--soft:#eee8df;--ok:#526b4d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:640px;margin:auto;padding:32px 20px 80px}h1{font:500 42px/1.05 Georgia,serif;margin:6px 0 8px}.lead{color:var(--muted);line-height:1.5;margin:0 0 22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}.unitHead{margin-bottom:18px}.unitHead span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.person{border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;background:#fff}.personTitle{font-weight:850;font-size:16px;margin-bottom:10px}.choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:750}.choice.sel{outline:2px solid var(--ink);background:var(--soft)}.details{display:none;margin-top:12px;padding-top:10px;border-top:1px solid #eee}.details.on{display:block}label{display:block;font-size:13px;font-weight:750;margin-top:8px}.field{width:100%;border:1px solid #ccc5bb;border-radius:12px;background:#fff;color:var(--ink);padding:13px;font-size:16px;margin:6px 0 10px}.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}.toggle input{width:22px;height:22px}.btn{width:100%;border:0;border-radius:13px;background:var(--ink);color:#fff;padding:14px 16px;font-size:16px;font-weight:800;margin-top:8px;text-decoration:none;display:block;text-align:center}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.notice{display:none;border-radius:13px;padding:12px;margin:12px 0;background:#f3e8dd;color:#7a5539;line-height:1.4}.notice.on{display:block}.success{text-align:center;padding:42px 0}.success .card{text-align:left;margin-top:22px}.summaryLine{padding:8px 0;border-bottom:1px solid #eee;font-size:14px}.summaryLine:last-child{border-bottom:0}.small{font-size:12px;color:var(--muted);line-height:1.45}.highchairWrap{display:none}.highchairWrap.on{display:flex}.postActions{margin-top:18px}.postActions .btn{margin-top:10px}@media(max-width:440px){h1{font-size:36px}.wrap{padding-left:16px;padding-right:16px}}</style></head><body><main class="wrap"><section id="app"><div class="card"><div class="small" id="loading">Cargando vuestra invitación…</div></div></section></main><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp',q=new URLSearchParams(location.search),token=q.get('t')||'',unitId=q.get('u')||'',app=document.getElementById('app'),safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));if(!unitId){location.replace('guests-rsvp-v105-mobile.html'+location.search+location.hash);return}let cfg={},unit=null,answers={},lang='es';const T=(es,en)=>lang==='en'?en:es;async function j(url,opt={}){const r=await fetch(url,opt),x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||'request_failed');return x}function mealOptions(){const xs=[['Estándar','Estándar','Standard'],['Vegetariano','Vegetariano','Vegetarian'],['Vegano','Vegano','Vegan'],['Celíaco','Celíaco','Gluten-free'],['Sin lactosa','Sin lactosa','Lactose-free'],['Infantil','Infantil','Child menu'],['Sin menú','Sin menú','No meal']];return xs.map(([v,es,en])=>`<option value="${v}">${T(es,en)}</option>`).join('')}function personHtml(m){return `<section class="person" data-person="${safe(m.id)}"><div class="personTitle">${safe(m.name)}</div><div class="choiceRow"><button type="button" class="choice" data-answer="yes">${T('Sí, asistiré','Yes, I’ll attend')}</button><button type="button" class="choice" data-answer="no">${T('No podré asistir','I can’t attend')}</button></div><div class="details"><div class="mealBlock"><label>${T('Menú','Meal')}</label><select class="field meal">${mealOptions()}</select><label class="toggle highchairWrap"><span>${T('Necesita trona','Needs a high chair')}</span><input class="highchair" type="checkbox"></label></div><div class="allergyBlock"><label>${T('Alergias o intolerancias','Allergies or intolerances')}</label><input class="field allergy" placeholder="${T('Lo que debamos saber','Anything we should know')}"></div><label class="toggle transportWrap"><span>${T('Necesito transporte','I need transport')}</span><input class="transport" type="checkbox"></label></div></section>`}function render(){const members=unit?.members||[];app.innerHTML=`<div class="unitHead"><div class="small">RSVP</div><h1>${safe(unit?.label||T('Vuestra invitación','Your invitation'))}</h1><span>${T(`${members.length} persona${members.length===1?'':'s'} incluida${members.length===1?'':'s'} en esta invitación`,`${members.length} ${members.length===1?'person':'people'} included in this invitation`)}</span></div><div class="card"><p class="lead">${T('Confirma a cada persona por separado. Así podremos actualizar correctamente mesas, catering y transporte.','Confirm each person separately so tables, catering and transport stay up to date.')}</p><div id="people">${members.map(m=>personHtml(m)).join('')}</div><div id="fb" class="notice"></div><button id="send" class="btn">${T('Enviar respuestas','Send responses')}</button></div>`;members.forEach(m=>wire(m));document.getElementById('send').onclick=submitAll}function wire(m){const root=app.querySelector(`[data-person="${CSS.escape(m.id)}"]`),yes=root.querySelector('[data-answer="yes"]'),no=root.querySelector('[data-answer="no"]'),details=root.querySelector('.details'),meal=root.querySelector('.meal'),highWrap=root.querySelector('.highchairWrap'),high=root.querySelector('.highchair');answers[m.id]={attend:null};const refreshHigh=()=>{const on=answers[m.id].attend===true&&meal?.value==='Infantil';highWrap?.classList.toggle('on',!!on);if(!on&&high)high.checked=false};const choose=v=>{answers[m.id].attend=v;yes.classList.toggle('sel',v===true);no.classList.toggle('sel',v===false);details.classList.toggle('on',v===true);refreshHigh()};yes.onclick=()=>choose(true);no.onclick=()=>choose(false);meal?.addEventListener('change',refreshHigh);if(cfg.questions?.meal===false)root.querySelector('.mealBlock').style.display='none';if(cfg.questions?.allergy===false)root.querySelector('.allergyBlock').style.display='none';if(cfg.transportOffered===false||cfg.questions?.transport===false)root.querySelector('.transportWrap').style.display='none'}function localDateBasic(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('')+'T'+[String(d.getHours()).padStart(2,'0'),String(d.getMinutes()).padStart(2,'0'),'00'].join('')}function nextDay(s){const[a,b,c]=String(s||'').split('-').map(Number),d=new Date(a,b-1,c+1,12);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('')}function calUrl(){if(!cfg?.date)return'';let dates='';if(cfg.time){const s=new Date(`${cfg.date}T${cfg.time}:00`),end=new Date(s.getTime()+4*3600000);dates=`${localDateBasic(s)}/${localDateBasic(end)}`}else dates=`${cfg.date.replaceAll('-','')}/${nextDay(cfg.date).replaceAll('-','')}`;const p=new URLSearchParams({action:'TEMPLATE',text:cfg.title?T('Boda · ','Wedding · ')+cfg.title:T('Nuestra boda','Our wedding'),dates,details:T('Invitación de boda','Wedding invitation'),location:cfg.venue||''});try{const z=Intl.DateTimeFormat().resolvedOptions().timeZone;if(z)p.set('ctz',z)}catch{}return'https://calendar.google.com/calendar/render?'+p.toString()}function invitationUrl(){return location.origin+'/guests-rsvp-v105.html'+location.search+location.hash}function successHtml(){const members=unit?.members||[],lines=members.map(m=>`<div class="summaryLine">${answers[m.id]?.attend===true?'✓':'—'} ${safe(m.name)} · ${answers[m.id]?.attend===true?T('Asiste','Attending'):T('No asiste','Not attending')}</div>`).join(''),mainCal=calUrl();return `<div class="success"><div class="small">${T('RESPUESTAS ENVIADAS','RESPONSES SENT')}</div><h1>${T('Gracias','Thank you')}</h1><p class="lead">${T('Las respuestas se han registrado correctamente.','Your responses have been saved.')}</p><div class="card">${lines}</div><div class="postActions"><a class="btn secondary" target="_top" href="${safe(invitationUrl())}">${T('Ver invitación','View invitation')}</a>${mainCal?`<a class="btn" target="_top" href="${safe(mainCal)}">${T('Añadir boda a Google Calendar','Add wedding to Google Calendar')}</a>`:''}</div></div>`}async function submitAll(){const members=unit?.members||[],fb=document.getElementById('fb'),b=document.getElementById('send'),missing=members.filter(m=>answers[m.id]?.attend===null);if(missing.length){fb.className='notice on';fb.textContent=T('Indica si asistirá cada persona a la boda antes de enviar.','Please answer for every person before sending.');app.querySelector(`[data-person="${CSS.escape(missing[0].id)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});return}b.disabled=true;b.textContent=T('Enviando…','Sending…');fb.className='notice';try{for(const m of members){const root=app.querySelector(`[data-person="${CSS.escape(m.id)}"]`),attend=answers[m.id].attend,meal=root.querySelector('.meal')?.value||'Sin menú',highchair=attend&&meal==='Infantil'&&!!root.querySelector('.highchair')?.checked,payload={action:'submit',token,client_submission_id:(crypto.randomUUID?crypto.randomUUID():'unit_'+Date.now()+'_'+Math.random().toString(36).slice(2)),guest_key:m.id,name:m.name,attend,age:null,meal_required:attend&&cfg.questions?.meal!==false?meal!=='Sin menú':null,meal:attend&&cfg.questions?.meal!==false&&meal!=='Sin menú'?meal:'',allergy:attend&&cfg.questions?.allergy!==false?(root.querySelector('.allergy')?.value.trim()||''):'',highchair,event_responses:{},children:[],plusone_details:null,transport:attend&&!!root.querySelector('.transport')?.checked,transport_seats:attend&&root.querySelector('.transport')?.checked?1:0};await j(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})}app.innerHTML=successHtml();window.scrollTo({top:0,behavior:'smooth'})}catch(e){b.disabled=false;b.textContent=T('Enviar respuestas','Send responses');fb.className='notice on';fb.textContent=T('No se han podido guardar todas las respuestas. Comprueba la conexión e inténtalo de nuevo.','Could not save all responses. Check your connection and try again.')}}async function init(){if(!token){app.innerHTML=`<div class="card"><h1>${T('RSVP no disponible','RSVP unavailable')}</h1><p class="lead">${T('Pide que te reenvíen la invitación.','Ask for the invitation link to be resent.')}</p></div>`;return}try{const x=await j(API+'?token='+encodeURIComponent(token)+'&unit='+encodeURIComponent(unitId));cfg=x.form?.config||{};lang=(cfg.lang==='en'||cfg.language==='en')?'en':((cfg.lang==='es'||cfg.language==='es')?'es':((navigator.language||'es').toLowerCase().startsWith('en')?'en':'es'));document.documentElement.lang=lang;unit=x.unit;if(!unit?.members?.length)throw new Error('unit_unavailable');render()}catch{app.innerHTML=`<div class="card"><h1>${T('RSVP no disponible','RSVP unavailable')}</h1><p class="lead">${T('Prueba de nuevo o pide que te reenvíen la invitación.','Try again or ask for the invitation link to be resent.')}</p></div>`}}init()})();</script></body></html>
