<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weddly Smart Design · RSVP Design Studio v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=Marcellus&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#ebe7e0;color:#26211d;font-family:'DM Sans',sans-serif}.studioTop{position:sticky;top:0;z-index:20;background:#f7f4efee;backdrop-filter:blur(14px);border-bottom:1px solid #d9d2c8;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}.studioTop b{font-size:13px;letter-spacing:.08em;text-transform:uppercase}.studioTop button{border:0;border-radius:999px;background:#26211d;color:#fff;padding:10px 14px;font-weight:700}.stage{padding:18px 10px 80px}.phone{width:min(100%,460px);margin:auto;background:#fff;min-height:100vh;box-shadow:0 24px 80px rgba(55,43,32,.14);overflow:hidden}.sheet{display:none;position:fixed;z-index:50;inset:0;background:#0008;align-items:flex-end}.sheet.on{display:flex}.sheetPanel{width:100%;max-width:760px;margin:auto;background:#fff;border-radius:28px 28px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheetPanel h2{font:500 38px/1 'Newsreader',serif;margin:2px 0 7px}.small{font-size:13px;color:#716b65;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:15px 0 20px}.choice{border:1px solid #ddd5ca;background:#fff;border-radius:16px;padding:8px;text-align:left}.choice.on{outline:2px solid #28231f}.thumb{height:92px;border-radius:11px;margin-bottom:8px;overflow:hidden;position:relative}.choice b{display:block;font-size:14px}.choice span{font-size:12px;color:#776f67}.thumb.vellum{background:linear-gradient(90deg,#f5efe5 0 65%,#d6c1a2 65%)}.thumb.vellum:after{content:'A · S';position:absolute;left:18px;bottom:14px;font:28px 'Bodoni Moda',serif}.thumb.herbario{background:#edf0e8}.thumb.herbario:before{content:'';position:absolute;inset:8px;background:radial-gradient(ellipse at 90% 20%,transparent 0 18px,#9aa88e 19px 20px,transparent 21px),radial-gradient(ellipse at 20% 80%,transparent 0 22px,#9aa88e 23px 24px,transparent 25px)}.thumb.herbario:after{content:'Alba & Leo';position:absolute;inset:0;display:grid;place-items:center;font:italic 23px 'Cormorant Garamond',serif;color:#425143}.thumb.blacktie{background:#111416}.thumb.blacktie:before{content:'D  ·  S';position:absolute;inset:12px;border:1px solid #cbb07a;color:#e4cf9c;display:grid;place-items:center;font:24px 'Marcellus',serif}.thumb.costa{background:linear-gradient(135deg,#efe7d8 0 60%,#0f4565 60%)}.thumb.costa:after{content:'12 · 09 · 27';position:absolute;left:12px;top:15px;color:#9d563a;font:700 16px 'DM Sans',sans-serif}.thumb.romance{background:#f2e4e5}.thumb.romance:after{content:'D & S';position:absolute;inset:0;display:grid;place-items:center;color:#7f4c54;font:italic 28px 'Cormorant Garamond',serif}.field{width:100%;padding:13px 14px;border:1px solid #d2cac0;border-radius:13px;font:500 16px 'DM Sans';margin:5px 0 12px}.photoPrev{display:none;width:100%;height:170px;object-fit:cover;border-radius:14px;margin:8px 0}.photoPrev.on{display:block}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:13px;padding:13px;font-weight:700}.btn.dark{background:#26211d;color:#fff}.btn.soft{background:#eee9e2;color:#26211d}.btn.danger{background:#f4e7e4;color:#87463f}.hidden{display:none!important}

/* shared invitation structure */
.inv{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);transition:.2s}.cover{position:relative;min-height:690px;padding:var(--coverPad);overflow:hidden;background:var(--coverBg)}.eyebrow{text-transform:uppercase;letter-spacing:.22em;font-size:10px;font-weight:700}.names{font-family:var(--display);font-weight:400;line-height:.92}.meta{font-size:13px;line-height:1.4}.count{display:inline-flex;margin-top:14px;padding:9px 13px;border:1px solid currentColor;border-radius:999px;font-weight:700;font-size:12px}.monogram{font-family:var(--display);font-size:48px;line-height:1}.photoSlot{display:none;overflow:hidden}.photoSlot.on{display:block}.photoSlot img{width:100%;height:100%;object-fit:cover;display:block}.section{padding:58px 28px;background:var(--sectionBg);color:var(--ink)}.section.alt{background:var(--altBg)}.lede{font-family:var(--display);font-size:38px;line-height:1.12;font-weight:400;margin:0 0 26px}.detailGrid{display:grid;gap:10px}.detail{padding:17px 16px;border:1px solid var(--line);background:var(--cardBg)}.detail small{display:block;text-transform:uppercase;letter-spacing:.16em;font-size:9px;margin-bottom:5px;color:var(--muted)}.timeline{display:grid;gap:0;margin-top:12px}.timeRow{display:grid;grid-template-columns:82px 1fr;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.timeRow b{font-family:var(--display);font-weight:400;font-size:22px}.rsvpHead{text-align:center;margin-bottom:20px}.rsvpHead h2{font-family:var(--display);font-weight:400;font-size:42px;margin:4px 0 8px}.rsvpHead p{color:var(--muted);font-size:14px;line-height:1.5}.formCard{background:var(--cardBg);border:1px solid var(--line);padding:20px}.label{display:block;font-size:12px;font-weight:700;margin:12px 0 6px}.input{width:100%;border:1px solid var(--line);background:var(--inputBg);color:var(--ink);padding:13px 14px;font:500 15px var(--body)}.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.answer{border:1px solid var(--line);background:var(--inputBg);color:var(--ink);padding:13px;font-weight:700}.answer.sel{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.send{width:100%;border:0;background:var(--accent);color:var(--accentText);padding:15px;margin-top:18px;font-weight:700;letter-spacing:.03em}.micro{text-transform:uppercase;letter-spacing:.18em;font-size:9px;color:var(--muted)}.footerMark{text-align:center;padding:38px 24px 52px;background:var(--sectionBg);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

/* VELLUM — editorial stationery */
.inv.vellum{--bg:#e9dfd1;--coverBg:#e9dfd1;--sectionBg:#f7f1e8;--altBg:#e9dfd1;--ink:#251e18;--muted:#796b5d;--line:#cdbba5;--cardBg:#fbf7f1;--inputBg:#fffaf4;--accent:#8a6f4e;--accentText:#fff;--display:'Bodoni Moda',serif;--body:'DM Sans',sans-serif;--coverPad:28px}.vellum .cover:before{content:'';position:absolute;inset:28px;border:1px solid #8f7657}.vellum .cover:after{content:'';position:absolute;right:0;top:0;width:34%;height:100%;background:#ceb28d}.vellum .coverInner{position:relative;z-index:2;min-height:634px;display:flex;flex-direction:column;max-width:68%;padding:70px 0 30px}.vellum .eyebrow{color:#7d654b}.vellum .monogram{margin-bottom:auto}.vellum .names{font-size:63px;letter-spacing:-.045em;margin:0 0 18px}.vellum .verticalDate{position:absolute;z-index:3;right:24px;top:155px;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.18em;text-transform:uppercase}.vellum .photoSlot{position:absolute;z-index:3;right:32px;bottom:42px;width:118px;height:172px;border:8px solid #f7f1e8;box-shadow:0 10px 30px #4a392626}.vellum .lede{max-width:330px}.vellum .detailGrid{grid-template-columns:1fr 1fr}.vellum .detail:first-child{grid-column:1/-1}.vellum .formCard,.vellum .input,.vellum .answer,.vellum .send{border-radius:0}

/* HERBARIO — botanical, no stock floral artwork */
.inv.herbario{--bg:#edf0e8;--coverBg:#edf0e8;--sectionBg:#f8f8f2;--altBg:#dfe6da;--ink:#344033;--muted:#71806e;--line:#bac8b7;--cardBg:#fbfcf8;--inputBg:#fff;--accent:#5f745d;--accentText:#fff;--display:'Cormorant Garamond',serif;--body:'DM Sans',sans-serif;--coverPad:26px}.herbario .cover{min-height:720px}.herbario .botanical{position:absolute;inset:0;pointer-events:none}.herbario .botanical svg{width:100%;height:100%}.herbario .coverInner{position:relative;z-index:2;min-height:668px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 18px 36px}.herbario .eyebrow{margin-bottom:auto}.herbario .names{font-size:68px;font-style:italic;color:#40523e}.herbario .meta{margin-top:18px}.herbario .photoSlot{width:220px;height:280px;border-radius:50% 50% 44% 44%;margin:26px auto 0;border:8px solid #f8f8f2;box-shadow:0 16px 42px rgba(57,76,54,.15)}.herbario .section{text-align:center}.herbario .detail{border-radius:999px}.herbario .timeline{text-align:left}.herbario .formCard{border-radius:28px}.herbario .input,.herbario .answer,.herbario .send{border-radius:14px}

/* BLACK TIE — formal evening */
.inv.blacktie{--bg:#0f1213;--coverBg:#0f1213;--sectionBg:#111516;--altBg:#e9dfcb;--ink:#f2eadc;--muted:#b7aa95;--line:#635a4a;--cardBg:#171c1d;--inputBg:#101415;--accent:#c6a66d;--accentText:#111;--display:'Marcellus',serif;--body:'DM Sans',sans-serif;--coverPad:24px}.blacktie .cover:before{content:'';position:absolute;inset:24px;border:1px solid #b99961}.blacktie .coverInner{position:relative;z-index:2;min-height:642px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:74px 20px 34px}.blacktie .monogram{color:#d6b87c;margin-bottom:auto;font-size:58px}.blacktie .eyebrow{color:#d6b87c}.blacktie .names{font-size:56px;letter-spacing:.03em;text-transform:uppercase}.blacktie .meta{color:#d7c7ad;margin-top:18px}.blacktie .count{border-color:#b99961}.blacktie .photoSlot{width:100%;height:300px;margin-top:26px;border-top:1px solid #b99961;border-bottom:1px solid #b99961;filter:grayscale(100%) contrast(1.05)}.blacktie .section.alt{color:#1c1a17}.blacktie .alt .lede,.blacktie .alt .micro{color:#1c1a17}.blacktie .alt .detail{background:#f4ecdc;border-color:#bba781;color:#1c1a17}.blacktie .formCard,.blacktie .input,.blacktie .answer,.blacktie .send{border-radius:0}

/* COSTA — Mediterranean, graphic but refined */
.inv.costa{--bg:#efe8dc;--coverBg:#efe8dc;--sectionBg:#f8f2e8;--altBg:#0e4768;--ink:#153f52;--muted:#6f7a78;--line:#cdbfae;--cardBg:#fffaf2;--inputBg:#fffdf8;--accent:#a8583d;--accentText:#fff;--display:'Newsreader',serif;--body:'DM Sans',sans-serif;--coverPad:0}.costa .cover{display:grid;grid-template-rows:1fr 180px}.costa .coverTop{position:relative;padding:46px 28px 22px;background:linear-gradient(90deg,#efe8dc 0 67%,#0e4768 67%)}.costa .coverTop:before{content:'';position:absolute;right:31px;top:45px;width:74px;height:74px;border:1px solid #d6c9b8;border-radius:50%}.costa .eyebrow{color:#a8583d}.costa .names{font-size:68px;max-width:270px;margin:130px 0 18px}.costa .meta{max-width:270px}.costa .count{border-color:#a8583d;color:#a8583d}.costa .tileBand{background:#0e4768;display:grid;grid-template-columns:repeat(6,1fr);gap:1px;padding:14px}.costa .tileBand i{display:block;border:1px solid #e3d7c6;aspect-ratio:1;position:relative}.costa .tileBand i:before,.costa .tileBand i:after{content:'';position:absolute;inset:20%;border:1px solid #e3d7c6;transform:rotate(45deg)}.costa .photoSlot{position:absolute;right:25px;bottom:150px;width:135px;height:200px;border:7px solid #f4eddf;border-radius:68px 68px 6px 6px}.costa .alt{color:#f7efdf}.costa .alt .micro,.costa .alt .lede{color:#f7efdf}.costa .alt .timeRow{border-color:#ffffff45}.costa .detail{border-radius:18px}.costa .formCard{border-radius:4px}.costa .input,.costa .answer{border-radius:3px}.costa .send{border-radius:999px}

/* ROMANCE — soft couture */
.inv.romance{--bg:#efe0e2;--coverBg:#efe0e2;--sectionBg:#fbf4f4;--altBg:#7b4650;--ink:#59373e;--muted:#8a6f74;--line:#d9bcc2;--cardBg:#fffafa;--inputBg:#fff;--accent:#7b4650;--accentText:#fff;--display:'Cormorant Garamond',serif;--body:'DM Sans',sans-serif;--coverPad:25px}.romance .cover{min-height:730px}.romance .cover:before{content:'';position:absolute;left:-120px;top:90px;width:280px;height:280px;border:1px solid #b98c96;border-radius:50%}.romance .cover:after{content:'';position:absolute;right:-95px;bottom:70px;width:240px;height:240px;border:1px solid #b98c96;border-radius:50%}.romance .coverInner{position:relative;z-index:2;min-height:680px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 20px 34px}.romance .monogram{font-style:italic;margin-bottom:auto;color:#8d5963}.romance .names{font-size:70px;font-style:italic;margin-bottom:16px}.romance .meta{max-width:280px}.romance .photoSlot{width:250px;height:310px;border-radius:160px 160px 16px 16px;margin:26px auto 0;box-shadow:0 20px 44px rgba(89,55,62,.15)}.romance .alt{color:#fff7f7;text-align:center}.romance .alt .lede,.romance .alt .micro{color:#fff7f7}.romance .alt .timeRow{border-color:#ffffff38;text-align:left}.romance .detail{border-radius:28px}.romance .formCard{border-radius:30px}.romance .input,.romance .answer,.romance .send{border-radius:999px}.romance .input{padding-left:18px}

@media(max-width:480px){.stage{padding:0 0 70px}.phone{width:100%;box-shadow:none}.cover{min-height:660px}.vellum .coverInner{min-height:604px}.vellum .names{font-size:56px}.herbario .coverInner{min-height:620px}.herbario .names{font-size:61px}.blacktie .coverInner{min-height:610px}.blacktie .names{font-size:49px}.costa .names{font-size:61px}.romance .coverInner{min-height:630px}.romance .names{font-size:62px}.section{padding:52px 24px}.detailGrid{grid-template-columns:1fr!important}.vellum .detail:first-child{grid-column:auto}}
</style>
</head>
<body>
<header class="studioTop"><b>RSVP · Estudio de diseño</b><button id="openStudio">Diseños</button></header>
<div class="stage"><div class="phone"><main id="preview" class="inv vellum"></main></div></div>
<div id="sheet" class="sheet"><div class="sheetPanel"><div class="small" style="text-transform:uppercase;letter-spacing:.16em;font-weight:700">RSVP independiente de la app</div><h2>Elegid vuestra invitación</h2><div class="small">Cada dirección cambia composición, tipografía, ritmo, fondos y tratamiento de fotografía. La foto nunca va detrás del texto.</div><div class="grid"><button class="choice on" data-t="vellum"><div class="thumb vellum"></div><b>Vellum</b><span>Editorial · papelería</span></button><button class="choice" data-t="herbario"><div class="thumb herbario"></div><b>Herbario</b><span>Botánico · romántico</span></button><button class="choice" data-t="blacktie"><div class="thumb blacktie"></div><b>Black Tie</b><span>Formal · noche</span></button><button class="choice" data-t="costa"><div class="thumb costa"></div><b>Costa</b><span>Mediterráneo · gráfico</span></button><button class="choice" data-t="romance"><div class="thumb romance"></div><b>Romance</b><span>Suave · couture</span></button></div><label>Persona 1</label><input id="p1" class="field" value="Daniela"><label>Persona 2</label><input id="p2" class="field" value="Sergio"><label>Fecha</label><input id="date" class="field" type="date" value="2027-09-12"><label>Lugar</label><input id="place" class="field" value="Finca La Alquería, Murcia"><label>Foto opcional del RSVP</label><input id="photo" class="field" type="file" accept="image/*"><img id="photoPrev" class="photoPrev"><div class="row"><button id="removePhoto" class="btn danger">Quitar foto</button><button id="closeStudio" class="btn dark">Ver invitación</button></div></div></div>
<script>
(()=>{
const preview=document.getElementById('preview'),sheet=document.getElementById('sheet'),openStudio=document.getElementById('openStudio'),closeStudio=document.getElementById('closeStudio'),photo=document.getElementById('photo'),photoPrev=document.getElementById('photoPrev'),removePhoto=document.getElementById('removePhoto'),p1=document.getElementById('p1'),p2=document.getElementById('p2'),date=document.getElementById('date'),place=document.getElementById('place');
let S={template:'vellum',p1:'Daniela',p2:'Sergio',date:'2027-09-12',place:'Finca La Alquería, Murcia',photo:''};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(){const d=new Date(S.date+'T12:00:00');return Number.isNaN(d)?'12 septiembre 2027':d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}
function initials(){return (S.p1.trim()[0]||'D').toUpperCase()+' · '+(S.p2.trim()[0]||'S').toUpperCase()}
function days(){const a=new Date();a.setHours(0,0,0,0);const b=new Date(S.date+'T00:00:00');const n=Math.ceil((b-a)/86400000);return Number.isFinite(n)&&n>=0?'Faltan '+n+' días':''}
function photoHTML(){return `<div class="photoSlot ${S.photo?'on':''}">${S.photo?`<img src="${S.photo}" alt="Foto de la pareja">`:''}</div>`}
function cover(){const n=`${esc(S.p1)} & ${esc(S.p2)}`,fd=esc(fmtDate()),pl=esc(S.place),cnt=esc(days());if(S.template==='vellum')return `<section class="cover"><div class="coverInner"><div class="eyebrow">Nuestra boda</div><div class="monogram">${esc(initials())}</div><div class="names">${n}</div><div class="meta">${fd}<br>${pl}</div><div class="count">${cnt}</div></div><div class="verticalDate">${fd}</div>${photoHTML()}</section>`;if(S.template==='herbario')return `<section class="cover"><div class="botanical"><svg viewBox="0 0 460 720" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M29 602C99 561 85 463 136 413C171 378 205 392 220 325" stroke="#8EA087" stroke-width="1.3"/><path d="M77 548C120 537 144 509 153 468M99 503C137 492 164 460 169 428M335 46C321 115 372 146 363 217C357 267 320 291 330 354" stroke="#8EA087" stroke-width="1.3"/><path d="M333 109C293 124 275 151 274 184M359 155C401 169 421 197 423 233" stroke="#8EA087" stroke-width="1.3"/><ellipse cx="71" cy="548" rx="15" ry="37" transform="rotate(54 71 548)" stroke="#8EA087"/><ellipse cx="105" cy="501" rx="14" ry="34" transform="rotate(54 105 501)" stroke="#8EA087"/><ellipse cx="338" cy="105" rx="14" ry="34" transform="rotate(23 338 105)" stroke="#8EA087"/></svg></div><div class="coverInner"><div class="eyebrow">Estáis invitados</div><div class="names">${n}</div><div class="meta">${fd} · ${pl}</div><div class="count">${cnt}</div>${photoHTML()}</div></section>`;if(S.template==='blacktie')return `<section class="cover"><div class="coverInner"><div class="eyebrow">Black tie celebration</div><div class="monogram">${esc(initials())}</div><div class="names">${n}</div><div class="meta">${fd}<br>${pl}</div><div class="count">${cnt}</div>${photoHTML()}</div></section>`;if(S.template==='costa')return `<section class="cover"><div class="coverTop"><div class="eyebrow">Nos casamos</div><div class="names">${n}</div><div class="meta">${fd}<br>${pl}</div><div class="count">${cnt}</div>${photoHTML()}</div><div class="tileBand">${'<i></i>'.repeat(12)}</div></section>`;return `<section class="cover"><div class="coverInner"><div class="eyebrow">Nuestra boda</div><div class="monogram">${esc(initials())}</div><div class="names">${n}</div><div class="meta">${fd}<br>${pl}</div><div class="count">${cnt}</div>${photoHTML()}</div></section>`}
function body(){return `${cover()}<section class="section"><div class="micro">La invitación</div><h1 class="lede">Nos encantará celebrar este día contigo.</h1><div class="detailGrid"><div class="detail"><small>Fecha</small><b>${esc(fmtDate())}</b></div><div class="detail"><small>Hora</small><b>18:00</b></div><div class="detail"><small>Lugar</small><b>${esc(S.place)}</b></div></div></section><section class="section alt"><div class="micro">Así será el día</div><h2 class="lede">Un día para disfrutarlo sin mirar el reloj.</h2><div class="timeline"><div class="timeRow"><b>18:00</b><span>Ceremonia</span></div><div class="timeRow"><b>19:00</b><span>Cóctel</span></div><div class="timeRow"><b>20:30</b><span>Cena</span></div><div class="timeRow"><b>23:30</b><span>Fiesta</span></div></div></section><section class="section"><div class="rsvpHead"><div class="micro">RSVP</div><h2>Confirma tu asistencia</h2><p>Tu respuesta quedará conectada automáticamente con nuestra lista de invitados.</p></div><div class="formCard"><label class="label">Nombre y apellidos</label><input class="input" placeholder="Tu nombre"><label class="label">¿Vienes?</label><div class="answers"><button class="answer sel">Sí, allí estaré</button><button class="answer">No podré asistir</button></div><label class="label">Tu menú</label><select class="input"><option>Estándar</option><option>Vegetariano</option><option>Vegano</option><option>Celíaco</option></select><label class="label">Alergias o intolerancias</label><input class="input" placeholder="Cuéntanos si debemos saber algo"><button class="send">Enviar respuesta</button></div></section><div class="footerMark">Weddly Smart Design · invitación digital</div>`}
function render(){preview.className='inv '+S.template;preview.innerHTML=body();document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('on',x.dataset.t===S.template));}
document.querySelector('.grid').onclick=e=>{const c=e.target.closest('.choice');if(!c)return;S.template=c.dataset.t;render()};[p1,p2,date,place].forEach(x=>x.addEventListener('input',()=>{S.p1=p1.value;S.p2=p2.value;S.date=date.value;S.place=place.value;render()}));photo.onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.photo=String(r.result||'');photoPrev.src=S.photo;photoPrev.classList.add('on');render()};r.readAsDataURL(f)};removePhoto.onclick=()=>{S.photo='';photo.value='';photoPrev.removeAttribute('src');photoPrev.classList.remove('on');render()};openStudio.onclick=()=>sheet.classList.add('on');closeStudio.onclick=()=>sheet.classList.remove('on');sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('on')};render();
})();
</script>
</body></html>
