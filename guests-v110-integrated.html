<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests v110 stable</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="g" src="guests-v109-integrated.html?v=110"></iframe><script>(()=>{const F=document.getElementById('g'),KEY='weddly_guests_qa_v67',API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-guests-structure';let hooked=false,STRUCT={people:{},units:[]};const token=()=>localStorage.getItem('weddly_shared_wedding_token')||'',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function deep(){try{let d=F.contentDocument,w=F.contentWindow;for(let i=0;i<32;i++){const f=d?.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument;w=f.contentWindow}return d?.body?{d,w}:null}catch{return null}}function bridge(d,w){if(w.__v110Bridge)return;const s=d.createElement('script');s.textContent='window.__v110Bridge={state:()=>S,save:()=>save(),render:()=>render(),go:(id,n)=>go(id,n)};';d.body.appendChild(s)}function state(){try{return JSON.parse(localStorage.getItem(KEY))||{guests:{}}}catch{return{guests:{}}}}function style(d){if(d.getElementById('v110css'))return;const s=d.createElement('style');s.id='v110css';s.textContent=`#v109flow{display:none!important}#invitados>#v106attendance,#invitados>[data-rsvp-entry]{display:none!important}.v110flow{display:grid;gap:14px}.v110step{background:#fff;border:1px solid #ddd5c8;border-radius:20px;padding:20px}.v110top{display:flex;gap:12px;align-items:flex-start}.v110num{width:30px;height:30px;border-radius:999px;background:#2c2a26;color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.v110step h3{margin:0 0 5px;font-size:20px}.v110step p{margin:0;color:#706b65;line-height:1.45}.v110summary{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}.v110pill{background:#eee8df;border-radius:999px;padding:7px 10px;font-size:13px}.v110actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.v110actions.one{grid-template-columns:1fr}.v110actions button{width:100%}.v110minor{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.v110minor button{border:1px solid #d8d0c5;background:#fff;border-radius:12px;padding:10px 12px;font-weight:700}.v110helper{background:#faf8f4;border:1px solid #e4ddd3;border-radius:14px;padding:12px 13px;margin-top:12px;color:#655f59;font-size:14px;line-height:1.45}.v110wizard label{display:block;margin-top:10px}.v110wizard .field{margin-top:6px}.v110names{min-height:140px}.v110crumb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#77716b;margin-bottom:6px}.v110choice{display:block;width:100%;text-align:left;border:1px solid #ddd5c8;background:#fff;border-radius:14px;padding:14px;margin:7px 0;font-size:16px}.v110choice.sel{outline:2px solid #2c2a26}.v110toast{position:fixed;z-index:25000;top:18px;left:18px;right:18px;background:#2c2a26;color:#fff;border-radius:16px;padding:15px 17px}.v110toast small{display:block;color:#ddd5c8;margin-top:4px}#hoy .card[data-v110-hide-rsvp]{display:none!important}`;d.head.appendChild(s)}function toast(d,t,detail=''){d.querySelector('.v110toast')?.remove();const e=d.createElement('div');e.className='v110toast';e.innerHTML='<b>'+esc(t)+'</b>'+(detail?'<small>'+esc(detail)+'</small>':'');d.body.appendChild(e);setTimeout(()=>e.remove(),3000)}async function loadStruct(){if(!token())return;try{const r=await fetch(API,{headers:{'x-weddly-token':token()}}),x=await r.json();if(r.ok&&x.ok){STRUCT.people={};(x.people||[]).forEach(p=>STRUCT.people[p.guest_key]=p);STRUCT.units=x.units||[]}}catch{}}async function saveUnit(name){const key='u_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':token()},body:JSON.stringify({action:'save_unit',unit_key:key,name})}),x=await r.json();if(!r.ok||!x.ok)throw new Error('unit');STRUCT.units.push(x.unit);return key}async function savePerson(id,group,unit){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':token()},body:JSON.stringify({action:'save_person',guest_key:id,group_name:group||'',unit_key:unit||'',relation_role:''})}),x=await r.json();if(!r.ok||!x.ok)throw new Error('person');STRUCT.people[id]=x.person}function groups(){const fixed=['Familia novia','Familia novio','Amigos novia','Amigos novio','Trabajo','Otros'],custom=Object.values(STRUCT.people).map(p=>p.group_name).filter(Boolean);return [...new Set([...fixed,...custom])]}function unitsFor(group){const keys=new Set(Object.values(STRUCT.people).filter(p=>p.group_name===group&&p.unit_key).map(p=>p.unit_key));return STRUCT.units.filter(u=>keys.has(u.unit_key))}function sheet(d,html){const sh=d.getElementById('sheet'),p=d.getElementById('panel');if(!sh||!p)return null;p.innerHTML=html;sh.classList.add('on');const nav=d.querySelector('.nav');if(nav)nav.style.pointerEvents='none';const close=()=>{sh.classList.remove('on');p.innerHTML='';if(nav)nav.style.pointerEvents='auto'};sh.onclick=e=>{if(e.target===sh)close()};p.onclick=e=>e.stopPropagation();return{p,close}}async function createList(d,w){await loadStruct();let group='',unitKey='',unitName='';const o=sheet(d,'<div class="v110wizard"><div class="v110crumb">Crear mi lista</div><h2>1 · ¿De qué parte vienen?</h2><p class="small">Primero crea el grupo grande: por ejemplo Familia novia, Amigos novia, Amigos novio…</p><div id="v110groups"></div><label>O crea uno nuevo</label><input id="v110newgroup" class="field" placeholder="Ej. Familia de Canarias"><div class="actions"><button class="btn soft" data-close>Volver</button><button class="btn" data-next>Siguiente</button></div></div>');if(!o)return;const renderGroups=()=>{o.p.querySelector('#v110groups').innerHTML=groups().map(g=>'<button class="v110choice" data-g="'+esc(g)+'">'+esc(g)+'</button>').join('');o.p.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{group=b.dataset.g;o.p.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('sel',x===b));o.p.querySelector('#v110newgroup').value=''})};renderGroups();o.p.querySelector('[data-close]').onclick=o.close;o.p.querySelector('[data-next]').onclick=()=>{const ng=o.p.querySelector('#v110newgroup').value.trim();if(ng)group=ng;if(!group)return;step2()};function step2(){const us=unitsFor(group);o.p.innerHTML='<div class="v110wizard"><div class="v110crumb">'+esc(group)+'</div><h2>2 · ¿Qué círculo es?</h2><p class="small">Ejemplos: Universidad, Familia de Canarias, Compañeros de trabajo. Si no hace falta, puedes dejarlo sin subgrupo.</p><button class="v110choice sel" data-u="">Sin subgrupo</button>'+us.map(u=>'<button class="v110choice" data-u="'+esc(u.unit_key)+'">'+esc(u.name)+'</button>').join('')+'<label>O crea un subgrupo nuevo</label><input id="v110newunit" class="field" placeholder="Ej. Universidad"><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-next>Siguiente</button></div></div>';o.p.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{unitKey=b.dataset.u;unitName=b.textContent.trim();o.p.querySelectorAll('[data-u]').forEach(x=>x.classList.toggle('sel',x===b));o.p.querySelector('#v110newunit').value=''});o.p.querySelector('[data-back]').onclick=()=>{o.close();createList(d,w)};o.p.querySelector('[data-next]').onclick=()=>{const nu=o.p.querySelector('#v110newunit').value.trim();if(nu){unitKey='__new__';unitName=nu}else if(!unitKey){unitName=''}step3()}}function step3(){o.p.innerHTML='<div class="v110wizard"><div class="v110crumb">'+esc(group)+(unitName?' · '+esc(unitName):'')+'</div><h2>3 · Añade las personas</h2><p class="small">Escribe un nombre por línea. Podrás añadir RSVP, menú, mesa y transporte después.</p><textarea id="v110names" class="field v110names" placeholder="Ana López\nMaría López\nJuan Pérez"></textarea><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-save>Crear invitados</button></div></div>';o.p.querySelector('[data-back]').onclick=step2;o.p.querySelector('[data-save]').onclick=async()=>{const names=o.p.querySelector('#v110names').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!names.length)return;const btn=o.p.querySelector('[data-save]');btn.disabled=true;btn.textContent='Creando…';try{let u=unitKey;if(u==='__new__')u=await saveUnit(unitName);const b=w.__v110Bridge,S=b.state();S.guests=S.guests||{};for(const name of names){const id='g_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);S.guests[id]={name,rsvp:'pending',meal:'',table:'',transport:false,group,unitId:u||''};await savePerson(id,group,u||'')}b.save();b.render();o.close();toast(d,names.length+' invitado'+(names.length===1?'':'s')+' añadidos',group+(unitName?' · '+unitName:''))}catch(e){btn.disabled=false;btn.textContent='Crear invitados';toast(d,'No se ha podido guardar','Reintenta con conexión.')}}}}function txtButton(d,text){return [...d.querySelectorAll('button')].find(b=>b.textContent.trim().includes(text))}function hideRedundant(d){d.querySelectorAll('#hoy .card').forEach(c=>{if(/RSVP activo/i.test(c.textContent))c.setAttribute('data-v110-hide-rsvp','1')});const inv=d.getElementById('invitados');if(!inv)return;[...inv.children].forEach(el=>{if(el.id==='v110flow'||el.tagName==='H2')return;if(el.id==='v106attendance'||el.hasAttribute?.('data-rsvp-entry')||/RSVP activo/i.test(el.textContent||''))el.style.display='none'})}function mount(){const x=deep();if(!x)return;const{d,w}=x;style(d);bridge(d,w);hideRedundant(d);const inv=d.getElementById('invitados');if(!inv)return;if(inv.querySelector('#v110flow'))return;const S=state(),all=Object.values(S.guests||{}),decl=all.filter(g=>g?.rsvp==='declined').length,active=all.filter(g=>g?.rsvp!=='declined').length,conf=all.filter(g=>g?.rsvp==='confirmed').length,pend=all.filter(g=>g?.rsvp==='pending').length,assigned=all.filter(g=>g?.rsvp!=='declined'&&g.table).length;const f=d.createElement('div');f.id='v110flow';f.className='v110flow';f.innerHTML='<div class="v110step"><div class="v110top"><span class="v110num">1</span><div><h3>Prepara tu lista</h3><p>Importa lo que ya tienes o crea la lista por grupos y círculos.</p></div></div><div class="v110summary"><span class="v110pill">'+all.length+' invitados iniciales</span><span class="v110pill">'+active+' en gestión</span>'+(decl?'<span class="v110pill">'+decl+' no asisten</span>':'')+'</div><div class="v110actions"><button class="btn soft" data-import>Importar lista</button><button class="btn" data-create>Crear mi lista</button></div><div class="v110minor"><button data-map>Ver organización</button><button data-people>Ver personas</button></div><div class="v110helper">Ejemplo: Amigos novia → Universidad → Ana, María, Juan. Después puedes sentarlos provisionalmente juntos y ajustar cuando respondan.</div></div><div class="v110step"><div class="v110top"><span class="v110num">2</span><div><h3>Envía y recoge RSVP</h3><p>Las respuestas actualizan esta misma lista.</p></div></div><div class="v110summary"><span class="v110pill">'+conf+' confirmados</span><span class="v110pill">'+pend+' pendientes</span></div><div class="v110actions one"><button class="btn" data-rsvp>Gestionar RSVP</button></div></div><div class="v110step"><div class="v110top"><span class="v110num">3</span><div><h3>Ajusta las mesas</h3><p>Empieza antes de tener todas las respuestas. Los pendientes pueden tener mesa provisional.</p></div></div><div class="v110summary"><span class="v110pill">'+assigned+' con mesa</span><span class="v110pill">'+Math.max(0,active-assigned)+' sin mesa</span></div><div class="v110actions one"><button class="btn" data-tables>Abrir mesas provisionales</button></div><div class="v110helper">Confirmado: conserva su mesa. No asiste: libera plaza. Niño o +1 nuevo: aparece para colocarlo.</div></div>';const h2=inv.querySelector('h2');h2?h2.insertAdjacentElement('afterend',f):inv.prepend(f);f.querySelector('[data-import]').onclick=()=>txtButton(d,'Ya tengo mi lista')?.click();f.querySelector('[data-create]').onclick=()=>createList(d,w);f.querySelector('[data-map]').onclick=()=>txtButton(d,'Abrir mapa visual')?.click();f.querySelector('[data-people]').onclick=()=>{const t=d.querySelector('#v108list [data-t]');if(t)t.click()};f.querySelector('[data-rsvp]').onclick=()=>{location.href='guests-rsvp-v110.html?v=110'};f.querySelector('[data-tables]').onclick=()=>w.__v110Bridge?.go('mesas',2)}function install(){const x=deep();if(!x)return false;style(x.d);bridge(x.d,x.w);hideRedundant(x.d);if(!hooked&&typeof x.w.renderGuests==='function'){hooked=true;const old=x.w.renderGuests;x.w.renderGuests=function(){const r=old.apply(this,arguments);requestAnimationFrame(()=>mount());return r}}mount();return true}function boot(){let tries=0;const tick=()=>{const ok=install();if((hooked&&ok)||++tries>80)return;setTimeout(tick,100)};tick()}F.addEventListener('load',boot,{once:true});setTimeout(boot,250)})();</script></body></html>
