:root{--ink:#2C2A26;--sage:#596248;--paper:#FBF8F3;--line:#E5DED2;--muted:#756F65;--soft:#F3F0EA}*{box-sizing:border-box}body{margin:0;background:#F2EFE9;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;max-width:620px;margin:0 auto;background:var(--paper);padding:calc(34px + env(safe-area-inset-top)) 24px calc(50px + env(safe-area-inset-bottom))}.brand{font-family:Georgia,serif;color:var(--sage);font-size:34px;line-height:.95}.brand span{display:block;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-top:10px;color:var(--muted);font-weight:700}.card{margin-top:48px;background:white;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(44,42,38,.04)}h1{font-family:Georgia,serif;font-weight:500;font-size:30px;margin:0 0 10px}.lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0}.status{margin-top:14px;font-size:12px;color:var(--muted)}.open{display:inline-block;margin-top:20px;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:#fff;color:var(--ink);text-decoration:none;font-size:13px;font-weight:750}
