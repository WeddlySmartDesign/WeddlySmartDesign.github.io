<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Weddly Smart Design · Demo</title>
<style>
:root{--ink:#2C2A26;--sage:#596248;--paper:#FBF8F3;--muted:#756F65;--line:#E5DED2;--danger:#A84535}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#F2EFE9;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100dvh;display:grid;place-items:center;padding:26px;text-align:center}.card{width:min(100%,440px);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 30px rgba(44,42,38,.05)}.brand{font-family:Georgia,serif;color:var(--sage);font-size:31px;line-height:1}.brand span{display:block;font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin-top:8px;color:var(--muted)}#msg{margin-top:22px;color:var(--muted);font-size:14px;line-height:1.55}.err{color:var(--danger)}</style>
</head>
<body><main class="boot"><section class="card"><div class="brand">Weddly<span>Smart Design</span></div><div id="msg">Recuperando vuestra demo…</div></section></main>
<script>
(async()=>{
const PAY_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/wedding-sync',GUEST_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-guests-state',PLAN_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-planning-state';
const TOKEN='weddly_shared_wedding_token',MODE='weddly_owner_demo_mode',GBASE='weddly_guests_qa_v67',GTRACK='weddly_guests_local_mode_v1';
const msg=document.getElementById('msg');
function fail(t){msg.textContent=t;msg.classList.add('err')}
function jsonGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
try{
  const hp=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):location.hash),lang=(hp.get('lang')||'').toLowerCase(),product=(hp.get('product')||'full').toLowerCase(),token=hp.get('token')||'';
  history.replaceState(null,'',location.pathname);
  if((lang!=='es'&&lang!=='en')||!['full','payments','guests'].includes(product)||token.length<40){fail('No hemos podido abrir esta demo. Vuelve a abrirla desde WSD Accesos.');return}
  document.documentElement.lang=lang;msg.textContent=lang==='en'?'Restoring your demo…':'Recuperando vuestra demo…';
  localStorage.setItem(TOKEN,token);localStorage.setItem(MODE,lang);localStorage.setItem('weddly_access_lang',lang);localStorage.setItem('weddly_owner_demo_token_'+lang,token);
  function payKey(){return 'weddly_pro_v7_owner_demo_'+lang}
  function planKey(){return 'weddly_planning_v2_owner_demo_'+lang}
  function guestSnap(){return GBASE+'_snapshot_demo_'+lang}
  async function get(url){const c=new AbortController(),tm=setTimeout(()=>c.abort(),9000);try{const r=await fetch(url,{headers:{'x-weddly-token':token,'x-weddly-demo':lang},cache:'no-store',signal:c.signal}),x=await r.json().catch(()=>({}));if(!r.ok||!x?.ok)throw new Error(String(x?.error||r.status));return x}finally{clearTimeout(tm)}}
  function cachePayments(x){const data={version:9,settings:{...(x.settings||{}),lang},providers:Array.isArray(x.providers)?x.providers:[],diy:Array.isArray(x.diy)?x.diy:[],contributions:Array.isArray(x.contributions)?x.contributions:[]};localStorage.setItem(payKey(),JSON.stringify(data));localStorage.setItem('weddly_sync_base_v20_owner_demo_'+lang,JSON.stringify({token,version:Number(x.version||0),data:{settings:data.settings,providers:data.providers,diy:data.diy,contributions:data.contributions}}))}
  function cacheGuests(x){if(!x.state)return;const raw=JSON.stringify(x.state),current='demo_'+lang,previous=localStorage.getItem(GTRACK)||'real',base=localStorage.getItem(GBASE);if(previous!==current&&base!==null)localStorage.setItem(GBASE+'_snapshot_'+previous,base);localStorage.setItem(guestSnap(),raw);localStorage.setItem(GBASE,raw);localStorage.setItem(GTRACK,current)}
  function cachePlanning(x){if(!x.state)return;localStorage.setItem(planKey(),JSON.stringify({state:x.state,version:Number(x.version||0),dirty:false}))}
  function hasLocal(){const p=jsonGet(payKey()),g=jsonGet(guestSnap())||jsonGet(GBASE),pl=jsonGet(planKey()),pay=!!(p&&(Array.isArray(p.providers)||p.settings)),guests=!!(g&&(Object.keys(g.guests||{}).length||Object.keys(g.tables||{}).length)),planning=!!(pl&&(pl.state||pl.tasks||pl.events));return product==='payments'?pay:product==='guests'?guests:(pay&&guests&&planning)}
  try{const [p,g,pl]=await Promise.all([get(PAY_API),get(GUEST_API),get(PLAN_API)]);cachePayments(p);cacheGuests(g);cachePlanning(pl)}catch(e){console.warn('WSD external demo bootstrap',e);if(!hasLocal()){fail(lang==='en'?'The demo could not be restored. Open it again from WSD Access.':'La demo no se ha podido recuperar. Vuelve a abrirla desde WSD Accesos.');return}}
  let target='';
  if(lang==='en'){const u=new URL('/owner-demo-suite.html',location.origin);u.searchParams.set('ownerDemo','en');u.searchParams.set('demoProduct',product);if(product!=='full')u.searchParams.set('start',product);u.searchParams.set('_external_demo',String(Date.now()));target=u.href}else{const path=product==='payments'?'/payments.html':product==='guests'?'/guests.html':'/app.html',u=new URL(path,location.origin);u.searchParams.set('ownerDemo','es');u.searchParams.set('demoProduct',product);u.searchParams.set('_external_demo',String(Date.now()));target=u.href}
  location.replace(target);
}catch(e){console.warn(e);fail('No hemos podido abrir esta demo. Vuelve a abrirla desde WSD Accesos.')}
})();
</script>
</body></html>
