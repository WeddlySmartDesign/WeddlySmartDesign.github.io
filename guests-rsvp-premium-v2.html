(()=>{

#wsdDesigns,#wsdTimelineEditor{background:#fff;border:1px solid #ddd5c8;border-radius:22px;padding:20px;margin:0 0 16px}.wsdHead b{font-size:19px}.wsdHead small{display:block;color:#706b65;margin-top:4px;line-height:1.4}.wsdGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}.wsdChoice{border:1px solid #ddd5c8;background:#fff;border-radius:14px;padding:8px;text-align:left}.wsdChoice.on{outline:2px solid #2c2a26}.wsdThumb{height:108px;border-radius:10px;position:relative;overflow:hidden;margin-bottom:8px}.wsdChoice b{font-size:13px}.wsdChoice span{display:block;color:#756f68;font-size:11px;margin-top:2px}.tEditorial{background:#f6f0e7;border:1px solid #9c876b}.tEditorial:before{content:'NOS CASAMOS';position:absolute;top:12px;left:0;right:0;text-align:center;font:700 7px 'DM Sans';letter-spacing:.25em;color:#76614b}.tEditorial:after{content:'D & S';position:absolute;inset:30px 14px 14px;border-top:1px solid #a28b6e;border-bottom:1px solid #a28b6e;display:grid;place-items:center;font:30px 'Bodoni Moda';color:#2f261f}.tJardin{background:#eef2e9}.tJardin:before{content:'Daniela & Sergio';position:absolute;inset:0;display:grid;place-items:center;font:italic 24px 'Cormorant Garamond';color:#435542}.tJardin:after{content:'';position:absolute;width:95px;height:95px;border:1px solid #83947b;border-radius:50%;right:-42px;top:-40px}.tNoche{background:#0d1113;border:1px solid #c8aa72}.tNoche:before{content:'D · S';position:absolute;inset:13px;border:1px solid #c8aa72;display:grid;place-items:center;font:26px 'Prata';color:#eddcb9}.tNoche:after{content:'BLACK TIE';position:absolute;top:7px;left:0;right:0;text-align:center;font:700 6px 'DM Sans';letter-spacing:.25em;color:#d2b47c}.tRomance{background:linear-gradient(#fffafd,#eddce5)}.tRomance:before{content:'Daniela & Sergio';position:absolute;inset:0;display:grid;place-items:center;font:italic 25px 'Cormorant Garamond';color:#714c5a}.tRomance:after{content:'';position:absolute;left:12px;right:12px;bott .wsdFact b{font:400 17px var(--display)}.wsdSchedule{padding:40px 24px;background:var(--paper2);color:var(--paperInk);text-align:center}.wsdSchedRows{max-width:620px;margin:auto;text-align:left}.wsdSchedRow{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--rule)}.wsdSchedRow time{font:400 31px var(--display)}.wsdSchedRow b{font:500 19px 'DM Sans'}.wsdInvitation[data-design='editorial']{--bg:#f7f0e6;--ink:#2b241e;--paper:#fffaf4;--paper2:#f4ede3;--paperInk:#2b241e;--accent:#9a8060;--muted:#7c7167;--rule:#d9cbbb;--display:'Bodoni Moda',serif;--pad:52px 38px;--nameMargin:auto 0 22px}.wsdInvitation[data-design='editorial'] .wsdCover:before{content:'';position:absolute;inset:24px;border:1px solid #9f8769}.wsdInvitation[data-design='editorial'] .wsdCover>*{position:relative;z-index:2}.wsdInvitation[data-design='editorial'] .wsdCover{display:flex;flex-direction:column}.wsdInvitation[data-design='editorial'] .wsdPhoto{width:58%;height:235px;margin-top:-85px;margin-right:30px}.wsdInvitation[data-design='jardin']{--bg:#edf1e8;--ink:#415341;--paper:#fafbf6;--paper2:#e7eee1;--paperInk:#415341;--accent:#73866f;--muted:#748071;--rule:#cbd4c6;--display:'Cormorant Garamond',serif;--pad:46px 30px 40px;--nameMargin:105px 0 18px}.wsdInvitation[data-design='jardin'] .wsdCover{border-radius:110px 20px 110px 20px}.wsdInvitation[data-design='jardin'] .wsdNames{font-style:italic;font-size:clamp(72px,16vw,108px)}.wsdInvitation[data-design='jardin'] .wsdCover:after{content:'';position:absolute;width:260px;height:260px;border:1px solid #7e9078;border-radius:50%;right:-100px;top:-80px;opacity:.55}.wsdInvitation[data-design='jardin'] .wsdPhoto{width:72%;height:320px;border-radius:180px 180px 18px 18px;margin-top:-65px}.wsdInvitation[data-design='jardin'] .wsdPhoto img{border-radius:170px 170px 10px 10px}.wsdInvitation[data-design='noche']{--bg:#0d1113;--ink:#f2e8d5;--paper:#101619;--paper2:#151d21;--paperInk:#f2e8d5;--accent:#d0ae72;--muted:#bfae92;--rule:#5d4f39;--display:'Prata',serif;--pad:58px 30px 42px;--nameMargin:auto 0 22px}.wsdInvitation[data-design='noche'] .wsdCover{display:flex;flex-direction:column;text-align:center;align-items:center}.wsdInvitation[data-design='noche'] .wsdCover:before{content:'';position:absolute;inset:22px;border:1px solid #d0ae72}.wsdInvitation[data-design='noche'] .wsdCover>*{position:relative;z-index:2}.wsdInvitation[data-design='noche'] .wsdEy,.wsdInvitation[data-design='noche'] .wsdMeta{color:#d8bd8c}.wsdInvitation[data-design='noche'] .wsdNames{font-size:clamp(56px,12vw,88px);line-height:1}.wsdInvitation[data-design='noche'] .wsdPhoto{width:88%;height:285px;background:#d5bf96;padding:8px;margin-top:-10px}.wsdInvitation[data-design='noche'] .wsdPhoto img{filter:grayscale(1) contrast(1.06)}.wsdInvitation[data-design='romance']{--bg:linear-gradient(180deg,#fffafd,#eddde5);--ink:#714b59;--paper:#fffafd;--paper2:#f6eaf0;--paperInk:#61434e;--accent:#a97c8d;--muted:#88737c;--rule:#ead5de;--display:'Cormorant Garamond',serif;--pad:54px 28px 42px;--nameMargin:auto 0 20px}.wsdInvitation[data-design='romance'] .wsdCover{text-align:center;display:flex;flex-direction:column;align-items:center;border-radius:34px}.wsdInvitation[data-design='romance'] .wsdCover:before{content:'';position:absolute;inset:28px 20px -140px;border:1px solid #b78fa0;border-radius:50% 50% 0 0;opacity:.55}.wsdInvitation[data-design='romance'] .wsdCover>*{position:relative;z-index:2}.wsdInvitation[data-design='romance'] .wsdNames{font-style:italic;font-size:clamp(70px,15vw,104px)}.wsdInvitation[data-design='romance'] .wsdPhoto{width:68%;height:300px;border-radius:50% 50% 24px 24px;margin-top:-70px}.wsdInvitation[data-design='romance'] .wsdPhoto img{border-radius:50% 50% 16px 16px}.wsdPublic .wrap{max-width:760px!important;padding-top:0!important}.wsdPublic #public>.brand{display:none!important}.wsdPublic #public>.card{box-shadow:none!important;border-radius:18px!important}.wsdPublic .back{display:none!important}@media(max-width:560px){.wsdGrid{grid-template-columns:1fr 1fr}.wsdCover{min-height:470px}.wsdFacts{grid-template-columns:1fr}.wsdFact{padding:12px 8px}.wsdSchedule{padding:34px 18px}.wsdSchedRow{grid-template-columns:90px 1fr}.wsdSchedRow time{font-size:27px}.wsdInvitation[data-design='editorial'] .wsdPhoto{width:64%;height:210px}.wsdInvitation[data-design='jardin'] .wsdPhoto{height:270px}.wsdInvitation[data-design='noche'] .wsdPhoto{height:235px}.wsdInvitation[data-design='romance'] .wsdPhoto{height:255px}.wsdNames{font-size:60px}}
`}
function d(){try{return core.contentDocument}catch{return null}}
function style(doc){let s=doc.getElementById('wsd-prem-v3');if(!s){s=doc.createElement('style');s.id='wsd-prem-v3';doc.head.appendChild(s)}s.textContent=css()}
function pickerHTML(){return `<section id="wsdDesigns"><div class="wsdHead"><b>Diseño de la invitación</b><small>Independiente del color de vuestra app. Estas son plantillas de invitación, no temas de la interfaz.</small></div><div class="wsdGrid">${Object.entries(designs).map(([id,x])=>`<button class="wsdChoice ${state.design===id?'on':''}" data-design="${id}"><div class="wsdThumb t${id[0].toUpperCase()+id.slice(1)}"></div><b>${x.label}</b><span>${x.sub}</span></button>`).join('')}</div></section>`}
function timelineHTML(){return `<section id="wsdTimelineEditor"><div class="wsdHead"><b>Agenda del día</b><small>Esto sí lo verán los invitados. Puedes cambiar horas, nombres y añadir o quitar momentos.</small></div><div class="wsdRows">${state.timeline.map((x,i)=>`<div class="wsdRow" data-i="${i}"><input class="wsdTime" value="${esc(x.time)}" placeholder="18:00"><input class="wsdLabel" value="${esc(x.label)}" placeholder="Ceremonia"><button class="wsdDel" type="button">×</button></div>`).join('')}</div><button id="wsdAddMoment" class="wsdAdd" type="button">+ Añadir momento</button></section>`}
function installAdmin(doc){if(PUBLIC)return;const pane=doc.getElementById('paneForm');if(!pane)return;let p=doc.getElementById('wsdDesigns');if(!p){let t=doc.createElement('div');t.innerHTML=pickerHTML();p=t.firstElementChild;const hero=pane.querySelector('.hero');hero?hero.after(p):pane.prepend(p)}p.querySelectorAll('[data-design]').forEach(b=>b.onclick=()=>{state.design=b.dataset.design;saveState();p.querySelectorAll('[data-design]').forEach(x=>x.classList.toggle('on',x===b))});let te=doc.getElementById('wsdTimelineEditor');if(!te){let t=doc.createElement('div');t.innerHTML=timelineHTML();te=t.firstElementChild;const card=pane.querySelector('.card');card?.insertBefore(te,card.querySelector('b')||card.firstChild)}const bind=()=>{te.querySelectorAll('.wsdRow').forEach(r=>{const i=+r.dataset.i;r.querySelector('.wsdTime').oninput=e=>{state.timeline[i].time=e.target.value;saveState()};r.querySelector('.wsdLabel').oninput=e=>{state.timeline[i].label=e.target.value;saveState()};r.querySelector('.wsdDel').onclick=()=>{state.timeline.splice(i,1);saveState();te.replaceWith((()=>{let t=doc.createElement('div');t.innerHTML=timelineHTML();return t.firstElementChild})());installAdmin(doc)}});const add=doc.getElementById('wsdAddMoment');if(add)add.onclick=()=>{state.timeline.push({time:'',label:'Nuevo momento'});saveState();te.replaceWith((()=>{let t=doc.createElement('div');t.innerHTML=timelineHTML();return t.firstElementChild})());installAdmin(doc)}};bind()}
function patchFetch(doc){const w=doc.defaultView;if(!w||w.__wsdPremFetch)return;w.__wsdPremFetch=true;const native=w.fetch.bind(w);w.fetch=async(input,init={})=>{const url=typeof input==='string'?input:input?.url||'';if(url.includes('/weddly-rsvp')&&init?.body){let body;try{body=JSON.parse(init.body)}catch{}if(body?.action==='config'){body.config={...(body.config||{}),weddlyDesign:state.design,timeline:state.timeline};init={...init,body:JSON.stringify(body)}}}const member=localStorage.getItem(TOKEN_KEY)||'';if(url.includes('/weddly-rsvp')&&member.length<20&&!PUBLIC){let action='';try{action=JSON.parse(init?.body||'{}')?.action||''}catch{}if(action==='claim'||action==='config')return new Response(JSON.stringify({ok:true}),{status:200,headers:{'content-type':'application/json'}});if(url.includes('manage=1'))return new Response(JSON.stringify({ok:true,forms:[{config:{weddlyDesign:state.design,timeline:state.timeline}}],submissions:[],contacts:[],delivery:[]}),{status:200,headers:{'content-type':'application/json'}})}return native(input,init)}}
function event(doc){const pub=doc.getElementById('public'),hero=pub?.querySelector('.hero');let intro='Nos encantará celebrar este día contigo.',time='18:00',venue=person.place||'Lugar de celebración';if(hero){intro=hero.querySelector('p')?.textContent?.trim()||intro;const c=[...hero.querySelectorAll('.where>div')];if(c[0])time=c[0].textContent.replace(/^Hora/i,'').trim()||time;if(c[1])venue=c[1].textContent.replace(/^Lugar/i,'').trim()||venue}return{pub,hero,intro,time,venue}}
function invitation(doc){const e=event(doc);if(!e.pub||getComputedStyle(e.pub).display==='none')return false;style(doc);doc.body.classList.add('wsdPublic');if(e.hero)e.hero.classList.add('wsdOriginalHero');doc.getElementById('wsdInvitation')?.remove();const el=doc.createElement('section');el.id='wsdInvitation';el.className='wsdInvitation';el.dataset.design=state.design;el.innerHTML=`<div class="wsdCover"><div class="wsdEy">Estáis invitados</div><h1 class="wsdNames">${esc(person.p1)} & ${esc(person.p2)}</h1><div class="wsdMeta">${esc(fmtDate())}${e.venue?' · '+esc(e.venue):''}</div>${days()?`<div class="wsdDays">${esc(days())}</div>`:''}</div>${person.photo?`<figure class="wsdPhoto"><img src="${person.photo}" alt=""></figure>`:''}<section class="wsdEvent"><div class="lab">Nuestra boda</div><h2>${esc(e.intro)}</h2><div class="wsdFacts"><div class="wsdFact"><small>Fecha</small><b>${esc(fmtDate())}</b></div><div class="wsdFact"><small>Hora</small><b>${esc(e.time)}</b></div><div class="wsdFact"><small>Lugar</small><b>${esc(e.venue)}</b></div></div></section><section class="wsdSchedule"><div class="lab">Así será el día</div><h2>Un día para disfrutarlo sin mirar el reloj.</h2><div class="wsdSchedRows">${state.timeline.filter(x=>x.time||x.label).map(x=>`<div class="wsdSchedRow"><time>${esc(x.time)}</time><b>${esc(x.label)}</b></div>`).join('')}</div></section>`;e.pub.insertBefore(el,e.pub.firstChild);return true}
function premiumLinks(doc){if(doc.documentElement.dataset.premLinks)return;doc.documentElement.dataset.premLinks='1';doc.addEventListener('click',ev=>{const copy=ev.target.closest?.('[data-copy]'),wa=ev.target.closest?.('[data-wa]'),prev=ev.target.closest?.('#preview');if(prev){setTimeout(()=>invitation(doc),160);return}if(copy){ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation?.();navigator.clipboard?.writeText(premiumLink(copy.dataset.copy));return}if(wa){const id=wa.dataset.wa;const rec=wa.closest('.recipient'),name=rec?.querySelector('b')?.textContent?.trim()||'';const raw=rec?.querySelector('.contactline')?.textContent?.trim()||'';let p=raw.replace(/\D/g,'');if(!raw.startsWith('+')&&p.length===9)p='34'+p;if(p.length<9)return;ev.preventDefault();ev.stopPropagation();ev.stopImmediatePropagation?.();location.href=`https://wa.me/${p}?text=${encodeURIComponent(`Hola ${name}, te enviamos la invitación de nuestra boda. Puedes confirmar aquí: ${premiumLink(id)}`)}`}},true)}
function patch(){const doc=d();if(!doc)return;style(doc);patchFetch(doc);if(!PUBLIC){doc.querySelector('.back')?.style.setProperty('display','none');installAdmin(doc)}premiumLinks(doc);if(PUBLIC)invitation(doc)}
core.addEventListener('load',()=>{patch();setTimeout(patch,120);setTimeout(patch,500);setTimeout(()=>{const doc=d();if(doc&&PUBLIC)invitation(doc)},900)});
(async()=>{if(PUBLIC){await Promise.all([remoteIdentity(),remoteConfig()]);saveState();setTimeout(()=>{const doc=d();if(doc)invitation(doc)},350)}})();
})();
</script>
