<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Pago GUEST · WeddlySmartDesign</title><style>:root{--ink:#433d3b;--paper:#f7eee5;--line:rgba(67,61,59,.14);--muted:#756963}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(100%,560px);background:#fff;border:1px solid var(--line);border-radius:24px;padding:26px}.brand{font-size:12px;letter-spacing:.11em;font-weight:850}.brand span{display:block;font:400 18px Georgia,serif;letter-spacing:0;margin-top:3px}h1{font:400 36px/1 Georgia,serif;margin:38px 0 12px}.lead{color:var(--muted);font-size:14px;line-height:1.6}.btn{display:none;margin-top:20px;background:var(--ink);color:#fff;text-decoration:none;border:0;border-radius:13px;padding:14px 17px;font-weight:850;text-align:center;width:100%;font-size:14px;cursor:pointer}.btn.on{display:block}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.status{margin-top:18px;border-top:1px solid var(--line);padding-top:14px;font-size:12px;color:var(--muted)}</style></head><body><main class="wrap"><section class="card"><div class="brand">GUEST <span>by WeddlySmartDesign</span></div><h1 id="title">Confirmando vuestro pago…</h1><p id="lead" class="lead">Estamos comprobando la compra con Stripe. No cierres esta página hasta que veas la confirmación.</p><a id="next" class="btn">Completar datos de la invitación →</a><button id="retry" class="btn secondary" type="button">Reintentar comprobación</button><div id="status" class="status">Comprobando…</div></section></main><script>
(()=>{'use strict';const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/guest-stripe-checkout',id=new URLSearchParams(location.search).get('session_id')||'',title=document.getElementById('title'),lead=document.getElementById('lead'),next=document.getElementById('next'),retry=document.getElementById('retry'),st=document.getElementById('status');async function api(){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'status',sessionId:id}),cache:'no-store'}),x=await r.json().catch(()=>({}));if(!r.ok||!x?.ok)throw 0;return x}async function check(n=0){retry.classList.remove('on');st.textContent='Comprobando…';if(!id){fail('No encontramos la referencia de esta compra.',false);return}try{const x=await api();if(x.paid&&x.provisioned){title.textContent='Pago confirmado.';lead.textContent=x.orderSubmittedAt?'Ya tenemos también los datos de vuestra invitación. Os enviaremos la entrega por email.':'Ahora solo necesitamos los datos para preparar vuestra invitación. A partir de ahí, el trabajo es nuestro.';st.textContent=(x.edition==='signature'?'GUEST Signature':'GUEST Essential')+' · pago recibido';if(!x.orderSubmittedAt){next.href='guest-order.html?session_id='+encodeURIComponent(id);next.classList.add('on')}else{next.textContent='Volver a GUEST';next.href='guest.html';next.classList.add('on')}return}if(n<4){st.textContent='Stripe está terminando de confirmar el pago…';setTimeout(()=>check(n+1),900);return}fail('El pago todavía no aparece confirmado. Si has recibido el cargo, no vuelvas a pagar: escríbenos y lo comprobamos.')}catch{if(n<3){setTimeout(()=>check(n+1),900);return}fail('No hemos podido comprobar el pago ahora. Si has recibido el cargo, no vuelvas a pagar.')} }function fail(t,canRetry=true){title.textContent='No hemos podido completar la comprobación.';lead.textContent=t;st.innerHTML='Soporte: <a href="mailto:weddlysmartdesign@gmail.com">weddlysmartdesign@gmail.com</a>';retry.classList.toggle('on',canRetry)}retry.onclick=()=>check(0);check();})();
</script></body></html>
