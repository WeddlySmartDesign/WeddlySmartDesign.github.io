<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pago recibido · GUEST</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2eee6;color:#282723;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.card{width:min(100%,560px);background:#fcfaf6;border:1px solid #ded8cd;border-radius:26px;padding:30px}.brand{color:#57604b}.brand b{display:block;font:500 32px Georgia,serif;letter-spacing:.05em}.brand span{display:block;font:500 15px Georgia,serif;margin-top:3px}h1{font:400 37px/1.05 Georgia,serif;margin:34px 0 12px}p{color:#746f66;line-height:1.6}.btn{display:inline-block;margin-top:12px;background:#282723;color:#fff;text-decoration:none;border-radius:999px;padding:14px 18px;font-weight:800}.state{margin-top:20px;padding:14px;border-radius:14px;background:#eee9df;font-size:13px;color:#6f6960}.err{background:#f5e5df;color:#884d40}</style></head><body><main class="card"><div class="brand"><b>GUEST</b><span>by WeddlySmartDesign</span></div><div id="content"><h1>Comprobando el pago…</h1><p>Estamos verificando que todo se haya registrado correctamente.</p><div class="state">No cierres esta página hasta que aparezca el siguiente paso.</div></div></main><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/guest-stripe-checkout',id=new URLSearchParams(location.search).get('session_id')||'',box=document.getElementById('content');async function run(){if(!id){fail();return}try{for(let n=0;n<8;n++){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'status',sessionId:id}),cache:'no-store'}),x=await r.json();if(r.ok&&x.ok&&x.paid){if(x.orderSubmittedAt){box.innerHTML='<h1>Todo recibido.</h1><p>Ya tenemos vuestro pago y los datos de personalización. Prepararemos la invitación dentro del plazo indicado.</p><a class="btn" href="guest.html">Volver a GUEST</a>';return}box.innerHTML='<h1>Pago recibido.</h1><p>Ya está. Ahora necesitamos los datos de vuestra boda para preparar la invitación.</p><a class="btn" href="guest-order.html?session_id='+encodeURIComponent(id)+'">Completar datos de la invitación</a><div class="state">También te hemos enviado este enlace por email.</div>';return}await new Promise(r=>setTimeout(r,1200))}fail()}catch{fail()}}function fail(){box.innerHTML='<h1>No podemos confirmar el pago todavía.</h1><p>No significa que se haya perdido. Revisa el email usado en Stripe o escríbenos y lo comprobamos.</p><a class="btn" href="mailto:weddlysmartdesign@gmail.com">Contactar con soporte</a><div class="state err">weddlysmartdesign@gmail.com</div>'}run()})();</script></body></html>
