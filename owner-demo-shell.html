<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FBF8F3">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<script>
(()=>{const q=new URLSearchParams(location.search),l=(q.get('lang')||'').toLowerCase(),p=(q.get('product')||'full').toLowerCase();if((l==='es'||l==='en')&&['full','payments','guests'].includes(p)){const x=document.createElement('link');x.rel='manifest';x.href=`/manifest-demo-${l}-${p}.webmanifest?v=1`;document.head.appendChild(x);document.documentElement.lang=l}})();
</script>
<title>Weddly Smart Design · Demo</title>
<style>
:root{--ink:#2C2A26;--sage:#596248;--paper:#FBF8F3;--muted:#756F65;--line:#E5DED2;--danger:#A84535}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#F2EFE9;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#demo{display:none;width:100%;height:100dvh;border:0;background:#F2EFE9}.boot{position:fixed;z-index:10;inset:0;display:grid;place-items:center;padding:26px;background:#F2EFE9;text-align:center}.card{width:min(100%,440px);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 30px rgba(44,42,38,.05)}.brand{font-family:Georgia,serif;color:var(--sage);font-size:31px;line-height:1}.brand span{display:block;font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;margin-top:8px;color:var(--muted)}#msg{margin-top:22px;color:var(--muted);font-size:14px;line-height:1.55}.actions{display:none;gap:9px;margin-top:18px}.actions.on{display:grid}.btn{border:0;border-radius:11px;padding:13px 15px;background:var(--ink);color:#fff;font-weight:750;font-size:14px;text-decoration:none;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}#install{display:none;position:fixed;z-index:30;right:12px;top:calc(12px + env(safe-area-inset-top));border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);padding:9px 12px;font-size:12px;font-weight:800;box-shadow:0 5px 18px #0002;cursor:pointer}.help{display:none;position:fixed;z-index:40;inset:0;background:#0007;place-items:center;padding:24px}.help.on{display:grid}.help .card{text-align:left}.help p{white-space:pre-line;color:var(--muted);line-height:1.55;font-size:14px;margin:12px 0 18px}
</style>
</head>
<body>
<button id="install" type="button">Guardar demo</button>
<div id="boot" class="boot"><section class="card"><div class="brand">Weddly<span>Smart Design</span></div><div id="msg">Recuperando vuestra demo…</div><div id="actions" class="actions"><button id="retry" class="btn" type="button">Reintentar</button><a id="back" class="btn secondary" href="/tester-admin.html">WSD Accesos</a></div></section></div>
<iframe id="demo" title="Weddly Smart Design · Demo"></iframe>
<div id="help" class="help"><section class="card"><strong id="helpTitle">Guardar esta demo</strong><p id="helpText"></p><button id="helpClose" class="btn" type="button">OK</button></section></div>
<script src="/access-cookie-bridge-v1.js?v=1"></script>
<script>
(()=>{
const q=new URLSearchParams(location.search),lang=(q.get('lang')||'').toLowerCase(),product=(q.get('product')||'full').toLowerCase();
const okLang=lang==='es'||lang==='en',okProduct=['full','payments','guests'].includes(product);
const PAY_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/wedding-sync',GUEST_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-guests-state',PLAN_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-planning-state';
const TOKEN='weddly_shared_wedding_token',MODE='weddly_owner_demo_mode',GBASE='weddly_guests_qa_v67',GTRACK='weddly_guests_local_mode_v1';
const $=id=>document.getElementById(id),msg=$('msg'),boot=$('boot'),frame=$('demo'),actions=$('actions'),install=$('install');let promptEvent=null,loading=false;
const C={es:{loading:'Recuperando vuestra demo…',offline:'Sin conexión. Abriendo la copia guardada en este dispositivo…',broken:'La demo no se ha podido recuperar. No voy a abrir una copia vacía.',retry:'Reintentar',back:'WSD Accesos',install:'Guardar demo',saved:'Demo guardada',helpTitle:'Guardar esta demo',menu:'Abre el menú del navegador y elige «Instalar app» o «Añadir a pantalla de inicio».',standalone:'Esta ventana ya se ha abierto como app. Para guardar esta demo como una copia independiente, ábrela desde WSD Accesos en una pestaña del navegador.',ios:'En iPhone: Compartir ↑ → «Añadir a pantalla de inicio».'},en:{loading:'Restoring your demo…',offline:'Offline. Opening the saved copy on this device…',broken:'The demo could not be restored. An empty copy will not be opened.',retry:'Retry',back:'WSD Access',install:'Save demo',saved:'Demo saved',helpTitle:'Save this demo',menu:'Open the browser menu and choose “Install app” or “Add to Home Screen”.',standalone:'This window is already running as an app. To save this demo as a separate copy, open it from WSD Access in a browser tab.',ios:'On iPhone: Share ↑ → “Add to Home Screen”.'}};
const t=k=>(C[lang]||C.es)[k];
$('retry').textContent=t('retry');$('back').textContent=t('back');install.textContent=t('install');$('helpTitle').textContent=t('helpTitle');
function setMsg(x){msg.textContent=x}
function demoKey(){return 'weddly_owner_demo_token_'+lang}
function payKey(){return 'weddly_pro_v7_owner_demo_'+lang}
function planKey(){return 'weddly_planning_v2_owner_demo_'+lang}
function guestSnap(){return GBASE+'_snapshot_demo_'+lang}
function jsonGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}}
function hasLocal(){const p=jsonGet(payKey()),g=jsonGet(guestSnap())||jsonGet(GBASE),pl=jsonGet(planKey()),pay=!!(p&&(Array.isArray(p.providers)||p.settings)),guests=!!(g&&(Object.keys(g.guests||{}).length||Object.keys(g.tables||{}).length)),planning=!!(pl&&(pl.state||pl.tasks||pl.events));return product==='payments'?pay:product==='guests'?guests:(pay&&guests&&planning)}
async function get(url,token){const c=new AbortController(),tm=setTimeout(()=>c.abort(),9000);try{const r=await fetch(url,{headers:{'x-weddly-token':token,'x-weddly-demo':lang},cache:'no-store',signal:c.signal}),x=await r.json().catch(()=>({}));if(!r.ok||!x?.ok)throw new Error(String(x?.error||r.status));return x}finally{clearTimeout(tm)}}
function cachePayments(x,token){const data={version:9,settings:{...(x.settings||{}),lang},providers:Array.isArray(x.providers)?x.providers:[],diy:Array.isArray(x.diy)?x.diy:[],contributions:Array.isArray(x.contributions)?x.contributions:[]};localStorage.setItem(payKey(),JSON.stringify(data));localStorage.setItem('weddly_sync_base_v20_owner_demo_'+lang,JSON.stringify({token,version:Number(x.version||0),data:{settings:data.settings,providers:data.providers,diy:data.diy,contributions:data.contributions}}))}
function cacheGuests(x){if(!x.state)return;const raw=JSON.stringify(x.state),current='demo_'+lang,previous=localStorage.getItem(GTRACK)||'real',base=localStorage.getItem(GBASE);if(previous!==current&&base!==null)localStorage.setItem(GBASE+'_snapshot_'+previous,base);localStorage.setItem(guestSnap(),raw);localStorage.setItem(GBASE,raw);localStorage.setItem(GTRACK,current)}
function cachePlanning(x){if(!x.state)return;localStorage.setItem(planKey(),JSON.stringify({state:x.state,version:Number(x.version||0),dirty:false}))}
function target(){const stamp=Date.now();if(lang==='en'){const u=new URL('/owner-demo-suite.html',location.origin);u.searchParams.set('ownerDemo','en');u.searchParams.set('demoProduct',product);if(product!=='full')u.searchParams.set('start',product);u.searchParams.set('_demo_boot',String(stamp));return u.href}const path=product==='payments'?'/payments.html':product==='guests'?'/guests.html':'/app.html',u=new URL(path,location.origin);u.searchParams.set('ownerDemo','es');u.searchParams.set('demoProduct',product);u.searchParams.set('_demo_boot',String(stamp));return u.href}
function openDemo(){frame.style.display='block';frame.src=target();frame.addEventListener('load',()=>{setTimeout(()=>{boot.style.display='none'},120)}, {once:true})}
async function start(){if(loading)return;loading=true;actions.classList.remove('on');setMsg(t('loading'));if(!okLang||!okProduct){setMsg(t('broken'));actions.classList.add('on');loading=false;return}let token='';try{token=localStorage.getItem(demoKey())||''}catch{}if(token.length<40){setMsg(t('broken'));actions.classList.add('on');loading=false;return}try{if(window.__WSD_ACCESS_BRIDGE?.remember)window.__WSD_ACCESS_BRIDGE.remember(token);else localStorage.setItem(TOKEN,token);localStorage.setItem(MODE,lang);localStorage.setItem('weddly_access_lang',lang);const [p,g,pl]=await Promise.all([get(PAY_API,token),get(GUEST_API,token),get(PLAN_API,token)]);cachePayments(p,token);cacheGuests(g);cachePlanning(pl);openDemo()}catch(e){console.warn('WSD demo bootstrap',e);if(hasLocal()){setMsg(t('offline'));setTimeout(openDemo,450)}else{setMsg(t('broken'));actions.classList.add('on')}}finally{loading=false}}
function isStandalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent||'')||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1)}
function showHelp(text){$('helpText').textContent=text;$('help').classList.add('on')}
async function installDemo(){if(isStandalone()){showHelp(t('standalone'));return}if(isIOS()){showHelp(t('ios'));return}if(promptEvent){const p=promptEvent;promptEvent=null;try{await p.prompt();await p.userChoice}catch{}return}showHelp(t('menu'))}
install.onclick=installDemo;$('helpClose').onclick=()=>$('help').classList.remove('on');$('help').onclick=e=>{if(e.target===$('help'))$('help').classList.remove('on')};$('retry').onclick=start;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;if(!isStandalone())install.style.display='block'});addEventListener('appinstalled',()=>{promptEvent=null;install.style.display='none'});
if(!isStandalone())install.style.display='block';
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js?v=69').catch(()=>{});
start();
})();
</script>
</body></html>
