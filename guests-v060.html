<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests QA</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1ea;color:#2c2a26;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:620px;margin:auto;padding:24px}.brand{font-size:12px;letter-spacing:.1em;text-transform:uppercase}h1{font:500 54px Georgia,serif;margin:18px 0 34px}h2{font-size:34px;margin:18px 0}.card{background:#fff;border:1px solid #ddd5c8;border-radius:20px;padding:22px;margin:16px 0}.alert{border-left:5px solid #a9744d}.small{font-size:14px;color:#706b65;line-height:1.45}.gueststats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid #ddd5c8;border-radius:20px;padding:20px}.num{font-size:40px;font-weight:650}.sectiontag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#77716b}.attentionHead{display:flex;justify-content:space-between;align-items:center}.badge{background:#eee6da;border-radius:999px;padding:7px 11px;font-weight:700}.btn{border:0;border-radius:13px;padding:13px 16px;background:#2c2a26;color:#fff;font-weight:700;font-size:15px}.soft{background:#eee8df;color:#2c2a26}.mini{padding:9px 12px}.row,.impact{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.row:last-child,.impact:last-child{border:0}.status{font-size:13px;color:#526b4d;font-weight:700}.view{display:none;padding-bottom:92px}.view.on{display:block}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd5c8;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:12px 2px;font-size:16px;font-weight:650}.nav button.on{background:#eee8df;border-radius:13px}.sheet{display:none;position:fixed;z-index:40;inset:0;background:#0005;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:620px;margin:auto;background:#fff;border-radius:25px 25px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto}.choice{display:block;width:100%;text-align:left;border:1px solid #ddd5c8;background:#fff;border-radius:14px;padding:15px;margin:7px 0;font-size:17px}.choice.sel{outline:2px solid #2c2a26}.actions{display:flex;gap:10px;margin-top:18px}.actions>*{flex:1}.table{padding:0;overflow:hidden}.thead{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;background:#faf8f4;border-bottom:1px solid #eee}.seat{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #eee}.field{width:100%;padding:14px;border:1px solid #ccc5bb;border-radius:13px;font-size:17px;margin:6px 0 13px}.tools{display:flex;gap:8px}.tools>*{flex:1}</style></head><body><main class="wrap"><div class="brand">Weddly Smart Design · Guests</div><h1>Daniela & Sergio</h1><section id="hoy" class="view on"></section><section id="invitados" class="view"></section><section id="mesas" class="view"></section><section id="listados" class="view"></section></main><nav class="nav"><button class="on" onclick="go('hoy',0)">Hoy</button><button onclick="go('invitados',1)">Invitados</button><button onclick="go('mesas',2)">Mesas</button><button onclick="go('listados',3)">Listados</button></nav><div id="sheet" class="sheet"><div id="panel" class="panel"></div></div><script>
const KEY='weddly_guests_qa_v66';const initial={guests:{paula:{name:'Paula Martín',rsvp:'confirmed',meal:'',table:'Mesa 2',transport:true},david:{name:'David Martín',rsvp:'confirmed',meal:'Estándar',table:'Mesa 2',transport:true},leo:{name:'Leo Martín',rsvp:'confirmed',meal:'Infantil',table:'Mesa 2',transport:true},irene:{name:'Irene López',rsvp:'pending',meal:'',table:'',transport:true},ruben:{name:'Rubén',rsvp:'confirmed',meal:'Estándar',table:'Mesa 4',transport:true},ana:{name:'Ana',rsvp:'confirmed',meal:'Estándar',table:'Mesa 4',transport:false},luis:{name:'Luis',rsvp:'confirmed',meal:'Estándar',table:'Mesa 3',transport:true},marta:{name:'Marta',rsvp:'pending',meal:'Estándar',table:'',transport:true}},tables:{t2:{name:'Mesa 2',cap:4},t3:{name:'Mesa 3',cap:8},t4:{name:'Mesa 4',cap:4}},sent:null,preparedV:1,sentV:1,activity:null,activityRead:false};let S;try{S=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){S=structuredClone(initial)}const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),G=()=>Object.entries(S.guests),active=g=>g.rsvp==='confirmed'||g.rsvp==='pending',confirmed=g=>g.rsvp==='confirmed',T=()=>Object.entries(S.tables),occ=n=>G().filter(([,g])=>active(g)&&g.table===n).length,transportCount=()=>G().filter(([,g])=>active(g)&&g.transport).length;function snap(){let x={};G().forEach(([id,g])=>x[id]=g.table||'');return x}if(!S.sent){S.sent=snap();save()}function seatDiff(){let d={};G().forEach(([id,g])=>{if((g.table||'')!==(S.sent[id]||''))d[id]=[S.sent[id]||'Sin mesa',g.table||'Sin mesa']});return d}function mealIssues(){return G().filter(([,g])=>confirmed(g)&&!g.meal)}function over(){return T().filter(([,t])=>occ(t.name)>t.cap)}function issues(){return mealIssues().length+(Object.keys(seatDiff()).length?1:0)+(over().length?1:0)}function record(title,detail,impacts){S.activity={title,detail,impacts,at:Date.now()};S.activityRead=false;save()}
function render(){renderHoy();renderGuests();renderTables();renderLists()}
function renderHoy(){let cards='';mealIssues().forEach(([id,g])=>cards+=`<div class="card alert"><b>${g.name} necesita menú</b><p class="small">Falta elegir su menú.</p><button class="btn" onclick="menuSheet('${id}')">Resolver</button></div>`);if(over().length){const [,t]=over()[0];cards+=`<div class="card alert"><b>${t.name} supera su capacidad</b><p class="small">${occ(t.name)} personas para ${t.cap} plazas.</p><button class="btn soft" onclick="go('mesas',2)">Resolver</button></div>`}else if(Object.keys(seatDiff()).length){const d=seatDiff(),id=Object.keys(d)[0];cards+=`<div class="card alert"><b>Mesas enviadas ya no coinciden</b><p class="small">${S.guests[id].name} · ${d[id][0]} → ${d[id][1]}</p><button class="btn soft" onclick="go('listados',3)">Revisar listado</button></div>`}const att=issues();let change='';if(S.activity&&!S.activityRead){change=`<div class="card"><div class="sectiontag">Último cambio</div><h3>${S.activity.title}</h3><p class="small">${S.activity.detail}</p>${S.activity.impacts?.length?`<div class="sectiontag" style="margin-top:18px">Actualizado automáticamente</div>${S.activity.impacts.map(i=>`<div class="impact"><div><b>${i.label}</b><div class="small">${i.detail}</div></div><span class="status">Actualizado</span></div>`).join('')}`:''}<button class="btn soft" style="margin-top:16px" onclick="markRead()">Marcar como leído</button></div>`}hoy.innerHTML=`<div class="gueststats"><div class="stat"><div class="num">${G().filter(([,g])=>g.rsvp==='confirmed').length}</div><div>Confirmados</div></div><div class="stat"><div class="num">${G().filter(([,g])=>g.rsvp==='pending').length}</div><div>Pendientes</div></div></div><div class="attentionHead" style="margin-top:28px"><div class="sectiontag">Necesita tu atención</div><span class="badge">${att}</span></div>${cards||`<div class="card"><b>Todo al día</b></div>`}${change}`}
function markRead(){S.activityRead=true;save();render()}
function renderGuests(){invitados.innerHTML=`<h2>Invitados</h2><div class="card">${G().map(([id,g])=>`<div class="row"><div><b>${g.name}</b><div class="small">${g.rsvp==='confirmed'?'Confirmado':g.rsvp==='pending'?'Pendiente':'No asiste'} · ${g.meal||'Menú pendiente'} · ${g.table||'Sin mesa'} · Transporte ${g.transport?'Sí':'No'}</div></div><button class="btn soft mini" onclick="editGuest('${id}')">Editar</button></div>`).join('')}</div>`}
function editGuest(id){const g=S.guests[id];openSheet(`<div class="sectiontag">${g.name}</div><h2>Editar invitado</h2><button class="choice" onclick="menuSheet('${id}')">Menú · ${g.meal||'Pendiente'}</button><button class="choice" onclick="moveSheet('${id}')">Mesa · ${g.table||'Sin mesa'}</button><button class="choice" onclick="transportSheet('${id}')">Transporte · ${g.transport?'Sí':'No'}</button><button class="choice" onclick="rsvpSheet('${id}')">RSVP · ${g.rsvp==='confirmed'?'Confirmado':g.rsvp==='pending'?'Pendiente':'No asiste'}</button><div class="actions"><button class="btn soft" onclick="closeSheet()">Cerrar</button></div>`)}
function openSheet(x){panel.innerHTML=x;sheet.classList.add('on')}function closeSheet(){sheet.classList.remove('on')}function choose(b,v){window.choice=v;b.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function menuSheet(id){const g=S.guests[id];window.choice=g.meal;openSheet(`<div class="sectiontag">${g.name}</div><h2>Elegir menú</h2>${['Estándar','Vegetariano','Celíaco','Sin lactosa','Vegano','Infantil','Alérgico'].map(x=>`<button class="choice ${g.meal===x?'sel':''}" onclick="choose(this,'${x}')">${x}</button>`).join('')}<div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveMeal('${id}')">Guardar</button></div>`)}function saveMeal(id){if(!window.choice)return;const g=S.guests[id],old=g.meal||'Pendiente';g.meal=window.choice;record(`${g.name} · menú actualizado`,`${old} → ${g.meal}`,[{label:'Catering',detail:'Recuento de menús recalculado'}]);closeSheet();render()}
function transportSheet(id){const g=S.guests[id];window.choice=g.transport?'yes':'no';openSheet(`<div class="sectiontag">${g.name}</div><h2>Transporte</h2>${[['yes','Sí, usa transporte'],['no','No usa transporte']].map(([v,l])=>`<button class="choice ${window.choice===v?'sel':''}" onclick="choose(this,'${v}')">${l}</button>`).join('')}<div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveTransport('${id}')">Guardar</button></div>`)}function saveTransport(id){const g=S.guests[id],old=g.transport,before=transportCount();g.transport=window.choice==='yes';const after=transportCount();if(old!==g.transport)record(`${g.name} · transporte actualizado`,g.transport?'Ahora usa transporte':'Ya no usa transporte',[{label:'Transporte',detail:`${before} → ${after} plazas usadas`}]);closeSheet();save();render()}
function rsvpSheet(id){const g=S.guests[id];window.choice=g.rsvp;openSheet(`<div class="sectiontag">${g.name}</div><h2>RSVP</h2>${[['confirmed','Confirmado'],['pending','Pendiente'],['declined','No asiste']].map(([v,l])=>`<button class="choice ${g.rsvp===v?'sel':''}" onclick="choose(this,'${v}')">${l}</button>`).join('')}<div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveRsvp('${id}')">Guardar</button></div>`)}function saveRsvp(id){const g=S.guests[id],old=g.rsvp;if(!window.choice)return;const beforeT=transportCount(),beforeTable=g.table?occ(g.table):0;g.rsvp=window.choice;const impacts=[];if(g.table)impacts.push({label:g.table,detail:`${beforeTable} → ${occ(g.table)} ocupados`});const afterT=transportCount();if(beforeT!==afterT)impacts.push({label:'Transporte',detail:`${beforeT} → ${afterT} plazas usadas`});if(old!==g.rsvp)impacts.push({label:'Catering',detail:g.rsvp==='declined'?`${g.name} eliminado del recuento`:'Recuento revisado'});record(`${g.name} · RSVP actualizado`,`${labelRsvp(old)} → ${labelRsvp(g.rsvp)}`,impacts);closeSheet();save();render()}function labelRsvp(v){return v==='confirmed'?'Confirmado':v==='pending'?'Pendiente':'No asiste'}
function moveSheet(id){const g=S.guests[id];window.choice=g.table;openSheet(`<div class="sectiontag">${g.name}</div><h2>${g.table?'Mover de mesa':'Asignar mesa'}</h2><p class="small">${g.table?'Ahora está en '+g.table+'.':''}</p>${T().map(([,t])=>`<button class="choice ${g.table===t.name?'sel':''}" onclick="choose(this,'${t.name}')"><b>${t.name}</b><br><span class="small">${occ(t.name)} de ${t.cap} plazas</span></button>`).join('')}<div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveSeat('${id}')">Guardar</button></div>`)}function saveSeat(id){if(!window.choice)return;const g=S.guests[id],old=g.table||'Sin mesa',oldOcc=g.table?occ(g.table):0,newName=window.choice,newBefore=occ(newName);g.table=newName;const impacts=[];if(old!=='Sin mesa')impacts.push({label:old,detail:`${oldOcc} → ${occ(old)} ocupados`});impacts.push({label:newName,detail:`${newBefore} → ${occ(newName)} ocupados`});impacts.push({label:'Listado de mesas',detail:'Marcado para actualizar'});record(`${g.name} cambia de mesa`,`${old} → ${newName}`,impacts);closeSheet();save();render()}
function renderTables(){const u=G().filter(([,g])=>active(g)&&!g.table);mesas.innerHTML=`<h2>Seating plan</h2><div class="tools"><button class="btn soft" onclick="newTable()">+ Añadir mesa</button><button class="btn soft" onclick="downloadCatering()">Listado catering</button></div>${T().map(([id,t])=>{const p=G().filter(([,g])=>active(g)&&g.table===t.name);return `<div class="card table"><div class="thead"><div><b>${t.name}</b><div class="small">${p.length} de ${t.cap} plazas</div></div><button class="btn soft mini" onclick="editTable('${id}')">Editar</button></div>${p.map(([gid,g])=>`<div class="seat"><div><b>${g.name}</b><div class="small">${labelRsvp(g.rsvp)}</div></div><button class="btn soft mini" onclick="moveSheet('${gid}')">Mover</button></div>`).join('')||`<div class="seat"><span class="small">Sin invitados</span></div>`}</div>`}).join('')}${u.length?`<div class="card"><b>Sin mesa</b>${u.map(([id,g])=>`<div class="row"><span>${g.name}</span><button class="btn soft mini" onclick="moveSheet('${id}')">Asignar</button></div>`).join('')}</div>`:''}`}
function newTable(){openSheet(`<div class="sectiontag">Boda principal</div><h2>Añadir mesa</h2><input id="tn" class="field" placeholder="Nombre de mesa"><input id="tc" class="field" type="number" min="1" inputmode="numeric" placeholder="Capacidad"><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveNewTable()">Añadir</button></div>`)}function saveNewTable(){const n=tn.value.trim(),c=+tc.value;if(!n||c<1)return alert('Indica nombre y capacidad.');S.tables['t'+Date.now()]={name:n,cap:c};record(`${n} creada`,`${c} plazas`,[{label:'Seating plan',detail:'Capacidad total recalculada'}]);closeSheet();save();render()}
function editTable(id){const t=S.tables[id];openSheet(`<div class="sectiontag">Boda principal</div><h2>Editar mesa</h2><input id="tn" class="field" value="${t.name}"><input id="tc" class="field" type="number" min="1" inputmode="numeric" value="${t.cap}"><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveTable('${id}')">Guardar</button></div><button class="choice" onclick="deleteTable('${id}')">Eliminar mesa</button>`)}function saveTable(id){const t=S.tables[id],oldName=t.name,oldCap=t.cap,n=tn.value.trim(),c=+tc.value;if(!n||c<1)return;G().forEach(([,g])=>{if(g.table===oldName)g.table=n});t.name=n;t.cap=c;record(`${oldName} actualizada`,`${oldCap} → ${c} plazas`,[{label:'Seating plan',detail:'Aforo recalculado'},{label:'Listado de mesas',detail:'Marcado para actualizar'}]);closeSheet();save();render()}function deleteTable(id){const t=S.tables[id];if(!confirm('¿Eliminar '+t.name+'? Sus invitados quedarán sin mesa.'))return;G().forEach(([,g])=>{if(g.table===t.name)g.table=''});delete S.tables[id];record(`${t.name} eliminada`,'Los invitados asignados han quedado sin mesa',[{label:'Seating plan',detail:'Distribución recalculada'},{label:'Listado de mesas',detail:'Marcado para actualizar'}]);closeSheet();save();render()}
function renderLists(){const d=seatDiff(),o=Object.keys(d).length;listados.innerHTML=`<h2>Listados</h2><div class="card ${o?'alert':''}"><b>Mesas · Boda principal</b><p class="small">Preparada V${S.preparedV} · Enviada V${S.sentV}${!o?' · Todo actualizado':''}</p>${Object.entries(d).map(([id,x])=>`<p class="small">${S.guests[id].name}: ${x[0]} → ${x[1]}</p>`).join('')}${o?`<button class="btn" onclick="prepareSeating()">Preparar nueva versión</button>`:''}${S.preparedV>S.sentV?` <button class="btn soft" onclick="confirmSent()">Confirmar envío V${S.preparedV}</button>`:''}</div><div class="card"><b>Catering · Boda principal</b><p class="small">Mesa · nombre · menú, con resumen por mesa y total.</p><button class="btn soft" onclick="downloadCatering()">Descargar catering</button></div>`}
function prepareSeating(){S.preparedV++;save();render()}function confirmSent(){S.sentV=S.preparedV;S.sent=snap();save();render()}
function downloadCatering(){const rows=[['MESA','NOMBRE','MENÚ']];T().forEach(([,t])=>{const p=G().filter(([,g])=>confirmed(g)&&g.table===t.name).map(([,g])=>g);const counts={};p.forEach(g=>{const m=g.meal||'PENDIENTE';counts[m]=(counts[m]||0)+1;rows.push([t.name,g.name,m])});rows.push([`${t.name} - RESUMEN`,`${p.length} personas`,Object.entries(counts).map(([k,v])=>`${v} ${k}`).join(' · ')]);rows.push(['','',''])});const all={};G().filter(([,g])=>confirmed(g)).forEach(([,g])=>{const m=g.meal||'PENDIENTE';all[m]=(all[m]||0)+1});rows.push(['TOTAL','',Object.entries(all).map(([k,v])=>`${v} ${k}`).join(' · ')]);const esc=s=>'"'+String(s).replaceAll('"','""')+'"',csv='\ufeffsep=;\r\n'+rows.map(r=>r.map(esc).join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Catering_Boda_principal.csv';a.click();URL.revokeObjectURL(u)}
function go(id,n){document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('on',i===n));render()}render();</script></body></html>
