<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests QA</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f1ea;color:#2c2a26;margin:0}.wrap{max-width:620px;margin:auto;padding:24px}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase}h1{font:500 54px Georgia,serif;margin:18px 0 36px}h2{font-size:34px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card{background:#fff;border:1px solid #ddd5c8;border-radius:20px}.stat{padding:18px 12px}.n{font-size:38px;font-weight:650}.card{padding:22px;margin:16px 0}.alert{border-left:5px solid #9b6846}.bad{border-color:#b97465;background:#fff9f7}.tableCard{padding:0;overflow:hidden}.tableHead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;background:#faf8f4;border-bottom:1px solid #eee}.tableHead h3{margin:0 0 4px;font-size:20px}.pill{font-size:13px;padding:6px 9px;border-radius:999px;background:#eee8df;white-space:nowrap}.pill.full{background:#eee3d7}.pill.over{background:#f5ded9;color:#823d32}.seatRow,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #eee}.seatRow:last-child,.row:last-child{border:0}.person{min-width:0}.person b{display:block}.small{font-size:14px;color:#6d6862;line-height:1.45}.btn{border:0;border-radius:13px;padding:13px 16px;background:#2c2a26;color:white;font-weight:700;font-size:15px}.mini{padding:9px 12px}.soft{background:#eee8df;color:#2c2a26}.view{display:none;padding-bottom:92px}.view.on{display:block}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:white;border-top:1px solid #ddd5c8;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:12px 2px;font-size:16px;font-weight:650}.nav button.on{background:#eee8df;border-radius:13px}.sheet{display:none;position:fixed;z-index:40;inset:0;background:#0005;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:620px;margin:auto;background:white;border-radius:25px 25px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}.choice{display:block;width:100%;text-align:left;border:1px solid #ddd5c8;background:white;border-radius:14px;padding:15px;margin:7px 0;font-size:17px}.choice.sel{outline:2px solid #2c2a26}.choice.warn{border-color:#b97465}.actions{display:flex;gap:10px;margin-top:18px}.actions>*{flex:1}.ok{color:#526b4d;font-weight:700}.sectionNote{margin:-8px 0 18px}.empty{padding:18px 20px;color:#6d6862}.eventbar{display:flex;gap:8px;margin:0 0 16px}.eventchip{border:0;background:#2c2a26;color:white;border-radius:999px;padding:9px 13px;font-weight:700}.summaryline{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 14px}.summaryline span{font-size:14px}.summaryline b{font-size:18px}</style></head><body><main class="wrap"><div class="tag">Weddly Smart Design · Guests</div><h1>Daniela & Sergio</h1><section id="hoy" class="view on"></section><section id="invitados" class="view"></section><section id="mesas" class="view"></section><section id="listados" class="view"></section></main><nav class="nav"><button class="on" onclick="go('hoy',0)">Hoy</button><button onclick="go('invitados',1)">Invitados</button><button onclick="go('mesas',2)">Mesas</button><button onclick="go('listados',3)">Listados</button></nav><div class="sheet" id="sheet"><div class="panel" id="panel"></div></div><script>
const S={event:'main',events:{main:{name:'Boda principal',seating:true}},guests:{paula:{name:'Paula Martín',rsvp:'confirmed',meal:'',seating:{main:'Mesa 2'},role:'adult'},david:{name:'David Martín',rsvp:'confirmed',meal:'Estándar',seating:{main:'Mesa 2'},role:'adult'},leo:{name:'Leo Martín',rsvp:'confirmed',meal:'Infantil',seating:{main:'Mesa 2'},role:'child',age:7},irene:{name:'Irene López',rsvp:'pending',meal:'',seating:{main:''},role:'adult'},ruben:{name:'Rubén',rsvp:'confirmed',meal:'Estándar',seating:{main:'Mesa 4'},role:'adult'},ana:{name:'Ana',rsvp:'confirmed',meal:'Estándar',seating:{main:'Mesa 4'},role:'adult'},luis:{name:'Luis',rsvp:'confirmed',meal:'Estándar',seating:{main:'Mesa 3'},role:'adult'},marta:{name:'Marta',rsvp:'pending',meal:'Estándar',seating:{main:''},role:'adult'}},tables:{main:{t2:{name:'Mesa 2',capacity:4},t3:{name:'Mesa 3',capacity:8},t4:{name:'Mesa 4',capacity:4}}},outputs:{seating:{main:{preparedV:2,sentV:1,prepared:{ruben:'Mesa 3'},sent:{ruben:'Mesa 3'}}},catering:{preparedV:1,sentV:1}},activity:'La lista externa añadió 1 persona y actualizó 2 datos seguros.'};
const G=()=>Object.entries(S.guests),active=g=>['confirmed','pending'].includes(g.rsvp),seat=(g,e=S.event)=>g.seating?.[e]||'',T=(e=S.event)=>S.tables[e]||{},occ=(name,e=S.event)=>G().filter(([,g])=>active(g)&&seat(g,e)===name).length,free=(t,e=S.event)=>t.capacity-occ(t.name,e),unseated=(e=S.event)=>G().filter(([,g])=>active(g)&&!seat(g,e)),mealIssue=()=>!S.guests.paula.meal;
function seatSnapshot(e='main'){const x={};G().forEach(([id,g])=>{if(active(g)&&seat(g,e))x[id]=seat(g,e)});return x}function seatChanges(e='main'){const b=S.outputs.seating[e].sent,d={};G().forEach(([id,g])=>{if(seat(g,e)!==(b[id]||''))d[id]=[b[id]||'Sin mesa',seat(g,e)||'Sin mesa']});return d}function seatStale(e='main'){return Object.keys(seatChanges(e)).length>0}function overTables(e='main'){return Object.values(T(e)).filter(t=>free(t,e)<0)}function nowCount(){return Number(mealIssue())+Number(seatStale())+Number(overTables().length>0)}
function render(){renderHoy();renderGuests();renderTables();renderLists()}
function renderHoy(){let a='';if(mealIssue())a+=`<div class="card alert"><b>Paula necesita menú</b><p class="small">Catering cierra mañana. Falta elegir su menú.</p><button class="btn" onclick="menuSheet()">Resolver</button></div>`;if(overTables().length){const t=overTables()[0];a+=`<div class="card alert"><b>${t.name} supera su capacidad</b><p class="small">${occ(t.name)} personas para ${t.capacity} plazas.</p><button class="btn soft" onclick="go('mesas',2)">Resolver en Mesas</button></div>`}else if(seatStale()){const c=seatChanges(),id=Object.keys(c)[0];a+=`<div class="card alert"><b>Mesas enviadas ya no coinciden</b><p class="small">${S.guests[id].name} · Mesa: ${c[id][0]} → ${c[id][1]}</p><button class="btn soft" onclick="go('listados',3)">Revisar listado</button></div>`}if(!a)a=`<div class="card"><b class="ok">Todo al día</b><p class="small">No hay ninguna acción que necesite tu atención ahora.</p></div>`;hoy.innerHTML=`<div class="stats"><div class="stat"><div class="n">${G().filter(([,g])=>g.rsvp==='confirmed').length}</div><div class="small">Confirmados</div></div><div class="stat"><div class="n">${G().filter(([,g])=>g.rsvp==='pending').length}</div><div class="small">Pendientes</div></div><div class="stat"><div class="n">${nowCount()}</div><div class="small">Ahora</div></div></div>${a}<div class="card"><b>Acaba de cambiar</b><p class="small">${S.activity}</p></div>`}
function renderGuests(){invitados.innerHTML=`<h2>Invitados</h2><div class="card">${G().map(([id,g])=>`<div class="row"><div><b>${g.name}</b><div class="small">${g.role==='child'?`Niño · ${g.age} años · `:''}${g.rsvp==='confirmed'?'Confirmado':g.rsvp==='pending'?'Pendiente':'No asiste'} · ${g.meal||'Menú pendiente'} · ${seat(g)||'Sin mesa'}</div></div><button class="btn soft mini" onclick="editGuest('${id}')">Editar</button></div>`).join('')}</div>`}
function tableCard(id,t){const people=G().filter(([,g])=>active(g)&&seat(g)===t.name),o=people.length,f=t.capacity-o,state=f<0?`Exceso ${Math.abs(f)}`:f===0?'Llena':`${f} libre${f===1?'':'s'}`,cls=f<0?'over':f===0?'full':'';return `<div class="card tableCard ${f<0?'bad':''}"><div class="tableHead"><div><h3>${t.name}</h3><div class="small">${o} de ${t.capacity} plazas</div></div><span class="pill ${cls}">${state}</span></div>${people.length?people.map(([gid,g])=>`<div class="seatRow"><div class="person"><b>${g.name}</b><span class="small">${g.rsvp==='pending'?'Pendiente de RSVP':g.role==='child'?`Niño · ${g.age} años`:'Confirmado'}</span></div><button class="btn soft mini" onclick="moveSheet('${gid}')">Mover</button></div>`).join(''):`<div class="empty">Sin invitados asignados</div>`}</div>`}
function renderTables(){const e=S.event,cap=Object.values(T(e)).reduce((a,t)=>a+t.capacity,0),assigned=G().filter(([,g])=>active(g)&&seat(g,e)).length,u=unseated(e);mesas.innerHTML=`<h2>Seating plan</h2><div class="eventbar"><button class="eventchip">${S.events[e].name}</button></div><div class="summaryline"><span><b>${assigned}</b><br>con mesa</span><span><b>${u.length}</b><br>sin mesa</span><span><b>${cap-assigned}</b><br>plazas libres</span></div><p class="small sectionNote">Aquí está la distribución real. Puedes mover a cualquier persona directamente entre mesas.</p>${Object.entries(T(e)).map(([id,t])=>tableCard(id,t)).join('')}${u.length?`<div class="card"><b>Sin mesa</b>${u.map(([id,g])=>`<div class="row"><div><b>${g.name}</b><div class="small">${g.rsvp==='pending'?'Pendiente de RSVP':'Confirmado'}</div></div><button class="btn soft mini" onclick="moveSheet('${id}')">Asignar</button></div>`).join('')}</div>`:`<div class="card"><b class="ok">Todos los invitados activos tienen mesa</b></div>`}`}
function renderLists(){const c=seatChanges(),lines=Object.entries(c).map(([id,x])=>`<p class="small">${S.guests[id].name} · Mesa: ${x[0]} → ${x[1]}</p>`).join(''),o=S.outputs.seating.main;listados.innerHTML=`<h2>Listados</h2><div class="card ${seatStale()?'alert':''}"><b>Mesas · Boda principal</b><p class="small">Preparada V${o.preparedV} · Enviada V${o.sentV}${!seatStale()?' · Todo actualizado':''}</p>${lines}${seatStale()?`<button class="btn" onclick="prepareSeating()">Preparar y descargar nueva versión</button>`:''}${o.preparedV>o.sentV?` <button class="btn soft" onclick="confirmSent()">Confirmar que envié V${o.preparedV}</button>`:''}</div><div class="card"><b>Catering · Boda principal</b><p class="small">Preparada V1 · Enviada V1${mealIssue()?' · Hay cambios pendientes':' · Todo actualizado'}</p></div>`}
function go(id,n){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('on',i===n));render()}function openSheet(body){panel.innerHTML=body;sheet.classList.add('on')}function closeSheet(){sheet.classList.remove('on')}function choose(b,v){window.choice=v;b.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function menuSheet(){window.choice=S.guests.paula.meal;openSheet(`<div class="tag">Paula Martín</div><h2>¿Qué menú necesita?</h2><div id="choices">${['Estándar','Vegetariano','Celíaco','Sin lactosa','Vegano','Infantil','Alérgico'].map(x=>`<button class="choice ${x===window.choice?'sel':''}" onclick="choose(this,'${x}')">${x}</button>`).join('')}</div><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveMeal()">Guardar</button></div>`)}function saveMeal(){if(!window.choice)return;const old=S.guests.paula.meal||'Pendiente';S.guests.paula.meal=window.choice;S.activity=`Paula Martín · Menú: ${old} → ${window.choice}. Catering recalculado.`;closeSheet();render()}
function editGuest(id){const g=S.guests[id];openSheet(`<div class="tag">${g.name}</div><h2>Editar invitado</h2><p class="small">Menú: ${g.meal||'Pendiente'}<br>Mesa: ${seat(g)||'Sin mesa'}</p>${id==='paula'?`<button class="choice" onclick="closeSheet();menuSheet()">Cambiar menú</button>`:''}<button class="choice" onclick="closeSheet();moveSheet('${id}')">${seat(g)?'Cambiar mesa':'Asignar mesa'}</button><div class="actions"><button class="btn soft" onclick="closeSheet()">Cerrar</button></div>`)}
function moveSheet(id){const g=S.guests[id],current=seat(g);window.choice=current;openSheet(`<div class="tag">${g.name} · ${S.events[S.event].name}</div><h2>${current?'Mover de mesa':'Asignar mesa'}</h2><p class="small">${current?`Ahora está en ${current}.`:''}${g.rsvp==='pending'?' Está pendiente de RSVP y seguirá contando en ocupación.':''}</p><div id="choices">${Object.values(T()).map(t=>{const o=occ(t.name),will=current===t.name?o:o+1,over=will>t.capacity;return `<button class="choice ${current===t.name?'sel':''} ${over?'warn':''}" onclick="choose(this,'${t.name}')"><b>${t.name}</b><br><span class="small">${o} / ${t.capacity} ahora${over?' · quedaría en exceso':''}</span></button>`}).join('')}</div><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveSeat('${id}')">Guardar</button></div>`)}function saveSeat(id){if(!window.choice)return;const g=S.guests[id],old=seat(g)||'Sin mesa';g.seating[S.event]=window.choice;S.activity=`${g.name} · Mesa: ${old} → ${window.choice}. Seating plan y listado recalculados.`;closeSheet();render()}
function prepareSeating(){const o=S.outputs.seating.main;o.preparedV++;o.prepared=seatSnapshot();const rows=['Mesa,Capacidad,Nombre,RSVP',...Object.values(T()).flatMap(t=>{const ps=G().filter(([,g])=>active(g)&&seat(g)===t.name).map(([,g])=>g);return ps.length?ps.map(g=>`${t.name},${t.capacity},${g.name},${g.rsvp}`):[`${t.name},${t.capacity},,`]})];const blob=new Blob([rows.join('\n')],{type:'text/csv'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`Mesas_Boda_principal_V${o.preparedV}.csv`;a.click();URL.revokeObjectURL(u);S.activity=`Mesas · V${o.preparedV} preparada y descargada. Aún no está marcada como enviada.`;render()}function confirmSent(){const o=S.outputs.seating.main;o.sentV=o.preparedV;o.sent=JSON.parse(JSON.stringify(o.prepared));S.activity=`Mesas · V${o.sentV} marcada como enviada. El listado vuelve a estar al día.`;render()}
render();</script></body></html>
