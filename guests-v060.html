<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests QA</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1ea;color:#2c2a26;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:620px;margin:auto;padding:24px}.brand{font-size:12px;letter-spacing:.1em;text-transform:uppercase}h1{font:500 54px Georgia,serif;margin:18px 0 34px}h2{font-size:34px;margin:18px 0}.card{background:#fff;border:1px solid #ddd5c8;border-radius:20px;padding:22px;margin:16px 0}.alert{border-left:5px solid #a9744d}.small{font-size:14px;color:#706b65;line-height:1.45}.gueststats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid #ddd5c8;border-radius:20px;padding:20px}.num{font-size:40px;font-weight:650}.sectiontag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#77716b}.attentionHead{display:flex;justify-content:space-between;align-items:center}.badge{background:#eee6da;border-radius:999px;padding:7px 11px;font-weight:700}.btn{border:0;border-radius:13px;padding:13px 16px;background:#2c2a26;color:#fff;font-weight:700;font-size:15px}.soft{background:#eee8df;color:#2c2a26}.mini{padding:9px 12px}.row,.impact{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.row:last-child,.impact:last-child{border:0}.done{background:#e8efe6;color:#526b4d;border-radius:999px;padding:6px 10px;font-weight:700;font-size:13px}.view{display:none;padding-bottom:92px}.view.on{display:block}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd5c8;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:12px 2px;font-size:16px;font-weight:650}.nav button.on{background:#eee8df;border-radius:13px}.sheet{display:none;position:fixed;z-index:40;inset:0;background:#0005;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:620px;margin:auto;background:#fff;border-radius:25px 25px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto}.choice{display:block;width:100%;text-align:left;border:1px solid #ddd5c8;background:#fff;border-radius:14px;padding:15px;margin:7px 0;font-size:17px}.choice.sel{outline:2px solid #2c2a26}.actions{display:flex;gap:10px;margin-top:18px}.actions>*{flex:1}.table{padding:0;overflow:hidden}.thead{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;background:#faf8f4;border-bottom:1px solid #eee}.seat{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #eee}.field{width:100%;padding:14px;border:1px solid #ccc5bb;border-radius:13px;font-size:17px;margin:6px 0 13px}.tools{display:flex;gap:8px}.tools>*{flex:1}</style></head><body><main class="wrap"><div class="brand">Weddly Smart Design · Guests</div><h1>Daniela & Sergio</h1><section id="hoy" class="view on"></section><section id="invitados" class="view"></section><section id="mesas" class="view"></section><section id="listados" class="view"></section></main><nav class="nav"><button class="on" onclick="go('hoy',0)">Hoy</button><button onclick="go('invitados',1)">Invitados</button><button onclick="go('mesas',2)">Mesas</button><button onclick="go('listados',3)">Listados</button></nav><div id="sheet" class="sheet"><div id="panel" class="panel"></div></div><script>
const KEY='weddly_guests_qa_v65';const initial={guests:{paula:{name:'Paula Martín',rsvp:'confirmed',meal:'',table:'Mesa 2',transport:true},david:{name:'David Martín',rsvp:'confirmed',meal:'Estándar',table:'Mesa 2',transport:true},leo:{name:'Leo Martín',rsvp:'confirmed',meal:'Infantil',table:'Mesa 2',transport:true},irene:{name:'Irene López',rsvp:'pending',meal:'',table:'',transport:true},ruben:{name:'Rubén',rsvp:'confirmed',meal:'Estándar',table:'Mesa 4',transport:true},ana:{name:'Ana',rsvp:'confirmed',meal:'Estándar',table:'Mesa 4',transport:false},luis:{name:'Luis',rsvp:'confirmed',meal:'Estándar',table:'Mesa 3',transport:true},marta:{name:'Marta',rsvp:'pending',meal:'Estándar',table:'',transport:true}},tables:{t2:{name:'Mesa 2',cap:4},t3:{name:'Mesa 3',cap:8},t4:{name:'Mesa 4',cap:4}},sent:null,preparedV:1,sentV:1,changes:[],activity:null};let S;try{S=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial)}catch(e){S=structuredClone(initial)}const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),G=()=>Object.entries(S.guests),active=g=>g.rsvp==='confirmed'||g.rsvp==='pending',confirmed=g=>g.rsvp==='confirmed',T=()=>Object.entries(S.tables),occ=n=>G().filter(([,g])=>active(g)&&g.table===n).length,transportCount=()=>G().filter(([,g])=>active(g)&&g.transport).length;function snap(){let x={};G().forEach(([id,g])=>x[id]=g.table||'');return x}if(!S.sent){S.sent=snap();save()}function seatDiff(){let d={};G().forEach(([id,g])=>{if((g.table||'')!==(S.sent[id]||''))d[id]=[S.sent[id]||'Sin mesa',g.table||'Sin mesa']});return d}function mealIssues(){return G().filter(([,g])=>confirmed(g)&&!g.meal)}function over(){return T().filter(([,t])=>occ(t.name)>t.cap)}function issues(){return mealIssues().length+(Object.keys(seatDiff()).length?1:0)+(over().length?1:0)}function record(title,detail,impacts){S.activity={title,detail,impacts,at:Date.now()};save()}
function render(){home();guests();tables();lists()}function home(){let att='';mealIssues().forEach(([id,g])=>att+=`<div class="card alert"><b>${g.name} necesita menú</b><p class="small">Falta elegir su menú.</p><button class="btn" onclick="meal('${id}')">Resolver</button></div>`);if(over().length){let t=over()[0][1];att+=`<div class="card alert"><b>${t.name} supera su capacidad</b><p class="small">${occ(t.name)} personas para ${t.cap} plazas.</p><button class="btn soft" onclick="go('mesas',2)">Resolver</button></div>`}else if(Object.keys(seatDiff()).length){let d=seatDiff(),id=Object.keys(d)[0];att+=`<div class="card alert"><b>Mesas enviadas ya no coinciden</b><p class="small">${S.guests[id].name} · ${d[id][0]} → ${d[id][1]}</p><button class="btn soft" onclick="go('listados',3)">Revisar listado</button></div>`}let act=S.activity?`<div class="card"><div class="sectiontag">Último cambio</div><h3>${S.activity.title}</h3><p class="small">${S.activity.detail}</p>${S.activity.impacts?.length?`<div class="sectiontag" style="margin-top:18px">Actualizado automáticamente</div>${S.activity.impacts.map(x=>`<div class="impact"><div><b>${x[0]}</b><div class="small">${x[1]}</div></div><span class="done">Hecho</span></div>`).join('')}`:''}</div>`:'';hoy.innerHTML=`<div class="gueststats"><div class="stat"><div class="num">${G().filter(([,g])=>g.rsvp==='confirmed').length}</div><div>Confirmados</div></div><div class="stat"><div class="num">${G().filter(([,g])=>g.rsvp==='pending').length}</div><div>Pendientes</div></div></div><div class="attentionHead" style="margin-top:28px"><div class="sectiontag">Necesita tu atención</div><span class="badge">${issues()}</span></div>${att||'<div class="card"><b>Todo al día</b><p class="small">No hay acciones pendientes.</p></div>'}${act}`}
function guests(){invitados.innerHTML=`<h2>Invitados</h2><div class="card">${G().map(([id,g])=>`<div class="row"><div><b>${g.name}</b><div class="small">${g.rsvp==='confirmed'?'Confirmado':'Pendiente'} · ${g.meal||'Menú pendiente'} · ${g.table||'Sin mesa'} · ${g.transport?'Transporte':'Sin transporte'}</div></div><button class="btn soft mini" onclick="guestSheet('${id}')">Editar</button></div>`).join('')}</div>`}function tables(){let u=G().filter(([,g])=>active(g)&&!g.table);mesas.innerHTML=`<h2>Seating plan</h2><div class="tools"><button class="btn soft" onclick="newTable()">+ Mesa</button><button class="btn soft" onclick="catering()">Catering</button></div>${T().map(([id,t])=>`<div class="card table"><div class="thead"><div><b>${t.name}</b><div class="small">${occ(t.name)} de ${t.cap} plazas</div></div><button class="btn soft mini" onclick="editTable('${id}')">Editar</button></div>${G().filter(([,g])=>active(g)&&g.table===t.name).map(([gid,g])=>`<div class="seat"><div><b>${g.name}</b><div class="small">${g.rsvp==='pending'?'Pendiente RSVP':'Confirmado'}</div></div><button class="btn soft mini" onclick="move('${gid}')">Mover</button></div>`).join('')}</div>`).join('')}${u.length?`<div class="card"><b>Sin mesa</b>${u.map(([id,g])=>`<div class="row"><span>${g.name}</span><button class="btn soft mini" onclick="move('${id}')">Asignar</button></div>`).join('')}</div>`:''}`}
function lists(){let d=seatDiff();listados.innerHTML=`<h2>Listados</h2><div class="card ${Object.keys(d).length?'alert':''}"><b>Mesas · Boda principal</b><p class="small">Preparada V${S.preparedV} · Enviada V${S.sentV}</p>${Object.entries(d).map(([id,x])=>`<p class="small">${S.guests[id].name} · ${x[0]} → ${x[1]}</p>`).join('')}${Object.keys(d).length?'<button class="btn" onclick="prepare()">Preparar nueva versión</button>':'<p class="small">Todo actualizado.</p>'}</div><div class="card"><b>Catering · Boda principal</b><p class="small">Nombre, mesa y menú + recuentos por mesa y total.</p><button class="btn soft" onclick="catering()">Descargar catering</button></div><div class="card"><b>Transporte</b><p class="small">${transportCount()} invitados activos con transporte.</p></div>`}
function go(id,n){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('on',i===n));render()}function open(x){panel.innerHTML=x;sheet.classList.add('on')}function closeS(){sheet.classList.remove('on')}function pick(b,v){window.choice=v;b.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function move(id){let g=S.guests[id];window.choice=g.table;open(`<div class="sectiontag">${g.name}</div><h2>${g.table?'Mover de mesa':'Asignar mesa'}</h2><p class="small">${g.table?'Ahora está en '+g.table+'.':''}</p>${T().map(([,t])=>`<button class="choice ${g.table===t.name?'sel':''}" onclick="pick(this,'${t.name}')"><b>${t.name}</b><br><span class="small">${occ(t.name)} de ${t.cap} plazas</span></button>`).join('')}<div class="actions"><button class="btn soft" onclick="closeS()">Cancelar</button><button class="btn" onclick="saveMove('${id}')">Guardar</button></div>`)}function saveMove(id){if(!window.choice)return;let g=S.guests[id],old=g.table||'Sin mesa',oldOcc=old==='Sin mesa'?null:occ(old),newName=window.choice,newOcc=occ(newName);g.table=newName;let impacts=[];if(old!=='Sin mesa'&&old!==newName)impacts.push([old,`${oldOcc} → ${oldOcc-1} ocupados`]);if(old!==newName)impacts.push([newName,`${newOcc} → ${newOcc+1} ocupados`]);record(`${g.name} cambia de mesa`,`${old} → ${newName}`,[...impacts,['Listado de mesas','Marcado para actualizar']]);closeS();render()}
function meal(id){let g=S.guests[id];window.choice=g.meal;open(`<div class="sectiontag">${g.name}</div><h2>Menú</h2>${['Estándar','Vegetariano','Celíaco','Sin lactosa','Vegano','Infantil','Alérgico'].map(x=>`<button class="choice" onclick="pick(this,'${x}')">${x}</button>`).join('')}<div class="actions"><button class="btn soft" onclick="closeS()">Cancelar</button><button class="btn" onclick="saveMeal('${id}')">Guardar</button></div>`)}function saveMeal(id){if(!window.choice)return;let g=S.guests[id],old=g.meal||'Pendiente';g.meal=window.choice;record(`${g.name} · menú actualizado`,`${old} → ${g.meal}`,[['Catering','Recuento recalculado']]);closeS();render()}
function guestSheet(id){let g=S.guests[id];open(`<div class="sectiontag">${g.name}</div><h2>Editar invitado</h2><button class="choice" onclick="closeS();meal('${id}')">Menú · ${g.meal||'Pendiente'}</button><button class="choice" onclick="closeS();move('${id}')">Mesa · ${g.table||'Sin mesa'}</button><button class="choice" onclick="toggleTransport('${id}')">Transporte · ${g.transport?'Sí':'No'}</button><button class="choice" onclick="toggleRSVP('${id}')">RSVP · ${g.rsvp==='confirmed'?'Confirmado':'Pendiente'}</button><div class="actions"><button class="btn soft" onclick="closeS()">Cerrar</button></div>`)}function toggleTransport(id){let g=S.guests[id],before=transportCount();g.transport=!g.transport;let after=transportCount();record(`${g.name} · transporte actualizado`,g.transport?'Ahora usa transporte':'Ya no usa transporte',[['Transporte',`${before} → ${after} plazas usadas`]]);closeS();render()}function toggleRSVP(id){let g=S.guests[id],old=g.rsvp,beforeT=transportCount(),beforeTable=g.table?occ(g.table):0;g.rsvp=old==='confirmed'?'pending':'confirmed';let impacts=[];if(g.table)impacts.push([g.table,`${beforeTable} ocupados · sin cambio provisional`]);if(g.transport)impacts.push(['Transporte',`${beforeT} plazas · sin cambio provisional`]);impacts.push(['Catering',g.rsvp==='confirmed'?'Incluido en recuento final':'Sale del recuento final hasta confirmar']);record(`${g.name} · RSVP actualizado`,`${old==='confirmed'?'Confirmado':'Pendiente'} → ${g.rsvp==='confirmed'?'Confirmado':'Pendiente'}`,impacts);closeS();render()}
function newTable(){open(`<h2>Añadir mesa</h2><input id="tn" class="field" placeholder="Nombre"><input id="tc" class="field" type="number" min="1" placeholder="Capacidad"><div class="actions"><button class="btn soft" onclick="closeS()">Cancelar</button><button class="btn" onclick="saveNew()">Añadir</button></div>`)}function saveNew(){let n=tn.value.trim(),c=+tc.value;if(!n||c<1)return;S.tables['t'+Date.now()]={name:n,cap:c};record(`${n} creada`,`${c} plazas`,[['Seating plan','Capacidad total recalculada']]);closeS();render()}function editTable(id){let t=S.tables[id];open(`<h2>Editar ${t.name}</h2><input id="tn" class="field" value="${t.name}"><input id="tc" class="field" type="number" min="1" value="${t.cap}"><div class="actions"><button class="btn soft" onclick="closeS()">Cancelar</button><button class="btn" onclick="saveTable('${id}')">Guardar</button></div>`)}function saveTable(id){let t=S.tables[id],oldN=t.name,oldC=t.cap,n=tn.value.trim(),c=+tc.value;if(!n||c<1)return;G().forEach(([,g])=>{if(g.table===oldN)g.table=n});t.name=n;t.cap=c;record(`${oldN} actualizada`,`${oldN!==n?oldN+' → '+n+' · ':''}${oldC} → ${c} plazas`,[['Seating plan','Ocupación y capacidad recalculadas'],['Listado de mesas','Marcado para actualizar']]);closeS();render()}
function prepare(){S.preparedV++;S.sentV=S.preparedV;S.sent=snap();record(`Mesas · V${S.sentV} actualizada`,'La versión enviada coincide con el seating actual.',[['Listado de mesas','Todo actualizado']]);render()}function csvDownload(rows,name){let text='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');let b=new Blob([text],{type:'text/csv;charset=utf-8;'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function catering(){let rows=[['MESA','NOMBRE','MENÚ']];let total={};T().forEach(([,t])=>{let ps=G().filter(([,g])=>confirmed(g)&&g.table===t.name);let counts={};ps.forEach(([,g])=>{let m=g.meal||'PENDIENTE';rows.push([t.name,g.name,m]);counts[m]=(counts[m]||0)+1;total[m]=(total[m]||0)+1});if(ps.length)rows.push([`${t.name} - RESUMEN`,`${ps.length} personas`,Object.entries(counts).map(([k,v])=>`${v} ${k}`).join(' · ')]);rows.push(['','',''])});rows.push(['TOTAL','',Object.entries(total).map(([k,v])=>`${v} ${k}`).join(' · ')]);csvDownload(rows,'Catering_Boda_principal.csv')}
render();</script></body></html>
