<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests QA</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f1ea;color:#2c2a26;margin:0}.wrap{max-width:620px;margin:auto;padding:24px}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase}h1{font:500 54px Georgia,serif;margin:18px 0 36px}h2{font-size:34px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card{background:#fff;border:1px solid #ddd5c8;border-radius:20px}.stat{padding:18px 12px}.n{font-size:38px;font-weight:650}.card{padding:22px;margin:16px 0}.alert{border-left:5px solid #9b6846}.bad{border-color:#b97465}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.small{font-size:14px;color:#6d6862;line-height:1.45}.btn{border:0;border-radius:13px;padding:13px 16px;background:#2c2a26;color:white;font-weight:700;font-size:15px}.soft{background:#eee8df;color:#2c2a26}.mini{padding:9px 12px}.view{display:none;padding-bottom:92px}.view.on{display:block}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:white;border-top:1px solid #ddd5c8;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:12px 2px;font-size:16px;font-weight:650}.nav button.on{background:#eee8df;border-radius:13px}.sheet{display:none;position:fixed;z-index:40;inset:0;background:#0005;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:620px;margin:auto;background:white;border-radius:25px 25px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto}.choice{display:block;width:100%;text-align:left;border:1px solid #ddd5c8;background:white;border-radius:14px;padding:15px;margin:7px 0;font-size:17px}.choice.sel{outline:2px solid #2c2a26}.choice.warn{border-color:#b97465}.actions{display:flex;gap:10px;margin-top:18px}.actions>*{flex:1}.ok{color:#526b4d;font-weight:700}.tableCard{padding:0;overflow:hidden}.tableHead{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;background:#faf8f4;border-bottom:1px solid #eee}.tableHead h3{margin:0 0 4px;font-size:20px}.seatRow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #eee}.pill{font-size:13px;padding:6px 9px;border-radius:999px;background:#eee8df;white-space:nowrap}.pill.over{background:#f5ded9;color:#823d32}.summary{display:flex;gap:20px;margin:10px 0 20px}.summary b{font-size:20px}.event{display:inline-block;background:#2c2a26;color:white;border-radius:999px;padding:9px 13px;font-weight:700;margin-bottom:16px}.tools{display:flex;gap:8px;margin-bottom:18px}.tools button{flex:1}.field{width:100%;border:1px solid #ccc5bb;border-radius:13px;padding:14px;font-size:17px;margin:5px 0 13px;background:#fff;color:#2c2a26}.danger{color:#8a4035;background:#f6e8e4}.empty{padding:18px 20px;color:#6d6862}</style></head><body><main class="wrap"><div class="tag">Weddly Smart Design · Guests</div><h1>Daniela & Sergio</h1><section id="hoy" class="view on"></section><section id="invitados" class="view"></section><section id="mesas" class="view"></section><section id="listados" class="view"></section></main><nav class="nav"><button class="on" onclick="go('hoy',0)">Hoy</button><button onclick="go('invitados',1)">Invitados</button><button onclick="go('mesas',2)">Mesas</button><button onclick="go('listados',3)">Listados</button></nav><div class="sheet" id="sheet"><div class="panel" id="panel"></div></div><script>
const S={event:'main',guests:{paula:{name:'Paula Martín',rsvp:'confirmed',meal:'',seating:{main:'Mesa 2'}},david:{name:'David Martín',rsvp:'confirmed',meal:'Estándar',seating:{main:'Mesa 2'}},leo:{name:'Leo Martín',rsvp:'confirmed',meal:'Infantil',seating:{main:'Mesa 2'},child:7},irene:{name:'Irene López',rsvp:'pending',meal:'',seating:{main:''}},ruben:{name:'Rubén',rsvp:'confirmed',meal:'Estándar',seating:{main:'Mesa 4'}},ana:{name:'Ana',rsvp:'confirmed',meal:'Estándar',seating:{main:'Mesa 4'}},luis:{name:'Luis',rsvp:'confirmed',meal:'Estándar',seating:{main:'Mesa 3'}},marta:{name:'Marta',rsvp:'pending',meal:'Estándar',seating:{main:''}}},tables:{main:{t2:{name:'Mesa 2',capacity:4},t3:{name:'Mesa 3',capacity:8},t4:{name:'Mesa 4',capacity:4}}},outputs:{seating:{preparedV:1,sentV:1,sent:null},catering:{preparedV:1,sentV:1}},activity:'Todo listo para revisar.'};
const G=()=>Object.entries(S.guests),active=g=>g.rsvp==='confirmed'||g.rsvp==='pending',seat=g=>g.seating.main||'',T=()=>S.tables.main,occ=t=>G().filter(([,g])=>active(g)&&seat(g)===t.name).length,free=t=>t.capacity-occ(t),snapshot=()=>{let x={};G().forEach(([id,g])=>{if(active(g)&&seat(g))x[id]=seat(g)});return x};S.outputs.seating.sent=snapshot();
function changes(){let d={},b=S.outputs.seating.sent;G().forEach(([id,g])=>{if(seat(g)!==(b[id]||''))d[id]=[b[id]||'Sin mesa',seat(g)||'Sin mesa']});return d}function stale(){return Object.keys(changes()).length>0}function over(){return Object.values(T()).filter(t=>free(t)<0)}function mealIssue(){return !S.guests.paula.meal}function render(){renderHoy();renderGuests();renderTables();renderLists()}
function renderHoy(){let a='';if(mealIssue())a+=`<div class="card alert"><b>Paula necesita menú</b><p class="small">Falta elegir su menú.</p><button class="btn" onclick="menuSheet()">Resolver</button></div>`;if(over().length){let t=over()[0];a+=`<div class="card alert"><b>${t.name} supera su capacidad</b><p class="small">${occ(t)} personas para ${t.capacity} plazas.</p><button class="btn soft" onclick="go('mesas',2)">Resolver</button></div>`}else if(stale()){let c=changes(),id=Object.keys(c)[0];a+=`<div class="card alert"><b>Mesas enviadas ya no coinciden</b><p class="small">${S.guests[id].name} · ${c[id][0]} → ${c[id][1]}</p><button class="btn soft" onclick="go('listados',3)">Revisar listado</button></div>`}if(!a)a=`<div class="card"><b class="ok">Todo al día</b></div>`;hoy.innerHTML=`<div class="stats"><div class="stat"><div class="n">${G().filter(([,g])=>g.rsvp==='confirmed').length}</div><div class="small">Confirmados</div></div><div class="stat"><div class="n">${G().filter(([,g])=>g.rsvp==='pending').length}</div><div class="small">Pendientes</div></div><div class="stat"><div class="n">${Number(mealIssue())+Number(stale())+Number(over().length>0)}</div><div class="small">Ahora</div></div></div>${a}<div class="card"><b>Acaba de cambiar</b><p class="small">${S.activity}</p></div>`}
function renderGuests(){invitados.innerHTML=`<h2>Invitados</h2><div class="card">${G().map(([id,g])=>`<div class="row"><div><b>${g.name}</b><div class="small">${g.rsvp==='confirmed'?'Confirmado':'Pendiente'} · ${g.meal||'Menú pendiente'} · ${seat(g)||'Sin mesa'}</div></div><button class="btn soft mini" onclick="moveSheet('${id}')">Mesa</button></div>`).join('')}</div>`}
function tableCard(id,t){let p=G().filter(([,g])=>active(g)&&seat(g)===t.name),f=free(t);return `<div class="card tableCard ${f<0?'bad':''}"><div class="tableHead"><div><h3>${t.name}</h3><div class="small">${p.length} de ${t.capacity} plazas</div></div><div><span class="pill ${f<0?'over':''}">${f<0?'Exceso '+Math.abs(f):f===0?'Llena':f+' libre'+(f===1?'':'s')}</span><br><button class="btn soft mini" style="margin-top:8px" onclick="editTable('${id}')">Editar</button></div></div>${p.length?p.map(([gid,g])=>`<div class="seatRow"><div><b>${g.name}</b><div class="small">${g.rsvp==='pending'?'Pendiente de RSVP':g.child?'Niño · '+g.child+' años':'Confirmado'}</div></div><button class="btn soft mini" onclick="moveSheet('${gid}')">Mover</button></div>`).join(''):`<div class="empty">Sin invitados asignados</div>`}</div>`}
function renderTables(){let cap=Object.values(T()).reduce((a,t)=>a+t.capacity,0),assigned=G().filter(([,g])=>active(g)&&seat(g)).length,u=G().filter(([,g])=>active(g)&&!seat(g));mesas.innerHTML=`<h2>Seating plan</h2><span class="event">Boda principal</span><div class="summary"><span><b>${assigned}</b><br><span class="small">con mesa</span></span><span><b>${u.length}</b><br><span class="small">sin mesa</span></span><span><b>${cap-assigned}</b><br><span class="small">plazas libres</span></span></div><div class="tools"><button class="btn soft" onclick="newTable()">+ Añadir mesa</button><button class="btn soft" onclick="downloadCatering()">Listado catering</button></div>${Object.entries(T()).map(([id,t])=>tableCard(id,t)).join('')}${u.length?`<div class="card"><b>Sin mesa</b>${u.map(([id,g])=>`<div class="row"><div><b>${g.name}</b><div class="small">${g.rsvp==='pending'?'Pendiente de RSVP':'Confirmado'}</div></div><button class="btn soft mini" onclick="moveSheet('${id}')">Asignar</button></div>`).join('')}</div>`:`<div class="card"><b class="ok">Todos los invitados activos tienen mesa</b></div>`}`}
function renderLists(){let c=changes(),lines=Object.entries(c).map(([id,x])=>`<p class="small">${S.guests[id].name} · Mesa: ${x[0]} → ${x[1]}</p>`).join(''),o=S.outputs.seating;listados.innerHTML=`<h2>Listados</h2><div class="card ${stale()?'alert':''}"><b>Mesas · Boda principal</b><p class="small">Preparada V${o.preparedV} · Enviada V${o.sentV}${!stale()?' · Todo actualizado':''}</p>${lines}${stale()?`<button class="btn" onclick="prepareSeating()">Preparar nueva versión</button>`:''}${o.preparedV>o.sentV?` <button class="btn soft" onclick="confirmSent()">Confirmar envío V${o.preparedV}</button>`:''}</div><div class="card"><b>Catering · Boda principal</b><p class="small">Listado por mesa con nombre y menú + recuento por mesa y total.</p><button class="btn soft" onclick="downloadCatering()">Descargar catering</button></div>`}
function go(id,n){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('on',i===n));render()}function openSheet(x){panel.innerHTML=x;sheet.classList.add('on')}function closeSheet(){sheet.classList.remove('on')}function choose(b,v){window.choice=v;b.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function moveSheet(id){let g=S.guests[id],cur=seat(g);window.choice=cur;openSheet(`<div class="tag">${g.name} · Boda principal</div><h2>${cur?'Mover de mesa':'Asignar mesa'}</h2><p class="small">${cur?'Ahora está en '+cur+'.':''}</p><div>${Object.values(T()).map(t=>{let o=occ(t),would=cur===t.name?o:o+1;return `<button class="choice ${cur===t.name?'sel':''} ${would>t.capacity?'warn':''}" onclick="choose(this,'${t.name}')"><b>${t.name}</b><br><span class="small">${o} de ${t.capacity} plazas${would>t.capacity?' · quedaría en exceso':''}</span></button>`}).join('')}</div><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveSeat('${id}')">Guardar</button></div>`)}function saveSeat(id){if(!window.choice)return;let g=S.guests[id],old=seat(g)||'Sin mesa';g.seating.main=window.choice;S.activity=`${g.name} · Mesa: ${old} → ${window.choice}. Ocupación recalculada.`;closeSheet();render()}
function newTable(){openSheet(`<div class="tag">Boda principal</div><h2>Añadir mesa</h2><label class="small">Nombre</label><input id="tn" class="field" placeholder="Ej. Mesa 5"><label class="small">Capacidad</label><input id="tc" class="field" type="number" min="1" inputmode="numeric" placeholder="Ej. 8"><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveNewTable()">Añadir</button></div>`)}function saveNewTable(){let n=tn.value.trim(),c=+tc.value;if(!n||c<1)return alert('Indica nombre y capacidad.');if(Object.values(T()).some(t=>t.name.toLowerCase()===n.toLowerCase()))return alert('Ya existe una mesa con ese nombre.');T()['t'+Date.now()]={name:n,capacity:c};S.activity=`${n} creada con ${c} plazas.`;closeSheet();render()}
function editTable(id){let t=T()[id];openSheet(`<div class="tag">Boda principal</div><h2>Editar mesa</h2><label class="small">Nombre</label><input id="tn" class="field" value="${t.name}"><label class="small">Capacidad</label><input id="tc" class="field" type="number" min="1" inputmode="numeric" value="${t.capacity}"><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveTable('${id}')">Guardar</button></div><button class="choice danger" onclick="deleteTable('${id}')">Eliminar mesa</button>`)}function saveTable(id){let t=T()[id],old=t.name,n=tn.value.trim(),c=+tc.value;if(!n||c<1)return alert('Indica nombre y capacidad.');G().forEach(([,g])=>{if(seat(g)===old)g.seating.main=n});t.name=n;t.capacity=c;S.activity=`${n} actualizada · capacidad ${c}.`;closeSheet();render()}function deleteTable(id){let t=T()[id],p=G().filter(([,g])=>seat(g)===t.name);if(p.length&&!confirm(`${p.length} personas quedarán sin mesa. ¿Eliminar ${t.name}?`))return;p.forEach(([,g])=>g.seating.main='');delete T()[id];S.activity=`${t.name} eliminada${p.length?`; ${p.length} personas vuelven a Sin mesa.`:'.'}`;closeSheet();render()}
function menuSheet(){window.choice=S.guests.paula.meal;openSheet(`<div class="tag">Paula Martín</div><h2>¿Qué menú necesita?</h2>${['Estándar','Vegetariano','Celíaco','Sin lactosa','Vegano','Infantil','Alérgico'].map(x=>`<button class="choice ${x===window.choice?'sel':''}" onclick="choose(this,'${x}')">${x}</button>`).join('')}<div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveMeal()">Guardar</button></div>`)}function saveMeal(){if(!window.choice)return;S.guests.paula.meal=window.choice;S.activity=`Paula Martín · Menú → ${window.choice}. Catering recalculado.`;closeSheet();render()}
function prepareSeating(){S.outputs.seating.preparedV++;S.activity=`Mesas V${S.outputs.seating.preparedV} preparada. Aún no está marcada como enviada.`;render()}function confirmSent(){let o=S.outputs.seating;o.sentV=o.preparedV;o.sent=snapshot();S.activity=`Mesas V${o.sentV} marcada como enviada.`;render()}
function csv(v){return '﻿'+v.map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(';')).join('\n')}function download(name,rows){let b=new Blob([csv(rows)],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function downloadCatering(){let rows=[['MESA','NOMBRE','MENÚ']],tot={};Object.values(T()).forEach(t=>{let ps=G().filter(([,g])=>g.rsvp==='confirmed'&&seat(g)===t.name).map(([,g])=>g),count={};ps.forEach(g=>{let m=g.meal||'PENDIENTE';rows.push([t.name,g.name,m]);count[m]=(count[m]||0)+1;tot[m]=(tot[m]||0)+1});rows.push([t.name+' · RESUMEN',ps.length+' personas',Object.entries(count).map(([m,n])=>`${n} ${m}`).join(' · ')]);rows.push(['','',''])});rows.push(['TOTAL','',Object.entries(tot).map(([m,n])=>`${n} ${m}`).join(' · ')]);download('Catering_por_mesas.csv',rows);S.activity='Listado de catering descargado: personas y menús por mesa + recuento total.';render()}
render();</script></body></html>
