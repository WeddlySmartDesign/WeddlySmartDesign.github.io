<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests QA</title><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f1ea;color:#2c2a26;margin:0}.wrap{max-width:620px;margin:auto;padding:24px}.tag{font-size:12px;letter-spacing:.08em;text-transform:uppercase}h1{font:500 54px Georgia,serif;margin:18px 0 36px}h2{font-size:34px;margin:18px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat,.card{background:#fff;border:1px solid #ddd5c8;border-radius:20px}.stat{padding:18px 12px}.n{font-size:38px;font-weight:650}.card{padding:22px;margin:16px 0}.alert{border-left:5px solid #9b6846}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.row:last-child{border:0}.small{font-size:15px;color:#6d6862;line-height:1.45}.btn{border:0;border-radius:13px;padding:13px 16px;background:#2c2a26;color:white;font-weight:700;font-size:15px}.soft{background:#eee8df;color:#2c2a26}.view{display:none;padding-bottom:92px}.view.on{display:block}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:white;border-top:1px solid #ddd5c8;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:12px 2px;font-size:16px;font-weight:650}.nav button.on{background:#eee8df;border-radius:13px}.sheet{display:none;position:fixed;z-index:40;inset:0;background:#0005;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:620px;margin:auto;background:white;border-radius:25px 25px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}.choice{display:block;width:100%;text-align:left;border:1px solid #ddd5c8;background:white;border-radius:14px;padding:15px;margin:7px 0;font-size:17px}.choice.sel{outline:2px solid #2c2a26}.actions{display:flex;gap:10px;margin-top:18px}.actions>*{flex:1}.ok{color:#526b4d;font-weight:700}</style></head><body><main class="wrap"><div class="tag">Weddly Smart Design · Guests</div><h1>Daniela & Sergio</h1><section id="hoy" class="view on"></section><section id="invitados" class="view"></section><section id="mesas" class="view"></section><section id="listados" class="view"></section></main><nav class="nav"><button class="on" onclick="go('hoy',0)">Hoy</button><button onclick="go('invitados',1)">Invitados</button><button onclick="go('mesas',2)">Mesas</button><button onclick="go('listados',3)">Listados</button></nav><div class="sheet" id="sheet"><div class="panel" id="panel"></div></div><script>
const S={guests:{paula:{name:'Paula Martín',rsvp:'confirmed',meal:'',table:'Mesa 2',role:'adult'},david:{name:'David Martín',rsvp:'confirmed',meal:'Estándar',table:'Mesa 2',role:'adult'},leo:{name:'Leo Martín',rsvp:'confirmed',meal:'Infantil',table:'Mesa 2',role:'child',age:7},irene:{name:'Irene López',rsvp:'pending',meal:'',table:'',role:'adult'},ruben:{name:'Rubén',rsvp:'confirmed',meal:'Estándar',table:'Mesa 4',role:'adult'},ana:{name:'Ana',rsvp:'confirmed',meal:'Estándar',table:'Mesa 4',role:'adult'},luis:{name:'Luis',rsvp:'confirmed',meal:'Estándar',table:'Mesa 3',role:'adult'},marta:{name:'Marta',rsvp:'pending',meal:'Estándar',table:'',role:'adult'}},tables:{'Mesa 2':4,'Mesa 3':8,'Mesa 4':4},outputs:{seating:{preparedV:2,sentV:1,prepared:{ruben:'Mesa 3'},sent:{ruben:'Mesa 3'}},catering:{preparedV:1,sentV:1}},activity:'La lista externa añadió 1 persona y actualizó 2 datos seguros.'};
const G=()=>Object.values(S.guests),active=g=>['confirmed','pending'].includes(g.rsvp),occ=t=>G().filter(g=>active(g)&&g.table===t).length,free=t=>S.tables[t]-occ(t),mealIssue=()=>!S.guests.paula.meal,seatChanges=()=>{const b=S.outputs.seating.sent,d={};G().forEach(g=>{const id=Object.keys(S.guests).find(k=>S.guests[k]===g);if(g.table!==(b[id]||''))d[id]=[b[id]||'Sin mesa',g.table||'Sin mesa']});return d},seatStale=()=>Object.keys(seatChanges()).length>0,nowCount=()=>Number(mealIssue())+Number(seatStale());
function render(){renderHoy();renderGuests();renderTables();renderLists()}
function renderHoy(){let a='';if(mealIssue())a+=`<div class="card alert"><b>Paula necesita menú</b><p class="small">Catering cierra mañana. Falta elegir su menú.</p><button class="btn" onclick="menuSheet()">Resolver</button></div>`;if(seatStale()){const c=seatChanges(),id=Object.keys(c)[0],g=S.guests[id];a+=`<div class="card alert"><b>Mesas enviadas ya no coinciden</b><p class="small">${g.name} · Mesa: ${c[id][0]} → ${c[id][1]}</p><button class="btn soft" onclick="go('listados',3)">Revisar listado</button></div>`}if(!a)a=`<div class="card"><b class="ok">Todo al día</b><p class="small">No hay ninguna acción que necesite tu atención ahora.</p></div>`;hoy.innerHTML=`<div class="stats"><div class="stat"><div class="n">${G().filter(g=>g.rsvp==='confirmed').length}</div><div class="small">Confirmados</div></div><div class="stat"><div class="n">${G().filter(g=>g.rsvp==='pending').length}</div><div class="small">Pendientes</div></div><div class="stat"><div class="n">${nowCount()}</div><div class="small">Ahora</div></div></div>${a}<div class="card"><b>Acaba de cambiar</b><p class="small">${S.activity}</p></div>`}
function renderGuests(){invitados.innerHTML=`<h2>Invitados</h2><div class="card">${Object.entries(S.guests).map(([id,g])=>`<div class="row"><div><b>${g.name}</b><div class="small">${g.role==='child'?`Niño · ${g.age} años · `:''}${g.rsvp==='confirmed'?'Confirmado':g.rsvp==='pending'?'Pendiente':'No asiste'} · ${g.meal||'Menú pendiente'} · ${g.table||'Sin mesa'}</div></div><button class="btn soft" onclick="editGuest('${id}')">Editar</button></div>`).join('')}</div>`}
function renderTables(){const rows=Object.entries(S.tables).map(([t,cap])=>{const o=occ(t),f=free(t),state=f<0?'Exceso':f===0?'Llena':`${f} libre${f===1?'':'s'}`;return `<div class="row"><div><b>${t}</b><div class="small">${G().filter(g=>active(g)&&g.table===t).map(g=>g.name).join(', ')||'Vacía'}</div></div><span>${o} / ${cap} · ${state}</span></div>`}).join('');const un=Object.entries(S.guests).filter(([,g])=>active(g)&&!g.table);mesas.innerHTML=`<h2>Mesas</h2><div class="card">${rows}</div>${un.length?`<div class="card"><b>Sin mesa</b>${un.map(([id,g])=>`<div class="row"><span>${g.name} · ${g.rsvp==='pending'?'Pendiente':'Confirmado'}</span><button class="btn soft" onclick="tableSheet('${id}')">Asignar</button></div>`).join('')}</div>`:`<div class="card"><b class="ok">Todos los invitados activos tienen mesa</b></div>`}`}
function renderLists(){const c=seatChanges(),lines=Object.entries(c).map(([id,x])=>`<p class="small">${S.guests[id].name} · Mesa: ${x[0]} → ${x[1]}</p>`).join('');const o=S.outputs.seating;listados.innerHTML=`<h2>Listados</h2><div class="card ${seatStale()?'alert':''}"><b>Mesas · Boda principal</b><p class="small">Preparada V${o.preparedV} · Enviada V${o.sentV}${!seatStale()?' · Todo actualizado':''}</p>${lines}${seatStale()?`<button class="btn" onclick="prepareSeating()">Preparar y descargar nueva versión</button>`:''}${o.preparedV>o.sentV?` <button class="btn soft" onclick="confirmSent()">Confirmar que envié V${o.preparedV}</button>`:''}</div><div class="card"><b>Catering · Boda principal</b><p class="small">Preparada V${S.outputs.catering.preparedV} · Enviada V${S.outputs.catering.sentV}${mealIssue()?' · Hay cambios pendientes':' · Todo actualizado'}</p></div>`}
function go(id,n){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('on',i===n));render()}
function openSheet(body){panel.innerHTML=body;sheet.classList.add('on')}function closeSheet(){sheet.classList.remove('on')}
function menuSheet(){let selected=S.guests.paula.meal;openSheet(`<div class="tag">Paula Martín</div><h2>¿Qué menú necesita?</h2><p class="small">Elige la información que te ha dado Paula.</p><div id="choices">${['Estándar','Vegetariano','Celíaco','Sin lactosa','Vegano','Infantil','Alérgico'].map(x=>`<button class="choice ${x===selected?'sel':''}" onclick="choose(this,'${x}')">${x}</button>`).join('')}</div><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveMeal()">Guardar</button></div>`);window.choice=selected}
function choose(b,v){window.choice=v;b.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function saveMeal(){if(!window.choice)return;const old=S.guests.paula.meal||'Pendiente';S.guests.paula.meal=window.choice;S.activity=`Paula Martín · Menú: ${old} → ${window.choice}. Catering recalculado.`;closeSheet();render()}
function editGuest(id){const g=S.guests[id];openSheet(`<div class="tag">${g.name}</div><h2>Editar invitado</h2><p class="small">Menú: ${g.meal||'Pendiente'}<br>Mesa: ${g.table||'Sin mesa'}</p><button class="choice" onclick="closeSheet();${id==='paula'?'menuSheet()':`tableSheet('${id}')`}">${id==='paula'?'Cambiar menú':'Cambiar mesa'}</button><div class="actions"><button class="btn soft" onclick="closeSheet()">Cerrar</button></div>`)}
function tableSheet(id){const g=S.guests[id];openSheet(`<div class="tag">${g.name} · Boda principal</div><h2>Asignar mesa</h2><p class="small">${g.rsvp==='pending'?'Está pendiente de RSVP. Si la asignas, contará en ocupación.':''}</p><div id="choices">${Object.entries(S.tables).map(([t,c])=>`<button class="choice ${g.table===t?'sel':''}" onclick="choose(this,'${t}')"><b>${t}</b><br><span class="small">${occ(t)} / ${c} ocupadas</span></button>`).join('')}</div><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveTable('${id}')">Guardar</button></div>`);window.choice=g.table}
function saveTable(id){if(!window.choice)return;const g=S.guests[id],old=g.table||'Sin mesa';g.table=window.choice;S.activity=`${g.name} · Mesa: ${old} → ${g.table}. Ocupación y listado de mesas recalculados.`;closeSheet();render()}
function currentSeatSnapshot(){const x={};Object.entries(S.guests).forEach(([id,g])=>{if(active(g)&&g.table)x[id]=g.table});return x}
function prepareSeating(){const o=S.outputs.seating;o.preparedV++;o.prepared=currentSeatSnapshot();const rows=['Mesa,Capacidad,Nombre,RSVP',...Object.entries(S.tables).flatMap(([t,c])=>{const ps=Object.values(S.guests).filter(g=>active(g)&&g.table===t);return ps.length?ps.map(g=>`${t},${c},${g.name},${g.rsvp}`):[`${t},${c},,`]})];const blob=new Blob([rows.join('\n')],{type:'text/csv'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`Mesas_Boda_principal_V${o.preparedV}.csv`;a.click();URL.revokeObjectURL(u);S.activity=`Mesas · V${o.preparedV} preparada y descargada. Aún no está marcada como enviada.`;render()}
function confirmSent(){const o=S.outputs.seating;o.sentV=o.preparedV;o.sent=JSON.parse(JSON.stringify(o.prepared));S.activity=`Mesas · V${o.sentV} marcada como enviada. El listado vuelve a estar al día.`;render()}
render();
</script></body></html>
