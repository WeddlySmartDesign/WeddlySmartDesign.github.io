nt-size:13px;line-height:1.4}.notice.on{display:block}.notice.err{background:#f6e8e4;color:var(--danger)}.sheet{display:none;position:fixed;z-index:100;inset:0;background:#0005;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:700px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.panelActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.pickRow{display:flex;gap:9px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.pickRow input{width:20px;height:20px;margin-top:2px}.pickRow b{font-size:13px}.pickRow span{display:block;font-size:11px;color:var(--muted);margin-top:2px}.empty{text-align:center;color:var(--muted);padding:24px 10px}.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.toggle input{width:22px;height:22px}@media(max-width:480px){h1{font-size:34px}.metrics{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr}.topActions .editLabel{display:none}.sendGrid{grid-template-columns:1fr}.actions .btn{flex:1}.person{grid-template-columns:1fr}}</style></head><body><main class="app"><div class="top"><div class="brand"><b>Weddly</b><span>Smart Design</span></div><div class="topActions"><button class="btn line" id="editInvitation"><span class="editLabel">Editar </span>invitación</button><button class="btn soft" id="back">← Invitados</button></div></div><div class="eyebrow">RSVP</div><h1>Envíos y respuestas</h1><p class="lead">Gestiona aquí las invitaciones y las respuestas. Las personas siguen siendo individuales para mesas, catering y transporte.</p><div id="notice" class="notice"></div><div id="metrics" class="metrics"><div class="metric"><b>—</b><span>invitaciones</span></div><div class="metric"><b>—</b><span>enviadas</span></div><div class="metric"><b>—</b><span>personas respondidas</span></div></div><div class="toolbar"><button class="btn" id="refresh">Actualizar respuestas</button><button class="btn soft" id="organize">Organizar invitaciones</button></div><section id="units"><div class="empty">Cargando invitaciones…</div></section></main><div id="sheet" class="sheet"><div id="panel" class="panel"></div></div><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp',GAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-guests-state',FALLBACK='sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8',GKEY='weddly_guests_qa_v67',RKEY='weddly_guests_rsvp_v82',PREF='weddly_invite_unit_recipient_v1',TOKEN_KEY='weddly_shared_wedding_token';const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),norm=s=>String(s||'').trim().toLowerCase();let remote={forms:[],submissions:[],contacts:[],delivery:[]},PT=FALLBACK;function theme(){try{const x=localStorage.getItem('weddly_personal_theme_v51')||localStorage.getItem('weddly_personal_theme_v20')||'nordic';return['nordic','blush','sand','slate','editorial'].includes(x)?x:'nordic'}catch{return'nordic'}}document.documentElement.dataset.theme=theme();const mt=()=>{try{return localStorage.getItem(TOKEN_KEY)||''}catch{return''}};function state(){try{const s=JSON.parse(localStorage.getItem(GKEY)||'null')||{};s.guests=s.guests||{};return s}catch{return{guests:{}}}}function putLocal(s){localStorage.setItem(GKEY,JSON.stringify(s))}function guests(){return Object.entries(state().guests||{}).map(([id,g])=>({id,...g})).filter(g=>g.rsvp!=='declined')}function prefs(){try{return JSON.parse(localStorage.getItem(PREF)||'{}')||{}}catch{return{}}}function setPref(k,v){const p=prefs();p[k]=v;localStorage.setItem(PREF,JSON.stringify(p))}function localR(){try{return JSON.parse(localStorage.getItem(RKEY)||'{}')||{}}catch{return{}}}function show(msg,err=false){const n=$('notice');n.textContent=msg;n.className='notice on'+(err?' err':'');clearTimeout(show.t);show.t=setTimeout(()=>n.className='notice',2800)}async function req(url,opt={}){const r=await fetch(url,opt),x=await r.json().catch(()=>({}));if(!r.ok||!x.ok){const e=new Error(x.error||'request_failed');e.status=r.status;e.data=x;throw e}return x}async function claim(token){if(!mt())throw new Error('missing_access');return req(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'claim',token})})}function latest(g){return(remote.submissions||[]).filter(x=>(x.guest_key&&x.guest_key===g.id)||(!x.guest_key&&norm(x.name)===norm(g.name))).sort((a,b)=>new Date(b.received_at)-new Date(a.received_at))[0]}function contact(g){const r=(remote.contacts||[]).find(x=>x.guest_key===g.id)||{},l=localR().contacts?.[g.id]||{};return{phone:r.phone||l.phone||g.phone||'',email:r.email||l.email||g.email||''}}function delivery(k){const r=(remote.delivery||[]).find(x=>x.guest_key===k)||{},l=localR().delivery?.[k]||{};return Object.keys(r).length?r:l}function units(){const out=[],map=new Map();for(const g of guests()){const actual=!!g.invitationUnitId,key=actual?g.invitationUnitId:'single:'+g.id;if(!map.has(key)){const u={id:key,actual,members:[],label:''};map.set(key,u);out.push(u)}const u=map.get(key);u.members.push(g);if(!u.label&&g.invitationUnitLabel)u.label=g.invitationUnitLabel}for(const u of out){if(!u.label)u.label=u.members.length===1?(u.members[0].name||'Invitación'):'Invitación conjunta'}return out}function deliveryKey(u){return u.actual&&u.members.length>1?'unit:'+u.id:u.members[0]?.id||u.id}function publicLink(u){const base=location.origin+'/guests-rsvp-v105.html?guest=1&t='+encodeURIComponent(PT);return u.actual&&u.members.length>1?base+'&u='+encodeURIComponent(u.id):base+'&g='+encodeURIComponent(u.members[0].id)}function recipient(u){const p=prefs()[u.id],byId=u.members.find(x=>x.id===p);if(byId)return byId;return u.members.find(x=>contact(x).phone)||u.members[0]}function phone(raw){const o=String(raw||'').trim();let d=o.replace(/\D/g,'');if(o.startsWith('00'))d=d.slice(2);if(o.startsWith('+'))return d;if(d.length===9&&/^[6789]/.test(d))return'34'+d;return d}async function syncUnitFields(){if(!mt())return;const local=state();try{const g=await req(GAPI,{headers:{'x-weddly-token':mt()},cache:'no-store'}),base=g.state&&typeof g.state==='object'?structuredClone(g.state):structuredClone(local);base.guests=base.guests||{};for(const [id,lg] of Object.entries(local.guests||{})){if(!base.guests[id])base.guests[id]=lg;else{if(Object.prototype.hasOwnProperty.call(lg,'invitationUnitId'))base.guests[id].invitationUnitId=lg.invitationUnitId;if(Object.prototype.hasOwnProperty.call(lg,'invitationUnitLabel'))base.guests[id].invitationUnitLabel=lg.invitationUnitLabel}}let r=await fetch(GAPI,{method:'PUT',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({version:g.version||0,state:base})}),x=await r.json().catch(()=>({}));if(r.status===409&&x.server){const b=x.server.state&&typeof x.server.state==='object'?structuredClone(x.server.state):{guests:{}};b.guests=b.guests||{};for(const [id,lg] of Object.entries(local.guests||{})){if(!b.guests[id])b.guests[id]=lg;else{if(Object.prototype.hasOwnProperty.call(lg,'invitationUnitId'))b.guests[id].invitationUnitId=lg.invitationUnitId;if(Object.prototype.hasOwnProperty.call(lg,'invitationUnitLabel'))b.guests[id].invitationUnitLabel=lg.invitationUnitLabel}}r=await fetch(GAPI,{method:'PUT',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({version:x.server.version||0,state:b})});x=await r.json().catch(()=>({}));if(r.ok&&x.ok)putLocal(b)}else if(r.ok&&x.ok)putLocal(base)}catch{}}async function load(){if(!mt())throw new Error('missing_access');await syncUnitFields();remote=await req(API+'?manage=1',{headers:{'x-weddly-token':mt()},cache:'no-store'});const f=remote.forms?.[0];if(f?.public_token)PT=f.public_token;else{await claim(PT).catch(()=>{});remote=await req(API+'?manage=1',{headers:{'x-weddly-token':mt()},cache:'no-store'});if(remote.forms?.[0]?.public_token)PT=remote.forms[0].public_token}render()}function statusFor(g){const a=latest(g);return a?(a.attend?'Confirmado':'No asiste'):(g.rsvp==='confirmed'?'Confirmado':g.rsvp==='declined'?'No asiste':'Sin respuesta')}function render(){const us=units(),sent=us.filter(u=>delivery(deliveryKey(u)).status==='sent').length,answered=guests().filter(latest).length;$('metrics').innerHTML=`<div class="metric"><b>${us.length}</b><span>invitaciones</span></div><div class="metric"><b>${sent}</b><span>enviadas</span></div><div class="metric"><b>${answered}</b><span>personas respondidas</span></div>`;$('units').innerHTML=us.map(unitHtml).join('')||'<div class="empty">Aún no hay invitados.</div>';bind()}function unitHtml(u){const r=recipient(u),c=contact(r),d=delivery(deliveryKey(u)),all=u.members.map(g=>g.name).join(' · ');return `<article class="unit"><div class="uhead"><div><div class="uname">${safe(u.label)}</div><div class="members">${u.members.length} persona${u.members.length===1?'':'s'} · ${safe(all)}</div></div><button class="btn line mini" data-editunit="${safe(u.id)}">Editar unidad</button></div><div class="chips"><span class="chip ${d.status==='sent'?'ok':''}">${d.status==='sent'?'Invitación enviada':'Sin enviar'}</span></div><div class="sendBox"><div class="sendGrid"><label>Enviar a<select class="field" data-recipient="${safe(u.id)}">${u.members.map(g=>`<option value="${safe(g.id)}" ${g.id===r.id?'selected':''}>${safe(g.name)}</option>`).join('')}</select></label><button class="btn soft mini" data-contact="${safe(r.id)}" data-unitcontact="${safe(u.id)}">Contacto</button></div><div class="contactLine" data-contactline="${safe(u.id)}">${safe(c.phone||c.email||'Sin contacto')}</div><div class="actions">${c.phone?`<button class="btn mini" data-wa="${safe(u.id)}">${d.status==='sent'?'Reenviar por WhatsApp':'Enviar por WhatsApp'}</button>`:''}<button class="btn line mini" data-copy="${safe(u.id)}">Copiar enlace</button></div></div>${u.members.map(g=>{const s=statusFor(g),a=latest(g);return `<div class="person"><div><div class="personName">${safe(g.name)}</div><div class="personMeta">${safe(s)}${a?.meal?' · '+safe(a.meal):''}${g.table?' · '+safe(g.table):''}</div></div><button class="btn line mini" data-manual="${safe(g.id)}">Respuesta manual</button></div>`}).join('')}</article>`}function bind(){$('units').querySelectorAll('[data-recipient]').forEach(s=>s.onchange=()=>{setPref(s.dataset.recipient,s.value);render()});$('units').querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>openContact(b.dataset.contact,b.dataset.unitcontact));$('units').querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>sendWA(b.dataset.wa));$('units').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const u=units().find(x=>x.id===b.dataset.copy);if(u)copy(publicLink(u))});$('units').querySelectorAll('[data-manual]').forEach(b=>b.onclick=()=>openManual(b.dataset.manual));$('units').querySelectorAll('[data-editunit]').forEach(b=>b.onclick=()=>openOrganize(b.dataset.editunit))}function openSheet(html){$('panel').innerHTML=html;$('sheet').classList.add('on');$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()}}function closeSheet(){$('sheet').classList.remove('on');$('panel').innerHTML=''}function openContact(id,unitId=''){const g=guests().find(x=>x.id===id);if(!g)return;const c=contact(g),can=!!navigator.contacts?.select;openSheet(`<div class="eyebrow">CONTACTO</div><h2>${safe(g.name)}</h2>${can?'<button id="pick" class="btn soft" style="width:100%;margin-bottom:12px">Elegir de mi agenda</button>':''}<label>Teléfono</label><input id="cp" class="field" inputmode="tel" value="${safe(c.phone)}"><label>Email</label><input id="ce" class="field" inputmode="email" value="${safe(c.email)}"><div id="cfb" class="notice"></div><div class="panelActions"><button id="cc" class="btn soft">Cancelar</button><button id="cs" class="btn">Guardar</button></div>`);$('cc').onclick=closeSheet;$('cs').onclick=()=>saveContact(id);if(can)$('pick').onclick=()=>pickContact()}async function pickContact(){const fb=$('cfb');try{const props=navigator.contacts.getProperties?await navigator.contacts.getProperties():['name','tel','email'],wanted=['name','tel','email'].filter(x=>props.includes(x)),items=await navigator.contacts.select(wanted,{multiple:false});if(!items?.length)return;const c=items[0];if(c.tel?.[0])$('cp').value=c.tel[0];if(c.email?.[0])$('ce').value=c.email[0];if(c.name?.[0]){fb.textContent='Contacto seleccionado: '+c.name[0];fb.className='notice on'}}catch(e){if(e?.name!=='AbortError'){fb.textContent='Este navegador no ha permitido abrir la agenda. Puedes introducir el contacto manualmente.';fb.className='notice on err'}}}async function saveContact(id){const b=$('cs');b.disabled=true;b.textContent='Guardando…';try{await req(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'contact',token:PT,guest_key:id,phone:$('cp').value.trim(),email:$('ce').value.trim()})});closeSheet();await load();show('Contacto guardado.')}catch{b.disabled=false;b.textContent='Guardar';$('cfb').textContent='No se ha podido guardar.';$('cfb').className='notice on err'}}async function copy(text){try{await navigator.clipboard.writeText(text);show('Enlace copiado.')}catch{prompt('Copia este enlace:',text)}}async function sendWA(unitId){const u=units().find(x=>x.id===unitId);if(!u)return;const r=recipient(u),c=contact(r),p=phone(c.phone);if(p.length<9||p.length>15){openContact(r.id,u.id);return}const greeting=u.members.length>1?u.label:r.name;try{req(API,{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'delivery',token:PT,guest_key:deliveryKey(u),status:'sent'})}).catch(()=>{});const text=`Hola ${greeting||''}, os enviamos nuestra invitación. Podéis confirmar aquí: ${publicLink(u)}`;location.href=`https://wa.me/${p}?text=${encodeURIComponent(text)}`}catch{show('No se ha podido abrir WhatsApp.',true)}}function openManual(id){const g=guests().find(x=>x.id===id);if(!g)return;openSheet(`<div class="eyebrow">RSVP</div><h2>Respuesta manual</h2><p class="lead">${safe(g.name)}</p><label>Asistencia</label><select id="ma" class="field"><option value="yes">Asiste</option><option value="no">No asiste</option></select><label class="toggle"><span>Necesita menú</span><input id="mn" type="checkbox" checked></label><label>Menú</label><select id="mm" class="field"><option>Estándar</option><option>Vegetariano</option><option>Vegano</option><option>Celíaco</option><option>Sin lactosa</option><option>Infantil</option></select><label>Alergias o intolerancias</label><input id="mal" class="field"><label class="toggle"><span>Necesita transporte</span><input id="mtr" type="checkbox"></label><label>Acompañante / +1</label><input id="mp" class="field"><div id="mfb" class="notice"></div><div class="panelActions"><button id="mc" class="btn soft">Cancelar</button><button id="ms" class="btn">Guardar respuesta</button></div>`);$('mc').onclick=closeSheet;$('ms').onclick=()=>saveManual(id)}async function saveManual(id){const g=guests().find(x=>x.id===id),b=$('ms');if(!g)return;b.disabled=true;b.textContent='Guardando…';const attend=$('ma').value==='yes',need=$('mn').checked,payload={action:'manual_submit',client_submission_id:(crypto.randomUUID?crypto.randomUUID():'manual_'+Date.now()),guest_key:id,name:g.name,attend,age:null,meal_required:need,meal:need?$('mm').value:'',allergy:$('mal').value.trim(),transport:$('mtr').checked,plusone:$('mp').value.trim()};try{await req(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify(payload)});closeSheet();await load();show('Respuesta guardada.')}catch{b.disabled=false;b.textContent='Guardar respuesta';$('mfb').textContent='No se ha podido guardar.';$('mfb').className='notice on err'}}function openOrganize(unitId=''){const gs=guests(),u=units().find(x=>x.id===unitId),selected=new Set(u?.members.map(x=>x.id)||[]);openSheet(`<div class="eyebrow">UNIDAD DE INVITACIÓN</div><h2>${u?'Editar invitación':'Crear invitación conjunta'}</h2><p class="lead">Selecciona exactamente las personas que recibirán el mismo enlace. Esto no cambia sus mesas ni su gestión individual.</p><label>Nombre para identificarla <span class="small">(opcional)</span></label><input id="ulabel" class="field" value="${safe(u?.label||'')}" placeholder="Ej. Familia Rodríguez"><div>${gs.map(g=>`<label class="pickRow"><input type="checkbox" data-pick="${safe(g.id)}" ${selected.has(g.id)?'checked':''}><span><b>${safe(g.name)}</b><span>${safe(g.group||'')}${g.unitId?' · '+safe(g.unitId):''}</span></span></label>`).join('')}</div><div id="ufb" class="notice"></div><div class="panelActions"><button id="uc" class="btn soft">Cancelar</button><button id="us" class="btn">Guardar unidad</button></div>${u&&u.members.length>1?'<button id="split" class="btn line" style="width:100%;margin-top:9px">Separar en invitaciones individuales</button>':''}`);$('uc').onclick=closeSheet;$('us').onclick=async()=>{const ids=[...$('panel').querySelectorAll('[data-pick]:checked')].map(x=>x.dataset.pick);if(!ids.length){$('ufb').textContent='Selecciona al menos una persona.';$('ufb').className='notice on err';return}await mutateUnits(S=>{const newid='iu_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8),label=$('ulabel').value.trim();ids.forEach(id=>{if(S.guests?.[id]){S.guests[id].invitationUnitId=newid;S.guests[id].invitationUnitLabel=label}})});closeSheet();await load();show('Unidad de invitación guardada.')};if($('split'))$('split').onclick=async()=>{const ids=u.members.map(x=>x.id);await mutateUnits(S=>{ids.forEach(id=>{const g=S.guests?.[id];if(g){g.invitationUnitId='iu_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);g.invitationUnitLabel=g.name||''}})});closeSheet();await load();show('Invitaciones separadas.')}}async function mutateUnits(fn){const S=state();fn(S);putLocal(S);await syncUnitFields()}$('back').onclick=()=>location.assign('guests.html#invitados');$('editInvitation').onclick=()=>location.assign('guests-rsvp-design-manage.html');$('refresh').onclick=async()=>{show('Actualizando…');try{await load();show('Respuestas actualizadas.')}catch{show('No se han podido actualizar las respuestas.',true)}};$('organize').onclick=()=>openOrganize();load().catch(e=>{$('units').innerHTML='<div class="empty">No se han podido cargar las invitaciones.</div>';show(e.message==='missing_access'?'Este dispositivo no tiene acceso a la boda.':'No se ha podido cargar el RSVP.',true)})})();</script></body></html>
