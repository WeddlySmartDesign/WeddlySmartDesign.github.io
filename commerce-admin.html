<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211d1a">
<title>Ventas ONE · WeddlySmartDesign</title>
<style>
:root{--dark:#211d1a;--brown:#4a3a36;--paper:#f7eee5;--paper2:#efe2d8;--clay:#b97a5c;--muted:#746a64;--line:rgba(74,58,54,.14)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--brown);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(calc(100% - 28px),920px);margin:auto;padding:32px 0 70px}.brand{font-size:13px;font-weight:800}
h1{font-family:Georgia,serif;font-weight:400;font-size:50px;line-height:.95;margin:28px 0 8px}.lead{color:var(--muted);font-size:13px}
.toprow{display:flex;justify-content:space-between;gap:12px;align-items:center}.refresh{border:1px solid var(--line);background:#fffaf5;color:var(--brown);border-radius:10px;padding:10px 12px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}.stat{background:#fffaf5;border:1px solid var(--line);border-radius:14px;padding:14px}.stat strong{font-family:Georgia,serif;font-size:26px;font-weight:400;display:block}.stat span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.list{display:grid;gap:10px}.order{background:#fffaf5;border:1px solid var(--line);border-radius:16px;padding:15px}.order-top{display:flex;justify-content:space-between;gap:12px}.order strong{font-size:13px}.order .amount{font-family:Georgia,serif;font-size:24px;font-weight:400}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}.pill{font-size:9px;padding:6px 8px;border-radius:999px;background:var(--paper2)}.pill.ok{background:#dfe8dc}.pill.warn{background:#f1dfd2}.sub{margin-top:10px;font-size:10px;line-height:1.5;color:var(--muted)}.empty,.err{padding:22px;border-radius:14px;background:#fffaf5;border:1px solid var(--line);font-size:12px}.err{color:#9a3d35}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}}
</style>
</head>
<body><main>
<div class="toprow"><div class="brand">WeddlySmartDesign</div><button id="refresh" class="refresh" type="button">Actualizar</button></div>
<h1>Ventas de ONE.</h1>
<p class="lead">Vista privada del estado de pagos, licencias y correos de activación.</p>
<div id="stats" class="stats"></div>
<div id="list" class="list"><div class="empty">Cargando…</div></div>
</main>
<script src="/access-cookie-bridge-v1.js?v=1"></script>
<script>
(()=>{
 const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-commerce';
 const TOKEN='weddly_shared_wedding_token',$=id=>document.getElementById(id);
 const money=(cents,currency)=>new Intl.NumberFormat('es-ES',{style:'currency',currency:String(currency||'EUR').toUpperCase()}).format(Number(cents||0)/100);
 const date=v=>v?new Intl.DateTimeFormat('es-ES',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';
 const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 function token(){try{return window.__WSD_ACCESS_BRIDGE?.sync?.()||localStorage.getItem(TOKEN)||''}catch{return''}}
 async function load(){
  const t=token();if(t.length<40){$('list').innerHTML='<div class="err">Este navegador no tiene el acceso propietario de WeddlySmartDesign.</div>';return}
  $('list').innerHTML='<div class="empty">Cargando…</div>';
  try{
   const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-weddly-member':t},body:JSON.stringify({action:'admin_orders'})});
   const j=await r.json().catch(()=>({}));
   if(!r.ok||!j.ok)throw new Error(j.error||'error');
   const orders=j.orders||[],paid=orders.filter(o=>o.paymentStatus==='paid').length,activated=orders.filter(o=>o.activatedAt).length;
   $('stats').innerHTML=`<div class="stat"><strong>${orders.length}</strong><span>pedidos</span></div><div class="stat"><strong>${paid}</strong><span>pagados</span></div><div class="stat"><strong>${activated}</strong><span>activados</span></div>`;
   if(!orders.length){$('list').innerHTML='<div class="empty">Todavía no hay pedidos web.</div>';return}
   $('list').innerHTML=orders.map(o=>`<article class="order">
    <div class="order-top"><div><strong>${esc(o.buyerEmail||'Email no disponible')}</strong><div class="sub">${date(o.createdAt)} · ${esc(o.productCode)}</div></div><div class="amount">${money(o.amountTotal,o.currency)}</div></div>
    <div class="meta">
     <span class="pill ${o.paymentStatus==='paid'?'ok':'warn'}">Pago: ${esc(o.paymentStatus)}</span>
     <span class="pill ${o.licenseStatus==='active'?'ok':'warn'}">Licencia: ${esc(o.licenseStatus||'pendiente')}</span>
     <span class="pill ${o.emailStatus==='sent'?'ok':'warn'}">Email: ${esc(o.emailStatus)}</span>
     <span class="pill ${o.activatedAt?'ok':''}">${o.activatedAt?'ONE activado':'Sin activar'}</span>
    </div>
    <div class="sub">Sesión: ${esc(o.sessionId)}${o.activatedAt?' · Activado '+date(o.activatedAt):''}</div>
   </article>`).join('');
  }catch(e){$('list').innerHTML='<div class="err">No se han podido cargar las ventas. Comprueba que estás usando el acceso propietario y que el backend de comercio está desplegado.</div>'}
 }
 $('refresh').onclick=load;load();
})();
</script></body></html>
