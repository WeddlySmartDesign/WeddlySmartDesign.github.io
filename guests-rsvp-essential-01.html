h:520px){.head{display:block}.head button{width:100%;margin-top:12px}.preview{height:500px}}</style></head><body><div id="public"><main class="invite"><div id="mount"></div></main></div><div id="admin"><header class="top"><button id="back">← Volver</button><div><b>RSVP</b><div style="font-size:12px;color:#726d67">Essential 1</div></div></header><main class="adminPage"><section class="card"><div class="head"><div><h2>Essential 1</h2><p>Plantilla exacta + datos editables + RSVP real de Guests.</p></div><button id="openPreview">Ver como invitado</button></div><div class="preview"><iframe id="previewFrame"></iframe></div></section><div class="note"><b>Conectado a Guests.</b> Mantiene guest_key, preguntas, envíos y respuestas.</div><div class="card editor"><iframe id="adminFrame"></iframe></div></main></div><div class="modal" id="modal"><div class="panel"><div class="mhead"><span>Confirmación de asistencia</span><button id="closeModal">×</button></div><iframe id="rsvpFrame"></iframe></div></div><script>(()=>{const q=new URLSearchParams(location.search),PUBLIC=q.get('guest')==='1'||q.get('preview')==='1',PT='sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8',TOKEN=q.get('t')||PT,API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp';let spec,cfg={title:'Daniela & Sergio',date:'12 septiembre 2027',time:'18:00',venue:'Finca Los Olivos, Murcia',intro:'',questions:{}};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pos=o=>`left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%`;async function loadSpec(){spec=await fetch('essential-01.config.json?v=3',{cache:'no-store'}).then(r=>r.json());if(spec.base.allowLegacyFallback!==false)throw Error('bad_contract');const chunks=await Promise.all(spec.base.chunks.map(p=>fetch(p+'?v=3',{cache:'no-store'}).then(r=>r.text())));spec.base.data='data:'+spec.base.mime+';base64,'+chunks.join('').replace(/\s+/g,'')}async function loadCfg(){try{const x=await fetch(API+'?token='+encodeURIComponent(TOKEN),{cache:'no-store'}).then(r=>r.json());if(x?.ok&&x.form?.config)cfg={...cfg,...x.form.config,questions:{...cfg.questions,...x.form.config.questions}}}catch{}}function venue(){const a=String(cfg.venue||'').split(',');return{main:(a.shift()||'Finca Los Olivos').trim(),city:a.join(',').trim()||'Murcia'}}function dateLines(){const s=String(cfg.date||'').trim();let d=s;if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const x=new Date(s+'T12:00:00');d=x.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}const m=d.match(/^(\d{1,2})\s+(.+?)\s+(\d{4})$/i);return m?`${esc(m[1]+' '+m[2].toUpperCase())}<br>${esc(m[3])}`:esc(d.toUpperCase())}function initials(){const p=String(cfg.title||'').split(/&| y /i).map(x=>x.trim()).filter(Boolean);return(p[0]?.[0]||'D')+(p[1]?.[0]||'S')}function addHours(t,h){const m=String(t||'18:00').match(/^(\d{1,2}):(\d{2})/);if(!m)return t||'18:00';const n=(Number(m[1])+h)%24;return String(n).padStart(2,'0')+':'+m[2]}function icon(type){if(type==='calendar')return'<svg viewBox="0 0 48 48"><rect x="9" y="12" width="30" height="27" rx="2"/><path d="M16 7v10M32 7v10M9 20h30"/></svg>';if(type==='clock')return'<svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="16"/><path d="M24 14v11l7 4"/></svg>';if(type==='pin')return'<svg viewBox="0 0 48 48"><path d="M24 42s13-13 13-25a13 13 0 1 0-26 0c0 12 13 25 13 25z"/><circle cx="24" cy="17" r="4"/></svg>';if(type==='rings')return'<svg viewBox="0 0 48 48"><circle cx="19" cy="28" r="10"/><circle cx="29" cy="28" r="10"/><path d="M15 14l4-6 4 6M25 14l4-6 4 6"/></svg>';if(type==='toast')return'<svg viewBox="0 0 48 48"><path d="M12 10h12l-2 15a5 5 0 0 1-8 0zM36 10H24l2 15a5 5 0 0 0 8 0zM18 30v9M30 30v9M12 40h12M24 40h12"/></svg>';if(type==='dish')return'<svg viewBox="0 0 48 48"><path d="M14 10v28M10 10v9a4 4 0 0 0 8 0v-9M30 10v28M26 10v12h8V10"/></svg>';return'<svg viewBox="0 0 48 48"><path d="M17 36V16l18-5v20M17 23l18-5"/><circle cx="13" cy="36" r="4"/><circle cx="31" cy="31" r="4"/></svg>'}function agenda(v){return spec.agenda.map((a,i)=>{const t=a.time||addHours(cfg.time,a.offsetHours||0),pl=a.place==='venue'?v.main:a.place;return`<div class="moment"><div class="momentIcon">${icon(a.icon)}</div><time>${esc(t)}</time><b>${esc(a.title)}</b><small>${esc(pl)}</small></div>`}).join('')}function render(){const l=spec.layout,v=venue(),photo=cfg.photoUrl||cfg.photo||'';return`<div class="sheet"><img class="base" src="${spec.base.data}" width="1090" height="1536" alt=""><div class="layer"><div class="abs brand caps" style="${pos(l.brand)}">${esc(spec.copy.brand)}</div><div class="abs tier" style="${pos(l.tier)}">${esc(spec.copy.tier)}</div><div class="abs heroTitle script" style="${pos(l.heroTitle)}">${esc(spec.copy.heroTitle)}</div><div class="abs heartDecor" style="left:45%;top:23.5%;width:10%;height:2%">— ♡ —</div><div class="abs heroSub caps" style="${pos(l.heroSub)}">${esc(spec.copy.heroSub).replace(/\n/g,'<br>')}</div><div class="photo" style="${pos(l.photo)}">${photo?`<img src="${esc(photo)}" alt="">`:`<div class="photoFallback">${esc(initials())}</div>`}</div><div class="abs names script" style="${pos(l.names)}">${esc(cfg.title||'Nuestra boda')}</div><div class="facts" style="${pos(l.facts)}"><div class="fact">${icon('calendar')}<div>${dateLines()}</div></div><div class="fact">${icon('clock')}<div>${esc(String(cfg.time||'18:00').toUpperCase())} H</div></div><div class="fact">${icon('pin')}<div>${esc(v.main.toUpperCase())}</div></div></div><div class="abs wait caps" style="${pos(l.wait)}">${esc(spec.copy.wait)}</div><div class="abs city" style="${pos(l.city)}">${esc(v.city)}</div><div class="abs agendaLabel caps" style="${pos(l.agendaLabel)}">${esc(spec.copy.agendaLabel)}</div><div class="abs agendaTitle script" style="${pos(l.agendaTitle)}">${esc(spec.copy.agendaTitle)}</div><div class="agenda" style="${pos(l.agenda)}">${agenda(v)}</div><div class="abs confirmation caps" style="${pos(l.confirmation)}">${esc(spec.copy.confirmation)}</div></div><button id="rsvpBtn" class="rsvpBtn" style="${pos(l.rsvp)}"><span>${esc(spec.copy.button)}</span><span>›</span></button></div>`}function openRSVP(){const g=q.get('g')||'';$('rsvpFrame').src=spec.integration.rsvpEngine+'?guest=1&t='+encodeURIComponent(TOKEN)+(g?'&g='+encodeURIComponent(g):'')+'&embed=1&from=essential-01&v='+Date.now();$('modal').classList.add('on');document.body.style.overflow='hidden'}function closeRSVP(){$('modal').classList.remove('on');document.body.style.overflow='';setTimeout(()=>$('rsvpFrame').src='about:blank',120)}function patch(){try{const d=$('rsvpFrame').contentDocument;if(!d)return;let s=d.getElementById('e1embed');if(!s){s=d.createElement('style');s.id='e1embed';d.head.appendChild(s)}s.textContent='.back,.brand,.hero,#admin{display:none!important}.wrap{max-width:none!important;padding:14px 16px 70px!important}#public{display:block!important}'}catch{}}async function publicMode(){document.body.className='public';await Promise.all([loadSpec(),loadCfg()]);$('mount').innerHTML=render();$('rsvpBtn').onclick=openRSVP}function guestUrl(){const u=new URL('guests-rsvp-essential-01.html',location.href);u.searchParams.set('guest','1');u.searchParams.set('t',TOKEN);u.searchParams.set('v','3');return u}async function adminMode(){document.body.className='admin';await loadSpec();$('previewFrame').src=guestUrl()+'&preview=1';$('adminFrame').src='guests-rsvp-v105-mobile.html?v=essential-01-v3';$('openPreview').onclick=()=>window.open(guestUrl(),'_blank','noopener');$('back').onclick=()=>history.length>1?history.back():location.href='guests-personalized-functional-v5.html#invitados'}$('closeModal').onclick=closeRSVP;$('modal').onclick=e=>{if(e.target===$('modal'))closeRSVP()};$('rsvpFrame').addEventListener('load',()=>{patch();setTimeout(patch,180)});PUBLIC?publicMode():adminMode()})();</script></body></html>
