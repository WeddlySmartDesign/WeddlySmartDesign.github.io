<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests · Essential 1</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet"><style>:root{--g:#916923;--i:#594c3b;--p:#f3efe6}*{box-sizing:border-box}html,body{margin:0;background:#e9e4db;color:var(--i);font-family:'DM Sans',sans-serif}button{font:inherit}#public,#admin{display:none}.public #public{display:block}.admin #admin{display:block}.invite{width:min(100%,680px);margin:auto;background:var(--p)}.sheet{position:relative;width:100%;container-type:inline-size;overflow:hidden}.base{display:block;width:100%;height:auto}.layer{position:absolute;inset:0;pointer-events:none}.slot{position:absolute;display:grid;place-items:center;text-align:center}.script{font-family:'Pinyon Script',cursive;color:var(--g)}.serif{font-family:'Cormorant Garamond',serif}.caps{text-transform:uppercase;letter-spacing:.18em;font-weight:700;color:#805e28}.brand{font-size:1.85cqw;letter-spacing:.16em;text-align:left;justify-items:start}.tier{border:1px solid #b89558;border-radius:99px;background:#fffdf899;font:500 2.7cqw/1 'Cormorant Garamond',serif;color:#74572b}.heroTitle{font-size:10.8cqw;line-height:.9}.heroSub{font-size:2.15cqw;line-height:1.5}.names{font-size:8.3cqw;line-height:1}.fact{font-size:1.82cqw;line-height:1.35;color:#7a5a26;letter-spacing:.12em;text-transform:uppercase;font-weight:700}.time,.venue{border-left:1px solid #b48a47}.wait{font-size:1.95cqw;letter-spacing:.2em}.city{font:500 2.25cqw/1 'Cormorant Garamond',serif}.agendaLabel{font-size:1.78cqw;letter-spacing:.2em;justify-items:start}.agendaTitle{font-size:6.2cqw;justify-items:start}.message{font-size:1.5cqw;color:#6c6254}.rsvpCaption{font-size:1.45cqw;letter-spacing:.16em}.photo{position:absolute;overflow:hidden;clip-path:polygon(50% 100%,9% 62%,3% 45%,4% 29%,12% 16%,24% 8%,37% 8%,50% 18%,63% 8%,76% 8%,88% 16%,96% 29%,97% 45%,91% 62%)}.photo img{width:100%;height:100%;object-fit:cover}.hot{position:absolute;z-index:5;border:0;background:transparent;color:transparent;cursor:pointer}.modal{position:fixed;inset:0;z-index:100;background:#0008;display:none;align-items:flex-end}.modal.on{display:flex}.panel{width:min(100%,660px);height:min(92vh,900px);margin:auto;background:#f5f1ea;border-radius:24px 24px 0 0;overflow:hidden}.mhead{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid #ddd5c8;font-weight:800}.mhead button{border:0;width:40px;height:40px;border-radius:50%;background:#eee8df;font-size:22px}.modal iframe{width:100%;height:calc(100% - 60px);border:0}.top{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd5c8;padding:11px 14px;display:flex;gap:12px;align-items:center}.top button{border:0;border-radius:15px;background:#eee8df;padding:11px 14px;font-weight:800}.adminPage{max-width:790px;margin:auto;padding:16px 12px 60px}.card{background:#fff;border:1px solid #dbd1c2;border-radius:24px;padding:16px;margin-bottom:18px}.head{display:flex;justify-content:space-between;gap:14px;align-items:center}.head h2{margin:0;font:500 31px 'Cormorant Garamond',serif}.head p{margin:4px 0 0;color:#716c65;font-size:13px}.head button{border:0;border-radius:14px;background:#2c2a26;color:#fff;padding:12px 14px;font-weight:800}.preview{height:560px;margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid #ddd1bf}.preview iframe,.editor iframe{width:100%;height:100%;border:0}.editor{height:1350px}.note{font-size:13px;color:#6e675f;padding:12px 14px;background:#f4efe8;border-radius:14px;margin-bottom:14px}@media(max-width:520px){.head{display:block}.head button{width:100%;margin-top:12px}.preview{height:500px}}</style></head><body><div id="public"><main class="invite"><div id="mount"></div></main></div><div id="admin"><header class="top"><button id="back">← Volver</button><div><b>RSVP</b><div style="font-size:12px;color:#726d67">Essential 1</div></div></header><main class="adminPage"><section class="card"><div class="head"><div><h2>Essential 1</h2><p>Plantilla exacta + datos editables + RSVP real de Guests.</p></div><button id="openPreview">Ver como invitado</button></div><div class="preview"><iframe id="previewFrame"></iframe></div></section><div class="note"><b>Conectado a Guests.</b> Mantiene guest_key, preguntas, envíos y respuestas.</div><div class="card editor"><iframe id="adminFrame"></iframe></div></main></div><div class="modal" id="modal"><div class="panel"><div class="mhead"><span>Confirmación de asistencia</span><button id="closeModal">×</button></div><iframe id="rsvpFrame"></iframe></div></div><script>(()=>{const q=new URLSearchParams(location.search),PUBLIC=q.get('guest')==='1'||q.get('preview')==='1',PT='sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8',TOKEN=q.get('t')||PT,API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp';let spec,cfg={title:'Nuestra boda',date:'',time:'',venue:'',intro:'',questions:{}};const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),pos=o=>`left:${o.x}%;top:${o.y}%;width:${o.w}%;height:${o.h}%`;async function loadSpec(){spec=await fetch('essential-01.config.json?v=2',{cache:'no-store'}).then(r=>r.json());if(spec.base.allowLegacyFallback!==false)throw Error('bad_contract');const chunks=await Promise.all(spec.base.chunks.map(p=>fetch(p+'?v=2',{cache:'no-store'}).then(r=>r.text())));spec.base.data='data:'+spec.base.mime+';base64,'+chunks.join('').replace(/\s+/g,'');}async function loadCfg(){try{const x=await fetch(API+'?token='+encodeURIComponent(TOKEN),{cache:'no-store'}).then(r=>r.json());if(x?.ok&&x.form?.config)cfg={...cfg,...x.form.config,questions:{...cfg.questions,...x.form.config.questions}}}catch{}}function venue(){const a=String(cfg.venue||'').split(',');return{main:(a.shift()||'').trim(),city:a.join(',').trim()}}function date(){const s=String(cfg.date||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const d=new Date(s+'T12:00:00');return d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}).toUpperCase()}return s.toUpperCase()}function cls(id){if(['heroTitle','names','agendaTitle'].includes(id))return'script';if(['brand','heroSub','wait','agendaLabel','rsvpCaption'].includes(id))return'caps';if(id==='city')return'serif';if(['date','time','venue'].includes(id))return'fact';return''}function val(id,o){const v=venue();if(o.role==='static')return o.value||'';if(o.role==='title')return cfg.title||'';if(o.role==='date')return date();if(o.role==='time')return cfg.time?String(cfg.time).toUpperCase():'';if(o.role==='venue')return v.main.toUpperCase();if(o.role==='city')return v.city;if(o.role==='intro')return cfg.intro||'';return''}function slot(id,o){if(o.role==='photoUrl'){const src=cfg.photoUrl||cfg.photo||'';return src?`<div class="photo" style="${pos(o)}"><img src="${esc(src)}"></div>`:''}const v=val(id,o);if(!v&&o.optional)return'';return`<div class="slot ${cls(id)} ${id}" style="${pos(o)}">${esc(v).replace(/\n/g,'<br>')}</div>`}function render(){const h=spec.hotspots.rsvp;return`<div class="sheet"><img class="base" src="${spec.base.data}" width="1090" height="1536"><div class="layer">${Object.entries(spec.slots).map(([id,o])=>slot(id,o)).join('')}</div><button id="rsvpBtn" class="hot" style="${pos(h)}">Confirmar asistencia</button></div>`}function openRSVP(){const g=q.get('g')||'';$('rsvpFrame').src=spec.integration.rsvpEngine+'?guest=1&t='+encodeURIComponent(TOKEN)+(g?'&g='+encodeURIComponent(g):'')+'&embed=1&from=essential-01&v='+Date.now();$('modal').classList.add('on')}function patch(){try{const d=$('rsvpFrame').contentDocument;if(!d)return;let s=d.getElementById('e1embed');if(!s){s=d.createElement('style');s.id='e1embed';d.head.appendChild(s)}s.textContent='.back,.brand,.hero,#admin{display:none!important}.wrap{max-width:none!important;padding:14px 16px 70px!important}#public{display:block!important}'}catch{}}async function publicMode(){document.body.className='public';await Promise.all([loadSpec(),loadCfg()]);$('mount').innerHTML=render();$('rsvpBtn').onclick=openRSVP}function guestUrl(){const u=new URL('guests-rsvp-essential-01.html',location.href);u.searchParams.set('guest','1');u.searchParams.set('t',TOKEN);u.searchParams.set('v','2');return u}async function adminMode(){document.body.className='admin';await loadSpec();$('previewFrame').src=guestUrl()+'&preview=1';$('adminFrame').src='guests-rsvp-v105-mobile.html?v=essential-01-v2';$('openPreview').onclick=()=>window.open(guestUrl(),'_blank','noopener');$('back').onclick=()=>history.length>1?history.back():location.href='guests-personalized-functional-v5.html#invitados'}$('closeModal').onclick=()=>{$('modal').classList.remove('on');$('rsvpFrame').src='about:blank'};$('rsvpFrame').addEventListener('load',()=>{patch();setTimeout(patch,180)});PUBLIC?publicMode():adminMode()})();</script></body></html>
