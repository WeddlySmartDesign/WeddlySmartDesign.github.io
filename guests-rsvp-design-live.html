<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WeddlySmartDesign · RSVP</title><style>html,body{margin:0;background:#f6f4f0;font-family:system-ui}main{max-width:560px;margin:auto;padding:32px;color:#5f5a54}.card{margin-top:18vh;background:#fff;border:1px solid #e1ddd6;border-radius:20px;padding:24px;text-align:center}h1{font:500 28px Georgia,serif;color:#49453f;margin:0 0 10px}p{font-size:14px;line-height:1.5;color:#746e67}</style></head><body><main id="msg">Cargando invitación…</main><script>(()=>{const P='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-personalization',q=new URLSearchParams(location.search),t=q.get('t')||'',m=document.getElementById('msg');const go=p=>location.replace(p+location.search+location.hash);const unavailable=()=>{m.innerHTML='<div class="card"><h1>Esta invitación ya no está disponible</h1><p>El acceso asociado a esta boda ha finalizado.</p></div>'};if(!t){go('guests-rsvp-essential-live.html');return}fetch(P+'?token='+encodeURIComponent(t),{cache:'no-store'}).then(async r=>({ok:r.ok,x:await r.json().catch(()=>({}))})).then(({ok,x})=>{if(!ok||!x?.ok){unavailable();return}go(x?.personalization?.tier==='signature'?'guests-rsvp-signature-live.html':'guests-rsvp-essential-live.html')}).catch(()=>{m.innerHTML='<div class="card"><h1>No se ha podido abrir la invitación</h1><p>Comprueba la conexión y vuelve a intentarlo.</p></div>'})})();</script></body></html>
