name: QA Public Trial Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "one.html"
      - ".github/workflows/qa-public-trial-smoke.yml"

jobs:
  public-trial-smoke:
    if: github.head_ref == 'qa/public-trial-14d'
    runs-on: ubuntu-latest
    steps:
      - name: Exercise self-service trial request flow
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="qa-public-trial-${GITHUB_RUN_ID}@example.invalid"
          QA_ACCESS="https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-access-public-trial-qa"

          first="$(curl -sS -w '\n%{http_code}'             -H 'Origin: https://weddlysmartdesign.github.io'             -H 'Content-Type: application/json'             -d "{\"action\":\"public_trial\",\"email\":\"$EMAIL\",\"qaSkipEmail\":true}"             "$QA_ACCESS")"
          first_status="$(printf '%s' "$first" | tail -n1)"
          first_body="$(printf '%s' "$first" | sed '$d')"
          test "$first_status" = "201"
          FIRST_BODY="$first_body" python3 - <<'PY'
import json,os
x=json.loads(os.environ["FIRST_BODY"])
assert x.get("ok") is True
assert x.get("created") is True
assert x.get("product")=="full"
assert x.get("days")==14
assert x.get("emailSent") is True
assert "activationCode" not in x
assert "testerLink" not in x
PY

          second="$(curl -sS -w '\n%{http_code}'             -H 'Origin: https://weddlysmartdesign.github.io'             -H 'Content-Type: application/json'             -d "{\"action\":\"public_trial\",\"email\":\"$EMAIL\",\"qaSkipEmail\":true}"             "$QA_ACCESS")"
          second_status="$(printf '%s' "$second" | tail -n1)"
          second_body="$(printf '%s' "$second" | sed '$d')"
          test "$second_status" = "200"
          SECOND_BODY="$second_body" python3 - <<'PY'
import json,os
x=json.loads(os.environ["SECOND_BODY"])
assert x.get("ok") is True
assert x.get("alreadyExists") is True
assert x.get("product")=="full"
assert x.get("days")==14
assert "activationCode" not in x
assert "testerLink" not in x
PY

          invalid="$(curl -sS -w '\n%{http_code}'             -H 'Origin: https://weddlysmartdesign.github.io'             -H 'Content-Type: application/json'             -d '{"action":"public_trial","email":"not-an-email","qaSkipEmail":true}'             "$QA_ACCESS")"
          test "$(printf '%s' "$invalid" | tail -n1)" = "400"

          forbidden="$(curl -sS -w '\n%{http_code}'             -H 'Origin: https://example.com'             -H 'Content-Type: application/json'             -d '{"action":"public_trial","email":"qa-blocked@example.invalid","qaSkipEmail":true}'             "$QA_ACCESS")"
          test "$(printf '%s' "$forbidden" | tail -n1)" = "403"

          echo "PUBLIC_TRIAL_REQUEST_SMOKE_OK"
