name: GUEST Public Link Smoke — Read Only
on:
  push:
    branches: [guest-finalization-candidate-2026-10-22]
    paths:
      - '.github/workflows/guest-public-link-smoke-2026-10-22.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check immutable and branch candidate routes
        shell: bash
        run: |
          set -euo pipefail
          for prefix in \
            'https://b9fa74ec.guest-weddlysmartdesign.pages.dev' \
            'https://guest-finalization-candidate.guest-weddlysmartdesign.pages.dev'; do
            echo "Checking GUEST candidate route: ${prefix}/guest/index.html"
            curl --fail --location --silent --show-error --retry 2 --max-time 15 \
              --output /tmp/guest-page.html --write-out 'HTTP %{http_code}; URL %{url_effective}; bytes %{size_download}\n' \
              "${prefix}/guest/index.html"
            grep -q 'GUEST by WeddlySmartDesign' /tmp/guest-page.html
            grep -q 'guest' /tmp/guest-page.html
            echo 'PASS GUEST candidate page HTML served'
          done
      - name: Check stable production URL without making changes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 15 \
             --output /tmp/guest-production.html --write-out 'HTTP %{http_code}; URL %{url_effective}; bytes %{size_download}\n' \
             'https://guest-weddlysmartdesign.pages.dev/guest/index.html'
          grep -q 'GUEST by WeddlySmartDesign' /tmp/guest-production.html
          echo 'PASS stable GUEST URL serves an app shell; not proof of latest candidate or license'
