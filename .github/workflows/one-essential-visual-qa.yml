name: ONE Essential Visual QA

on:
  push:
    branches:
      - fix-one-essentials-premium-2026-10-01
    paths:
      - 'guests-rsvp-essential-*.html'
      - 'guests-essential-one-v4.css'
      - 'guests-personalizacion-essential.html'
      - 'weddly-personalizacion-essential.html'
      - 'qa/one-essential-visual-qa.js'
      - '.github/workflows/one-essential-visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  essential-mobile-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Locate Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium-browser)" >> "$GITHUB_ENV"
          else
            echo "No Chrome/Chromium found" >&2
            exit 1
          fi
      - name: Start local server
        run: |
          python3 -m http.server 8765 >/tmp/one-essential-http.log 2>&1 &
          echo $! > /tmp/one-essential-http.pid
          sleep 2
      - name: Run mobile visual QA
        run: node qa/one-essential-visual-qa.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: one-essential-mobile-qa
          path: qa-artifacts/
          if-no-files-found: warn
