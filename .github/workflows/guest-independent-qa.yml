name: GUEST Independent QA
on:
  push:
    branches: [guest-independent]
    paths:
      - 'guest/**'
      - 'guest*.html'
      - '.github/workflows/guest-independent-qa.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GUEST independence and parity gate
        run: node guest/qa/guest_independent_regression_test.js

  b6-shell-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve GUEST branch
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/guest-http.log 2>&1 &
          echo $! > /tmp/guest-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/guest/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/guest-http.log
          exit 1
      - name: B6.1 shell mobile QA
        run: node guest/qa/b6_1_shell_mobile_test.js

