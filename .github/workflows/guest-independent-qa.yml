name: GUEST Independent QA
on:
  push:
    branches: [guest-independent]
    paths:
      - 'guest/**'
      - 'guest*.html'
      - '.github/workflows/guest-independent-qa.yml'
  workflow_dispatch:
concurrency:
  group: guest-independent-matrix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: GUEST independence and parity gate
        run: node guest/qa/guest_independent_regression_test.js
      - name: Catalog 8-design commercial preflight (report only; sales remain off)
        run: node guest/qa/catalog_commercial_go_no_go_2026_10_20.cjs
      - name: Verify original Claude candidate blobs (TEST only)
        run: node guest/tests/claude_designs_import_integrity_2026_10_20.test.cjs
      - name: Verify seven extra Claude D10–D16 designs without sales approval
        run: node guest/tests/claude_d10_d16_integrity_2026_10_20.test.cjs
      - name: Stage all 13 Claude skin media under 25 MiB (private CI, NEVER deploy)
        run: node guest/tests/claude_asset_stage_2026_10_20.test.cjs
      - name: Catalog RSVP config lock (staged source; offline)
        run: node guest/tests/guest_rsvp_config_lock_contract.test.cjs
      - name: Catalog invitation authoring permission guard (offline)
        run: node guest/tests/guest_personalization_config_lock_contract.test.cjs
      - name: Catalogue questionnaire RSVP first-activation mapping (offline)
        run: node guest/tests/catalog_questionnaire_rsvp_first_access.test.cjs
      - name: Catalogue final-delivery-only activation (offline)
        run: node guest/tests/catalog_license_delivery_gate_contract.test.cjs
      - name: All 15 candidate design IDs gated TEST-ONLY in backend
        run: node guest/tests/test_only_15_design_backend_gate.test.cjs
      - name: Individual-design Stripe amount and tax contract
        run: node guest/tests/individual_design_checkout_pricing_contract.test.cjs

  catalog-invitation-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Catalog invitation bridge contract
        run: node guest/qa/catalog_invitation_bridge_test.js
      - name: Limoneros secured REAL owner TEST E2E protocol (static only)
        run: node guest/tests/owner_limoneros_full_e2e_contract.test.cjs

  b6-shell-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve GUEST branch
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/guest-http.log 2>&1 &
          echo $! > /tmp/guest-http.pid
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/guest/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/guest-http.log
          exit 1
      - name: B6.1 shell mobile QA
        run: node guest/qa/b6_1_shell_mobile_test.js

