name: GUEST Botánica contract QA (offline)
on:
  push:
    branches: [guest-independent]
    paths:
      - 'guest/tests/botanica_catalog_bridge_offline.test.cjs'
      - 'guest/qa/catalog_admission_gate.cjs'
      - 'guest/tests/catalog_admission_gate_test.cjs'
      - 'guest/GUEST_CATALOG_ADMISSION_EVIDENCE_V1.json'
      - 'guest/GUEST_CATALOG_OWNER_RENDERERS_V2.json'
      - 'guest/catalog/**'
      - 'guest/tools/register_visual_template.cjs'
      - 'guest/tools/generate_backend_catalog_registry.cjs'
      - 'guest/templates/_example/**'
      - 'guest/qa/catalog_preflight_v2.cjs'
      - 'guest/qa/visual_plugin_system_contract.cjs'
      - 'guest/tests/visual_plugin_onboarding.test.cjs'
      - 'guest/tests/owner_viewer_generic.test.cjs'
      - 'guest/tests/backend_catalog_generation.test.cjs'
      - 'guest/GUEST_INVITATION_CONFIG_SCHEMA_V1.json'
      - 'guest/tests/botanica_catalog_manifest_guard.test.cjs'
      - 'guest/GUEST_D02_BOTANICA_ARTIFACT_MANIFEST_V3_2026-10-09.json'
      - 'guest/GUEST_D02_BOTANICA_READ_FIRST.md'
      - 'guest/GUEST_CATALOG_TEMPLATE_REGISTRY_V1.json'
      - 'guest/guest-catalog-template-botanica-adapter-v1.js'
      - 'guest/guest-catalog-delivery-runtime-v1.js'
      - 'guest/tools/build_catalog_delivery.js'
      - '.github/workflows/guest-botanica-contract-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-offline:
    name: Registro, adaptador y puente RSVP simulados
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar contrato Botánica sin datos ni red
        run: |
          node guest/tests/botanica_catalog_bridge_offline.test.cjs
          node guest/tests/botanica_catalog_manifest_guard.test.cjs
          node guest/qa/catalog_preflight_v2.cjs
