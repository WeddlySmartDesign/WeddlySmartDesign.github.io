name: GUEST Catalog and Continuity QA (offline)
on:
  push:
    branches: [guest-independent]
    paths:
      - 'guest/**'
      - '.github/workflows/guest-botanica-contract-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-offline:
    name: Shared visual contract, catalog, handoff and anti-regression
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated catalog/RSVP contract and admission
        run: |
          node guest/tests/botanica_catalog_bridge_offline.test.cjs
          node guest/tests/botanica_catalog_manifest_guard.test.cjs
          node guest/qa/catalog_preflight_v2.cjs
      - name: Prepare test-only backend candidate without deployment and reject unsafe drift
        run: |
          node guest/tests/prepare_backend_test_only_v13.test.cjs
          node guest/tests/invitation_config_schema_contract.test.cjs
          node guest/tests/backend_config_contract_v1.test.cjs
      - name: Verify one recovery state and deliberate failure mutations
        run: |
          node guest/qa/handoff_gate.cjs
          node guest/tests/handoff_gate_test.cjs
