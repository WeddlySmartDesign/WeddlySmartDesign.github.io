name: GUEST Free Isolated Supabase Smoke (NO LIVE)
on:
  push:
    branches: [guest-independent]
    paths:
      - .github/workflows/guest-isolated-free-smoke.yml
      - guest/qa/isolated_free/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-free-supabase-smoke
  cancel-in-progress: true

jobs:
  isolated-local-stack:
    name: Free runner + disposable local Supabase, no credentials
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      SUPABASE_ACCESS_TOKEN: ""
      SUPABASE_DB_PASSWORD: ""
      SUPABASE_PROJECT_ID: ""
      SUPABASE_URL: ""
      WEDDLY_SITE_ORIGIN: "https://guest-ci-local.invalid"
    steps:
      - uses: actions/checkout@v4
      - name: Confirm completely isolated public-runner boundary
        shell: bash
        run: |
          set -euo pipefail
          test -z "${SUPABASE_ACCESS_TOKEN}"
          test -z "${SUPABASE_DB_PASSWORD}"
          test -z "${SUPABASE_PROJECT_ID}"
          test -z "${SUPABASE_URL}"
          test ! -e supabase/config.toml
          docker info --format 'Docker server reachable: {{.ServerVersion}}'
          echo 'NO PRODUCTION CREDENTIALS; ONLY DISPOSABLE LOCAL RUNNER'
      - uses: supabase/setup-cli@v3
      - name: Initialize ephemeral Supabase project on runner
        run: |
          set -euo pipefail
          supabase init
          mkdir -p supabase/migrations
          cp guest/qa/isolated_free/001_guest_minimal_fixture.sql supabase/migrations/20261010000100_guest_isolated_ci_fixture.sql
          mkdir -p supabase/functions/guest-invitation-flow
          node guest/tools/prepare_test_only_backend_v13.cjs --input guest/qa/isolated_free/edge_guest_flow_v12_readonly_snapshot.ts --output /tmp/guest-v13-pristine-ci.ts
          node guest/qa/isolated_free/patch_local_signed_https.cjs /tmp/guest-v13-pristine-ci.ts supabase/functions/guest-invitation-flow/index.ts
          test -s supabase/functions/guest-invitation-flow/index.ts
          mkdir -p supabase/functions/guest-rsvp
          cp guest/qa/isolated_free/edge_guest_rsvp_v4_readonly_snapshot.ts supabase/functions/guest-rsvp/index.ts
          test -s supabase/functions/guest-rsvp/index.ts
      - name: Boot local isolated Supabase services
        run: |
          set -euo pipefail
          supabase start
          supabase status > /dev/null
          echo 'PASS: local Supabase stack started on disposable public GitHub runner'
      - name: Exercise local-only GUEST order and RSVP persistence
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          supabase status -o env \
            --override-name api.url=GUEST_LOCAL_API_URL \
            --override-name auth.service_role_key=GUEST_LOCAL_SERVICE_ROLE_KEY \
            --override-name auth.anon_key=GUEST_LOCAL_ANON_KEY > local-only-env.txt
          node guest/qa/isolated_free/verify_local_backend.cjs local-only-env.txt
          rm -f local-only-env.txt
      - name: Exercise REAL generated V13 Edge runtime with no remote connection
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          supabase status -o env --override-name api.url=GUEST_LOCAL_API_URL --override-name auth.anon_key=GUEST_LOCAL_ANON_KEY --override-name auth.service_role_key=GUEST_LOCAL_SERVICE_ROLE_KEY > local-api-env.txt
          supabase status -o env >> local-api-env.txt
          printf 'WEDDLY_SITE_ORIGIN=https://guest-ci-local.invalid\\n' > local-site-env.txt
          supabase functions serve --no-verify-jwt --env-file local-site-env.txt > /tmp/guest-v13-local-only.log 2>&1 &
          edge_pid=$!
          trap 'kill "$edge_pid" 2>/dev/null || true; rm -f local-api-env.txt local-site-env.txt /tmp/guest-v13-local-only.log' EXIT
          node guest/qa/isolated_free/verify_v13_runtime.cjs local-api-env.txt
          if ! node guest/qa/isolated_free/verify_v13_two_botanica_orders.cjs local-api-env.txt; then
            echo 'Sanitized local V13 error classes (never credentials or signed URLs):'
            grep -Eo 'ci_signed_url_(invalid|outside_loopback)|missing_signed_asset|invalid_invitation_media|invalid_invitation_config|TypeError|ReferenceError' /tmp/guest-v13-local-only.log | sort -u || true
            exit 1
          fi
          node guest/qa/isolated_free/verify_rsvp_actual_edge.cjs local-api-env.txt
          node guest/qa/isolated_free/verify_v13_member_handoff_actual_rsvp.cjs local-api-env.txt
      - name: Stop local-only stack
        if: always()
        shell: bash
        run: |
          supabase stop > /dev/null 2>&1 || true
          echo 'Runner disposable: no Supabase cloud project was created, modified or contacted'
