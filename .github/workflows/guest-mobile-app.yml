name: Build GUEST Mobile Center APK

on:
  push:
    branches: [guest-independent]
    paths:
      - 'guest/mobile-app/**'
      - '.github/workflows/guest-mobile-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p guest/mobile-app assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GUEST-Mobile-Center-APK
          path: guest/mobile-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
