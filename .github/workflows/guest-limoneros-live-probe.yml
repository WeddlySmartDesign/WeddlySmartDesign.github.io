name: GUEST Limoneros Live Probe (TEST only)
on:
  push:
    branches: [guest-independent]
    paths: ['.github/workflows/guest-limoneros-live-probe.yml']
permissions:
  contents: write
concurrency:
  group: guest-limoneros-live-probe-once
  cancel-in-progress: false
jobs:
  verify-cloudflare-https:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest-independent
          persist-credentials: true
      - name: Check Cloudflare HTTPS real master, record evidence regardless of result
        run: |
          python3 - <<'PY'
          import hashlib,json,urllib.request,urllib.error,datetime
          from pathlib import Path
          p=Path('guest/qa-reports/limoneros_cloudflare_live_check.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          url='https://guest-weddlysmartdesign.pages.dev/guest/catalog-assets/design-03/1.0.0/index.html'
          expected='a6fa4d81f73e6b5c913f8fd3cd3d285327249ee631a8707d0635d447d0c96482'
          r={'schemaVersion':'guest-d03-cloudflare-probe-v1','checkedAtUtc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'url':url,'expectedSourceSha256':expected,'expectedSourceBytes':28673474,'commercialApproved':False,'testOnly':True}
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'GUEST-TEST-only-probe/1.0'})
              with urllib.request.urlopen(req,timeout=55) as response:
                  h=hashlib.sha256();size=0
                  while True:
                      b=response.read(1024*1024)
                      if not b:break
                      h.update(b);size+=len(b)
                  r.update(httpStatus=response.status,contentType=response.headers.get('Content-Type'),robots=response.headers.get('X-Robots-Tag'),bytes=size,sha256=h.hexdigest(),shaMatchesOriginal=(h.hexdigest()==expected and size==28673474))
                  r['online']=response.status==200 and size>1000000
          except Exception as e:
              r.update(online=False,error=f'{type(e).__name__}: {str(e)[:350]}')
          p.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(r,ensure_ascii=False,indent=2))
          PY
      - name: Commit evidence to isolated GUEST branch
        run: |
          git config user.name 'GUEST Test Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add guest/qa-reports/limoneros_cloudflare_live_check.json
          git commit -m 'test(guest): record actual Limoneros HTTPS availability, no sale' || exit 0
          git pull --rebase origin guest-independent
          git push origin HEAD:guest-independent
