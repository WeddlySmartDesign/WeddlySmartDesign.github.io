name: GUEST Cloudflare Full App Preview QA (NO SALE)
on:
  push:
    branches: [guest-cloudflare-full-app-preview-2026-10-22]
    paths:
      - 'guest/tools/build_catalog_static_preview.cjs'
      - '.github/workflows/guest-cloudflare-full-app-preview-2026-10-22.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-safe-app-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_PAGES_BRANCH: guest-cloudflare-full-app-preview-2026-10-22
      CLOUDFLARE_API_TOKEN: ''
      STRIPE_SECRET_KEY: ''
      RESEND_API_KEY: ''
      SUPABASE_ACCESS_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build same verified media plus full authorized GUEST app
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN" && test -z "$STRIPE_SECRET_KEY" && test -z "$RESEND_API_KEY" && test -z "$SUPABASE_ACCESS_TOKEN"
          node --check guest/tools/build_catalog_static_preview.cjs
          node guest/tools/build_catalog_static_preview.cjs --output "$RUNNER_TEMP/guest-full-app-preview" --template botanica
      - name: Validate application assets, catalog immutability, and previews
        env:
          OUT: ${{ runner.temp }}/guest-full-app-preview
        run: |
          python3 - <<'PY'
          import json,os,pathlib,hashlib,re
          d=pathlib.Path(os.environ['OUT'])
          manifest=json.loads((d/'GUEST_STAGE_MANIFEST.json').read_text())
          assert manifest['commercialApproved'] is False
          assert manifest['status']=='PREPRODUCTION_DO_NOT_SELL'
          assert manifest['fullGuestManagementPresent'] is True
          assert manifest['fullAppPreviewBranch']=='guest-cloudflare-full-app-preview-2026-10-22'
          known={x['name']:x for x in manifest['files']}
          for name in ('guest/index.html','guest/access.html','guest/guest-settings.html','guest/guests-v114-integrated.html','guest/guests-v081-visual-seating.html','guest/guests-events-v3.html','guest/guests-rsvp-v116-single-live.html','guest/guests-copy-control-v1.js','guest/guests-home-rsvp-status-v1.js','guest/guests-production-sync.js','guest/guests-access-layer.js','guest/catalog-assets/botanica/14.7/index.html'):
              assert name in known,name
              b=(d/name).read_bytes()
              assert len(b)==known[name]['size'] and hashlib.sha256(b).hexdigest()==known[name]['sha256'],name
          for name in ('guest/GUEST_PROJECT_STATUS_V1.json','guest/SOURCE_LOCK.json','guest/GUEST_AUDITORIA_PROFUNDA_HOY_NOTIFICACIONES_AJUSTES_2026-10-22.md'):
              assert not (d/name).exists(),name
          app=(d/'guest/index.html').read_text()
          scripts=re.findall(r'<script\s+src="([^"?]+)',app)
          assert len(scripts)>=20,len(scripts)
          assert all((d/'guest'/src).is_file() for src in scripts),[src for src in scripts if not (d/'guest'/src).is_file()]
          headers=(d/'_headers').read_text()
          assert 'X-Robots-Tag: noindex' in headers
          assert 'Content-Security-Policy:' in headers and 'connect-src' in headers
          assert "https://dnjsxequwgtyyauuofxj.supabase.co" in headers
          assert b'preproducci' in (d/'index.html').read_bytes()
          print('PASS full GUEST preview stage,',len(known),'exactly hashed files,',len(manifest['designs']),'untouched catalog designs,',len(scripts),'authorized scripts. NO SALE.')
          PY
