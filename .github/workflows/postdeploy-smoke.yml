name: Post-deploy smoke check
on:
  push:
    branches:
      - test/postdeploy-smoke-2026-09-11
jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait briefly for GitHub Pages propagation
        run: sleep 20
      - name: Check live production assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://weddlysmartdesign.github.io'
          NOW="$(date +%s)"
          fetch(){ curl -fLsS --retry 4 --retry-delay 5 --max-time 30 "$BASE/$1?smoke=$NOW"; }

          SW="$(fetch 'sw.js')"
          echo "$SW" | grep -q "weddly-v59-suite"

          GUESTS="$(fetch 'guests-v116-production.html')"
          echo "$GUESTS" | grep -q "guests-import-audit-v1.js"
          echo "$GUESTS" | grep -q "guests-service-visibility-v1.js"

          PUBLIC="$(fetch 'guests-rsvp-public-clean.html')"
          echo "$PUBLIC" | grep -q "guests-rsvp-v114-single-flex.html"
          echo "$PUBLIC" | grep -q "guests-rsvp-v115-wedding-flex-live.html"

          SINGLE="$(fetch 'guests-rsvp-v114-single-flex.html')"
          echo "$SINGLE" | grep -q "custom_answers"
          echo "$SINGLE" | grep -q "accommodation"
          echo "$SINGLE" | grep -q "lang"

          GROUP="$(fetch 'guests-rsvp-v115-wedding-flex-live.html')"
          echo "$GROUP" | grep -q "guests-rsvp-v112-wedding-flex.html"

          SERVICES="$(fetch 'suite-wedding-services-v1.js')"
          echo "$SERVICES" | grep -q "Wedding services"
          echo "$SERVICES" | grep -q "accommodationOffered"

          OPS="$(fetch 'guests-rsvp-operations-live.html')"
          echo "$OPS" | grep -q "guests-rsvp-share-primary-v1.js"
          echo "$OPS" | grep -q "guests-rsvp-operations-feedback-v1.js"

          echo 'All public production smoke checks passed.'
