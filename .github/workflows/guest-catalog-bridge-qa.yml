name: GUEST Catalog Bridge QA
on:
  push:
    branches: [guest-independent]
    paths:
      - 'guest/GUEST_CATALOG_TEMPLATE_REGISTRY_V1.json'
      - 'guest/GUEST_CATALOG_PIPELINE_CONTRACT_V1.md'
      - 'guest/guest-catalog-recipient-context-v1.js'
      - 'guest/guest-catalog-template-veil-light-adapter-v1.js'
      - 'guest/guest-catalog-delivery-runtime-v1.js'
      - 'guest/guests-catalog-invitation-bridge-v1.js'
      - 'guest/guests-rsvp-share-composer-v3.js'
      - 'guest/guests-rsvp-operations-live.html'
      - 'guest/qa/catalog_invitation_bridge_test.js'
      - 'guest/qa/catalog_customer_journey_test.js'
      - 'guest/tools/build_catalog_delivery.js'
      - 'guest/qa/catalog_delivery_builder_test.js'
      - 'guest/backend/guest-invitation-flow/index.ts'
      - 'guest/tests/test_only_15_design_backend_gate.test.cjs'
      - 'guest/tests/individual_design_checkout_pricing_contract.test.cjs'
      - 'guest/backend/guest-rsvp/index.ts'
      - 'guest/backend/guest-personalization/index.ts'
      - 'guest/tests/guest_personalization_config_lock_contract.test.cjs'
      - 'guest/tests/guest_rsvp_config_lock_contract.test.cjs'
      - 'guest/tests/catalog_questionnaire_rsvp_first_access.test.cjs'
      - 'guest/backend/guest-rsvp-ensure/index.ts'
      - 'guest/backend/guest-license-access/index.ts'
      - 'guest/tests/catalog_license_delivery_gate_contract.test.cjs'
      - 'guest/access.html'
      - '.github/workflows/guest-catalog-bridge-qa.yml'
  workflow_dispatch:
jobs:
  catalog-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node guest/qa/catalog_invitation_bridge_test.js
      - name: Catalog RSVP configuration permission guard (offline)
        run: node guest/tests/guest_rsvp_config_lock_contract.test.cjs
      - name: Catalog invitation authoring permission guard (offline)
        run: node guest/tests/guest_personalization_config_lock_contract.test.cjs
      - name: Catalogue questionnaire RSVP first-activation mapping (offline)
        run: node guest/tests/catalog_questionnaire_rsvp_first_access.test.cjs
      - name: Catalogue final-delivery-only activation (offline)
        run: node guest/tests/catalog_license_delivery_gate_contract.test.cjs
      - name: All 15 candidate design IDs gated TEST-ONLY in backend
        run: node guest/tests/test_only_15_design_backend_gate.test.cjs
      - name: Individual-design Stripe amount and tax contract
        run: node guest/tests/individual_design_checkout_pricing_contract.test.cjs
      - name: Catalog customer journey contract
        run: node guest/qa/catalog_customer_journey_test.js
      - name: Catalog delivery builder
        run: node guest/qa/catalog_delivery_builder_test.js
