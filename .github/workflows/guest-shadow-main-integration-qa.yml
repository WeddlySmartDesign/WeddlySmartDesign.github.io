name: GUEST shadow-main integration preflight (NO DEPLOY)
on:
  push:
    branches: [guest-independent]
    paths:
      - 'guest/qa/shadow_main_integration_preflight_2026_10_20.cjs'
      - '.github/workflows/guest-shadow-main-integration-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-combined-drafts-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ""
      STRIPE_SECRET_KEY: ""
      SUPABASE_ACCESS_TOKEN: ""
      RESEND_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch only the published main base and two PREVIEW-only drafts
        run: |
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/guest-management-main-bridge-draft-2026-10-20:refs/remotes/origin/guest-management-main-bridge-draft-2026-10-20 \
            +refs/heads/guest-individual-storefront-draft-2026-10-20:refs/remotes/origin/guest-individual-storefront-draft-2026-10-20
      - name: Verify no deployment or live external credentials
        run: |
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$STRIPE_SECRET_KEY"
          test -z "$SUPABASE_ACCESS_TOKEN"
          test -z "$RESEND_API_KEY"
      - name: Prove 32 GUEST management and 4 storefront files compose with current main
        run: node guest/qa/shadow_main_integration_preflight_2026_10_20.cjs
      - name: Exercise catalog bridge behavioural contract in frozen source
        run: node guest/qa/catalog_invitation_bridge_test.js
      - name: Exercise individual checkout amount and test-only gates
        run: |
          node guest/tests/individual_design_checkout_pricing_contract.test.cjs
          node guest/tests/catalog_individual_design_release_gate.test.cjs
