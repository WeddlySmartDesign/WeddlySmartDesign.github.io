name: GUEST live integration preview security QA (NO SALE)
on:
  push:
    branches: [guest-independent]
    paths:
      - 'guest/qa/verify_guest_integration_preview_live_2026_10_20.py'
      - '.github/workflows/guest-integration-preview-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-integration-preview-live-qa
  cancel-in-progress: true

jobs:
  live-preview-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRIPE_SECRET_KEY: ''
      SUPABASE_ACCESS_TOKEN: ''
      RESEND_API_KEY: ''
      CLOUDFLARE_API_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - name: Verify no provider credentials
        shell: bash
        run: |
          test -z "$STRIPE_SECRET_KEY" && test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$RESEND_API_KEY" && test -z "$CLOUDFLARE_API_TOKEN"
      - name: Verify Cloudflare isolated PREVIEW HTTPS, headers, manifest and no data leak
        shell: bash
        run: |
          python3 -m py_compile guest/qa/verify_guest_integration_preview_live_2026_10_20.py
          python3 guest/qa/verify_guest_integration_preview_live_2026_10_20.py
