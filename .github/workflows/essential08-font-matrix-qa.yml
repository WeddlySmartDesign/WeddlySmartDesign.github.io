name: Essential 08 Font Matrix QA

on:
  push:
    branches:
      - fix-essential-08-font-system-2026-10-01
    paths:
      - 'preview-essential-08-modernist.html'
      - 'qa/essential08-font-matrix-qa.js'
      - '.github/workflows/essential08-font-matrix-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  font-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Locate Chrome
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_BIN=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "No Chrome/Chromium found" >&2
            exit 1
          fi
      - name: Start local server
        run: |
          python3 -m http.server 8765 >/tmp/e08-font-http.log 2>&1 &
          sleep 2
      - name: Run five-font matrix
        run: node qa/essential08-font-matrix-qa.js
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential08-five-fonts
          path: qa-artifacts/e08-fonts/
          if-no-files-found: warn
