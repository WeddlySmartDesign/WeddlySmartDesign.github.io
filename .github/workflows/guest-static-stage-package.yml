name: GUEST Precommercial Static Stage (NO LIVE)
on:
  workflow_dispatch:
  push:
    branches: [guest-independent]
    paths:
      - .github/workflows/guest-static-stage-package.yml
      - guest/tools/build_catalog_static_preview.cjs
      - guest/catalog-final.html
      - guest-review-v1.html
      - guest/catalog-questionnaire.html
      - guest/guest-catalog-delivery-runtime-v1.js
      - guest/catalog/guest-catalog-owner-viewer-v2.js
      - guest/GUEST_CATALOG_OWNER_RENDERERS_V2.json
      - guest/catalog-assets/**
      - guest/catalog-patches/**
      - guest/GUEST_PROJECT_STATUS_V1.json
      - guest/GUEST_CATALOG_OWNER_RENDERERS_V2.json
permissions:
  contents: read
concurrency:
  group: guest-static-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sealed-static-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ""
      VERCEL_TOKEN: ""
      SUPABASE_ACCESS_TOKEN: ""
      STRIPE_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static stage including verified immutable visual, without deployment credentials
        run: |
          set -euo pipefail
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$VERCEL_TOKEN"
          test -z "$SUPABASE_ACCESS_TOKEN"
          test -z "$STRIPE_SECRET_KEY"
          node --check guest/tools/build_catalog_static_preview.cjs
          node guest/tools/build_catalog_static_preview.cjs --output /tmp/guest-static-stage
          test -s /tmp/guest-static-stage/guest/catalog-final.html
          test -s /tmp/guest-static-stage/guest-review-v1.html
          test -s /tmp/guest-static-stage/guest/catalog-questionnaire.html
          test -s /tmp/guest-static-stage/guest/catalog-assets/botanica/14.7/index.html
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),assert=require('assert/strict');
          const root='guest/catalog-assets/botanica/14.7/source-chunks/';
          const stage='/tmp/guest-static-stage/';
          const manifest=JSON.parse(fs.readFileSync(stage+'GUEST_STAGE_MANIFEST.json'));
          const source=JSON.parse(fs.readFileSync(root+'manifest.json'));
          const sourceBytes=Buffer.concat(source.parts.map(p=>fs.readFileSync(root+p)));
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const original='fffd3e0fcd5eb2f0d2f4582957b5fdd7358294cbc509ecb3ca15f0089098ec7a';
          assert.equal(sha(sourceBytes),original,'Frozen Botánica master changed');
          assert.equal(manifest.botanica.masterSha256,original,'Wrong original design pin');
          const modified=fs.readFileSync(stage+'guest/catalog-assets/botanica/14.7/index.html','utf8');
          const patch=fs.readFileSync('guest/catalog-patches/botanica/14.7/patch.css','utf8');
          const nl=String.fromCharCode(10);
          const injection='<style id="guest-botanica-practical-seam-preview">'+nl+patch+nl+'</style>'+nl;
          assert.equal(modified.replace(injection,''),sourceBytes.toString('utf8'),'Stage changed beyond exact CSS-only patch');
          assert.equal(sha(Buffer.from(modified)),manifest.botanica.deployedHtmlSha256,'Stage SHA mismatch');
          assert.equal(manifest.commercialApproved,false);
          console.log('PASS: frozen Botánica original SHA unchanged, and exact CSS-only stage patch verified; NO SALE');
          NODE
          node -e "const f=require('/tmp/guest-static-stage/GUEST_STAGE_MANIFEST.json');if(f.status!=='PREPRODUCTION_DO_NOT_SELL'||!f.botanica.visualIncluded||f.commercialApproved)process.exit(1)"
          echo 'PASS precommercial static packaging. Frozen visual reconstructed from immutable chunks; SHA verified. NO SALE.'
      - name: Save platform-neutral stage (NOT LIVE)
        uses: actions/upload-artifact@v4
        with:
          name: guest-platform-neutral-static-stage-no-live
          path: /tmp/guest-static-stage/
          retention-days: 3
          if-no-files-found: error
