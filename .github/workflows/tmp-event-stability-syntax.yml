name: tmp-event-stability-syntax
on:
  push:
    branches:
      - hotfix/event-stability-access-2026-09-12
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check guests-events-stability-v1.js
          node --check guests-events-invite-addon-v1.js
          node --check guests-events-standalone-compat-v1.js
          node --check guests-access-layer.js
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('guests-rsvp-design-manage.html','utf8');
          const m=h.match(/<script>([\s\S]*?)<\/script>/);
          if(!m) throw new Error('inline script not found');
          new Function(m[1]);
          console.log('inline invitation manager syntax ok');
          NODE
