name: GUEST Stripe sandbox checkout isolation (NO LIVE)
on:
  push:
    branches: [guest-independent]
    paths:
      - 'guest/tools/prepare_stripe_sandbox_checkout_2026_10_20.cjs'
      - 'guest/qa/stripe_sandbox_checkout_isolated_contract_2026_10_20.cjs'
      - '.github/workflows/guest-stripe-sandbox-checkout-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-stripe-sandbox-checkout-qa
  cancel-in-progress: true

jobs:
  sandbox-runtime-no-network:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      STRIPE_SECRET_KEY: ''
      STRIPE_PUBLISHABLE_KEY: ''
      RESEND_API_KEY: ''
      CLOUDFLARE_API_TOKEN: ''
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify no live or test account secrets are injected
        run: |
          test -z "$STRIPE_SECRET_KEY" && test -z "$STRIPE_PUBLISHABLE_KEY"
          test -z "$RESEND_API_KEY" && test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$SUPABASE_ACCESS_TOKEN" && test -z "$SUPABASE_URL"
      - name: Install TypeScript transpiler on temporary runner only
        run: npm install --no-save --ignore-scripts typescript@5.9.3
      - name: Generate sandbox-only derivative of original checkout
        run: |
          node guest/tools/prepare_stripe_sandbox_checkout_2026_10_20.cjs --output /tmp/guest-stripe-sandbox-runtime-ci.ts
          test -s /tmp/guest-stripe-sandbox-runtime-ci.ts
      - name: Exercise Stripe LIVE denial, individual templates, metadata, idempotence and amount
        run: |
          node guest/qa/stripe_sandbox_checkout_isolated_contract_2026_10_20.cjs /tmp/guest-stripe-sandbox-runtime-ci.ts
      - name: Fail closed when a real Stripe TEST key was not deliberately supplied
        shell: bash
        run: |
          if node guest/qa/stripe_real_sandbox_unpaid_session_2026_10_20.cjs; then
            echo 'ERROR: real API test unexpectedly ran without a sandbox secret'
            exit 1
          fi
          echo 'PASS: real Stripe test session is impossible without a separately stored encrypted sk_test key'
      - name: Remove sandbox runtime
        if: always()
        run: rm -f /tmp/guest-stripe-sandbox-runtime-ci.ts
