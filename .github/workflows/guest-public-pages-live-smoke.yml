# Read-only rerun 2026-10-20 following the recovered 15-design catalog audit.
name: GUEST Public Cloudflare Pages Live Smoke (NO SALE)
on:
  push:
    branches: [guest-independent]
    paths:
      - guest/qa/public_cloudflare_pages_live_smoke.cjs
      - .github/workflows/guest-public-pages-live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guest-public-pages-smoke
  cancel-in-progress: true
jobs:
  public-preproduction-no-secrets:
    name: External HTTPS files match frozen Botánica and never enable sales
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      SUPABASE_ACCESS_TOKEN: ""
      STRIPE_SECRET_KEY: ""
      CLOUDFLARE_API_TOKEN: ""
      VERCEL_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify zero cloud/checkout write credentials
        run: |
          test -z "$SUPABASE_ACCESS_TOKEN"
          test -z "$STRIPE_SECRET_KEY"
          test -z "$CLOUDFLARE_API_TOKEN"
          test -z "$VERCEL_TOKEN"
      - name: Probe Cloudflare canonical static routes without following redirects
        shell: bash
        run: |
          set -euo pipefail
          for path in / /guest/catalog-questionnaire.html /guest-review-v1.html /guest/catalog-final.html /guest/catalog-assets/botanica/14.7/index.html /guest/GUEST_CATALOG_OWNER_RENDERERS_V2.json; do
            echo "PROBE $path"
            curl --silent --show-error --head --max-time 15 --write-out 'HTTP_CODE:%{http_code} REDIRECT:%{redirect_url} SIZE:%{size_download}\n' "https://guest-weddlysmartdesign.pages.dev$path" | grep -E '^(HTTP/|location:|Location:|content-type:|Content-Type:|HTTP_CODE:)' || true
          done
      - name: Check production Pages external HTTPS and exact frozen assets
        run: node guest/qa/public_cloudflare_pages_live_smoke.cjs
