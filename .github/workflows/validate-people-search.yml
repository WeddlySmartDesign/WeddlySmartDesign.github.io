name: Validate Guests people search
on:
  push:
    branches:
      - hotfix/guests-people-search-2026-09-11
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check people manager syntax
        run: node --check guests-people-manager-v1.js
      - name: Check loader and cache bump
        run: |
          grep -q 'guests-people-manager-v1.js?v=1' guests-v116-production.html
          grep -q "weddly-v60-suite" sw.js
