name: GUEST one real Stripe TEST unpaid checkout (MANUAL GATE)
on:
  push:
    branches: [guest-independent]
    paths:
      - '.github/workflows/guest-stripe-real-sandbox-unpaid-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guest-stripe-real-sandbox-unpaid-qa
  cancel-in-progress: true

jobs:
  real-stripe-sandbox-unpaid:
    if: false # NO Stripe requests until owner provides TEST key via encrypted GitHub Secrets and we enable deliberate one-shot gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GUEST_STRIPE_TEST_SECRET_KEY: ${{ secrets.GUEST_STRIPE_TEST_SECRET_KEY }}
      STRIPE_SECRET_KEY: ''
      SUPABASE_ACCESS_TOKEN: ''
      RESEND_API_KEY: ''
      CLOUDFLARE_API_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Abort if Stripe TEST secret is absent or LIVE/remote provider credentials are present
        shell: bash
        run: |
          test -z "$STRIPE_SECRET_KEY" -a -z "$SUPABASE_ACCESS_TOKEN"
          test -z "$RESEND_API_KEY" -a -z "$CLOUDFLARE_API_TOKEN"
          case "$GUEST_STRIPE_TEST_SECRET_KEY" in
            sk_test_*) ;;
            *) echo 'BLOCKED: only encrypted Stripe TEST secret allowed'; exit 1 ;;
          esac
      - name: Make exactly one UNPAID synthetic Checkout TEST session and verify mode/amount
        run: node guest/qa/stripe_real_sandbox_unpaid_session_2026_10_20.cjs
