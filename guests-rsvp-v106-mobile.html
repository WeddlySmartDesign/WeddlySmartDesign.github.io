<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><title>Weddly Smart Design · RSVP</title><style>:root{--bg:#f5f1ea;--paper:#fff;--line:#ddd5c8;--ink:#2c2a26;--muted:#706b65;--soft:#eee8df;--ok:#526b4d;--bad:#8a4035}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:640px;margin:auto;padding:24px 20px 80px}.brand{font-family:Georgia,serif;line-height:1.02;margin-bottom:22px}.brand b{display:block;font-size:20px;font-weight:500}.brand span{display:block;font-size:13px;margin-top:2px}h1{font:500 42px/1.05 Georgia,serif;margin:6px 0 8px}.lead{color:var(--muted);line-height:1.5;margin:0 0 22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}.unitHead{margin-bottom:18px}.unitHead b{font-size:17px}.unitHead span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.person{border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0;background:#fff}.personTitle{font-weight:850;font-size:16px;margin-bottom:10px}.choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;font-weight:750}.choice.sel{outline:2px solid var(--ink);background:var(--soft)}.details{display:none;margin-top:12px;padding-top:10px;border-top:1px solid #eee}.details.on{display:block}label{display:block;font-size:13px;font-weight:750;margin-top:8px}.field{width:100%;border:1px solid #ccc5bb;border-radius:12px;background:#fff;color:var(--ink);padding:13px;font-size:16px;margin:6px 0 10px}.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}.toggle input{width:22px;height:22px}.btn{width:100%;border:0;border-radius:13px;background:var(--ink);color:#fff;padding:14px 16px;font-size:16px;font-weight:800;margin-top:8px}.btn:disabled{opacity:.5}.notice{display:none;border-radius:13px;padding:12px;margin:12px 0;background:#f3e8dd;color:#7a5539;line-height:1.4}.notice.on{display:block}.notice.ok{background:#e7eee8;color:var(--ok)}.success{text-align:center;padding:70px 20px}.small{font-size:12px;color:var(--muted);line-height:1.45}@media(max-width:440px){h1{font-size:36px}.wrap{padding-left:16px;padding-right:16px}}</style></head><body><main class="wrap"><div class="brand"><b>Weddly</b><span>Smart Design</span></div><section id="app"><div class="card"><div class="small">Cargando vuestra invitación…</div></div></section></main><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp',q=new URLSearchParams(location.search),token=q.get('t')||'',unitId=q.get('u')||'';if(!unitId){location.replace('guests-rsvp-v105-mobile.html'+location.search+location.hash);return}const app=document.getElementById('app'),safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let cfg={},unit=null,answers={};async function j(url,opt={}){const r=await fetch(url,opt),x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||'request_failed');return x}function mealOptions(){return ['Estándar','Vegetariano','Vegano','Celíaco','Sin lactosa','Infantil','Sin menú'].map(x=>`<option>${x}</option>`).join('')}function render(){const members=unit?.members||[];app.innerHTML=`<div class="unitHead"><div class="small">RSVP</div><h1>${safe(unit?.label||'Vuestra invitación')}</h1><span>${members.length} persona${members.length===1?'':'s'} incluidas en esta invitación</span></div><div class="card"><p class="lead">Confirma a cada persona por separado. Así podremos actualizar correctamente mesas, catering y transporte.</p><div id="people">${members.map(m=>personHtml(m)).join('')}</div><div id="fb" class="notice"></div><button id="send" class="btn">Enviar respuestas</button></div>`;members.forEach(m=>wire(m));document.getElementById('send').onclick=submitAll}function personHtml(m){return `<section class="person" data-person="${safe(m.id)}"><div class="personTitle">${safe(m.name)}</div><div class="choiceRow"><button type="button" class="choice" data-answer="yes">Sí, asistiré</button><button type="button" class="choice" data-answer="no">No podré asistir</button></div><div class="details"><div class="mealBlock"><label>Menú</label><select class="field meal">${mealOptions()}</select></div><div class="allergyBlock"><label>Alergias o intolerancias</label><input class="field allergy" placeholder="Lo que debamos saber"></div><label class="toggle transportWrap"><span>Necesito transporte</span><input class="transport" type="checkbox"></label></div></section>`}function wire(m){const root=app.querySelector(`[data-person="${CSS.escape(m.id)}"]`),yes=root.querySelector('[data-answer="yes"]'),no=root.querySelector('[data-answer="no"]'),details=root.querySelector('.details');answers[m.id]={attend:null};const choose=v=>{answers[m.id].attend=v;yes.classList.toggle('sel',v===true);no.classList.toggle('sel',v===false);details.classList.toggle('on',v===true)};yes.onclick=()=>choose(true);no.onclick=()=>choose(false);if(cfg.questions?.meal===false)root.querySelector('.mealBlock').style.display='none';if(cfg.questions?.allergy===false)root.querySelector('.allergyBlock').style.display='none';if(cfg.transportOffered===false||cfg.questions?.transport===false)root.querySelector('.transportWrap').style.display='none'}async function submitAll(){const members=unit?.members||[],fb=document.getElementById('fb'),b=document.getElementById('send'),missing=members.filter(m=>answers[m.id]?.attend===null);if(missing.length){fb.className='notice on';fb.textContent='Indica si asistirá cada persona antes de enviar.';app.querySelector(`[data-person="${CSS.escape(missing[0].id)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});return}b.disabled=true;b.textContent='Enviando…';fb.className='notice';try{for(const m of members){const root=app.querySelector(`[data-person="${CSS.escape(m.id)}"]`),attend=answers[m.id].attend,meal=root.querySelector('.meal')?.value||'Sin menú',payload={action:'submit',token,client_submission_id:(crypto.randomUUID?crypto.randomUUID():'unit_'+Date.now()+'_'+Math.random().toString(36).slice(2)),guest_key:m.id,name:m.name,attend,age:null,meal_required:attend&&cfg.questions?.meal!==false?meal!=='Sin menú':null,meal:attend&&cfg.questions?.meal!==false&&meal!=='Sin menú'?meal:'',allergy:attend&&cfg.questions?.allergy!==false?(root.querySelector('.allergy')?.value.trim()||''):'',children:[],plusone_details:null,transport:attend&&!!root.querySelector('.transport')?.checked,transport_seats:attend&&root.querySelector('.transport')?.checked?1:0};await j(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})}app.innerHTML='<div class="success"><div class="small">RESPUESTAS ENVIADAS</div><h1>Gracias</h1><p class="lead">Las respuestas se han registrado correctamente.</p></div>'}catch(e){b.disabled=false;b.textContent='Enviar respuestas';fb.className='notice on';fb.textContent='No se han podido guardar todas las respuestas. Comprueba la conexión e inténtalo de nuevo.'}}async function init(){if(!token){app.innerHTML='<div class="card"><h1>RSVP no disponible</h1><p class="lead">Pide que te reenvíen la invitación.</p></div>';return}try{const x=await j(API+'?token='+encodeURIComponent(token)+'&unit='+encodeURIComponent(unitId));cfg=x.form?.config||{};unit=x.unit;if(!unit?.members?.length)throw new Error('unit_unavailable');render()}catch{app.innerHTML='<div class="card"><h1>RSVP no disponible</h1><p class="lead">Prueba de nuevo o pide que te reenvíen la invitación.</p></div>'}}init()})();</script></body></html>
