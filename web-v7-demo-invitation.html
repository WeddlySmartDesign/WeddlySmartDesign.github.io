<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Invitación · Weddly Smart Design</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efece5}.stage{position:absolute;left:50%;top:0;width:1120px;height:820px;transform-origin:top center}.stage iframe{width:1120px;height:820px;border:0;background:#f6f4f0;display:block}.load{position:fixed;inset:0;display:grid;place-items:center;font:600 13px system-ui;color:#746f67;background:#efece5;z-index:3}</style></head><body><div id="load" class="load">Cargando editor de invitación…</div><div class="stage" id="stage"><iframe id="f" src="weddly-personalizacion-essential.html?v=essential-6-rev2-20260909" title="Editor real de invitación Essential"></iframe></div><script>(()=>{const st=document.getElementById('stage'),f=document.getElementById('f'),load=document.getElementById('load');function fit(){const s=Math.min(innerWidth/1120,innerHeight/820);st.style.transform=`translateX(-50%) scale(${s})`}addEventListener('resize',fit);fit();const fire=(el,type='input')=>el?.dispatchEvent(new Event(type,{bubbles:true}));f.addEventListener('load',()=>{load.remove();try{const d=f.contentDocument,p1=d.getElementById('p1'),p2=d.getElementById('p2'),date=d.getElementById('date'),venue=d.getElementById('venue');if(p1&&!p1.value){p1.value='Elena';fire(p1)}if(p2&&!p2.value){p2.value='Marco';fire(p2)}if(date&&!date.value){date.value='2027-06-12';fire(date,'change')}if(venue&&!venue.value){venue.value='Finca del Valle';fire(venue)}}catch{}},{once:true})})();</script></body></html>
