<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Invitación · Weddly Smart Design</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efece5}#f{width:100%;height:100%;border:0;background:#f6f4f0;display:block}.load{position:fixed;inset:0;display:grid;place-items:center;font:600 13px system-ui;color:#746f67;background:#efece5;z-index:3}</style></head><body><div id="load" class="load">Cargando editor de invitación…</div><iframe id="f" src="weddly-personalizacion-essential.html?v=essential-6-rev2-20260909" title="Editor real de invitación Essential"></iframe><script>(()=>{const f=document.getElementById('f'),load=document.getElementById('load');const fire=(el,type='input')=>el?.dispatchEvent(new Event(type,{bubbles:true}));function d(){try{return f.contentDocument}catch{return null}}function focus(step){const x=d();if(!x)return;let el=null;if(step==='plantillas')el=x.querySelector('.tpl-card');if(step==='datos')el=x.getElementById('p1')||x.getElementById('date');if(step==='tipografias')el=x.querySelector('.font-card');if(step==='vista')el=x.querySelector('.preview,.phone,.device,[class*="preview"]');if(step==='rsvp'){el=[...x.querySelectorAll('h2,h3,h4,label,button,.section-title')].find(n=>/rsvp|confirmaci|pregunta/i.test(n.textContent||''))}el?.scrollIntoView({behavior:'smooth',block:'center'})}addEventListener('message',e=>{if(e.data?.wsdGuide)focus(e.data.wsdGuide)});f.addEventListener('load',()=>{load.remove();try{const x=d(),p1=x.getElementById('p1'),p2=x.getElementById('p2'),date=x.getElementById('date'),venue=x.getElementById('venue');if(p1&&!p1.value){p1.value='Elena';fire(p1)}if(p2&&!p2.value){p2.value='Marco';fire(p2)}if(date&&!date.value){date.value='2027-06-12';fire(date,'change')}if(venue&&!venue.value){venue.value='Finca del Valle';fire(venue)}}catch{}},{once:true})})();</script></body></html>
