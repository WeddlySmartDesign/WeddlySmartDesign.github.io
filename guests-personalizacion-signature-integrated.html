<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WeddlySmartDesign · Personalización Signature</title>
<style>
html,body{margin:0;background:#f6f4f0;font-family:system-ui;color:#5f5a54}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f6f4f0;z-index:20;padding:28px;text-align:center}
#boot.hide{display:none}
iframe{width:100%;height:100dvh;border:0;display:block}
.card{max-width:430px;background:#fff;border:1px solid #e1ddd6;border-radius:20px;padding:24px}
.card h1{font:500 28px Georgia,serif;color:#49453f;margin:0 0 10px}
.card p{font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div id="boot">Cargando Signature…</div>
<iframe id="editor" src="weddly-personalizacion-signature.html?v=signature-integrated-20260919" title="Personalización Signature"></iframe>
<script>
(()=> {
  const RSVP_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp';
  const PERS_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-personalization';
  const frame=document.getElementById('editor'),bootEl=document.getElementById('boot');
  const qs=new URLSearchParams(location.search);
  const inSuite=qs.get('suite')==='1'||qs.get('_wsd_suite')==='1';
  const member=()=>localStorage.getItem('weddly_shared_wedding_token')||'';
  let token=qs.get('t')||'',cfg={},pers=null,installed=false;

  async function j(url,opt={}){
    const r=await fetch(url,opt),x=await r.json().catch(()=>({}));
    if(!r.ok||!x.ok)throw new Error(x.error||'request_failed');
    return x;
  }
  async function resolve(){
    if(member()){
      try{
        const x=await j(RSVP_API+'?manage=1',{headers:{'x-weddly-token':member()}});
        const f=x.forms?.[0];
        if(f){token=token||f.public_token||'';cfg=f.config||{}}
      }catch{}
    }
    if(token){
      try{const x=await j(PERS_API+'?token='+encodeURIComponent(token),{cache:'no-store'});pers=x.personalization||null}catch{}
      if(!Object.keys(cfg).length){
        try{const x=await j(RSVP_API+'?token='+encodeURIComponent(token),{cache:'no-store'});cfg=x.form?.config||{}}catch{}
      }
    }
  }
  function goGuests(){
    if(inSuite&&parent!==window){try{const b=parent.document.querySelector('[data-view="guests"]');if(b){b.click();return}}catch{}}
    location.assign('guests.html#invitados');
  }
  function goForm(){
    if(inSuite&&parent!==window){parent.postMessage({type:'wsd-suite-open',view:'guests-rsvp',url:'guests-rsvp-form-flow.html?v=6-stable-runtime'},location.origin);return}
    location.assign('guests-rsvp-form-flow.html?v=6-stable-runtime');
  }
  function addChrome(d,w){
    if(d.getElementById('weddlyIntegrationBar'))return;
    const panel=d.querySelector('.panel');if(!panel)return;
    const st=d.createElement('style');
    st.textContent=`
      .weddly-intbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
      .weddly-intbar button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:9px 12px;font:600 11px 'Jost',system-ui,sans-serif;cursor:pointer}
      .weddly-intbar button[data-save-essential]{margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink)}
      .weddly-intfb{display:none;margin:-8px 0 16px;font:500 11px/1.4 'Jost',system-ui;color:#6f6a61}
      .weddly-intfb.on{display:block}.weddly-intfb.ok{color:#52654a}
      .weddly-save-bottom{padding:8px 0 28px}.weddly-save-bottom button{width:100%;border:0;border-radius:12px;background:#2c2a26;color:#fff;padding:14px;font:700 13px 'Jost',system-ui;cursor:pointer}
    `;d.head.appendChild(st);
    const bar=d.createElement('div');bar.id='weddlyIntegrationBar';bar.className='weddly-intbar';
    bar.innerHTML='<button type="button" id="weddlyBackGuests">← Invitados</button><button type="button" data-save-essential>Guardar</button><button type="button" id="weddlyOpenRsvpForm">Continuar al RSVP →</button>';
    panel.prepend(bar);
    const fb=d.createElement('div');fb.id='weddlyIntegrationFeedback';fb.className='weddly-intfb';bar.insertAdjacentElement('afterend',fb);
    const bottom=d.createElement('div');bottom.className='weddly-save-bottom';bottom.innerHTML='<button type="button" data-save-essential>Guardar diseño Signature</button>';panel.appendChild(bottom);
    d.getElementById('weddlyBackGuests').onclick=goGuests;
    d.getElementById('weddlyOpenRsvpForm').onclick=goForm;
    d.querySelectorAll('[data-save-essential]').forEach(b=>b.onclick=async()=>{
      if(!w.__weddlySaveEssential)return;
      const buttons=[...d.querySelectorAll('[data-save-essential]')];buttons.forEach(x=>x.disabled=true);
      fb.className='weddly-intfb on';fb.textContent='Guardando Signature…';
      try{await w.__weddlySaveEssential();fb.className='weddly-intfb on ok';fb.textContent='Diseño Signature guardado y conectado al RSVP.'}
      catch(e){fb.className='weddly-intfb on';fb.textContent=e?.message==='signature_not_in_license'?'Signature no está incluido en esta licencia.':'No se ha podido guardar. Comprueba la conexión y vuelve a intentarlo.'}
      finally{buttons.forEach(x=>x.disabled=false)}
    });
  }
  function inject(d,w){
    w.__WEDDLY_BOOT={cfg,pers,token,memberToken:member(),persApi:PERS_API,rsvpApi:RSVP_API};
    const s=d.createElement('script');
    s.textContent=`(()=> {
      const B=window.__WEDDLY_BOOT||{},saved=B.pers||{},cfg=B.cfg||{},by=id=>document.getElementById(id);
      const splitNames=t=>{for(const sep of [' & ',' y ',' Y ',' + '])if(String(t||'').includes(sep)){const p=String(t).split(sep);return[p[0].trim(),p.slice(1).join(sep.trim()).trim()]}return['Persona 1','Persona 2']};
      const n=splitNames(cfg.title);
      const firstVenue=Array.isArray(saved.venues)&&saved.venues.length?saved.venues[0]:null;
      state.template=(saved.tier==='signature'&&TEMPLATES[saved.template])?saved.template:'sig01';
      state.fontPair=FONT_PAIRS.some(x=>x.id===saved.fontPair)?saved.fontPair:'moderno';
      state.heroPhoto=saved.heroPhoto||'';state.storyPhoto=saved.storyPhoto||'';
      state.galeria=Array.isArray(saved.galeria)?[...saved.galeria.slice(0,3),'','',''].slice(0,3):['','',''];
      state.hotelPhoto=saved.hotel?.photo||'';
      if(Array.isArray(saved.agenda)&&saved.agenda.length)state.agenda=saved.agenda.map(x=>({...x}));
      if(Array.isArray(saved.venues)&&saved.venues.length)state.venues=saved.venues.map(x=>({...x}));
      else if(Array.isArray(saved.locations)&&saved.locations.length)state.venues=saved.locations.map((x,i)=>({label:x.title||('Lugar '+(i+1)),name:x.place||'',detail:[x.time,saved.city||''].filter(Boolean).join(' · '),address:x.address||'',pos:'center',photo:''}));
      if(Array.isArray(saved.transporte)&&saved.transporte.length)state.transporte=saved.transporte.map(x=>({...x}));
      by('p1').value=saved.p1||n[0];by('p2').value=saved.p2||n[1];
      by('date').value=saved.date||(/^\\d{4}-\\d{2}-\\d{2}$/.test(cfg.date||'')?cfg.date:'2027-09-12');
      by('time').value=saved.time||cfg.time||'18:00';
      by('city').value=saved.city||String(cfg.venue||'').split(',').slice(1).join(',').trim()||'';
      by('tagline').value=saved.tagline||'Una celebración hecha para compartirla.';
      by('storyQuote').value=saved.storyQuote||saved.storyTitle||'Hay momentos que se vuelven inolvidables cuando los compartes.';
      by('storyText').value=saved.storyText||'Nos hace mucha ilusión invitaros a nuestra boda y vivir juntos este día.';
      by('hotelName').value=saved.hotel?.name||'';by('hotelDesc').value=saved.hotel?.desc||'';by('hotelCode').value=saved.hotel?.code||'';by('hotelLink').value=saved.hotel?.link||'';
      by('dressNote').value=saved.dress?.note||'';by('giftText').value=saved.gift?.text||'';by('giftStrong').value=saved.gift?.strong||'';
      by('playlistText').value=saved.playlist?.text||'';by('playlistLinkText').value=saved.playlist?.linkText||'';by('playlistLink').value=saved.playlist?.link||'';
      by('infoExtraText').value=saved.infoExtra?.text||'';
      by('contact1Name').value=saved.contact1Name||saved.contactName||'';by('contact1Phone').value=saved.contact1Phone||saved.contactPhone||'';
      by('contact2Name').value=saved.contact2Name||'';by('contact2Phone').value=saved.contact2Phone||'';
      by('whatsapp').value=String(saved.whatsapp||'').replace(/^https?:\\/\\/wa\\.me\\//i,'').replace(/\\D/g,'');
      const b=saved.blocks||{};[['blockTransporte','transporte'],['blockAlojamiento','alojamiento'],['blockDresscode','dresscode'],['blockRegalo','regalo'],['blockPlaylist','playlist'],['blockInfoExtra','infoExtra']].forEach(([id,k])=>{if(by(id)&&typeof b[k]==='boolean')by(id).checked=b[k]});
      buildTemplateGrid();buildFontGrid();buildAgendaFields();buildVenueFields();buildTransporteFields();
      [['blockTransporte','bodyTransporte'],['blockAlojamiento','bodyAlojamiento'],['blockDresscode','bodyDresscode'],['blockRegalo','bodyRegalo'],['blockPlaylist','bodyPlaylist'],['blockInfoExtra','bodyInfoExtra']].forEach(([a,z])=>by(z)?.classList.toggle('off',!by(a)?.checked));
      renderPreview();
      const compress=src=>new Promise(resolve=>{if(!src||!/^data:image\\//i.test(src)||src.length<620000){resolve(src||'');return}const im=new Image();im.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.78,out=c.toDataURL('image/jpeg',q);while(out.length>700000&&q>.42){q-=.08;out=c.toDataURL('image/jpeg',q)}resolve(out)};im.onerror=()=>resolve('');im.src=src});
      window.__weddlySaveEssential=async()=>{
        if(!B.token||!B.memberToken)throw new Error('missing_access');
        state.heroPhoto=await compress(state.heroPhoto);state.storyPhoto=await compress(state.storyPhoto);state.hotelPhoto=await compress(state.hotelPhoto);
        state.galeria=await Promise.all((state.galeria||[]).slice(0,3).map(compress));
        for(const v of state.venues||[])v.photo=await compress(v.photo||'');
        const digits=String(by('whatsapp').value||'').replace(/\\D/g,'');
        const blocks={transporte:by('blockTransporte').checked,alojamiento:by('blockAlojamiento').checked,dresscode:by('blockDresscode').checked,regalo:by('blockRegalo').checked,playlist:by('blockPlaylist').checked,infoExtra:by('blockInfoExtra').checked,galeria:true};
        const p={
          tier:'signature',template:state.template,fontPair:state.fontPair,
          p1:(by('p1').value||'Persona 1').trim(),p2:(by('p2').value||'Persona 2').trim(),
          date:by('date').value||'2027-01-01',time:by('time').value||'18:00',city:(by('city').value||'').trim(),tagline:(by('tagline').value||'').trim(),
          heroPhoto:state.heroPhoto||'',storyPhoto:state.storyPhoto||'',storyQuote:(by('storyQuote').value||'').trim(),storyText:(by('storyText').value||'').trim(),
          agenda:(state.agenda||[]).map(x=>({...x})),venues:(state.venues||[]).map(x=>({...x})),transporte:(state.transporte||[]).map(x=>({...x})),galeria:[...(state.galeria||[])],
          hotel:{name:(by('hotelName').value||'').trim(),desc:(by('hotelDesc').value||'').trim(),code:(by('hotelCode').value||'').trim(),link:(by('hotelLink').value||'').trim(),photo:state.hotelPhoto||''},
          dress:{note:(by('dressNote').value||'').trim()},gift:{text:(by('giftText').value||'').trim(),strong:(by('giftStrong').value||'').trim()},
          playlist:{text:(by('playlistText').value||'').trim(),linkText:(by('playlistLinkText').value||'').trim(),link:(by('playlistLink').value||'').trim()},
          infoExtra:{text:(by('infoExtraText').value||'').trim()},blocks,
          contact1Name:(by('contact1Name').value||'').trim(),contact1Phone:(by('contact1Phone').value||'').trim(),contact2Name:(by('contact2Name').value||'').trim(),contact2Phone:(by('contact2Phone').value||'').trim(),
          contactName:(by('contact1Name').value||'').trim(),contactPhone:(by('contact1Phone').value||'').trim(),whatsapp:digits?'https://wa.me/'+digits:'',
          venue:(state.venues?.[0]?.name||'').trim(),locations:(state.venues||[]).map(v=>({title:v.label||'',time:'',place:v.name||'',address:v.address||''}))
        };
        const r=await fetch(B.persApi,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':B.memberToken},body:JSON.stringify({token:B.token,personalization:p})});
        const x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||'save_failed');
        const first=p.venues?.[0]||{},nextCfg={...cfg,title:p.p1+' & '+p.p2,date:p.date,time:p.time,venue:[first.name||p.venue,p.city].filter(Boolean).join(', '),intro:cfg.intro||'Nos encantará celebrar este día contigo.',transportOffered:cfg.transportOffered!==false,questions:{meal:cfg.questions?.meal!==false,allergy:cfg.questions?.allergy!==false,transport:cfg.questions?.transport!==false,plusone:cfg.questions?.plusone!==false}};
        const cr=await fetch(B.rsvpApi,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':B.memberToken},body:JSON.stringify({action:'config',token:B.token,config:nextCfg})});
        const cx=await cr.json().catch(()=>({}));if(!cr.ok||!cx.ok)throw new Error(cx.error||'rsvp_sync_failed');
        Object.assign(cfg,nextCfg);try{localStorage.setItem('weddly_guests_design',JSON.stringify(x.personalization||p))}catch{}
        window.__WEDDLY_BOOT.pers=x.personalization||p;window.__WEDDLY_BOOT.cfg=nextCfg;renderPreview();return x.personalization||p;
      };
    })();`;
    d.body.appendChild(s);addChrome(d,w);
  }
  async function install(){
    if(installed)return;
    try{
      const d=frame.contentDocument,w=frame.contentWindow;if(!d?.body||!d.getElementById('tplGrid'))return;
      await resolve();installed=true;inject(d,w);bootEl.classList.add('hide');
    }catch(e){bootEl.innerHTML='<div class="card"><h1>No se ha podido abrir Signature</h1><p>Comprueba la conexión y vuelve a intentarlo.</p></div>'}
  }
  frame.addEventListener('load',()=>{setTimeout(install,60);setTimeout(install,300)});
  setTimeout(install,800);
})();
</script>
</body>
</html>
