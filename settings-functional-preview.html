<!doctype html>
<html lang="es" data-theme="nordic">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ONE · Ajustes demo</title>
<style>
:root{--ink:#2C2A26;--sage:#6E7A5C;--dark:#525C43;--soft:#EEF0E9;--paper:#FBF8F3;--line:#E4DED2;--muted:#736F63;--bg:#F2EFE9}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:620px;min-height:100vh;margin:auto;background:var(--paper);padding:18px 18px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand b{display:block;color:var(--dark);font-size:22px;letter-spacing:.08em}.brand span{font-size:12px;color:var(--muted)}
h1{font:500 38px Georgia,serif;margin:0 0 24px}.ey{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:800;margin-bottom:5px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:14px}.field:last-child{margin-bottom:0}
label{display:block;font-size:12px;font-weight:750;margin-bottom:7px;color:#625E56}input,select{width:100%;min-height:46px;border:1px solid #D7D2C9;border-radius:10px;background:#fff;padding:12px 13px;font-size:16px;color:var(--ink)}
button{border:0;border-radius:11px;background:var(--dark);color:#fff;padding:13px 15px;font-weight:800;font-size:14px}.save{width:100%;margin-top:4px}.support{font-size:13px;color:var(--muted);line-height:1.5}.support b{color:var(--dark)}
.notice{display:none;margin:0 0 14px;padding:11px 12px;border-radius:10px;background:var(--soft);color:var(--dark);font-size:13px}.notice.on{display:block}
@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head>
<body><main class="app">
<div class="top"><div class="brand"><b>ONE</b><span>by WeddlySmartDesign · demo</span></div></div>
<div class="ey">AJUSTES</div><h1>Ajustes</h1><div id="notice" class="notice">Ajustes demo guardados.</div>
<section class="card"><div class="grid">
<div class="field"><label>Tu nombre</label><input id="p1"></div>
<div class="field"><label>Nombre de tu pareja</label><input id="p2"></div>
</div><div class="field"><label>Fecha de boda</label><input id="date" type="date"></div></section>
<section class="card"><div class="grid">
<div class="field"><label>Idioma</label><select id="lang"><option value="es">Español</option><option value="en">English</option></select></div>
<div class="field"><label>Tema visual</label><select id="theme"><option value="nordic">Nórdico</option><option value="blush">Blush</option><option value="sand">Arena</option><option value="slate">Slate</option><option value="editorial">Editorial</option></select></div>
</div><div class="grid">
<div class="field"><label>Nº invitados</label><input id="guests" type="number" min="0"></div>
<div class="field"><label>Moneda</label><select id="currency"><option value="EUR|es-ES">€ Euro</option><option value="GBP|en-GB">£ Libra</option><option value="USD|en-US">$ Dólar</option></select></div>
</div><div class="field"><label>Presupuesto total</label><input id="budget" type="number" min="0"></div><button id="save" class="save">Guardar ajustes</button></section>
<section class="card support"><b>Soporte</b><div style="margin-top:7px">weddlysmartdesign@gmail.com</div><div style="margin-top:9px">Esta pantalla solo modifica la boda demo de esta prueba.</div></section>
</main>
<script>
(()=>{const K='weddly_pro_v7_owner_demo_es',G='weddly_guests_qa_v67_snapshot_demo_es',q=id=>document.getElementById(id);
function data(){try{return JSON.parse(localStorage.getItem(K)||'null')||{settings:{}}}catch{return{settings:{}}}}
function load(){const s=data().settings||{};q('p1').value=s.partner1||'Elena';q('p2').value=s.partner2||'Marco';q('date').value=s.weddingDate||'2027-06-12';q('lang').value=s.lang||'es';q('theme').value=localStorage.getItem('weddly_personal_theme_v51')||'nordic';q('guests').value=s.guests||96;q('currency').value=s.currency||'EUR|es-ES';q('budget').value=s.budget||32000}
q('save').onclick=()=>{const x=data();x.settings={...(x.settings||{}),partner1:q('p1').value.trim(),partner2:q('p2').value.trim(),weddingDate:q('date').value,lang:q('lang').value,guests:Number(q('guests').value)||0,currency:q('currency').value,budget:Number(q('budget').value)||0};localStorage.setItem(K,JSON.stringify(x));localStorage.setItem('weddly_personal_theme_v51',q('theme').value);localStorage.setItem('weddly_personal_theme_v20',q('theme').value);try{const g=JSON.parse(localStorage.getItem(G)||'{}');g.meta=g.meta||{};g.meta.couple=[x.settings.partner1,x.settings.partner2];g.meta.weddingDate=x.settings.weddingDate;localStorage.setItem(G,JSON.stringify(g))}catch{}q('notice').classList.add('on');setTimeout(()=>q('notice').classList.remove('on'),2200)};
load()})();
</script></body></html>
