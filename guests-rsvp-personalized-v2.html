<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weddly Smart Design · RSVP personalizado</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f5f1ea;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#2c2a26;overflow:hidden}
#bar{height:66px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #ddd5c8;position:relative;z-index:5}#bar.hidden{display:none}.back{border:0;background:#eee8df;color:#2c2a26;border-radius:13px;padding:11px 14px;font-weight:800;font-size:15px}.barcopy b{display:block;font-size:15px}.barcopy small{display:block;color:#706b65;margin-top:2px}.frame{display:block;width:100%;height:calc(100% - 66px);border:0;background:#f5f1ea}.frame.full{height:100%}
</style>
</head>
<body>
<div id="bar"><button class="back" id="back">← Volver</button><div class="barcopy"><b>RSVP</b><small>Formulario, envíos y respuestas</small></div></div>
<iframe id="frame" class="frame" title="RSVP"></iframe>
<script>
(()=>{
const PKEY='weddly_personalization_v2',API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-personalization',TOKEN_KEY='weddly_shared_wedding_token';
const q=new URLSearchParams(location.search),publicMode=q.get('guest')==='1'||q.has('t');
const bar=document.getElementById('bar'),frame=document.getElementById('frame');
if(publicMode){bar.classList.add('hidden');frame.classList.add('full')}
frame.src='guests-rsvp-v105-mobile.html'+location.search+'&v=personal-v2';
const themes={
 atelier:{bg:'#f7f1e7',surface:'#fffaf2',surface2:'#eee2d1',ink:'#2b231c',muted:'#776a5d',line:'#ddcdb8',accent:'#b59a75',accentText:'#241d18',radius:'14px',title:'Georgia,serif',hero:'linear-gradient(135deg,#c8ad88,#9f8260)'},
 oliva:{bg:'#f1f2ea',surface:'#fcfcf7',surface2:'#e1e7d7',ink:'#30382e',muted:'#6e7867',line:'#ccd5c4',accent:'#74836b',accentText:'#fff',radius:'23px',title:'Georgia,serif',hero:'linear-gradient(135deg,#89987f,#65745e)'},
 siena:{bg:'#f8efe9',surface:'#fffaf6',surface2:'#f0ddd1',ink:'#3d2a22',muted:'#836b60',line:'#e1c9bb',accent:'#ad684b',accentText:'#fff',radius:'24px',title:'Georgia,serif',hero:'linear-gradient(135deg,#c98262,#96583f)'},
 perla:{bg:'#fbf3f6',surface:'#fffafd',surface2:'#f2e2e8',ink:'#513942',muted:'#876d79',line:'#ead2dc',accent:'#a4778a',accentText:'#fffafc',radius:'30px',title:'Palatino Linotype,Palatino,Georgia,serif',hero:'linear-gradient(135deg,#c79bac,#9a7082)'},
 noche:{bg:'#101823',surface:'#172331',surface2:'#223244',ink:'#f7f0e5',muted:'#c5b9a8',line:'#34485b',accent:'#d7bb8c',accentText:'#17202a',radius:'18px',title:'Georgia,serif',hero:'linear-gradient(135deg,#22364c,#0e1723)'},
 cielo:{bg:'#eef5f7',surface:'#fbfeff',surface2:'#deebef',ink:'#294149',muted:'#6c8288',line:'#c9dde2',accent:'#789eaa',accentText:'#fff',radius:'28px',title:'Palatino Linotype,Palatino,Georgia,serif',hero:'linear-gradient(135deg,#9fbcc5,#6f96a2)'}
};
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
function local(){try{return JSON.parse(localStorage.getItem(PKEY)||'null')||{}}catch{return{}}}
let S={theme:'oliva',p1:'Daniela',p2:'Sergio',date:'2027-09-12',place:'Murcia',photo:'',...local()};
function fmtDate(){if(!S.date)return'Fecha pendiente';const d=new Date(S.date+'T12:00:00');return Number.isNaN(d.getTime())?'Fecha pendiente':d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}
function days(){if(!S.date)return'';const a=new Date();a.setHours(0,0,0,0);const b=new Date(S.date+'T00:00:00');const n=Math.ceil((b-a)/86400000);return n>=0?`Faltan ${n} días`:''}
async function loadRemote(){const token=q.get('t')||'';if(!token)return;try{const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(r.ok&&x.ok&&x.personalization){S={...S,...x.personalization};try{localStorage.setItem(PKEY,JSON.stringify(S))}catch{};styleNow()}}catch{}}
function theme(){return themes[S.theme]||themes.oliva}
function baseCss(t){return `
:root{--wbg:${t.bg};--ws:${t.surface};--ws2:${t.surface2};--wi:${t.ink};--wm:${t.muted};--wl:${t.line};--wa:${t.accent};--wat:${t.accentText};--wr:${t.radius};--wt:${t.title}}
html,body{background:var(--wbg)!important;color:var(--wi)!important}.wrap{max-width:720px!important;padding-top:22px!important}.brand{color:var(--wm)!important}.card,.hero,.party,.panel,.metric{background:var(--ws)!important;border-color:var(--wl)!important;color:var(--wi)!important;border-radius:var(--wr)!important}.small,.contactline{color:var(--wm)!important}.btn{background:var(--wa)!important;color:var(--wat)!important;border-radius:calc(var(--wr) * .55)!important}.btn.soft,.chip,.notice,.where>div{background:var(--ws2)!important;color:var(--wi)!important}.btn.outline{background:var(--ws)!important;color:var(--wi)!important;border-color:var(--wl)!important}.tab{background:var(--ws)!important;color:var(--wi)!important;border-color:var(--wl)!important}.tab.on{background:var(--wa)!important;color:var(--wat)!important}.field,.answer{background:var(--ws)!important;color:var(--wi)!important;border-color:var(--wl)!important}.answer.sel{outline-color:var(--wa)!important}.toggle{border-color:var(--wl)!important}input[type=checkbox]{accent-color:var(--wa)}
#wsdAdminIdentity{margin:0 0 18px}.adminCover{height:205px;border-radius:calc(var(--wr) + 4px);overflow:hidden;position:relative;background:${t.hero};box-shadow:0 16px 36px #00000012}.adminCover img{width:100%;height:100%;object-fit:cover}.adminCover.hasPhoto:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(12,12,12,.58),rgba(12,12,12,.12) 70%)}.adminCopy{position:absolute;z-index:2;left:22px;right:22px;bottom:19px;color:#fff}.adminCover:not(.hasPhoto) .adminCopy{color:var(--wat)}.adminKicker{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:900;opacity:.82}.adminNames{font:500 38px/1 var(--wt);margin:5px 0}.adminMeta{font-size:13px}.adminDays{display:inline-block;margin-top:9px;background:#ffffffdf;color:#2b2825;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:850}
#public{padding-bottom:50px}#public>.brand{display:none!important}#wsdInvitationHero{margin:0 0 18px}.inviteCover{height:390px;border-radius:calc(var(--wr) + 6px);overflow:hidden;position:relative;background:${t.hero};box-shadow:0 22px 48px #00000018}.inviteCover img{width:100%;height:100%;object-fit:cover}.inviteCover.hasPhoto:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,10,10,.66),rgba(11,10,10,.05) 62%)}.inviteCopy{position:absolute;z-index:2;left:28px;right:28px;bottom:26px;color:#fff;text-align:center}.inviteCover:not(.hasPhoto) .inviteCopy{color:var(--wat)}.inviteKicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:900;opacity:.8}.inviteNames{font:500 clamp(46px,9vw,72px)/.98 var(--wt);letter-spacing:-.025em;margin:8px 0}.inviteMeta{font-size:15px}.inviteDays{display:inline-block;margin-top:13px;padding:8px 12px;border-radius:999px;background:#ffffffe8;color:#2b2825;font-size:12px;font-weight:850}
#wsdEventDetails{text-align:center;background:var(--ws);border:1px solid var(--wl);border-radius:var(--wr);padding:25px 22px;margin:0 0 18px;box-shadow:0 12px 30px #00000008}.eventIntro{font:500 25px/1.25 var(--wt);margin:0 auto 20px;max-width:540px}.eventGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.eventCell{background:var(--ws2);border-radius:calc(var(--wr) * .65);padding:14px 10px}.eventCell small{display:block;color:var(--wm);text-transform:uppercase;letter-spacing:.1em;font-size:9px;font-weight:900;margin-bottom:4px}.eventCell b{font-size:14px}.confirmHead{text-align:center;padding:18px 10px 5px}.confirmHead .ey{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--wm);font-weight:900}.confirmHead h2{font:500 34px/1.05 var(--wt);margin:6px 0 8px}.confirmHead p{color:var(--wm);margin:0 auto 14px;max-width:480px}.publicOriginalHero{display:none!important}#public>.card{box-shadow:0 14px 34px #00000008;padding:24px!important}#public>.card>b{display:block;margin:20px 0 8px;font-family:var(--wt);font-size:20px}.success{text-align:center!important}.success h1{font-family:var(--wt)!important}
@media(max-width:560px){.wrap{padding:15px 14px 42px!important}.adminCover{height:170px}.adminNames{font-size:32px}.inviteCover{height:310px;border-radius:calc(var(--wr) + 2px)}.inviteCopy{left:18px;right:18px;bottom:20px}.inviteNames{font-size:48px}.eventGrid{grid-template-columns:1fr}.eventCell{padding:11px}.confirmHead h2{font-size:30px}#public>.card{padding:20px!important}}
`}
function identity(label='Así verán vuestra invitación'){return `<div class="adminCover ${S.photo?'hasPhoto':''}">${S.photo?`<img src="${S.photo}" alt="">`:''}<div class="adminCopy"><div class="adminKicker">${esc(label)}</div><div class="adminNames">${esc(S.p1)} & ${esc(S.p2)}</div><div class="adminMeta">${esc(fmtDate())}${S.place?' · '+esc(S.place):''}</div>${days()?`<div class="adminDays">${esc(days())}</div>`:''}</div></div>`}
function invitationHero(){return `<section id="wsdInvitationHero"><div class="inviteCover ${S.photo?'hasPhoto':''}">${S.photo?`<img src="${S.photo}" alt="">`:''}<div class="inviteCopy"><div class="inviteKicker">Nuestra boda</div><div class="inviteNames">${esc(S.p1)} & ${esc(S.p2)}</div><div class="inviteMeta">${esc(fmtDate())}${S.place?' · '+esc(S.place):''}</div>${days()?`<div class="inviteDays">${esc(days())}</div>`:''}</div></div></section>`}
function extractEvent(d){const hero=d.querySelector('#public .hero');if(!hero)return null;const cells=[...hero.querySelectorAll('.where>div')];const get=i=>cells[i]?.textContent?.replace(/^Hora|^Lugar/i,'').trim()||'—';return {hero,intro:hero.querySelector('p')?.textContent?.trim()||'Nos encantará celebrar este día contigo.',time:get(0),venue:get(1)}}
function decoratePublic(d){const pub=d.getElementById('public');if(!pub||getComputedStyle(pub).display==='none')return;let ih=d.getElementById('wsdInvitationHero');if(!ih){const tmp=d.createElement('div');tmp.innerHTML=invitationHero();ih=tmp.firstElementChild;pub.insertBefore(ih,pub.firstChild)}else{const tmp=d.createElement('div');tmp.innerHTML=invitationHero();ih.replaceWith(tmp.firstElementChild)}const ev=extractEvent(d);if(ev){ev.hero.classList.add('publicOriginalHero');let det=d.getElementById('wsdEventDetails');if(!det){det=d.createElement('section');det.id='wsdEventDetails';ev.hero.parentNode.insertBefore(det,ev.hero.nextSibling)}det.innerHTML=`<div class="eventIntro">${esc(ev.intro)}</div><div class="eventGrid"><div class="eventCell"><small>Fecha</small><b>${esc(fmtDate())}</b></div><div class="eventCell"><small>Hora</small><b>${esc(ev.time)}</b></div><div class="eventCell"><small>Lugar</small><b>${esc(ev.venue)}</b></div></div>`;let ch=d.getElementById('wsdConfirmHead');const card=pub.querySelector(':scope>.card');if(card&&!ch){ch=d.createElement('div');ch.id='wsdConfirmHead';ch.className='confirmHead';ch.innerHTML='<div class="ey">RSVP</div><h2>Confirma tu asistencia</h2><p>Completa los datos para que podamos dejarlo todo preparado para ti.</p>';card.parentNode.insertBefore(ch,card)}}}
function localConfigFromForm(d){return {title:d.getElementById('title')?.value||`${S.p1} & ${S.p2}`,date:d.getElementById('date')?.value||fmtDate(),time:d.getElementById('time')?.value||'',venue:d.getElementById('venue')?.value||S.place,intro:d.getElementById('intro')?.value||'',transportOffered:!!d.getElementById('transportQ')?.checked,questions:{meal:!!d.getElementById('mealQ')?.checked,allergy:!!d.getElementById('allergyQ')?.checked,transport:!!d.getElementById('transportQ')?.checked,plusone:!!d.getElementById('plusQ')?.checked}}}
function patchLocalMode(d,w){let member='';try{member=localStorage.getItem(TOKEN_KEY)||''}catch{}if(member.length>20)return;if(!w.__wsdFetchPatched){w.__wsdFetchPatched=true;const nf=w.fetch.bind(w);w.fetch=async(input,init={})=>{const url=typeof input==='string'?input:input?.url||'';if(url.includes('/weddly-rsvp')){let action='';try{action=JSON.parse(init?.body||'{}')?.action||''}catch{}if(action==='claim'||action==='config')return new Response(JSON.stringify({ok:true,config:localConfigFromForm(d)}),{status:200,headers:{'content-type':'application/json'}});if(url.includes('manage=1'))return new Response(JSON.stringify({ok:true,forms:[{config:localConfigFromForm(d)}],submissions:[],contacts:[],delivery:[]}),{status:200,headers:{'content-type':'application/json'}})}return nf(input,init)}}const clear=()=>{for(const id of ['saveFb','adminFb']){const x=d.getElementById(id);if(x&&/invalid_access|No se ha podido/i.test(x.textContent||'')){x.className='feedback on ok';x.textContent='Este navegador está en modo local. Puedes diseñar y previsualizar el RSVP aquí; la sincronización online se mantiene en los dispositivos conectados.'}}};clear();setTimeout(clear,50);setTimeout(clear,500)}
function patchAdmin(d,w){const admin=d.getElementById('admin');if(!admin||getComputedStyle(admin).display==='none')return;admin.querySelector('.back')?.classList.add('hide');let id=d.getElementById('wsdAdminIdentity');if(!id){id=d.createElement('div');id.id='wsdAdminIdentity';const tabs=admin.querySelector('.tabs');tabs?.parentNode?.insertBefore(id,tabs)}id.innerHTML=identity();patchLocalMode(d,w)}
function styleNow(){try{const d=frame.contentDocument,w=frame.contentWindow;if(!d||!w)return;d.documentElement.dataset.wsdTheme=S.theme;let st=d.getElementById('wsd-v2-style');if(!st){st=d.createElement('style');st.id='wsd-v2-style';d.head.appendChild(st)}st.textContent=baseCss(theme());patchAdmin(d,w);decoratePublic(d);if(!d.documentElement.dataset.wsdObserver){d.documentElement.dataset.wsdObserver='1';new MutationObserver(()=>{patchAdmin(d,w);decoratePublic(d)}).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']})}let token='';try{const scripts=[...d.scripts].map(s=>s.textContent||'').join('\n');token=scripts.match(/PT='([^']+)'/)?.[1]||''}catch{}if(token)parent.postMessage({type:'wsd-rsvp-token',token},location.origin)}catch(e){console.warn('WSD RSVP style',e)}}
frame.addEventListener('load',()=>{styleNow();setTimeout(styleNow,120);setTimeout(styleNow,550)});
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='wsd-personalization-update'){S={...S,...e.data.value};try{localStorage.setItem(PKEY,JSON.stringify(S))}catch{};styleNow()}});
document.getElementById('back').onclick=()=>{if(window.parent!==window)parent.postMessage({type:'wsd-rsvp-back'},location.origin);else location.href='guests-personalized-functional-v2.html?v=2'};
if(publicMode)loadRemote();
})();
</script>
</body>
</html>
