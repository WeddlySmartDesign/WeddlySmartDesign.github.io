html.clean header{display:none!important}html.clean #frame{height:100dvh!important}html.clean #info{max-width:650px;margin:0 auto;padding:18px}html.clean #info:not(.on){display:none!important}

(()=>{'use strict';

function sample(){const guests={};const recipient={};persons.forEach(([name,group,subgroup,unit,rsvp,table,meal],i)=>{const id='demo_p'+String(i+1).padStart(2,'0');if(!recipient[unit])recipient[unit]=id;guests[id]={name,group,unitId:subgroup,invitationUnitId:'unidad_'+unit,invitationUnitLabel:group+' · '+subgroup,invitationRecipientId:recipient[unit],rsvp,table,meal,mealRequired:true,transport:i%5===0,age:'adult',phone:'',email:''}});

return {guests,tables,meta:{couple:['Clara','Mateo'],weddingDate:'2027-06-12'},prepared:null,sent:null,preparedV:1,sentV:1,activity:[]};}

}

window.addEventListener('message',event=>{if(event.origin!==location.origin)return;if(event.data?.type==='guest-demo-navigate')show(event.data.view)});
show('core');
})();
