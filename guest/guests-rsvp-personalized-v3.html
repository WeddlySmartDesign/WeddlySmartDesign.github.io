<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · RSVP Essential</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f0ece4;font-family:'DM Sans',sans-serif;color:#2c2a26;overflow:hidden}#bar{height:66px;display:flex;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #ddd5c8;position:relative;z-index:5}#bar.hidden{display:none}.back{border:0;background:#eee8df;color:#2c2a26;border-radius:13px;padding:11px 14px;font-weight:800;font-size:15px}.barcopy b{display:block;font-size:15px}.barcopy small{display:block;color:#706b65;margin-top:2px}.frame{display:block;width:100%;height:calc(100% - 66px);border:0;background:#f5f1ea}.frame.full{height:100%}</style></head><body><div id="bar"><button class="back" id="back">← Volver</button><div class="barcopy"><b>RSVP</b><small>Diseño Essential · formulario conectado</small></div></div><iframe id="frame" class="frame" title="RSVP"></iframe><script>
(()=>{

function local(){try{return JSON.parse(localStorage.getItem(PKEY)||'null')||{}}catch{return{}}}

const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtDate(){if(!S.date)return'12 septiembre 2027';const d=new Date(S.date+'T12:00:00');return Number.isNaN(d.getTime())?'12 septiembre 2027':d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}
function day(){return S.date&&/^\d{4}-\d{2}-\d{2}/.test(S.date)?S.date.slice(8,10):'12'}

async function loadRemote(){const token=q.get('t')||'';if(!token)return;try{const r=await fetch(API_P+'?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(r.ok&&x.ok&&x.personalization){S={...S,...x.personalization};try{localStorage.setItem(PKEY,JSON.stringify(S))}catch{}}}catch{}}
function branchSvg(side='left'){const flip=side==='right'?'transform="translate(180 0) scale(-1 1)"':'';return `<svg viewBox="0 0 180 220" aria-hidden="true"><g ${flip} fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 205 C35 175 48 128 88 78 C110 50 132 28 170 10"/><path d="M39 163c-14-12-24-14-34-13M51 145c-4-17-12-26-26-34M65 124c-16-7-28-7-39-3M76 106c-4-18-11-28-24-39M94 82c-14-5-25-5-37-1M109 63c-3-15-8-25-18-34M128 45c-12-4-21-3-31 0M145 27c-1-10-5-18-11-24"/><ellipse cx="25" cy="151" rx="5" ry="10"/><ellipse cx="31" cy="115" rx="5" ry="10"/><ellipse cx="53" cy="91" rx="5" ry="10"/><ellipse cx="72" cy="67" rx="5" ry="10"/><ellipse cx="96" cy="45" rx="5" ry="10"/><ellipse cx="120" cy="27" rx="5" ry="10"/><ellipse cx="148" cy="14" rx="5" ry="10"/></g></svg>`}

function paper(inner,cls=''){return `<section class="wsdPaper ${cls}"><div class="paperShape s1"></div><div class="paperShape s2"></div><div class="bot bL">${branchSvg('left')}</div><div class="bot bR">${branchSvg('right')}</div><div class="paperInner">${inner}</div></section>`}
function markup(ev){const p=photo(),venue=ev.venue||'Finca Los Olivos';return `<div id="wsdEssential"><section class="wsdHero"><div class="paperShape s1"></div><div class="paperShape s2"></div><div class="bot heroL">${branchSvg('left')}</div><div class="bot heroR">${branchSvg('right')}</div><div class="heroInner"><div class="scriptTop">¡Nos casamos!</div><div class="caps">Y NOS GUSTARÍA INVITARTE A NUESTRA BODA<br>¿TE APUNTAS?</div><div class="heart"><img src="${esc(p)}" alt="Foto de la pareja"></div><div class="names">${esc(S.p1)} y ${esc(S.p2)}</div><div class="facts"><div><span class="ico">▣</span><b>${day()} ${month()}<br>${year()}</b></div><div><span class="ico">◷</span><b>${esc(ev.time)} H</b></div><div><span class="ico">⌖</span><b>${esc(venue)}</b></div></div><div class="wait">¡TE ESPERAMOS!</div><div class="city">${esc(S.place||'Murcia')}</div></div></section>${paper(`<div class="ey">NUESTRA HISTORIA</div><h2 class="scriptH">Nos encantará celebrarlo contigo.</h2><div class="storyGrid"><div><p>Hemos preparado este espacio para que tengas toda la información del día, sin perder el carácter de una invitación diseñada para nosotros.</p><div class="tinyRule">♡</div></div><div class="storyPhoto"><img src="${esc(p)}" alt=""><span>Juntos<br>es mejor ♡</span></div></div>`,'story')}${paper(`<div class="ey">AGENDA</div><h2 class="scriptH">Así será el día.</h2><div class="agenda"><div class="ag"><div class="agIcon">◎</div><b>${esc(ev.time)}</b><strong>Ceremonia</strong><small>${esc(venue)}</small></div><div class="ag"><div class="agIcon">♧</div><b>19:00</b><strong>Cóctel</strong><small>Jardín norte</small></div><div class="ag"><div class="agIcon">◉</div><b>21:00</b><strong>Cena</strong><small>Salón principal</small></div><div class="ag"><div class="agIcon">♪</div><b>00:00</b><strong>Fiesta</strong><small>Hasta que el cuerpo aguante</small></div></div>`,'agendaPage')}${paper(`<div class="ey">DÓNDE</div><h2 class="scriptH">Te esperamos aquí</h2><div class="places"><article><div class="sketch">⌂</div><h3>Ceremonia</h3><p>${esc(ev.time)} · ${esc(venue)}</p><button type="button" class="locBtn">⌖ Ver ubicación</button></article><article><div class="sketch">♧</div><h3>Celebración</h3><p>19:00 · Jardín Norte</p><button type="button" class="locBtn">⌖ Ver ubicación</button></article></div>`,'wherePage')}<section class="wsdPaper formPage"><div class="paperShape s1"></div><div class="bot bL">${branchSvg('left')}</div><div class="bot bR">${branchSvg('right')}</div><div class="paperInner"><div class="ey">CONFIRMACIÓN</div><h2 class="scriptH">¿Te apuntas?</h2><p class="formLead">Nos hará mucha ilusión que formes parte de este día tan especial.</p><div id="wsdFormSlot"></div></div></section>${paper(`<div class="ey">CONTACTO</div><h2 class="scriptH">Si tienes dudas</h2><p>Podéis escribirnos o llamarnos. ¡Estaremos encantados de ayudarte!</p><div class="contactPill">☎ Ana · 600 123 123</div><button class="outlinePill" type="button">↗ Escríbenos</button><div class="footerNames">${esc(S.p1)} y ${esc(S.p2)}</div><div class="footerMeta">${esc(fmtDate())} · ${esc(S.place||'Murcia')}</div>`,'contactPage')}</div>`}
function css(){return `@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Parisienne&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,500&display=swap');html,body{background:#e8e2d8!important;color:#58452a!important}body{margin:0!important}.wrap{max-width:520px!important;padding:0!important;background:#f4efe5!important;box-shadow:0 20px 60px #493b2a22}#public{display:block!important;padding:0!important}.publicOriginalHero,#public>.brand,#public>.hero{display:none!important}#wsdEssential{background:#f4efe5}.wsdHero,.wsdPaper{position:relative;overflow:hidden;background:#f5f0e6;color:#7d5d22}.wsdHero{min-height:760px}.wsdPaper{min-height:650px;border-top:1px solid #fff9}.paperInner,.heroInner{position:relative;z-index:3;padding:54px 38px}.heroInner{text-align:center;padding-top:44px}.paperShape{position:absolute;background:#e7e0d2;opacity:.52;border-radius:50%}.s1{width:420px;height:240px;right:-160px;top:-40px;transform:rotate(22deg)}.s2{width:400px;height:220px;left:-190px;bottom:70px;transform:rotate(-24deg)}.bot{position:absolute;color:#a78345;z-index:2;opacity:.82}.bot svg{display:block;width:100%;height:100%}.heroL{left:-35px;top:100px;width:170px;height:210px}.heroR{right:-40px;top:120px;width:170px;height:210px}.bL{left:-45px;bottom:110px;width:165px;height:200px}.bR{right:-52px;top:75px;width:165px;height:200px}.scriptTop,.scriptH,.names{font-family:'Parisienne',cursive;font-weight:400}.scriptTop{font-size:52px;line-height:1;color:#936b27}.caps,.ey,.wait,.footerMeta{font-family:'DM Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;font-weight:700}.caps{font-size:11px;line-height:1.7;margin:12px 0 24px}.heart{width:74%;aspect-ratio:1/1;margin:0 auto 14px;clip-path:polygon(50% 9%,57% 4%,66% 1%,76% 2%,86% 8%,93% 18%,97% 31%,96% 43%,92% 55%,86% 66%,79% 75%,70% 84%,60% 92%,50% 100%,40% 92%,30% 84%,21% 75%,14% 66%,8% 55%,4% 43%,3% 31%,7% 18%,14% 8%,24% 2%,34% 1%,43% 4%);overflow:hidden}.heart img,.storyPhoto img{width:100%;height:100%;object-fit:cover}.names{font-size:54px;line-height:1;margin:8px 0 20px}.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:0 18px}.facts>div{padding:8px 10px;min-height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center}.facts>div+div{border-left:1px solid #a78345}.ico{font-size:20px;margin-bottom:7px}.facts b{font:600 10px/1.45 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase}.wait{font-size:10px;margin-top:18px}.city{font-size:12px;letter-spacing:.12em;margin-top:6px}.ey{text-align:center;font-size:10px;margin-bottom:4px}.scriptH{text-align:center;font-size:48px;line-height:1;margin:6px 0 30px;color:#936b27}.storyGrid{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:center}.storyGrid p,.contactPage p,.formLead{font:500 16px/1.55 'Cormorant Garamond',serif;color:#5f5547}.storyPhoto{position:relative;aspect-ratio:4/5;border-radius:45% 55% 50% 50%/35% 40% 60% 65%;overflow:hidden}.storyPhoto span{position:absolute;right:8px;bottom:12px;background:#f7f1e5dd;padding:7px 9px;font:400 18px/1.05 'Parisienne',cursive}.tinyRule{text-align:center;margin-top:25px;color:#a78345}.agenda{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative;margin-top:48px}.agenda:before{content:'';position:absolute;left:8%;right:8%;top:34px;border-top:1px solid #b99a62}.ag{text-align:center;position:relative}.agIcon{width:62px;height:62px;border:1px solid #cbb78f;border-radius:50%;background:#f8f3e9;display:grid;place-items:center;margin:0 auto 10px;font-size:23px}.ag b,.ag strong,.ag small{display:block}.ag b{font-size:11px}.ag strong{font:500 19px/1 'Cormorant Garamond',serif;font-style:italic;margin:4px 0}.ag small{font-size:9px;line-height:1.35;color:#756b5d}.places{display:grid;grid-template-columns:1fr 1fr;gap:16px}.places article{background:#faf6eddf;border:1px solid #cbb78f;border-radius:24px;padding:24px 18px;text-align:center;box-shadow:0 10px 24px #7e674015}.sketch{font-size:36px;height:56px;display:grid;place-items:center;color:#9e7a39}.places h3{font:500 27px 'Cormorant Garamond',serif;margin:4px 0}.places p{font-size:11px;line-height:1.4}.locBtn{border:0;border-radius:999px;background:#a27a36;color:#fff;padding:11px 15px;font-weight:700}.formPage{min-height:auto;padding-bottom:40px}.formLead{text-align:center;margin:-18px 0 16px}.formPage #wsdFormSlot>.card{background:#fbf7efcc!important;border:1px solid #d4c29e!important;border-radius:18px!important;box-shadow:none!important;padding:18px!important;color:#5c4930!important}.formPage .field{background:#fffaf2!important;border-color:#d4c29e!important;border-radius:10px!important}.formPage .answer{background:#fffaf2!important;border-color:#d4c29e!important;border-radius:12px!important}.formPage .answer.sel{outline:2px solid #9e7a39!important}.formPage .btn{background:#9e7a39!important;color:#fff!important;border-radius:999px!important}.formPage .toggle{border-color:#eadfcd!important}.contactPage{text-align:center;min-height:520px}.contactPill,.outlinePill{display:inline-block;margin:10px 5px;padding:11px 16px;border-radius:999px}.contactPill{background:#efe6d5}.outlinePill{border:1px solid #b99a62;background:transparent;color:#775c28}.footerNames{font:400 30px 'Parisienne',cursive;margin-top:60px}.footerMeta{font-size:9px;margin-top:7px}.previewBackFixed{position:fixed!important;top:10px!important;left:10px!important;z-index:9999!important;border-radius:999px!important}.adminEssentialPreview{margin:0 0 18px;padding:18px;border:1px solid #d7c7aa;border-radius:20px;background:#f7f1e6;color:#694f25}.adminEssentialPreview .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}.adminEssentialPreview .n{font:400 36px/1 'Parisienne',cursive;margin:9px 0}.adminEssentialPreview .m{font-size:12px;color:#796e5f}@media(max-width:500px){.wsdHero{min-height:720px}.paperInner,.heroInner{padding:44px 28px}.scriptTop{font-size:44px}.names{font-size:47px}.scriptH{font-size:42px}.facts{margin:0}.storyGrid{gap:14px}.agenda{grid-template-columns:repeat(2,1fr);row-gap:28px}.agenda:before{display:none}.places{grid-template-columns:1fr}.wsdPaper{min-height:620px}.contactPage{min-height:500px}}`}
function token(d){try{return [...d.scripts].map(s=>s.textContent||'').join('\n').match(/PT='([^']+)'/)?.[1]||q.get('t')||''}catch{return q.get('t')||''}}
function designedLink(d,id=''){return location.origin+'/guests-rsvp-personalized-v3.html?guest=1&t='+encodeURIComponent(token(d))+(id?'&g='+encodeURIComponent(id):'')}
function patchShare(d){if(d.documentElement.dataset.wsdShare)return;d.documentElement.dataset.wsdShare='1';d.addEventListener('click',async e=>{const copy=e.target.closest('[data-copy]'),wa=e.target.closest('[data-wa]');if(!copy&&!wa)return;const id=copy?copy.dataset.copy:wa.dataset.wa,link=designedLink(d,id);e.preventDefault();e.stopImmediatePropagation();if(copy){try{await navigator.clipboard.writeText(link)}catch{};return}const row=wa.closest('.recipient'),name=row?.querySelector('.rhead b')?.textContent?.trim()||'',raw=row?.querySelector('.contactline')?.textContent?.trim()||'',phone=raw.replace(/\D/g,'');const text=`Hola ${name}, te enviamos nuestro RSVP. Puedes responder aquí: ${link}`;try{fetch(API_R,{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-weddly-token':localStorage.getItem(TOKEN_KEY)||''},body:JSON.stringify({action:'delivery',token:token(d),guest_key:id,status:'sent'})})}catch{}if(phone)location.href=`https://wa.me/${phone}?text=${encodeURIComponent(text)}`},true)}
function decorateAdmin(d){const admin=d.getElementById('admin');if(!admin||getComputedStyle(admin).display==='none')return;let x=d.getElementById('wsdAdminEssential');if(!x){x=d.createElement('div');x.id='wsdAdminEssential';x.className='adminEssentialPreview';admin.querySelector('.tabs')?.before(x)}x.innerHTML=`<div class="k">Diseño Essential activo</div><div class="n">${esc(S.p1)} y ${esc(S.p2)}</div><div class="m">Papelería romántica. El formulario, sus preguntas y las respuestas siguen siendo los de Guests.</div>`;patchShare(d)}
function decoratePublic(d){const pub=d.getElementById('public');if(!pub||getComputedStyle(pub).display==='none')return;if(pub.querySelector('.success')){pub.querySelector('.success').style.cssText='min-height:100vh;display:grid;place-items:center;text-align:center;background:#f5f0e6;color:#7d5d22;padding:40px';return}const ev=eventData(d);if(ev.hero)ev.hero.classList.add('publicOriginalHero');const card=[...pub.children].find(n=>n.classList?.contains('card'));if(!card)return;let root=d.getElementById('wsdEssential');if(!root){const box=d.createElement('div');box.innerHTML=markup(ev);root=box.firstElementChild;pub.insertBefore(root,pub.firstChild)}d.getElementById('wsdFormSlot')?.appendChild(card);const pb=d.getElementById('previewBack');if(pb)pb.classList.add('previewBackFixed')}
function styleNow(){try{const d=frame.contentDocument;if(!d)return;let st=d.getElementById('wsd-essential-v3-style');if(!st){st=d.createElement('style');st.id='wsd-essential-v3-style';d.head.appendChild(st)}st.textContent=css();decorateAdmin(d);decoratePublic(d);patchShare(d);if(!d.documentElement.dataset.wsdEssentialObs){d.documentElement.dataset.wsdEssentialObs='1';new MutationObserver(()=>{decorateAdmin(d);decoratePublic(d);patchShare(d)}).observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['style','class']})}}catch(e){console.warn('WSD Essential',e)}}
frame.addEventListener('load',()=>{styleNow();setTimeout(styleNow,120);setTimeout(styleNow,650)});
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='wsd-personalization-update'){S={...S,...e.data.value};try{localStorage.setItem(PKEY,JSON.stringify(S))}catch{};styleNow()}});
document.getElementById('back').onclick=()=>history.length>1?history.back():location.href='guests-personalized-functional-v5.html';
(async()=>{if(publicMode)await loadRemote();frame.src='guests-rsvp-v105-mobile.html'+location.search+(location.search?'&':'?')+'v=essential-v3'})();
})();
</script></body></html>
