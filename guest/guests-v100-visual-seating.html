<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests plano v100</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}#plan{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="plan" src="guests-v081-visual-seating.html?v=100"></iframe><script>(()=>{const F=document.getElementById('plan'),MKEY='weddly_guests_qa_v67',RKEY='weddly_guests_v100_rotations';const FIXED={'Familia novia':'#a9744d','Familia novio':'#6b7f72','Amigos':'#8b7aa6','Trabajo':'#b28a56','Otros':'#7b8580'},EXTRA=['#8f726f','#708996','#8a806d','#7c7894','#8d7b62','#768c7e'];let rot={};try{rot=JSON.parse(localStorage.getItem(RKEY))||{}}catch{}const colorFor=name=>{if(FIXED[name])return FIXED[name];let h=0;for(const c of String(name||''))h=(h*31+c.charCodeAt(0))>>>0;return EXTRA[h%EXTRA.length]};function mainGuests(){try{return (JSON.parse(localStorage.getItem(MKEY))||{}).guests||{}}catch{return{}}}function initials(n){return String(n||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}function keyFor(o){if(o.classList.contains('table'))return't:'+String(o.querySelector('.tableCore b')?.textContent||'').trim();let n='';for(const node of o.childNodes){if(node.nodeType===3&&node.textContent.trim()){n=node.textContent.trim();break}}return'f:'+n}function applyRotation(d){d.querySelectorAll('.obj').forEach(o=>{const k=keyFor(o),deg=rot[k]||0;o.style.rotate=deg+'deg';o.style.transformOrigin='center center'})}function patchColors(d){const G=mainGuests(),byName=new Map(Object.entries(G).map(([id,g])=>[String(g.name||'').trim(),g])),byInit=new Map();for(const g of Object.values(G)){const i=initials(g.name);if(!byInit.has(i))byInit.set(i,[]);byInit.get(i).push(g)}d.querySelectorAll('.guestChip,.personPick').forEach(el=>{const name=String(el.textContent||'').replace(/^[•·]\s*/,'').trim(),g=byName.get(name);if(g){const dot=el.querySelector('.dot');if(dot)dot.style.background=colorFor(g.group||'Otros')}});d.querySelectorAll('.seatBadge').forEach(el=>{const arr=byInit.get(String(el.textContent||'').trim())||[];if(arr.length===1)el.style.background=colorFor(arr[0].group||'Otros')});const groups=[...new Set(Object.values(G).map(g=>g.group).filter(Boolean))];const legend=d.querySelector('.legend');if(legend&&groups.length)legend.innerHTML=groups.map(g=>'<span><i class="dot" style="background:'+colorFor(g)+'"></i>'+g+'</span>').join('');const sel=d.getElementById('groupFilter');if(sel&&groups.length&&!sel.dataset.v100){sel.dataset.v100='1';sel.innerHTML='<option value="all">Todos los grupos</option>'+groups.map(g=>'<option value="'+g.replace(/"/g,'&quot;')+'">'+g+'</option>').join('')}}function addRotate(d){const bar=d.getElementById('selectionBar');if(!bar||bar.querySelector('[data-v100rotate]'))return;const edit=d.getElementById('editSelected');if(!edit)return;const b=d.createElement('button');b.className='btn';b.type='button';b.dataset.v100rotate='1';b.textContent='Girar 90°';b.onclick=e=>{e.stopPropagation();const o=d.querySelector('.obj.selectedObj');if(!o)return;const k=keyFor(o);rot[k]=((rot[k]||0)+90)%360;localStorage.setItem(RKEY,JSON.stringify(rot));applyRotation(d)};edit.parentNode.insertBefore(b,edit)}function patch(){let d;try{d=F.contentDocument}catch{return}if(!d||!d.body||!d.getElementById('floor'))return;const back=d.getElementById('backGuests');if(back&&!back.dataset.v100){back.dataset.v100='1';back.onclick=()=>{top.location.href='guests-v100-integrated.html?v=100#mesas'}}patchColors(d);applyRotation(d);addRotate(d);const note=d.querySelector('#selectionBar .small');if(note&& !note.dataset.v100){note.dataset.v100='1';note.textContent='Puedes moverla, cambiar tamaño, girarla o editarla sin perder invitados.'}}function init(){let d;try{d=F.contentDocument}catch{}if(!d||!d.getElementById('floor')){setTimeout(init,250);return}patch();const mo=new MutationObserver(()=>patch());mo.observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});setInterval(patch,700)}F.addEventListener('load',()=>setTimeout(init,700));setTimeout(init,1100)})();</script></body></html>
