T.units=x.units||[];ensureCard();}}catch{}finally{syncing=false}}async function savePerson(id,changes){const cur=STRUCT.people[id]||{},body={action:'save_person',guest_key:id,group_name:changes.group_name!==undefined?changes.group_name:(cur.group_name||''),unit_key:changes.unit_key!==undefined?changes.unit_key:(cur.unit_key||''),relation_role:''};const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':token()},body:JSON.stringify(body)}),x=await r.json();if(!r.ok||!x.ok)throw new Error('save');STRUCT.people[id]=x.person;return x.person}async function createUnit(name){const key='u_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':token()},body:JSON.stringify({action:'save_unit',unit_key:key,name})}),x=await r.json();if(!r.ok||!x.ok)throw new Error('unit');STRUCT.units.push(x.unit);return key}function openSheet(d,html){const p=d.getElementById('panel'),sh=d.getElementById('sheet');if(!p||!sh)return null;p.innerHTML=html;sh.classList.add('on');const nav=d.querySelector('.nav');if(nav)nav.style.pointerEvents='none';const close=()=>{sh.classList.remove('on');p.innerHTML='';if(nav)nav.style.pointerEvents='auto'};sh.onclick=e=>{if(e.target===sh)close()};p.onclick=e=>e.stopPropagation();return{p,close}}function unitName(k){return STRUCT.units.find(u=>u.unit_key===k)?.name||''}function groups(){const base=['Familia novia','Familia novio','Amigos','Trabajo','Otros'];return [...new Set([...base,...Object.values(STRUCT.people).map(x=>x.group_name).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'es'))}function countText(n,one='persona',many='personas'){return n+' '+(n===1?one:many)}function ensureCard(){const x=ctx();if(!x||!x.S)return;const{d,w,S}=x;style(d);const old=d.querySelector('[data-v95-structure]');if(old)old.style.display='none';const inv=d.getElementById('invitados');if(!inv)return;let card=inv.querySelector('[data-v101-structure]');if(!card){card=d.createElement('div');card.className='card v101card';card.dataset.v101Structure='1';const anchor=inv.querySelector('[data-v95-pending]')||inv.querySelector('[data-rsvp-entry]')||inv.querySelector('h2');anchor?anchor.insertAdjacentElement('afterend',card):inv.prepend(card)}const ids=Object.keys(S.guests||{}),grouped=ids.filter(id=>STRUCT.people[id]?.group_name).length,unitPeople=ids.filter(id=>STRUCT.people[id]?.unit_key).length;card.innerHTML='<div class="sectiontag">Organización</div><b style="font-size:20px">Mapa de invitados</b><p class="small">Ve grupos, unidades y personas en una sola estructura. Solo “Sin organizar” requiere atención; una persona puede estar perfectamente en un grupo sin unidad.</p><div class="v101meta"><span class="v101pill">'+grouped+' con grupo</span><span class="v101pill">'+unitPeople+' en unidad</span><span class="v101pill">'+STRUCT.units.length+' unidades</span></div><button class="btn soft" style="width:100%" data-openmap>Abrir mapa visual</button>';card.querySelector('[data-openmap]').onclick=()=>openMap(d,w,S)}function mapData(S){const m=new Map();for(const [id,g] of Object.entries(S.guests||{})){const p=STRUCT.people[id]||{},group=p.group_name||'Sin organizar';if(!m.has(group))m.set(group,{units:new Map(),loose:[]});const b=m.get(group);if(p.unit_key){if(!b.units.has(p.unit_key))b.units.set(p.unit_key,[]);b.units.get(p.unit_key).push([id,g])}else b.loose.push([id,g])}return m}function openMap(d,w,S){const data=mapData(S),order=[...data.keys()].sort((a,b)=>a==='Sin organizar'?1:b==='Sin organizar'?-1:a.localeCompare(b,'es'));const blocks=order.map(group=>{const b=data.get(group),n=b.loose.length+[...b.units.values()].reduce((a,v)=>a+v.length,0),col=group==='Sin organizar'?'#c9c0b5':colorFor(group);const units=[...b.units.entries()].map(([key,ms])=>'<div class="v101unit"><div class="v101utop"><div><b>'+esc(unitName(key)||'Unidad')+'</b><div class="small">'+countText(ms.length,'miembro','miembros')+'</div></div><button class="btn soft v101mini" data-unit="'+esc(key)+'">Editar</button></div><div class="v101people">'+ms.map(([id,g])=>'<button class="v101person" data-person="'+esc(id)+'">'+esc(g.name)+'</button>').join('')+'</div></div>').join('');const loose=b.loose.length?'<div><div class="small" style="margin-bottom:7px">'+(group==='Sin organizar'?'Sin grupo':'Individual / sin unidad')+'</div><div class="v101loose">'+b.loose.map(([id,g])=>'<button class="v101person" data-person="'+esc(id)+'">'+esc(g.name)+'</button>').join('')+'</div></div>':'';return '<section class="v101group '+(group==='Sin organizar'?'unorg':'')+'" style="border-left-color:'+col+'"><div class="v101ghead"><div><b>'+(group==='Sin organizar'?'':'<span class="v101dot" style="background:'+col+'"></span>')+esc(group)+'</b><div class="small">'+countText(n)+'</div></div><button class="btn soft v101mini" data-group="'+esc(group)+'">Editar</button></div><div class="v101body">'+units+loose+'</div></section>'}).join('');const o=openSheet(d,'<div style="display:flex;justify-content:space-between;gap:12px"><div><div class="sectiontag">Organización</div><h2>Mapa de invitados</h2></div><button class="btn soft v101mini" data-close>Hecho</button></div><p class="small">Grupo = de qué parte de vuestra vida viene. Unidad = personas que queréis tratar juntas para invitación o gestión. Las mesas son independientes.</p><div class="v101actions"><button class="btn soft" data-newgroup>+ Grupo</button><button class="btn soft" data-newunit>+ Unidad</button></div><div class="v101map">'+blocks+'</div>');if(!o)return;o.p.querySelector('[data-close]').onclick=o.close;o.p.querySelector('[data-newgroup]').onclick=()=>createGroupFlow(d,w,S);o.p.querySelector('[data-newunit]').onclick=()=>createUnitFlow(d,w,S);o.p.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>editGroup(b.dataset.group,d,w,S));o.p.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>editUnit(b.dataset.unit,d,w,S));o.p.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>editPerson(b.dataset.person,d,w,S))}function createGroupFlow(d,w,S){const o=openSheet(d,'<div class="sectiontag">Nuevo grupo</div><h2>Crear grupo</h2><label>Nombre</label><input id="v101gname" class="field" placeholder="Ej. Vecinos"><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-next>Elegir personas</button></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openMap(d,w,S);o.p.querySelector('[data-next]').onclick=()=>{const n=o.p.querySelector('#v101gname').value.trim();if(n)editGroup(n,d,w,S)}}function editGroup(group,d,w,S){const rows=Object.entries(S.guests).map(([id,g])=>{const cur=STRUCT.people[id]?.group_name||'';return '<label class="v101pick"><input type="checkbox" data-id="'+esc(id)+'" '+(cur===group?'checked':'')+'><div class="grow"><b>'+esc(g.name)+'</b><div class="small">'+esc(cur||'Sin grupo')+'</div></div></label>'}).join('');const o=openSheet(d,'<div class="sectiontag">Grupo</div><h2>'+esc(group)+'</h2><p class="small">Marca o desmarca personas y vuelve directamente al mapa al guardar.</p>'+rows+'<div class="v101sticky"><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-save>Guardar grupo</button></div></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openMap(d,w,S);o.p.querySelector('[data-save]').onclick=async()=>{const btn=o.p.querySelector('[data-save]'),cks=[...o.p.querySelectorAll('[data-id]')];btn.disabled=true;btn.textContent='Guardando…';try{for(const c of cks){const id=c.dataset.id,cur=STRUCT.people[id]?.group_name||'';if(c.checked&&cur!==group)await savePerson(id,{group_name:group});else if(!c.checked&&cur===group)await savePerson(id,{group_name:''});if(S.guests[id])S.guests[id].group=STRUCT.people[id]?.group_name||''}if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();toast(d,'Grupo actualizado',group);setTimeout(()=>openMap(d,w,S),20)}catch{btn.disabled=false;btn.textContent='Guardar grupo'}}}function createUnitFlow(d,w,S){const o=openSheet(d,'<div class="sectiontag">Nueva unidad</div><h2>Crear unidad</h2><label>Nombre</label><input id="v101uname" class="field" placeholder="Ej. Familia Rodríguez"><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-next>Elegir miembros</button></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openMap(d,w,S);o.p.querySelector('[data-next]').onclick=async()=>{const n=o.p.querySelector('#v101uname').value.trim();if(!n)return;const b=o.p.querySelector('[data-next]');b.disabled=true;try{const k=await createUnit(n);editUnit(k,d,w,S)}catch{b.disabled=false}}}function editUnit(key,d,w,S){const name=unitName(key)||'Unidad';const rows=Object.entries(S.guests).map(([id,g])=>{const cur=STRUCT.people[id]?.unit_key||'';return '<label class="v101pick"><input type="checkbox" data-id="'+esc(id)+'" '+(cur===key?'checked':'')+'><div class="grow"><b>'+esc(g.name)+'</b><div class="small">'+esc(cur?unitName(cur):'Individual / sin unidad')+'</div></div></label>'}).join('');const o=openSheet(d,'<div class="sectiontag">Unidad</div><h2>'+esc(name)+'</h2>'+rows+'<div class="v101sticky"><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-save>Guardar unidad</button></div></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openMap(d,w,S);o.p.querySelector('[data-save]').onclick=async()=>{const btn=o.p.querySelector('[data-save]'),cks=[...o.p.querySelectorAll('[data-id]')];btn.disabled=true;btn.textContent='Guardando…';try{for(const c of cks){const id=c.dataset.id,cur=STRUCT.people[id]?.unit_key||'';if(c.checked&&cur!==key)await savePerson(id,{unit_key:key});else if(!c.checked&&cur===key)await savePerson(id,{unit_key:''});if(S.guests[id])S.guests[id].unitId=STRUCT.people[id]?.unit_key||''}if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();toast(d,'Unidad actualizada',name);setTimeout(()=>openMap(d,w,S),20)}catch{btn.disabled=false;btn.textContent='Guardar unidad'}}}function editPerson(id,d,w,S){const g=S.guests[id],m=STRUCT.people[id]||{};if(!g)return;const gopts=groups().map(x=>'<option value="'+esc(x)+'" '+(m.group_name===x?'selected':'')+'>'+esc(x)+'</option>').join(''),uopts=STRUCT.units.map(u=>'<option value="'+esc(u.unit_key)+'" '+(m.unit_key===u.unit_key?'selected':'')+'>'+esc(u.name)+'</option>').join('');const o=openSheet(d,'<div class="sectiontag">Persona</div><h2>'+esc(g.name)+'</h2><label>Grupo existente</label><select id="v101pg" class="field"><option value="">Sin grupo</option>'+gopts+'</select><div class="small" style="text-align:center;margin:4px 0 10px">o</div><label>Crear grupo nuevo</label><input id="v101ng" class="field" placeholder="Ej. Vecinos"><label>Unidad existente</label><select id="v101pu" class="field"><option value="">Individual / sin unidad</option>'+uopts+'</select><div class="small" style="text-align:center;margin:4px 0 10px">o</div><label>Crear unidad nueva</label><input id="v101nu" class="field" placeholder="Ej. Familia Pérez"><p class="small">Puedes cambiar o crear grupo y unidad desde aquí, sin salir de esta persona.</p><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-save>Guardar</button></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openMap(d,w,S);o.p.querySelector('[data-save]').onclick=async()=>{const b=o.p.querySelector('[data-save]');b.disabled=true;b.textContent='Guardando…';try{let group=o.p.querySelector('#v101pg').value,unit=o.p.querySelector('#v101pu').value;const ng=o.p.querySelector('#v101ng').value.trim(),nu=o.p.querySelector('#v101nu').value.trim();if(ng)group=ng;if(nu)unit=await createUnit(nu);await savePerson(id,{group_name:group,unit_key:unit});g.group=group;g.unitId=unit;if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();toast(d,'Organización actualizada',g.name);setTimeout(()=>openMap(d,w,S),20)}catch{b.disabled=false;b.textContent='Guardar'}}}function install(){const x=ctx();if(!x){setTimeout(install,120);return}const{d,w}=x;style(d);if(!installed){installed=true;['renderGuests','render','go'].forEach(n=>{const orig=w[n];if(typeof orig==='function'&&!orig.__v101){const fn=function(){const out=orig.apply(this,arguments);queueMicrotask(()=>ensureCard());return out};fn.__v101=true;w[n]=fn}});const mo=new MutationObserver(()=>ensureCard());mo.observe(d.getElementById('invitados')||d.body,{childList:true,subtree:true});d.addEventListener('click',e=>{const plan=e.target.closest?.('[data-v81-plan-btn], [data-v81-visual] button');if(plan){e.preventDefault();e.stopImmediatePropagation();top.location.href='guests-v101-visual-seating.html?v=101'}},true)}ensureCard();sync()}F.addEventListener('load',()=>setTimeout(install,250));setTimeout(install,600);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){sync();ensureCard()}})})();</script></body></html>
