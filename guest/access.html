<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#525C43"><title>Acceso · GUEST</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#F2EFE9;color:#2C2A26;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,460px);background:#FBF8F3;border:1px solid #E4DED2;border-radius:24px;padding:26px}.brand{color:#525C43}.brand b{display:block;font:500 38px Georgia,serif;letter-spacing:.04em}.brand span{display:block;font:500 19px Georgia,serif;margin-top:3px}h1{font:500 29px Georgia,serif;margin:34px 0 8px}p{color:#736F63;font-size:14px;line-height:1.5}.field{width:100%;border:1px solid #d4cec3;background:#fff;border-radius:13px;padding:14px;font-size:16px;margin:12px 0}.btn{width:100%;border:0;border-radius:13px;background:#2C2A26;color:#fff;padding:14px;font-size:15px;font-weight:800}.error{min-height:20px;color:#A84535;font-size:13px;margin-top:10px}.support{display:block;margin-top:24px;color:#525C43;font-size:13px}</style></head><body><main><div class="card"><div class="brand"><b>GUEST</b><span>by WeddlySmartDesign</span></div><h1>Accede a vuestra boda</h1><p>Abre el enlace de acceso que te hemos enviado. Si prefieres, también puedes pegar aquí el código seguro incluido en ese enlace.</p><input id="token" class="field" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Código de acceso"><button id="open" class="btn">Abrir GUEST</button><div id="error" class="error"></div><a class="support" href="mailto:weddlysmartdesign@gmail.com">¿Necesitas ayuda? weddlysmartdesign@gmail.com</a></div></main><script>(()=>{const KEY='wsd_guest_access_token_v1',q=new URLSearchParams(location.search),incoming=(q.get('access')||q.get('token')||'').trim(),input=document.getElementById('token'),error=document.getElementById('error');function save(v){v=String(v||'').trim();if(v.length<40){error.textContent='El código de acceso no es válido.';return}localStorage.setItem(KEY,v);location.replace('index.html')}if(incoming){input.value=incoming;save(incoming)}document.getElementById('open').onclick=()=>save(input.value)})();</script></body></html>
