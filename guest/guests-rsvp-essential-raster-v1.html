<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weddly Smart Design · Essential</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Italianno&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;background:#eee9df;color:#8c6528;font-family:DM Sans,system-ui,sans-serif}.page{width:min(100%,587px);aspect-ratio:420/1196;margin:0 auto;position:relative;background:#f5f1e8;box-shadow:0 0 36px #6d5b3b20;overflow:hidden}.art{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;z-index:1}.hot{position:absolute;z-index:4;border:0;background:transparent;cursor:pointer}.loc1{left:10%;top:68.1%;width:39%;height:8.7%}.loc2{left:51%;top:68.1%;width:39%;height:8.7%}.rsvp{left:12%;top:79.2%;width:76%;height:10.6%}.contact{left:23%;top:91.2%;width:54%;height:6.2%}.personal{position:absolute;z-index:3;background:#f5f1e8;color:#956b27;text-align:center}.couple{left:22%;top:24.0%;width:56%;height:4.9%;display:flex;align-items:center;justify-content:center;font:400 clamp(35px,9.2vw,60px)/1 Italianno,cursive}.facts{left:13%;top:28.2%;width:74%;height:6.4%;display:grid;grid-template-columns:repeat(3,1fr);align-items:center}.facts>div{font-size:clamp(7px,1.75vw,11px);line-height:1.45;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:0 5%}.facts>div+div{border-left:1px solid #b18d50}.facts .icon{display:block;font-size:16px;margin-bottom:5px;font-weight:500}.agendaVenue{left:4%;top:60.0%;width:23%;height:1.7%;display:flex;align-items:center;justify-content:center;font-size:clamp(6px,1.4vw,9px);font-weight:700;letter-spacing:.06em;text-transform:uppercase}.placeVenue{left:13%;top:73.55%;width:35%;height:1.9%;display:flex;align-items:center;justify-content:center;font-size:clamp(6px,1.35vw,9px);font-weight:700;letter-spacing:.05em;text-transform:uppercase}.sheet{position:fixed;z-index:100;inset:0;background:#0008;display:none;align-items:flex-end}.sheet.on{display:flex}.panel{width:min(100%,620px);height:min(88vh,820px);margin:auto;background:#f5f1ea;border-radius:24px 24px 0 0;overflow:hidden;box-shadow:0 -14px 45px #0003}.sheetHead{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid #ded6ca;color:#2c2a26;font-weight:800}.close{border:0;background:#eee8df;border-radius:999px;width:38px;height:38px;font-size:22px}.panel iframe{width:100%;height:calc(100% - 58px);border:0;background:#f5f1ea}.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:20;background:#2c2a26;color:#fff;border-radius:999px;padding:10px 16px;font-size:12px;font-weight:700;box-shadow:0 8px 24px #0003;opacity:0;pointer-events:none;transition:.2s}.hint.on{opacity:1}@media(min-width:588px){body{padding:20px 0}.page{border-radius:6px}}
</style>
</head>
<body>
<main class="page" id="page">
  <img class="art" id="art" alt="Invitación Essential">
  <div id="couple" class="personal couple"></div>
  <div id="facts" class="personal facts"><div><span class="icon">▣</span><span id="dateText"></span></div><div><span class="icon">◷</span><span id="timeText"></span></div><div><span class="icon">⌖</span><span id="venueText"></span></div></div>
  <div id="agendaVenue" class="personal agendaVenue"></div>
  <div id="placeVenue" class="personal placeVenue"></div>
  <button class="hot loc1" data-location="1" aria-label="Ver ubicación de la ceremonia"></button>
  <button class="hot loc2" data-location="2" aria-label="Ver ubicación de la celebración"></button>
  <button class="hot rsvp" id="openRsvp" aria-label="Confirmar asistencia"></button>
  <button class="hot contact" id="contact" aria-label="Contacto"></button>
</main>
<div class="sheet" id="sheet"><div class="panel"><div class="sheetHead"><span>Confirmación de asistencia</span><button class="close" id="close">×</button></div><iframe id="rsvpFrame" title="Formulario RSVP"></iframe></div></div>
<div class="hint" id="hint">Abriendo…</div>
<script>
(()=>{
 const ART='assets/essential-approved-raster.jpg?v=r3';
 const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp';
 const DEF='sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8';
 const q=new URLSearchParams(location.search),token=q.get('t')||DEF,g=q.get('g')||'',previewMode=q.get('preview')==='1';
 let cfg={title:'Alba & Leo',date:'12 septiembre 2027',time:'18:00',venue:'Finca Los Olivos',intro:''};
 async function loadArt(){const img=document.getElementById('art');try{const r=await fetch(ART,{cache:'no-store'});const ct=(r.headers.get('content-type')||'').toLowerCase();if(ct.startsWith('image/')){img.src=ART;return}const txt=(await r.text()).trim();if(txt.startsWith('/9j/')||txt.startsWith('iVBOR')){img.src='data:image/jpeg;base64,'+txt;return}img.src=ART}catch{img.src=ART}}
 function apply(){if(previewMode)return;const title=(cfg.title||'Alba & Leo').replace(/\s*&\s*|\s+y\s+/i,' y ');document.getElementById('couple').textContent=title;document.getElementById('dateText').textContent=(cfg.date||'12 septiembre 2027').toUpperCase();document.getElementById('timeText').textContent=(cfg.time||'18:00')+' H';document.getElementById('venueText').textContent=cfg.venue||'Finca Los Olivos';document.getElementById('agendaVenue').textContent=cfg.venue||'Finca Los Olivos';document.getElementById('placeVenue').textContent=cfg.venue||'Finca Los Olivos'}
 async function loadCfg(){if(previewMode)return;try{const r=await fetch(API+'?token='+encodeURIComponent(token),{cache:'no-store'}),x=await r.json();if(r.ok&&x?.form?.config)cfg={...cfg,...x.form.config}}catch{}apply()}
 if(previewMode)document.querySelectorAll('.personal').forEach(n=>n.style.display='none');
 const sheet=document.getElementById('sheet'),frame=document.getElementById('rsvpFrame');
 function openForm(){frame.src='guests-rsvp-v105-mobile.html?guest=1&t='+encodeURIComponent(token)+(g?'&g='+encodeURIComponent(g):'')+'&embed=1&r='+Date.now();sheet.classList.add('on');document.body.style.overflow='hidden'}
 function closeForm(){sheet.classList.remove('on');document.body.style.overflow='';setTimeout(()=>frame.src='about:blank',180)}
 document.getElementById('openRsvp').onclick=openForm;document.getElementById('close').onclick=closeForm;sheet.onclick=e=>{if(e.target===sheet)closeForm()};
 frame.addEventListener('load',()=>{try{const d=frame.contentDocument;if(!d||frame.src==='about:blank')return;const admin=d.getElementById('admin');if(admin)admin.style.display='none';const pub=d.getElementById('public');if(pub){const brand=pub.querySelector('.brand'),hero=pub.querySelector('.hero');if(brand)brand.style.display='none';if(hero)hero.style.display='none'}const wrap=d.querySelector('.wrap');if(wrap){wrap.style.maxWidth='none';wrap.style.padding='18px 18px 70px'}d.body.style.background='#f5f1ea'}catch{}});
 document.querySelectorAll('[data-location]').forEach(b=>b.onclick=()=>{const query=(b.dataset.location==='1'?cfg.venue:'Jardín Norte')+' Murcia';window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(query),'_blank','noopener')});
 document.getElementById('contact').onclick=()=>{const h=document.getElementById('hint');h.textContent='Contacto: Ana · 600 123 123';h.classList.add('on');setTimeout(()=>h.classList.remove('on'),2200)};
 loadArt();apply();loadCfg();
})();
</script>
</body>
</html>
