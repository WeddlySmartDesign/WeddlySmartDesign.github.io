function install(){try{const d=app.contentDocument;if(!d)return;const t=themes[S.theme]||themes.oliva;d.documentElement.dataset.theme=S.theme;let st=d.getElementById('wsd-v4-style');if(!st){st=d.createElement('style');st.id='wsd-v4-style';d.head.appendChild(st)}st.textContent=css(t);const isGuests=d.getElementById('hoy')&&d.getElementById('coupleTitle');if(!isGuests)return;d.querySelector('.brand')?.classList.add('hidden');d.getElementById('coupleTitle')?.classList.add('hidden');d.getElementById('weddingMeta')?.classList.add('hidden');const tmp=d.createElement('div');tmp.innerHTML=hero();let old=d.getElementById('wsdHero');if(old)old.replaceWith(tmp.firstElementChild);else d.querySelector('main.wrap')?.insertBefore(tmp.firstElementChild,d.getElementById('hoy'));d.querySelector('.heroEdit')?.addEventListener('click',openDrawer);if(!d.documentElement.dataset.v4Rsvp){d.documentElement.dataset.v4Rsvp='1';d.addEventListener('click',e=>{const r=e.target.closest?.('#rsvpBtn');if(r){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();window.top.location.href='guests-rsvp-premium-v1.html?v=2'}},true)}}catch(e){console.warn(e)}}
function openDrawer(){document.querySelectorAll('[data-theme]').forEach(b=>b.classList.toggle('on',b.dataset.theme===S.theme));p1.value=S.p1||'';p2.value=S.p2||'';date.value=S.date||'';place.value=S.place||'';preview.src=S.photo||'';preview.classList.toggle('on',!!S.photo);removePhoto.disabled=!S.photo;drawer.classList.add('on')}function close(){drawer.classList.remove('on')}document.querySelector('.styles').onclick=e=>{const b=e.target.closest('[data-theme]');if(!b)return;S.theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('on',x===b));install()};photo.onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.photo=String(r.result||'');preview.src=S.photo;preview.classList.add('on');removePhoto.disabled=false};r.readAsDataURL(f)};removePhoto.onclick=()=>{S.photo='';photo.value='';preview.removeAttribute('src');preview.classList.remove('on');removePhoto.disabled=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}install()};clearPhoto.onclick=close;cancel.onclick=close;save.onclick=()=>{S.p1=p1.value.trim()||'Persona 1';S.p2=p2.value.trim()||'Persona 2';S.date=date.value;S.place=place.value.trim();try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}close();install()};drawer.onclick=e=>{if(e.target===drawer)close()};app.addEventListener('load',()=>{install();setTimeout(install,80)});})();</script></body></html>
