<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GUEST · Ajustes</title><style>
:root{--bg:#F2EFE9;--paper:#FBF8F3;--line:#E4DED2;--ink:#2C2A26;--muted:#736F63;--dark:#525C43}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:680px;margin:auto;min-height:100vh;background:var(--paper);padding:24px 20px 44px}.brand b{display:block;font-size:24px;letter-spacing:.08em}.brand span{font-family:Caveat,"Segoe Print",cursive;font-size:20px;color:var(--muted)}h1{font:500 32px Georgia,serif;margin:36px 0 18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}.field{margin:14px 0}label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:7px}input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 12px;background:#fff;font-size:16px}.btn{border:0;border-radius:12px;padding:13px 15px;background:var(--dark);color:white;font-weight:800}.line{background:#fff;color:var(--ink);border:1px solid var(--line)}.row{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:12px;line-height:1.5;color:var(--muted)}a{color:var(--dark)}
</style></head><body><main class="wrap"><div class="brand"><b>GUEST</b><span>by WeddlySmartDesign</span></div><h1>Ajustes</h1><section class="card"><div class="field"><label>Nombre 1</label><input id="p1" autocomplete="name"></div><div class="field"><label>Nombre 2</label><input id="p2" autocomplete="name"></div><div class="field"><label>Fecha de la boda</label><input id="date" type="date"></div><div class="field"><label>Estilo de GUEST</label><select id="theme"><option value="nordic">Nordic</option><option value="blush">Blush</option><option value="sand">Arena</option><option value="slate">Slate</option><option value="editorial">Editorial</option></select></div><div class="row"><button id="save" class="btn">Guardar</button><button id="back" class="btn line">Volver a GUEST</button></div><p id="msg" class="small"></p></section><section class="card"><b>Soporte</b><p class="small">Si tenéis cualquier problema con vuestra invitación, RSVP o gestión de invitados, escribidnos.</p><a href="mailto:weddlysmartdesign@gmail.com">weddlysmartdesign@gmail.com</a></section></main><script>
(()=>{const KEY='weddly_pro_v7',THEME='weddly_personal_theme_v51';const $=id=>document.getElementById(id);function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch{return{}}}const x=read(),s=x.settings||{};$('p1').value=s.partner1||'';$('p2').value=s.partner2||'';$('date').value=s.weddingDate||'';$('theme').value=localStorage.getItem(THEME)||'nordic';$('save').onclick=()=>{const y=read();y.settings={...(y.settings||{}),partner1:$('p1').value.trim(),partner2:$('p2').value.trim(),weddingDate:$('date').value,lang:'es'};localStorage.setItem(KEY,JSON.stringify(y));localStorage.setItem(THEME,$('theme').value);$('msg').textContent='Cambios guardados.'};$('back').onclick=()=>location.assign('index.html')})();
</script></body></html>
