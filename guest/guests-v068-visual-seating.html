<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests v68 Visual Seating</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1ea;color:#2c2a26;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}.brand{font-size:12px;letter-spacing:.1em;text-transform:uppercase}.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:14px 0 18px}.top h1{font:500 42px Georgia,serif;margin:0}.small{font-size:13px;color:#6f6a64;line-height:1.4}.bar{background:#fff;border:1px solid #ddd5c8;border-radius:18px;padding:14px;margin:12px 0}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chip{border:1px solid #d7d0c7;background:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap;font-size:14px;touch-action:none}.chip.sel{outline:2px solid #2c2a26}.section{margin:14px 0}.section h2{font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.btn{border:0;border-radius:12px;padding:12px 14px;background:#2c2a26;color:#fff;font-weight:700;font-size:14px}.soft{background:#eee8df;color:#2c2a26}.room{position:relative;height:520px;background:#fbfaf7;border:2px solid #d2cbc2;border-radius:18px;overflow:hidden;background-image:linear-gradient(#eee9e2 1px,transparent 1px),linear-gradient(90deg,#eee9e2 1px,transparent 1px);background-size:48px 48px;touch-action:none}.obj{position:absolute;user-select:none;touch-action:none}.table{background:#fff;border:1px solid #aaa39b;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;box-shadow:0 1px 2px #0001}.round{border-radius:50%}.rect{border-radius:14px}.pres{border-radius:10px;border-color:#b78395}.feature{background:#eee9e2;border:1px dashed #aaa39b;border-radius:12px;display:flex;align-items:center;justify-content:center;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:#6d6862}.table b{display:block;font-size:13px}.table span{font-size:11px;color:#706b65}.personDot{position:absolute;width:30px;height:30px;border-radius:50%;background:#2c2a26;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 3px #0003;touch-action:none}.label{position:absolute;top:100%;left:50%;transform:translateX(-50%);background:#fff;color:#2c2a26;padding:2px 5px;border-radius:5px;font-size:9px;white-space:nowrap;border:1px solid #ddd5c8}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.legend span{font-size:12px;color:#6f6a64}.footer{display:flex;gap:8px;margin:12px 0 4px}.footer>*{flex:1}.sheet{display:none;position:fixed;z-index:50;inset:0;background:#0005;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}.field{width:100%;padding:14px;border:1px solid #ccc5bb;border-radius:12px;font-size:16px;margin:6px 0 12px;background:#fff}.choice{display:block;width:100%;text-align:left;border:1px solid #ddd5c8;background:#fff;border-radius:12px;padding:14px;margin:7px 0;font-size:16px}.actions{display:flex;gap:8px;margin-top:14px}.actions>*{flex:1}.hint{background:#fff8ed;border:1px solid #ead9bf;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:12px;color:#6f604c}</style></head><body><main class="wrap"><div class="brand">Weddly Smart Design · Guests · QA v68</div><div class="top"><div><h1>Plano de mesas</h1><div class="small">Boda principal · Daniela & Sergio</div></div><button class="btn soft" onclick="resetDemo()">Reiniciar</button></div><section class="bar"><div class="small" style="font-weight:700;margin-bottom:8px">Sin mesa (<span id="unCount"></span>)</div><div id="unseated" class="chips"></div><div class="hint">Arrastra un nombre sobre una mesa. También puedes tocar un nombre y elegir mesa si prefieres no arrastrar.</div></section><section class="section"><h2>Añadir</h2><div class="tools"><button class="btn soft" onclick="addTableSheet()">+ Mesa</button><button class="btn soft" onclick="featureSheet()">+ Elemento de sala</button></div></section><section class="section"><h2>Salón</h2><div id="room" class="room" aria-label="Plano visual del salón"></div><div class="legend"><span>Arrastra mesas y elementos para colocarlos.</span><span>Toca una mesa para editarla.</span></div></section><div class="footer"><button class="btn soft" onclick="summarySheet()">Ver resumen</button><button class="btn" onclick="validatePlan()">Comprobar plano</button></div></main><div id="sheet" class="sheet"><div id="panel" class="panel"></div></div><script>
const KEY='weddly_guests_v68_visual_qa';const demo={guests:{paula:{name:'Paula Martín',table:'Mesa 2'},david:{name:'David Martín',table:''},leo:{name:'Leo Martín',table:'Mesa 2'},irene:{name:'Irene López',table:''},ruben:{name:'Rubén',table:'Mesa 4'},ana:{name:'Ana',table:'Mesa 4'},luis:{name:'Luis',table:'Mesa 3'},marta:{name:'Marta',table:''}},tables:{a:{name:'Mesa 2',type:'round',cap:4,x:18,y:18,w:112,h:112},b:{name:'Mesa 3',type:'rect',cap:8,x:210,y:38,w:150,h:82},c:{name:'Mesa 4',type:'pres',cap:4,x:410,y:25,w:125,h:72}},features:{dance:{name:'Pista de baile',x:215,y:260,w:180,h:115},stage:{name:'Escenario',x:430,y:285,w:125,h:70}}};let S;try{S=JSON.parse(localStorage.getItem(KEY))||structuredClone(demo)}catch(e){S=structuredClone(demo)}const save=()=>localStorage.setItem(KEY,JSON.stringify(S));let selectedGuest=null;const room=document.getElementById('room'),unseated=document.getElementById('unseated'),unCount=document.getElementById('unCount'),sheet=document.getElementById('sheet'),panel=document.getElementById('panel');function initials(n){return n.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}function seatedOn(name){return Object.entries(S.guests).filter(([,g])=>g.table===name)}function render(){unseated.innerHTML='';const u=Object.entries(S.guests).filter(([,g])=>!g.table);unCount.textContent=u.length;u.forEach(([id,g])=>{const b=document.createElement('button');b.className='chip'+(selectedGuest===id?' sel':'');b.textContent=g.name;b.dataset.g=id;b.addEventListener('click',()=>guestPicker(id));dragGuest(b,id);unseated.appendChild(b)});room.innerHTML='';Object.entries(S.tables).forEach(([id,t])=>renderTable(id,t));Object.entries(S.features).forEach(([id,f])=>renderFeature(id,f))}function renderTable(id,t){const el=document.createElement('div');el.className='obj table '+t.type;el.style.left=t.x+'px';el.style.top=t.y+'px';el.style.width=t.w+'px';el.style.height=t.h+'px';const occ=seatedOn(t.name).length;el.innerHTML=`<div><b>${t.name}</b><span>${occ}/${t.cap}</span></div>`;el.dataset.t=id;el.addEventListener('click',e=>{if(e.target.closest('.personDot'))return;editTableSheet(id)});dragObject(el,t);room.appendChild(el);placePeople(el,t)}function placePeople(el,t){const ps=seatedOn(t.name);const rect={w:t.w,h:t.h};ps.forEach(([gid,g],i)=>{const d=document.createElement('button');d.className='personDot';d.title=g.name;d.innerHTML=`${initials(g.name)}<span class="label">${g.name.split(' ')[0]}</span>`;const angle=(Math.PI*2*i)/Math.max(ps.length,1)-Math.PI/2;const rx=rect.w/2+Math.cos(angle)*(rect.w/2+18)-15;const ry=rect.h/2+Math.sin(angle)*(rect.h/2+18)-15;d.style.left=rx+'px';d.style.top=ry+'px';d.addEventListener('click',e=>{e.stopPropagation();guestPicker(gid)});dragGuest(d,gid);el.appendChild(d)})}function renderFeature(id,f){const el=document.createElement('div');el.className='obj feature';el.style.left=f.x+'px';el.style.top=f.y+'px';el.style.width=f.w+'px';el.style.height=f.h+'px';el.textContent=f.name;dragObject(el,f);el.addEventListener('click',()=>featureEdit(id));room.appendChild(el)}function dragObject(el,obj){let sx,sy,ox,oy,moved=false;el.addEventListener('pointerdown',e=>{if(e.target.closest('.personDot'))return;sx=e.clientX;sy=e.clientY;ox=obj.x;oy=obj.y;moved=false;el.setPointerCapture(e.pointerId)});el.addEventListener('pointermove',e=>{if(!el.hasPointerCapture(e.pointerId))return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)moved=true;obj.x=Math.max(0,Math.min(room.clientWidth-el.offsetWidth,ox+dx));obj.y=Math.max(0,Math.min(room.clientHeight-el.offsetHeight,oy+dy));el.style.left=obj.x+'px';el.style.top=obj.y+'px'});el.addEventListener('pointerup',e=>{if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId);if(moved){save();setTimeout(()=>render(),0)}})}function dragGuest(el,gid){let ghost=null;el.addEventListener('pointerdown',e=>{e.stopPropagation();selectedGuest=gid;ghost=document.createElement('div');ghost.className='chip';ghost.style.position='fixed';ghost.style.zIndex='99';ghost.style.pointerEvents='none';ghost.textContent=S.guests[gid].name;document.body.appendChild(ghost);moveGhost(e)});el.addEventListener('pointermove',e=>{if(ghost)moveGhost(e)});el.addEventListener('pointerup',e=>{if(!ghost)return;const p=document.elementFromPoint(e.clientX,e.clientY);const target=p&&p.closest('.table');if(target){assignGuest(gid,target.dataset.t)}ghost.remove();ghost=null;selectedGuest=null;render()})}function moveGhost(e){if(!ghost)return;ghost.style.left=(e.clientX+8)+'px';ghost.style.top=(e.clientY+8)+'px'}function assignGuest(gid,tid){const t=S.tables[tid];if(!t)return;const current=seatedOn(t.name).length;if(S.guests[gid].table!==t.name&&current>=t.cap){alert(`${t.name} está llena (${current}/${t.cap}).`);return}S.guests[gid].table=t.name;save()}function guestPicker(gid){selectedGuest=gid;const g=S.guests[gid];openSheet(`<div class="small">${g.name}</div><h2 style="font-size:30px;margin:8px 0 14px">Asignar mesa</h2>${Object.entries(S.tables).map(([id,t])=>{const o=seatedOn(t.name).length;return `<button class="choice" data-pick="${id}"><b>${t.name}</b><br><span class="small">${o} de ${t.cap} plazas</span></button>`}).join('')}<button class="choice" data-pick="none">Dejar sin mesa</button><div class="actions"><button class="btn soft" data-close>Cerrar</button></div>`);panel.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.pick;if(v==='none'){g.table='';save();closeSheet();render();return}assignGuest(gid,v);closeSheet();render()}));panel.querySelector('[data-close]').addEventListener('click',closeSheet)}function addTableSheet(){openSheet(`<h2 style="font-size:30px;margin:0 0 14px">Añadir mesa</h2><label class="small">Tipo</label><select id="tt" class="field"><option value="round">Redonda</option><option value="rect">Rectangular</option><option value="pres">Presidencial</option></select><label class="small">Nombre</label><input id="tn" class="field" placeholder="Ej. Mesa 5"><label class="small">Capacidad</label><input id="tc" class="field" type="number" min="1" max="20" value="8"><div class="actions"><button class="btn soft" data-close>Cancelar</button><button class="btn" id="addT">Añadir</button></div>`);panel.querySelector('[data-close]').addEventListener('click',closeSheet);panel.querySelector('#addT').addEventListener('click',()=>{const type=panel.querySelector('#tt').value,name=panel.querySelector('#tn').value.trim(),cap=+panel.querySelector('#tc').value;if(!name||cap<1)return alert('Indica nombre y capacidad.');if(Object.values(S.tables).some(t=>t.name.toLowerCase()===name.toLowerCase()))return alert('Ese nombre ya existe.');const id='t'+Date.now(),dims=type==='round'?[112,112]:type==='rect'?[150,82]:[125,72];S.tables[id]={name,type,cap,x:25,y:170,w:dims[0],h:dims[1]};save();closeSheet();render()})}function editTableSheet(id){const t=S.tables[id];openSheet(`<div class="small">Mesa</div><h2 style="font-size:30px;margin:8px 0 14px">Editar ${t.name}</h2><label class="small">Nombre</label><input id="tn" class="field" value="${t.name}"><label class="small">Capacidad</label><input id="tc" class="field" type="number" min="1" max="20" value="${t.cap}"><div class="actions"><button class="btn soft" data-close>Cerrar</button><button class="btn" id="saveT">Guardar</button></div>`);panel.querySelector('[data-close]').addEventListener('click',closeSheet);panel.querySelector('#saveT').addEventListener('click',()=>{const old=t.name,n=panel.querySelector('#tn').value.trim(),c=+panel.querySelector('#tc').value;if(!n||c<1)return;t.name=n;t.cap=c;Object.values(S.guests).forEach(g=>{if(g.table===old)g.table=n});save();closeSheet();render()})}function featureSheet(){openSheet(`<h2 style="font-size:30px;margin:0 0 14px">Elemento de sala</h2>${['Pista de baile','Escenario','Barra','Photocall','Zona infantil'].map(x=>`<button class="choice" data-f="${x}">${x}</button>`).join('')}<div class="actions"><button class="btn soft" data-close>Cerrar</button></div>`);panel.querySelectorAll('[data-f]').forEach(b=>b.addEventListener('click',()=>{const id='f'+Date.now();S.features[id]={name:b.dataset.f,x:190,y:250,w:150,h:90};save();closeSheet();render()}));panel.querySelector('[data-close]').addEventListener('click',closeSheet)}function featureEdit(id){const f=S.features[id];openSheet(`<h2 style="font-size:30px;margin:0 0 14px">${f.name}</h2><p class="small">Puedes moverlo directamente por el plano.</p><div class="actions"><button class="btn soft" data-close>Cerrar</button><button class="btn" id="delF">Eliminar</button></div>`);panel.querySelector('[data-close]').addEventListener('click',closeSheet);panel.querySelector('#delF').addEventListener('click',()=>{delete S.features[id];save();closeSheet();render()})}function summarySheet(){openSheet(`<h2 style="font-size:30px;margin:0 0 14px">Resumen de mesas</h2>${Object.values(S.tables).map(t=>`<div class="choice"><b>${t.name}</b><br><span class="small">${seatedOn(t.name).map(([,g])=>g.name).join(', ')||'Sin invitados'} · ${seatedOn(t.name).length}/${t.cap}</span></div>`).join('')}<div class="actions"><button class="btn soft" data-close>Cerrar</button></div>`);panel.querySelector('[data-close]').addEventListener('click',closeSheet)}function validatePlan(){const full=Object.values(S.tables).filter(t=>seatedOn(t.name).length>t.cap),u=Object.values(S.guests).filter(g=>!g.table);if(full.length)return alert(`Hay ${full.length} mesa(s) con exceso de capacidad.`);if(u.length)return alert(`El plano está bien de capacidad, pero quedan ${u.length} invitado(s) sin mesa.`);alert('Plano completo: todos tienen mesa y no hay excesos de capacidad.')}function openSheet(html){panel.innerHTML=html;sheet.classList.add('on')}function closeSheet(){sheet.classList.remove('on');selectedGuest=null}function resetDemo(){if(confirm('¿Reiniciar esta QA visual?')){S=structuredClone(demo);save();render()}}render();</script></body></html>
