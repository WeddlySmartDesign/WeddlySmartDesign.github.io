div><div id="app"></div></main><div id="sheet" class="sheet"><div id="sheetCard" class="sheetCard"></div></div><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-event-state',TOKEN='weddly_shared_wedding_token',GUEST='weddly_guests_qa_v67',PAY='weddly_pro_v7';const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={schema:1,events:{},updatedAt:new Date(0).toISOString()},version=0,current='';function demo(){try{const q=new URLSearchParams(location.search).get('ownerDemo');if(q==='es'||q==='en')return q;const x=localStorage.getItem('weddly_owner_demo_mode');return x==='es'||x==='en'?x:''}catch{return''}}function en(){if(demo())return demo()==='en';try{const p=JSON.parse(localStorage.getItem(PAY)||'null');return p?.settings?.lang==='en'}catch{return false}}function t(es,enText){return en()?enText:es}function guests(){try{const k=GUEST+(demo()?'_snapshot_demo_'+demo():'');const s=JSON.parse(localStorage.getItem(k)||localStorage.getItem(GUEST)||'null')||{};return Object.entries(s.guests||{}).map(([id,g])=>({id,...g})).filter(g=>g.rsvp!=='declined')}catch{return[]}}function weddingDate(){try{const k=demo()?PAY+'_owner_demo_'+demo():PAY,p=JSON.parse(localStorage.getItem(k)||'null')||{},d=p?.settings?.weddingDate;if(/^\d{4}-\d{2}-\d{2}$/.test(String(d||'')))return d}catch{}try{const k=GUEST+(demo()?'_snapshot_demo_'+demo():''),g=JSON.parse(localStorage.getItem(k)||'null')||{},d=g?.meta?.weddingDate;return /^\d{4}-\d{2}-\d{2}$/.test(String(d||''))?d:''}catch{return''}}function addDays(date,n){if(!date)return'';const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function defaults(date){const defs=en()?[['format',-75,'Define the format'],['venue',-70,'Choose and book the venue'],['budget',-65,'Set the event budget'],['guests',
