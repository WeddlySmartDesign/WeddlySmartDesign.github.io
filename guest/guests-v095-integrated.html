<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests v95</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f5f1ea;overflow:hidden}#legacy{display:block;width:100%;height:100%;border:0;background:#f5f1ea}</style></head><body><iframe id="legacy" title="Weddly Smart Design Guests v95" src="guests-v081-integrated.html?v=92"></iframe><script>
(()=>{
const LEG=document.getElementById('legacy');
const RSVPAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp';
const STRUCTAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-guests-structure';
const RSVPKEY='weddly_guests_rsvp_v82';
const memberToken=()=>localStorage.getItem('weddly_shared_wedding_token')||'';
let syncing=false;let STRUCT={people:{},units:[]};
const norm=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
function getR(){try{return JSON.parse(localStorage.getItem(RSVPKEY))||{responses:[],contacts:{},delivery:{}}}catch{return{responses:[],contacts:{},delivery:{}}}}
function putR(r){localStorage.setItem(RSVPKEY,JSON.stringify(r))}
function ctx(){try{const ld=LEG.contentDocument,app=ld&&ld.getElementById('app');if(!app)return null;const d=app.contentDocument,w=app.contentWindow;if(!d||!d.body)return null;if(!w.__guestsState){const s=d.createElement('script');s.textContent='window.__guestsState=()=>S;';d.body.appendChild(s)}return{d,w,S:w.__guestsState?w.__guestsState():null}}catch{return null}}
function toast(d,title,detail=''){const old=d.querySelector('.v95toast');if(old)old.remove();const t=d.createElement('div');t.className='v95toast';t.innerHTML='<b>'+title+'</b>'+(detail?'<small>'+detail+'</small>':'');d.body.appendChild(t);setTimeout(()=>t.remove(),4200)}
function ensureStyle(d){if(d.getElementById('v95style'))return;const st=d.createElement('style');st.id='v95style';st.textContent='.v95toast{position:fixed;z-index:10000;top:18px;left:18px;right:18px;background:#2c2a26;color:#fff;border-radius:16px;padding:15px 17px;box-shadow:0 12px 30px #0003}.v95toast small{display:block;color:#ddd5c8;margin-top:4px}.v95pending{border-left:5px solid #6b7f72}.v95org{border:1px solid #d8d0c5}.v95meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.v95chip{font-size:12px;background:#eee8df;border-radius:999px;padding:6px 9px}.v95sub{font-size:13px;color:#706b65;margin-top:4px}';d.head.appendChild(st)}
async function syncRemote(){if(syncing)return;const mt=memberToken();if(!mt)return;syncing=true;try{const r=await fetch(RSVPAPI+'?manage=1',{headers:{'x-weddly-token':mt}}),data=await r.json();if(!r.ok||!data.ok)throw 0;const R=getR();R.responses=Array.isArray(R.responses)?R.responses:[];const byId=new Map(R.responses.filter(x=>x.id).map(x=>[x.id,x]));(data.submissions||[]).forEach(x=>{const item={id:x.id,guest_key:x.guest_key||'',name:x.name,attend:x.attend,age:x.age,mealRequired:x.meal_required,meal:x.meal||'',allergy:x.allergy||'',transport:!!x.transport,plusone:x.plusone||'',source:'guest',at:Date.parse(x.received_at)||Date.now(),applied:!!x.applied_at,remote:true};if(byId.has(x.id))Object.assign(byId.get(x.id),item);else R.responses.push(item)});putR(R);patch()}catch(e){}finally{syncing=false}}
async function syncStructure(){const mt=memberToken();if(!mt)return;try{const r=await fetch(STRUCTAPI,{headers:{'x-weddly-token':mt}}),data=await r.json();if(!r.ok||!data.ok)throw 0;STRUCT.people={};(data.people||[]).forEach(x=>STRUCT.people[x.guest_key]=x);STRUCT.units=data.units||[];patch()}catch(e){}}
function patch(){const C=ctx();if(!C||!C.S)return;const{d,w,S}=C;ensureStyle(d);const old=d.querySelector('[data-rsvp-pending]');if(old)old.style.display='none';const openRsvp=d.querySelector('[data-open-rsvp]');if(openRsvp)openRsvp.onclick=()=>{top.location.href='guests-rsvp-v94.html?v=95'};addPending(d,w,S);addStructure(d,w,S)}
function pendingResponses(){return getR().responses.filter(x=>x.remote&&!x.applied)}
function addPending(d,w,S){const inv=d.getElementById('invitados');if(!inv)return;const pending=pendingResponses();let box=inv.querySelector('[data-v95-pending]');if(!pending.length){if(box)box.remove();return}if(!box){box=d.createElement('div');box.className='card v95pending';box.setAttribute('data-v95-pending','1');const entry=inv.querySelector('[data-rsvp-entry]');entry?entry.insertAdjacentElement('afterend',box):inv.prepend(box)}box.innerHTML='<b>'+pending.length+' respuesta'+(pending.length===1?' recibida':'s recibidas')+'</b><p class="small">Ya han llegado a Guests. Revísalas antes de incorporarlas.</p>'+pending.map(x=>{const known=x.guest_key&&S.guests[x.guest_key];const who=known?known.name:x.name;return '<div class="row"><div><b>'+who+'</b><div class="small">'+(x.attend?'Asiste':'No asiste')+(x.age!=null?' · '+x.age+' años':'')+(x.mealRequired===false?' · Sin menú':x.meal?' · '+x.meal:'')+(x.transport?' · Transporte':'')+(x.plusone?' · +1: '+x.plusone:'')+'</div></div><button class="btn soft mini" data-v95apply="'+x.id+'">Incorporar</button></div>'}).join('');box.querySelectorAll('[data-v95apply]').forEach(b=>b.onclick=()=>applyRemote(b.dataset.v95apply,d,w,S))}
async function applyRemote(id,d,w,S){const R=getR(),x=R.responses.find(z=>z.id===id);if(!x)return;const mt=memberToken();if(!mt){toast(d,'No puedo incorporar todavía','Falta el acceso compartido de la boda.');return}const btn=d.querySelector('[data-v95apply="'+id+'"]');if(btn){btn.disabled=true;btn.textContent='Incorporando…'}try{const rr=await fetch(RSVPAPI,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt},body:JSON.stringify({action:'apply',submission_id:id})}),data=await rr.json();if(!rr.ok||!data.ok)throw 0;let gid=x.guest_key&&S.guests[x.guest_key]?x.guest_key:null;if(!gid){const m=Object.entries(S.guests).find(([,g])=>norm(g.name)===norm(x.name));if(m)gid=m[0]}if(!gid){gid='rsvp'+Date.now();S.guests[gid]={name:x.name,rsvp:'pending',meal:'',table:'',transport:false}}const g=S.guests[gid];g.rsvp=x.attend?'confirmed':'declined';if(x.age!=null)g.age=x.age;if(x.mealRequired===false){g.mealRequired=false;g.meal='Sin menú'}else if(x.meal){g.mealRequired=true;g.meal=x.meal}g.transport=!!x.transport;if(x.allergy)g.allergy=x.allergy;if(x.plusone)g.plusone=x.plusone;x.applied=true;putR(R);if(typeof w.record==='function')w.record((g.name||x.name)+' · RSVP recibido',x.attend?'Asistirá':'No asistirá',[{title:'Invitados',detail:'RSVP actualizado'}]);if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();toast(d,'RSVP incorporado',(g.name||x.name)+' ya está actualizado en Guests.');setTimeout(patch,50)}catch(e){if(btn){btn.disabled=false;btn.textContent='Incorporar'}toast(d,'No se ha incorporado','La respuesta sigue pendiente. Reintenta cuando tengas conexión.')}}
function addStructure(d,w,S){const inv=d.getElementById('invitados');if(!inv)return;let card=inv.querySelector('[data-v95-structure]');if(!card){card=d.createElement('div');card.className='card v95org';card.setAttribute('data-v95-structure','1');const pending=inv.querySelector('[data-v95-pending]'),entry=inv.querySelector('[data-rsvp-entry]');(pending||entry)?(pending||entry).insertAdjacentElement('afterend',card):inv.prepend(card)}const ids=Object.keys(S.guests||{}),grouped=ids.filter(id=>STRUCT.people[id]?.group_name).length;card.innerHTML='<div class="sectiontag">Organización</div><b style="font-size:20px">Grupos y unidades</b><p class="small">“Grupo” clasifica. “Unidad” indica quién pertenece a quién. No se infieren relaciones automáticamente.</p><div class="v95meta"><span class="v95chip">'+grouped+' con grupo</span><span class="v95chip">'+STRUCT.units.length+' unidades</span></div><button class="btn soft" type="button" data-v95organize>Organizar invitados</button>';card.querySelector('[data-v95organize]').onclick=()=>openOrganizer(d,w,S)}
function openSheet(d,html){const p=d.getElementById('panel'),sh=d.getElementById('sheet');if(!p||!sh)return;p.innerHTML=html;sh.classList.add('on');const nav=d.querySelector('.nav');if(nav)nav.style.pointerEvents='none';const close=()=>{sh.classList.remove('on');p.innerHTML='';if(nav)nav.style.pointerEvents='auto'};sh.onclick=e=>{if(e.target===sh)close()};p.onclick=e=>e.stopPropagation();return{p,close}}
function unitName(key){return STRUCT.units.find(u=>u.unit_key===key)?.name||''}
function openOrganizer(d,w,S){const rows=Object.entries(S.guests).map(([id,g])=>{const m=STRUCT.people[id]||{},u=unitName(m.unit_key);return '<div class="row"><div><b>'+g.name+'</b><div class="v95sub">'+(m.group_name||'Sin grupo')+(u?' · '+u:' · Sin unidad')+(m.relation_role?' · '+m.relation_role:'')+'</div></div><button class="btn soft mini" data-person="'+id+'">Organizar</button></div>'}).join('');const o=openSheet(d,'<div class="sectiontag">Invitados</div><h2>Grupos y unidades</h2><p class="small">Ejemplo: “Familia novia” es un grupo. “Familia Martín” puede ser una unidad formada por una pareja y sus hijos.</p><button class="btn soft" style="width:100%;margin-bottom:10px" data-newunit>+ Crear unidad</button><div>'+rows+'</div><div class="actions"><button class="btn soft" data-close>Cerrar</button></div>');if(!o)return;o.p.querySelector('[data-close]').onclick=o.close;o.p.querySelector('[data-newunit]').onclick=()=>newUnit(d,w,S);o.p.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>editPerson(b.dataset.person,d,w,S))}
function newUnit(d,w,S){const o=openSheet(d,'<div class="sectiontag">Unidad</div><h2>Nueva unidad</h2><p class="small">Pon un nombre que vosotros entendáis: “Familia Martín”, “Ana + Luis”, etc.</p><label>Nombre</label><input id="v95unitname" class="field" placeholder="Ej. Familia Martín"><div class="actions"><button class="btn soft" data-cancel>Cancelar</button><button class="btn" data-save>Crear</button></div>');if(!o)return;o.p.querySelector('[data-cancel]').onclick=()=>openOrganizer(d,w,S);o.p.querySelector('[data-save]').onclick=async()=>{const name=o.p.querySelector('#v95unitname').value.trim();if(!name)return;o.p.querySelector('[data-save]').disabled=true;const key='u_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);try{const r=await fetch(STRUCTAPI,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':memberToken()},body:JSON.stringify({action:'save_unit',unit_key:key,name})}),data=await r.json();if(!r.ok||!data.ok)throw 0;STRUCT.units.push(data.unit);toast(d,'Unidad creada',name);openOrganizer(d,w,S)}catch{toast(d,'No se ha creado','Reintenta cuando tengas conexión.');o.p.querySelector('[data-save]').disabled=false}}}
function editPerson(id,d,w,S){const g=S.guests[id],m=STRUCT.people[id]||{},groups=['','Familia novia','Familia novio','Amigos','Trabajo','Otros'];const groupOpts=groups.map(x=>'<option value="'+x+'" '+(m.group_name===x?'selected':'')+'>'+(x||'Sin grupo')+'</option>').join('')+'<option value="__custom">Otro grupo…</option>';const unitOpts='<option value="">Sin unidad</option>'+STRUCT.units.map(u=>'<option value="'+u.unit_key+'" '+(m.unit_key===u.unit_key?'selected':'')+'>'+u.name+'</option>').join('');const roles=['','Pareja','Hijo/a','Acompañante / +1','Otro'];const roleOpts=roles.map(x=>'<option value="'+x+'" '+(m.relation_role===x?'selected':'')+'>'+(x||'Sin relación indicada')+'</option>').join('');const o=openSheet(d,'<div class="sectiontag">'+g.name+'</div><h2>Organizar invitado</h2><label>Grupo</label><select id="v95group" class="field">'+groupOpts+'</select><div id="v95customwrap" style="display:none"><label>Nombre del grupo</label><input id="v95customgroup" class="field" placeholder="Ej. Amigos universidad"></div><label>Unidad</label><select id="v95unit" class="field">'+unitOpts+'</select><button class="btn soft mini" style="margin-bottom:13px" data-newunit>+ Nueva unidad</button><label>Relación dentro de la unidad</label><select id="v95role" class="field">'+roleOpts+'</select><p class="small">La unidad no obliga a sentarlos juntos. Solo describe la relación para RSVP y gestión.</p><div class="actions"><button class="btn soft" data-cancel>Cancelar</button><button class="btn" data-save>Guardar</button></div>');if(!o)return;const gs=o.p.querySelector('#v95group'),cw=o.p.querySelector('#v95customwrap');gs.onchange=()=>cw.style.display=gs.value==='__custom'?'block':'none';o.p.querySelector('[data-cancel]').onclick=()=>openOrganizer(d,w,S);o.p.querySelector('[data-newunit]').onclick=()=>newUnit(d,w,S);o.p.querySelector('[data-save]').onclick=async()=>{let group=gs.value;if(group==='__custom')group=o.p.querySelector('#v95customgroup').value.trim();const unit=o.p.querySelector('#v95unit').value,role=o.p.querySelector('#v95role').value;o.p.querySelector('[data-save]').disabled=true;try{const r=await fetch(STRUCTAPI,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':memberToken()},body:JSON.stringify({action:'save_person',guest_key:id,group_name:group,unit_key:unit,relation_role:role})}),data=await r.json();if(!r.ok||!data.ok)throw 0;STRUCT.people[id]=data.person;g.group=group||'';g.unitId=unit||'';g.relationRole=role||'';if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();toast(d,'Organización actualizada',g.name);setTimeout(()=>openOrganizer(d,w,S),40)}catch{toast(d,'No se ha guardado','La organización sigue igual. Reintenta con conexión.');o.p.querySelector('[data-save]').disabled=false}}}
function init(){const C=ctx();if(!C){setTimeout(init,300);return}patch();syncRemote();syncStructure();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){syncRemote();syncStructure()}});setInterval(()=>{syncRemote();patch()},8000)}
LEG.addEventListener('load',()=>setTimeout(init,150));setTimeout(init,500);
})();
</script></body></html>
