.push(x.unit);return key}function state(w){try{return w.__guestsState?w.__guestsState():null}catch{return null}}function openSheet(d,html){const p=d.getElementById('panel'),sh=d.getElementById('sheet');if(!p||!sh)return null;p.innerHTML=html;sh.classList.add('on');const nav=d.querySelector('.nav');if(nav)nav.style.pointerEvents='none';const close=()=>{sh.classList.remove('on');p.innerHTML='';if(nav)nav.style.pointerEvents='auto'};sh.onclick=e=>{if(e.target===sh)close()};p.onclick=e=>e.stopPropagation();return{p,close}}function groups(){const base=['Familia novia','Familia novio','Amigos','Trabajo','Otros'];return [...new Set([...base,...Object.values(struct.people).map(x=>x.group_name).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'es'))}function fixPlural(root){root.querySelectorAll('*').forEach(e=>{if(e.children.length===0&&e.textContent.trim()==='1 personas')e.textContent='1 persona'})}function keepMap(d){const inv=d.getElementById('invitados');if(!inv)return;const live=inv.querySelector('[data-v97-structure]');if(live)mapCard=live;if(!live&&mapCard&&!mapCard.isConnected){const anchor=inv.querySelector('[data-v95-pending]')||inv.querySelector('[data-rsvp-entry]')||inv.querySelector('h2');if(anchor)anchor.insertAdjacentElement('afterend',mapCard);else inv.prepend(mapCard)}}function updateGuestLocal(w,id,group,unit){const S=state(w),g=S&&S.guests&&S.guests[id];if(g){g.group=group||'';g.unitId=unit||'';if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render()}}function editPerson(id,d,w){const S=state(w),g=S?.guests?.[id];if(!g)return;const m=struct.people[id]||{},gopts=groups().map(x=>'<option value="'+esc(x)+'" '+(m.group_name===x?'selected':'')+'>'+esc(x)+'</option>').join(''),uopts=struct.units.map(u=>'<option value="'+esc(u.unit_key)+'" '+(m.unit_key===u.unit_key?'selected':'')+'>'+esc(u.name)+'</option>').join('');const o=openSheet(d,'<div class="sectiontag">Persona</div><h2>'+esc(g.name)+'</h2><label>Grupo existente</label><select id="v100g" class="field"><option value="">Sin grupo</option>'+gopts+'</select><div class="small" style="text-align:center;margin:4px 0 10px">o</div><label>Nuevo grupo</label><input id="v100ng" class="field" placeholder="Ej. Vecinos"><label>Unidad existente</label><select id="v100u" class="field"><option value="">Individual / sin unidad</option>'+uopts+'</select><div class="small" style="text-align:center;margin:4px 0 10px">o</div><label>Nueva unidad</label><input id="v100nu" class="field" placeholder="Ej. Familia Pérez"><p class="small">Puedes cambiar de grupo o unidad, o crear cualquiera de los dos aquí mismo.</p><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-save>Guardar</button></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>{o.close()};o.p.querySelector('[data-save]').onclick=async()=>{const b=o.p.querySelector('[data-save]');b.disabled=true;b.textContent='Guardando…';try{let group=o.p.querySelector('#v100g').value,unit=o.p.querySelector('#v100u').value;const ng=o.p.querySelector('#v100ng').value.trim(),nu=o.p.querySelector('#v100nu').value.trim();if(ng)group=ng;if(nu)unit=await createUnit(nu);await savePerson(id,group,unit);updateGuestLocal(w,id,group,unit);o.close();setTimeout(()=>{keepMap(d);fixPlural(d)},0)}catch{b.disabled=false;b.textContent='Guardar'}}}function install(){const x=deep();if(!x){setTimeout(install,120);return}const{d,w}=x;if(installed&&observer)return;installed=true;loadStruct().then(()=>{keepMap(d);fixPlural(d)});observer=new MutationObserver(()=>{keepMap(d);fixPlural(d)});observer.observe(d.body,{childList:true,subtree:true});d.addEventListener('click',e=>{const plan=e.target.closest?.('[data-v81-plan-btn], [data-v81-visual] button');if(plan){e.preventDefault();e.stopImmediatePropagation();top.location.href='guests-v100-visual-seating.html?v=100';return}const p=e.target.closest?.('.v97person[data-person]');const panel=d.getElementById('panel');if(p&&panel&&panel.querySelect
