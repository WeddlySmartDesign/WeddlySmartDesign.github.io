<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests QA</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1ea;color:#2c2a26;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:620px;margin:auto;padding:24px}.brand,.sectiontag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#77716b}.brand{color:#2c2a26}h1{font:500 54px Georgia,serif;margin:18px 0 34px}h2{font-size:34px;margin:18px 0}.card{background:#fff;border:1px solid #ddd5c8;border-radius:20px;padding:22px;margin:16px 0}.alert{border-left:5px solid #a9744d}.small{font-size:14px;color:#706b65;line-height:1.45}.gueststats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#fff;border:1px solid #ddd5c8;border-radius:20px;padding:20px}.num{font-size:40px;font-weight:650}.attentionHead{display:flex;justify-content:space-between;align-items:center;margin-top:28px}.badge{background:#eee6da;border-radius:999px;padding:7px 11px;font-weight:700}.btn{border:0;border-radius:13px;padding:13px 16px;background:#2c2a26;color:#fff;font-weight:700;font-size:15px}.soft{background:#eee8df;color:#2c2a26}.mini{padding:9px 12px}.row,.impact{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #eee}.row:last-child,.impact:last-child{border:0}.status{color:#526b4d;font-weight:700;font-size:13px}.view{display:none;padding-bottom:92px}.view.on{display:block}.nav{position:fixed;z-index:20;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid #ddd5c8;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;padding:12px 2px;font-size:16px;font-weight:650}.nav button.on{background:#eee8df;border-radius:13px}.sheet{display:none;position:fixed;z-index:40;inset:0;background:#0005;align-items:flex-end}.sheet.on{display:flex}.panel{width:100%;max-width:620px;margin:auto;background:#fff;border-radius:25px 25px 0 0;padding:22px 22px calc(24px + env(safe-area-inset-bottom));max-height:84vh;overflow:auto}.choice{display:block;width:100%;text-align:left;border:1px solid #ddd5c8;background:#fff;border-radius:14px;padding:15px;margin:7px 0;font-size:17px}.choice.sel{outline:2px solid #2c2a26}.choice.warn{border-color:#b97465}.actions{display:flex;gap:10px;margin-top:18px}.actions>*{flex:1}.table{padding:0;overflow:hidden}.thead{display:flex;justify-content:space-between;gap:12px;padding:18px 20px;background:#faf8f4;border-bottom:1px solid #eee}.thead h3{margin:0 0 4px}.seat{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid #eee}.field{width:100%;padding:14px;border:1px solid #ccc5bb;border-radius:13px;font-size:17px;margin:6px 0 13px;background:#fff;color:#2c2a26}.tools{display:flex;gap:8px;margin-bottom:14px}.tools>*{flex:1}.pill{font-size:13px;padding:6px 9px;border-radius:999px;background:#eee8df;white-space:nowrap}.bad{background:#f6e8e4;color:#8a4035}.summary{display:flex;gap:20px;flex-wrap:wrap;margin:10px 0 18px}.summary b{font-size:20px}</style></head><body><main class="wrap"><div class="brand">Weddly Smart Design · Guests</div><h1>Daniela & Sergio</h1><section id="hoy" class="view on"></section><section id="invitados" class="view"></section><section id="mesas" class="view"></section><section id="listados" class="view"></section></main><nav class="nav"><button class="on" onclick="go('hoy',0)">Hoy</button><button onclick="go('invitados',1)">Invitados</button><button onclick="go('mesas',2)">Mesas</button><button onclick="go('listados',3)">Listados</button></nav><div id="sheet" class="sheet"><div id="panel" class="panel"></div></div><script>
const KEY='weddly_guests_qa_v67';
const initial={guests:{paula:{name:'Paula Martín',rsvp:'confirmed',meal:'',table:'Mesa 2',transport:true},david:{name:'David Martín',rsvp:'confirmed',meal:'Estándar',table:'Mesa 2',transport:true},leo:{name:'Leo Martín',rsvp:'confirmed',meal:'Infantil',table:'Mesa 2',transport:true,child:7},irene:{name:'Irene López',rsvp:'pending',meal:'',table:'',transport:true},ruben:{name:'Rubén',rsvp:'confirmed',meal:'Estándar',table:'Mesa 4',transport:true},ana:{name:'Ana',rsvp:'confirmed',meal:'Estándar',table:'Mesa 4',transport:false},luis:{name:'Luis',rsvp:'confirmed',meal:'Estándar',table:'Mesa 3',transport:true},marta:{name:'Marta',rsvp:'pending',meal:'Estándar',table:'',transport:true}},tables:{t2:{name:'Mesa 2',cap:4},t3:{name:'Mesa 3',cap:8},t4:{name:'Mesa 4',cap:4}},sent:null,prepared:null,preparedV:1,sentV:1,activity:null};
let S;try{S=JSON.parse(localStorage.getItem(KEY));if(!S){const old=JSON.parse(localStorage.getItem('weddly_guests_qa_v65'));S=old||structuredClone(initial)}}catch(e){S=structuredClone(initial)}
const save=()=>localStorage.setItem(KEY,JSON.stringify(S)),G=()=>Object.entries(S.guests),active=g=>g.rsvp==='confirmed'||g.rsvp==='pending',confirmed=g=>g.rsvp==='confirmed',T=()=>Object.entries(S.tables),occ=n=>G().filter(([,g])=>active(g)&&g.table===n).length,transportCount=()=>G().filter(([,g])=>active(g)&&g.transport).length;
function snap(){let x={};G().forEach(([id,g])=>x[id]=g.table||'');return x}if(!S.sent){S.sent=snap();save()}function seatDiff(){let d={};G().forEach(([id,g])=>{if((g.table||'')!==(S.sent[id]||''))d[id]=[S.sent[id]||'Sin mesa',g.table||'Sin mesa']});return d}function mealIssues(){return G().filter(([,g])=>confirmed(g)&&!g.meal)}function over(){return T().filter(([,t])=>occ(t.name)>t.cap)}function issueCount(){return mealIssues().length+(Object.keys(seatDiff()).length?1:0)+(over().length?1:0)}function record(title,detail,impacts){S.activity={title,detail,impacts,read:false,at:Date.now()};save()}
function render(){renderHoy();renderGuests();renderTables();renderLists();save()}
function renderHoy(){const c=G().filter(([,g])=>g.rsvp==='confirmed').length,p=G().filter(([,g])=>g.rsvp==='pending').length;let alerts='';mealIssues().forEach(([id,g])=>alerts+=`<div class="card alert"><b>${g.name} necesita menú</b><p class="small">Falta elegir su menú.</p><button class="btn" onclick="editMeal('${id}')">Resolver</button></div>`);if(over().length){const [,t]=over()[0];alerts+=`<div class="card alert"><b>${t.name} supera su capacidad</b><p class="small">${occ(t.name)} personas para ${t.cap} plazas.</p><button class="btn soft" onclick="go('mesas',2)">Resolver</button></div>`}if(Object.keys(seatDiff()).length){const id=Object.keys(seatDiff())[0],d=seatDiff()[id];alerts+=`<div class="card alert"><b>Mesas enviadas ya no coinciden</b><p class="small">${S.guests[id].name} · ${d[0]} → ${d[1]}</p><button class="btn soft" onclick="go('listados',3)">Revisar listado</button></div>`}const n=issueCount();let act='';if(S.activity&&!S.activity.read){act=`<div class="card"><div class="sectiontag">Último cambio</div><h3>${S.activity.title}</h3><p class="small">${S.activity.detail}</p>${(S.activity.impacts||[]).length?`<div class="sectiontag" style="margin-top:18px">Actualizado automáticamente</div>${S.activity.impacts.map(x=>`<div class="impact"><div><b>${x.title}</b><div class="small">${x.detail}</div></div><span class="status">Actualizado</span></div>`).join('')}`:''}<button class="btn soft" onclick="markRead()" style="margin-top:16px">Marcar como leído</button></div>`}hoy.innerHTML=`<div class="gueststats"><div class="stat"><div class="num">${c}</div><div>Confirmados</div></div><div class="stat"><div class="num">${p}</div><div>Pendientes</div></div></div><div class="attentionHead"><div class="sectiontag">Necesita tu atención</div><span class="badge">${n}</span></div>${n?alerts:`<div class="card"><b class="status">Todo al día</b><p class="small">No hay acciones pendientes.</p></div>`}${act}`}
function renderGuests(){invitados.innerHTML=`<h2>Invitados</h2><div class="card">${G().map(([id,g])=>`<div class="row"><div><b>${g.name}</b><div class="small">${g.rsvp==='confirmed'?'Confirmado':'Pendiente'} · ${g.meal||'Menú pendiente'} · ${g.table||'Sin mesa'} · Transporte ${g.transport?'Sí':'No'}</div></div><button class="btn soft mini" onclick="editGuest('${id}')">Editar</button></div>`).join('')}</div>`}
function renderTables(){const cap=T().reduce((a,[,t])=>a+t.cap,0),assigned=G().filter(([,g])=>active(g)&&g.table).length,u=G().filter(([,g])=>active(g)&&!g.table);mesas.innerHTML=`<h2>Seating plan</h2><div class="summary"><span><b>${assigned}</b><br><span class="small">con mesa</span></span><span><b>${u.length}</b><br><span class="small">sin mesa</span></span><span><b>${cap-assigned}</b><br><span class="small">plazas libres</span></span></div><div class="tools"><button class="btn soft" onclick="newTable()">+ Añadir mesa</button><button class="btn soft" onclick="printCatering()">Imprimir catering</button></div>${T().map(([id,t])=>tableCard(id,t)).join('')}${u.length?`<div class="card"><b>Sin mesa</b>${u.map(([id,g])=>`<div class="row"><span>${g.name}</span><button class="btn soft mini" onclick="editTableForGuest('${id}')">Asignar</button></div>`).join('')}</div>`:''}`}
function tableCard(id,t){const ps=G().filter(([,g])=>active(g)&&g.table===t.name),f=t.cap-ps.length;return `<div class="card table"><div class="thead"><div><h3>${t.name}</h3><div class="small">${ps.length} de ${t.cap} plazas</div></div><div><span class="pill ${f<0?'bad':''}">${f<0?'Exceso '+Math.abs(f):f===0?'Llena':f+' libre'+(f===1?'':'s')}</span><br><button class="btn soft mini" style="margin-top:8px" onclick="editTable('${id}')">Editar</button></div></div>${ps.map(([gid,g])=>`<div class="seat"><div><b>${g.name}</b><div class="small">${g.rsvp==='pending'?'Pendiente de RSVP':'Confirmado'}</div></div><button class="btn soft mini" onclick="editTableForGuest('${gid}')">Mover</button></div>`).join('')||'<div class="small" style="padding:18px 20px">Sin invitados asignados</div>'}</div>`}
function renderLists(){const d=seatDiff(),lines=Object.entries(d).map(([id,x])=>`<p class="small">${S.guests[id].name}: ${x[0]} → ${x[1]}</p>`).join('');const passengers=G().filter(([,g])=>active(g)&&g.transport).map(([,g])=>g.name);listados.innerHTML=`<h2>Listados</h2><div class="card ${Object.keys(d).length?'alert':''}"><b>Mesas · Boda principal</b><p class="small">Preparada V${S.preparedV} · Enviada V${S.sentV}${!Object.keys(d).length?' · Todo actualizado':''}</p>${lines}${Object.keys(d).length?`<button class="btn" onclick="prepareSeating()">Preparar nueva versión</button>`:''}${S.preparedV>S.sentV?` <button class="btn soft" onclick="confirmSent()">Confirmar envío V${S.preparedV}</button>`:''}</div><div class="card"><b>Catering · Boda principal</b><p class="small">Documento listo para imprimir: mesa, nombre, menú y resumen por mesa y total.</p><div class="tools"><button class="btn" onclick="printCatering()">Imprimir / PDF</button><button class="btn soft" onclick="downloadCateringCsv()">Excel</button></div></div><div class="card"><b>Transporte · Boda principal</b><p class="small">${passengers.length} personas usan transporte.</p><div class="small" style="margin:10px 0">${passengers.join(' · ')||'Nadie asignado'}</div><div class="tools"><button class="btn" onclick="printTransport()">Imprimir / PDF</button><button class="btn soft" onclick="downloadTransportCsv()">Excel</button></div></div>`}
function go(id,n){document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('on',i===n));render()}function openSheet(x){panel.innerHTML=x;sheet.classList.add('on')}function closeSheet(){sheet.classList.remove('on')}function choose(b,v){window.choice=v;b.parentNode.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function editGuest(id){const g=S.guests[id];openSheet(`<div class="sectiontag">${g.name}</div><h2>Editar invitado</h2><button class="choice" onclick="closeSheet();editMeal('${id}')">Menú · ${g.meal||'Pendiente'}</button><button class="choice" onclick="closeSheet();editTableForGuest('${id}')">Mesa · ${g.table||'Sin mesa'}</button><button class="choice" onclick="closeSheet();editTransport('${id}')">Transporte · ${g.transport?'Sí':'No'}</button><button class="choice" onclick="closeSheet();editRsvp('${id}')">RSVP · ${g.rsvp==='confirmed'?'Confirmado':'Pendiente'}</button><div class="actions"><button class="btn soft" onclick="closeSheet()">Cerrar</button></div>`)}
function editMeal(id){const g=S.guests[id];window.choice=g.meal;openSheet(`<div class="sectiontag">${g.name}</div><h2>Elegir menú</h2>${['Estándar','Vegetariano','Celíaco','Sin lactosa','Vegano','Infantil','Alérgico'].map(x=>`<button class="choice ${x===g.meal?'sel':''}" onclick="choose(this,'${x}')">${x}</button>`).join('')}<div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveMeal('${id}')">Guardar</button></div>`)}function saveMeal(id){if(!window.choice)return;const g=S.guests[id],old=g.meal||'Pendiente';g.meal=window.choice;record(`${g.name} · menú actualizado`,`${old} → ${g.meal}`,[{title:'Catering actual',detail:`Menú de ${g.name} recalculado`}]);closeSheet();render()}
function editTransport(id){const g=S.guests[id];window.choice=g.transport?'yes':'no';openSheet(`<div class="sectiontag">${g.name}</div><h2>Transporte</h2><button class="choice ${g.transport?'sel':''}" onclick="choose(this,'yes')">Sí, usa transporte</button><button class="choice ${!g.transport?'sel':''}" onclick="choose(this,'no')">No usa transporte</button><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveTransport('${id}')">Guardar</button></div>`)}function saveTransport(id){if(!window.choice)return;const g=S.guests[id],before=transportCount(),old=g.transport;g.transport=window.choice==='yes';const after=transportCount();record(`${g.name} · transporte actualizado`,g.transport?'Ahora usa transporte':'Ya no usa transporte',old===g.transport?[]:[{title:'Transporte',detail:`${before} → ${after} plazas usadas`}]);closeSheet();render()}
function editRsvp(id){const g=S.guests[id];window.choice=g.rsvp;openSheet(`<div class="sectiontag">${g.name}</div><h2>RSVP</h2>${[['confirmed','Confirmado'],['pending','Pendiente'],['declined','No asiste']].map(([v,l])=>`<button class="choice ${g.rsvp===v?'sel':''}" onclick="choose(this,'${v}')">${l}</button>`).join('')}<div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveRsvp('${id}')">Guardar</button></div>`)}function saveRsvp(id){if(!window.choice)return;const g=S.guests[id],old=g.rsvp,beforeT=transportCount(),oldTable=g.table,oldOcc=oldTable?occ(oldTable):0;g.rsvp=window.choice;const impacts=[];if(oldTable)impacts.push({title:oldTable,detail:`${oldOcc} → ${occ(oldTable)} ocupados`});if(beforeT!==transportCount())impacts.push({title:'Transporte',detail:`${beforeT} → ${transportCount()} plazas usadas`});impacts.push({title:'Catering actual',detail:g.rsvp==='declined'?`${g.name} eliminado del recuento`:`RSVP de ${g.name} actualizado`});record(`${g.name} · RSVP actualizado`,`${labelR(old)} → ${labelR(g.rsvp)}`,impacts);closeSheet();render()}function labelR(v){return v==='confirmed'?'Confirmado':v==='pending'?'Pendiente':'No asiste'}
function editTableForGuest(id){const g=S.guests[id],cur=g.table;window.choice=cur;openSheet(`<div class="sectiontag">${g.name} · Boda principal</div><h2>${cur?'Mover de mesa':'Asignar mesa'}</h2><p class="small">${cur?'Ahora está en '+cur+'.':''}</p>${T().map(([,t])=>{const o=occ(t.name),would=cur===t.name?o:o+1;return `<button class="choice ${cur===t.name?'sel':''} ${would>t.cap?'warn':''}" onclick="choose(this,'${t.name}')"><b>${t.name}</b><br><span class="small">${o} de ${t.cap} plazas${would>t.cap?' · quedaría en exceso':''}</span></button>`}).join('')}<div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveGuestTable('${id}')">Guardar</button></div>`)}function saveGuestTable(id){if(!window.choice)return;const g=S.guests[id],old=g.table||'Sin mesa',oldName=g.table,oldOcc=oldName?occ(oldName):0,newName=window.choice,newOccBefore=occ(newName);g.table=newName;const impacts=[];if(oldName&&oldName!==newName)impacts.push({title:oldName,detail:`${oldOcc} → ${occ(oldName)} ocupados`});if(oldName!==newName)impacts.push({title:newName,detail:`${newOccBefore} → ${occ(newName)} ocupados`});if(oldName!==newName)impacts.push({title:'Listado de mesas',detail:'Marcado para actualizar'});record(`${g.name} cambia de mesa`,`${old} → ${newName}`,impacts);closeSheet();render()}
function newTable(){openSheet(`<div class="sectiontag">Boda principal</div><h2>Añadir mesa</h2><label class="small">Nombre</label><input id="tn" class="field" placeholder="Ej. Mesa 5"><label class="small">Capacidad</label><input id="tc" class="field" type="number" min="1" inputmode="numeric" placeholder="Ej. 8"><div class="actions"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn" onclick="saveNewTable()">Añadir</button></div>`)}function saveNewTable(){const n=tn.value.trim(),c=+tc.value;if(!n||c<1)return alert('Indica nombre y capacidad.');if(T().some(([,t])=>t.name.toLowerCase()===n.toLowerCase()))return alert('Ya existe esa mesa.');S.tables['t'+Date.now()]={name:n,cap:c};record(`${n} creada`,`${c} plazas`,[{title:'Seating plan',detail:'Capacidad total recalculada'}]);closeSheet();render()}
function editTable(id){const t=S.tables[id];openSheet(`<div class="sectiontag">Boda principal</div><h2>Editar mesa</h2><label class="small">Nombre</label><input id="tn" class="field" value="${t.name}"><label class="small">Capacidad</label><input id="tc" class="field" type="number" min="1" value="${t.cap}"><div class="actions"><button class="btn soft" onclick="deleteTable('${id}')">Eliminar</button><button class="btn" onclick="saveTableEdit('${id}')">Guardar</button></div>`)}function saveTableEdit(id){const t=S.tables[id],oldName=t.name,oldCap=t.cap,n=tn.value.trim(),c=+tc.value;if(!n||c<1)return;G().forEach(([,g])=>{if(g.table===oldName)g.table=n});t.name=n;t.cap=c;record(`${n} actualizada`,`${oldName} · ${oldCap} plazas → ${n} · ${c} plazas`,[{title:'Seating plan',detail:'Aforo recalculado'}]);closeSheet();render()}function deleteTable(id){const t=S.tables[id],affected=G().filter(([,g])=>g.table===t.name);if(!confirm(affected.length?`${affected.length} invitados volverán a Sin mesa. ¿Eliminar ${t.name}?`:`¿Eliminar ${t.name}?`))return;affected.forEach(([,g])=>g.table='');delete S.tables[id];record(`${t.name} eliminada`,`${affected.length} invitados sin mesa`,[{title:'Seating plan',detail:'Distribución recalculada'}]);closeSheet();render()}
function prepareSeating(){S.preparedV++;S.prepared=snap();record(`Mesas · V${S.preparedV} preparada`,'Aún no está marcada como enviada',[]);render()}function confirmSent(){S.sentV=S.preparedV;S.sent=JSON.parse(JSON.stringify(S.prepared||snap()));record(`Mesas · V${S.sentV} enviada`,'Listado de mesas vuelve a estar al día',[]);render()}function markRead(){if(S.activity){S.activity.read=true;save();render()}}
function mealCounts(list){const m={};list.forEach(g=>{const k=g.meal||'PENDIENTE';m[k]=(m[k]||0)+1});return Object.entries(m).map(([k,v])=>`${v} ${k}`).join(' · ')}function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function cateringHtml(){const groups=T().map(([,t])=>{const ps=G().filter(([,g])=>confirmed(g)&&g.table===t.name).map(([,g])=>g);return `<section><h2>${esc(t.name)} <span>${ps.length} personas</span></h2>${ps.length?`<table><thead><tr><th>Nombre</th><th>Menú</th></tr></thead><tbody>${ps.map(g=>`<tr><td>${esc(g.name)}</td><td>${esc(g.meal||'PENDIENTE')}</td></tr>`).join('')}</tbody></table><p class="sum"><b>Resumen:</b> ${esc(mealCounts(ps))}</p>`:'<p>Sin invitados confirmados.</p>'}</section>`}).join('');const all=G().filter(([,g])=>confirmed(g)).map(([,g])=>g);return printDoc('Catering · Boda principal',`<p class="lead">${all.length} invitados confirmados</p>${groups}<section class="total"><h2>Resumen total</h2><p>${esc(mealCounts(all))}</p></section>`)}
function transportHtml(){const ps=G().filter(([,g])=>active(g)&&g.transport).map(([,g])=>g);return printDoc('Transporte · Boda principal',`<p class="lead">${ps.length} personas usan transporte</p><table><thead><tr><th>Nombre</th><th>RSVP</th></tr></thead><tbody>${ps.map(g=>`<tr><td>${esc(g.name)}</td><td>${labelR(g.rsvp)}</td></tr>`).join('')}</tbody></table>`)}
function printDoc(title,body){return `<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${title}</title><style>@page{margin:16mm}body{font-family:Arial,sans-serif;color:#222;max-width:760px;margin:auto;padding:20px}h1{font:500 28px Georgia,serif;margin:0 0 6px}header{border-bottom:2px solid #222;padding-bottom:14px;margin-bottom:24px}.brand{font-size:11px;letter-spacing:.12em;text-transform:uppercase}.lead{font-size:15px;color:#555}section{break-inside:avoid;margin:24px 0}h2{font-size:18px;margin:0 0 10px}h2 span{font-weight:400;color:#666;font-size:14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #ddd}th{font-size:12px;text-transform:uppercase;letter-spacing:.06em}.sum{font-size:13px;background:#f5f2ec;padding:10px}.total{border-top:2px solid #222;padding-top:16px}@media print{body{padding:0}}</style></head><body><header><div class="brand">Weddly Smart Design · Guests</div><h1>${title}</h1><div>Daniela & Sergio</div></header>${body}<script>setTimeout(()=>window.print(),300)<\/script></body></html>`}
function openPrint(html){const w=window.open('','_blank');if(!w)return alert('Permite ventanas emergentes para imprimir.');w.document.open();w.document.write(html);w.document.close()}function printCatering(){openPrint(cateringHtml())}function printTransport(){openPrint(transportHtml())}
function csvDownload(name,rows){const sep=';';const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(sep)).join('\r\n');const b=new Blob([csv],{type:'text/csv;charset=utf-8;'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function downloadCateringCsv(){const rows=[['MESA','NOMBRE','MENÚ']];T().forEach(([,t])=>{const ps=G().filter(([,g])=>confirmed(g)&&g.table===t.name).map(([,g])=>g);ps.forEach(g=>rows.push([t.name,g.name,g.meal||'PENDIENTE']));rows.push([`${t.name} - RESUMEN`,`${ps.length} personas`,mealCounts(ps)]);rows.push(['','',''])});const all=G().filter(([,g])=>confirmed(g)).map(([,g])=>g);rows.push(['TOTAL','',mealCounts(all)]);csvDownload('Catering_Boda_principal.csv',rows)}function downloadTransportCsv(){const rows=[['NOMBRE','RSVP','TRANSPORTE'],...G().filter(([,g])=>active(g)&&g.transport).map(([,g])=>[g.name,labelR(g.rsvp),'Sí'])];csvDownload('Transporte_Boda_principal.csv',rows)}
render();</script></body></html>
