<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><title>Weddly Smart Design · Eventos</title><style>:root{--bg:#F2EFE9;--paper:#FBF8F3;--line:#E4DED2;--soft:#EEF0E9;--accent:#6E7A5C;--dark:#525C43;--ink:#2C2A26;--muted:#736F63;--danger:#A84535}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 16px 80px}.brand{font:500 22px/1 Georgia,serif;color:var(--dark)}.brand span{display:block;font-size:14px;margin-top:3px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:22px}h1{font:500 38px/1.06 Georgia,serif;margin:5px 0 10px}h2{font:500 25px/1.1 Georgia,serif;margin:0 0 8px}.lead{color:var(--muted);line-height:1.5;margin:0}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}.hero{padding:22px}.btn{border:0;border-radius:12px;background:var(--dark);color:#fff;padding:12px 15px;font-size:15px;font-weight:800;min-height:46px}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.soft{background:var(--soft);color:var(--dark)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #DBB2AA}.btn.full{width:100%}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.field{margin-top:13px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:12px 13px;font-size:15px;min-height:46px}.field textarea{min-height:86px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}.stat strong{display:block;font:500 24px Georgia,serif;color:var(--dark)}.stat span{font-size:11px;color:var(--muted)}.sectionTitle{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:22px}.sectionTitle p{font-size:12px;color:var(--muted);margin:3px 0 0}.guestSearch{margin:10px 0}.guest{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.guest:last-child{border-bottom:0}.guest small{display:block;color:var(--muted);margin-top:3px}.guest input{width:22px;height:22px}.task{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task input{width:22px;height:22px;flex:0 0 auto}.task b{display:block}.task small{color:var(--muted)}.pay{padding:11px 0;border-bottom:1px solid var(--line)}.pay:last-child{border-bottom:0}.payTop{display:flex;justify-content:space-between;gap:10px}.pay small{color:var(--muted)}.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;font-weight:800;color:var(--muted);margin:3px 5px 0 0}.status{font-size:12px;color:var(--muted);margin-top:10px}.hidden{display:none!important}.empty{padding:16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.eventTabs{display:flex;gap:7px;overflow:auto;margin-top:16px}.eventTabs button{white-space:nowrap}.eventTabs .on{background:var(--dark);color:#fff;border-color:var(--dark)}@media(max-width:520px){h1{font-size:34px}.two{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.actions .btn{flex:1 1 auto}.sectionTitle{align-items:flex-start}}</style></head><body><main class="wrap"><div class="brand">Weddly<span>Smart Design</span></div><div class="eyebrow">EVENTOS DE LA BODA</div><h1>Un evento extra. Todo conectado.</h1><p class="lead">Activa solo lo que necesites. Invitados, tareas, presupuesto, pagos y calendario se organizan alrededor de ese evento sin mezclarlo con la boda principal.</p><div id="status" class="status">Cargando…</div><div id="app"></div></main><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-event-state',TOKEN='weddly_shared_wedding_token',GUEST='weddly_guests_qa_v67',PAY='weddly_pro_v7';const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state={schema:1,events:{},updatedAt:new Date(0).toISOString()},version=0,current='';function demo(){try{const q=new URLSearchParams(location.search).get('ownerDemo');if(q==='es'||q==='en')return q;const x=localStorage.getItem('weddly_owner_demo_mode');return x==='es'||x==='en'?x:''}catch{return''}}function lang(){if(demo())return demo();try{const p=JSON.parse(localStorage.getItem(PAY)||'null');return p?.settings?.lang==='en'?'en':'es'}catch{return'es'}}function guests(){try{const k=GUEST+(demo()?'_snapshot_demo_'+demo():'');const s=JSON.parse(localStorage.getItem(k)||localStorage.getItem(GUEST)||'null')||{};return Object.entries(s.guests||{}).map(([id,g])=>({id,...g})).filter(g=>g.rsvp!=='declined')}catch{return[]}}function weddingDate(){try{const k=demo()?PAY+'_owner_demo_'+demo():PAY,p=JSON.parse(localStorage.getItem(k)||'null')||{};const d=p?.settings?.weddingDate;if(/^\d{4}-\d{2}-\d{2}$/.test(String(d||'')))return d}catch{}try{const k=GUEST+(demo()?'_snapshot_demo_'+demo():''),g=JSON.parse(localStorage.getItem(k)||'null')||{},d=g?.meta?.weddingDate;return /^\d{4}-\d{2}-\d{2}$/.test(String(d||''))?d:''}catch{return''}}function addDays(date,n){if(!date)return'';const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}function defaults(date){const en=lang()==='en',defs=en?[['format',-75,'Define the format'],['venue',-70,'Choose and book the venue'],['budget',-65,'Set the event budget'],['guests',-55,'Finalise who is invited'],['food',-40,'Finalise food and drinks'],['invite',-30,'Send event information'],['transport',-20,'Arrange transport if needed'],['confirm',-10,'Confirm attendees and final numbers'],['final',-2,'Confirm timing, supplier and final plan']]:[['format',-75,'Definir formato: cena, cóctel o encuentro informal'],['venue',-70,'Buscar y cerrar dónde hacerlo'],['budget',-65,'Fijar presupuesto del evento'],['guests',-55,'Cerrar quién está invitado'],['food',-40,'Cerrar comida y bebida'],['invite',-30,'Enviar información a los invitados'],['transport',-20,'Resolver transporte si hace falta'],['confirm',-10,'Confirmar asistentes y cantidades'],['final',-2,'Confirmar horario, proveedor y plan final']];return Object.fromEntries(defs.map(([id,days,title])=>[id,{id,title,due:addDays(date,days),done:false,custom:false,updatedAt:new Date().toISOString()}]))}function eventTemplate(){const wed=weddingDate(),date=addDays(wed,-1),en=lang()==='en';return{id:'event_'+Date.now().toString(36),name:en?'Welcome Dinner':'Preboda',date,time:'20:00',venue:'',address:'',enabled:true,budget:0,guestIds:[],tasks:defaults(date),payments:{},responses:{},updatedAt:new Date().toISOString()}}function headers(){const h={'content-type':'application/json','x-weddly-token':localStorage.getItem(TOKEN)||''};if(demo())h['x-weddly-demo']=demo();return h}async function load(){try{const r=await fetch(API,{headers:headers(),cache:'no-store'}),x=await r.json();if(!r.ok||!x.ok)throw 0;state=x.state&&typeof x.state==='object'?x.state:state;state.events=state.events||{};version=Number(x.version||0);const ids=Object.keys(state.events);current=ids[0]||'';$('#status').textContent='Sincronizado';render()}catch{$('#status').textContent='No se ha podido cargar';$('#app').innerHTML='<div class="card"><p class="lead">Vuelve a abrir Eventos desde Guests.</p></div>'}}async function save(){state.updatedAt=new Date().toISOString();$('#status').textContent='Guardando…';const r=await fetch(API,{method:'PUT',headers:headers(),body:JSON.stringify({state,version}),cache:'no-store'}),x=await r.json().catch(()=>({}));if(r.status===409&&x.server){state=x.server.state||state;version=Number(x.server.version||0);$('#status').textContent='Actualizado en el otro móvil. Revisa antes de continuar.';render();return false}if(!r.ok||!x.ok){$('#status').textContent='No se ha podido guardar';return false}version=Number(x.version||version+1);$('#status').textContent='Sincronizado';return true}function totals(ev){const xs=Object.values(ev.payments||{}),comm=xs.reduce((n,p)=>n+Number(p.amount||0),0),paid=xs.filter(p=>p.status==='paid').reduce((n,p)=>n+Number(p.amount||0),0);return{comm,paid,left:Number(ev.budget||0)-comm}}function calUrl(e){if(!e?.date)return'';const d=e.date.replaceAll('-',''),next=addDays(e.date,1).replaceAll('-','');let dates=`${d}/${next}`;if(e.time){const s=new Date(`${e.date}T${e.time}:00`),end=new Date(s.getTime()+3*3600000),f=x=>[x.getFullYear(),String(x.getMonth()+1).padStart(2,'0'),String(x.getDate()).padStart(2,'0')].join('')+'T'+String(x.getHours()).padStart(2,'0')+String(x.getMinutes()).padStart(2,'0')+'00';dates=`${f(s)}/${f(end)}`}const p=new URLSearchParams({action:'TEMPLATE',text:e.name||'Evento',dates,location:e.address||e.venue||'',details:e.venue||''});return'https://calendar.google.com/calendar/render?'+p.toString()}function tabs(){const es=Object.values(state.events||{});if(!es.length)return'';return `<div class="eventTabs">${es.map(e=>`<button class="btn secondary ${e.id===current?'on':''}" data-tab="${safe(e.id)}">${safe(e.name||'Evento')}</button>`).join('')}<button class="btn secondary" id="addEvent">+ ${lang()==='en'?'Event':'Evento'}</button></div>`}function renderEmpty(){const en=lang()==='en';$('#app').innerHTML=`<div class="card hero"><h2>${en?'Are you having a pre-wedding event?':'¿Haréis preboda?'}</h2><p class="lead">${en?'Turn it on and Weddly Smart Design will create the guest list, tasks, budget and calendar around it.':'Actívala y Weddly Smart Design preparará alrededor de ella invitados, tareas, presupuesto y calendario.'}</p><div class="actions"><button class="btn" id="activate">${en?'Activate event':'Activar preboda'}</button></div></div>`;$('#activate').onclick=async()=>{const e=eventTemplate();state.events[e.id]=e;current=e.id;await save();render()}}function render(){const es=Object.values(state.events||{});if(!es.length){renderEmpty();return}if(!state.events[current])current=es[0].id;const ev=state.events[current],T=totals(ev),gs=guests(),en=lang()==='en';$('#app').innerHTML=tabs()+`<div class="card"><div class="two"><div class="field"><label>${en?'Name':'Nombre'}</label><input id="name" value="${safe(ev.name||'')}"></div><div class="field"><label>${en?'Date':'Fecha'}</label><input id="date" type="date" value="${safe(ev.date||'')}"></div></div><div class="two"><div class="field"><label>${en?'Time':'Hora'}</label><input id="time" type="time" value="${safe(ev.time||'')}"></div><div class="field"><label>${en?'Budget':'Presupuesto'}</label><input id="budget" type="number" min="0" step="1" value="${Number(ev.budget||0)}"></div></div><div class="field"><label>${en?'Venue':'Lugar'}</label><input id="venue" value="${safe(ev.venue||'')}"></div><div class="field"><label>${en?'Address':'Dirección'}</label><input id="address" value="${safe(ev.address||'')}"></div><div class="actions"><button class="btn" id="saveEvent">${en?'Save':'Guardar'}</button>${ev.date?`<a class="btn secondary" target="_top" rel="noopener" href="${safe(calUrl(ev))}">${en?'Add to Google Calendar':'Añadir a Google Calendar'}</a>`:''}<button class="btn danger" id="disable">${ev.enabled===false?(en?'Reactivate':'Reactivar'):(en?'Disable':'Desactivar')}</button></div></div><div class="summary"><div class="stat"><strong>${ev.guestIds?.length||0}</strong><span>${en?'Invited':'Invitados'}</span></div><div class="stat"><strong>${T.comm.toFixed(0)} €</strong><span>${en?'Committed':'Comprometido'}</span></div><div class="stat"><strong>${T.paid.toFixed(0)} €</strong><span>${en?'Paid':'Pagado'}</span></div></div><div class="sectionTitle"><div><h2>${en?'Guest list':'Lista de invitados'}</h2><p>${en?'Only these people will see this event in their invitation.':'Solo estas personas verán este evento en su invitación.'}</p></div></div><div class="card"><input id="guestSearch" class="field" style="margin:0" placeholder="${en?'Search guest':'Buscar invitado'}"><div id="guestList">${guestRows(gs,ev)}</div></div><div class="sectionTitle"><div><h2>${en?'Specific tasks':'Tareas específicas'}</h2><p>${en?'Created around the event date.':'Creadas alrededor de la fecha del evento.'}</p></div></div><div class="card" id="tasks">${taskRows(ev)}</div><div class="sectionTitle"><div><h2>${en?'Event budget':'Presupuesto del evento'}</h2><p>${en?'Separate from the main wedding budget.':'Separado del presupuesto de la boda principal.'}</p></div><button class="btn secondary" id="addPay">+ ${en?'Payment':'Pago'}</button></div><div class="card"><div class="pill">${en?'Budget':'Presupuesto'} ${Number(ev.budget||0).toFixed(0)} €</div><div class="pill">${en?'Committed':'Comprometido'} ${T.comm.toFixed(0)} €</div><div class="pill">${en?'Available':'Disponible'} ${T.left.toFixed(0)} €</div><div id="payments">${paymentRows(ev)}</div></div>`;wire(ev,gs)}function guestRows(gs,ev){const set=new Set((ev.guestIds||[]).map(String));return gs.map(g=>`<label class="guest" data-name="${safe(String(g.name||'').toLowerCase())}"><span><b>${safe(g.name||'Sin nombre')}</b><small>${safe(g.group||'')}</small></span><input type="checkbox" data-guest="${safe(g.id)}" ${set.has(String(g.id))?'checked':''}></label>`).join('')||'<div class="empty">No hay invitados todavía.</div>'}function taskRows(ev){return Object.values(ev.tasks||{}).sort((a,b)=>String(a.due||'').localeCompare(String(b.due||''))).map(t=>`<label class="task"><input type="checkbox" data-task="${safe(t.id)}" ${t.done?'checked':''}><span><b>${safe(t.title||'')}</b><small>${safe(t.due||'')}</small></span></label>`).join('')||'<div class="empty">Sin tareas.</div>'}function paymentRows(ev){const xs=Object.values(ev.payments||{});return xs.length?xs.sort((a,b)=>String(a.due||'').localeCompare(String(b.due||''))).map(p=>`<div class="pay"><div class="payTop"><b>${safe(p.concept||'Pago')}</b><strong>${Number(p.amount||0).toFixed(0)} €</strong></div><small>${safe([p.provider,p.due,p.status==='paid'?'Pagado':'Programado'].filter(Boolean).join(' · '))}</small></div>`).join(''):'<div class="empty" style="margin-top:12px">Sin pagos específicos todavía.</div>'}function wire(ev,gs){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;render()});$('#addEvent')?.addEventListener('click',async()=>{const e=eventTemplate();e.name=lang()==='en'?'Extra event':'Otro evento';state.events[e.id]=e;current=e.id;await save();render()});$('#saveEvent').onclick=async()=>{const oldDate=ev.date;ev.name=$('#name').value.trim()||ev.name;ev.date=$('#date').value;ev.time=$('#time').value;ev.budget=Math.max(0,Number($('#budget').value||0));ev.venue=$('#venue').value.trim();ev.address=$('#address').value.trim();if(ev.date&&oldDate!==ev.date&&Object.values(ev.tasks||{}).every(t=>!t.custom)){ev.tasks=defaults(ev.date)}ev.updatedAt=new Date().toISOString();await save();render()};$('#disable').onclick=async()=>{ev.enabled=ev.enabled===false;ev.updatedAt=new Date().toISOString();await save();render()};document.querySelectorAll('[data-guest]').forEach(c=>c.onchange=async()=>{const s=new Set((ev.guestIds||[]).map(String));c.checked?s.add(c.dataset.guest):s.delete(c.dataset.guest);ev.guestIds=[...s];ev.guestUpdatedAt=new Date().toISOString();await save()});$('#guestSearch').oninput=e=>{const v=e.target.value.trim().toLowerCase();document.querySelectorAll('#guestList .guest').forEach(x=>x.classList.toggle('hidden',!!v&&!x.dataset.name.includes(v)))};document.querySelectorAll('[data-task]').forEach(c=>c.onchange=async()=>{const t=ev.tasks[c.dataset.task];if(t){t.done=c.checked;t.updatedAt=new Date().toISOString();await save()}});$('#addPay').onclick=()=>addPayment(ev)}function addPayment(ev){const en=lang()==='en',concept=prompt(en?'Payment concept':'Concepto del pago');if(!concept)return;const amount=Number(prompt(en?'Amount':'Importe')||0);if(!(amount>0))return;const due=prompt(en?'Due date (YYYY-MM-DD)':'Vencimiento (AAAA-MM-DD)')||'';const provider=prompt(en?'Supplier':'Proveedor')||'';const paid=confirm(en?'Is it already paid?':'¿Ya está pagado?');const id='p_'+Date.now().toString(36);ev.payments=ev.payments||{};ev.payments[id]={id,concept:concept.trim(),amount,due:due.trim(),provider:provider.trim(),status:paid?'paid':'scheduled',updatedAt:new Date().toISOString()};save().then(render)}load()})();</script></body></html>
