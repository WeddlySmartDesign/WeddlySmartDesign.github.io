<body>
<main class="shell"><header class="head"><div class="brand"><b>GUEST</b><em>by WeddlySmartDesign</em></div><div class="headright"><span class="demo-pill">DEMO · DATOS FICTICIOS</span><span class="avatar" aria-label="Boda de muestra">C&amp;M</span></div></header><div class="notice">Demostración para capturas de pantalla · sin cuenta, sin pagos y sin envíos reales. Los cambios solo se guardan en este navegador.</div><div id="screen" aria-live="polite"></div></main>
<nav id="bottomnav" class="bottomnav" aria-label="Menú principal"><button data-go="inicio"><i aria-hidden="true">⌂</i>Inicio</button><button data-go="invitados"><i aria-hidden="true">♙</i>Invitados</button><button data-go="rsvp"><i aria-hidden="true">✓</i>RSVP</button><button data-go="mesas"><i aria-hidden="true">◯</i>Mesas</button><button data-go="mas"><i aria-hidden="true">☷</i>Más</button></nav>
<div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-label="Detalle de demostración"><div id="sheet" class="sheet"></div></div><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const KEY='guest-screenshots-demo-2026-10-21-v1';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first=[
 ['Lucía Moreno','Familia de Clara','Moreno','confirmed','Mesa 1',true],['Andrés Moreno','Familia de Clara','Moreno','confirmed','Mesa 1',true],['Elena Moreno','Familia de Clara','Moreno','confirmed','Mesa 1',true],['Daniel Moreno','Familia de Clara','Moreno','pending','',false],
 ['Isabel Santos','Familia de Clara','Santos','confirmed','Mesa 1',true],['Javier Santos','Familia de Clara','Santos','confirmed','Mesa 1',true],['Marina Santos','Familia de Clara','Santos','declined','',true],
 ['Pablo Ruiz','Familia de Mateo','Ruiz','confirmed','Mesa 2',true],['Ana Ruiz','Familia de Mateo','Ruiz','confirmed','Mesa 2',true],['Carmen Ruiz','Familia de Mateo','Ruiz','pending','',true],['Luis Ruiz','Familia de Mateo','Ruiz','pending','',false],
 ['Julia Torres','Familia de Mateo','Torres','confirmed','Mesa 2',true],['Hugo Torres','Familia de Mateo','Torres','confirmed','Mesa 2',true],['Eva Torres','Familia de Mateo','Torres','declined','',true],
 ['Nerea Gómez','Amigos','Universidad','confirmed','Mesa 3',true],['Sergio Gil','Amigos','Universidad','confirmed','Mesa 3',true],['Paula Díaz','Amigos','Universidad','pending','',false],['Diego Vega','Amigos','Universidad','pending','',false],
 ['Sofía Molina','Amigos','Infancia','confirmed','Mesa 3',true],['Laura Pérez','Amigos','Infancia','confirmed','Mesa 3',true],['Mario López','Amigos','Infancia','pending','',false],['Andrea Vidal','Amigos','Infancia','declined','',true],
 ['Natalia León','Trabajo','Compañeros','confirmed','Mesa 4',true],['Óscar Romero','Trabajo','Compañeros','confirmed','Mesa 4',true],['Sara Martín','Trabajo','Compañeros','pending','',false],['Iván Ortega','Trabajo','Compañeros','pending','',true]
];
const seed=()=>({guests:first.map((a,i)=>({id:'g'+(i+1),name:a[0],group:a[1],unit:a[2],rsvp:a[3],table:a[4],sent:a[5],plusone:false,allergy:'',brunch:i%3===0})),tables:[{name:'Mesa 1',capacity:8},{name:'Mesa 2',capacity:8},{name:'Mesa 3',capacity:8},{name:'Mesa 4',capacity:8}],events:[{id:'ev1',name:'Cena de bienvenida',date:'11 junio 2027',place:'Jardines del Olivar',selected:['g1','g2','g8','g9','g15','g19']},{id:'ev2',name:'Brunch del domingo',date:'13 junio 2027',place:'La Terraza',selected:['g1','g3','g6','g12','g16','g20','g23']}],theme:'nordic',next:27});
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.guests)&&Array.isArray(x.tables)&&Array.isArray(x.events))return x}catch{}return seed()}
let db=load(),page='inicio',filter='all',query='',rfilter='all',listGroup='all';const screen=document.getElementById('screen');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};
function metric(){let yes=db.guests.filter(x=>x.rsvp==='confirmed').length,no=db.guests.filter(x=>x.rsvp==='declined').length,pending=db.guests.length-yes-no,sent=db.guests.filter(x=>x.sent).length;return {yes,no,pending,sent,total:db.guests.length,units:new Set(db.guests.map(x=>x.group+'|'+x.unit)).size}}
const chip=g=>`<span class="status ${g.rsvp==='confirmed'?'yes':g.rsvp==='declined'?'no':''}">${g.rsvp==='confirmed'?'Confirmado':g.rsvp==='declined'?'No asiste':'Pendiente'}</span>`;
function head(label,title,desc,extra=''){return `<div class="eyebrow">${esc(label)}</div><div class="heading"><div><h1>${esc(title)}</h1>${desc?`<p>${esc(desc)}</p>`:''}</div>${extra}</div>`}
function stats(k='all'){const m=metric();return `<div class="stats"><div class="stat"><strong>${m.total}</strong><span>Invitados</span></div><div class="stat"><strong>${m.yes}</strong><span>Confirmados</span></div><div class="stat"><strong>${m.pending}</strong><span>Pendientes</span></div></div>`}
function section(t,r=''){return `<div class="sectionline"><h2>${esc(t)}</h2>${r}</div>`}
function row(g,mode='invitados'){return `<div class="guestrow"><div class="person"><b>${esc(g.name)}</b><small>${esc(g.group)} · ${esc(g.unit)}${g.table?' · '+esc(g.table):''}</small>${mode==='envios'?`<span class="mini-unit">${g.sent?'Envío registrado':'Por enviar'}</span>`:''}</div><div style="display:grid;justify-items:end;gap:7px">${chip(g)}<button class="rowlink" data-guest="${esc(g.id)}" aria-label="Ver ${esc(g.name)}">Gestionar ›</button></div></div>`}
function home(){const m=metric();return `<section class="hero"><div class="fict">Nuestra boda · ejemplo</div><h1>Clara <span style="font-style:italic;color:var(--accent)">&amp;</span> Mateo</h1><p>Un lugar para organizar a los que más queréis, sin perder ningún detalle.</p><div class="date">12 JUNIO 2027 · MURCIA</div></section><div class="eyebrow">EL ESTADO DE VUESTRA BODA</div>${stats()}<div class="card" style="margin-top:11px"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:13px">Respuestas recibidas</b><span class="muted">${m.yes+m.no} de ${m.total}</span></div><div class="progress"><i style="width:${100*m.yes/Math.max(m.total,1)}%"></i><i style="width:${100*m.no/Math.max(m.total,1)}%"></i></div><div class="statnote">${m.no} no asistirán · ${m.pending} respuestas pendientes</div></div><section class="section">${section('Todo bajo control')}<div class="quick"><button data-go="invitados"><span class="qicon">♙</span><strong>Invitados</strong><small>Personas, grupos y unidades</small></button><button data-go="rsvp"><span class="qicon">✓</span><strong>Respuestas RSVP</strong><small>Enviados, confirmados y pendientes</small></button><button data-go="mesas"><span class="qicon">◯</span><strong>Organizar mesas</strong><small>Distribución y plazas</small></button><button data-go="eventos"><span class="qicon">✧</span><strong>Eventos extra</strong><small>Cena, brunch y otros momentos</small></button></div></section><section class="section">${section('La invitación final')}<div class="card"><h3>El diseño aprobado, siempre disponible</h3><p class="lead">En GUEST real podéis consultar y compartir vuestra invitación terminada. Esta DEMO no envía mensajes.</p><div class="actions"><button class="btn" data-go="invitacion">Ver invitación de muestra ↗</button><button class="btn alt" data-go="envios">Gestionar envíos</button></div></div></section>`}
function guests(){let m=metric();const selected=db.guests.filter(g=>(filter==='all'||(filter==='confirmed'&&g.rsvp==='confirmed')||(filter==='pending'&&g.rsvp==='pending')||(filter==='declined'&&g.rsvp==='declined'))&&(listGroup==='all'||g.group===listGroup)&&g.name.toLocaleLowerCase('es').includes(query.toLocaleLowerCase('es')));return `${head('ORGANIZACIÓN','Invitados','Cada persona en su grupo, subgrupo y unidad de invitación.')}<div class="section">${stats()}<div class="actions"><button class="btn" data-action="add-guest">+ Añadir invitado</button><button class="btn alt" data-go="grupos">Ver grupos (${new Set(db.guests.map(g=>g.group)).size})</button></div></div><section class="section"><input aria-label="Buscar invitados" class="search" id="search" placeholder="Buscar por nombre…" value="${esc(query)}"><div class="filters" role="group" aria-label="Filtrar asistentes">${[['all','Todos'],['confirmed','Confirmados'],['pending','Pendientes'],['declined','No asisten']].map(([v,l])=>`<button class="filter ${filter===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}</div><div class="card">${selected.length?selected.map(g=>row(g)).join(''):'<div class="empty">No hay invitados con este filtro.</div>'}</div><div class="actions"><button class="btn line full" data-go="listados">Ver listados y exportar</button></div></section>`}
function rsvp(){let m=metric();const shown=db.guests.filter(g=>rfilter==='all'||(rfilter==='sent'&&g.sent)||(rfilter==='pending'&&g.rsvp==='pending'));return `${head('RSVP','Envíos y respuestas','Seguimiento de la invitación final y registro de las respuestas.')}<section class="section">${stats()}<div class="card" style="margin-top:11px"><div class="sectionline" style="margin:0"><h2 style="font-size:19px">Invitaciones gestionadas</h2><span>${m.sent}/${m.total}</span></div><div class="progress"><i style="width:${100*m.sent/Math.max(1,m.total)}%"></i></div><p class="detail">Una demostración del control de envíos y las confirmaciones, sin contactar con nadie.</p><button class="btn alt full" data-go="envios">Gestionar envíos de muestra</button></div></section><section class="section">${section('Estado por invitado')}<div class="filters">${[['all','Todos'],['pending','Pendientes'],['sent','Enviados']].map(([v,l])=>`<button data-rfilter="${v}" class="filter ${rfilter===v?'active':''}">${l}</button>`).join('')}</div><div class="card">${shown.map(g=>row(g,'envios')).join('')}</div></section>`}
function tables(){let unassigned=db.guests.filter(g=>g.rsvp!=='declined'&&!g.table).length;return `${head('ORGANIZACIÓN','Las mesas','Distribución visual de invitados y control del aforo.','<button class="btn alt sm" data-action="add-table">+ Mesa</button>')}<section class="section"><div class="stats"><div class="stat"><strong>${db.tables.length}</strong><span>Mesas</span></div><div class="stat"><strong>${db.guests.filter(g=>g.table).length}</strong><span>Con mesa</span></div><div class="stat"><strong>${unassigned}</strong><span>Sin asignar*</span></div></div><p class="detail">*Se excluyen quienes han indicado que no asistirán.</p></section><section class="section">${section('Plano de distribución')}<div class="tablegrid">${db.tables.map((t,i)=>{let placed=db.guests.filter(g=>g.table===t.name),n=placed.length;return `<button class="tablecard" data-table="${esc(t.name)}"><div class="tblcircle">${i+1}</div><strong>${esc(t.name)}</strong><small>${n} de ${t.capacity} plazas · ver invitados</small></button>`}).join('')}</div></section><section class="section">${section('Pendientes de colocar')}<div class="card">${db.guests.filter(g=>g.rsvp!=='declined'&&!g.table).slice(0,8).map(g=>row(g)).join('')||'<div class="empty">Todos tienen una mesa asignada.</div>'}</div></section>`}
function more(){return `${head('MÁS HERRAMIENTAS','Todo lo demás','Funciones de organización que acompañan a la invitación digital.') }<section class="section">${[['eventos','Eventos extra','Gestiona invitados y respuestas de preboda o brunch'],['envios','Envíos y avisos','Consulta quién recibió la invitación y quién falta'],['listados','Listados y exportación','Información descargable para organizar la boda'],['grupos','Grupos y unidades','Familias, amigos, subgrupos y acompañantes'],['invitacion','Invitación final','Acceso al diseño elegido y aprobado'],['ajustes','Ajustes de la DEMO','Temas visuales, datos de ejemplo y reinicio']].map(([id,n,d])=>`<button class="listcard" data-go="${id}"><span><b>${n}</b><small>${d}</small></span><span class="arrow">›</span></button>`).join('')}</section>`}
function backheading(cat,name,description){return `<div class="actions" style="margin:0 0 16px"><button class="btn line sm" data-go="mas">← Más herramientas</button></div>`+head(cat,name,description)}
function groups(){const groupNames=[...new Set(db.guests.map(g=>g.group))];return backheading('ORGANIZACIÓN','Grupos y unidades','Las invitaciones se pueden organizar por familias, amigos y unidades de envío.')+`<section class="section"><div class="card"><b>${groupNames.length} grupos · ${metric().units} unidades de invitación</b><p class="lead">Para cada grupo se muestran los subgrupos de la boda ficticia.</p></div>${groupNames.map(gr=>{const a=db.guests.filter(g=>g.group===gr),units=[...new Set(a.map(g=>g.unit))];return `<div class="card" style="margin-top:10px"><h3>${esc(gr)} <span class="pill-count">${a.length} personas</span></h3>${units.map(u=>`<div class="guestrow"><div class="person"><b>${esc(u)}</b><small>${a.filter(g=>g.unit===u).map(g=>esc(g.name)).join(' · ')}</small></div><span class="tag">1 unidad</span></div>`).join('')}</div>`}).join('')}</section>`}
function sends(){return backheading('RSVP','Envíos y avisos','Seguimiento local con datos de demostración. No abre WhatsApp ni envía mensajes.')+`<section class="section"><div class="card"><h3>Invitación preparada</h3><p class="lead">Clara & Mateo · 12 junio 2027. En la aplicación real, cada destinatario recibe un enlace seguro de la invitación aprobada.</p><button class="btn alt" data-go="invitacion">Ver invitación final de muestra</button></div></section><section class="section">${section('Control de envíos',''+metric().sent+' registrados')}<div class="card">${db.guests.map(g=>`<div class="guestrow"><div class="person"><b>${esc(g.name)}</b><small>${esc(g.group)} · ${esc(g.unit)}</small></div><button class="btn ${g.sent?'alt':'line'} sm" data-sent="${esc(g.id)}">${g.sent?'✓ Enviado':'Marcar enviado'}</button></div>`).join('')}</div></section>`}
function events(){return backheading('EVENTOS DE BODA','Momentos especiales','Además de la ceremonia, organizad cada encuentro sin mezclar las listas.')+`<section class="section">${db.events.map(e=>`<div class="events-row"><b>${esc(e.name)}</b><p>${esc(e.date)} · ${esc(e.place)}</p><div class="tags"><span class="tag">${e.selected.length} invitados</span><span class="tag">Evento independiente</span></div><div class="actions"><button class="btn alt sm" data-event="${esc(e.id)}">Gestionar invitados</button></div></div>`).join('')}<button class="btn line full" data-action="add-event">+ Crear evento de muestra</button></section>`}
function invitation(){return backheading('INVITACIÓN','Diseño final','En GUEST, la pareja recibe la invitación aprobada junto a la app de gestión.')+`<section class="section"><div class="hero" style="text-align:center;min-height:290px;display:flex;flex-direction:column;align-items:center;justify-content:center"><div class="fict">NOS CASAMOS</div><h1 style="font-size:47px;margin:19px 0">Clara <span style="color:var(--accent);font-style:italic">&amp;</span><br>Mateo</h1><p>12 · 06 · 2027</p><p>Murcia</p></div><div class="card"><h3>Invitación cerrada y aprobada</h3><p class="lead">Esta portada es ilustrativa. La invitación premium de cada pareja se genera con su diseño elegido y no se edita dentro de GUEST.</p><a class="btn full" href="https://55620fad.guest-weddlysmartdesign.pages.dev/guest/catalog-assets/botanica/14.7/" target="_blank" rel="noopener noreferrer">Abrir diseño real BOTÁNICA ↗</a><div class="actions"><button class="btn alt full" data-go="envios">Ver la gestión de envíos</button></div></div></section>`}
function lists(){return backheading('ORGANIZACIÓN','Listados','Consulta y exporta información de la boda de prueba.')+`<section class="section"><div class="card"><h3>Resumen de invitados</h3><div class="ministats"><div class="stat"><strong>${metric().yes}</strong><span>Confirmados</span></div><div class="stat"><strong>${metric().no}</strong><span>No asistirán</span></div><div class="stat"><strong>${metric().pending}</strong><span>Sin respuesta</span></div><div class="stat"><strong>${metric().sent}</strong><span>Envío registrado</span></div></div></div><div class="card"><h3>Exportar listado ficticio</h3><p class="lead">Descarga un CSV con el estado de RSVP, mesa, grupo y unidad de cada invitado de demostración.</p><button class="btn full" data-action="csv">Descargar listado CSV</button></div><div class="card"><h3>Personas pendientes de respuesta</h3>${db.guests.filter(g=>g.rsvp==='pending').map(g=>row(g)).join('')||'<div class="empty">No hay respuestas pendientes.</div>'}</div></section>`}
function settings(){return backheading('PERSONALIZACIÓN','Ajustes','Explora el aspecto y los datos de esta DEMO independiente.')+`<section class="section"><div class="card"><h3>Estilo de la aplicación</h3><div class="field"><label for="theme-select">Tema visual</label><select id="theme-select">${[['nordic','Nordic'],['blush','Blush'],['sand','Arena'],['slate','Slate'],['editorial','Editorial']].map(([k,v])=>`<option value="${k}" ${k===db.theme?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="card"><h3>Datos y seguridad</h3><p class="lead">Esta demostración no pide contraseña ni conecta con Stripe, Supabase, correo o clientes. Los cambios se almacenan únicamente en este navegador (sin sincronización entre dispositivos).</p><button class="btn danger full" data-action="reset">Restablecer datos de demostración</button></div><div class="safe" style="margin-top:14px">La sincronización entre dos móviles y el envío de invitaciones reales pertenecen al sistema GUEST conectado; no forman parte de esta DEMO sin sesión.</div></section>`}
function render(){screen.innerHTML=({inicio:home,invitados:guests,rsvp,mesas:tables,mas:more,grupos:groups,envios:sends,eventos:events,invitacion:invitation,ajustes:settings,listados:lists}[page]||home)();document.querySelectorAll('#bottomnav button').forEach(b=>b.classList.toggle('active',b.dataset.go===(['inicio','invitados','rsvp','mesas'].includes(page)?page:'mas')));document.documentElement.dataset.theme=db.theme;}
function go(s){page=s;filter='all';query='';rfilter='all';render();window.scrollTo({top:0,behavior:'instant'})}
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.classList.add('open');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('open'),2600)}
function modal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('dialog').classList.add('open');document.body.style.overflow='hidden'}
function close(){document.getElementById('dialog').classList.remove('open');document.body.style.overflow=''}
function modalhead(t){return `<div class="sheethead"><h2>${esc(t)}</h2><button class="close" data-action="close" aria-label="Cerrar">×</button></div>`}
function guestmodal(id){const g=db.guests.find(x=>x.id===id);if(!g)return;modal(modalhead(g.name)+`<p class="lead">${esc(g.group)} · ${esc(g.unit)}</p><form id="guest-form"><input type="hidden" name="id" value="${esc(g.id)}"><div class="field"><label for="edit-rsvp">Respuesta RSVP</label><select id="edit-rsvp" name="rsvp"><option value="pending" ${g.rsvp==='pending'?'selected':''}>Pendiente</option><option value="confirmed" ${g.rsvp==='confirmed'?'selected':''}>Confirma asistencia</option><option value="declined" ${g.rsvp==='declined'?'selected':''}>No asistirá</option></select></div><div class="field"><label for="edit-table">Mesa asignada</label><select id="edit-table" name="table"><option value="">Sin mesa</option>${db.tables.map(t=>`<option value="${esc(t.name)}" ${g.table===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label for="edit-sent">Envío de invitación</label><select id="edit-sent" name="sent"><option value="false" ${!g.sent?'selected':''}>Por enviar</option><option value="true" ${g.sent?'selected':''}>Envío registrado</option></select></div><div class="field"><label for="edit-plus">Acompañante +1</label><select name="plusone" id="edit-plus"><option value="false" ${!g.plusone?'selected':''}>No</option><option value="true" ${g.plusone?'selected':''}>Sí</option></select></div><button class="btn full" type="submit">Guardar cambios de muestra</button></form>`)}
function tablemodal(name){const t=db.tables.find(x=>x.name===name);if(!t)return;let rows=db.guests.filter(g=>g.table===name);modal(modalhead(name)+`<p class="lead">${rows.length} de ${t.capacity} plazas ocupadas. Puedes mover invitados de ejemplo desde su ficha.</p><div class="card">${rows.map(g=>row(g)).join('')||'<div class="empty">Mesa vacía.</div>'}</div><p class="detail">Selecciona «Gestionar» para reasignar la mesa o la respuesta.</p><button class="btn alt full" data-action="close">Cerrar</button>`)}
function eventmodal(id){const e=db.events.find(x=>x.id===id);if(!e)return;modal(modalhead(e.name)+`<p class="lead">${esc(e.date)} · ${esc(e.place)}. Los cambios son solo demostrativos.</p><form id="event-form"><input type="hidden" name="id" value="${esc(id)}"><div class="card" style="margin-bottom:14px"><h3>Invitados a este evento</h3>${db.guests.map(g=>`<label style="display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:11px 0;font-size:13px"><input type="checkbox" name="select" value="${esc(g.id)}" ${e.selected.includes(g.id)?'checked':''} style="width:20px;height:20px"><span>${esc(g.name)}</span></label>`).join('')}</div><button class="btn full" type="submit">Guardar lista del evento</button></form>`)}
function exportCSV(){const rows=[['Nombre','Grupo','Unidad','RSVP','Mesa','Envío registrado','Acompañante +1'],...db.guests.map(g=>[g.name,g.group,g.unit,g.rsvp,g.table,g.sent?'Sí':'No',g.plusone?'Sí':'No'])];const csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\r\n');const a=document.createElement('a');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='GUEST_DEMO_invitados_ficticios.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Listado ficticio exportado')}
document.addEventListener('click',e=>{const target=e.target.closest('button,[data-go],[data-guest],[data-table],[data-event],[data-sent]');if(!target)return;if(target.dataset.go){close();go(target.dataset.go);return}if(target.dataset.guest){guestmodal(target.dataset.guest);return}if(target.dataset.table){tablemodal(target.dataset.table);return}if(target.dataset.event){eventmodal(target.dataset.event);return}if(target.dataset.sent){let g=db.guests.find(x=>x.id===target.dataset.sent);if(g){g.sent=!g.sent;save();render();toast(g.sent?'Envío registrado en la DEMO':'Envío marcado como pendiente')}return}if(target.dataset.filter){filter=target.dataset.filter;render();return}if(target.dataset.rfilter){rfilter=target.dataset.rfilter;render();return}switch(target.dataset.action){case'close':close();break;case'add-guest':modal(modalhead('Añadir invitado')+`<form id="add-guest-form"><div class="field"><label for="new-name">Nombre ficticio</label><input id="new-name" name="name" maxlength="70" required placeholder="Nombre y apellido"></div><div class="field"><label for="new-group">Grupo</label><select id="new-group" name="group"><option>Amigos</option><option>Familia de Clara</option><option>Familia de Mateo</option><option>Trabajo</option></select></div><div class="field"><label for="new-unit">Subgrupo / unidad</label><input name="unit" id="new-unit" maxlength="50" value="Otros" required></div><button class="btn full" type="submit">Añadir a la demostración</button></form>`);break;case'add-table':modal(modalhead('Nueva mesa')+`<form id="add-table-form"><div class="field"><label for="new-table">Nombre</label><input id="new-table" name="name" required maxlength="30" value="Mesa ${db.tables.length+1}"></div><div class="field"><label for="new-cap">Plazas</label><input id="new-cap" name="capacity" type="number" min="1" max="30" value="8" required></div><button class="btn full" type="submit">Crear mesa</button></form>`);break;case'add-event':modal(modalhead('Nuevo evento')+`<form id="add-event-form"><div class="field"><label>Nombre</label><input name="name" maxlength="60" required placeholder="Ej. cóctel de bienvenida"></div><div class="field"><label>Fecha de ejemplo</label><input name="date" maxlength="50" required value="11 junio 2027"></div><div class="field"><label>Lugar de ejemplo</label><input name="place" maxlength="60" required value="Murcia"></div><button class="btn full" type="submit">Crear evento</button></form>`);break;case'csv':exportCSV();break;case'reset':if(confirm('¿Restablecer los datos ficticios de esta demostración?')){db=seed();save();go('inicio');toast('Datos de demostración restaurados')}break;}});
document.addEventListener('submit',e=>{const f=e.target;const formId=f.getAttribute('id');if(!['guest-form','event-form','add-guest-form','add-table-form','add-event-form'].includes(formId))return;e.preventDefault();const d=new FormData(f);if(formId==='guest-form'){let g=db.guests.find(x=>x.id===d.get('id'));if(g){g.rsvp=d.get('rsvp');g.table=d.get('table');g.sent=d.get('sent')==='true';g.plusone=d.get('plusone')==='true';if(g.table){let t=db.tables.find(t=>t.name===g.table);if(db.guests.filter(x=>x.table===g.table).length>t.capacity){toast('Mesa completa; cambia la asignación');return}}}}
else if(formId==='add-guest-form'){db.guests.push({id:'g'+(db.next++),name:String(d.get('name')).trim(),group:d.get('group'),unit:String(d.get('unit')).trim(),rsvp:'pending',table:'',sent:false,plusone:false,brunch:false})}
else if(formId==='add-table-form'){let name=String(d.get('name')).trim();if(db.tables.some(t=>t.name.toLowerCase()===name.toLowerCase())){toast('Esa mesa ya existe');return}db.tables.push({name,capacity:Number(d.get('capacity'))})}
else if(formId==='add-event-form'){db.events.push({id:'ev'+Date.now(),name:String(d.get('name')).trim(),date:String(d.get('date')).trim(),place:String(d.get('place')).trim(),selected:[]})}
else if(formId==='event-form'){let ev=db.events.find(x=>x.id===d.get('id'));if(ev)ev.selected=d.getAll('select')}
save();close();render();toast('Cambios guardados en esta DEMO')});
document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('search');next.focus();next.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='theme-select'){db.theme=e.target.value;save();render();toast('Tema actualizado')}});
document.getElementById('dialog').addEventListener('click',e=>{if(e.target.id==='dialog')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});render();
})();
</script>
</body></html>
