<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>GUEST · visor operativo</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; frame-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#f6f1eb;color:#473b32;font-family:system-ui,sans-serif}#state{padding:18px;text-align:center;font-size:14px;line-height:1.55}#host{width:100%;height:100%;overflow:hidden}#host:not(:empty)+#state{display:none}.error{color:#952b22}</style>
</head><body><div id="host"></div><div id="state" aria-live="polite">Conectando con el Centro GUEST…</div>
<script src="/guest/catalog/guest-catalog-owner-viewer-v2.js"></script>
<script>(()=>{'use strict';
const registryUrl='/guest/GUEST_CATALOG_OWNER_RENDERERS_V2.json',host=document.getElementById('host'),state=document.getElementById('state');
let current=null,locked=false;
function reply(type,nonce,reason){
  // Never expose the config, owner session, or credentials to the embedding page.
  window.parent.postMessage({type,nonce,...(reason?{reason}:{} )},'*')
}
window.addEventListener('message',async event=>{
 if(event.source!==window.parent||locked)return;
 const d=event.data||{};
 if(d.type!=='guest-catalog-config-v1'||!(/^[a-zA-Z0-9_-]{16,80}$/).test(String(d.nonce||'')))return;
 const nonce=d.nonce;locked=true;
 try{
  const id=String(d.order?.template_id||'');
  const version=String(d.order?.template_version||'');
  if(!/^[a-z][a-z0-9-]{0,40}$/.test(id)||!(/^[a-zA-Z0-9._-]{1,30}$/).test(version))throw Error('invalid_catalog_template');
  if(d.config?.template?.id!==id||String(d.config?.template?.version)!==version)throw Error('template_config_mismatch');
  const r=await fetch(registryUrl,{cache:'no-store',redirect:'error'});
  if(!r.ok)throw Error('catalog_registry_unavailable');
  const registry=await r.json(),spec=registry.templates?.[id];
  if(!spec||spec.mode!=='iframe'||spec.version!==version||!spec.src)throw Error('template_not_staged');
  if(spec.status!=='commercially-frozen'&&d.order?.mode!=='test')throw Error('test_only_template');
  if(typeof window.GUEST_CATALOG_OWNER_VIEWER_V2?.show!=='function')throw Error('generic_viewer_unavailable');
  current=await window.GUEST_CATALOG_OWNER_VIEWER_V2.show({order:{template_id:id,template_version:version,mode:d.order.mode},config:d.config,host,registry});
  state.textContent='';reply('guest-catalog-rendered-v1',nonce)
 }catch(e){
  state.className='error';state.textContent='No se pudo abrir el diseño: '+String(e?.message||'error').slice(0,120);
  reply('guest-catalog-error-v1',nonce,String(e?.message||'error').slice(0,120))
 }finally{locked=false}
});
window.addEventListener('pagehide',()=>{try{current?.close()}catch{}});
reply('guest-catalog-ready-v1','');
})();</script></body></html>
