<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><title>RSVP</title><style>:root{--bg:#f5f1ea;--paper:#fff;--line:#ddd5c8;--ink:#2c2a26;--muted:#706b65;--soft:#eee8df}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:640px;margin:auto;padding:32px 20px 80px}h1{font:500 42px/1.05 Georgia,serif;margin:6px 0 8px}.lead{color:var(--muted);line-height:1.5;margin:0 0 22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}.choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:750}.choice.sel{outline:2px solid var(--ink);background:var(--soft)}.details{display:none;margin-top:14px;padding-top:12px;border-top:1px solid #eee}.details.on{display:block}label{display:block;font-size:13px;font-weight:750;margin-top:9px}.field{width:100%;border:1px solid #ccc5bb;border-radius:12px;background:#fff;color:var(--ink);padding:13px;font-size:16px;margin:6px 0 10px}.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0}.toggle input{width:22px;height:22px}.highchairWrap{display:none}.highchairWrap.on{display:flex}.btn{width:100%;border:0;border-radius:13px;background:var(--ink);color:#fff;padding:14px 16px;font-size:16px;font-weight:800;margin-top:10px;text-decoration:none;text-align:center;display:block}.notice{display:none;border-radius:13px;padding:12px;margin:12px 0;background:#f3e8dd;color:#7a5539;line-height:1.4}.notice.on{display:block}.small{font-size:12px;color:var(--muted);line-height:1.45}.custom{padding:11px 0;border-top:1px solid #eee}.custom label{margin-top:0}.success{text-align:center;padding:42px 0}.success .card{text-align:left}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}@media(max-width:440px){h1{font-size:36px}.wrap{padding-left:16px;padding-right:16px}}</style></head><body><main class="wrap"><section id="app"><div class="card"><div class="small">RSVP</div></div></section></main><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp',q=new URLSearchParams(location.search),token=q.get('t')||'',guestId=q.get('g')||'',guestName=(q.get('n')||'').trim(),app=document.getElementById('app');let cfg={},attend=null,custom={},lang=(q.get('lang')==='en'||q.get('lang')==='es')?q.get('lang'):((navigator.language||'').toLowerCase().startsWith('en')?'en':'es');const T=(es,en)=>lang==='en'?en:es,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.documentElement.lang=lang;async function j(url,opt={}){const r=await fetch(url,opt),x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||'request_failed');return x}function meals(){const xs=[['Estándar','Estándar','Standard'],['Vegetariano','Vegetariano','Vegetarian'],['Vegano','Vegano','Vegan'],['Celíaco','Celíaco','Gluten-free'],['Sin lactosa','Sin lactosa','Lactose-free'],['Infantil','Infantil','Child menu'],['Sin menú','Sin menú','No meal']];return xs.map(([v,es,en])=>`<option value="${v}">${T(es,en)}</option>`).join('')}function customHtml(){const xs=Array.isArray(cfg.customQuestions)?cfg.customQuestions:[];return xs.map(x=>{const id=esc(x.id),label=esc(x.label)+(x.required?' *':'');if(x.type==='yesno')return `<div class="custom" data-q="${id}" data-type="yesno" data-required="${x.required?'1':'0'}"><label>${label}</label><div class="choiceRow"><button type="button" class="choice" data-v="yes">${T('Sí','Yes')}</button><button type="button" class="choice" data-v="no">${T('No','No')}</button></div></div>`;if(x.type==='select')return `<div class="custom" data-q="${id}" data-type="select" data-required="${x.required?'1':'0'}"><label>${label}</label><select class="field cv"><option value="">${T('Elige una opción','Choose an option')}</option>${(x.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`;return `<div class="custom" data-q="${id}" data-type="text" data-required="${x.required?'1':'0'}"><label>${label}</label><input class="field cv" maxlength="600" placeholder="${T('Escribe aquí…','Write here…')}"></div>`}).join('')}function render(){const name=guestName||T('Tu respuesta','Your response');app.innerHTML=`<div class="small">RSVP</div><h1>${esc(name)}</h1><p class="lead">${T('Confirma tu asistencia y responde solo a la información que la pareja necesita para organizar la boda.','Confirm your attendance and answer only the information the couple needs to plan the wedding.')}</p><section class="card"><div class="choiceRow"><button id="yes" class="choice" type="button">${T('Sí, asistiré','Yes, I’ll attend')}</button><button id="no" class="choice" type="button">${T('No podré asistir','I can’t attend')}</button></div><div id="details" class="details"><div id="mealBlock"><label>${T('Menú','Meal')}</label><select id="meal" class="field">${meals()}</select><label id="highchairWrap" class="toggle highchairWrap"><span>${T('Necesita trona','Needs a high chair')}</span><input id="highchair" type="checkbox"></label></div><div id="allergyBlock"><label>${T('Alergias o intolerancias','Allergies or intolerances')}</label><input id="allergy" class="field" placeholder="${T('Lo que debamos saber','Anything we should know')}"></div><label id="transportWrap" class="toggle"><span>${T('Necesito transporte','I need transport')}</span><input id="transport" type="checkbox"></label><label id="accommodationWrap" class="toggle"><span>${T('Me quedaré a dormir / necesito alojamiento','I will stay overnight / need accommodation')}</span><input id="accommodation" type="checkbox"></label><div id="plusWrap"><label>${T('Acompañante / +1','Guest / +1')}</label><input id="plusone" class="field" placeholder="${T('Nombre del acompañante','Guest name')}"></div>${customHtml()}</div><div id="fb" class="notice"></div><button id="send" class="btn">${T('Enviar respuesta','Send response')}</button></section>`;const yes=document.getElementById('yes'),no=document.getElementById('no'),details=document.getElementById('details'),meal=document.getElementById('meal'),highWrap=document.getElementById('highchairWrap'),high=document.getElementById('highchair');function refreshHigh(){const on=attend===true&&meal?.value==='Infantil';highWrap?.classList.toggle('on',on);if(!on&&high)high.checked=false}function choose(v){attend=v;yes.classList.toggle('sel',v===true);no.classList.toggle('sel',v===false);details.classList.toggle('on',v===true);refreshHigh()}yes.onclick=()=>choose(true);no.onclick=()=>choose(false);meal?.addEventListener('change',refreshHigh);if(cfg.questions?.meal===false)document.getElementById('mealBlock').style.display='none';if(cfg.questions?.allergy===false)document.getElementById('allergyBlock').style.display='none';if(cfg.transportOffered===false||cfg.questions?.transport===false)document.getElementById('transportWrap').style.display='none';if(cfg.accommodationOffered!==true)document.getElementById('accommodationWrap').style.display='none';if(cfg.questions?.plusone===false)document.getElementById('plusWrap').style.display='none';app.querySelectorAll('[data-q][data-type="yesno"]').forEach(box=>box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{box.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('sel',x===b));custom[box.dataset.q]=b.dataset.v==='yes'}));document.getElementById('send').onclick=submit}function collectCustom(){const out={...custom};for(const box of app.querySelectorAll('[data-q]')){if(box.dataset.type==='yesno')continue;const v=box.querySelector('.cv')?.value?.trim()||'';if(v)out[box.dataset.q]=v}return out}function missingRequired(){if(attend!==true)return null;for(const box of app.querySelectorAll('[data-q][data-required="1"]')){const id=box.dataset.q,ok=box.dataset.type==='yesno'?typeof custom[id]==='boolean':!!box.querySelector('.cv')?.value?.trim();if(!ok)return box}return null}async function submit(){const fb=document.getElementById('fb'),b=document.getElementById('send');if(attend===null){fb.className='notice on';fb.textContent=T('Indica primero si asistirás.','Please tell us whether you will attend.');return}const miss=missingRequired();if(miss){fb.className='notice on';fb.textContent=T('Falta responder una pregunta obligatoria.','A required question is unanswered.');miss.scrollIntoView({behavior:'smooth',block:'center'});return}b.disabled=true;b.textContent=T('Enviando…','Sending…');const meal=document.getElementById('meal')?.value||'Sin menú',plus=document.getElementById('plusone')?.value?.trim()||'',highchair=attend&&meal==='Infantil'&&!!document.getElementById('highchair')?.checked,payload={action:'submit',token,client_submission_id:(crypto.randomUUID?crypto.randomUUID():'single_'+Date.now()),guest_key:guestId,name:guestName||T('Invitado','Guest'),attend,age:null,meal_required:attend&&cfg.questions?.meal!==false?meal!=='Sin menú':null,meal:attend&&cfg.questions?.meal!==false&&meal!=='Sin menú'?meal:'',allergy:attend&&cfg.questions?.allergy!==false?(document.getElementById('allergy')?.value.trim()||''):'',highchair,transport:attend&&!!document.getElementById('transport')?.checked,accommodation:attend&&!!document.getElementById('accommodation')?.checked,plusone_details:attend&&plus?{name:plus}:null,custom_answers:attend?collectCustom():{},event_responses:{},children:[]};try{await j(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});app.innerHTML=`<div class="success"><div class="small">${T('RESPUESTA ENVIADA','RESPONSE SENT')}</div><h1>${T('Gracias','Thank you')}</h1><p class="lead">${T('Tu respuesta se ha guardado correctamente.','Your response has been saved.')}</p><div class="card"><b>${esc(guestName||T('Invitado','Guest'))}</b><div class="small" style="margin-top:5px">${attend?T('Asiste','Attending'):T('No asiste','Not attending')}</div></div><button id="backInvite" class="btn secondary">${T('Volver a la invitación','Back to invitation')}</button></div>`;document.getElementById('backInvite').onclick=()=>history.back();window.scrollTo({top:0,behavior:'smooth'})}catch{b.disabled=false;b.textContent=T('Enviar respuesta','Send response');fb.className='notice on';fb.textContent=T('No se ha podido guardar. Comprueba la conexión y vuelve a intentarlo.','Could not save your response. Check your connection and try again.')}}async function init(){if(!token||!guestId){app.innerHTML=`<div class="card"><h1>${T('RSVP no disponible','RSVP unavailable')}</h1><p class="lead">${T('Pide que te reenvíen la invitación.','Ask for the invitation link to be resent.')}</p></div>`;return}try{const x=await j(API+'?token='+encodeURIComponent(token));cfg=x.form?.config||{};if(q.get('lang')!=='en'&&q.get('lang')!=='es'){if(cfg.lang==='en'||cfg.language==='en')lang='en';else if(cfg.lang==='es'||cfg.language==='es')lang='es';document.documentElement.lang=lang}render()}catch{app.innerHTML=`<div class="card"><h1>${T('RSVP no disponible','RSVP unavailable')}</h1><p class="lead">${T('Comprueba la conexión y vuelve a intentarlo.','Check your connection and try again.')}</p></div>`}}init()})();</script></body></html>
