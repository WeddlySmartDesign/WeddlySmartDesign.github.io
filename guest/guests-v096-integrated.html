async function sync(){if(busy)return;const mt=memberToken();if(!mt)return;busy=true;try{const r=await fetch(API,{headers:{'x-weddly-token':mt}}),data=await r.json();if(!r.ok||!data.ok)throw 0;STRUCT.people={};(data.people||[]).forEach(x=>STRUCT.people[x.guest_key]=x);STRUCT.units=data.units||[];patch()}catch{}finally{busy=false}}
function patch(){const C=baseCtx();if(!C||!C.S)return;const{d,w,S}=C;style(d);const old=d.querySelector('[data-v95-structure]');if(old)old.style.display='none';const inv=d.getElementById('invitados');if(!inv)return;let card=inv.querySelector('[data-v96-structure]');if(!card){card=d.createElement('div');card.className='card v96org';card.setAttribute('data-v96-structure','1');const pending=inv.querySelector('[data-v95-pending]'),entry=inv.querySelector('[data-rsvp-entry]');(pending||entry)?(pending||entry).insertAdjacentElement('afterend',card):inv.prepend(card)}const ids=Object.keys(S.guests||{}),grouped=ids.filter(id=>STRUCT.people[id]?.group_name).length,unitPeople=ids.filter(id=>STRUCT.people[id]?.unit_key).length;card.innerHTML='<div class="sectiontag">Organización</div><b style="font-size:20px">Grupos y unidades</b><p class="small">Organiza varias personas de una vez. Primero eliges el grupo o la unidad; después seleccionas a todos sus miembros.</p><div class="v96meta"><span class="v96chip">'+grouped+' con grupo</span><span class="v96chip">'+unitPeople+' en unidad</span><span class="v96chip">'+STRUCT.units.length+' unidades</span></div><div class="v96twobtn"><button class="btn soft" data-groups>Por grupo</button><button class="btn soft" data-units>Por unidad</button></div>';card.querySelector('[data-groups]').onclick=()=>openGroupFlow(d,w,S);card.querySelector('[data-units]').onclick=()=>openUnitFlow(d,w,S)}

function openGroupFlow(d,w,S){const opts=groups().map(g=>'<option value="'+g.replace(/"/g,'&quot;')+'">'+g+'</option>').join('');const o=openSheet(d,'<div class="sectiontag">Grupo</div><h2>Asignar grupo</h2><div class="v96steps"><span class="on">1 Grupo</span><span>2 Invitados</span></div><label>Grupo</label><select id="v96group" class="field"><option value="">Elige un grupo</option>'+opts+'<option value="__new">+ Crear grupo nuevo</option></select><div id="v96newgroupwrap" style="display:none"><label>Nombre del nuevo grupo</label><input id="v96newgroup" class="field" placeholder="Ej. Amigos universidad"></div><div class="actions"><button class="btn soft" data-cancel>Cancelar</button><button class="btn" data-next>Elegir invitados</button></div>');if(!o)return;const sel=o.p.querySelector('#v96group'),wrap=o.p.querySelector('#v96newgroupwrap');sel.onchange=()=>wrap.style.display=sel.value==='__new'?'block':'none';o.p.querySelector('[data-cancel]').onclick=o.close;o.p.querySelector('[data-next]').onclick=()=>{let g=sel.value;if(g==='__new')g=o.p.querySelector('#v96newgroup').value.trim();if(!g)return;choosePeopleForGroup(g,d,w,S)}}
function choosePeopleForGroup(group,d,w,S){const rows=Object.entries(S.guests).map(([id,g])=>{const cur=STRUCT.people[id]?.group_name||'';return '<label class="v96choice"><input type="checkbox" data-id="'+id+'" '+(cur===group?'checked':'')+'><div class="grow"><b>'+g.name+'</b><div class="small">'+(cur||'Sin grupo')+'</div></div></label>'}).join('');const o=openSheet(d,'<div class="sectiontag">'+group+'</div><h2>¿Quién pertenece a este grupo?</h2><div class="v96steps"><span>1 Grupo</span><span class="on">2 Invitados</span></div><p class="small">Selecciona a todos los que puedas de una vez. Los invitados ya asignados a este grupo aparecen marcados.</p><div>'+rows+'</div><div class="v96sticky actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-save>Guardar seleccionados</button></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openGroupFlow(d,w,S);o.p.querySelector('[data-save]').onclick=async()=>{const btn=o.p.querySelector('[data-save]');btn.disabled=true;btn.textContent='Guardando…';const checks=[...o.p.querySelectorAll('[data-id]')];try{for(const c of checks){const id=c.dataset.id,cur=STRUCT.people[id]?.group_name||'';if(c.checked&&cur!==group)await savePerson(id,{group_name:group});else if(!c.checked&&cur===group)await savePerson(id,{group_name:''});const guest=S.guests[id];if(guest)guest.group=STRUCT.people[id]?.group_name||''}if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();toast(d,'Grupo actualizado',group+' · '+checks.filter(x=>x.checked).length+' invitados');setTimeout(()=>{patch();openGroupFlow(d,w,S)},40)}catch{btn.disabled=false;btn.textContent='Guardar seleccionados';toast(d,'No se ha guardado','No hemos cambiado la selección. Reintenta con conexión.')}}}
function openUnitFlow(d,w,S){const unitOpts=STRUCT.units.map(u=>'<option value="'+u.unit_key+'">'+u.name+'</option>').join('');const o=openSheet(d,'<div class="sectiontag">Unidad</div><h2>Asignar unidad</h2><div class="v96steps"><span class="on">1 Unidad</span><span>2 Miembros</span></div><label>Unidad existente</label><select id="v96unit" class="field"><option value="">Elige una unidad</option>'+unitOpts+'</select><div class="small" style="text-align:center;margin:3px 0 10px">o</div><label>Nueva unidad</label><input id="v96unitname" class="field" placeholder="Ej. Familia Rodríguez"><div class="actions"><button class="btn soft" data-cancel>Cancelar</button><button class="btn" data-next>Elegir miembros</button></div>');if(!o)return;o.p.querySelector('[data-cancel]').onclick=o.close;o.p.querySelector('[data-next]').onclick=async()=>{let key=o.p.querySelector('#v96unit').value,name=o.p.querySelector('#v96unitname').value.trim();if(!key&&!name)return;const btn=o.p.querySelector('[data-next]');btn.disabled=true;if(!key){try{key='u_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':memberToken()},body:JSON.stringify({action:'save_unit',unit_key:key,name})}),data=await r.json();if(!r.ok||!data.ok)throw 0;STRUCT.units.push(data.unit);toast(d,'Unidad creada',name)}catch{btn.disabled=false;toast(d,'No se ha creado','Reintenta con conexión.');return}}name=unitName(key)||name;choosePeopleForUnit(key,name,d,w,S)}}
function choosePeopleForUnit(key,name,d,w,S){const roles=['','Pareja','Hijo/a','Acompañante / +1','Otro'];const roleOptions=sel=>roles.map(r=>'<option value="'+r+'" '+(r===sel?'selected':'')+'>'+(r||'Relación sin indicar')+'</option>').join('');const rows=Object.entries(S.guests).map(([id,g])=>{const cur=STRUCT.people[id]||{},inUnit=cur.unit_key===key;return '<div class="v96choice" data-row="'+id+'"><input type="checkbox" data-id="'+id+'" '+(inUnit?'checked':'')+'><div class="grow"><b>'+g.name+'</b><div class="small">'+(cur.unit_key?unitName(cur.unit_key):'Sin unidad')+'</div><select class="field v96role" data-role="'+id+'" style="display:'+(inUnit?'block':'none')+'">'+roleOptions(inUnit?(cur.relation_role||''):'')+'</select></div></div>'}).join('');const o=openSheet(d,'<div class="sectiontag">'+name+'</div><h2>Selecciona a sus miembros</h2><div class="v96steps"><span>1 Unidad</span><span class="on">2 Miembros</span></div><p class="small">Marca a todos los miembros de una vez. Solo si quieres, indica debajo de cada uno si es pareja, hijo/a o +1.</p><div>'+rows+'</div><p class="small">Pertenecer a una unidad no obliga a sentarse juntos.</p><div class="v96sticky actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-save>Guardar unidad</button></div>');if(!o)return;o.p.querySelectorAll('[data-id]').forEach(c=>c.onchange=()=>{const role=o.p.querySelector('[data-role="'+c.dataset.id+'"]');if(role)role.style.display=c.checked?'block':'none'});o.p.querySelector('[data-back]').onclick=()=>openUnitFlow(d,w,S);o.p.querySelector('[data-save]').onclick=async()=>{const btn=o.p.querySelector('[data-save]');btn.disabled=true;btn.textContent='Guardando…';const checks=[...o.p.querySelectorAll('[data-id]')];try{for(const c of checks){const id=c.dataset.id,cur=STRUCT.people[id]||{},was=cur.unit_key===key;if(c.checked){const role=o.p.querySelector('[data-role="'+id+'"]')?.value||'';if(!was||cur.relation_role!==role)await savePerson(id,{unit_key:key,relatio
