(pid)}catch(_){}grip.removeEventListener('pointermove',mv);grip.removeEventListener('pointerup',done);grip.removeEventListener('pointercancel',done);save();render()};grip.addEventListener('pointermove',mv);grip.addEventListener('pointerup',done);grip.addEventListener('pointercancel',done)})}`;const oldFeature=`function addFeatureSheet(){const names=['Pista de baile','Escenario','Barra','Photocall','Zona infantil','Cabina DJ','Mesa de regalos'];openSheet(\`<h2>Elemento de sala</h2>\${names.map(n=>\`<button class="choice" data-feature="\${n}">\${n}</button>\`).join('')}<div class="actions"><button class="btn soft" id="fcancel">Cerrar</button></div>\`);panel.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>{const id='f'+Date.now();S.features[id]={name:b.dataset.feature,x:280,y:300,w:220,h:100};closeSheet();render()});$('fcancel').onclick=closeSheet}`;const newFeature=`function addFeatureSheet(){const names=['Pista de baile','Escenario','Barra','Photocall','Zona infantil','Cabina DJ','Mesa de regalos'];openSheet(\`<h2>Elemento de sala</h2><p class="small">Elige uno habitual o escribe cualquier otro elemento del salón.</p>\${names.map(n=>\`<button class="choice" data-feature="\${n}">\${n}</button>\`).join('')}<div style="margin-top:16px;padding-top:14px;border-top:1px solid #eee7de"><label style="display:block;font-weight:700;margin-bottom:8px">Otro elemento</label><input id="customFeature" class="field" placeholder="Ej. columna, fuente, mesa dulce…"><button class="btn" id="addCustomFeature" style="width:100%;margin-top:10px">Añadir elemento</button></div><div class="actions"><button class="btn soft" id="fcancel">Cerrar</button></div>\`);const add=n=>{const name=(n||'').trim();if(!name)return;const id='f'+Date.now();S.features[id]={name,x:280,y:300,w:220,h:100};closeSheet();render()};panel.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>add(b.dataset.feature));$('addCustomFeature').onclick=()=>add($('customFeature').value);$('customFeature').addEventListener('keydown',e=>{if(e.key==='Enter')add(e.target.value)});$('fcancel').onclick=closeSheet}`;let out=src.replaceAll('v78','v80').replaceAll('weddly_guests_v78_visual','weddly_guests_v80_visual').replace(oldResize,newResize).replace(oldFeature,newFeature);out=out.replace('.resizeGrip{position:absolute;right:-15px;bottom:-15px;width:36px;height:36px;display:none;z-index:20}', '.resizeGrip{position:absolute;right:-20px;bottom:-20px;width:48px;height:48px;display:none;z-index:30;touch-action:none}.resizeGrip:before{content:"";position:absolute;inset:-8px}').replace('.resizeGrip span{width:26px;height:26px;', '.resizeGrip span{width:32px;height:32px;');out=out.replace('<button class="btn soft" id="fit">Ver todo</button>','<button class="btn fitBtn" id="fit">Ver plano completo</button>').replace('.zoomLabel{font-weight:700}', '.zoomLabel{font-weight:700}.fitBtn{background:#fff;color:#2c2a26;border:2px solid #2c2a26;white-space:nowrap}');out=out.replace("sheet.onclick=e=>{if(e.target===sheet)closeSheet()};render();", "floor.addEventListener('click',e=>{if(e.target===floor&&selectedObj){selectedObj=null;render()}});viewport.addEventListener('click',e=>{if(e.target===viewport&&selectedObj){selectedObj=null;render()}});sheet.onclick=e=>{if(e.target===sheet)closeSheet()};render();");out=out.replace('Puedes moverla, cambiar tamaño o editarla sin perder invitados.','Puedes moverla, cambiar tamaño o editarla sin perder invitados. Toca fuera para salir de la selección.');document.open();document.write(out);document.close()})().catch(()=>{document.body.innerHTML='<div class="loading"><div><b>No se pudo cargar la QA</b><span>Recarga la página.</span></div></div>'})</script></body></html>
