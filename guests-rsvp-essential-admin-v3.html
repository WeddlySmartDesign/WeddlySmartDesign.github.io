<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · RSVP Essential</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f5f1ea;color:#2c2a26;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd5c8;display:flex;align-items:center;gap:12px;padding:12px 18px}.back{border:0;border-radius:14px;background:#eee8df;padding:12px 16px;font-weight:800;font-size:16px}.topcopy b{display:block;font-size:18px}.topcopy small{display:block;color:#706b65;margin-top:2px}.page{max-width:760px;margin:auto;padding:18px 16px 70px}.card{background:#fff;border:1px solid #d9cfbf;border-radius:24px;padding:16px;margin-bottom:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.ey{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#866329}.head h2{font:500 30px Georgia,serif;margin:7px 0 4px}.head p{margin:0;color:#706b65;line-height:1.45;font-size:14px}.btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;font-size:14px;background:#2c2a26;color:#fff}.preview{height:560px;overflow:auto;background:#e8e1d6;border-radius:18px;padding:10px}.preview iframe{width:100%;height:1196px;border:0;display:block;background:#f5f1ea;pointer-events:none}.formcard{background:#fff;border:1px solid #ddd5c8;border-radius:24px;overflow:hidden}.formcard h3{margin:0;padding:18px 18px 4px}.formcard p{margin:0;padding:0 18px 14px;color:#706b65;font-size:14px}.formcard iframe{width:100%;min-height:1300px;border:0;display:block;background:#f5f1ea}@media(max-width:560px){.page{padding:14px 10px 60px}.head{display:block}.head .btn{margin-top:12px;width:100%}.preview{height:500px}.topbar{padding:10px 12px}}</style></head><body><header class="topbar"><button id="back" class="back">← Volver</button><div class="topcopy"><b>RSVP</b><small>Essential · diseño cerrado</small></div></header><main class="page"><section class="card"><div class="head"><div><div class="ey">VISTA DEL INVITADO</div><h2>Essential</h2><p>La invitación visual se renderiza como una lámina cerrada; el formulario y las respuestas siguen conectados a Guests.</p></div><button id="openPreview" class="btn">Abrir completa</button></div><div class="preview"><iframe id="designPreview" title="Vista previa"></iframe></div></section><section class="formcard"><h3>Formulario y respuestas</h3><p>Configura preguntas, envíos y respuestas sin tocar el diseño.</p><iframe id="formFrame" title="Configuración RSVP"></iframe></section></main><script>(()=>{const publicUrl='guests-rsvp-essential-raster-v2.html?guest=1&preview=1&v=2';const preview=document.getElementById('designPreview'),form=document.getElementById('formFrame');preview.src=publicUrl;form.src='guests-rsvp-v105-mobile.html?v=essential-admin-v3';document.getElementById('openPreview').onclick=()=>window.open(publicUrl.replace('&preview=1',''),'_blank','noopener');document.getElementById('back').onclick=()=>{if(history.length>1)history.back();else location.href='guests-personalized-functional-v4.html#invitados'};function patch(){try{const d=form.contentDocument;if(!d)return;const b=d.querySelector('.back'),brand=d.querySelector('.brand'),h1=d.querySelector('h1');if(b)b.style.display='none';if(brand)brand.style.display='none';if(h1)h1.style.display='none';const w=d.querySelector('.wrap');if(w){w.style.maxWidth='none';w.style.padding='0 16px 70px'}const p=d.getElementById('preview');if(p&&!p.dataset.v3){p.dataset.v3='1';p.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();window.open(publicUrl.replace('&preview=1',''),'_blank','noopener')},true)}const ro=new ResizeObserver(()=>{try{form.style.height=Math.max(1300,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch{}});ro.observe(d.body);form.style.height=Math.max(1300,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch{}}form.addEventListener('load',()=>{patch();setTimeout(patch,150);setTimeout(patch,650)})})();</script></body></html>
