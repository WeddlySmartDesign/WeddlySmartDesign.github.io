<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests v109</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="g" src="guests-v108-integrated.html?v=109"></iframe><script>(()=>{const F=document.getElementById('g'),KEY='weddly_guests_qa_v67';let hooked=false;function deep(){try{let d=F.contentDocument,w=F.contentWindow;for(let i=0;i<28;i++){const f=d?.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument;w=f.contentWindow}return d?.body?{d,w}:null}catch{return null}}function ensureBridge(d,w){if(w.__v109Bridge)return;try{const s=d.createElement('script');s.textContent=`window.__v109Bridge={state:()=>S,render:()=>render(),save:()=>save(),go:(id,n)=>go(id,n)};`;d.body.appendChild(s)}catch{}}function style(d){if(d.getElementById('v109css'))return;const s=d.createElement('style');s.id='v109css';s.textContent=`#invitados:not(.v109-ready)>:not(h2){visibility:hidden}.v109flow{display:grid;gap:14px}.v109step{background:#fff;border:1px solid #ddd5c8;border-radius:20px;padding:20px}.v109top{display:flex;align-items:flex-start;gap:12px}.v109num{width:30px;height:30px;border-radius:999px;background:#2c2a26;color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.v109step h3{margin:0 0 5px;font-size:20px}.v109step p{margin:0;color:#706b65;line-height:1.45}.v109actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.v109actions.one{grid-template-columns:1fr}.v109actions button{width:100%}.v109summary{display:flex;gap:12px;flex-wrap:wrap;margin-top:13px}.v109pill{background:#eee8df;border-radius:999px;padding:7px 10px;font-size:13px}.v109section{margin-top:14px}.v109section>.card{margin:0}.v109sub{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#77716b;margin:4px 0 8px}.v109helper{background:#faf8f4;border:1px solid #e4ddd3;border-radius:14px;padding:12px 13px;margin-top:12px;color:#655f59;font-size:14px;line-height:1.45}`;d.head.appendChild(s)}function txtButton(d,text){return [...d.querySelectorAll('button')].find(b=>b.textContent.trim().includes(text))}function state(){try{return JSON.parse(localStorage.getItem(KEY))||{guests:{}}}catch{return{guests:{}}}}function addGuest(d,w){ensureBridge(d,w);const sh=d.getElementById('sheet'),p=d.getElementById('panel');if(!sh||!p)return;p.innerHTML=`<div class="sectiontag">Nueva persona</div><h2>Añadir invitado</h2><label>Nombre y apellidos</label><input id="v109name" class="field" placeholder="Ej. Andrés López"><p class="small">Empieza solo con el nombre. Grupo, unidad, RSVP, menú, mesa y transporte se pueden completar después.</p><div class="actions"><button class="btn soft" id="v109cancel">Cancelar</button><button class="btn" id="v109save">Añadir</button></div>`;sh.classList.add('on');const nav=d.querySelector('.nav');if(nav)nav.style.pointerEvents='none';const close=()=>{sh.classList.remove('on');p.innerHTML='';if(nav)nav.style.pointerEvents='auto'};p.querySelector('#v109cancel').onclick=close;p.querySelector('#v109save').onclick=()=>{const name=p.querySelector('#v109name').value.trim();if(!name)return;const b=w.__v109Bridge;if(!b)return;const S=b.state(),id='g_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);S.guests=S.guests||{};S.guests[id]={name,rsvp:'pending',meal:'',table:'',transport:false};b.save();b.render();close()}}function moveInto(parent,node){if(node&&node.parentNode!==parent)parent.appendChild(node)}function mount(){const x=deep();if(!x)return;const{d,w}=x;style(d);ensureBridge(d,w);const inv=d.getElementById('invitados');if(!inv)return;if(inv.querySelector('#v109flow')){inv.classList.add('v109-ready');return}inv.classList.remove('v109-ready');const S=state(),all=Object.values(S.guests||{}),initial=all.length,decl=all.filter(g=>g&&g.rsvp==='declined').length,active=all.filter(g=>g&&g.rsvp!=='declined').length,conf=all.filter(g=>g&&g.rsvp==='confirmed').length,pend=all.filter(g=>g&&g.rsvp==='pending').length,assigned=all.filter(g=>g&&g.rsvp!=='declined'&&g.table).length;const flow=d.createElement('div');flow.id='v109flow';flow.className='v109flow';flow.innerHTML=`<div class="v109step" id="v109s1"><div class="v109top"><span class="v109num">1</span><div><h3>Prepara tu lista</h3><p>Importa lo que ya tienes o crea invitados aquí. Esta es la lista maestra de la boda.</p></div></div><div class="v109summary"><span class="v109pill">${initial} invitados iniciales</span><span class="v109pill">${active} en gestión</span>${decl?`<span class="v109pill">${decl} no asisten</span>`:''}</div><div class="v109actions"><button class="btn soft" data-import>Importar lista</button><button class="btn" data-add>+ Añadir persona</button></div><div class="v109helper">Después organiza grupos y unidades. Una persona puede estar perfectamente en un grupo sin unidad.</div><div class="v109section" data-listarea><div class="v109sub">Organización y personas</div></div></div><div class="v109step" id="v109s2"><div class="v109top"><span class="v109num">2</span><div><h3>Envía y recoge RSVP</h3><p>Las respuestas actualizan esta misma lista. No crean una segunda lista.</p></div></div><div class="v109summary"><span class="v109pill">${conf} confirmados</span><span class="v109pill">${pend} pendientes</span></div><div class="v109actions one"><button class="btn" data-rsvp>Gestionar RSVP</button></div><div class="v109section" data-rsvparea></div></div><div class="v109step" id="v109s3"><div class="v109top"><span class="v109num">3</span><div><h3>Planifica las mesas</h3><p>No esperes a tener todos los RSVP. Puedes sentar provisionalmente a pendientes y luego ajustar con las confirmaciones.</p></div></div><div class="v109summary"><span class="v109pill">${assigned} con mesa provisional</span><span class="v109pill">${Math.max(0,active-assigned)} sin mesa</span></div><div class="v109actions one"><button class="btn" data-tables>Abrir mesas provisionales</button></div><div class="v109helper">Confirmado: conserva su mesa provisional. No asiste: sale de la planificación activa y libera plaza. Niño/+1 nuevo: aparece para colocarlo.</div></div>`;const h2=inv.querySelector('h2');h2?h2.insertAdjacentElement('afterend',flow):inv.prepend(flow);const listarea=flow.querySelector('[data-listarea]'),rsvparea=flow.querySelector('[data-rsvparea]');const attendance=d.getElementById('v106attendance'),map=d.getElementById('v108map'),list=d.getElementById('v108list'),rsvp=d.querySelector('[data-rsvp-entry]'),pending=d.querySelector('[data-v95-pending]');moveInto(listarea,attendance);moveInto(listarea,map);moveInto(listarea,list);moveInto(rsvparea,rsvp);moveInto(rsvparea,pending);flow.querySelector('[data-import]').onclick=()=>{const b=txtButton(d,'Ya tengo mi lista');if(b)b.click()};flow.querySelector('[data-add]').onclick=()=>addGuest(d,w);flow.querySelector('[data-rsvp]').onclick=()=>{const b=txtButton(d,'Gestionar RSVP');if(b)b.click()};flow.querySelector('[data-tables]').onclick=()=>{if(w.__v109Bridge)w.__v109Bridge.go('mesas',2)};const mh=d.querySelector('#mesas h2');if(mh)mh.textContent='Mesas · Plan provisional';inv.classList.add('v109-ready')}function install(){const x=deep();if(!x)return;style(x.d);ensureBridge(x.d,x.w);if(!hooked&&typeof x.w.renderGuests==='function'){hooked=true;const old=x.w.renderGuests;x.w.renderGuests=function(){const inv=x.d.getElementById('invitados');if(inv)inv.classList.remove('v109-ready');const r=old.apply(this,arguments);mount();return r}}mount()}F.addEventListener('load',()=>{const t=setInterval(()=>{install();if(hooked)clearInterval(t)},80)});setInterval(install,900)})();</script></body></html>
