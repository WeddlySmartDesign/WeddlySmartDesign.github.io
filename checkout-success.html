<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211d1a">
<title>ONE ya es vuestro · WeddlySmartDesign</title>
<style>
:root{--dark:#211d1a;--brown:#4a3a36;--paper:#f7eee5;--clay:#b97a5c;--muted:#746a64;--line:rgba(74,58,54,.14)}
*{box-sizing:border-box}body{margin:0;background:var(--dark);color:var(--paper);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{min-height:100dvh;width:min(100%,650px);margin:auto;padding:54px 22px calc(44px + env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center}
.brand{font-size:13px;font-weight:800}.kicker{margin-top:50px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#d5a58f;font-weight:800}
h1{font-family:Georgia,serif;font-size:clamp(54px,15vw,80px);line-height:.9;font-weight:400;letter-spacing:-.04em;margin:14px 0 22px}
.lead{font-size:16px;line-height:1.65;color:rgba(247,238,229,.7);max-width:34ch}.card{margin-top:28px;background:var(--paper);color:var(--brown);border-radius:22px;padding:20px}
.activate{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:60px;padding:0 18px;border-radius:14px;background:var(--brown);color:white;text-decoration:none;font-weight:800;font-size:15px}
.codebox{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}.codebox small{display:block;font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:var(--clay);font-weight:800}.code{margin-top:7px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.45;word-break:break-all}
.copy{margin-top:10px;border:1px solid var(--line);background:transparent;color:var(--brown);border-radius:10px;padding:10px 12px;font-size:11px;font-weight:700}
.note{margin-top:14px;font-size:10.5px;line-height:1.5;color:var(--muted)}.state{margin-top:28px;font-size:13px;color:rgba(247,238,229,.68)}.err{color:#f0aaa0}
</style>
</head>
<body><main>
<div class="brand">WeddlySmartDesign</div>
<div id="content">
 <div class="kicker">Confirmando compra</div>
 <h1>Un momento.</h1>
 <p class="lead">Estamos comprobando el pago y preparando el acceso privado para vuestra boda.</p>
 <div id="state" class="state">Verificando…</div>
</div>
</main>
<script>
(()=>{
 const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-commerce';
 const sid=new URLSearchParams(location.search).get('session_id')||'';
 const content=document.getElementById('content'),state=document.getElementById('state');
 const post=async body=>{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));return {r,j}};
 const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 let tries=0;
 async function check(){
   if(!sid){state.textContent='No encontramos la referencia de la compra.';state.classList.add('err');return}
   tries++;
   try{
     const {r,j}=await post({action:'checkout_status',sessionId:sid});
     if(r.ok&&j?.ok&&j.paid){
       const emailed=j.emailStatus==='sent';
       content.innerHTML=`<div class="kicker">Compra confirmada</div>
       <h1>Ya es vuestra.</h1>
       <p class="lead">ONE está listo. Actívalo en el móvil desde el que quieras empezar a organizar vuestra boda.</p>
       <div class="card">
        <a class="activate" href="${esc(j.activationUrl)}"><span>Activar ONE</span><b>→</b></a>
        <div class="codebox"><small>Código de recuperación</small><div id="code" class="code">${esc(j.activationCode)}</div><button id="copy" class="copy" type="button">Copiar código</button></div>
        <div class="note">${emailed?'También hemos enviado el enlace y el código al email utilizado en el pago.':'Guarda este código junto con tu justificante de compra. El email automático aún no está disponible, pero este acceso ya es válido.'}</div>
       </div>`;
       document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(j.activationCode);document.getElementById('copy').textContent='Copiado'};
       return;
     }
     if(r.ok&&j?.ok&&!j.paid&&tries<8){state.textContent='El pago se está confirmando…';setTimeout(check,1500);return}
     throw new Error(j?.error||'not_ready');
   }catch{
     if(tries<5){state.textContent='Terminando de preparar vuestro acceso…';setTimeout(check,1800);return}
     state.textContent='El pago puede estar confirmado, pero no hemos podido preparar el acceso automáticamente. No vuelvas a pagar: escríbenos con el email de compra.';
     state.classList.add('err');
   }
 }
 check();
})();
</script>
</body></html>
