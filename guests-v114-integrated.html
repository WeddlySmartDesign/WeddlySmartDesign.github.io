<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests v114</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="guests-v110-integrated.html?v=114"></iframe><script>(()=>{const F=document.getElementById('app');let installed=false,redirectArmed=true;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function deep(){try{let d=F.contentDocument,w=F.contentWindow;for(let i=0;i<40;i++){const f=d?.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument;w=f.contentWindow}return d?.body?{d,w}:null}catch{return null}}function names(d){const texts=[...d.querySelectorAll('h1,.hero h1,.brandtitle,.couple')].map(x=>x.textContent.trim()).filter(Boolean);const hit=texts.find(t=>t.includes('&'));if(hit){const p=hit.split('&').map(x=>x.trim()).filter(Boolean);if(p.length>=2)return[p[0],p[1]]}return['Persona 1','Persona 2']}function personalized(label,d){const [a,b]=names(d);return String(label).replace(/Familia novia/gi,'Familia '+a).replace(/Familia novio/gi,'Familia '+b).replace(/Amigos novia/gi,'Amigos '+a).replace(/Amigos novio/gi,'Amigos '+b).replace(/novia/gi,a).replace(/novio/gi,b)}function patchLabels(d){const [a,b]=names(d);if(a==='Persona 1')return;const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const p=n.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(p.tagName))continue;const t=n.nodeValue||'';if(/\b(novia|novio)\b/i.test(t))n.nodeValue=personalized(t,d)}d.querySelectorAll('option').forEach(o=>{if(/\b(novia|novio)\b/i.test(o.textContent))o.textContent=personalized(o.textContent,d)});d.querySelectorAll('[data-g]').forEach(bn=>{if(/\b(novia|novio)\b/i.test(bn.textContent))bn.textContent=personalized(bn.textContent,d)})}function findBtn(d,re){return[...d.querySelectorAll('button,a')].find(b=>re.test((b.textContent||'').trim()))}function openPeople(d){const list=d.getElementById('v108list')||[...d.querySelectorAll('section,div')].find(el=>/Lista de invitados en gestión|Personas/i.test(el.textContent||'')&&el.querySelector('button'));if(list){list.style.display='block';list.removeAttribute('hidden');list.scrollIntoView({behavior:'smooth',block:'start'});return true}const raw=JSON.parse(localStorage.getItem('weddly_guests_qa_v67')||'{}'),people=Object.values(raw.guests||{}).filter(g=>g&&g.rsvp!=='declined');const sh=d.getElementById('sheet'),panel=d.getElementById('panel');if(!sh||!panel)return false;panel.innerHTML='<div class="sectiontag">PERSONAS</div><h2>Invitados en gestión</h2><p class="small">'+people.length+' personas activas</p><div style="display:grid;gap:0;margin-top:14px">'+people.map(g=>'<div style="padding:14px 0;border-bottom:1px solid #e7e1d8"><b>'+esc(g.name||'Sin nombre')+'</b><div class="small">'+esc(g.rsvp==='confirmed'?'Confirmado':g.rsvp==='pending'?'Pendiente':g.rsvp||'')+(g.table?' · '+esc(g.table):' · Sin mesa')+'</div></div>').join('')+'</div><div class="actions"><button class="btn soft" data-close-personas>Hecho</button></div>';sh.classList.add('on');panel.querySelector('[data-close-personas]').onclick=()=>{sh.classList.remove('on');panel.innerHTML=''};return true}function goPlan(d,w){try{w.__v110Bridge?.go('mesas',2)}catch{}setTimeout(()=>{const x=deep();if(!x)return;const b=findBtn(x.d,/^(Abrir )?plano visual$/i)||findBtn(x.d,/Plano visual interactivo/i);if(b)b.click()},220)}function wire(d,w){patchLabels(d);const flow=d.getElementById('v110flow');if(flow){const p=flow.querySelector('[data-people]');if(p&&!p.dataset.v114){p.dataset.v114='1';p.onclick=e=>{e.preventDefault();openPeople(d)}}}const toast=d.querySelector('.v110toast');if(toast&&redirectArmed&&/invitad.*añadid/i.test(toast.textContent||'')){redirectArmed=false;setTimeout(()=>goPlan(d,w),350);setTimeout(()=>{redirectArmed=true},2000)}}function install(){const x=deep();if(!x)return;wire(x.d,x.w);if(installed)return;installed=true;const mo=new MutationObserver(()=>{const y=deep();if(y)wire(y.d,y.w)});mo.observe(x.d.body,{childList:true,subtree:true,characterData:true});setInterval(()=>{const y=deep();if(y)wire(y.d,y.w)},700)}F.addEventListener('load',()=>setTimeout(install,250));setTimeout(install,500)})();</script></body></html>
