<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests stable</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="guests-v110-integrated.html?v=118"></iframe><script>(()=>{const F=document.getElementById('app'),KEY='weddly_guests_qa_v67',API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-guests-structure';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function chain(){const out=[];try{let d=F.contentDocument,w=F.contentWindow;for(let i=0;i<40&&d?.body;i++){out.push({d,w});const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument;w=f.contentWindow}return out}catch{return out}}function deep(){const c=chain();return c[c.length-1]||null}function state(){try{return JSON.parse(localStorage.getItem(KEY))||{guests:{}}}catch{return{guests:{}}}}function couple(d){const texts=[...d.querySelectorAll('h1,.hero h1,.brandtitle,.couple')].map(x=>(x.textContent||'').trim()).filter(Boolean);const hit=texts.find(t=>t.includes('&'));if(!hit)return['Persona 1','Persona 2'];const p=hit.split('&').map(x=>x.trim()).filter(Boolean);return p.length>=2?[p[0],p[1]]:['Persona 1','Persona 2']}function inclusiveGroups(d){const[a,b]=couple(d),base=a==='Persona 1'?['Familia A','Familia B','Amigos A','Amigos B','Trabajo','Otros']:[`Familia ${a}`,`Familia ${b}`,`Amigos ${a}`,`Amigos ${b}`,'Trabajo','Otros'];const custom=Object.values(state().guests||{}).map(g=>g?.group).filter(Boolean).filter(g=>!/(novia|novio)/i.test(g));return[...new Set([...base,...custom])]}function replaceGender(s,d){const[a,b]=couple(d);if(a==='Persona 1')return s;return String(s).replace(/Familia novia/gi,'Familia '+a).replace(/Familia novio/gi,'Familia '+b).replace(/Amigos novia/gi,'Amigos '+a).replace(/Amigos novio/gi,'Amigos '+b).replace(/\bnovia\b/gi,a).replace(/\bnovio\b/gi,b)}function patchLabels(d){const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const ns=[];while(walker.nextNode())ns.push(walker.currentNode);for(const n of ns){const p=n.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(p.tagName))continue;if(/\b(novia|novio)\b/i.test(n.nodeValue||''))n.nodeValue=replaceGender(n.nodeValue,d)}d.querySelectorAll('option,[data-g]').forEach(el=>{if(/\b(novia|novio)\b/i.test(el.textContent||''))el.textContent=replaceGender(el.textContent,d)})}function sheet(d,html){const sh=d.getElementById('sheet'),p=d.getElementById('panel');if(!sh||!p)return null;p.innerHTML=html;sh.classList.add('on');const nav=d.querySelector('.nav');if(nav)nav.style.pointerEvents='none';const close=()=>{sh.classList.remove('on');p.innerHTML='';if(nav)nav.style.pointerEvents='auto'};sh.onclick=e=>{if(e.target===sh)close()};p.onclick=e=>e.stopPropagation();return{p,close}}function openPeople(d){const people=Object.entries(state().guests||{}).map(([id,g])=>({id,...g})).filter(g=>g&&g.rsvp!=='declined');const o=sheet(d,'<div class="sectiontag">PERSONAS</div><h2>Invitados en gestión</h2><p class="small">Aquí ves la lista activa. Quien ha declinado se conserva fuera de la planificación.</p><div data-list style="display:grid;gap:0;margin-top:12px"></div><div class="actions"><button class="btn soft" data-close>Hecho</button></div>');if(!o)return;const list=o.p.querySelector('[data-list]');list.innerHTML=people.map(g=>'<div style="padding:14px 0;border-bottom:1px solid #e7e1d8"><b>'+esc(g.name||'Sin nombre')+'</b><div class="small">'+esc(g.rsvp==='confirmed'?'Confirmado':'Pendiente')+(g.group?' · '+esc(g.group):'')+(g.table?' · '+esc(g.table):' · Sin mesa')+'</div></div>').join('')||'<p class="small">No hay personas activas.</p>';o.p.querySelector('[data-close]').onclick=o.close}async function loadStruct(){const t=localStorage.getItem('weddly_shared_wedding_token')||'';if(!t)return{units:[],people:[]};try{const r=await fetch(API,{headers:{'x-weddly-token':t}}),x=await r.json();return r.ok&&x.ok?x:{units:[],people:[]}}catch{return{units:[],people:[]}}}async function syncPerson(id,group,unitKey){const t=localStorage.getItem('weddly_shared_wedding_token')||'';if(!t)return;await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':t},body:JSON.stringify({action:'save_person',guest_key:id,group_name:group||'',unit_key:unitKey||'',relation_role:''})})}async function syncUnit(name){const t=localStorage.getItem('weddly_shared_wedding_token')||'';if(!t)return'';const key='u_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6),r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':t},body:JSON.stringify({action:'save_unit',unit_key:key,name})}),x=await r.json();return r.ok&&x.ok?key:''}async function fastCreate(d,w){const struct=await loadStruct(),groups=inclusiveGroups(d);let group='',unitKey='',unitName='';const o=sheet(d,'<div class="sectiontag">CREAR MI LISTA</div><h2>1 · ¿De qué parte vienen?</h2><p class="small">Elige un grupo existente o crea uno nuevo.</p><div data-groups></div><label>Grupo nuevo</label><input class="field" data-newg placeholder="Ej. Vecinos"><div class="actions"><button class="btn soft" data-close>Volver</button><button class="btn" data-next>Siguiente</button></div>');if(!o)return;const renderG=()=>{o.p.querySelector('[data-groups]').innerHTML=groups.map(g=>'<button class="v110choice" data-g="'+esc(g)+'">'+esc(g)+'</button>').join('');o.p.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{group=b.dataset.g;o.p.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('sel',x===b));o.p.querySelector('[data-newg]').value=''})};renderG();o.p.querySelector('[data-close]').onclick=o.close;o.p.querySelector('[data-next]').onclick=()=>{const ng=o.p.querySelector('[data-newg]').value.trim();if(ng)group=ng;if(group)step2()};function step2(){const pmap=new Map((struct.people||[]).map(p=>[p.guest_key,p])),used=new Set(Object.entries(state().guests||{}).filter(([,g])=>g?.group===group).map(([id])=>pmap.get(id)?.unit_key).filter(Boolean)),units=(struct.units||[]).filter(u=>used.has(u.unit_key));o.p.innerHTML='<div class="sectiontag">'+esc(group)+'</div><h2>2 · ¿Qué círculo es?</h2><p class="small">Por ejemplo Universidad, Familia de Canarias… o déjalo sin círculo.</p><button class="v110choice sel" data-u="">Sin círculo</button>'+units.map(u=>'<button class="v110choice" data-u="'+esc(u.unit_key)+'" data-un="'+esc(u.name)+'">'+esc(u.name)+'</button>').join('')+'<label>Círculo nuevo</label><input class="field" data-newu placeholder="Ej. Universidad"><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-next>Siguiente</button></div>';o.p.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{unitKey=b.dataset.u||'';unitName=b.dataset.un||'';o.p.querySelectorAll('[data-u]').forEach(x=>x.classList.toggle('sel',x===b));o.p.querySelector('[data-newu]').value=''});o.p.querySelector('[data-back]').onclick=()=>{o.close();fastCreate(d,w)};o.p.querySelector('[data-next]').onclick=()=>{const nu=o.p.querySelector('[data-newu]').value.trim();if(nu){unitKey='__new__';unitName=nu}step3()}}function step3(){o.p.innerHTML='<div class="sectiontag">'+esc(group)+(unitName?' · '+esc(unitName):'')+'</div><h2>3 · Añade las personas</h2><p class="small">Un nombre por línea. Al guardar irás directamente a las mesas.</p><textarea class="field" data-names style="min-height:150px" placeholder="Ana López\nMaría López\nJuan Pérez"></textarea><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-save>Crear y sentar</button></div>';o.p.querySelector('[data-back]').onclick=step2;o.p.querySelector('[data-save]').onclick=async()=>{const names=o.p.querySelector('[data-names]').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!names.length)return;const b=w.__v110Bridge,S=b?.state?.()||state();S.guests=S.guests||{};const ids=[];for(const name of names){const id='g_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);ids.push(id);S.guests[id]={name,rsvp:'pending',meal:'',table:'',transport:false,group,unitId:''}}b?.save?.();b?.render?.();o.close();goPlan(w);(async()=>{let u=unitKey;if(u==='__new__')u=await syncUnit(unitName);ids.forEach(id=>{if(S.guests[id])S.guests[id].unitId=u||''});b?.save?.();await Promise.allSettled(ids.map(id=>syncPerson(id,group,u||'')))})()}}}function goPlan(w){try{w.__v110Bridge?.go('mesas',2)}catch{}setTimeout(()=>{const x=deep();if(!x)return;const b=[...x.d.querySelectorAll('button,a')].find(el=>/^(Abrir )?plano visual$/i.test((el.textContent||'').trim()));if(b)b.click()},180)}let wiredDoc=null;function wire(){const x=deep();if(!x)return;const{d,w}=x;patchLabels(d);if(wiredDoc===d)return;wiredDoc=d;const mo=new MutationObserver(()=>patchLabels(d));const sh=d.getElementById('sheet');if(sh)mo.observe(sh,{childList:true,subtree:true});d.addEventListener('click',e=>{const t=e.target.closest?.('button,a');if(!t)return;const text=(t.textContent||'').trim();if(t.matches('[data-people]')||/^Ver personas$/i.test(text)){e.preventDefault();e.stopImmediatePropagation();openPeople(d);return}if(t.matches('[data-create]')||/^Crear mi lista$/i.test(text)){e.preventDefault();e.stopImmediatePropagation();fastCreate(d,w);return}setTimeout(()=>patchLabels(d),30)},true)}F.addEventListener('load',()=>{setTimeout(wire,500);setTimeout(wire,1400)});setInterval(wire,1200)})();</script></body></html>
