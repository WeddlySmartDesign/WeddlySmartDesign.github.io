<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests stable</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="guests-v110-integrated.html?v=117"></iframe><script>(()=>{const F=document.getElementById('app');let ready=false;function chain(){const out=[];try{let d=F.contentDocument,w=F.contentWindow;for(let i=0;i<40&&d?.body;i++){out.push({d,w});const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument;w=f.contentWindow}return out}catch{return out}}function deep(){const c=chain();return c[c.length-1]||null}function stopLegacyLoops(){for(const x of chain()){try{for(let i=1;i<5000;i++)x.w.clearInterval(i)}catch{}}}function couple(d){const texts=[...d.querySelectorAll('h1,.hero h1,.brandtitle,.couple')].map(x=>(x.textContent||'').trim()).filter(Boolean);const hit=texts.find(t=>t.includes('&'));if(!hit)return['Persona 1','Persona 2'];const p=hit.split('&').map(x=>x.trim()).filter(Boolean);return p.length>=2?[p[0],p[1]]:['Persona 1','Persona 2']}function replaceGender(s,d){const[a,b]=couple(d);if(a==='Persona 1')return s;return String(s).replace(/Familia novia/gi,'Familia '+a).replace(/Familia novio/gi,'Familia '+b).replace(/Amigos novia/gi,'Amigos '+a).replace(/Amigos novio/gi,'Amigos '+b).replace(/\bnovia\b/gi,a).replace(/\bnovio\b/gi,b)}function patchLabels(d){const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const ns=[];while(walker.nextNode())ns.push(walker.currentNode);for(const n of ns){const p=n.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(p.tagName))continue;if(/\b(novia|novio)\b/i.test(n.nodeValue||''))n.nodeValue=replaceGender(n.nodeValue,d)}d.querySelectorAll('option,[data-g]').forEach(el=>{if(/\b(novia|novio)\b/i.test(el.textContent||''))el.textContent=replaceGender(el.textContent,d)})}function showPeople(d){const card=d.getElementById('v108list');if(!card)return false;card.style.display='block';card.removeAttribute('hidden');const body=card.querySelector('[data-b]');if(body)body.style.display='block';card.scrollIntoView({behavior:'smooth',block:'start'});return true}function goPlan(w){try{w.__v110Bridge?.go('mesas',2)}catch{}setTimeout(()=>{const x=deep();if(!x)return;const b=[...x.d.querySelectorAll('button,a')].find(el=>/^(Abrir )?plano visual$/i.test((el.textContent||'').trim()));if(b)b.click()},250)}function wire(){const x=deep();if(!x)return;const{d,w}=x;patchLabels(d);if(ready)return;ready=true;d.addEventListener('click',e=>{const t=e.target.closest?.('button,a');if(!t)return;const text=(t.textContent||'').trim();if(t.matches('[data-people]')||/^Ver personas$/i.test(text)){e.preventDefault();e.stopImmediatePropagation();showPeople(d);return}if(t.matches('[data-t]')&&t.closest('#v108list')){e.preventDefault();e.stopImmediatePropagation();const b=t.closest('#v108list').querySelector('[data-b]');if(b)b.style.display=b.style.display==='none'?'block':'none';return}if(t.matches('[data-save]')&&/Crear invitados/i.test(text)){setTimeout(()=>{const toast=d.querySelector('.v110toast');if(toast&&/invitad.*añadid/i.test(toast.textContent||''))goPlan(w)},900)}setTimeout(()=>patchLabels(d),60)},true)}function stabilize(){stopLegacyLoops();wire()}F.addEventListener('load',()=>setTimeout(stabilize,1800));setTimeout(stabilize,2200)})();</script></body></html>
