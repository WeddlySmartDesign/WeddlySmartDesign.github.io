<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests v114 stable</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}iframe{width:100%;height:100%;border:0}.planOverlay{position:fixed;inset:0;z-index:99999;background:#f5f1ea;display:none}.planOverlay.on{display:block}.planOverlay iframe{width:100%;height:100%;border:0}</style></head><body><iframe id="app" src="guests-v110-integrated.html?v=118"></iframe><div id="planOverlay" class="planOverlay"><iframe id="planFrame" title="Plano de mesas"></iframe></div><script>(()=>{const F=document.getElementById('app'),OVER=document.getElementById('planOverlay'),PF=document.getElementById('planFrame'),KEY='weddly_guests_qa_v67';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function chain(){const out=[];try{let d=F.contentDocument,w=F.contentWindow;for(let i=0;i<40&&d?.body;i++){out.push({d,w});const f=d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument;w=f.contentWindow}return out}catch{return out}}function deep(){const c=chain();return c[c.length-1]||null}function state(){try{return JSON.parse(localStorage.getItem(KEY))||{guests:{}}}catch{return{guests:{}}}}function couple(d){const hit=[...d.querySelectorAll('h1,.hero h1,.brandtitle,.couple')].map(x=>(x.textContent||'').trim()).find(t=>t.includes('&'));if(!hit)return['Persona 1','Persona 2'];const p=hit.split('&').map(x=>x.trim()).filter(Boolean);return p.length>=2?[p[0],p[1]]:['Persona 1','Persona 2']}function replaceGender(s,d){const[a,b]=couple(d);if(a==='Persona 1')return s;return String(s).replace(/Familia novia/gi,'Familia '+a).replace(/Familia novio/gi,'Familia '+b).replace(/Amigos novia/gi,'Amigos '+a).replace(/Amigos novio/gi,'Amigos '+b).replace(/\bnovia\b/gi,a).replace(/\bnovio\b/gi,b)}function patchLabels(d){const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const n of nodes){const p=n.parentElement;if(!p||['SCRIPT','STYLE','TEXTAREA','INPUT'].includes(p.tagName))continue;if(/\b(novia|novio)\b/i.test(n.nodeValue||''))n.nodeValue=replaceGender(n.nodeValue,d)}d.querySelectorAll('option,[data-g]').forEach(el=>{if(/\b(novia|novio)\b/i.test(el.textContent||''))el.textContent=replaceGender(el.textContent,d)})}function sheet(d,html){const sh=d.getElementById('sheet'),p=d.getElementById('panel');if(!sh||!p)return null;p.innerHTML=html;sh.classList.add('on');const nav=d.querySelector('.nav');if(nav)nav.style.pointerEvents='none';const close=()=>{sh.classList.remove('on');p.innerHTML='';if(nav)nav.style.pointerEvents='auto'};sh.onclick=e=>{if(e.target===sh)close()};p.onclick=e=>e.stopPropagation();return{p,close}}function openPeople(d){const people=Object.entries(state().guests||{}).map(([id,g])=>({id,...g})).filter(g=>g&&g.rsvp!=='declined');const o=sheet(d,'<div class="sectiontag">PERSONAS</div><h2>Invitados en gestión</h2><p class="small">Lista activa de la boda.</p><div data-list style="display:grid;gap:0;margin-top:12px"></div><div class="actions"><button class="btn soft" data-close>Hecho</button></div>');if(!o)return;const list=o.p.querySelector('[data-list]');list.innerHTML=people.map(g=>'<div style="padding:14px 0;border-bottom:1px solid #e7e1d8"><b>'+esc(g.name||'Sin nombre')+'</b><div class="small">'+esc(g.rsvp==='confirmed'?'Confirmado':'Pendiente')+(g.group?' · '+esc(g.group):'')+(g.table?' · '+esc(g.table):' · Sin mesa')+'</div></div>').join('')||'<p class="small">No hay personas activas.</p>';o.p.querySelector('[data-close]').onclick=o.close}function closePlan(){OVER.classList.remove('on');PF.src='about:blank';const x=deep();if(x){try{x.w.__v110Bridge?.render?.();x.w.__v110Bridge?.go?.('mesas',2)}catch{}setTimeout(()=>patchLabels(x.d),50)}}function hookPlanBack(){let tries=0;const tick=()=>{tries++;try{const d=PF.contentDocument,b=d&&d.getElementById('backGuests');if(b){b.onclick=e=>{e?.preventDefault?.();e?.stopImmediatePropagation?.();closePlan()};return}}catch{}if(tries<60)setTimeout(tick,100)};tick()}function openPlan(){OVER.classList.add('on');PF.src='guests-v081-visual-seating.html?v=119';PF.onload=hookPlanBack}function groups(d){const[a,b]=couple(d),base=a==='Persona 1'?['Familia A','Familia B','Amigos A','Amigos B','Trabajo','Otros']:[`Familia ${a}`,`Familia ${b}`,`Amigos ${a}`,`Amigos ${b}`,'Trabajo','Otros'];const custom=Object.values(state().guests||{}).map(g=>g?.group).filter(Boolean).filter(g=>!/(novia|novio)/i.test(g));return[...new Set([...base,...custom])]}function fastCreate(d,w){let group='',circle='';const o=sheet(d,'<div class="sectiontag">CREAR MI LISTA</div><h2>1 · ¿De qué parte vienen?</h2><p class="small">Elige el grupo grande.</p><div data-groups></div><label>Grupo nuevo</label><input class="field" data-newg placeholder="Ej. Vecinos"><div class="actions"><button class="btn soft" data-close>Volver</button><button class="btn" data-next>Siguiente</button></div>');if(!o)return;const renderG=()=>{o.p.querySelector('[data-groups]').innerHTML=groups(d).map(g=>'<button class="v110choice" data-g="'+esc(g)+'">'+esc(g)+'</button>').join('');o.p.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{group=b.dataset.g;o.p.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('sel',x===b));o.p.querySelector('[data-newg]').value=''})};renderG();o.p.querySelector('[data-close]').onclick=o.close;o.p.querySelector('[data-next]').onclick=()=>{const ng=o.p.querySelector('[data-newg]').value.trim();if(ng)group=ng;if(!group)return;step2()};function step2(){o.p.innerHTML='<div class="sectiontag">'+esc(group)+'</div><h2>2 · ¿Qué círculo es?</h2><p class="small">Por ejemplo Universidad o Familia de Canarias. Puede quedar vacío.</p><input class="field" data-circle placeholder="Ej. Universidad"><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-next>Siguiente</button></div>';o.p.querySelector('[data-back]').onclick=()=>{o.close();fastCreate(d,w)};o.p.querySelector('[data-next]').onclick=()=>{circle=o.p.querySelector('[data-circle]').value.trim();step3()}}function step3(){o.p.innerHTML='<div class="sectiontag">'+esc(group)+(circle?' · '+esc(circle):'')+'</div><h2>3 · Añade las personas</h2><p class="small">Un nombre por línea. Al guardar irás directamente al plano.</p><textarea class="field" data-names style="min-height:150px" placeholder="Ana López\nMaría López\nJuan Pérez"></textarea><div class="actions"><button class="btn soft" data-back>Volver</button><button class="btn" data-save>Crear y sentar</button></div>';o.p.querySelector('[data-back]').onclick=step2;o.p.querySelector('[data-save]').onclick=()=>{const names=o.p.querySelector('[data-names]').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);if(!names.length)return;const S=w.__v110Bridge?.state?.()||state();S.guests=S.guests||{};for(const name of names){const id='g_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);S.guests[id]={name,rsvp:'pending',meal:'',table:'',transport:false,group,unitId:circle||''}}w.__v110Bridge?.save?.();w.__v110Bridge?.render?.();o.close();openPlan()}}}let wired=null;function wire(){const x=deep();if(!x)return;const{d,w}=x;patchLabels(d);if(wired===d)return;wired=d;d.addEventListener('click',e=>{const t=e.target.closest?.('button,a');if(!t)return;const text=(t.textContent||'').trim();if(/^Ver personas$/i.test(text)||t.matches('[data-people]')){e.preventDefault();e.stopImmediatePropagation();openPeople(d);return}if(/^Crear mi lista$/i.test(text)||t.matches('[data-create]')){e.preventDefault();e.stopImmediatePropagation();fastCreate(d,w);return}if(/^(Abrir )?plano visual$/i.test(text)){e.preventDefault();e.stopImmediatePropagation();openPlan();return}setTimeout(()=>patchLabels(d),30)},true)}function boot(tries=0){const x=deep();if(x){wire();return}if(tries<50)setTimeout(()=>boot(tries+1),100)}F.addEventListener('load',()=>boot());boot()})();</script></body></html>
