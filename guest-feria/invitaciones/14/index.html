 -webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 80%,transparent 100%),linear-gradient(to right,transparent 0%,#000 10%,#000 90%,transparent 100%);
 -webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0%,#000 13%,#000 80%,transparent 100%),linear-gradient(to right,transparent 0%,#000 10%,#000 90%,transparent 100%);mask-composite:intersect}

/* ---------- movimiento premium de las escenas interiores ---------- */
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;opacity:0;transition:opacity .9s ease}
#fx.on{opacity:1}
.motif{display:block;width:clamp(78px,22vw,104px);height:auto;margin:0 auto 14px;opacity:0;transform:translateY(14px) scale(.9);transition:opacity 1.4s ease,transform 1.6s cubic-bezier(.2,.8,.2,1)}
.in .motif,.motif.in{opacity:1;transform:none}
.motif.idle-rotate{animation:motifRotate 60s linear infinite}
.motif.idle-float{animation:motifFloat 6s ease-in-out infinite}
.motif.idle-flap{animation:motifFlap 1.9s ease-in-out infinite}
.motif.idle-glow{animation:motifGlow 4.5s ease-in-out infinite}
@keyframes motifRotate{to{rotate:360deg}}
@keyframes motifFloat{0%,100%{translate:0 0}50%{translate:0 -6px}}
@keyframes motifFlap{0%,100%{scale:1 1}50%{scale:.62 1}}
@keyframes motifGlow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,215,150,0))}50%{filter:drop-shadow(0 0 10px rgba(255,215,150,.75))}}
.section-kicker,h2,.rule-orn{will-change:opacity}
.rv-head .section-kicker{opacity:0;letter-spacing:.32em;transition:opacity 1.1s ease,letter-spacing 1.6s cubic-bezier(.2,.8,.2,1)}
.rv-head h2{clip-path:inset(-20% 100% -20% 0);transition:clip-path 1.7s cubic-bezier(.6,.05,.2,1) .25s}
.rv-head .rule-orn path{stroke-dasharray:240;stroke-dashoffset:240;transition:stroke-dashoffset 1.8s ease .8s}
.rv-head .rule-orn circle{opacity:0;transition:opacity .6s ease 1.9s}
.rv-head.in .section-kicker{opacity:1;letter-spacing:var(--label-track)}
.rv-head.in h2{clip-path:inset(-20% -5% -20% 0)}
.rv-head.in .rule-orn path{stroke-dashoffset:0}.rv-head.in .rule-orn circle{opacity:1}
.rule-orn{display:block;width:150px;height:14px;margin:-8px auto 16px;color:var(--accent)}
.rv{opacity:0;transform:translate3d(0,26px,0);transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.rv.in{opacity:1;transform:none}
img.feather.rv{transform:scale(1.07);filter:blur(3px);transition:opacity 1.5s ease,transform 2.4s cubic-bezier(.2,.8,.2,1),filter 1.4s ease}
img.feather.rv.in{transform:none;filter:none}
@media(prefers-reduced-motion:reduce){.rv,.rv-head .section-kicker,.rv-head h2,img.feather.rv,.motif{opacity:1!important;transform:none!important;clip-path:none!important;filter:none!important;letter-spacing:.11em;transition:none!important;animation:none!important}.rv-head .rule-orn path{stroke-dashoffset:0}.rv-head .rule-orn circle{opacity:1}#fx{display:none}}
/* mientras se vuelve a ver, los textos se apartan para ver la escena entera; vuelven al terminar */
#cover.replaying .cover-text,#cover.replaying .cover-scrim,#cover.replaying .cover-bottom,#closing.replaying .closing-text,#closing.replaying .closing-scrim{opacity:0!important;pointer-events:none}

.replay{position:absolute;z-index:3;top:max(14px,calc(env(safe-area-inset-top) + 10px));right:12px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.55);background:rgba(20,20,28,.16);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s ease}

.replay:focus-visible{outline:2px solid #fff;outline-offset:2px}
/* franjas de continuidad: quedan detrás de la primera y la última sección, sin trozos de fondo vacío */
main>img[class$="-band"]{position:relative;z-index:0}
#cover+img[class$="-band"]{-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
main>img[class$="-band"]:not(#cover+img){-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}

/* ===== composición editorial sin tarjetas: numeración, filetes y adornos tipográficos ===== */
.pr-icon{display:none}
#practical-items{display:block;max-width:400px;margin:6px auto 0;counter-reset:pr}

.practical-title{margin:0 0 6px;font-size:calc(clamp(16px,4.4vw,19px)*var(--label-size));text-align:left;font-family:var(--label);text-transform:var(--label-case);letter-spacing:calc(var(--label-track) + .02em)}
.practical-details{margin:0 0 8px;max-width:none;text-align:left}

.travel-time{align-items:flex-start}
.practical-item details{margin:2px 0 0;width:auto}

.location+.location{border-top:1px solid var(--line);margin-top:10px;padding-top:30px}
.link{border-radius:0;background:transparent;border:0;border-bottom:1px solid currentColor;padding:12px 0 5px;min-height:44px;font:500 12.5px/1.2 var(--label);text-transform:uppercase;letter-spacing:.18em;color:var(--accent)}
.link::after{content:"";display:inline-block;width:14px;height:1px;margin-left:8px;background:currentColor;vertical-align:middle;transition:width .3s}
.link:hover::after{width:22px}
.location-links{gap:4px 24px}
.practical-item summary{font-family:var(--label);text-transform:var(--label-case);font-size:12.5px;letter-spacing:.16em;color:var(--accent)}
.location-type{font-family:var(--label);text-transform:var(--label-case);letter-spacing:calc(var(--label-track) + .06em)}
.travel-time .time-label{font-family:var(--label);text-transform:var(--label-case)}
.time-value,.location-time{font-family:var(--num)}

/* ===== AZULEJO · cerámica pintada a mano, cobalto ===== */
html[data-skin=azulejo]{--title:'Chorus',var(--script);--serif:'Lora',Georgia,serif;--label:'Lora',Georgia,serif;--num:'Lora',Georgia,serif;--label-case:uppercase;--label-track:.24em;--label-size:.68}

html[data-skin=azulejo] .agenda-track{left:22px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 11px)}
html[data-skin=azulejo] .moment-node{width:22px;height:22px;left:12px;top:16px;background:#fbf8f2;box-shadow:inset 0 0 0 3px #fbf8f2}
html[data-skin=azulejo] .moment.on .moment-node{background:var(--accent);box-shadow:inset 0 0 0 3px #fbf8f2,0 0 0 4px rgba(35,64,138,.14)}

/* ===== GALA · art déco, laca negra y oro ===== */
html[data-skin=gala]{--title:var(--script);--serif:'Baskerville',Georgia,serif;--label:'Adventor',Futura,sans-serif;--num:'Adventor',Futura,sans-serif;--label-case:uppercase;--label-track:.32em;--label-size:.6;--gold:linear-gradient(100deg,#6e5016 0%,#a8822f 30%,#d2b06a 48%,#9a7428 66%,#6e5016 100%)}
html[data-skin=gala]{--glyph:'◆';--pr-style:decimal-leading-zero;--numeral-font:400 24px/1.2 'Adventor',sans-serif}
html[data-skin=gala] .practical-item::before{letter-spacing:.12em;color:#94712d;padding-top:4px}
html[data-skin=gala] .link{color:#7d5f22}
html[data-skin=gala] h2{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
html[data-skin=gala] .agenda-list{max-width:380px}
html[data-skin=gala] .agenda-track{left:50%;background:rgba(148,113,45,.35)}
html[data-skin=gala] .agenda-track::after{background:linear-gradient(#d9bd78,#94712d)}
html[data-skin=gala] .moment{grid-template-columns:1fr 1fr;column-gap:44px;padding:16px 0;transform:translateY(12px)}
html[data-skin=gala] .moment.on{transform:none}
html[data-skin=gala] .moment-node{left:calc(50% - 9px);top:21px;width:18px;height:18px;border-color:#b8923f}
html[data-skin=gala] .moment.on .moment-node{background:#d9bd78;box-shadow:0 0 14px rgba(217,189,120,.7)}
html[data-skin=gala] .moment-time{grid-column:1;text-align:right;align-self:center;font-size:15px;letter-spacing:.22em}
html[data-skin=gala] .moment-label{grid-column:2;grid-row:1;align-self:center;font-size:clamp(19px,5vw,23px)}

/* ===== INVERNADERO · cristal, hierro blanco y verde ===== */
html[data-skin=invernadero]{--title:'Pagella',Palatino,serif;--label:'Poppins',sans-serif;--num:'Poppins',sans-serif;--label-case:uppercase;--label-track:.3em;--label-size:.6}
html[data-skin=invernadero]{--glyph:'❦';--pr-style:lower-roman;--numeral-font:italic 400 40px/1 'Pagella',serif}
html[data-skin=invernadero] .link{font-weight:400;font-size:11.5px;letter-spacing:.22em}
html[data-skin=invernadero] h2{font-style:italic;font-size:clamp(44px,12vw,66px);letter-spacing:-.01em}
html[data-skin=invernadero] .agenda-track{left:24px;width:2px;background:rgba(61,106,81,.18);border-radius:2px}
html[data-skin=invernadero] .agenda-track::after{background:linear-gradient(#7aa56f,#3d6a51)}
html[data-skin=invernadero] .moment-node{left:9px;top:12px;width:30px;height:30px;border:0;background:none;transform:scale(0) rotate(-40deg);transform-origin:20% 80%}
html[data-skin=invernadero] .moment-node::before{content:"";position:absolute;inset:3px 3px 3px 10px;background:linear-gradient(135deg,#9cc58e,#3d6a51);border-radius:0 80% 0 80%}
html[data-skin=invernadero] .moment:nth-child(odd) .moment-node::before{inset:3px 10px 3px 3px;border-radius:80% 0 80% 0}
html[data-skin=invernadero] .moment.on .moment-node{transform:scale(1) rotate(0);background:none;box-shadow:none}
html[data-skin=invernadero] .moment-time{font-weight:300;font-size:14px;letter-spacing:.24em}

/* ===== REFLEJO · agua, crepúsculo y rosa ===== */
html[data-skin=reflejo]{--title:'Lora',Georgia,serif;--serif:'Lora',Georgia,serif;--label:'GaramondSC',Georgia,serif;--num:'Garamond',Georgia,serif;--label-track:.18em;--label-size:.9}
html[data-skin=reflejo]{--glyph:'○';--pr-style:upper-roman;--numeral-font:italic 400 38px/1 'Lora',serif}
html[data-skin=reflejo] .link{font:italic 400 17px/1.2 var(--serif);text-transform:none;letter-spacing:.02em}
html[data-skin=reflejo] h2{font-style:italic;font-size:clamp(48px,13vw,72px);position:relative;margin-bottom:46px}
html[data-skin=reflejo] h2::after{content:attr(data-text);position:absolute;left:0;right:0;top:82%;transform:scaleY(-1);opacity:.22;-webkit-mask-image:linear-gradient(to top,#000,transparent 70%);mask-image:linear-gradient(to top,#000,transparent 70%);animation:ripple 5s ease-in-out infinite;pointer-events:none;filter:blur(.6px)}
@keyframes ripple{0%,100%{transform:scaleY(-1) skewX(0)}50%{transform:scaleY(-1.06) skewX(-4deg)}}
html[data-skin=reflejo] .rule-orn{display:none}
@keyframes ring{from{transform:scale(.6);opacity:.6}to{transform:scale(1.8);opacity:0}}
html[data-skin=reflejo] .moment-node{border-radius:50%;transform:scale(.6)}
html[data-skin=reflejo] .moment.on .moment-node{transform:scale(1)}
html[data-skin=reflejo] .moment.on .moment-node::after{content:"";position:absolute;inset:-1px;border:1px solid var(--accent);border-radius:50%;animation:ring 2.6s ease-out infinite}
html[data-skin=reflejo] .moment-time{font-style:italic;font-size:21px}

/* ===== CAJA DE MÚSICA · latón, terciopelo y pentagrama ===== */
html[data-skin=caja]{--serif:'Bonum',Georgia,serif;--label:'Bonum',Georgia,serif;--num:'Bonum',Georgia,serif;--label-case:uppercase;--label-track:.26em;--label-size:.62;--brass:linear-gradient(100deg,#7e5a2a,#c99a55 35%,#f0d29a 50%,#b5853f 70%,#7e5a2a);--brass-ink:linear-gradient(100deg,#5e3f17,#9a6c2c 35%,#c79a55 50%,#8a5f26 70%,#5e3f17)}
html[data-skin=caja]{--glyph:'♪';--pr-style:upper-roman;--numeral-font:italic 400 38px/1 'Bonum',serif}
html[data-skin=caja] .practical-item::before{background:var(--brass-ink);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-skin=caja] .link{color:#7a5222}
html[data-skin=caja] h2{background:var(--brass-ink);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
html[data-skin=caja] .agenda-track{left:16px;width:22px;background:repeating-linear-gradient(to right,rgba(138,97,49,.35) 0 1px,transparent 1px 5.25px);opacity:.9}
html[data-skin=caja] .agenda-track::after{left:9px;width:4px;background:linear-gradient(#f0d29a,#b5853f);box-shadow:0 0 10px rgba(240,210,154,.8)}
html[data-skin=caja] .moment-node{border:0;background:none;transform:scale(.6);left:10px;top:6px;width:34px;height:36px}
html[data-skin=caja] .moment-node::before{content:"♪";position:absolute;inset:0;display:grid;place-items:center;font:400 34px/1 Georgia,serif;color:rgba(138,97,49,.45)}
html[data-skin=caja] .moment.on .moment-node{background:none;box-shadow:none;transform:scale(1);animation:note 1.6s ease-in-out infinite}
html[data-skin=caja] .moment.on .moment-node::before{color:#a8782f;text-shadow:0 0 12px rgba(240,210,154,.9)}
@keyframes note{0%,100%{translate:0 0}50%{translate:0 -4px}}
html[data-skin=caja] .moment-time{font-style:italic;letter-spacing:.06em;font-size:19px}
@media(prefers-reduced-motion:reduce){html[data-skin] h2::after,html[data-skin] .moment-node,html[data-skin] .pr-icon::after{animation:none!important}}

/* ===== EL MAPA · interior propio: una guía de viaje hacia la boda, sobre papel crema ===== */
/* tinta #2E3A3C · papel #F3ECDD · terracota #B5573A · salvia #7E8F6E · ocre #C9A45C · mar #A9C2C0 */
html.mp{background:#efe6d5}
html.mp body{background:url(media/xc9038ebe4767f06f.jpg) center top/640px auto repeat #f3ecdd}
html.mp [data-bg]{background:none!important;min-height:0!important;display:block;padding:30px 16px 22px!important;color:#2e3a3c;font:400 18.5px/1.6 'Lora',Georgia,serif}
/* página de la guía: doble filete sepia, como la tapa del mapa */
.mp-page{position:relative;max-width:440px;margin:0 auto;padding:34px 22px 26px;background:#fbf6ea;border:1px solid rgba(110,88,62,.55);box-shadow:0 1px 0 #fff inset,0 10px 26px -14px rgba(70,52,30,.45);text-align:center}
.mp-page::before{content:"";position:absolute;inset:7px;border:1px solid rgba(110,88,62,.35);pointer-events:none}
.mp-rv{opacity:0;transform:translateY(16px);transition:opacity .8s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.mp-rv.in{opacity:1;transform:none}
.mp-cap{display:inline-flex;align-items:center;gap:8px;margin:0;font:400 14px/1.2 'GaramondSC',Georgia,serif;letter-spacing:.18em;text-transform:uppercase;color:#8a6a48}
.mp-rose{display:inline-block;width:26px;height:26px;background:url(media/x75b090188d96e11a.png) center/contain no-repeat;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.mp-page.in .mp-rose{transform:rotate(360deg)}
.mp-title{margin:6px 0 16px;font:italic 400 38px/1.15 'Lora',Georgia,serif;color:#2e3a3c;letter-spacing:.005em}
.mp-p{margin:0 auto;max-width:32ch;font-size:18.5px;line-height:1.65;white-space:pre-line;overflow-wrap:anywhere}
/* fotos: copia en papel con margen blanco */
.mp-ph{margin:22px 0 4px;padding:9px 9px 9px;background:#fff;box-shadow:0 8px 20px -10px rgba(60,44,26,.5);transform:rotate(-.6deg)}
.mp-ph img{display:block;width:100%;height:290px;object-fit:cover;max-width:none!important}
.mp-ph[data-fit=full] img{object-fit:contain;height:auto;max-height:430px;background:#fff}
/* lugar: postales con sello y matasellos */
.mp-card{position:relative;display:grid;grid-template-columns:1fr 88px;gap:0 12px;align-items:start;text-align:left;margin-top:18px;padding:16px 14px 16px 18px;background:#fffdf7;border:1px solid rgba(110,88,62,.4);box-shadow:0 8px 18px -12px rgba(60,44,26,.55)}
.mp-card::before{content:"";position:absolute;right:112px;top:16px;bottom:16px;border-left:1px solid rgba(110,88,62,.25)}
.mp-card .mp-stamp{grid-column:2;grid-row:1}
.mp-c-info{grid-column:1;grid-row:1;min-width:0;padding-right:12px}
.mp-c-k{display:block;font:400 13px/1.3 'GaramondSC',Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:#b5573a}
.mp-c-name{font:italic 400 25px/1.2 'Lora',Georgia,serif;color:#2e3a3c;margin:3px 0 2px;overflow-wrap:anywhere}
.mp-c-addr{font-size:16.5px;line-height:1.4;color:#4c5654;overflow-wrap:anywhere}
.mp-stamp{position:relative;display:grid;place-items:center;width:84px;height:96px;background:radial-gradient(circle,transparent 4.2px,#fffdf7 4.6px) -6px -6px/12px 12px;padding:7px;transform:rotate(2.5deg)}
.mp-stamp::before{content:"";position:absolute;inset:7px;background:#b5573a;box-shadow:inset 0 0 0 3px #fffdf7,inset 0 0 0 4px rgba(255,253,247,.6)}
.mp-stamp.alt::before{background:#7e8f6e}
.mp-stamp::after{content:"";position:absolute;left:-26px;top:44px;width:60px;height:60px;border-radius:50%;border:1.5px solid rgba(46,58,60,.45);background:repeating-linear-gradient(0deg,transparent 0 9px,rgba(46,58,60,.35) 9px 10.5px) center/36px 60px no-repeat;-webkit-mask:radial-gradient(circle,#000 62%,transparent 63%);mask:radial-gradient(circle,#000 62%,transparent 63%);opacity:.8}
.mp-stamp b{position:relative;z-index:1;font:italic 600 21px/1 'Lora',Georgia,serif;color:#fffdf7;letter-spacing:.01em}
.mp-links{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;margin-top:10px}
.mp-card .mp-links{justify-content:flex-start}
html.mp a.link{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px 7px;border:1px solid #b5573a;border-radius:999px;background:transparent;font:400 13.5px/1 'GaramondSC',Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#8f4129;text-decoration:none;white-space:nowrap;transition:background .2s,color .2s}
html.mp a.link:active{background:#b5573a;color:#fffdf7}
html.mp a.link::after{content:none}
.mp-note{margin:22px auto 2px;max-width:330px;font-size:17px;line-height:1.45;font-style:italic}
.mp-note b{display:block;font:400 13px/1.4 'GaramondSC',Georgia,serif;font-style:normal;letter-spacing:.16em;text-transform:uppercase;color:#b5573a}
/* programa: alfileres sobre un camino que se dibuja al bajar */
.mp-now{position:relative;display:block;max-width:350px;margin:4px auto 0;text-align:left;--drawn:0px}
.mp-now::before,.mp-now::after{content:"";position:absolute;left:31px;top:26px;width:0;border-left:3px dashed rgba(46,58,60,.18)}
.mp-now::before{bottom:26px}
.mp-now::after{height:max(0px,calc(var(--drawn) - 26px));border-left-color:#b5573a;transition:height .7s cubic-bezier(.2,.7,.2,1)}
.mp-m{position:relative;z-index:1;display:grid;grid-template-columns:64px 1fr;gap:0 10px;align-items:center;margin:10px 0;opacity:.3;transform:translateY(12px);transition:opacity .6s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.mp-m.in{opacity:.85;transform:none}
.mp-m.on{opacity:1}
.mp-mk{position:relative;display:grid;justify-items:center;align-content:center;gap:3px;width:64px;min-height:72px;border:0;padding:0;background:none;cursor:pointer}
.mp-pin{position:relative;width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg) scale(.8);background:#fbf6ea;border:2px solid #b5573a;transition:transform .6s cubic-bezier(.3,1.7,.5,1),background .4s}
.mp-pin::after{content:"";position:absolute;inset:7px;border-radius:50%;background:#b5573a;transition:background .4s}
.mp-m.on .mp-pin{transform:rotate(-45deg) scale(1.12) translate(3px,-3px);background:#b5573a}
.mp-m.on .mp-pin::after{background:#fbf6ea}
.mp-t{font:italic 600 15px/1 'Lora',Georgia,serif;color:#2e3a3c;background:#fbf6ea;padding:2px 3px}
.mp-mk:focus-visible{outline:2px solid #b5573a;outline-offset:2px;border-radius:8px}
.mp-lb{display:block;padding:11px 14px;border-bottom:1px solid rgba(110,88,62,.3);font:400 20px/1.25 'Lora',Georgia,serif;color:#2e3a3c;cursor:pointer;overflow-wrap:anywhere;transition:color .4s,border-color .4s}
.mp-m.on .mp-lb{font-style:italic;color:#8f4129;border-bottom-color:#b5573a}
.mp-hint{margin:16px 0 0;font-size:15px;font-style:italic;color:#6a6458}
/* detalles: billetes con matriz y perforado */
.mp-tickets{display:grid;grid-template-columns:1fr;gap:12px;max-width:300px;margin:6px auto 0}
.mp-b{position:relative;display:grid;grid-template-columns:40px 1fr;align-items:center;min-height:62px;padding:10px 30px 10px 0;border:0;color:#2e3a3c;cursor:pointer;text-align:left;
 background:radial-gradient(circle at 0 50%,transparent 9px,#fffdf7 9.5px) left/51% 100% no-repeat,radial-gradient(circle at 100% 50%,transparent 9px,#fffdf7 9.5px) right/51% 100% no-repeat;filter:drop-shadow(0 5px 7px rgba(60,44,26,.22));transition:transform .4s cubic-bezier(.3,1.5,.5,1)}
.mp-b::before{content:"";position:absolute;left:40px;top:9px;bottom:9px;border-left:1.5px dashed rgba(110,88,62,.45)}
.mp-b::after{content:"";position:absolute;right:12px;top:9px;width:11px;height:11px;border-radius:50%;background:#efe6d5;box-shadow:inset 0 1px 2px rgba(0,0,0,.25);transform:scale(0);transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
.mp-b.punched::after{transform:scale(1)}
.mp-b.solo{width:100%}
.mp-b-no{writing-mode:vertical-rl;transform:rotate(180deg);justify-self:center;font:400 11px/1 'GaramondSC',Georgia,serif;letter-spacing:.14em;color:#b5573a}
.mp-b-lb{padding-left:16px;padding-right:4px;font:400 15px/1.25 'GaramondSC',Georgia,serif;letter-spacing:.12em;text-transform:uppercase;overflow-wrap:normal;word-break:normal;hyphens:manual;min-width:0}
.mp-b[aria-expanded=true]{transform:translateY(-3px) rotate(-1.5deg)}
.mp-b[aria-expanded=true] .mp-b-lb{color:#8f4129}
.mp-b:focus-visible{outline:2px solid #b5573a;outline-offset:3px}
.mp-tray{width:100%;margin:-6px 0 0;overflow:hidden;height:0;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.mp-tray-in{position:relative;margin:14px 6px 8px;padding:20px 20px 16px;background:#fffdf7;border:1px solid rgba(110,88,62,.4);box-shadow:0 10px 20px -12px rgba(60,44,26,.5);text-align:center}
.mp-tray-in::before{content:"";position:absolute;inset:6px;border:1px dashed rgba(110,88,62,.35);pointer-events:none}
.mp-tray-in::after{content:"";position:absolute;right:-10px;top:-14px;width:54px;height:52px;background:url(media/xc75b8b03a80423dc.png) center/contain no-repeat;transform:rotate(12deg);filter:drop-shadow(1px 2px 2px rgba(0,0,0,.25))}
.mp-tray-in h3{margin:0 0 8px;font:italic 400 27px/1.15 'Lora',Georgia,serif;color:#2e3a3c}
.mp-tray-in p{position:relative;margin:0 0 6px;font-size:17px;overflow-wrap:anywhere;white-space:pre-line}
.mp-tt{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 30px;margin:10px 0}
.mp-tt span{display:flex;flex-direction:column;font:400 12.5px/1.6 'GaramondSC',Georgia,serif;letter-spacing:.16em;text-transform:uppercase;color:#6a6458}
.mp-tt b{font:italic 600 27px/1.05 'Lora',Georgia,serif;color:#b5573a;letter-spacing:.01em;text-transform:none}
.mp-tray-in details{position:relative;margin-top:4px}.mp-tray-in summary{display:inline-flex;align-items:center;min-height:44px;cursor:pointer;list-style:none;font:400 13.5px/1 'GaramondSC',Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#8f4129;border-bottom:1px solid #b5573a}
.mp-tray-in summary::-webkit-details-marker{display:none}
/* galería: copias en papel que se pasan */
html.mp #gallery-items{display:flex;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;width:100%;max-width:none;margin:6px 0 0;padding:9px;background:#fff;box-shadow:0 8px 20px -10px rgba(60,44,26,.5);overscroll-behavior-x:contain;box-sizing:border-box}
html.mp #gallery-items::-webkit-scrollbar{display:none}
html.mp #gallery-items img{flex:0 0 100%;width:100%!important;min-width:100%;max-width:none!important;margin:0!important;height:340px;object-fit:cover;scroll-snap-align:center;scroll-snap-stop:always}
html.mp #gallery-items img[data-fit=full]{object-fit:contain;background:#fff}
.mp-dots{display:flex;justify-content:center;gap:2px;margin-top:8px}
html.mp .gallery-dot{width:46px;height:46px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer}
html.mp .gallery-dot::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid #8a6a48;transition:all .3s}
html.mp .gallery-dot[aria-current=true]::before{width:12px;height:12px;background:#b5573a;border-color:#b5573a}
/* portada: los datos sobre el mar, en tinta */
html.mp .cover-text{text-shadow:0 0 18px rgba(232,240,238,.9),0 0 4px rgba(232,240,238,.9)!important}
html.mp .cover-tag{margin:0;font:400 15px/1 'GaramondSC',Georgia,serif!important;letter-spacing:.3em!important;text-transform:uppercase;color:#2e3a3c!important}
html.mp .cover-names{margin:6px 0 4px;font:italic 400 clamp(36px,11vw,52px)/1.08 'Lora',Georgia,serif!important;color:#2e3a3c!important}
html.mp #cover.long-names .cover-names{font-size:clamp(28px,8.4vw,40px)!important}
html.mp .cover-names .amp{font-style:italic;color:#b5573a!important;padding:0 .18em}
html.mp .cover-date,html.mp .countdown,html.mp .cover-place{font-family:'GaramondSC',Georgia,serif!important;letter-spacing:.18em!important;color:#2e3a3c!important}
html.mp .cover-date{font-size:18px!important;margin:4px 0 0}html.mp .countdown,html.mp .cover-place{font-size:15px!important;margin:2px 0}
html.mp .tap-hint{font:italic 400 24px/1.2 'Lora',Georgia,serif;color:#2e3a3c;text-shadow:0 0 14px rgba(251,246,234,.95)}
html.mp .entry-button,html.mp .rsvp-button{font:400 14px/1.2 'GaramondSC',Georgia,serif!important;letter-spacing:.18em;text-transform:uppercase;border:1px solid #8f4129!important;border-radius:999px;background:#b5573a!important;color:#fffdf7!important;box-shadow:0 6px 14px -8px rgba(60,30,10,.6);backdrop-filter:none;-webkit-backdrop-filter:none}
/* cierre: «Os esperamos» y los datos sobre el lino, encima de la carta sellada */
.mp-wait{position:absolute;z-index:2;left:0;right:0;top:max(5svh,calc(env(safe-area-inset-top) + 20px));margin:0;text-align:center;font:italic 400 clamp(36px,10.5vw,48px)/1 'Lora',Georgia,serif;color:#2e3a3c;text-shadow:0 0 18px rgba(251,246,234,.8);opacity:0;transform:translateY(10px);transition:opacity 1.1s ease,transform 1.2s cubic-bezier(.2,.7,.2,1);pointer-events:none}
.mp-wait.on{opacity:1;transform:none}
#closing.replaying .mp-wait{opacity:0}

<script>/* EL MAPA · interior propio: una guía de viaje hacia la boda. Mismo modelo neutro del cuestionario; texto variable siempre con textContent. Sin música. */
(()=>{'use strict';

 if(show){const k=el('p','mp-cap');k.append(el('i','mp-rose'),document.createTextNode(kicker));p.append(k,el('h2','mp-title',title))}sec.append(p);return p}

function links(list){const r=el('div','mp-links');for(const [u,l] of list){const a=el('a','link',l);a.href=u;a.target='_blank';a.rel='noopener noreferrer';r.append(a)}return r}

function render(vm){

 if(vm.story.show){if(vm.story.text)p.append(el('p','mp-p',vm.story.text));if(vm.story.photo)p.append(img(vm.story.photo,'Fotografía de la pareja'))}
 // lugar: cada sede es una postal con su sello (la hora) y su matasellos
 p=page(document.getElementById('locations'),vm.venues.length>0,'El destino','Nos vemos aquí');
 if(vm.venues.length){if(vm.venuePhoto)p.append(img(vm.venuePhoto,'Fotografía del lugar',220));
  vm.venues.forEach((v,i)=>{const c=el('div','mp-card mp-rv');c.append(stamp(v.time||'✦',i%2));const info=el('div','mp-c-info');info.append(el('span','mp-c-k',v.label),el('div','mp-c-name',v.name));if(v.address)info.append(el('div','mp-c-addr',v.address));if(v.links.length)info.append(links(v.links));c.append(info);p.append(c)});
  if(vm.dress){const d=el('p','mp-note mp-rv');d.append(el('b',null,'Código de vestimenta'),document.createTextNode(vm.dress));p.append(d)}}
 // programa: el recorrido del día; cada momento es un alfiler en el camino y el del momento en curso se marca

 if(M.length){const now=el('div','mp-now');now.setAttribute('role','group');now.setAttribute('aria-label','Momentos del día');
  const rows=M.map((m,i)=>{const r=el('div','mp-m');const b=el('button','mp-mk');b.type='button';b.setAttribute('aria-label',(m.time?m.time+' ':'')+m.label);b.append(pin(),el('span','mp-t',m.time||'·'));
   const lb=el('span','mp-lb',m.label||'');r.append(b,lb);const pick=()=>{A.pick=i;A.pickY=scrollY;tick()};b.onclick=pick;lb.onclick=pick;now.append(r);return r});
  p.append(now);if(M.length>1)p.append(el('p','mp-hint','Toca un alfiler para marcarlo'));A={now,rows,n:M.length,pick:null}}
 // detalles: billetes que se pican al tocarlos y se abren en un billete grande

   b.append(el('span','mp-b-no','Nº '+String(i+1).padStart(2,'0')),el('span','mp-b-lb',x.title));

    setTimeout(()=>{const r=tray.getBoundingClientRect(),over=r.bottom-innerHeight+20;if(over>0)scrollBy({top:Math.min(over,r.top-90),behavior:reducedMotion()?'auto':'smooth'})},reducedMotion()?0:620)};grid.append(b)});
  grid.append(tray);p.append(grid,el('p','mp-hint',D.length>1?'Toca cada billete para leerlo':'Toca el billete para leerlo'))}

  if(G.length>1){const dots=el('div','mp-dots');const bs=G.map((_,i)=>{const b=el('button','gallery-dot');b.type='button';b.setAttribute('aria-label','Ver foto '+(i+1));b.onclick=()=>track.scrollTo({left:i*track.clientWidth,behavior:reducedMotion()?'auto':'smooth'});dots.append(b);return b});
   const upd=()=>{const k=Math.max(0,Math.min(bs.length-1,Math.round(track.scrollLeft/Math.max(1,track.clientWidth))));bs.forEach((b,i)=>b.setAttribute('aria-current',i===k?'true':'false'))};track.addEventListener('scroll',upd,{passive:true});p.append(dots);upd()}}

 else{io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});items.forEach(e=>io.observe(e))}
 tick()}
function fill(tin,x){tin.replaceChildren(el('h3',null,x.title));const times=x.lines.filter(l=>/^(Ida|Vuelta):/.test(l)),rest=x.lines.filter(l=>!/^(Ida|Vuelta):/.test(l));
 for(const l of rest.slice(0,1))tin.append(el('p',null,l));if(times.length){const tt=el('div','mp-tt');for(const l of times){const m=l.match(/^(Ida|Vuelta):\s*(.*)$/);const s=el('span',null,m[1]);s.append(el('b',null,m[2]));tt.append(s)}tin.append(tt)}
 for(const l of rest.slice(1))tin.append(el('p',null,l));if(x.links.length)tin.append(links(x.links));
 if(x.more){const d=el('details');d.append(el('summary',null,x.more.label));for(const l of x.more.lines)d.append(el('p',null,l));d.addEventListener('toggle',()=>{document.getElementById('mp-tray').style.height=(tin.offsetHeight+26)+'px'});tin.append(d)}}
// el camino se va dibujando al bajar; el último alfiler a la vista es «el de ahora», salvo que se toque otro
function tick(){if(!A)return;const vh=innerHeight;let cur=0;
 A.rows.forEach((r,i)=>{const y=r.getBoundingClientRect().top;const vis=reducedMotion()||y<vh*.86;r.classList.toggle('in',vis);if(vis&&y<vh*.62)cur=i});
 if(A.pick!=null&&Math.abs(scrollY-(A.pickY||0))>vh*.4)A.pick=null;if(A.pick!=null)cur=A.pick;
 A.rows.forEach((r,i)=>{r.classList.toggle('on',i===cur);if(i===cur)r.classList.add('in')});
 const last=A.rows.filter(r=>r.classList.contains('in')).pop();if(last){const nb=A.now.getBoundingClientRect(),lb=last.getBoundingClientRect();A.now.style.setProperty('--drawn',Math.max(0,lb.top+lb.height/2-nb.top)+'px')}}
let raf=0;addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;tick()})},{passive:true});addEventListener('resize',()=>tick());
addEventListener('DOMContentLoaded',()=>{
 // «Os esperamos» en cursiva cuando el sello cierra la carta

 if(cl&&!cl.querySelector('.mp-wait')){const w=el('p','mp-wait','Os esperamos');w.setAttribute('aria-hidden','true');cl.append(w);
  if(xv){xv.addEventListener('timeupdate',()=>{if(xv.currentTime>=4.7)w.classList.add('on')});xv.addEventListener('play',()=>{if(xv.currentTime<.5)w.classList.remove('on')})}
  if(reducedMotion())w.classList.add('on');new MutationObserver(()=>{if(cl.classList.contains('revealed'))w.classList.add('on')}).observe(cl,{attributes:true,attributeFilter:['class']})}});

<script>
(()=>{'use strict';

const st={config:null};

const STORY_PRESETS={'story-01':'Llevamos años compartiendo planes, viajes, domingos tranquilos y muchas risas. Ahora nos hace muchísima ilusión celebrar el siguiente capítulo con vosotros.','story-02':'No sabemos exactamente cuándo empezó todo, pero sí sabemos que desde entonces la vida es mucho más divertida juntos. Y este día no tendría sentido sin vosotros.','story-03':'Entre planes improvisados, viajes, cenas que se alargan y días de sofá, hemos ido construyendo lo nuestro. Ahora toca celebrarlo con nuestra gente.','story-04':'Después de tantos momentos compartidos, ha llegado uno que queremos vivir rodeados de las personas que forman parte de nuestra historia: vosotros.','story-05':'Nos elegimos hace tiempo y seguimos eligiéndonos cada día. Ahora queremos celebrarlo como más nos gusta: con nuestra familia y amigos cerca.'};

function addLines(container,lines){const items=lines.map(txt).filter(Boolean);if(!items.length)return;const p=node('p','practical-details');for(const item of items){const s=node('span','practical-line');const m=item.match(/^(Ida|Vuelta):\s*(.*)$/);if(m){s.classList.add('travel-time');s.append(node('span','time-label',m[1]),node('strong','time-value',m[2]))}else s.textContent=item;p.append(s)}container.append(p)}

// Modelo neutro para pieles con interior propio: mismos datos y reglas, ninguna invención.

function replay(v,scene){let t=null;const done=()=>{scene.classList.remove('replaying');clearTimeout(t)};v.addEventListener('ended',done);
 return e=>{e.stopPropagation();scene.classList.add('replaying');try{v.currentTime=0}catch{}const pr=v.play();if(pr&&pr.catch)pr.catch(done);clearTimeout(t);t=setTimeout(done,((v.duration||12)+1.5)*1000)}}
