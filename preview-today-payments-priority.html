<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ONE · Hoy Pagos prioridad</title>
<style>
:root{--bg:#f3efe7;--paper:#fbf8f2;--line:#dfd8ca;--ink:#2c2a26;--muted:#746f66;--dark:#566246;--soft:#eef1e9}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:690px;margin:auto;padding:18px 20px 40px}.note{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--muted);font-size:13px;margin-bottom:18px;background:rgba(255,255,255,.35)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px 20px;box-shadow:0 1px 2px rgba(0,0,0,.02)}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px}.title{font:500 44px/1 Georgia,serif;color:var(--dark)}.stats{font-size:15px;color:var(--muted);margin-top:10px}.status{font-size:13px;font-weight:800;color:var(--dark);white-space:nowrap}.status:before{content:'•';margin-right:8px}.item{padding:20px 0;border-bottom:1px solid var(--line)}.item strong{font-size:17px;display:block}.item small{display:block;color:var(--muted);font-size:15px;line-height:1.45;margin-top:5px}.row{display:flex;justify-content:space-between;align-items:flex-end;gap:14px}.read{border:1px solid var(--line);background:var(--soft);color:var(--dark);border-radius:12px;padding:10px 13px;font-weight:800;font-size:13px;white-space:nowrap}.read.done{opacity:.45}.open{margin-top:20px;width:100%;border:0;border-radius:14px;background:var(--dark);color:#fff;padding:16px 18px;font-weight:800;font-size:16px;text-align:left}.all{border:1px solid var(--line);background:#fff;color:var(--dark);border-radius:11px;padding:10px 12px;font-weight:800;font-size:12px;margin-top:10px}.actions{text-align:right}
@media(max-width:520px){.head{align-items:flex-start}.title{font-size:42px}.row{align-items:flex-start}.item small{font-size:14px}.read{font-size:12px;padding:9px 11px}}
</style></head><body><main class="wrap"><div class="note">Vista previa aislada · solo valida la nueva prioridad de Pagos en Hoy.</div><section class="card"><div class="head"><div><div class="title">Pagos</div><div class="stats"><b>1</b> vencido · <b>2</b> próx. 30 días</div></div><div class="actions"><div class="status">Necesita atención</div><button class="all" onclick="markAll()">Marcar todos como leídos</button></div></div>
<div id="items">
<div class="item"><div class="row"><div><strong>Pago vencido</strong><small>Luz &amp; Sal Fotografía · 800,00 € · 12 sept</small></div><button class="read" onclick="mark(this)">Marcar como leído</button></div></div>
<div class="item"><div class="row"><div><strong>Próximo pago</strong><small>Finca Los Olivos · 4.500,00 € · en 21 días</small></div><button class="read" onclick="mark(this)">Marcar como leído</button></div></div>
<div class="item"><div class="row"><div><strong>6 saldos sin programar</strong><small>16.400,00 € pendientes de programar</small></div><button class="read" onclick="mark(this)">Marcar como leído</button></div></div>
</div><button class="open">Abrir Pagos →</button></section></main>
<script>function mark(b){b.textContent='Leído';b.classList.add('done')}function markAll(){document.querySelectorAll('.read').forEach(mark)}</script></body></html>
