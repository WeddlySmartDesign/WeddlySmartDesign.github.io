<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weddly Smart Design · RSVP</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f5f1ea;color:#2c2a26;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{overflow:hidden}.desktopShell{display:none;width:100%;height:100%;flex-direction:column}.desktopShell.on{display:flex}.bar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #ddd5c8;min-height:68px}.back{border:0;border-radius:13px;padding:13px 15px;background:#eee8df;color:#2c2a26;font-weight:750;font-size:15px;cursor:pointer}.title{text-align:center}.title b{display:block;font-size:16px}.title small{display:block;color:#706b65;font-size:12px;margin-top:2px}.spacer{width:88px}.frame{display:block;flex:1;width:100%;border:0;background:#f5f1ea}
</style>
</head>
<body>
<div id="desktopShell" class="desktopShell">
  <div class="bar"><button id="back" class="back">← Volver</button><div class="title"><b>RSVP</b><small>Formulario · envíos · respuestas</small></div><span class="spacer"></span></div>
  <iframe id="frame" class="frame" title="RSVP"></iframe>
</div>
<script>
(()=>{
  const q=new URLSearchParams(location.search),publicMode=q.get('guest')==='1'||q.has('t'),desktop=matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(publicMode||!desktop){location.replace('guests-rsvp-v105-mobile.html'+location.search+location.hash);return}
  const shell=document.getElementById('desktopShell'),frame=document.getElementById('frame'),GKEY='weddly_guests_qa_v67',TOKEN_KEY='weddly_shared_wedding_token',FALLBACK='guests-v114-integrated.html?v=131#invitados';
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  shell.classList.add('on');
  frame.src='guests-rsvp-v105-mobile.html?v=131-desktop-direct';
  document.getElementById('back').onclick=e=>{e.preventDefault();if(history.length>1)history.back();else location.replace(FALLBACK)};
  function localGuests(){try{const s=JSON.parse(localStorage.getItem(GKEY))||{};return Object.entries(s.guests||{}).map(([id,g])=>({id,...g}))}catch{return[]}}
  function hasSharedAccess(){try{return(localStorage.getItem(TOKEN_KEY)||'').length>20}catch{return false}}
  function renderLocal(d){const gs=localGuests(),confirmed=gs.filter(g=>g.rsvp==='confirmed').length,declined=gs.filter(g=>g.rsvp==='declined').length,pending=gs.length-confirmed-declined,fb=d.getElementById('adminFb');if(fb){fb.className='feedback on';fb.style.background='#f7f3ed';fb.style.color='#625b54';fb.innerHTML='<b>Este PC está en modo local.</b><br>La lista de invitados se carga correctamente. Las respuestas online aparecerán cuando este navegador tenga acceso compartido a la boda.'}const metrics=d.getElementById('metrics');if(metrics)metrics.innerHTML=`<div class="metrics"><div class="metric"><b>${gs.length}</b><div class="small">invitados</div></div><div class="metric"><b>${confirmed}</b><div class="small">confirmados</div></div><div class="metric"><b>${pending}</b><div class="small">pendientes</div></div></div>`;const notice=d.querySelector('.notice');if(notice)notice.innerHTML='<b>Vista de escritorio</b><br>Estás viendo la información guardada en este navegador.';const recipients=d.getElementById('recipients');if(recipients)recipients.innerHTML=gs.map(g=>{const status=g.rsvp==='confirmed'?'Confirmado':g.rsvp==='declined'?'No asiste':'Pendiente',contact=g.phone||g.email||'Sin contacto',meta=[status,g.table||'Sin mesa',g.meal||''].filter(Boolean).join(' · ');return`<div class="recipient"><div class="rhead"><div><b>${esc(g.name||'Sin nombre')}</b><div class="contactline">${esc(contact)}</div></div></div><span class="chip ${g.rsvp==='confirmed'?'ok':''}">${esc(meta)}</span></div>`}).join('')||'<p class="small">Aún no hay invitados en este navegador.</p>'}
  function patch(){try{const d=frame.contentDocument;if(!d)return;const innerBack=d.querySelector('.back');if(innerBack)innerBack.style.display='none';if(hasSharedAccess())return;const tabSend=d.getElementById('tabSend'),refresh=d.getElementById('refresh'),showLocal=e=>{if(e){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation?.()}d.getElementById('tabForm')?.classList.remove('on');tabSend?.classList.add('on');d.getElementById('paneForm')?.classList.remove('on');d.getElementById('paneSend')?.classList.add('on');renderLocal(d)};if(tabSend&&!tabSend.dataset.desktopLocal){tabSend.dataset.desktopLocal='1';tabSend.addEventListener('click',showLocal,true)}if(refresh&&!refresh.dataset.desktopLocal){refresh.dataset.desktopLocal='1';refresh.addEventListener('click',showLocal,true)}}catch(e){console.warn('RSVP desktop direct',e)}}
  frame.addEventListener('load',()=>{patch();setTimeout(patch,80)});
})();
</script>
</body>
</html>
