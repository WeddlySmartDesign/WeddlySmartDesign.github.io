<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weddly Smart Design · RSVP</title>
</head>
<body>
<script>
(()=>{
  const q=new URLSearchParams(location.search);
  const publicMode=q.get('guest')==='1'||q.has('t');
  const desktop=matchMedia('(hover:hover) and (pointer:fine)').matches;
  const target=(publicMode||!desktop)
    ? 'guests-rsvp-v105-mobile.html'
    : 'guests-rsvp-desktop-v130.html';
  location.replace(target+location.search+location.hash);
})();
</script>
</body>
</html>
