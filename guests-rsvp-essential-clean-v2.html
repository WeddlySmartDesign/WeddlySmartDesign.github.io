00}.footer{left:23%;top:98.65%;width:54%;height:1.2%;font-size:1.35cqw}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:100}.modal.on{display:flex}.modalPanel{width:min(100%,620px);height:min(92vh,860px);margin:auto;background:#f5f1ea;border-radius:24px 24px 0 0;overflow:hidden}.modalHead{height:60px;background:white;border-bottom:1px solid #ddd5c8;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:800}.modalHead button{border:0;width:40px;height:40px;border-radius:50%;background:#eee8df;font-size:22px}.modal iframe{width:100%;height:calc(100% - 60px);border:0}.adminTop{position:sticky;top:0;z-index:20;background:white;border-bottom:1px solid #ddd5c8;padding:11px 14px;display:flex;gap:12px;align-items:center}.adminTop button{border:0;border-radius:15px;background:#eee8df;padding:11px 14px;font-weight:800}.adminTop b{display:block;font-size:18px}.adminTop small{display:block;color:#726d67}.adminPage{width:min(100%,760px);margin:auto;padding:16px 12px 60px}.card{background:white;border:1px solid #dbd1c2;border-radius:24px;padding:16px;margin-bottom:18px}.cardHead{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.cardHead h2{margin:0;font:500 30px Georgia,serif}.cardHead p{margin:4px 0 0;color:#716c65;font-size:13px}.cardHead button{border:0;border-radius:14px;background:#2c2a26;color:white;padding:12px 14px;font-weight:800}.previewViewport{height:560px;border-radius:18px;overflow:hidden;background:#eee8df;border:1px solid #ddd1bf}.previewViewport iframe{width:100%;height:100%;border:0;pointer-events:none}.editorCard{background:white;border:1px solid #dbd1c2;border-radius:24px;overflow:hidden}.editorCard iframe{width:100%;min-height:1350px;border:0}@media(max-width:520px){.cardHead{display:block}.cardHead button{width:100%;margin-top:12px}.previewViewport{height:500px}}

<body>
<div id="public"><main class="invite"><div id="mount">Cargando invitación…</div></main></div>
<div id="admin"><header class="adminTop"><button id="back">← Volver</button><div><b>RSVP</b><small>Essential · diseño cerrado</small></div></header><main class="adminPage"><section class="card"><div class="cardHead"><div><h2>Essential</h2><p>Diseño aprobado + texto limpio. El RSVP sigue conectado a Guests.</p></div><button id="openPreview">Ver como invitado</button></div><div class="previewViewport"><iframe id="previewFrame"></iframe></div></section><section class="editorCard"><iframe id="adminFrame"></iframe></section></main></div>
<div class="modal" id="modal"><div class="modalPanel"><div class="modalHead"><span>Confirmación de asistencia</span><button id="closeModal">×</button></div><iframe id="rsvpFrame"></iframe></div></div>
<script>
(()=>{
const q=new URLSearchParams(location.search),PUBLIC=q.get('guest')==='1'||q.get('preview')==='1';const TOKEN=q.get('t')||'sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8';const PARTS=['full-000.b64','full-001.b64','full-002.b64','full-003.b64','full-004.b64','full-005.b64','full-006.b64','full-007.b64'].map(n=>'assets/essential-exact-v3/'+n+'?v=clean2');let art='';
async function loadArt(){const rs=await Promise.all(PARTS.map(u=>fetch(u,{cache:'no-store'})));if(rs.some(r=>!r.ok))throw Error('art');const txt=await Promise.all(rs.map(r=>r.text()));art='data:image/jpeg;base64,'+txt.join('').replace(/\s+/g,'');await new Promise((ok,fail)=>{const i=new Image();i.onload=()=>i.naturalWidth===587&&i.naturalHeight===1672?ok():fail();i.onerror=fail;i.src=art})}
function overlay(){return `<div class="layer"><div class="mask caps heroSub">Y NOS GUSTARÍA INVITARTE A NUESTRA BODA<br>¿TE APUNTAS?</div><div class="mask caps date">12 SEPTIEMBRE<br>2027</div><div class="mask caps time">18:00 H</div><div class="mask caps venue">FINCA LOS OLIVOS</div><div class="mask caps wait">¡TE ESPERAMOS!</div><div class="mask city">Murcia</div><div class="mask caps storyLabel">NUESTRA HISTORIA</div><div class="mask storyCopy">Hemos preparado este espacio para que tengas toda la información del día, sin perder el carácter de una invitación diseñada para nosotros.</div><div class="mask agTime a1">18:00</div><div class="mask agTime a2">19:00</div><div class="mask agTime a3">21:00</div><div class="mask agTime a4">00:00</div><div class="mask agPlace p1">FINCA LOS OLIVOS</div><div class="mask agPlace p2">JARDÍN NORTE</div><div class="mask agPlace p3">SALÓN PRINCIPAL</div><div class="mask agPlace p4">Hasta que el cuerpo<br>aguante</div><div class="mask caps whereLabel">DÓNDE</div><div class="mask place1">18:00 · FINCA LOS OLIVOS</div><div class="mask place2">19:00 · JARDÍN NORTE</div><div class="mask loc loc1">⌖ &nbsp; Ver ubicación</div><div class="mask loc loc2">⌖ &nbsp; Ver ubicación</div><div class="confirmPanel"></div><div class="mask caps confirmLabel">CONFIRMACIÓN</div><div class="mask script confirmTitle">¿Te apuntas?</div><div class="mask confirmLead">Nos hará mucha ilusión que formes parte de este día tan especial.</div><div class="fakeForm"><div class="fakeField">Nombre</div><div class="fakeField">Acompañante (opcional)</div><div class="fakeField wide">Alergias o necesidades (opcional)</div></div><div class="mask confirmBtn">Confirmar</div><div class="contactPanel"></div><div class="mask caps contactLabel">CONTACTO</div><div class="mask script contactTitle">Si tienes dudas</div><div class="mask contactLead">Puedes escribirnos o llamarnos. ¡Estaremos encantados de ayudarte!</div><div class="mask phone">☎ &nbsp; Ana · 600 123 123</div><div class="mask contactBtn">↗ &nbsp; Escríbenos</div><div class="mask caps footer">GRACIAS POR SER PARTE DE NUESTRA HISTORIA</div></div>`}
function guestUrl(){const u=new URL('guests-rsvp-essential-clean-v2.html',location.href);u.searchParams.set('guest','1');u.searchParams.set('t',TOKEN);u.searchParams.set('v','clean2');return u.toString()}
function openRSVP(){const g=q.get('g')||'';rsvpFrame.src='guests-rsvp-v105-mobile.html?guest=1&t='+encodeURIComponent(TOKEN)+(g?'&g='+encodeURIComponent(g):'')+'&embed=1&v=clean2-'+Date.now();modal.classList.add('on');document.body.style.overflow='hidden'}function closeRSVP(){modal.classList.remove('on');document.body.style.overflow='';setTimeout(()=>rsvpFrame.src='about:blank',150)}
function mount(){mountEl.innerHTML=`<div class="artWrap"><img class="art" src="${art}" alt="Invitación Essential">${overlay()}<div class="hotspots"><button id="locCeremony" class="hotspot" style="left:14%;top:72.8%;width:30%;height:3.5%"></button><button id="locParty" class="hotspot" style="left:55.5%;top:72.8%;width:30%;height:3.5%"></button><button id="confirmHot" class="hotspot" style="left:10%;top:75.8%;width:80%;height:13.8%"></button><button id="contactHot" class="hotspot" style="left:24%;top:89.1%;width:52%;height:8.3%"></button></div></div>`;locCeremony.onclick=()=>window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Finca Los Olivos Murcia'),'_blank');locParty.onclick=()=>window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('Jardín Norte Murcia'),'_blank');confirmHot.onclick=openRSVP;contactHot.onclick=()=>location.href='tel:600123123'}
async function publicMode(){document.body.className='public';window.mountEl=document.getElementById('mount');try{await loadArt();mount()}catch{mountEl.textContent='No se ha podido cargar la invitación.'}}
function adminMode(){document.body.className='admin';previewFrame.src=guestUrl()+'&preview=1';adminFrame.src='guests-rsvp-v105-mobile.html?v=clean2';openPreview.onclick=()=>window.open(guestUrl(),'_blank');back.onclick=()=>history.length>1?history.back():location.href='guests-personalized-functional-v5.html#invitados'}
closeModal.onclick=closeRSVP;modal.onclick=e=>{if(e.target===modal)closeRSVP()};PUBLIC?publicMode():adminMode();
})();
</script>
