<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><title>Invitación</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f4f0}#invite{width:100%;height:100%;border:0;display:block;background:#f6f4f0}</style></head><body><iframe id="invite" title="Invitación"></iframe><script>(()=>{const f=document.getElementById('invite'),q=location.search,hash=location.hash,sp=new URLSearchParams(q),target=(sp.get('u')?'guests-rsvp-v112-wedding-flex.html':sp.get('g')?'guests-rsvp-v113-single-flex.html':'guests-rsvp-v105-mobile.html')+q+hash;f.src='guests-rsvp-essential-live.html'+q+hash;let installed=null;function cleanText(d){try{const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT),xs=[];while(w.nextNode())xs.push(w.currentNode);for(const n of xs){const p=n.parentElement;if(!p||p.closest('script,style'))continue;if(/Weddly\s*Smart\s*Design/i.test(n.nodeValue||''))n.nodeValue=(n.nodeValue||'').replace(/WEDDLY\s*SMART\s*DESIGN(?:\s*·\s*(?:GUESTS|INVITADOS))?/gi,'').replace(/Weddly\s*Smart\s*Design(?:\s*·\s*(?:Guests|Invitados))?/gi,'').trim()}}catch{}}function rgb(s){const m=String(s||'').match(/rgba?\((\d+)[, ]+(\d+)[, ]+(\d+)(?:[, /]+([\d.]+))?\)/);return m?[+m[1],+m[2],+m[3],m[4]===undefined?1:+m[4]]:null}function lum(c){const a=c.slice(0,3).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*a[0]+.7152*a[1]+.0722*a[2]}function contrast(a,b){const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}function bgFor(el){for(let n=el;n&&n.nodeType===1;n=n.parentElement){const cs=n.ownerDocument.defaultView.getComputedStyle(n);if(cs.backgroundImage&&cs.backgroundImage!=='none')return{image:true,color:rgb(cs.backgroundColor)};const c=rgb(cs.backgroundColor);if(c&&c[3]>.92)return{image:false,color:c}}return{image:false,color:[255,255,255,1]}}function readable(d){try{for(const el of d.querySelectorAll('h1,h2,h3,h4,p,span,.script,.agenda-title,.caption,.kicker,.names,.cover-names,.historia-text')){if(!String(el.textContent||'').trim()||el.closest('button,a'))continue;const cs=d.defaultView.getComputedStyle(el),fg=rgb(cs.color);if(!fg)continue;const bg=bgFor(el);if(bg.image){el.style.setProperty('text-shadow','0 1px 3px rgba(0,0,0,.48)','important');continue}if(contrast(fg,bg.color)<3.8){const dark=[44,42,38,1],light=[255,255,255,1],pick=contrast(dark,bg.color)>=contrast(light,bg.color)?'#2c2a26':'#fff';el.style.setProperty('color',pick,'important')}}}catch{}}function patch(){try{const d=f.contentDocument;if(!d?.body)return;d.title='Invitación';d.querySelectorAll('#brand,.brand,.pill,.weddly-extra-events').forEach(x=>x.remove());const nav=d.querySelector('.nav');if(nav)nav.style.justifyContent='flex-end';cleanText(d);readable(d);const cta=d.getElementById('ctaBtn');if(cta)cta.href=target;if(installed!==d){installed=d;d.addEventListener('click',e=>{const el=e.target?.closest?.('#ctaBtn,#menuBtn');if(!el)return;e.preventDefault();e.stopImmediatePropagation();location.assign(target)},true)}}catch{}}f.addEventListener('load',()=>{setTimeout(patch,20);setTimeout(patch,180);setTimeout(patch,600)});setInterval(patch,700)})();</script></body></html>
