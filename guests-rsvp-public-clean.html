<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><title>Invitación</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f4f0}#invite{width:100%;height:100%;border:0;display:block;background:#f6f4f0}</style></head><body><iframe id="invite" title="Invitación"></iframe><script>(()=>{const f=document.getElementById('invite'),q=location.search,hash=location.hash,target='guests-rsvp-v111-wedding-only.html'+q+hash;f.src='guests-rsvp-essential-live.html'+q+hash;let installed=null;function cleanText(d){try{const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);const xs=[];while(w.nextNode())xs.push(w.currentNode);for(const n of xs){const p=n.parentElement;if(!p||p.closest('script,style'))continue;if(/Weddly\s*Smart\s*Design/i.test(n.nodeValue||''))n.nodeValue=(n.nodeValue||'').replace(/WEDDLY\s*SMART\s*DESIGN(?:\s*·\s*(?:GUESTS|INVITADOS))?/gi,'').replace(/Weddly\s*Smart\s*Design(?:\s*·\s*(?:Guests|Invitados))?/gi,'').trim()}}catch{}}function patch(){try{const d=f.contentDocument;if(!d?.body)return;d.title='Invitación';d.querySelectorAll('#brand,.brand,.pill,.weddly-extra-events').forEach(x=>x.remove());const nav=d.querySelector('.nav');if(nav)nav.style.justifyContent='flex-end';cleanText(d);const cta=d.getElementById('ctaBtn');if(cta)cta.href=target;if(installed!==d){installed=d;d.addEventListener('click',e=>{const el=e.target?.closest?.('#ctaBtn,#menuBtn');if(!el)return;e.preventDefault();e.stopImmediatePropagation();location.assign(target)},true)}}catch{}}f.addEventListener('load',()=>{setTimeout(patch,20);setTimeout(patch,180);setTimeout(patch,600)});setInterval(patch,400)})();</script></body></html>
