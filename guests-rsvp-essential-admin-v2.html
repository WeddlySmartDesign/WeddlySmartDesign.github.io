<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weddly Smart Design · RSVP Essential</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#f5f1ea;color:#2c2a26;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{min-height:100vh}.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ddd5c8;display:flex;align-items:center;gap:12px;padding:12px 18px}.back{border:0;border-radius:14px;background:#eee8df;color:#2c2a26;padding:12px 16px;font-weight:800;font-size:16px}.topcopy b{display:block;font-size:18px}.topcopy small{display:block;color:#706b65;margin-top:2px}.page{max-width:1160px;margin:auto;padding:24px 22px 60px}.designCard{background:#fff;border:1px solid #d9cfbf;border-radius:26px;padding:22px;margin-bottom:22px;box-shadow:0 8px 28px rgba(70,55,35,.04)}.ey{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:#866329}.designHead{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}.designHead h2{font:500 38px Georgia,serif;margin:8px 0 6px}.designHead p{color:#706b65;line-height:1.5;margin:0;max-width:680px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;padding:13px 17px;font-weight:800;font-size:15px;cursor:pointer}.btn.primary{background:#2c2a26;color:#fff}.previewShell{background:#e8e1d6;border-radius:22px;padding:14px;overflow:hidden}.previewViewport{height:560px;border-radius:16px;overflow:hidden;background:#f3eee5;border:1px solid #d7c9b4}.previewViewport iframe{width:100%;height:100%;border:0;display:block;background:#f3eee5;pointer-events:none}.formShell iframe{width:100%;border:0;display:block;background:#f5f1ea;min-height:900px}@media(max-width:760px){.page{padding:16px 12px 44px}.designCard{padding:16px;border-radius:20px}.designHead{display:block}.designHead h2{font-size:30px}.actions{margin-top:14px}.previewViewport{height:500px}.topbar{padding:10px 12px}.back{padding:10px 12px}.topcopy b{font-size:16px}}
</style>
</head>
<body>
<header class="topbar"><button id="back" class="back">← Volver</button><div class="topcopy"><b>RSVP</b><small>Essential · papelería conectada</small></div></header>
<main class="page">
  <section class="designCard">
    <div class="designHead">
      <div><div class="ey">DISEÑO ESSENTIAL ACTIVO</div><h2>Papelería romántica</h2><p>La invitación visual es independiente del formulario. Aquí ves el diseño real que recibirá el invitado; las preguntas y respuestas siguen siendo las de Guests.</p></div>
      <div class="actions"><button id="openPreview" class="btn primary">Ver como invitado</button></div>
    </div>
    <div class="previewShell"><div class="previewViewport"><iframe id="designPreview" title="Vista previa de la invitación"></iframe></div></div>
  </section>
  <section class="formShell"><iframe id="formFrame" title="Configuración RSVP"></iframe></section>
</main>
<script>
(()=>{
  const PT='sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8';
  const publicUrl=()=>`guests-rsvp-essential-fixed-v1.html?guest=1&t=${encodeURIComponent(PT)}&preview=1&v=fixed1`;
  const preview=document.getElementById('designPreview'),form=document.getElementById('formFrame');
  preview.src=publicUrl();
  form.src='guests-rsvp-v105-mobile.html?v=essential-admin-fixed1';
  document.getElementById('openPreview').onclick=()=>{window.open(publicUrl().replace('&preview=1',''),'_blank','noopener')};
  document.getElementById('back').onclick=()=>{if(history.length>1)history.back();else location.href='guests-personalized-functional-v5.html#invitados'};
  function patchForm(){try{const d=form.contentDocument;if(!d)return;const back=d.querySelector('.back'),brand=d.querySelector('.brand'),h1=d.querySelector('h1');if(back)back.style.display='none';if(brand)brand.style.display='none';if(h1)h1.style.display='none';const wrap=d.querySelector('.wrap');if(wrap){wrap.style.maxWidth='none';wrap.style.padding='0 0 70px'}const prev=d.getElementById('preview');if(prev&&!prev.dataset.paper){prev.dataset.paper='1';prev.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();window.open(publicUrl().replace('&preview=1',''),'_blank','noopener')},true)}const save=d.getElementById('saveConfig');if(save&&!save.dataset.paper){save.dataset.paper='1';save.addEventListener('click',()=>setTimeout(()=>{preview.src=publicUrl()+'&r='+Date.now()},1000))}const ro=new ResizeObserver(()=>{try{form.style.height=Math.max(900,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch{}});ro.observe(d.body);form.style.height=Math.max(900,d.documentElement.scrollHeight,d.body.scrollHeight)+'px'}catch(e){console.warn(e)}}
  form.addEventListener('load',()=>{patchForm();setTimeout(patchForm,120);setTimeout(patchForm,600)});
})();
</script>
</body>
</html>
