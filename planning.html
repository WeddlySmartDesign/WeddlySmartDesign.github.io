function allTasks(){const id=identity(),wed=parseDate(id.date),sg=signals();const defaults=DEFAULTS.map(d=>{const o=state.tasks[d.id]||{};return{...d,title:d[lang()],custom:false,status:o.status||'open',owner:o.owner||'both',notes:o.notes||'',due:o.due||defaultDue(d,wed),manualDue:!!o.due,updatedAt:o.updatedAt||'',signalOn:!!(d.signal&&sg[d.signal])}});const custom=Object.entries(state.tasks).filter(([k,v])=>v?.custom).map(([k,v])=>({id:k,cat:v.cat||'foundation',title:v.title||'',custom:true,status:v.status||'open',owner:v.owner||'both',notes:v.notes||'',due:v.due||'',manualDue:true,updatedAt:v.updatedAt||'',priority:Number(v.priority||2),signalOn:false}));return [...defaults,...custom]}
function readLocal(){try{const x=JSON.parse(localStorage.getItem(localKey())||'null');if(x?.state&&typeof x.state==='object'){state=x.state;version=Number(x.version||0)}else if(x?.tasks){state=x;version=0}}catch{}}function writeLocal(dirty=true){state.updatedAt=new Date().toISOString();try{localStorage.setItem(localKey(),JSON.stringify({state,version,dirty}))}catch{}if(dirty)queueSync()}function headers(){const h={'Content-Type':'application/json','x-weddly-token':localStorage.getItem(TOKEN)||''};if(mode())h['x-weddly-demo']=mode();return h}function mergeStates(a,b){const out={schema:1,tasks:{},updatedAt:new Date(Math.max(Date.parse(a?.updatedAt||0)||0,Date.parse(b?.updatedAt||0)||0)).toISOString()};const keys=new Set([...Object.keys(a?.tasks||{}),...Object.keys(b?.tasks||{})]);for(const k of keys){const x=a?.tasks?.[k],y=b?.tasks?.[k];if(!x)out.tasks[k]=y;else if(!y)out.tasks[k]=x;else out.tasks[k]=(Date.parse(x.updatedAt||0)||0)>=(Date.parse(y.updatedAt||0)||0)?x:y}return out}function setSync(kind){$('syncDot').className='dot'+(kind==='busy'?' busy':kind==='err'?' err':'');$('syncText').textContent=kind==='busy'?t('saving'):kind==='err'?t('offline'):t('synced')}
async function loadRemote(){setSync('busy');try{const r=await fetch(API,{headers:headers(),cache:'no-store'});const x=await r.json().catch(()=>({}));if(r.status===401||r.status===403){showAccess();return false}if(!r.ok||!x.ok)throw 0;const localWrap=(()=>{try{return JSON.parse(localStorage.getItem(localKey())||'null')}catch{return null}})();const localDirty=!!localWrap?.dirty;const remote=x.state;version=Number(x.version||0);if(remote){state=localDirty?mergeStates(state,remote):remote;writeLocal(localDirty);if(localDirty)await syncNow()}else{if(!state?.tasks)state={schema:1,tasks:{},updatedAt:new Date().toISOString()};await syncNow()}setSync('ok');return true}catch{showConnection();return false}}function queueSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,450)}async function syncNow(){if(syncing||!ready)return;syncing=true;setSync('busy');try{let r=await fetch(API,{method:'PUT',headers:headers(),body:JSON.stringify({state,version}),cache:'no-store'}),x=await r.json().catch(()=>({}));if(r.status===401||r.status===403){showAccess();return}if(r.status===409&&x?.server){state=mergeStates(state,x.server.state||{});version=Number(x.server.version||0);r=await fetch(API,{method:'PUT',headers:headers(),body:JSON.stringify({state,version}),cache:'no-store'});x=await r.json().catch(()=>({}))}if(!r.ok||!x.ok)throw 0;version=Number(x.version||version);try{localStorage.setItem(localKey(),JSON.stringify({state,version,dirty:false}))}catch{}setSync('ok')}catch{setSync('err')}finally{syncing=false;render()}}function showAccess(){ready=false;$('accessTitle').textContent='Planning';$('accessText').textContent=t('access');$('access').classList.add('on');$('app').hidden=true;$('add').hidden=true}function showConnection(){ready=false;$('accessTitle').textContent='Planning';$('accessText').textContent=lang()==='es'?'Necesitamos conexión para validar este acceso y sincronizar Planning. Comprueba la conexión y vuelve a abrirlo.':'A connection is required to validate access and sync Planning. Check your connection and reopen it.';$('access').classList.add('on');$('app').hidden=true;$('add').hidden=true}
function setTask(id,patch){const now=new Date().toISOString(),base=state.tasks[id]||{};state.tasks[id]={...base,...patch,updatedAt:now};writeLocal(true);render()}function toggleDone(id){const task=allTasks().find(x=>x.id===id);if(!task)return;setTask(id,{status:task.status==='done'?'open':'done'})}function ownerLabel(v){const i=identity();if(v==='p1')return i.p1||t('unassigned');if(v==='p2')return i.p2||t('unassigned');return t('both')}function catLabel(c){return CATS[c]?.[lang()]||c}function dueInfo(task){if(task.status==='done')return{txt:t('complete'),cls:''};if(!task.due)return{txt:t('setDate'),cls:''};const d=parseDate(task.due),n=diffDays(d,today());if(n<0)return{txt:t('daysLate',{n:Math.abs(n)}),cls:'late'};if(n===0)return{txt:t('todayDue'),cls:''};return{txt:t('daysLeft',{n}),cls:''}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function taskHtml(task){const di=dueInfo(task),signal=task.signalOn?`<span class="tag signal">${task.signal==='payments'?t('detectedPayments'):task.signal==='seating'?t('detectedSeating'):t('detectedGuests')}</span>`:'';return `<article class="task ${task.status==='na'?'na':''} ${task.status==='open'&&task.due&&diffDays(parseDate(task.due),today())<0?'overdue':''}" data-id="${task.id}"><button class="check ${task.status==='done'?'done':''}" data-act="check" aria-label="${t('complete')}"></button><div><div class="taskTitle">${esc(task.title)}</div><div class="taskMeta"><span class="tag ${di.cls}">${esc(di.txt)}</span><span class="tag">${esc(catLabel(task.cat))}</span><span class="tag">${esc(ownerLabel(task.owner))}</span>${signal}</div></div><button class="more" data-act="edit" aria-label="${t('editTask')}">···</button></article>`}function sortOpen(arr){return arr.slice().sort((a,b)=>{const ad=a.due?parseDate(a.due)?.getTime()||9e15:9e15,bd=b.due?parseDate(b.due)?.getTime()||9e15:9e15;if(ad!==bd)return ad-bd;return (b.priority||0)-(a.priority||0)})}
function renderNow(tasks){const open=sortOpen(tasks.filter(x=>x.status==='open')),todayD=today();const focus=open.filter(x=>x.due&&diffDays(parseDate(x.due),todayD)<=14).slice(0,6);const coming=open.filter(x=>x.due&&diffDays(parseDate(x.due),todayD)>14&&diffDays(parseDate(x.due),todayD)<=30).slice(0,6);const future=open.filter(x=>!x.due||diffDays(parseDate(x.due),todayD)>30).slice(0,4);$('viewNow').innerHTML=`<div class="sectionHead"><div><h2>${t('priority')}</h2><span>${t('prioritySub')}</span></div><span>${focus.length}</span></div><div class="focus">${focus.length?focus.map(taskHtml).join(''):`<div class="empty">${t('nothing')}</div>`}</div>${coming.length?`<div class="sectionHead"><div><h2>${t('coming')}</h2><span>${t('comingSub')}</span></div><span>${coming.length}</span></div><div class="focus">${coming.map(taskHtml).join('')}</div>`:''}${future.length?`<div class="sectionHead"><div><h2>${t('notYet')}</h2><span>${t('notYetSub')}</span></div></div><div class="focus">${future.map(taskHtml).join('')}</div>`:''}`}function renderTimeline(tasks){const cats=['all',...Object.keys(CATS)];const filterHtml=cats.map(c=>`<button class="filter ${categoryFilter===c?'on':''}" data-filter="${c}">${c==='all'?t('all'):catLabel(c)}</button>`).join('');let rows=tasks.filter(x=>categoryFilter==='all'||x.cat===categoryFilter);rows=sortOpen(rows);const groups=new Map();for(const x of rows){let key=x.status==='done'?t('completed'):x.status==='na'?t('noApplicable'):(x.due?new Intl.DateTimeFormat(lang()==='es'?'es-ES':'en-GB',{month:'long',year:'numeric'}).format(parseDate(x.due)):t('setDate'));if(!groups.has(key))groups.set(key,[]);groups.get(key).push(x)}$('viewTimeline').innerHTML=`<div class="filters">${filterHtml}</div>${[...groups].map(([k,v])=>`<div class="month">${esc(k)}</div><div class="focus">${v.map(taskHtml).join('')}</div>`).join('')}`}function renderProgress(tasks){const applicable=tasks.filter(x=>x.status!=='na'),done=applicable.filter(x=>x.status==='done').length,total=applicable.length;const cats=Object.keys(CATS).map(c=>{const a=applicable.filter(x=>x.cat===c),d=a.filter(x=>x.status==='done').length,p=a.length?Math.round(d/a.length*100):0;return `<div class="progressCard"><div class="progressTop"><span>${esc(catLabel(c))}</span><span>${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div><div class="progressNote">${t('doneOf',{a:d,b:a.length})}</div></div>`}).join('');$('viewProgress').innerHTML=`<div class="sectionHead"><div><h2>${t('progressTitle')}</h2><span>${t('progressSub')}</span></div><span>${total?Math.round(done/total*100):0}%</span></div>${cats}`}
function renderHero(tasks){const id=identity(),wed=parseDate(id.date),td=today();document.documentElement.dataset.theme=theme();document.documentElement.lang=lang();$('eyebrow').textContent=t('eyebrow');if(wed){const n=diffDays(wed,td);$('countdown').childNodes[0].nodeValue=n>0?`${n} ${n===1?t('day'):t('days')}`:n===0?t('today'):t('past');$('countLabel').textContent=n>0?t('until'):'';$('datePill').textContent=new Intl.DateTimeFormat(lang()==='es'?'es-ES':'en-GB',{day:'numeric',month:'short',year:'numeric'}).format(wed);$('dateMissing').hidden=true}else{$('countdown').childNodes[0].nodeValue='—';$('countLabel').textContent=t('until');$('datePill').textContent=t('noDate');$('dateMissing').hidden=false;$('dateMissing').textContent=t('missing')}const app=tasks.filter(x=>x.status!=='na'),done=app.filter(x=>x.status==='done').length,open=tasks.filter(x=>x.status==='open'),over=open.filter(x=>x.due&&diffDays(parseDate(x.due),td)<0).length,next=open.filter(x=>x.due&&diffDays(parseDate(x.due),td)>=0&&diffDays(parseDate(x.due),td)<=30).length;$('heroLead').textContent=t('hero');$('heroSub').textContent=t('heroSub');$('mOver').textContent=over;$('mNext').textContent=next;$('mDone').textContent=(app.length?Math.round(done/app.length*100):0)+'%';$('mOverLabel').textContent=t('over');$('mNextLabel').textContent=t('next');$('mDoneLabel').textContent=t('done')}
function render(){if(!ready)return;const tasks=allTasks();renderHero(tasks);document.querySelector('[data-view="now"]').textContent=t('now');document.querySelector('[data-view="timeline"]').textContent=t('timeline');document.querySelector('[data-view="progress"]').textContent=t('progress');$('add').textContent=t('add');renderNow(tasks);renderTimeline(tasks);renderProgress(tasks);$('viewNow').hidden=activeView!=='now';$('viewTimeline').hidden=activeView!=='timeline';$('viewProgress').hidden=activeView!=='progress';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.view===activeView));bindTasks()}function bindTasks(){document.querySelectorAll('.task').forEach(el=>el.onclick=e=>{const id=el.dataset.id,a=e.target.closest('[data-act]')?.dataset.act;if(a==='check'){e.stopPropagation();toggleDone(id)}else openSheet(id)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{categoryFilter=b.dataset.filter;render()})}function ownerOptions(selected='both'){const i=identity(),opts=[['both',t('both')],['p1',i.p1||'Persona 1'],['p2',i.p2||'Persona 2']];$('fOwner').innerHTML=opts.map(([v,l])=>`<option value="${v}" ${v===selected?'selected':''}>${esc(l)}</option>`).join('')}function catOptions(selected='foundation'){$('fCategory').innerHTML=Object.keys(CATS).map(v=>`<option value="${v}" ${v===selected?'selected':''}>${esc(catLabel(v))}</option>`).join('')}function openSheet(id=''){editingId=id;const task=id?allTasks().find(x=>x.id===id):null;$('sheetTitle').textContent=task?t('editTask'):t('newTask');$('fTitle').value=task?.title||'';$('fDue').value=task?.due||'';ownerOptions(task?.owner||'both');catOptions(task?.cat||'foundation');$('fNotes').value=task?.notes||'';$('lTitle').textContent=t('task');$('lDue').textContent=t('due');$('lOwner').textContent=t('responsible');$('lCategory').textContent=t('category');$('lNotes').textContent=t('notes');$('saveBtn').textContent=t('save');$('closeBtn').textContent=t('close');$('naBtn').textContent=task?.status==='na'?t('restore'):t('na');$('naBtn').hidden=!task;$('deleteBtn').textContent=t('delete');$('deleteBtn').hidden=!task?.custom;$('backdrop').classList.add('on');$('sheet').classList.add('on');setTimeout(()=>$('fTitle').focus(),80)}function closeSheet(){$('backdrop').classList.remove('on');$('sheet').classList.remove('on');editingId=''}
$('taskForm').onsubmit=e=>{e.preventDefault();const title=$('fTitle').value.trim();if(!title)return;if(editingId){const task=allTasks().find(x=>x.id===editingId);setTask(editingId,{...(task?.custom?{custom:true,title}:{}),due:$('fDue').value||'',owner:$('fOwner').value,cat:$('fCategory').value,notes:$('fNotes').value.trim()})}else{const id='c_'+crypto.randomUUID();state.tasks[id]={custom:true,title,due:$('fDue').value||'',owner:$('fOwner').value,cat:$('fCategory').value,notes:$('fNotes').value.trim(),status:'open',priority:2,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};writeLocal(true);render()}closeSheet()};$('naBtn').onclick=()=>{if(!editingId)return;const task=allTasks().find(x=>x.id===editingId);setTask(editingId,{status:task?.status==='na'?'open':'na'});closeSheet()};$('deleteBtn').onclick=()=>{if(!editingId)return;const task=allTasks().find(x=>x.id===editingId);if(!task?.custom||!confirm(t('confirmDelete')))return;delete state.tasks[editingId];writeLocal(true);render();closeSheet()};$('closeBtn').onclick=closeSheet;$('backdrop').onclick=closeSheet;$('add').onclick=()=>openSheet('');document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{activeView=b.dataset.view;render()});
async function init(){readLocal();document.documentElement.dataset.theme=theme();const ok=await loadRemote();if(!ok)return;ready=true;$('access').classList.remove('on');$('app').hidden=false;$('add').hidden=false;setSync('ok');render();setInterval(()=>{const th=theme();if(document.documentElement.dataset.theme!==th)document.documentElement.dataset.theme=th;render()},30000);addEventListener('storage',e=>{if([PAY,GUEST,THEME1,THEME2,'weddly_owner_demo_mode'].some(k=>e.key?.startsWith(k)))render()})}init();
