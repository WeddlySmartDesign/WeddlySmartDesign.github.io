<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Entrega GUEST · WeddlySmartDesign</title><style>body{margin:0;background:#f7eee5;color:#433d3b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.w{max-width:560px;margin:auto;padding:48px 20px}.b{font-weight:850;letter-spacing:.08em}.c{margin-top:48px;background:#fff;border:1px solid rgba(67,61,59,.14);border-radius:22px;padding:24px}h1{font:400 32px/1.05 Georgia,serif}p{line-height:1.55;color:#756963}button{width:100%;min-height:52px;border:0;border-radius:13px;background:#433d3b;color:#fff;font-weight:800;font-size:15px}button:disabled{opacity:.45}.ok{color:#667055}.err{color:#9a4537}</style></head><body><main class="w"><div class="b">GUEST · WeddlySmartDesign</div><section class="c"><h1>Entregar acceso a la pareja</h1><p>Usa este botón únicamente cuando la invitación de este pedido esté preparada. El acceso se enviará al email del comprador.</p><button id="send">Enviar acceso GUEST</button><p id="msg"></p></section></main><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/guest-stripe-checkout',q=new URLSearchParams(location.search),sessionId=q.get('session_id')||'',operatorToken=q.get('token')||'',b=document.getElementById('send'),m=document.getElementById('msg');if(!sessionId||!operatorToken){b.disabled=true;m.className='err';m.textContent='Este enlace de entrega no es válido.'}b.onclick=async()=>{b.disabled=true;m.className='';m.textContent='Enviando…';try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'deliver',sessionId,operatorToken}),cache:'no-store'}),x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||'delivery_failed');m.className='ok';m.textContent=x.alreadyDelivered?'Este acceso ya había sido entregado.':'Acceso enviado correctamente a '+x.email+'.';b.textContent='Entrega completada'}catch(e){m.className='err';m.textContent=e.message==='invalid_delivery_token'?'El enlace de entrega no es válido.':'No se ha podido enviar. No se ha cobrado nada; revisa el pedido antes de reintentar.';b.disabled=false}}})()</script></body></html>
