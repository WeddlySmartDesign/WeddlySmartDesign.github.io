<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Weddly Smart Design · Access</title>
<style>
:root{--ink:#2C2A26;--sage:#6E7A5C;--sage-dark:#525C43;--paper:#FBF8F3;--line:#E4DED2;--muted:#736F63;--danger:#B5563F}
*{box-sizing:border-box}body{margin:0;background:#F2EFE9;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;max-width:600px;margin:0 auto;background:var(--paper);padding:calc(32px + env(safe-area-inset-top)) 24px calc(36px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.brand{font-family:Georgia,serif;color:var(--sage-dark);font-size:34px;line-height:.9}.brand span{display:block;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-top:9px;color:var(--muted);font-weight:650}.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:700;color:var(--muted)}.card{margin-top:72px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(44,42,38,.04)}h1{font-family:Georgia,serif;font-size:31px;font-weight:500;margin:0 0 10px}.lead{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 24px}.field{margin-bottom:16px}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}input{width:100%;padding:15px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:16px;text-transform:uppercase;letter-spacing:.04em}input.email{text-transform:none;letter-spacing:0}input:focus{outline:2px solid var(--sage);border-color:transparent}.btn{width:100%;border:0;border-radius:12px;padding:15px 16px;background:var(--ink);color:#fff;font-size:15px;font-weight:750;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.switch{width:100%;border:0;background:none;color:var(--sage-dark);font-size:13px;font-weight:700;padding:13px 4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}.msg{min-height:20px;margin-top:14px;font-size:13px;line-height:1.45;color:var(--muted)}.msg.err{color:var(--danger)}.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body><main class="shell"><div class="top"><div class="brand">Weddly<span>Smart Design</span></div><button id="lang" class="lang" type="button">EN</button></div><section class="card"><h1 id="title"></h1><p id="lead" class="lead"></p><div id="activateBox"><div id="codeMode"><div class="field"><label id="codeLabel" for="code"></label><input id="code" autocomplete="one-time-code" maxlength="80" spellcheck="false"></div><button id="activate" class="btn" type="button"></button><button id="etsySwitch" class="switch" type="button" style="display:none"></button></div><div id="etsyMode" style="display:none"><div class="field"><label id="orderLabel" for="order"></label><input id="order" inputmode="numeric" autocomplete="off" maxlength="30"></div><div class="field"><label id="emailLabel" for="email"></label><input id="email" class="email" type="email" autocomplete="email" maxlength="254"></div><button id="activateEtsy" class="btn" type="button"></button><button id="codeSwitch" class="switch" type="button"></button></div></div><div id="testerBox" style="display:none"><button id="activateTester" class="btn" type="button"></button></div><div id="inviteBox" style="display:none"><button id="join" class="btn" type="button"></button></div><div id="msg" class="msg" aria-live="polite"></div><div id="note" class="note"></div></section></main>
<script>
(()=>{
const ACCESS='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-access';
const TOKEN_KEY='weddly_shared_wedding_token';
const params=new URLSearchParams(location.search),invite=params.get('invite')||'';
const hashParams=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):location.hash),tester=hashParams.get('tester')||'';
const isInvite=!!invite,isTester=!!tester&&!isInvite;
const savedLang=localStorage.getItem('weddly_access_lang');
let lang=(savedLang==='es'||savedLang==='en')?savedLang:((navigator.language||'').toLowerCase().startsWith('es')?'es':'en'),mode='code',market={etsy:false,gumroad:false};
const copy={
 es:{activateTitle:'Activa tu boda',activateLead:'Introduce el código recibido con tu compra. Weddly Smart Design creará una única boda para vosotros.',code:'Código de acceso',codeGumroad:'Código de acceso / licencia Gumroad',activate:'Activar mi compra',etsySwitch:'Compré en Etsy',codeSwitch:'Tengo un código de acceso',etsyTitle:'Activa tu compra de Etsy',etsyLead:'Verificamos tu compra directamente con Etsy. Usa el número de pedido y el email con el que compraste.',order:'Número de pedido de Etsy',email:'Email de compra',activateEtsy:'Verificar y activar',testerTitle:'Tu acceso gratuito a Weddly',testerLead:'Te hemos dado acceso completo y permanente a Suppliers & Payments antes del lanzamiento. Es para esta boda y no es una prueba temporal.',activateTester:'Empezar mi acceso gratis',testerNote:'Una boda · hasta dos personas autorizadas. Podrás invitar a tu pareja desde dentro de la app.',testerUsed:'Este acceso gratuito ya se ha utilizado para crear una boda.',inviteTitle:'Te han invitado a una boda',inviteLead:'Esta invitación te da acceso como segunda persona autorizada. Solo puede utilizarse una vez.',join:'Unirme a esta boda',busy:'Un momento…',done:'Acceso listo. Abriendo vuestra boda…',note:'Tu acceso se guarda en este dispositivo. No compartas el código de compra ni esta invitación con otras personas.',etsyNote:'El pedido solo puede activar una boda. No guardamos tu contraseña de Etsy.',badLicense:'No encontramos una compra válida con esos datos.',used:'Esta compra ya se ha utilizado para crear una boda.',badInvite:'Esta invitación no es válida o ya se ha utilizado.',generic:'No hemos podido completar el acceso ahora. Inténtalo de nuevo.'},
 en:{activateTitle:'Activate your wedding',activateLead:'Enter the code included with your purchase. Weddly Smart Design will create one wedding workspace for you.',code:'Access code',codeGumroad:'Access code / Gumroad license key',activate:'Activate my purchase',etsySwitch:'I purchased on Etsy',codeSwitch:'I have an access code',etsyTitle:'Activate your Etsy purchase',etsyLead:'We verify your purchase directly with Etsy. Use your Etsy order number and the email used for the purchase.',order:'Etsy order number',email:'Purchase email',activateEtsy:'Verify and activate',testerTitle:'Your complimentary Weddly access',testerLead:"You've been given full, permanent access to Suppliers & Payments before launch. It's yours for this wedding — this is not a trial.",activateTester:'Start my free access',testerNote:'One wedding workspace · up to two authorised people. You can invite your partner from inside the app.',testerUsed:'This complimentary access has already been used to create a wedding.',inviteTitle:'You have been invited to a wedding',inviteLead:'This invitation gives you access as the second authorised person. It can only be used once.',join:'Join this wedding',busy:'One moment…',done:'Access ready. Opening your wedding…',note:'Your access is saved on this device. Do not share the purchase code or this invitation with anyone else.',etsyNote:'One order can activate one wedding. We never ask for or store your Etsy password.',badLicense:'We could not find a valid purchase with those details.',used:'This purchase has already been used to create a wedding.',badInvite:'This invitation is invalid or has already been used.',generic:'We could not complete access right now. Please try again.'}
};
const $=id=>document.getElementById(id),msg=$('msg');
function render(){const t=copy[lang];document.documentElement.lang=lang;$('lang').textContent=lang==='es'?'EN':'ES';$('activateBox').style.display=!isInvite&&!isTester?'block':'none';$('testerBox').style.display=isTester?'block':'none';$('inviteBox').style.display=isInvite?'block':'none';$('codeMode').style.display=!isInvite&&!isTester&&mode==='code'?'block':'none';$('etsyMode').style.display=!isInvite&&!isTester&&mode==='etsy'?'block':'none';$('title').textContent=isInvite?t.inviteTitle:(isTester?t.testerTitle:(mode==='etsy'?t.etsyTitle:t.activateTitle));$('lead').textContent=isInvite?t.inviteLead:(isTester?t.testerLead:(mode==='etsy'?t.etsyLead:t.activateLead));$('codeLabel').textContent=market.gumroad?t.codeGumroad:t.code;$('activate').textContent=t.activate;$('activateTester').textContent=t.activateTester;$('etsySwitch').textContent=t.etsySwitch;$('etsySwitch').style.display=market.etsy&&!isInvite&&!isTester?'block':'none';$('codeSwitch').textContent=t.codeSwitch;$('orderLabel').textContent=t.order;$('emailLabel').textContent=t.email;$('activateEtsy').textContent=t.activateEtsy;$('join').textContent=t.join;$('note').textContent=isTester?t.testerNote:(isInvite?t.note:(mode==='etsy'?t.etsyNote:t.note));$('code').placeholder='WSD-XXXX-XXXX-XXXX';}
function show(text,error=false){msg.textContent=text;msg.className='msg'+(error?' err':'')}
async function post(body){const r=await fetch(ACCESS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));return {status:r.status,body:j}}
function finish(token){localStorage.setItem(TOKEN_KEY,token);localStorage.removeItem('weddly_sync_base_v20');show(copy[lang].done);setTimeout(()=>location.replace('/'),450)}
async function loadMarket(){try{const r=await post({action:'marketplace_status'});if(r.status===200&&r.body?.ok){market={etsy:!!r.body.etsy,gumroad:!!r.body.gumroad};render()}}catch{}}
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';localStorage.setItem('weddly_access_lang',lang);render()};
$('etsySwitch').onclick=()=>{mode='etsy';show('');render();setTimeout(()=>$('order').focus(),50)};$('codeSwitch').onclick=()=>{mode='code';show('');render();setTimeout(()=>$('code').focus(),50)};
$('activate').onclick=async()=>{const code=$('code').value.trim();if(!code){show(copy[lang].badLicense,true);return}const b=$('activate');b.disabled=true;show(copy[lang].busy);try{const r=await post({action:'activate',activationCode:code});if(r.status===201&&r.body?.memberToken)return finish(r.body.memberToken);if(r.body?.error==='already_activated')show(copy[lang].used,true);else if(r.body?.error==='invalid_license'||r.body?.error==='license_inactive')show(copy[lang].badLicense,true);else show(copy[lang].generic,true)}catch{show(copy[lang].generic,true)}finally{b.disabled=false}};
$('activateTester').onclick=async()=>{const b=$('activateTester');b.disabled=true;show(copy[lang].busy);try{const r=await post({action:'activate',activationCode:tester});if(r.status===201&&r.body?.memberToken){history.replaceState(null,'',location.pathname);return finish(r.body.memberToken)}if(r.body?.error==='already_activated')show(copy[lang].testerUsed,true);else if(r.body?.error==='invalid_license'||r.body?.error==='license_inactive')show(copy[lang].badLicense,true);else show(copy[lang].generic,true)}catch{show(copy[lang].generic,true)}finally{b.disabled=false}};
$('activateEtsy').onclick=async()=>{const orderId=$('order').value.trim(),email=$('email').value.trim();if(!orderId||!email){show(copy[lang].badLicense,true);return}const b=$('activateEtsy');b.disabled=true;show(copy[lang].busy);try{const r=await post({action:'activate_etsy',orderId,email});if(r.status===201&&r.body?.memberToken)return finish(r.body.memberToken);if(r.body?.error==='already_activated')show(copy[lang].used,true);else if(r.body?.error==='invalid_license'||r.body?.error==='license_inactive')show(copy[lang].badLicense,true);else show(copy[lang].generic,true)}catch{show(copy[lang].generic,true)}finally{b.disabled=false}};
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')$('activate').click()});$('order').addEventListener('keydown',e=>{if(e.key==='Enter')$('email').focus()});$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('activateEtsy').click()});
$('join').onclick=async()=>{const b=$('join');b.disabled=true;show(copy[lang].busy);try{const r=await post({action:'join',inviteCode:invite});if(r.status===201&&r.body?.memberToken){history.replaceState(null,'',location.pathname);return finish(r.body.memberToken)}show(copy[lang].badInvite,true)}catch{show(copy[lang].generic,true)}finally{b.disabled=false}};
render();if(!isInvite&&!isTester)loadMarket();
})();
</script></body></html>
