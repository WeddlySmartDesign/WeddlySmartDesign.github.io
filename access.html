<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Weddly Smart Design · Access</title>
<style>
:root{--ink:#2C2A26;--sage:#6E7A5C;--sage-dark:#525C43;--paper:#FBF8F3;--line:#E4DED2;--muted:#736F63;--danger:#B5563F}
*{box-sizing:border-box}body{margin:0;background:#F2EFE9;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;max-width:600px;margin:0 auto;background:var(--paper);padding:calc(32px + env(safe-area-inset-top)) 24px calc(36px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.brand{font-family:Georgia,serif;color:var(--sage-dark);font-size:34px;line-height:.9}.brand span{display:block;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-top:9px;color:var(--muted);font-weight:650}.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:700;color:var(--muted)}.card{margin-top:72px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(44,42,38,.04)}h1{font-family:Georgia,serif;font-size:31px;font-weight:500;margin:0 0 10px}.lead{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 24px}.field{margin-bottom:16px}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}input{width:100%;padding:15px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:16px;text-transform:uppercase;letter-spacing:.04em}input:focus{outline:2px solid var(--sage);border-color:transparent}.btn{width:100%;border:0;border-radius:12px;padding:15px 16px;background:var(--ink);color:#fff;font-size:15px;font-weight:750;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.msg{min-height:20px;margin-top:14px;font-size:13px;line-height:1.45;color:var(--muted)}.msg.err{color:var(--danger)}.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body><main class="shell"><div class="top"><div class="brand">Weddly<span>Smart Design</span></div><button id="lang" class="lang" type="button">EN</button></div><section class="card"><h1 id="title"></h1><p id="lead" class="lead"></p><div id="activateBox"><div class="field"><label id="codeLabel" for="code"></label><input id="code" autocomplete="one-time-code" maxlength="80" spellcheck="false"></div><button id="activate" class="btn" type="button"></button></div><div id="inviteBox" style="display:none"><button id="join" class="btn" type="button"></button></div><div id="msg" class="msg" aria-live="polite"></div><div id="note" class="note"></div></section></main>
<script>
(()=>{
const ACCESS='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-access';
const TOKEN_KEY='weddly_shared_wedding_token';
const params=new URLSearchParams(location.search),invite=params.get('invite')||'';
let lang=localStorage.getItem('weddly_access_lang')||(navigator.language||'').toLowerCase().startsWith('es')?'es':'en';
const copy={
 es:{activateTitle:'Activa tu boda',activateLead:'Introduce el código recibido con tu compra. Weddly Smart Design creará una única boda para vosotros.',code:'Código de acceso',activate:'Activar mi compra',inviteTitle:'Te han invitado a una boda',inviteLead:'Esta invitación te da acceso como segunda persona autorizada. Solo puede utilizarse una vez.',join:'Unirme a esta boda',busy:'Un momento…',done:'Acceso listo. Abriendo vuestra boda…',note:'Tu acceso se guarda en este dispositivo. No compartas el código de compra ni esta invitación con otras personas.',badLicense:'No encontramos un código válido.',used:'Este código ya se ha utilizado para crear una boda.',badInvite:'Esta invitación no es válida o ya se ha utilizado.',generic:'No hemos podido completar el acceso ahora. Inténtalo de nuevo.'},
 en:{activateTitle:'Activate your wedding',activateLead:'Enter the code included with your purchase. Weddly Smart Design will create one wedding workspace for you.',code:'Access code',activate:'Activate my purchase',inviteTitle:'You have been invited to a wedding',inviteLead:'This invitation gives you access as the second authorised person. It can only be used once.',join:'Join this wedding',busy:'One moment…',done:'Access ready. Opening your wedding…',note:'Your access is saved on this device. Do not share the purchase code or this invitation with anyone else.',badLicense:'We could not find a valid code.',used:'This code has already been used to create a wedding.',badInvite:'This invitation is invalid or has already been used.',generic:'We could not complete access right now. Please try again.'}
};
const $=id=>document.getElementById(id),msg=$('msg');
function render(){const t=copy[lang];document.documentElement.lang=lang;$('lang').textContent=lang==='es'?'EN':'ES';$('activateBox').style.display=invite?'none':'block';$('inviteBox').style.display=invite?'block':'none';$('title').textContent=invite?t.inviteTitle:t.activateTitle;$('lead').textContent=invite?t.inviteLead:t.activateLead;$('codeLabel').textContent=t.code;$('activate').textContent=t.activate;$('join').textContent=t.join;$('note').textContent=t.note;$('code').placeholder='WSD-XXXX-XXXX-XXXX';}
function show(text,error=false){msg.textContent=text;msg.className='msg'+(error?' err':'')}
async function post(body){const r=await fetch(ACCESS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));return {status:r.status,body:j}}
function finish(token){localStorage.setItem(TOKEN_KEY,token);show(copy[lang].done);setTimeout(()=>location.replace('/'),450)}
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';localStorage.setItem('weddly_access_lang',lang);render()};
$('activate').onclick=async()=>{const code=$('code').value.trim();if(!code){show(copy[lang].badLicense,true);return}const b=$('activate');b.disabled=true;show(copy[lang].busy);try{const r=await post({action:'activate',activationCode:code});if(r.status===201&&r.body?.memberToken)return finish(r.body.memberToken);if(r.body?.error==='already_activated')show(copy[lang].used,true);else if(r.body?.error==='invalid_license')show(copy[lang].badLicense,true);else show(copy[lang].generic,true)}catch{show(copy[lang].generic,true)}finally{b.disabled=false}};
$('join').onclick=async()=>{const b=$('join');b.disabled=true;show(copy[lang].busy);try{const r=await post({action:'join',inviteCode:invite});if(r.status===201&&r.body?.memberToken){history.replaceState(null,'',location.pathname);return finish(r.body.memberToken)}show(copy[lang].badInvite,true)}catch{show(copy[lang].generic,true)}finally{b.disabled=false}};
render();
})();
</script></body></html>
