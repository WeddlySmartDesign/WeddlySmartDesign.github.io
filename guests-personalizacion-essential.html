<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WeddlySmartDesign · Personalización Essential</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f4f0}
#editor{width:100%;height:100%;border:0;display:block;background:#f6f4f0}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#f6f4f0;z-index:10;font:500 13px system-ui,-apple-system,Segoe UI,sans-serif;color:#6f6a61}
#boot.hide{display:none}
</style>
</head>
<body>
<div id="boot">Cargando personalización…</div>
<iframe id="editor" src="weddly-personalizacion-essential.html?v=essential-6-rev2-20260909" title="Personalización Essential"></iframe>
<script>
(()=> {
  const RSVP_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp';
  const PERS_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-personalization';
  const frame=document.getElementById('editor'),bootEl=document.getElementById('boot');
  const qs=new URLSearchParams(location.search);
  const member=()=>localStorage.getItem('weddly_shared_wedding_token')||'';
  let token=qs.get('t')||'', cfg={}, pers=null, installed=false;

  async function j(url,opt={}){
    const r=await fetch(url,opt),x=await r.json().catch(()=>({}));
    if(!r.ok||!x.ok) throw new Error(x.error||'request_failed');
    return x;
  }
  async function resolve(){
    if(member()){
      try{
        const x=await j(RSVP_API+'?manage=1',{headers:{'x-weddly-token':member()}});
        const f=x.forms?.[0];
        if(f){token=token||f.public_token||'';cfg=f.config||{}}
      }catch{}
    }
    if(token){
      try{const x=await j(PERS_API+'?token='+encodeURIComponent(token),{cache:'no-store'});pers=x.personalization||null}catch{}
      if(!Object.keys(cfg).length){
        try{const x=await j(RSVP_API+'?token='+encodeURIComponent(token),{cache:'no-store'});cfg=x.form?.config||{}}catch{}
      }
    }
  }

  function addChrome(d,w){
    if(d.getElementById('weddlyIntegrationBar')) return;
    const panel=d.querySelector('.panel');
    if(!panel) return;
    const st=d.createElement('style');
    st.textContent=`
      .weddly-intbar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
      .weddly-intbar a,.weddly-intbar button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 12px;font:600 11px 'Jost',system-ui,sans-serif;text-decoration:none;cursor:pointer}
      .weddly-intbar button{margin-left:auto;background:var(--ink);color:#fff;border-color:var(--ink)}
      .weddly-intfb{display:none;margin:0 0 18px;padding:11px 12px;border-radius:10px;background:#f0e8df;font:500 12px/1.4 'Jost',system-ui,sans-serif}
      .weddly-intfb.on{display:block}.weddly-intfb.ok{background:#e7eee8;color:#4e6656}
      .weddly-save-bottom{margin:8px 0 34px;border-top:1px solid var(--line);padding-top:18px}
      .weddly-save-bottom button{width:100%;border:0;border-radius:12px;padding:14px;background:var(--ink);color:#fff;font:600 14px 'Jost',system-ui,sans-serif;cursor:pointer}
      .weddly-intbar button:disabled,.weddly-save-bottom button:disabled{opacity:.55}
    `;
    d.head.appendChild(st);
    const bar=d.createElement('div'); bar.id='weddlyIntegrationBar'; bar.className='weddly-intbar';
    bar.innerHTML='<a href="guests-v115-integrated.html#invitados">← Guests</a><a href="guests-rsvp-v105-mobile.html?v=form">Formulario y envíos</a><button type="button" data-save-essential>Guardar</button>';
    panel.prepend(bar);
    const fb=d.createElement('div'); fb.id='weddlyIntegrationFeedback'; fb.className='weddly-intfb'; bar.insertAdjacentElement('afterend',fb);
    const bottom=d.createElement('div'); bottom.className='weddly-save-bottom'; bottom.innerHTML='<button type="button" data-save-essential>Guardar diseño Essential</button>';
    panel.appendChild(bottom);
    d.querySelectorAll('[data-save-essential]').forEach(b=>b.onclick=async()=>{
      if(!w.__weddlySaveEssential) return;
      const buttons=[...d.querySelectorAll('[data-save-essential]')];
      buttons.forEach(x=>x.disabled=true); fb.className='weddly-intfb on'; fb.textContent='Guardando…';
      try{
        await w.__weddlySaveEssential();
        fb.className='weddly-intfb on ok'; fb.textContent='Diseño Essential guardado y conectado al RSVP.';
      }catch(e){
        fb.className='weddly-intfb on'; fb.textContent='No se ha podido guardar. Comprueba la conexión y vuelve a intentarlo.';
      }finally{buttons.forEach(x=>x.disabled=false)}
    });
  }

  function inject(d,w){
    w.__WEDDLY_BOOT={cfg,pers,token,memberToken:member(),persApi:PERS_API};
    const s=d.createElement('script');
    s.textContent=`(()=> {
      const B=window.__WEDDLY_BOOT||{}, saved=B.pers||{}, cfg=B.cfg||{};
      const by=id=>document.getElementById(id);
      const splitNames=t=>{for(const sep of [' & ',' y ',' Y ',' + '])if(String(t||'').includes(sep)){const p=String(t).split(sep);return[p[0].trim(),p.slice(1).join(sep.trim()).trim()]}return['Alba','Leo']};
      const splitVenue=v=>{const p=String(v||'').split(',');return[(p.shift()||'').trim(),p.join(',').trim()]};
      const digits=v=>String(v||'').replace(/^https?:\\/\\/wa\\.me\\//i,'').replace(/\\D/g,'');
      const n=splitNames(cfg.title),vp=splitVenue(cfg.venue);
      if(saved.agenda&&Array.isArray(saved.agenda)&&saved.agenda.length) state.agenda=saved.agenda.map(x=>({...x}));
      if(saved.locations&&Array.isArray(saved.locations)&&saved.locations.length) state.locations=saved.locations.map(x=>({...x}));
      state.template=TEMPLATES[saved.template]?saved.template:'e01';
      state.fontPair=FONT_PAIRS.some(x=>x.id===saved.fontPair)?saved.fontPair:'editorial';
      state.heroPhoto=saved.heroPhoto||'';
      state.storyPhoto=saved.storyPhoto||'';
      by('p1').value=saved.p1||n[0];
      by('p2').value=saved.p2||n[1];
      by('date').value=saved.date||(/^\\d{4}-\\d{2}-\\d{2}$/.test(cfg.date||'')?cfg.date:'2027-09-12');
      by('time').value=saved.time||cfg.time||'18:00';
      by('venue').value=saved.venue||vp[0]||'Finca Los Olivos';
      by('city').value=saved.city||vp[1]||'Murcia';
      by('storyTitle').value=saved.storyTitle||'Nos encantará celebrarlo contigo.';
      by('storyText').value=saved.storyText||'Hemos preparado este espacio para que tengas toda la información del día, sin perder el carácter de una invitación diseñada para nosotros.';
      by('contactName').value=saved.contactName||'Ana';
      by('contactPhone').value=saved.contactPhone||'';
      by('whatsapp').value=digits(saved.whatsapp||'');
      buildTemplateGrid(); buildFontGrid(); buildAgendaFields(); buildLocationFields(); renderPreview();

      async function compressDataUrl(src){
        if(!src||!/^data:image\\//i.test(src)||src.length<500000) return src||'';
        return await new Promise(resolve=>{
          const im=new Image();
          im.onload=()=>{
            const max=1100,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
            c.width=Math.max(1,Math.round(im.width*scale)); c.height=Math.max(1,Math.round(im.height*scale));
            c.getContext('2d').drawImage(im,0,0,c.width,c.height);
            let q=.76,out=c.toDataURL('image/jpeg',q);
            while(out.length>650000&&q>.42){q-=.08;out=c.toDataURL('image/jpeg',q)}
            resolve(out);
          };
          im.onerror=()=>resolve(src); im.src=src;
        });
      }
      window.__weddlySaveEssential=async()=>{
        if(!B.token||!B.memberToken) throw new Error('missing_access');
        state.heroPhoto=await compressDataUrl(state.heroPhoto);
        state.storyPhoto=await compressDataUrl(state.storyPhoto);
        const phoneDigits=digits(by('whatsapp').value);
        const p={
          tier:'essential',template:state.template,fontPair:state.fontPair,
          p1:(by('p1').value||'Persona 1').trim(),p2:(by('p2').value||'Persona 2').trim(),
          date:by('date').value||'2027-01-01',time:by('time').value||'18:00',
          venue:(by('venue').value||'Lugar de la ceremonia').trim(),city:(by('city').value||'').trim(),
          heroPhoto:state.heroPhoto||'',storyPhoto:state.storyPhoto||'',
          storyTitle:(by('storyTitle').value||'').trim(),storyText:(by('storyText').value||'').trim(),
          agenda:(state.agenda||[]).map(x=>({...x})),locations:(state.locations||[]).map(x=>({...x})),
          contactName:(by('contactName').value||'').trim(),contactPhone:(by('contactPhone').value||'').trim(),
          whatsapp:phoneDigits?'https://wa.me/'+phoneDigits:''
        };
        const r=await fetch(B.persApi,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':B.memberToken},body:JSON.stringify({token:B.token,personalization:p})});
        const x=await r.json().catch(()=>({})); if(!r.ok||!x.ok) throw new Error(x.error||'save_failed');
        try{localStorage.setItem('weddly_guests_design',JSON.stringify(x.personalization||p))}catch{}
        window.__WEDDLY_BOOT.pers=x.personalization||p;
        renderPreview();
        return x.personalization||p;
      };
    })();`;
    d.body.appendChild(s);
    addChrome(d,w);
  }

  async function install(){
    if(installed) return;
    try{
      const d=frame.contentDocument,w=frame.contentWindow;
      if(!d?.body||!d.getElementById('tplGrid')) return;
      installed=true;
      await resolve();
      inject(d,w);
      bootEl.classList.add('hide');
    }catch(e){bootEl.textContent='No se ha podido abrir la personalización.'}
  }
  frame.addEventListener('load',()=>{setTimeout(install,50);setTimeout(install,250)});
  setTimeout(install,600);
})();
</script>
</body>
</html>
