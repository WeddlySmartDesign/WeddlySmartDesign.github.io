<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Personalización Essential</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Mrs+Saint+Delafield&family=Playfair+Display:ital,wght@0,600;1,500&family=EB+Garamond&family=Fraunces:opsz,wght@9..144,500&family=Work+Sans:wght@500&family=Beau+Rivage&family=Marcellus&family=Jost:wght@400;500;600&display=swap" rel="stylesheet"><style>:root{--bg:#f6f4f0;--panel:#fff;--ink:#2b2a27;--muted:#8a8579;--line:#e6e2d8;--accent:#6e5230}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:'Jost',system-ui,sans-serif;color:var(--ink)}.app{display:grid;grid-template-columns:1fr;max-width:1180px;margin:auto}@media(min-width:980px){.app{grid-template-columns:420px 1fr;align-items:start}}.panel{padding:24px 22px 60px}.toolbar{display:flex;justify-content:space-between;gap:8px;margin-bottom:20px}.toolbar a{font-size:12px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.h1{font-size:22px;font-weight:600;margin:0 0 4px}.h1-sub{font-size:13px;color:var(--muted);margin:0 0 28px}.step-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 12px}.section{margin-bottom:34px}.tpl-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tpl-card{border:2px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;background:#fff}.tpl-card.selected{border-color:var(--accent)}.tpl-card.disabled{opacity:.5;cursor:not-allowed}.tpl-swatch{width:100%;aspect-ratio:3/4;border-radius:8px;margin:0 0 8px;display:flex;align-items:center;justify-content:center}.tpl-swatch.s1{background:linear-gradient(135deg,#f4efeb,#e9dcc4)}.tpl-swatch.s2{background:linear-gradient(135deg,#eef1e6,#cddab8)}.tpl-swatch.soon{background:repeating-linear-gradient(45deg,#eee,#eee 6px,#e4e4e4 6px,#e4e4e4 12px)}.tpl-name{font-size:11.5px;font-weight:600}.tpl-tag{font-size:9.5px;color:var(--muted);margin-top:2px}label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin:0 0 4px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}input[type=text],input[type=date],input[type=time]{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:inherit;margin-bottom:14px;background:#fff;color:var(--ink)}.photo-input{border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center;margin-bottom:14px;background:#fff}.photo-input input{margin-top:8px;font-size:12px}.font-grid{display:flex;flex-direction:column;gap:8px}.font-card{display:flex;align-items:center;justify-content:space-between;border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;background:#fff}.font-card.selected{border-color:var(--accent)}.font-card .preview{display:flex;align-items:baseline;gap:10px}.font-card .pf{font-size:22px}.font-card .sf,.font-card .fname{font-size:11px;color:var(--muted)}.savebtn{width:100%;border:0;border-radius:12px;padding:14px;background:var(--ink);color:#fff;font:600 14px 'Jost';cursor:pointer}.feedback{display:none;margin-bottom:10px;padding:11px;border-radius:10px;background:#f0e8df;font-size:12px}.feedback.on{display:block}.feedback.ok{background:#e7eee8;color:#4e6656}.preview-pane{position:sticky;top:0;background:#efece5;display:flex;justify-content:center;padding:26px 14px;min-height:100vh}.phone-frame{width:100%;max-width:400px;background:#fff;border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.15);overflow:hidden;border:8px solid #1c1c1c}iframe{width:100%;height:80vh;min-height:700px;border:0;display:block}@media(max-width:979px){.preview-pane{position:relative;min-height:auto}.phone-frame{max-width:430px}iframe{height:76vh;min-height:620px}}</style></head><body><div class="app"><div class="panel"><div class="toolbar"><a href="guests-v115-integrated.html#invitados">← Guests</a><a href="guests-rsvp-v105-mobile.html?v=form">Formulario y envíos</a></div><p class="h1">Personaliza tu invitación</p><p class="h1-sub">Essential · elige plantilla, añade vuestros datos y una tipografía a juego.</p><div class="section"><p class="step-label">1 · Plantilla</p><div class="tpl-grid" id="tplGrid"></div></div><div class="section"><p class="step-label">2 · Vuestros datos</p><label>Persona 1</label><input id="p1" type="text" value="Alba"><label>Persona 2</label><input id="p2" type="text" value="Leo"><div class="row2"><div><label>Fecha</label><input id="date" type="date" value="2027-09-12"></div><div><label>Hora</label><input id="time" type="time" value="18:00"></div></div><label>Finca / lugar</label><input id="venue" type="text" value="Finca Los Olivos"><label>Ciudad</label><input id="city" type="text" value="Murcia"></div><div class="section"><p class="step-label">3 · Foto (opcional)</p><div class="photo-input"><label>Foto principal (portada)</label><input id="heroPhotoInput" type="file" accept="image/*"></div><div class="photo-input"><label>Foto secundaria (nuestra historia)</label><input id="storyPhotoInput" type="file" accept="image/*"></div></div><div class="section"><p class="step-label">4 · Tipografía</p><div class="font-grid" id="fontGrid"></div></div><div id="saveFb" class="feedback"></div><button id="saveBtn" class="savebtn">Guardar diseño Essential</button></div><div class="preview-pane"><div class="phone-frame"><iframe id="preview"></iframe></div></div></div><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp',member=()=>localStorage.getItem('weddly_shared_wedding_token')||'',qs=new URLSearchParams(location.search);let token=qs.get('t')||'',cfg={title:'Alba & Leo',date:'2027-09-12',time:'18:00',venue:'Finca Los Olivos, Murcia',questions:{}},state={template:'e01',fontPair:'editorial',heroPhoto:'',storyPhoto:''},cache=new Map(),timer=0;const $=id=>document.getElementById(id),templates={e01:'guests-rsvp-essential-01.html',e02:'guests-rsvp-essential-02.html'},fonts=[{id:'editorial',label:'Editorial',primary:'Cormorant Garamond',primaryParam:'Cormorant+Garamond:wght@500;600',secondary:'Jost',secondaryParam:'Jost:wght@300;400;500;600'},{id:'romantico',label:'Romántico',primary:'Mrs Saint Delafield',primaryParam:'Mrs+Saint+Delafield',secondary:'Cormorant Garamond',secondaryParam:'Cormorant+Garamond:wght@400;500'},{id:'clasico',label:'Clásico',primary:'Playfair Display',primaryParam:'Playfair+Display:ital,wght@0,600;1,500',secondary:'EB Garamond',secondaryParam:'EB+Garamond:ital,wght@0,400;0,500;1,400'},{id:'moderno',label:'Moderno',primary:'Fraunces',primaryParam:'Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500',secondary:'Work Sans',secondaryParam:'Work+Sans:wght@300;400;500;600'},{id:'caligrafico',label:'Caligráfico',primary:'Beau Rivage',primaryParam:'Beau+Rivage',secondary:'Marcellus',secondaryParam:'Marcellus'}];async function req(path='',opt={}){const r=await fetch(API+path,opt),x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||'request_failed');return x}async function load(){if(!member())return;const x=await req('?manage=1',{headers:{'x-weddly-token':member()}});const f=x.forms?.[0];if(f){token=token||f.token||'';if(f.config)cfg={...cfg,...f.config,questions:{...cfg.questions,...f.config.questions}}}}function names(t){for(const s of [' & ',' y ',' Y ',' + '])if(String(t||'').includes(s)){const p=t.split(s);return[p[0].trim(),p.slice(1).join(s.trim()).trim()]}return['Alba','Leo']}function hydrate(){const d=cfg.design||{},n=names(cfg.title),v=String(cfg.venue||'').split(',');state.template=templates[d.template]?d.template:'e01';state.fontPair=fonts.some(x=>x.id===d.fontPair)?d.fontPair:'editorial';state.heroPhoto=d.heroPhoto||'';state.storyPhoto=d.storyPhoto||'';$('p1').value=d.p1||n[0];$('p2').value=d.p2||n[1];$('date').value=d.date||(/^\d{4}-\d{2}-\d{2}$/.test(cfg.date||'')?cfg.date:'2027-09-12');$('time').value=d.time||cfg.time||'18:00';$('venue').value=d.venue||(v.shift()||'Finca Los Olivos').trim();$('city').value=d.city||v.join(',').trim()||'Murcia';buildTemplates();buildFonts();schedule()}function buildTemplates(){const items=[['e01','Essential 01','s1',1],['e02','Essential 02','s2',1],['e03','Essential 03','soon',0],['e04','Essential 04','soon',0],['e05','Essential 05','soon',0]];$('tplGrid').innerHTML=items.map(i=>`<div class="tpl-card ${i[3]?'':'disabled'} ${state.template===i[0]?'selected':''}" data-id="${i[0]}" data-ok="${i[3]}"><div class="tpl-swatch ${i[2]}">${i[3]?'':'🔒'}</div><div class="tpl-name">${i[1]}</div><div class="tpl-tag">${i[3]?'Disponible':'Próximamente'}</div></div>`).join('');$('tplGrid').querySelectorAll('.tpl-card').forEach(c=>c.onclick=()=>{if(c.dataset.ok!=='1')return;state.template=c.dataset.id;buildTemplates();schedule()})}function buildFonts(){$('fontGrid').innerHTML=fonts.map(f=>`<div class="font-card ${state.fontPair===f.id?'selected':''}" data-id="${f.id}"><div class="preview"><span class="pf" style="font-family:'${f.primary}'">Aa</span><span class="sf" style="font-family:'${f.secondary}'">Aa texto</span></div><span class="fname">${f.label}</span></div>`).join('');$('fontGrid').querySelectorAll('.font-card').forEach(c=>c.onclick=()=>{state.fontPair=c.dataset.id;buildFonts();schedule()})}async function source(){const u=templates[state.template];if(cache.has(u))return cache.get(u);const r=await fetch(u+'?v=essential-final',{cache:'no-store'});if(!r.ok)throw 0;const s=await r.text();cache.set(u,s);return s}function data(){return{p1:$('p1').value.trim()||'Persona 1',p2:$('p2').value.trim()||'Persona 2',date:$('date').value||'2027-01-01',time:$('time').value||'18:00',venue:$('venue').value.trim()||'Lugar de la ceremonia',city:$('city').value.trim(),heroPhoto:state.heroPhoto,storyPhoto:state.storyPhoto,storyTitle:cfg.design?.storyTitle||'Nos encantará celebrarlo contigo.',storyText:cfg.design?.storyText||'Hemos preparado este espacio para que tengas toda la información del día, sin perder el carácter de una invitación diseñada para nosotros.',contactName:cfg.design?.contactName||'Ana',contactPhone:cfg.design?.contactPhone||'',whatsapp:cfg.design?.whatsapp||'#'}}function patch(h,w,f){const href=`https://fonts.googleapis.com/css2?family=${f.primaryParam}&family=${f.secondaryParam}&display=swap`,css=`<link rel="stylesheet" href="${href}"><style>body,input,button{font-family:'${f.secondary}',system-ui,sans-serif!important}.script,.agenda-title,.card-eyebrow,.cover-names{font-family:'${f.primary}',serif!important}.historia-text{font-family:'${f.secondary}',serif!important}</style>`;h=h.replace('</head>',css+'</head>');return h.replace(/const wedding = \{[\s\S]*?\n  \};/,`const wedding = ${JSON.stringify(w)};`)}async function render(){try{const f=fonts.find(x=>x.id===state.fontPair)||fonts[0];$('preview').srcdoc=patch(await source(),data(),f)}catch{$('preview').srcdoc='<main style="font-family:system-ui;padding:30px">No se ha podido cargar la vista previa.</main>'}}function schedule(){clearTimeout(timer);timer=setTimeout(render,120)}function photo(inp,key){const file=inp.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{state[key]=r.result;schedule()};r.readAsDataURL(file)}$('heroPhotoInput').onchange=e=>photo(e.target,'heroPhoto');$('storyPhotoInput').onchange=e=>photo(e.target,'storyPhoto');['p1','p2','date','time','venue','city'].forEach(id=>$(id).oninput=schedule);$('saveBtn').onclick=async()=>{const fb=$('saveFb'),w=data();fb.className='feedback on';fb.textContent='Guardando…';try{if(!member()||!token)throw 0;cfg={...cfg,title:`${w.p1} & ${w.p2}`,date:w.date,time:w.time,venue:w.city?`${w.venue}, ${w.city}`:w.venue,design:{tier:'essential',template:state.template,fontPair:state.fontPair,...w}};await req('',{method:'POST',headers:{'content-type':'application/json','x-weddly-token':member()},body:JSON.stringify({action:'config',token,config:cfg})});fb.className='feedback on ok';fb.textContent='Diseño guardado. Este es el Essential que verán los invitados.'}catch{fb.textContent='No se ha podido guardar. Abre esta pantalla desde Guests y reintenta.'}};(async()=>{try{await load()}catch{}hydrate()})()})();</script></body></html>
