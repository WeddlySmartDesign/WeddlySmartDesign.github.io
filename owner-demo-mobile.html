<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Weddly Smart Design · Demo</title>
<style>
:root{--ink:#2C2A26;--sage:#596248;--paper:#FBF8F3;--muted:#756F65;--danger:#A84535}*{box-sizing:border-box}body{margin:0;background:#F2EFE9;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(100%,420px);background:var(--paper);border:1px solid #E5DED2;border-radius:18px;padding:26px;text-align:center;box-shadow:0 12px 30px rgba(44,42,38,.04)}.brand{font-family:Georgia,serif;color:var(--sage);font-size:31px}.brand span{display:block;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px;color:var(--muted);font-weight:700}.msg{margin-top:22px;font-size:14px;line-height:1.55;color:var(--muted)}.err{color:var(--danger)}</style>
</head>
<body><main class="shell"><section class="card"><div class="brand">Weddly<span>Smart Design</span></div><div id="msg" class="msg">Preparando tu demo…</div></section></main>
<script src="/access-cookie-bridge-v1.js?v=1"></script>
<script>
(async()=>{
const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-test-access';
const msg=document.getElementById('msg');
function fail(t){msg.textContent=t;msg.classList.add('err')}
try{
  const hp=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):location.hash);
  const lang=(hp.get('lang')||'').toLowerCase(),token=hp.get('token')||'',product=(hp.get('product')||'full').toLowerCase();
  history.replaceState(null,'',location.pathname);
  if((lang!=='es'&&lang!=='en')||token.length<40||!['full','payments','guests'].includes(product)){fail('Este enlace de demo no es válido. Genera uno nuevo desde tu Gestor de accesos.');return}
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-weddly-member':token},body:JSON.stringify({action:'entitlement'}),cache:'no-store'});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j?.ok||j.product!=='full'){fail('Este enlace de demo ya no es válido. Genera uno nuevo desde tu Gestor de accesos.');return}
  if(window.__WSD_ACCESS_BRIDGE?.remember)window.__WSD_ACCESS_BRIDGE.remember(token);else localStorage.setItem('weddly_shared_wedding_token',token);
  localStorage.setItem('weddly_owner_demo_token_'+lang,token);
  localStorage.setItem('weddly_owner_demo_mode',lang);
  localStorage.setItem('weddly_access_lang',lang);
  try{
    const demoKey='weddly_pro_v7_owner_demo_'+lang;
    const raw=localStorage.getItem(demoKey);
    if(raw){
      const data=JSON.parse(raw);
      if(data&&typeof data==='object'){
        data.settings=data.settings&&typeof data.settings==='object'?data.settings:{};
        data.settings.lang=lang;
        localStorage.setItem(demoKey,JSON.stringify(data));
      }
    }
  }catch{}
  msg.textContent=lang==='es'?'Demo recuperada. Abriendo Weddly Smart Design…':'Demo restored. Opening Weddly Smart Design…';
  const target=product==='payments'?'/payments.html?ownerDemo='+encodeURIComponent(lang):product==='guests'?'/guests.html?ownerDemo='+encodeURIComponent(lang):'/app.html?ownerDemo='+encodeURIComponent(lang);
  setTimeout(()=>location.replace(target),250);
}catch{fail('No hemos podido recuperar la demo. Genera un enlace nuevo desde tu Gestor de accesos.')}
})();
</script>
</body></html>
