<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Weddly Smart Design · Demo</title>
<style>
:root{--ink:#2C2A26;--sage:#596248;--paper:#FBF8F3;--muted:#756F65;--danger:#A84535;--line:#E5DED2}*{box-sizing:border-box}body{margin:0;background:#F2EFE9;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;display:grid;place-items:center;padding:28px}.card{width:min(100%,420px);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center;box-shadow:0 12px 30px rgba(44,42,38,.04)}.brand{font-family:Georgia,serif;color:var(--sage);font-size:31px}.brand span{display:block;font-family:system-ui,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:8px;color:var(--muted);font-weight:700}.msg{margin-top:22px;font-size:14px;line-height:1.55;color:var(--muted)}.err{color:var(--danger)}.open{display:none;margin-top:18px;border:0;border-radius:11px;padding:13px 16px;background:var(--ink);color:#fff;font-size:14px;font-weight:750;text-decoration:none}.open.on{display:inline-block}
</style>
</head>
<body><main class="shell"><section class="card"><div class="brand">Weddly<span>Smart Design</span></div><div id="msg" class="msg">Preparando tu demo…</div><a id="open" class="open">Abrir demo</a></section></main>
<script src="/access-cookie-bridge-v1.js?v=1"></script>
<script>
(async()=>{
const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-test-access',BROWSER_BRIDGE='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-browser-bridge',TOKEN='weddly_shared_wedding_token',REAL='weddly_owner_real_token_v1';
const msg=document.getElementById('msg'),open=document.getElementById('open');
function fail(t){msg.textContent=t;msg.classList.add('err')}
async function post(memberToken,body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-weddly-member':memberToken},body:JSON.stringify(body),cache:'no-store'}),j=await r.json().catch(()=>({}));return{r,j}}
function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
function android(){return /Android/i.test(navigator.userAgent||'')}
function chromeIntent(url){const clean=url.replace(/^https?:\/\//,'');return `intent://${clean}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(url)};end`}
function browserBridge(url){const b=new URL(BROWSER_BRIDGE);b.searchParams.set('to',url);return b.href}
try{
  const hp=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):location.hash),lang=(hp.get('lang')||'').toLowerCase(),token=hp.get('token')||'',product=(hp.get('product')||'full').toLowerCase();
  history.replaceState(null,'',location.pathname);
  if((lang!=='es'&&lang!=='en')||token.length<40||!['full','payments','guests'].includes(product)){fail('Este enlace de demo no es válido. Genera uno nuevo desde tu Gestor de accesos.');return}
  const ent=await post(token,{action:'entitlement'}),j=ent.j;
  if(!ent.r.ok||!j?.ok||j.product!=='full'){fail(lang==='en'?'This demo link is no longer valid. Generate a new one from WSD Access.':'Este enlace de demo ya no es válido. Genera uno nuevo desde WSD Accesos.');return}
  let demoToken=token;
  if(j.owner===true){const d=await post(token,{action:'owner_demo_token',lang});if(!d.r.ok||!d.j?.memberToken){fail(lang==='en'?'We could not prepare the demo wedding. Open it again from WSD Access.':'No hemos podido preparar la boda demo. Vuelve a abrirla desde WSD Accesos.');return}demoToken=d.j.memberToken}
  try{const current=localStorage.getItem(TOKEN)||'';if(current.length>=40&&current!==demoToken){const ce=await post(current,{action:'entitlement'});if(ce.r.ok&&ce.j?.ok&&ce.j.owner===true)localStorage.setItem(REAL,current)}}catch{}
  if(window.__WSD_ACCESS_BRIDGE?.remember)window.__WSD_ACCESS_BRIDGE.remember(demoToken);else localStorage.setItem(TOKEN,demoToken);
  localStorage.setItem('weddly_owner_demo_token_'+lang,demoToken);localStorage.setItem('weddly_owner_demo_mode',lang);localStorage.setItem('weddly_access_lang',lang);
  const u=new URL(`/demo/${lang}/${product}/`,location.origin);u.searchParams.set('_from','access');u.searchParams.set('install','1');
  if(standalone()){
    msg.textContent=lang==='en'?'Demo ready. Open Chrome to install this copy separately.':'Demo preparada. Abre Chrome para instalar esta copia por separado.';
    open.textContent=lang==='en'?'Open Chrome to install':'Abrir Chrome para instalar';
    const external=browserBridge(u.href);
    open.href=android()?chromeIntent(external):external;
    if(!android()){open.target='_blank';open.rel='noopener'}
    open.classList.add('on');return;
  }
  msg.textContent=lang==='en'?'Demo restored. Opening the install screen…':'Demo recuperada. Abriendo la pantalla de instalación…';
  const external=browserBridge(u.href);
  setTimeout(()=>location.replace(android()?chromeIntent(external):external),180);
}catch{fail('No hemos podido recuperar la demo. Genera un enlace nuevo desde WSD Accesos.')}
})();
</script>
</body></html>
