mplate-columns:1fr 1fr;gap:9px}.btn{border:0;border-radius:13px;padding:13px 14px;background:#2c2a26;color:#fff;font-weight:850;font-size:15px}.btn.soft{background:#eee8df;color:#2c2a26}.photoPreview{width:100%;height:190px;border-radius:18px;object-fit:cover;background:#eee8df;margin:6px 0 12px;display:none}.photoPreview.on{display:block}.syncNote{display:none;padding:11px 12px;border-radius:12px;background:#eef3ea;color:#51604d;margin:10px 0;font-size:13px}.syncNote.on{display:block}.rsvpLayer{display:none;position:fixed;z-index:9998;inset:0;background:#f5f1ea}.rsvpLayer.on{display:block}.rsvpLayer iframe{width:100%;height:100%;border:0;display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#f5f1ea;color:#706b65;font-weight:700;z-index:-1}@media(max-width:560px){.styles{grid-template-columns:1fr 1fr}.panel{padding:18px 16px calc(26px + env(safe-area-inset-bottom))}.sw{height:54px}}
</style>

<body>

<div id="rsvpLayer" class="rsvpLayer"><div class="loading">Abriendo RSVP…</div><iframe id="rsvpFrame" title="RSVP personalizado"></iframe></div>
<div id="drawer" class="drawer"><div class="panel">

<script>
(()=>{
const PKEY='weddly_personalization_v2',GKEY='weddly_guests_qa_v67',TOKEN_KEY='weddly_shared_wedding_token',PAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-personalization';
const app=document.getElementById('app'),drawer=document.getElementById('drawer'),rsvpLayer=document.getElementById('rsvpLayer'),rsvpFrame=document.getElementById('rsvpFrame');
const themes={
 atelier:{bg:'#f7f1e7',surface:'#fffaf2',surface2:'#eee2d1',ink:'#2b231c',muted:'#776a5d',line:'#ddcdb8',accent:'#b59a75',accentText:'#241d18',radius:'14px',title:'Georgia,serif',shadow:'0 10px 28px rgba(83,62,39,.08)'},
 oliva:{bg:'#f1f2ea',surface:'#fcfcf7',surface2:'#e1e7d7',ink:'#30382e',muted:'#6e7867',line:'#ccd5c4',accent:'#74836b',accentText:'#fff',radius:'23px',title:'Georgia,serif',shadow:'0 12px 30px rgba(52,67,47,.07)'},
 siena:{bg:'#f8efe9',surface:'#fffaf6',surface2:'#f0ddd1',ink:'#3d2a22',muted:'#836b60',line:'#e1c9bb',accent:'#ad684b',accentText:'#fff',radius:'24px',title:'Georgia,serif',shadow:'0 12px 30px rgba(95,50,32,.08)'},
 perla:{bg:'#fbf3f6',surface:'#fffafd',surface2:'#f2e2e8',ink:'#513942',muted:'#876d79',line:'#ead2dc',accent:'#a4778a',accentText:'#fffafc',radius:'30px',title:'Palatino Linotype,Palatino,Georgia,serif',shadow:'0 14px 34px rgba(96,57,72,.08)'},
 noche:{bg:'#101823',surface:'#172331',surface2:'#223244',ink:'#f7f0e5',muted:'#c5b9a8',line:'#34485b',accent:'#d7bb8c',accentText:'#17202a',radius:'18px',title:'Georgia,serif',shadow:'0 16px 38px rgba(0,0,0,.3)'},
 cielo:{bg:'#eef5f7',surface:'#fbfeff',surface2:'#deebef',ink:'#294149',muted:'#6c8288',line:'#c9dde2',accent:'#789eaa',accentText:'#fff',radius:'28px',title:'Palatino Linotype,Palatino,Georgia,serif',shadow:'0 14px 34px rgba(58,93,104,.08)'}
};
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]))}
function infer(){let s={theme:'oliva',p1:'Daniela',p2:'Sergio',date:'2027-09-12',place:'Murcia',photo:''};try{const x=JSON.parse(localStorage.getItem(GKEY)||'null'),m=x?.meta||{};if(Array.isArray(m.couple)&&m.couple[0]&&m.couple[1]){s.p1=m.couple[0];s.p2=m.couple[1]}if(m.weddingDate)s.date=m.weddingDate}catch{}return s}
function load(){try{return {...infer(),...(JSON.parse(localStorage.getItem(PKEY)||'null')||{})}}catch{return infer()}}
let S=load(),rsvpToken='';
function saveLocal(){try{localStorage.setItem(PKEY,JSON.stringify(S))}catch{}}
function fmtDate(){if(!S.date)return'Fecha pendiente';const d=new Date(S.date+'T12:00:00');return Number.isNaN(d.getTime())?'Fecha pendiente':d.toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}
function days(){if(!S.date)return'';const a=new Date();a.setHours(0,0,0,0);const b=new Date(S.date+'T00:00:00');const n=Math.ceil((b-a)/86400000);return n>=0?`Faltan ${n} días`:''}
function css(t){return `
:root{--wbg:${t.bg};--ws:${t.surface};--ws2:${t.surface2};--wi:${t.ink};--wm:${t.muted};--wl:${t.line};--wa:${t.accent};--wat:${t.accentText};--wr:${t.radius};--wt:${t.title};--wshadow:${t.shadow}}
html,body{background:var(--wbg)!important;color:var(--wi)!important}.wrap{max-width:760px!important}.card,.stat,.step,.table,.panel,.choice{background:var(--ws)!important;border-color:var(--wl)!important;color:var(--wi)!important;border-radius:var(--wr)!important;box-shadow:var(--wshadow)}.small,.weddingMeta,.choice .muted,.sectiontag{color:var(--wm)!important}.btn,.stepNum{background:var(--wa)!important;color:var(--wat)!important}.btn.soft,.pill,.nav button.on,.helper,.bulkNames,.thead{background:var(--ws2)!important;color:var(--wi)!important}.btn.line{background:var(--ws)!important;color:var(--wi)!important;border-color:var(--wl)!important}.nav{background:var(--ws)!important;border-color:var(--wl)!important}.nav button{color:var(--wi)!important}.planLaunch{background:var(--wa)!important;color:var(--wat)!important;border-radius:calc(var(--wr) + 2px)!important;box-shadow:var(--wshadow)}.planLaunchCopy,.planLaunchTag{color:var(--wat)!important;opacity:.8}.sheet{background:#0008!important}.field{background:var(--ws)!important;color:var(--wi)!important;border-color:var(--wl)!important}h2{font-family:var(--wt)!important}.brand{color:var(--wm)!important}
#wsdHero{margin:0 0 23px}#wsdHero .cover{height:315px;border-radius:calc(var(--wr) + 6px);overflow:hidden;position:relative;background:var(--wa);box-shadow:0 20px 46px #00000018}#wsdHero .cover.hasPhoto:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(12,11,11,.65),rgba(12,11,11,.04) 67%)}#wsdHero img{width:100%;height:100%;object-fit:cover;display:block}#wsdHero .copy{position:absolute;z-index:2;left:28px;right:28px;bottom:25px;color:#fff}#wsdHero .cover:not(.hasPhoto) .copy{color:var(--wat)}#wsdHero .brandline{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;margin-bottom:8px;opacity:.85}#wsdHero .names{font:500 clamp(38px,7vw,62px)/.98 var(--wt);letter-spacing:-.025em;margin:0 0 8px}#wsdHero .meta{font-size:14px;opacity:.92}#wsdHero .days{display:inline-block;margin-top:12px;padding:8px 11px;border-radius:999px;background:#ffffffe8;color:#292522;font-weight:850;font-size:12px}#wsdHero .edit{position:absolute;z-index:3;right:16px;top:16px;border:0;background:#fffffff1;color:#2c2a26;padding:10px 12px;border-radius:999px;font-weight:850;box-shadow:0 8px 24px #0002}#wsdHero .fallback{height:100%;background:linear-gradient(135deg,var(--wa),var(--ws2))}
@media(max-width:560px){body{padding-bottom:126px!important}.wrap{padding:17px 16px 145px!important}#wsdHero .cover{height:235px}#wsdHero .copy{left:19px;right:19px;bottom:18px}#wsdHero .names{font-size:40px}.nav{z-index:9999!important;pointer-events:auto!important;bottom:10px!important;left:8px!important;right:8px!important;border:1px solid var(--wl)!important;border-radius:18px!important;padding:7px 5px calc(7px + env(safe-area-inset-bottom))!important;box-shadow:0 10px 28px #0002}.nav button{pointer-events:auto!important}}
`}
function heroHTML(){return `<section id="wsdHero"><div class="cover ${S.photo?'hasPhoto':''}">${S.photo?`<img src="${S.photo}" alt="Foto de ${esc(S.p1)} y ${esc(S.p2)}">`:'<div class="fallback"></div>'}<button class="edit" type="button">Personalizar</button><div class="copy"><div class="brandline">Weddly Smart Design · Invitados</div><div class="names">${esc(S.p1)} & ${esc(S.p2)}</div><div class="meta">${esc(fmtDate())}${S.place?' · '+esc(S.place):''}</div>${days()?`<div class="days">${esc(days())}</div>`:''}</div></div></section>`}
function install(d,w){if(!d||!w)return;let st=d.getElementById('wsd-personal-v2-style');if(!st){st=d.createElement('style');st.id='wsd-personal-v2-style';d.head.appendChild(st)}st.textContent=css(themes[S.theme]||themes.oliva);const isGuests=d.getElementById('coupleTitle')&&d.getElementById('hoy');if(!isGuests)return;d.querySelector('.brand')?.classList.add('hidden');d.getElementById('coupleTitle')?.classList.add('hidden');d.getElementById('weddingMeta')?.classList.add('hidden');let h=d.getElementById('wsdHero');const tmp=d.createElement('div');tmp.innerHTML=heroHTML();if(h)h.replaceWith(tmp.firstElementChild);else{const main=d.querySelector('main.wrap');main?.insertBefore(tmp.firstElementChild,d.getElementById('hoy')||main.firstChild)}d.getElementById('wsdHero')?.querySelector('.edit')?.addEventListener('click',openDrawer);
if(!d.documentElement.dataset.wsdV2Capture){d.documentElement.dataset.wsdV2Capture='1';d.addEventListener('click',e=>{const r=e.target.closest?.('#rsvpBtn');if(r){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();openRSVP()}},true)}
const pf=d.getElementById('planFrame');if(pf&&!pf.getAttribute('src')){setTimeout(()=>{if(!pf.getAttribute('src'))pf.src='guests-v081-visual-seating.html?v=129-desktop'},450)}
}
function apply(){try{install(app.contentDocument,app.contentWindow)}catch(e){console.warn(e)}}
function openRSVP(){rsvpLayer.classList.add('on');document.body.style.overflow='hidden';if(!rsvpFrame.src)rsvpFrame.src='guests-rsvp-personalized-v2.html?v=2';rsvpFrame.contentWindow?.postMessage({type:'wsd-personalization-update',value:S},location.origin)}
function closeRSVP(){rsvpLayer.classList.remove('on');document.body.style.overflow='';apply()}
function preloadRSVP(){if(!rsvpFrame.getAttribute('src'))rsvpFrame.src='guests-rsvp-personalized-v2.html?v=2-preload'}
app.addEventListener('load',()=>{apply();setTimeout(apply,100);setTimeout(apply,450);setTimeout(preloadRSVP,700)});
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='wsd-rsvp-back')closeRSVP();if(e.data?.type==='wsd-rsvp-token'){rsvpToken=e.data.token||''}});
function openDrawer(){S=load();document.querySelectorAll('.style').forEach(b=>b.classList.toggle('on',b.dataset.theme===S.theme));p1.value=S.p1||'';p2.value=S.p2||'';date.value=S.date||'';place.value=S.place||'';photoPreview.src=S.photo||'';photoPreview.classList.toggle('on',!!S.photo);syncNote.className='syncNote';syncNote.textContent='';drawer.classList.add('on')}
function closeDrawer(){drawer.classList.remove('on')}
document.getElementById('styles').onclick=e=>{const b=e.target.closest('[data-theme]');if(!b)return;S.theme=b.dataset.theme;document.querySelectorAll('.style').forEach(x=>x.classList.toggle('on',x===b));apply();rsvpFrame.contentWindow?.postMessage({type:'wsd-personalization-update',value:S},location.origin)};
async function compress(file){return new Promise((resolve,reject)=>{const img=new Image(),r=new FileReader();r.onload=()=>{img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.78))};img.onerror=reject;img.src=String(r.result||'')};r.onerror=reject;r.readAsDataURL(file)})}
photo.onchange=async()=>{const f=photo.files?.[0];if(!f)return;syncNote.className='syncNote on';syncNote.textContent='Preparando foto…';try{S.photo=await compress(f);photoPreview.src=S.photo;photoPreview.classList.add('on');syncNote.textContent='Foto preparada.'}catch{syncNote.textContent='No he podido preparar esta foto. Prueba con otra imagen.'}};
async function syncRemote(){let member='';try{member=localStorage.getItem(TOKEN_KEY)||''}catch{}if(!rsvpToken||member.length<20)return false;try{const r=await fetch(PAPI,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':member},body:JSON.stringify({token:rsvpToken,personalization:S})}),x=await r.json();return !!(r.ok&&x.ok)}catch{return false}}
cancel.onclick=closeDrawer;drawer.onclick=e=>{if(e.target===drawer)closeDrawer()};save.onclick=async()=>{S.p1=p1.value.trim()||'Persona 1';S.p2=p2.value.trim()||'Persona 2';S.date=date.value;S.place=place.value.trim();saveLocal();apply();rsvpFrame.contentWindow?.postMessage({type:'wsd-personalization-update',value:S},location.origin);syncNote.className='syncNote on';syncNote.textContent='Guardando personalización…';const remote=await syncRemote();syncNote.textContent=remote?'Personalización guardada también para el RSVP que recibirán los invitados.':'Personalización guardada en este dispositivo. El RSVP público se sincronizará cuando este navegador tenga acceso compartido.';setTimeout(closeDrawer,remote?850:1300)};
window.openWeddlyPersonalization=openDrawer;
})();
</script>
