<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="only light"><title>RSVP</title><style>:root{--bg:#f5f1ea;--paper:#fff;--line:#ddd5c8;--ink:#2c2a26;--muted:#706b65;--soft:#eee8df}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:640px;margin:auto;padding:32px 20px 80px}h1{font:500 42px/1.05 Georgia,serif;margin:6px 0 8px}.lead{color:var(--muted);line-height:1.5;margin:0 0 22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}.choiceRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-weight:750}.choice.sel{outline:2px solid var(--ink);background:var(--soft)}.details{display:none;margin-top:14px;padding-top:12px;border-top:1px solid #eee}.details.on{display:block}label{display:block;font-size:13px;font-weight:750;margin-top:9px}.field{width:100%;border:1px solid #ccc5bb;border-radius:12px;background:#fff;color:var(--ink);padding:13px;font-size:16px;margin:6px 0 10px}.toggle{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0}.toggle input{width:22px;height:22px}.btn{width:100%;border:0;border-radius:13px;background:var(--ink);color:#fff;padding:14px 16px;font-size:16px;font-weight:800;margin-top:10px}.notice{display:none;border-radius:13px;padding:12px;margin:12px 0;background:#f3e8dd;color:#7a5539;line-height:1.4}.notice.on{display:block}.small{font-size:12px;color:var(--muted);line-height:1.45}.custom{padding:11px 0;border-top:1px solid #eee}.custom label{margin-top:0}.success{text-align:center;padding:42px 0}.success .card{text-align:left}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}@media(max-width:440px){h1{font-size:36px}.wrap{padding-left:16px;padding-right:16px}}</style></head><body><main class="wrap"><section id="app"><div class="card"><div class="small">Cargando vuestra invitación…</div></div></section></main><script>(()=>{const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp',q=new URLSearchParams(location.search),token=q.get('t')||'',guestId=q.get('g')||'',guestName=(q.get('n')||'Invitado').trim(),app=document.getElementById('app');let cfg={},attend=null,custom={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function j(url,opt={}){const r=await fetch(url,opt),x=await r.json().catch(()=>({}));if(!r.ok||!x.ok)throw new Error(x.error||'request_failed');return x}function meals(){return['Estándar','Vegetariano','Vegano','Celíaco','Sin lactosa','Infantil','Sin menú'].map(x=>`<option>${x}</option>`).join('')}function customHtml(){const xs=Array.isArray(cfg.customQuestions)?cfg.customQuestions:[];return xs.map(x=>{const id=esc(x.id),label=esc(x.label)+(x.required?' *':'');if(x.type==='yesno')return `<div class="custom" data-q="${id}" data-type="yesno" data-required="${x.required?'1':'0'}"><label>${label}</label><div class="choiceRow"><button type="button" class="choice" data-v="yes">Sí</button><button type="button" class="choice" data-v="no">No</button></div></div>`;if(x.type==='select')return `<div class="custom" data-q="${id}" data-type="select" data-required="${x.required?'1':'0'}"><label>${label}</label><select class="field cv"><option value="">Elige una opción</option>${(x.options||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`;return `<div class="custom" data-q="${id}" data-type="text" data-required="${x.required?'1':'0'}"><label>${label}</label><input class="field cv" maxlength="600" placeholder="Escribe aquí…"></div>`}).join('')}function render(){app.innerHTML=`<div class="small">RSVP</div><h1>${esc(guestName||'Invitado')}</h1><p class="lead">Confirma tu asistencia y responde solo a la información que la pareja necesita para organizar la boda.</p><section class="card"><div class="choiceRow"><button id="yes" class="choice" type="button">Sí, asistiré</button><button id="no" class="choice" type="button">No podré asistir</button></div><div id="details" class="details"><div id="mealBlock"><label>Menú</label><select id="meal" class="field">${meals()}</select></div><div id="allergyBlock"><label>Alergias o intolerancias</label><input id="allergy" class="field" placeholder="Lo que debamos saber"></div><label id="transportWrap" class="toggle"><span>Necesito transporte</span><input id="transport" type="checkbox"></label><label id="accommodationWrap" class="toggle"><span>Me quedaré a dormir / necesito alojamiento</span><input id="accommodation" type="checkbox"></label><div id="plusWrap"><label>Acompañante / +1</label><input id="plusone" class="field" placeholder="Nombre del acompañante"></div>${customHtml()}</div><div id="fb" class="notice"></div><button id="send" class="btn">Enviar respuesta</button></section>`;const yes=document.getElementById('yes'),no=document.getElementById('no'),details=document.getElementById('details');function choose(v){attend=v;yes.classList.toggle('sel',v===true);no.classList.toggle('sel',v===false);details.classList.toggle('on',v===true)}yes.onclick=()=>choose(true);no.onclick=()=>choose(false);if(cfg.questions?.meal===false)document.getElementById('mealBlock').style.display='none';if(cfg.questions?.allergy===false)document.getElementById('allergyBlock').style.display='none';if(cfg.transportOffered===false||cfg.questions?.transport===false)document.getElementById('transportWrap').style.display='none';if(cfg.accommodationOffered!==true)document.getElementById('accommodationWrap').style.display='none';if(cfg.questions?.plusone===false)document.getElementById('plusWrap').style.display='none';app.querySelectorAll('[data-q][data-type="yesno"]').forEach(box=>box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{box.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('sel',x===b));custom[box.dataset.q]=b.dataset.v==='yes'}));document.getElementById('send').onclick=submit}function collectCustom(){const out={...custom};for(const box of app.querySelectorAll('[data-q]')){if(box.dataset.type==='yesno')continue;const v=box.querySelector('.cv')?.value?.trim()||'';if(v)out[box.dataset.q]=v}return out}function missingRequired(){if(attend!==true)return null;for(const box of app.querySelectorAll('[data-q][data-required="1"]')){const id=box.dataset.q,ok=box.dataset.type==='yesno'?typeof custom[id]==='boolean':!!box.querySelector('.cv')?.value?.trim();if(!ok)return box}return null}async function submit(){const fb=document.getElementById('fb'),b=document.getElementById('send');if(attend===null){fb.className='notice on';fb.textContent='Indica primero si asistirás.';return}const miss=missingRequired();if(miss){fb.className='notice on';fb.textContent='Falta responder una pregunta obligatoria.';miss.scrollIntoView({behavior:'smooth',block:'center'});return}b.disabled=true;b.textContent='Enviando…';const meal=document.getElementById('meal')?.value||'Sin menú',plus=document.getElementById('plusone')?.value?.trim()||'',payload={action:'submit',token,client_submission_id:(crypto.randomUUID?crypto.randomUUID():'single_'+Date.now()),guest_key:guestId,name:guestName||'Invitado',attend,age:null,meal_required:attend&&cfg.questions?.meal!==false?meal!=='Sin menú':null,meal:attend&&cfg.questions?.meal!==false&&meal!=='Sin menú'?meal:'',allergy:attend&&cfg.questions?.allergy!==false?(document.getElementById('allergy')?.value.trim()||''):'',transport:attend&&!!document.getElementById('transport')?.checked,accommodation:attend&&!!document.getElementById('accommodation')?.checked,plusone_details:attend&&plus?{name:plus}:null,custom_answers:attend?collectCustom():{},event_responses:{},children:[]};try{await j(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});app.innerHTML=`<div class="success"><div class="small">RESPUESTA ENVIADA</div><h1>Gracias</h1><p class="lead">Tu respuesta se ha guardado correctamente.</p><div class="card"><b>${esc(guestName||'Invitado')}</b><div class="small" style="margin-top:5px">${attend?'Asiste':'No asiste'}</div></div><button class="btn secondary" onclick="history.back()">Volver a la invitación</button></div>`;window.scrollTo({top:0,behavior:'smooth'})}catch{b.disabled=false;b.textContent='Enviar respuesta';fb.className='notice on';fb.textContent='No se ha podido guardar. Comprueba la conexión y vuelve a intentarlo.'}}async function init(){if(!token||!guestId){app.innerHTML='<div class="card"><h1>RSVP no disponible</h1><p class="lead">Pide que te reenvíen la invitación.</p></div>';return}try{const x=await j(API+'?token='+encodeURIComponent(token));cfg=x.form?.config||{};render()}catch{app.innerHTML='<div class="card"><h1>RSVP no disponible</h1><p class="lead">Comprueba la conexión y vuelve a intentarlo.</p></div>'}}init()})();</script></body></html>
