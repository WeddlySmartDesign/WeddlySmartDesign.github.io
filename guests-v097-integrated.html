.v97toast small{display:block;color:#ddd5c8;margin-top:4px}.v97card{border:1px solid #d8d0c5}.v97actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.v97map{display:grid;gap:14px}.v97group{border:1px solid #d9d1c6;border-radius:18px;background:#faf8f4;overflow:hidden}.v97groupHead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 16px;border-bottom:1px solid #e7e0d7}.v97groupHead b{font-size:17px}.v97groupBody{padding:12px;display:grid;gap:10px}.v97unit{background:#fff;border:1px solid #ddd5c8;border-radius:15px;padding:12px}.v97unitTop{display:flex;justify-content:space-between;gap:8px;align-items:center}.v97people{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.v97person{border:1px solid #ded7cd;background:#fff;border-radius:999px;padding:8px 10px;font-size:13px}.v97loose{display:flex;flex-wrap:wrap;gap:7px}.v97empty{font-size:13px;color:#706b65;padding:4px 0}.v97mini{padding:8px 10px!important;font-size:13px!important}.v97legend{font-size:13px;color:#706b65;line-height:1.45;margin:8px 0 14px}.v97sheetTitle{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.v97sheetTitle .btn{flex:0 0 auto}.v97pick{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #eee}.v97pick input{width:22px;height:22px;flex:0 0 auto}.v97pick .grow{flex:1}.v97sticky{position:sticky;bottom:-22px;background:#fff;padding:14px 0 2px;margin-top:8px}.v97crumb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#706b65}.v97pill{font-size:12px;background:#eee8df;border-radius:999px;padding:6px 9px}.v97topline{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.v97unorg{border:1px dashed #c9c0b5;background:#fff}.v97mapbtn{width:100%}';d.head.appendChild(s)}function openSheet(d,html){const p=d.getElementById('panel'),sh=d.getElementById('sheet');if(!p||!sh)return null;p.innerHTML=html;sh.classList.add('on');const nav=d.querySelector('.nav');if(nav)nav.style.pointerEvents='none';const close=()=>{sh.classList.remove('on');p.innerHTML='';if(nav)nav.style.pointerEvents='auto'};sh.onclick=e=>{if(e.target===sh)close()};p.onclick=e=>e.stopPropagation();return{p,close}}function groups(){const defaults=['Familia novia','Familia novio','Amigos','Trabajo','Otros'];const custom=Object.values(STRUCT.people).map(x=>x.group_name).filter(Boolean);return [...new Set([...defaults,...custom])].sort((a,b)=>a.localeCompare(b,'es'))}function unitName(k){return STRUCT.units.find(u=>u.unit_key===k)?.name||''}async function sync(){if(busy)return;const mt=memberToken();if(!mt)return;busy=true;try{const r=await fetch(API,{headers:{'x-weddly-token':mt}}),data=await r.json();if(!r.ok||!data.ok)throw 0;STRUCT.people={};(data.people||[]).forEach(x=>STRUCT.people[x.guest_key]=x);STRUCT.units=data.units||[];patch()}catch{}finally{busy=false}}async function savePerson(id,changes){const cur=STRUCT.people[id]||{};const body={action:'save_person',guest_key:id,group_name:changes.group_name!==undefined?changes.group_name:(cur.group_name||''),unit_key:changes.unit_key!==undefined?changes.unit_key:(cur.unit_key||''),relation_role:''};const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':memberToken()},body:JSON.stringify(body)}),data=await r.json();if(!r.ok||!data.ok)throw 0;STRUCT.people[id]=data.person;return data.person}function patch(){const x=C();if(!x||!x.S)return;const{d,w,S}=x;style(d);const old=d.querySelector('[data-v96-structure]');if(old)old.style.display='none';const inv=d.getElementById('invitados');if(!inv)return;let card=inv.querySelector('[data-v97-structure]');if(!card){card=d.createElement('div');card.className='card v97card';card.setAttribute('data-v97-structure','1');const pending=inv.querySelector('[data-v95-pending]'),entry=inv.querySelector('[data-rsvp-entry]');(pending||entry)?(pending||entry).insertAdjacentElement('afterend',card):inv.prepend(card)}const ids=Object.keys(S.guests||{}),grouped=ids.filter(id=>STRUCT.people[id]?.group_name).length,unitPeople=ids.filter(id=>STRUCT.people[id]?.unit_key).length;card.innerHTML='<div class="sectiontag">Organización</div><b style="font-size:20px">Mapa de invitados</b><p class="small">Ve de un vistazo los grupos, las unidades y quién está dentro de cada una. Toca cualquier bloque para reorganizarlo.</p><div class="v97topline"><span class="v97pill">'+grouped+' con grupo</span><span class="v97pill">'+unitPeople+' en unidad</span><span class="v97pill">'+STRUCT.units.length+' unidades</span></div><button class="btn soft v97mapbtn" data-map>Abrir mapa visual</button>';card.querySelector('[data-map]').onclick=()=>openMap(d,w,S)}function mapData(S){const all=Object.entries(S.guests||{});const gs=new Map();for(const [id,g] of all){const m=STRUCT.people[id]||{},group=m.group_name||'Sin organizar';if(!gs.has(group))gs.set(group,{units:new Map(),loose:[]});const bucket=gs.get(group);if(m.unit_key){if(!bucket.units.has(m.unit_key))bucket.units.set(m.unit_key,[]);bucket.units.get(m.unit_key).push([id,g])}else bucket.loose.push([id,g])}return gs}function openMap(d,w,S){const data=mapData(S),order=[...data.keys()].sort((a,b)=>a==='Sin organizar'?1:b==='Sin organizar'?-1:a.localeCompare(b,'es'));const blocks=order.map(group=>{const b=data.get(group);const units=[...b.units.entries()].map(([key,members])=>'<div class="v97unit"><div class="v97unitTop"><div><b>'+esc(unitName(key)||'Unidad')+'</b><div class="small">'+members.length+' miembro'+(members.length===1?'':'s')+'</div></div><button class="btn soft v97mini" data-unit="'+esc(key)+'">Editar</button></div><div class="v97people">'+members.map(([id,g])=>'<button class="v97person" data-person="'+esc(id)+'">'+esc(g.name)+'</button>').join('')+'</div></div>').join('');const loose=b.loose.length?'<div><div class="small" style="margin-bottom:7px">Sin unidad</div><div class="v97loose">'+b.loose.map(([id,g])=>'<button class="v97person" data-person="'+esc(id)+'">'+esc(g.name)+'</button>').join('')+'</div></div>':'';return '<section class="v97group '+(group==='Sin organizar'?'v97unorg':'')+'"><div class="v97groupHead"><div><b>'+esc(group)+'</b><div class="small">'+(b.loose.length+[...b.units.values()].reduce((n,a)=>n+a.length,0))+' personas</div></div><button class="btn soft v97mini" data-group="'+esc(group)+'">Editar</button></div><div class="v97groupBody">'+(units||'')+(loose||'<div class="v97empty">Sin personas fuera de unidades.</div>')+'</div></section>'}).join('');const o=openSheet(d,'<div class="v97sheetTitle"><div><div class="sectiontag">Organización</div><h2 style="margin-bottom:8px">Mapa de invitados</h2></div><button class="btn soft v97mini" data-close>Hecho</button></div><p class="v97legend">Grupo = de qué parte de vuestra vida viene. Unidad = personas que queréis tratar juntas para invitación/gestión. Las mesas siguen siendo independientes.</p><div class="v97actions"><button class="btn soft" data-newgroup>+ Grupo</button><button class="btn soft" data-newunit>+ Unidad</button></div><div class="v97map" style="margin-top:14px">'+blocks+'</div>');if(!o)return;o.p.querySelector('[data-close]').onclick=o.close;o.p.querySelector('[data-newgroup]').onclick=()=>createGroup(d,w,S);o.p.querySelector('[data-newunit]').onclick=()=>createUnit(d,w,S);o.p.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>editGroup(b.dataset.group,d,w,S));o.p.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>editUnit(b.dataset.unit,d,w,S));o.p.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>editPerson(b.dataset.person,d,w,S))}function createGroup(d,w,S){const o=openSheet(d,'<div class="v97crumb">Nuevo grupo</div><h2>Crear grupo</h2><label>Nombre</label><input id="v97gname" class="field" placeholder="Ej. Amigos universidad"><p class="small">Después eliges todas las personas que pertenecen a él, sin salir de este flujo.</p><div class="actions"><button class="btn soft" data-back>Volver al mapa</button><button class="btn" data-next>Elegir personas</button></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openMap(d,w,S);o.p.querySelector('[data-next]').onclick=()=>{const name=o.p.querySelector('#v97gname').value.trim();if(name)editGroup(name,d,w,S)}}function editGroup(group,d,w,S){const rows=Object.entries(S.guests).map(([id,g])=>{const cur=STRUCT.people[id]?.group_name||'';return '<label class="v97pick"><input type="checkbox" data-id="'+esc(id)+'" '+(cur===group?'checked':'')+'><div class="grow"><b>'+esc(g.name)+'</b><div class="small">'+esc(cur||'Sin grupo')+'</div></div></label>'}).join('');const o=openSheet(d,'<div class="v97sheetTitle"><div><div class="v97crumb">Grupo</div><h2 style="margin-bottom:6px">'+esc(group)+'</h2></div><button class="btn soft v97mini" data-back>Volver</button></div><p class="small">Marca o desmarca personas. Al guardar volverás directamente al mapa.</p><div>'+rows+'</div><div class="v97sticky"><button class="btn" style="width:100%" data-save>Guardar grupo</button></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openMap(d,w,S);o.p.querySelector('[data-save]').onclick=async()=>{const btn=o.p.querySelector('[data-save]'),checks=[...o.p.querySelectorAll('[data-id]')];btn.disabled=true;btn.textContent='Guardando…';try{for(const c of checks){const id=c.dataset.id,cur=STRUCT.people[id]?.group_name||'';if(c.checked&&cur!==group)await savePerson(id,{group_name:group});else if(!c.checked&&cur===group)await savePerson(id,{group_name:''});const g=S.guests[id];if(g)g.group=STRUCT.people[id]?.group_name||''}if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();toast(d,'Grupo actualizado',group);setTimeout(()=>openMap(d,w,S),60)}catch{btn.disabled=false;btn.textContent='Guardar grupo';toast(d,'No se ha guardado','Reintenta cuando tengas conexión.')}}}async function createUnit(d,w,S){const o=openSheet(d,'<div class="v97crumb">Nueva unidad</div><h2>Crear unidad</h2><label>Nombre</label><input id="v97uname" class="field" placeholder="Ej. Familia Rodríguez"><p class="small">Una unidad es solo una forma de tratar varias personas juntas. No define por sí sola quién es pareja de quién ni obliga a sentarlas juntas.</p><div class="actions"><button class="btn soft" data-back>Volver al mapa</button><button class="btn" data-next>Elegir miembros</button></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openMap(d,w,S);o.p.querySelector('[data-next]').onclick=async()=>{const name=o.p.querySelector('#v97uname').value.trim();if(!name)return;const btn=o.p.querySelector('[data-next]');btn.disabled=true;try{const key='u_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':memberToken()},body:JSON.stringify({action:'save_unit',unit_key:key,name})}),data=await r.json();if(!r.ok||!data.ok)throw 0;STRUCT.units.push(data.unit);editUnit(key,d,w,S)}catch{btn.disabled=false;toast(d,'No se ha creado','Reintenta con conexión.')}}}function editUnit(key,d,w,S){const name=unitName(key)||'Unidad';const rows=Object.entries(S.guests).map(([id,g])=>{const cur=STRUCT.people[id]?.unit_key||'';return '<label class="v97pick"><input type="checkbox" data-id="'+esc(id)+'" '+(cur===key?'checked':'')+'><div class="grow"><b>'+esc(g.name)+'</b><div class="small">'+esc(cur?unitName(cur):'Sin unidad')+'</div></div></label>'}).join('');const o=openSheet(d,'<div class="v97sheetTitle"><div><div class="v97crumb">Unidad</div><h2 style="margin-bottom:6px">'+esc(name)+'</h2></div><button class="btn soft v97mini" data-back>Volver</button></div><p class="small">Selecciona todos sus miembros. No preguntamos “pareja” o “+1” aquí porque esas relaciones solo tienen sentido vinculadas a otra persona.</p><div>'+rows+'</div><div class="v97sticky"><button class="btn" style="width:100%" data-save>Guardar unidad</button></div>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openMap(d,w,S);o.p.querySelector('[data-save]').onclick=async()=>{const btn=o.p.querySelector('[data-save]'),checks=[...o.p.querySelectorAll('[data-id]')];btn.disabled=true;btn.textContent='Guardando…';try{for(const c of checks){const id=c.dataset.id,cur=STRUCT.people[id]?.unit_key||'';if(c.checked&&cur!==key)await savePerson(id,{unit_key:key});else if(!c.checked&&cur===key)await savePerson(id,{unit_key:''});const g=S.guests[id];if(g)g.unitId=STRUCT.people[id]?.unit_key||''}if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();toast(d,'Unidad actualizada',name);setTimeout(()=>openMap(d,w,S),60)}catch{btn.disabled=false;btn.textContent='Guardar unidad';toast(d,'No se ha guardado','Reintenta cuando tengas conexión.')}}}function editPerson(id,d,w,S){const g=S.guests[id],m=STRUCT.people[id]||{};if(!g)return;const gopts='<option value="">Sin grupo</option>'+groups().map(x=>'<option value="'+esc(x)+'" '+(m.group_name===x?'selected':'')+'>'+esc(x)+'</option>').join('');const uopts='<option value="">Sin unidad</option>'+STRUCT.units.map(u=>'<option value="'+esc(u.unit_key)+'" '+(m.unit_key===u.unit_key?'selected':'')+'>'+esc(u.name)+'</option>').join('');const o=openSheet(d,'<div class="v97sheetTitle"><div><div class="v97crumb">Persona</div><h2 style="margin-bottom:6px">'+esc(g.name)+'</h2></div><button class="btn soft v97mini" data-back>Volver</button></div><label>Grupo</label><select id="v97pg" class="field">'+gopts+'</select><label>Unidad</label><select id="v97pu" class="field">'+uopts+'</select><p class="small">Ajuste rápido individual. Para mover varias personas a la vez, edita directamente el grupo o la unidad desde el mapa.</p><button class="btn" style="width:100%" data-save>Guardar</button>');if(!o)return;o.p.querySelector('[data-back]').onclick=()=>openMap(d,w,S);o.p.querySelector('[data-save]').onclick=async()=>{const btn=o.p.querySelector('[data-save]');btn.disabled=true;try{const group=o.p.querySelector('#v97pg').value,unit=o.p.querySelector('#v97pu').value;await savePerson(id,{group_name:group,unit_key:unit});g.group=group;g.unitId=unit;if(typeof w.save==='function')w.save();if(typeof w.render==='function')w.render();toast(d,'Organización actualizada',g.name);setTimeout(()=>openMap(d,w,S),60)}catch{btn.disabled=false;toast(d,'No se ha guardado','Reintenta con conexión.')}}}function init(){const x=C();if(!x){setTimeout(init,300);return}patch();sync();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});setInterval(()=>{sync();patch()},9000)}OUT.addEventListener('load',()=>setTimeout(init,500));setTimeout(init,900)})();</script></body></html>
