<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weddly Smart Design · Guests v5</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}#shell{width:100%;height:100%;border:0;display:block}</style>
</head>
<body>
<iframe id="shell" src="guests-personalized-functional-v4.html?v=5-essential-raster1" title="Guests"></iframe>
<script>
(function(){
  const shell=document.getElementById('shell');
  const target='guests-rsvp-essential-admin-v2.html?v=raster1';
  function connect(){
    try{
      const outerDoc=shell.contentDocument;
      const app=outerDoc && outerDoc.getElementById('app');
      if(!app)return;
      function bindInner(){
        try{
          const innerDoc=app.contentDocument;
          if(!innerDoc)return;
          const button=innerDoc.getElementById('rsvpBtn');
          if(button && !button.dataset.essentialRaster){
            button.dataset.essentialRaster='1';
            button.addEventListener('click',function(ev){ev.preventDefault();ev.stopPropagation();window.location.href=target},true);
          }
        }catch(_e){}
      }
      app.addEventListener('load',bindInner);bindInner();
    }catch(_e){}
  }
  shell.addEventListener('load',function(){connect();setTimeout(connect,300)});
})();
</script>
</body>
</html>
