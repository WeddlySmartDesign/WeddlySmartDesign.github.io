querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;render()});const map=grouped();let html='';for(const [group,subs] of map){if(activeFilter!=='__all__'&&activeFilter!==group)continue;html+=`<section class="group"><div class="groupTitle">${safe(group)}</div>`;for(const [sub,people] of subs){html+=`<div class="subgroup"><div class="subhead"><b>${safe(sub)}</b><span>${people.length} integrante${people.length===1?'':'s'}</span></div>${people.map(g=>guestHtml(g,people,gs)).join('')}</div>`}html+='</section>'}$('content').innerHTML=html||'<div class="empty">No hay invitados en este filtro.</div>';bind()}function guestHtml(g,subPeople,all){const isRec=g.invitationRecipientId===g.id,assignedTo=!isRec&&g.invitationRecipientId?all.find(x=>x.id===g.invitationRecipientId):null,recipients=subPeople.filter(x=>x.invitationRecipientId===x.id),a=latest(g),status=statusFor(g);let extra='';if(isRec){const ms=inviteMembers(g.id,all),c=contact(g),d=delivery(invitationKey(g,ms));extra=`<div class="sendBox"><div class="sendTitle">Esta invitación incluye</div><div class="included">${safe(ms.map(x=>x.name).join(' · ')||g.name)}</div><button class="contactBtn" data-contact="${safe(g.id)}">${c.phone||c.email?'Cambiar contacto':'Elegir contacto'}</button><div class="contactLine">${safe(c.phone||c.email||'Aún no has elegido contacto')}</div><div class="actions">${c.phone?`<button class="btn mini" data-wa="${safe(g.id)}">${d.status==='sent'?'Reenviar por WhatsApp':'Enviar por WhatsApp'}</button>`:''}<button class="btn line mini" data-copy="${safe(g.id)}">Copiar enlace</button></div><span class="chip ${d.status==='sent'?'ok':''}">${d.status==='sent'?'Enviada':'Sin enviar'}</span></div>`}else if(recipients.length){extra=`<div class="assignment"><label>¿En qué invitación va ${safe(g.name)}?</label><select class="smallSelect" data-assign="${safe(g.id)}"><option value="">Sin asignar</option>${recipients.map(r=>`<option value="${safe(r.id)}" ${assignedTo?.id===r.id?'selected':''}>Con ${safe(r.name)}</option>`).join('')}</select></div>`}else if(!g.invitationRecipientId){extra=`<div class="assignment"><div class="guestMeta">Marca primero quién recibe la invitación.</div></div>`}return `<div class="guest"><div class="guestMain"><input class="recipientCheck" type="checkbox" data-recipient="${safe(g.id)}" ${isRec?'checked':''} aria-label="${isRec?'Dejar de enviar':'Enviar'} invitación a ${safe(g.name)}"><div><div class="guestName">${safe(g.name)}</div><div class="guestMeta">${safe(status)}${assignedTo?' · Va con '+safe(assignedTo.name):''}${a?.meal?' · '+safe(a.meal):''}${g.table?' · '+safe(g.table):''}</div></div><button class="manualLink" data-manual="${safe(g.id)}">Respuesta manual</button></div>${extra}</div>`}function bind(){$('content').querySelectorAll('[data-recipient]').forEach(c=>c.onchange=()=>toggleRecipient(c.dataset.recipient,c.checked));$('content').querySelectorAll('[data-assign]').forEach(s=>s.onchange=()=>assignTo(s.dataset.assign,s.value));$('content').querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>openContact(b.dataset.contact));$('content').querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>sendWA(b.dataset.wa));$('content').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copyInvite(b.dataset.copy));$('content').querySelectorAll('[data-manual]').forEach(b=>b.onclick=()=>openManual(b.dataset.manual))}async function mutate(fn,msg='Cambios guardados.'){const S=state();fn(S);putLocal(S);render();await syncFields();show(msg)}async function toggleRecipient(id,on){await mutate(S=>{const g=S.guests?.[id];if(!g)return;if(on){g.invitationRecipientId=id;g.invitationUnitId=uid();g.invitationUnitLabel=''}else{const unit=g.invitationUnitId;for(const p of Object.values(S.guests||{})){if(p.invitationRecipientId===id){delete p.invitationRecipientId;if(p.invitationUnitId===unit)delete p.invitationUnitId;delete p.invitationUnitLabel}}}},on?'Destinatario seleccionado.':'Destinatario desmarcado.')}async function assignTo(id,recipientId){await mutate(S=>{const g=S.guests?.[id];if(!g)return;if(!recipientId){delete g.invitationRecipientId;delete g.invitationUnitId;delete g.invitationUnitLabel;return}const r=S.guests?.[recipientId];if(!r||r.invitationRecipientId!==recipientId)return;g.invitationRecipientId=recipientId;g.invitationUnitId=r.invitationUnitId||(r.invitationUnitId=uid());g.invitationUnitLabel=r.invitationUnitLabel||''},recipientId?'Persona incluida en esa invitación.':'Persona sin asignar.')}function currentInvite(id){const gs=guests(),r=gs.find(g=>g.id===id);if(!r||r.invitationRecipientId!==id)return null;return{r,ms:inviteMembers(id,gs)}}async function copyInvite(id){const x=currentInvite(id);if(!x)return;try{await navigator.clipboard.writeText(publicLink(x.r,x.ms));show('Enlace copiado.')}catch{prompt('Copia este enlace:',publicLink(x.r,x.ms))}}async function sendWA(id){const x=currentInvite(id);if(!x)return;const c=contact(x.r),p=phone(c.phone);if(p.length<9||p.length>15){openContact(id);return}try{req(API,{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'delivery',token:PT,guest_key:invitationKey(x.r,x.ms),status:'sent'})}).catch(()=>{});const text=`Hola ${x.r.name}, os enviamos nuestra invitación. Podéis confirmar aquí: ${publicLink(x.r,x.ms)}`;location.href=`https://wa.me/${p}?text=${encodeURIComponent(text)}`}catch{show('No se ha podido abrir WhatsApp.',true)}}function openSheet(html){$('panel').innerHTML=html;$('sheet').classList.add('on');$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()}}function closeSheet(){$('sheet').classList.remove('on');$('panel').innerHTML=''}function openContact(id){const g=guests().find(x=>x.id===id);if(!g)return;const c=contact(g),can=!!navigator.contacts?.select;openSheet(`<div class="eyebrow">CONTACTO</div><h2>${safe(g.name)}</h2>${can?'<button id="pick" class="btn soft full" style="margin-bottom:12px">Elegir de mi agenda</button>':''}<label>Teléfono</label><input id="cp" class="field" inputmode="tel" value="${safe(c.phone)}"><label>Email</label><input id="ce" class="field" inputmode="email" value="${safe(c.email)}"><div id="cfb" class="notice"></div><div class="panelActions"><button id="cc" class="btn soft">Cancelar</button><button id="cs" class="btn">Guardar</button></div>`);$('cc').onclick=closeSheet;$('cs').onclick=()=>saveContact(id);if(can)$('pick').onclick=pickContact}async function pickContact(){const fb=$('cfb');try{const props=navigator.contacts.getProperties?await navigator.contacts.getProperties():['name','tel','email'],wanted=['name','tel','email'].filter(x=>props.includes(x)),items=await navigator.contacts.select(wanted,{multiple:false});if(!items?.length)return;const c=items[0];if(c.tel?.[0])$('cp').value=c.tel[0];if(c.email?.[0])$('ce').value=c.email[0];if(c.name?.[0]){fb.textContent='Contacto seleccionado: '+c.name[0];fb.className='notice on'}}catch(e){if(e?.name!=='AbortError'){fb.textContent='Este navegador no ha permitido abrir la agenda. Puedes introducir el contacto manualmente.';fb.className='notice on err'}}}async function saveContact(id){const b=$('cs');b.disabled=true;b.textContent='Guardando…';try{await req(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'contact',token:PT,guest_key:id,phone:$('cp').value.trim(),email:$('ce').value.trim()})});closeSheet();await load();show('Contacto guardado.')}catch{b.disabled=false;b.textContent='Guardar';$('cfb').textContent='No se ha podido guardar.';$('cfb').className='notice on err'}}function openManual(id){const g=guests().find(x=>x.id===id);if(!g)return;openSheet(`<div class="eyebrow">RSVP</div><h2>Respuesta manual</h2><p class="lead">${safe(g.name)}</p><label>Asistencia</label><select id="ma" class="field"><option value="yes">Asiste</option><option value="no">No asiste</option></select><label>Menú</label><select id="mm" class="field"><option>Estándar</option><option>Vegetariano</option><option>Vegano</option><option>Celíaco</option><option>Sin lactosa</option><option>Infantil</option><option>Sin menú</option></select><label>Alergias o intolerancias</label><input id="mal" class="field"><label class="toggle"><span>Necesita transporte</span><input id="mtr" type="checkbox"></label><div id="mfb" class="notice"></div><div class="panelActions"><button id="mc" class="btn soft">Cancelar</button><button id="ms" class="btn">Guardar respuesta</button></div>`);$('mc').onclick=closeSheet;$('ms').onclick=()=>saveManual(id)}async function saveManual(id){const g=guests().find(x=>x.id===id),b=$('ms');if(!g)return;b.disabled=true;b.textContent='Guardando…';const attend=$('ma').value==='yes',meal=$('mm').value,payload={action:'manual_submit',client_submission_id:(crypto.randomUUID?crypto.randomUUID():'manual_'+Date.now()),guest_key:id,name:g.name,attend,age:null,meal_required:attend?meal!=='Sin menú':null,meal:attend&&meal!=='Sin menú'?meal:'',allergy:attend?$('mal').value.trim():'',transport:attend&&$('mtr').checked,plusone:''};try{await req(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify(payload)});closeSheet();await load();show('Respuesta guardada.')}catch{b.disabled=false;b.textContent='Guardar respuesta';$('mfb').textContent='No se ha podido guardar.';$('mfb').className='notice on err'}}$('back').onclick=()=>location.assign('guests.html#invitados');$('editInvitation').onclick=()=>location.assign('guests-rsvp-design-manage.html');load().catch(e=>{$('content').innerHTML='<div class="empty">No se han podido cargar los invitados.</div>';show(e.message==='missing_access'?'Este dispositivo no tiene acceso a la boda.':'No se ha podido cargar el RSVP.',true)})})();</script></body></html>
