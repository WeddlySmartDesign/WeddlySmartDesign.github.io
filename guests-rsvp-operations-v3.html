alc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.panelActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.pickRow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}.pickRow input{width:20px;height:20px;margin-top:2px}.pickRow b{font-size:13px}.pickRow span span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.inviteRow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;margin:8px 0;color:var(--ink)}.inviteRow b{display:block;font-size:14px}.inviteRow span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.hint{background:var(--soft);border-radius:14px;padding:12px;font-size:13px;line-height:1.45;margin:12px 0}.empty{text-align:center;color:var(--muted);padding:24px 10px}.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.toggle input{width:22px;height:22px}

</style></head><body><main class="app"><div class="top"><div class="brand"><b>Weddly</b><span>Smart Design</span></div><div class="topActions"><button class="btn line" id="editInvitation"><span class="editLabel">Editar </span>invitación</button><button class="btn soft" id="back">← Invitados</button></div></div><div class="eyebrow">RSVP</div><h1>Envíos y respuestas</h1><p class="lead">Cada tarjeta de abajo es una invitación real: puede incluir una persona, una pareja o varias personas que compartirán el mismo enlace.</p><div id="notice" class="notice"></div><div id="metrics" class="metrics"><div class="metric"><b>—</b><span>invitaciones</span></div><div class="metric"><b>—</b><span>enviadas</span></div><div class="metric"><b>—</b><span>personas respondidas</span></div></div><div class="toolbar"><button class="btn" id="refresh">Actualizar respuestas</button><button class="btn soft" id="organize">Revisar quién recibe cada invitación</button></div><section id="units"><div class="empty">Cargando invitaciones…</div></section></main><div id="sheet" class="sheet"><div id="panel" class="panel"></div></div><script>
(()=>{
const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp',GAPI='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-guests-state',FALLBACK='sP3vW6aT-B_5-ctfsY06D3rHOkwM0gXUs5i0aGfiH-8',GKEY='weddly_guests_qa_v67',RKEY='weddly_guests_rsvp_v82',PREF='weddly_invite_unit_recipient_v1',TOKEN_KEY='weddly_shared_wedding_token';
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),norm=s=>String(s||'').trim().toLowerCase(),uid=()=>`iu_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;let remote={forms:[],submissions:[],contacts:[],delivery:[]},PT=FALLBACK;
function theme(){try{const x=localStorage.getItem('weddly_personal_theme_v51')||localStorage.getItem('weddly_personal_theme_v20')||'nordic';return['nordic','blush','sand','slate','editorial'].includes(x)?x:'nordic'}catch{return'nordic'}}document.documentElement.dataset.theme=theme();
const mt=()=>{try{return localStorage.getItem(TOKEN_KEY)||''}catch{return''}};
function state(){try{const s=JSON.parse(localStorage.getItem(GKEY)||'null')||{};s.guests=s.guests||{};return s}catch{return{guests:{}}}}function putLocal(s){localStorage.setItem(GKEY,JSON.stringify(s))}
function guests(){return Object.entries(state().guests||{}).map(([id,g])=>({id,...g}))}
function prefs(){try{return JSON.parse(localStorage.getItem(PREF)||'{}')||{}}catch{return{}}}function setPref(k,v){const p=prefs();p[k]=v;localStorage.setItem(PREF,JSON.stringify(p))}
function localR(){try{return JSON.parse(localStorage.getItem(RKEY)||'{}')||{}}catch{return{}}}
function show(msg,err=false){const n=$('notice');n.textContent=msg;n.className='notice on'+(err?' err':'');clearTimeout(show.t);show.t=setTimeout(()=>n.className='notice',2800)}
async function req(url,opt={}){const r=await fetch(url,opt),x=await r.json().catch(()=>({}));if(!r.ok||!x.ok){const e=new Error(x.error||'request_failed');e.status=r.status;e.data=x;throw e}return x}
async function claim(token){if(!mt())throw new Error('missing_access');return req(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'claim',token})})}
function latest(g){return(remote.submissions||[]).filter(x=>(x.guest_key&&x.guest_key===g.id)||(!x.guest_key&&norm(x.name)===norm(g.name))).sort((a,b)=>new Date(b.received_at)-new Date(a.received_at))[0]}
function contact(g){const r=(remote.contacts||[]).find(x=>x.guest_key===g.id)||{},l=localR().contacts?.[g.id]||{};return{phone:r.phone||l.phone||g.phone||'',email:r.email||l.email||g.email||''}}
function delivery(k){const r=(remote.delivery||[]).find(x=>x.guest_key===k)||{},l=localR().delivery?.[k]||{};return Object.keys(r).length?r:l}
function units(){const out=[],map=new Map();for(const g of guests()){const actual=!!g.invitationUnitId,key=actual?g.invitationUnitId:'single:'+g.id;if(!map.has(key)){const u={id:key,actual,members:[],label:''};map.set(key,u);out.push(u)}const u=map.get(key);u.members.push(g);if(!u.label&&g.invitationUnitLabel)u.label=g.invitationUnitLabel}return out}
function cleanLabel(u){const l=String(u?.label||'').trim();if(!l)return'';if(/^invitaci[oó]n conjunta$/i.test(l))return'';if(u.members.length>1&&u.members.some(g=>norm(g.name)===norm(l)))return'';if(u.members.length===1)return'';return l}
function joinNames(names){if(names.length<=1)return names[0]||'Invitación';if(names.length===2){const c=/^(i|hi)/i.test(names[1])?' e ':' y ';return names[0]+c+names[1]}if(names.length===3)return `${names[0]}, ${names[1]} y ${names[2]}`;return `${names[0]}, ${names[1]} y ${names.length-2} más`}
function title(u){return cleanLabel(u)||joinNames(u.members.map(g=>g.name||'Sin nombre'))}
function context(u){const groups=[...new Set(u.members.map(g=>String(g.group||'').trim()).filter(Boolean))];return `${u.members.length} persona${u.members.length===1?'':'s'}${groups.length===1?' · '+groups[0]:''}`}
function deliveryKey(u){return u.actual&&u.members.length>1?'unit:'+u.id:u.members[0]?.id||u.id}
function publicLink(u){const base=location.origin+'/guests-rsvp-v105.html?guest=1&t='+encodeURIComponent(PT);return u.actual&&u.members.length>1?base+'&u='+encodeURIComponent(u.id):base+'&g='+encodeURIComponent(u.members[0].id)}
function recipient(u){const shared=u.members.map(g=>g.invitationRecipientId).find(id=>id&&u.members.some(x=>x.id===id));if(shared){const x=u.members.find(g=>g.id===shared);if(x)return x}const p=prefs()[u.id],byId=u.members.find(x=>x.id===p);if(byId)return byId;return u.members.find(x=>contact(x).phone)||u.members[0]}
function phone(raw){const o=String(raw||'').trim();let d=o.replace(/\D/g,'');if(o.startsWith('00'))d=d.slice(2);if(o.startsWith('+'))return d;if(d.length===9&&/^[6789]/.test(d))return'34'+d;return d}
const UNIT_FIELDS=['invitationUnitId','invitationUnitLabel','invitationRecipientId'];
async function syncUnitFields(){if(!mt())return;const local=state();try{const g=await req(GAPI,{headers:{'x-weddly-token':mt()},cache:'no-store'}),merge=base=>{base=base&&typeof base==='object'?structuredClone(base):structuredClone(local);base.guests=base.guests||{};for(const[id,lg]of Object.entries(local.guests||{})){if(!base.guests[id])base.guests[id]=lg;else UNIT_FIELDS.forEach(k=>{if(Object.prototype.hasOwnProperty.call(lg,k))base.guests[id][k]=lg[k]})}return base};let base=merge(g.state),r=await fetch(GAPI,{method:'PUT',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({version:g.version||0,state:base})}),x=await r.json().catch(()=>({}));if(r.status===409&&x.server){base=merge(x.server.state);r=await fetch(GAPI,{method:'PUT',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({version:x.server.version||0,state:base})});x=await r.json().catch(()=>({}))}if(r.ok&&x.ok)putLocal(base)}catch{}}
async function load(){if(!mt())throw new Error('missing_access');await syncUnitFields();remote=await req(API+'?manage=1',{headers:{'x-weddly-token':mt()},cache:'no-store'});const f=remote.forms?.[0];if(f?.public_token)PT=f.public_token;else{await claim(PT).catch(()=>{});remote=await req(API+'?manage=1',{headers:{'x-weddly-token':mt()},cache:'no-store'});if(remote.forms?.[0]?.public_token)PT=remote.forms[0].public_token}render()}
function statusFor(g){const a=latest(g);return a?(a.attend?'Confirmado':'No asiste'):(g.rsvp==='confirmed'?'Confirmado':g.rsvp==='declined'?'No asiste':'Sin respuesta')}
function render(){const us=units(),sent=us.filter(u=>delivery(deliveryKey(u)).status==='sent').length,answered=guests().filter(g=>latest(g)||g.rsvp==='confirmed'||g.rsvp==='declined').length;$('metrics').innerHTML=`<div class="metric"><b>${us.length}</b><span>invitaciones</span></div><div class="metric"><b>${sent}</b><span>enviadas</span></div><div class="metric"><b>${answered}</b><span>personas respondidas</span></div>`;$('units').innerHTML=us.map(unitHtml).join('')||'<div class="empty">Aún no hay invitados.</div>';bind()}
function responseRow(g){const s=statusFor(g),a=latest(g);return `<div class="person"><div><div class="personName">${safe(g.name)}</div><div class="personMeta">${safe(s)}${a?.meal?' · '+safe(a.meal):''}${g.table?' · '+safe(g.table):''}</div></div><button class="btn line mini" data-manual="${safe(g.id)}">Respuesta manual</button></div>`}
function unitHtml(u){const r=recipient(u),c=contact(r),d=delivery(deliveryKey(u)),has=!!(c.phone||c.email),answered=u.members.filter(g=>latest(g)||g.rsvp==='confirmed'||g.rsvp==='declined').length,sendTo=u.members.length>1?`<div class="recipientLabel">Se la enviaremos a</div><select class="field" data-recipient="${safe(u.id)}">${u.members.map(g=>`<option value="${safe(g.id)}" ${g.id===r.id?'selected':''}>${safe(g.name)}</option>`).join('')}</select>`:`<div class="recipientLabel">Se la enviaremos a</div><div style="font-weight:800;padding:5px 1px 2px">${safe(r?.name||'')}</div>`;const responses=u.members.length===1?`<div class="singleResponse"><div><div class="personMeta">${safe(statusFor(u.members[0]))}${u.members[0].table?' · '+safe(u.members[0].table):''}</div></div><button class="btn line mini" data-manual="${safe(u.members[0].id)}">Respuesta manual</button></div>`:`<details class="responses"><summary><span>Respuestas de esta invitación</span><span class="personMeta">${answered}/${u.members.length}</span></summary>${u.members.map(responseRow).join('')}</details>`;return `<article class="unit"><div class="uhead"><div><div class="uname">${safe(title(u))}</div><div class="context">${safe(context(u))}</div></div><button class="btn line mini" data-editunit="${safe(u.id)}">Editar</button></div><div class="chips"><span class="chip ${d.status==='sent'?'ok':''}">${d.status==='sent'?'Invitación enviada':'Sin enviar'}</span></div><div class="sendBox">${sendTo}<button class="${has?'btn line':'btn'} contactBtn" data-contact="${safe(r.id)}" data-unitcontact="${safe(u.id)}">${has?'Cambiar contacto':'Elegir contacto'}</button>${has?`<div class="contactLine">${safe(c.phone||c.email)}</div>`:''}<div class="actions">${c.phone?`<button class="btn mini" data-wa="${safe(u.id)}">${d.status==='sent'?'Reenviar por WhatsApp':'Enviar por WhatsApp'}</button>`:''}<button class="btn line mini" data-copy="${safe(u.id)}">Copiar enlace</button></div></div>${responses}</article>`}
function bind(){$('units').querySelectorAll('[data-recipient]').forEach(s=>s.onchange=()=>setRecipient(s.dataset.recipient,s.value));$('units').querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>openContact(b.dataset.contact,b.dataset.unitcontact));$('units').querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>sendWA(b.dataset.wa));$('units').querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const u=units().find(x=>x.id===b.dataset.copy);if(u)copy(publicLink(u))});$('units').querySelectorAll('[data-manual]').forEach(b=>b.onclick=()=>openManual(b.dataset.manual));$('units').querySelectorAll('[data-editunit]').forEach(b=>b.onclick=()=>openEditInvitation(b.dataset.editunit))}
async function setRecipient(unitId,id){const u=units().find(x=>x.id===unitId);if(!u)return;setPref(unitId,id);const S=state();u.members.forEach(m=>{if(S.guests?.[m.id])S.guests[m.id].invitationRecipientId=id});putLocal(S);render();syncUnitFields().catch(()=>{})}
function openSheet(html){$('panel').innerHTML=html;$('sheet').classList.add('on');$('sheet').onclick=e=>{if(e.target===$('sheet'))closeSheet()}}function closeSheet(){$('sheet').classList.remove('on');$('panel').innerHTML=''}
function openContact(id,unitId=''){const g=guests().find(x=>x.id===id);if(!g)return;const c=contact(g),can=!!navigator.contacts?.select;openSheet(`<div class="eyebrow">CONTACTO</div><h2>${safe(g.name)}</h2><p class="lead">Este es el contacto al que se enviará la invitación.</p>${can?'<button id="pick" class="btn" style="width:100%;margin-bottom:12px">Elegir de mi agenda</button>':''}<label>Teléfono</label><input id="cp" class="field" inputmode="tel" value="${safe(c.phone)}"><label>Email</label><input id="ce" class="field" inputmode="email" value="${safe(c.email)}"><div id="cfb" class="notice"></div><div class="panelActions"><button id="cc" class="btn soft">Cancelar</button><button id="cs" class="btn">Guardar</button></div>`);$('cc').onclick=closeSheet;$('cs').onclick=()=>saveContact(id);if(can)$('pick').onclick=()=>pickContact()}
async function pickContact(){const fb=$('cfb');try{const props=navigator.contacts.getProperties?await navigator.contacts.getProperties():['name','tel','email'],wanted=['name','tel','email'].filter(x=>props.includes(x)),items=await navigator.contacts.select(wanted,{multiple:false});if(!items?.length)return;const c=items[0];if(c.tel?.[0])$('cp').value=c.tel[0];if(c.email?.[0])$('ce').value=c.email[0];if(c.name?.[0]){fb.textContent='Contacto seleccionado: '+c.name[0];fb.className='notice on'}}catch(e){if(e?.name!=='AbortError'){fb.textContent='Este navegador no ha permitido abrir la agenda. Puedes introducir el contacto manualmente.';fb.className='notice on err'}}}
async function saveContact(id){const b=$('cs');b.disabled=true;b.textContent='Guardando…';try{await req(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'contact',token:PT,guest_key:id,phone:$('cp').value.trim(),email:$('ce').value.trim()})});closeSheet();await load();show('Contacto guardado.')}catch{b.disabled=false;b.textContent='Guardar';$('cfb').textContent='No se ha podido guardar.';$('cfb').className='notice on err'}}
async function copy(text){try{await navigator.clipboard.writeText(text);show('Enlace copiado.')}catch{prompt('Copia este enlace:',text)}}
async function sendWA(unitId){const u=units().find(x=>x.id===unitId);if(!u)return;const r=recipient(u),c=contact(r),p=phone(c.phone);if(p.length<9||p.length>15){openContact(r.id,u.id);return}const greeting=title(u);try{req(API,{method:'POST',keepalive:true,headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify({action:'delivery',token:PT,guest_key:deliveryKey(u),status:'sent'})}).catch(()=>{});const plural=u.members.length>1,text=plural?`Hola ${greeting}, os enviamos nuestra invitación. Podéis confirmar aquí: ${publicLink(u)}`:`Hola ${r.name}, te enviamos nuestra invitación. Puedes confirmar aquí: ${publicLink(u)}`;location.href=`https://wa.me/${p}?text=${encodeURIComponent(text)}`}catch{show('No se ha podido abrir WhatsApp.',true)}}
function openManual(id){const g=guests().find(x=>x.id===id);if(!g)return;openSheet(`<div class="eyebrow">RSVP</div><h2>Respuesta manual</h2><p class="lead">${safe(g.name)}</p><label>Asistencia</label><select id="ma" class="field"><option value="yes">Asiste</option><option value="no">No asiste</option></select><label class="toggle"><span>Necesita menú</span><input id="mn" type="checkbox" checked></label><label>Menú</label><select id="mm" class="field"><option>Estándar</option><option>Vegetariano</option><option>Vegano</option><option>Celíaco</option><option>Sin lactosa</option><option>Infantil</option></select><label>Alergias o intolerancias</label><input id="mal" class="field"><label class="toggle"><span>Necesita transporte</span><input id="mtr" type="checkbox"></label><label>Acompañante / +1</label><input id="mp" class="field"><div id="mfb" class="notice"></div><div class="panelActions"><button id="mc" class="btn soft">Cancelar</button><button id="ms" class="btn">Guardar respuesta</button></div>`);$('mc').onclick=closeSheet;$('ms').onclick=()=>saveManual(id)}
async function saveManual(id){const g=guests().find(x=>x.id===id),b=$('ms');if(!g)return;b.disabled=true;b.textContent='Guardando…';const attend=$('ma').value==='yes',need=$('mn').checked,payload={action:'manual_submit',client_submission_id:(crypto.randomUUID?crypto.randomUUID():'manual_'+Date.now()),guest_key:id,name:g.name,attend,age:null,meal_required:need,meal:need?$('mm').value:'',allergy:$('mal').value.trim(),transport:$('mtr').checked,plusone:$('mp').value.trim()};try{await req(API,{method:'POST',headers:{'content-type':'application/json','x-weddly-token':mt()},body:JSON.stringify(payload)});closeSheet();await load();show('Respuesta guardada.')}catch{b.disabled=false;b.textContent='Guardar respuesta';$('mfb').textContent='No se ha podido guardar.';$('mfb').className='notice on err'}}
function currentTitleForGuest(id){const u=units().find(x=>x.members.some(g=>g.id===id));return u?title(u):''}
function openOrganize(){const us=units();openSheet(`<div class="eyebrow">INVITACIONES</div><h2>Quién recibe cada invitación</h2><p class="lead">Tu organización y tus envíos son cosas distintas. Un grupo de seis personas puede tener tres invitaciones de dos, sin cambiar su grupo ni su mesa.</p><div class="hint"><b>Ejemplo</b><br>Familia Rodríguez · 6 personas → 3 invitaciones: José y María · Juan e Irene · Pedro y Laura.</div><div>${us.map(u=>`<button class="inviteRow" data-review="${safe(u.id)}"><span><b>${safe(title(u))}</b><span>${safe(context(u))}</span></span><strong>Editar</strong></button>`).join('')}</div><button id="newJoint" class="btn full" style="margin-top:10px">+ Crear una invitación conjunta</button><button id="orgDone" class="btn soft full" style="margin-top:9px">Hecho</button>`);$('orgDone').onclick=closeSheet;$('newJoint').onclick=()=>openEditInvitation('',true);$('panel').querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>openEditInvitation(b.dataset.review,false))}
function openEditInvitation(unitId='',creating=false){const gs=guests(),u=creating?null:units().find(x=>x.id===unitId),selected=new Set(u?.members.map(x=>x.id)||[]),custom=u?cleanLabel(u):'';openSheet(`<div class="eyebrow">INVITACIÓN</div><h2>${creating?'Crear invitación conjunta':'Editar invitación'}</h2><p class="lead">Marca únicamente a las personas que recibirán este mismo enlace. No cambia su grupo, mesa, catering ni transporte.</p><label>Nombre de esta invitación <span style="font-weight:400;color:var(--muted)">(opcional)</span></label><input id="ulabel" class="field" value="${safe(custom)}" placeholder="Ej. Padres de Ana"><div>${gs.map(g=>`<label class="pickRow"><input type="checkbox" data-pick="${safe(g.id)}" ${selected.has(g.id)?'checked':''}><span><b>${safe(g.name)}</b><span>${safe(g.group||'Sin grupo')} · Ahora: ${safe(currentTitleForGuest(g.id)||g.name)}</span></span></label>`).join('')}</div><div id="ufb" class="notice"></div><div class="panelActions"><button id="uc" class="btn soft">Volver</button><button id="us" class="btn">Guardar</button></div>${u&&u.members.length>1?'<button id="split" class="btn line full" style="margin-top:9px">Separar esta invitación</button>':''}`);$('uc').onclick=openOrganize;$('us').onclick=async()=>{const ids=[...$('panel').querySelectorAll('[data-pick]:checked')].map(x=>x.dataset.pick);if(creating&&ids.length<2){$('ufb').textContent='Selecciona al menos dos personas que compartirán la invitación.';$('ufb').className='notice on err';return}if(!creating&&!ids.length){$('ufb').textContent='Selecciona al menos una persona.';$('ufb').className='notice on err';return}await mutateUnits(S=>{if(u)u.members.forEach(m=>setIndividual(S,m.id));const newid=uid(),label=$('ulabel').value.trim();ids.forEach(id=>{const g=S.guests?.[id];if(g){g.invitationUnitId=newid;g.invitationUnitLabel=ids.length>1?label:'';g.invitationRecipientId=''}})});closeSheet();await load();show('Invitaciones actualizadas.')};if($('split'))$('split').onclick=async()=>{await mutateUnits(S=>u.members.forEach(m=>setIndividual(S,m.id)));closeSheet();await load();show('Invitación separada.')}}
function setIndividual(S,id){const g=S.guests?.[id];if(!g)return;g.invitationUnitId=uid();g.invitationUnitLabel='';g.invitationRecipientId=''}
function normalizeRecipients(S){const map=new Map();for(const[id,g]of Object.entries(S.guests||{})){const k=g.invitationUnitId||'single:'+id;if(!map.has(k))map.set(k,[]);map.get(k).push(id)}for(const ids of map.values()){const allowed=new Set(ids);ids.forEach(id=>{const g=S.guests[id];if(g.invitationRecipientId&&!allowed.has(g.invitationRecipientId))g.invitationRecipientId=''})}}
async function mutateUnits(fn){const S=state();fn(S);normalizeRecipients(S);putLocal(S);await syncUnitFields()}
$('back').onclick=()=>location.assign('guests.html#invitados');$('editInvitation').onclick=()=>location.assign('guests-rsvp-design-manage.html');$('refresh').onclick=async()=>{show('Actualizando…');try{await load();show('Respuestas actualizadas.')}catch{show('No se han podido actualizar las respuestas.',true)}};$('organize').onclick=openOrganize;load().catch(e=>{$('units').innerHTML='<div class="empty">No se han podido cargar las invitaciones.</div>';show(e.message==='missing_access'?'Este dispositivo no tiene acceso a la boda.':'No se ha podido cargar el RSVP.',true)})
})();
</script></body></html>
