<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#FBF8F3">
<title>Weddly Smart Design · Recuperar acceso</title>
<style>
:root{--ink:#2C2A26;--sage:#596248;--paper:#FBF8F3;--line:#E5DED2;--muted:#756F65;--danger:#A84535}
*{box-sizing:border-box}body{margin:0;background:#F2EFE9;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;max-width:620px;margin:0 auto;background:var(--paper);padding:calc(34px + env(safe-area-inset-top)) 24px calc(50px + env(safe-area-inset-bottom))}.brand{font-family:Georgia,serif;color:var(--sage);font-size:34px;line-height:.95}.brand span{display:block;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-top:10px;color:var(--muted);font-weight:700}.card{margin-top:48px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(44,42,38,.04)}h1{font-family:Georgia,serif;font-weight:500;font-size:30px;margin:0 0 10px}.lead{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 22px}.field{margin-bottom:14px}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px}input{width:100%;padding:15px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:16px;text-transform:uppercase;letter-spacing:.04em}input:focus{outline:2px solid var(--sage);border-color:transparent}.btn{width:100%;border:0;border-radius:12px;padding:15px 16px;background:var(--ink);color:#fff;font-size:15px;font-weight:750;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.msg{min-height:20px;margin-top:14px;font-size:13px;line-height:1.45;color:var(--muted)}.msg.err{color:var(--danger)}.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:20px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body><main class="shell"><div class="brand">Weddly<span>Smart Design</span></div><section class="card"><h1>Recuperar mi acceso</h1><p class="lead">Usa tu código de recuperación de propietaria. Recupera la misma boda y sus datos; no crea una boda nueva.</p><div class="field"><label for="code">Código de recuperación</label><input id="code" autocomplete="one-time-code" maxlength="90" spellcheck="false" placeholder="WSD-…"></div><button id="recover" class="btn" type="button">Recuperar mi boda</button><div id="msg" class="msg" aria-live="polite"></div><div class="note">El código se usa únicamente para volver a emitir el acceso de propietaria en este dispositivo.</div></section></main>
<script src="/access-cookie-bridge-v1.js?v=1"></script>
<script>
(()=>{
const ACCESS='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-access';
const TOKEN='weddly_shared_wedding_token';
const $=id=>document.getElementById(id),msg=$('msg'),btn=$('recover');
function show(text,error=false){msg.textContent=text;msg.className='msg'+(error?' err':'')}
function remember(token){if(window.__WSD_ACCESS_BRIDGE?.remember)window.__WSD_ACCESS_BRIDGE.remember(token);else try{localStorage.setItem(TOKEN,token)}catch{}}
async function recover(){const code=$('code').value.trim();if(!code){show('Introduce tu código de recuperación.',true);return}btn.disabled=true;show('Recuperando tu boda…');try{const r=await fetch(ACCESS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'activate',activationCode:code}),cache:'no-store'});const j=await r.json().catch(()=>({}));if(r.status===201&&j?.ok&&j?.memberToken&&j?.owner===true&&j?.recovered===true){remember(j.memberToken);show('Acceso recuperado. Abriendo tu boda…');setTimeout(()=>location.replace('/app.html'),450);return}show('Ese código no ha podido recuperar el acceso de propietaria.',true)}catch{show('No se ha podido comprobar el acceso. Revisa la conexión e inténtalo de nuevo.',true)}finally{btn.disabled=false}}
btn.onclick=recover;$('code').addEventListener('keydown',e=>{if(e.key==='Enter')recover()});
})();
</script>
</body></html>
