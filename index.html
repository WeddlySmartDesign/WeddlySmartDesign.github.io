<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#FBF8F3">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Weddly Smart Design</title>
<style>html,body{margin:0;background:#FBF8F3;color:#2C2A26;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.launch{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}.brand{font-family:Georgia,serif;color:#525C43;line-height:1.04}.brand-main{font-size:34px}.brand-sub{font-size:24px;margin-top:4px}.msg{font-size:13px;color:#6E7A5C;margin-top:24px}</style>
</head>
<body><div class="launch"><div><div class="brand"><div class="brand-main">Weddly</div><div class="brand-sub">Smart Design</div></div><div class="msg" id="msg">Abriendo tu boda…</div></div></div>
<script>
(async()=>{
  const TOKEN='weddly_shared_wedding_token',API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-test-access';
  let token='';try{token=localStorage.getItem(TOKEN)||''}catch{}
  if(token.length<40){location.replace('/access.html');return}
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-weddly-member':token},body:JSON.stringify({action:'entitlement'}),cache:'no-store'});
    const x=await r.json().catch(()=>({}));
    if(!r.ok||!x.ok){try{localStorage.removeItem(TOKEN)}catch{}location.replace('/access.html');return}
    if(x.product==='guests'){location.replace('/guests.html');return}
    if(x.product==='full'){location.replace('/app.html');return}
    location.replace('/payments.html');
  }catch{
    document.getElementById('msg').textContent='No hemos podido comprobar el acceso. Comprueba tu conexión y vuelve a intentarlo.';
  }
})();
</script>
</body></html>
