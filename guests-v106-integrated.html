<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests v106</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}#g{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="g" src="guests-v105-integrated.html?v=106"></iframe><script>(()=>{const F=document.getElementById('g'),KEY='weddly_guests_qa_v67';function deep(){try{let d=F.contentDocument;for(let i=0;i<20;i++){const f=d?.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument}return d?.body?d:null}catch{return null}}function state(){try{return JSON.parse(localStorage.getItem(KEY))||{guests:{}}}catch{return{guests:{}}}}function declinedEntries(){const s=state();return Object.entries(s.guests||{}).filter(([,g])=>g&&g.rsvp!=='confirmed'&&g.rsvp!=='pending')}function ensureDeclineState(){const s=state();let changed=false;Object.entries(s.guests||{}).forEach(([id,g])=>{if(!g||g.rsvp==='confirmed'||g.rsvp==='pending')return;if(g.table){if(g.previousTableOnDecline===undefined)g.previousTableOnDecline=g.table;g.table='';changed=true}if(g.seating&&typeof g.seating==='object'){if(g.previousSeatingOnDecline===undefined)g.previousSeatingOnDecline=JSON.parse(JSON.stringify(g.seating));g.seating={};changed=true}});if(changed)localStorage.setItem(KEY,JSON.stringify(s))}function esc(x){return String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cardHtml(){const s=state(),all=Object.values(s.guests||{}),decl=declinedEntries(),active=all.filter(g=>g&&g.rsvp!=='declined'&&(g.rsvp==='confirmed'||g.rsvp==='pending')).length,total=all.length;return `<div id="v106attendance" class="card" style="border-left:5px solid #8b8178"><div class="sectiontag">Asistencia</div><div style="display:flex;gap:24px;flex-wrap:wrap;margin:10px 0 14px"><span><b style="font-size:25px">${active}</b><br><span class="small">siguen en gestión</span></span><span><b style="font-size:25px">${total}</b><br><span class="small">invitados iniciales</span></span><span><b style="font-size:25px">${decl.length}</b><br><span class="small">no asisten</span></span></div>${decl.length?`<button type="button" id="v106toggle" class="btn soft" style="width:100%">Ver quién ha declinado</button><div id="v106declined" style="display:none;margin-top:12px">${decl.map(([,g])=>`<div class="row"><div><b>${esc(g.name)}</b><div class="small">No asiste · se mantiene en el histórico</div></div></div>`).join('')}</div>`:`<div class="small">Todavía nadie ha declinado.</div>`}</div>`}function ensureAttendanceCard(d){const inv=d.getElementById('invitados');if(!inv)return;let c=d.getElementById('v106attendance');if(!c){const h2=inv.querySelector('h2');const tmp=d.createElement('div');tmp.innerHTML=cardHtml();c=tmp.firstElementChild;if(h2?.nextSibling)h2.parentNode.insertBefore(c,h2.nextSibling);else inv.prepend(c)}else{const open=d.getElementById('v106declined')?.style.display!=='none';const tmp=d.createElement('div');tmp.innerHTML=cardHtml();const n=tmp.firstElementChild;c.replaceWith(n);c=n;if(open&&d.getElementById('v106declined'))d.getElementById('v106declined').style.display='block'}const b=d.getElementById('v106toggle'),list=d.getElementById('v106declined');if(b&&list&&!b.dataset.bound){b.dataset.bound='1';b.onclick=()=>{const on=list.style.display==='none';list.style.display=on?'block':'none';b.textContent=on?'Ocultar no asistentes':'Ver quién ha declinado'}}}function ensureListsCard(d){const listados=d.getElementById('listados');if(!listados)return;const decl=declinedEntries();let c=d.getElementById('v106declinedList');if(!c){c=d.createElement('div');c.id='v106declinedList';c.className='card';listados.appendChild(c)}c.innerHTML=`<b>No asistentes</b><p class="small">${decl.length} de ${Object.keys(state().guests||{}).length} invitados iniciales han declinado. Se conservan por si cambian de respuesta y para mantener el recuento original.</p>${decl.length?`<div class="small" style="margin-top:10px">${decl.map(([,g])=>esc(g.name)).join(' · ')}</div>`:''}`;listados.appendChild(c)}function patchGuestRows(d){const names=new Set(declinedEntries().map(([,g])=>g.name));const inv=d.getElementById('invitados');if(!inv)return;inv.querySelectorAll('.row').forEach(r=>{const b=r.querySelector('b');if(!b||!names.has(b.textContent.trim()))return;const sm=r.querySelector('.small');if(sm&&!sm.dataset.v106){sm.dataset.v106='1';sm.textContent='No asiste';sm.style.color='#8a645c'}})}function hideFromSeatingChoices(d){const names=new Set(declinedEntries().map(([,g])=>g.name));if(!names.size)return;const p=d.getElementById('panel');if(!p)return;const title=(p.querySelector('h2')?.textContent||'').toLowerCase();if(!/(mesa|asign|mover|sentar|seating)/.test(title))return;p.querySelectorAll('.choice,.row,.seat,label').forEach(el=>{const t=el.textContent.trim();for(const n of names){if(t===n||t.startsWith(n+' ')||t.includes(n+' ·')){el.style.display='none';break}}})}function patch(){ensureDeclineState();const d=deep();if(!d)return;ensureAttendanceCard(d);ensureListsCard(d);patchGuestRows(d);hideFromSeatingChoices(d)}F.addEventListener('load',()=>setTimeout(patch,500));setInterval(patch,900)})();</script></body></html>
