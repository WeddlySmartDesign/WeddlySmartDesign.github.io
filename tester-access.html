<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Weddly Smart Design · Prueba</title>
<style>
:root{--ink:#2C2A26;--sage:#596248;--paper:#FBF8F3;--line:#E5DED2;--muted:#756F65;--danger:#A84535}
*{box-sizing:border-box}body{margin:0;background:#F2EFE9;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{min-height:100vh;max-width:600px;margin:0 auto;background:var(--paper);padding:calc(32px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.brand{font-family:Georgia,serif;color:var(--sage);font-size:34px;line-height:.9}.brand span{display:block;font-family:system-ui,sans-serif;font-size:12px;letter-spacing:.15em;text-transform:uppercase;margin-top:9px;color:var(--muted);font-weight:700}.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:700;color:var(--muted)}.card{margin-top:72px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 12px 30px rgba(44,42,38,.04)}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;color:var(--sage);margin-bottom:12px}h1{font-family:Georgia,serif;font-size:31px;font-weight:500;margin:0 0 10px}.lead{font-size:14px;line-height:1.55;color:var(--muted);margin:0 0 24px}.btn{width:100%;border:0;border-radius:12px;padding:15px 16px;background:var(--ink);color:#fff;font-size:15px;font-weight:750;cursor:pointer}.btn:disabled{opacity:.5;cursor:wait}.msg{min-height:20px;margin-top:14px;font-size:13px;line-height:1.45;color:var(--muted)}.msg.err{color:var(--danger)}.note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body><main class="shell"><div class="top"><div class="brand">Weddly<span>Smart Design</span></div><button id="lang" class="lang" type="button">EN</button></div><section class="card"><div class="tag" id="tag"></div><h1 id="title"></h1><p id="lead" class="lead"></p><button id="activate" class="btn" type="button"></button><div id="msg" class="msg" aria-live="polite"></div><div id="note" class="note"></div></section></main>
<script>
(()=>{
const ACCESS='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-access',TOKEN='weddly_shared_wedding_token';
const q=new URLSearchParams(location.search),product=q.get('product')==='full'?'full':'guests';
const hp=new URLSearchParams(location.hash.replace(/^#/,'')),code=hp.get('tester')||'';
let lang=(localStorage.getItem('weddly_access_lang')||'').toLowerCase();if(lang!=='es'&&lang!=='en')lang=(navigator.language||'').toLowerCase().startsWith('es')?'es':'en';
const copy={es:{guests:'Guests',full:'App completa',title:'Tu acceso de prueba',guestsLead:'Vas a activar una boda privada con acceso a Guests. Es la misma versión funcional, sin recortes de prueba.',fullLead:'Vas a activar una boda privada con acceso a Guests + Payments. Es la misma app funcional, sin recortes de prueba.',activate:'Activar mi acceso',busy:'Activando…',done:'Acceso listo. Abriendo tu boda…',used:'Este enlace ya se ha utilizado para crear una boda.',expired:'Este acceso ha caducado.',invalid:'Este enlace de prueba no es válido.',existing:'Este navegador ya tiene otro acceso activo. Abre el enlace en el dispositivo donde quieras usar esta prueba para no sustituirlo.',note:'Una boda · hasta dos personas autorizadas. La segunda persona se invita desde dentro de la app.'},en:{guests:'Guests',full:'Full app',title:'Your trial access',guestsLead:'You are about to activate a private wedding workspace with Guests access. This is the same functional version, with no trial feature cuts.',fullLead:'You are about to activate a private wedding workspace with Guests + Payments access. This is the same functional app, with no trial feature cuts.',activate:'Activate my access',busy:'Activating…',done:'Access ready. Opening your wedding…',used:'This link has already been used to create a wedding workspace.',expired:'This access has expired.',invalid:'This trial link is not valid.',existing:'This browser already has another active access. Open the link on the device where you want to use this trial so you do not replace it.',note:'One wedding workspace · up to two authorised people. Invite the second person from inside the app.'}};
const $=id=>document.getElementById(id);function render(){const c=copy[lang];document.documentElement.lang=lang;$('lang').textContent=lang==='es'?'EN':'ES';$('tag').textContent=c[product];$('title').textContent=c.title;$('lead').textContent=c[product+'Lead'];$('activate').textContent=c.activate;$('note').textContent=c.note}function show(t,e=false){$('msg').textContent=t;$('msg').className='msg'+(e?' err':'')}
async function status(token){if(!token||token.length<40)return null;try{const r=await fetch(ACCESS,{method:'POST',headers:{'Content-Type':'application/json','x-weddly-member':token},body:JSON.stringify({action:'status'})});const x=await r.json().catch(()=>({}));return r.ok&&x?.ok?x:null}catch{return null}}
$('lang').onclick=()=>{lang=lang==='es'?'en':'es';localStorage.setItem('weddly_access_lang',lang);render()};
$('activate').onclick=async()=>{const c=copy[lang],b=$('activate');if(!code){show(c.invalid,true);return}b.disabled=true;show(c.busy);try{const current=localStorage.getItem(TOKEN)||'';if(await status(current)){show(c.existing,true);return}const r=await fetch(ACCESS,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'activate',activationCode:code})});const x=await r.json().catch(()=>({}));if(r.status===201&&x?.memberToken){localStorage.setItem(TOKEN,x.memberToken);localStorage.removeItem('weddly_sync_base_v20');history.replaceState(null,'',location.pathname+'?product='+product);show(c.done);setTimeout(()=>location.replace(product==='full'?'/app.html':'/guests.html'),350);return}if(x?.error==='already_activated')show(c.used,true);else if(x?.error==='license_expired'||x?.error==='license_inactive')show(c.expired,true);else show(c.invalid,true)}catch{show(c.invalid,true)}finally{b.disabled=false}};
render();
})();
</script>
</body></html>
