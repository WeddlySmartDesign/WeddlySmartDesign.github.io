<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WeddlySmartDesign · Essential</title>
<style>
html,body{margin:0;background:#f6f4f0;font-family:system-ui}
main{max-width:560px;margin:auto;padding:32px}
</style>
</head>
<body>
<main id="loading">Cargando invitación…</main>
<script>
(()=> {
  const RSVP_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-rsvp';
  const PERS_API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-personalization';
  const qs=new URLSearchParams(location.search),token=qs.get('t')||'';
  const templates={
    e01:'guests-rsvp-essential-01.html',
    e02:'guests-rsvp-essential-02.html',
    e03:'guests-rsvp-essential-03.html',
    e04:'guests-rsvp-essential-04.html',
    e05:'guests-rsvp-essential-05.html',
    e06:'guests-rsvp-essential-06.html'
  };
  const fonts=[
    {id:'editorial',primary:'Cormorant Garamond',primaryParam:'Cormorant+Garamond:wght@500;600',secondary:'Jost',secondaryParam:'Jost:wght@300;400;500;600'},
    {id:'romantico',primary:'Mrs Saint Delafield',primaryParam:'Mrs+Saint+Delafield',secondary:'Cormorant Garamond',secondaryParam:'Cormorant+Garamond:wght@400;500'},
    {id:'clasico',primary:'Playfair Display',primaryParam:'Playfair+Display:ital,wght@0,600;1,500',secondary:'EB Garamond',secondaryParam:'EB+Garamond:ital,wght@0,400;0,500;1,400'},
    {id:'moderno',primary:'Fraunces',primaryParam:'Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500',secondary:'Work Sans',secondaryParam:'Work+Sans:wght@300;400;500;600'},
    {id:'caligrafico',primary:'Beau Rivage',primaryParam:'Beau+Rivage',secondary:'Marcellus',secondaryParam:'Marcellus'}
  ];
  const defaultAgenda=[
    {time:'18:00',title:'Ceremonia',place:'FINCA LOS OLIVOS',icon:'ring'},
    {time:'19:00',title:'Cóctel',place:'JARDÍN NORTE',icon:'glass'},
    {time:'21:00',title:'Cena',place:'SALÓN PRINCIPAL',icon:'fork'},
    {time:'00:00',title:'Fiesta',place:'HASTA EL AMANECER',icon:'note'}
  ];
  const defaultLocations=[
    {title:'Ceremonia',time:'18:00',place:'Finca Los Olivos',address:'Finca Los Olivos, Murcia'},
    {title:'Celebración',time:'19:00',place:'Jardín Norte',address:'Jardín Norte, Murcia'}
  ];
  function splitNames(t){for(const s of [' & ',' y ',' Y ',' + '])if(String(t||'').includes(s)){const p=t.split(s);return[p[0].trim(),p.slice(1).join(s.trim()).trim()]}return['Alba','Leo']}
  function splitVenue(v){const p=String(v||'').split(',');return{venue:(p.shift()||'').trim(),city:p.join(',').trim()}}
  function fallback(cfg={},p=null){
    const n=splitNames(cfg.title),v=splitVenue(cfg.venue),x=p||{};
    return {
      tier:'essential',template:'e01',fontPair:'editorial',
      p1:n[0],p2:n[1],
      date:/^\d{4}-\d{2}-\d{2}$/.test(cfg.date||'')?cfg.date:'2027-09-12',
      time:cfg.time||'18:00',
      venue:v.venue||'Finca Los Olivos',city:v.city||'Murcia',
      heroPhoto:'',storyPhoto:'',
      storyTitle:'Nos encantará celebrarlo contigo.',
      storyText:'Hemos preparado este espacio para que tengas toda la información del día, sin perder el carácter de una invitación diseñada para nosotros.',
      agenda:defaultAgenda,locations:defaultLocations,
      contactName:'Ana',contactPhone:'',whatsapp:'',
      ...x,
      agenda:Array.isArray(x.agenda)&&x.agenda.length?x.agenda:defaultAgenda,
      locations:Array.isArray(x.locations)&&x.locations.length?x.locations:defaultLocations
    };
  }
  function replaceConst(h,name,value,kind){
    const open=kind==='array'?'\\[':'\\{',close=kind==='array'?'\\]':'\\}';
    const re=new RegExp('const '+name+' = '+open+'[\\s\\S]*?\\n  '+close+';');
    return h.replace(re,'const '+name+' = '+JSON.stringify(value)+';');
  }
  function patch(h,w,f){
    const href=`https://fonts.googleapis.com/css2?family=${f.primaryParam}&family=${f.secondaryParam}&display=swap`;
    const css=`<link rel="stylesheet" href="${href}"><style id="weddly-font-choice">body,input,button{font-family:'${f.secondary}',system-ui,sans-serif!important}.script,.agenda-title,.card-eyebrow,.cover-names,.names,.kicker,.caption{font-family:'${f.primary}',serif!important}.historia-text{font-family:'${f.secondary}',serif!important}</style>`;
    h=h.replace('</head>',css+'</head>');
    h=h.replace(/WEDDLY SMART DESIGN\s*·\s*GUESTS/gi,'WEDDLY SMART DESIGN · INVITADOS');
    h=h.replace(/Weddly Smart Design\s*·\s*Guests/gi,'Weddly Smart Design · Invitados');
    h=h.replace("const RSVP_ENGINE = 'guests-rsvp-v105-mobile.html';","const RSVP_ENGINE = 'guests-rsvp-v107-mobile.html';");
    h=replaceConst(h,'wedding',{
      p1:w.p1,p2:w.p2,date:w.date,time:w.time,venue:w.venue,city:w.city,
      heroPhoto:w.heroPhoto||'',storyPhoto:w.storyPhoto||'',
      storyTitle:w.storyTitle||'',storyText:w.storyText||'',
      contactName:w.contactName||'',contactPhone:w.contactPhone||'',whatsapp:w.whatsapp||''
    },'object');
    h=replaceConst(h,'agenda',w.agenda,'array');
    h=replaceConst(h,'locations',w.locations,'array');
    return h;
  }
  async function getJson(url){
    const r=await fetch(url,{cache:'no-store'}),x=await r.json().catch(()=>({}));
    return r.ok&&x?.ok?x:null;
  }
  async function run(){
    let cfg={},pers=null;
    if(token){
      try{const x=await getJson(RSVP_API+'?token='+encodeURIComponent(token));if(x?.form?.config)cfg=x.form.config}catch{}
      try{const x=await getJson(PERS_API+'?token='+encodeURIComponent(token));if(x?.personalization)pers=x.personalization}catch{}
    }
    if(!pers){try{pers=JSON.parse(localStorage.getItem('weddly_guests_design')||'null')}catch{}}
    const w=fallback(cfg,pers),url=templates[w.template]||templates.e01,f=fonts.find(x=>x.id===w.fontPair)||fonts[0];
    try{
      const r=await fetch(url+'?v=essential-six-rev2-20260909',{cache:'no-store'});if(!r.ok)throw 0;
      const h=patch(await r.text(),w,f);
      document.open();document.write(h);document.close();
    }catch{document.getElementById('loading').textContent='No se ha podido cargar la invitación.'}
  }
  run();
})();
</script>
</body>
</html>
