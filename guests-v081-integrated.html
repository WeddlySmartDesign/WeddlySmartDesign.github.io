 tools=mesas.querySelector('.tools');if(tools&&!tools.querySelector('[data-v81-plan-btn]')){const b=d.createElement('button');b.className='btn';b.type='button';b.textContent='Plano visual';b.setAttribute('data-v81-plan-btn','1');b.addEventListener('click',()=>{location.href='guests-v081-visual-seating.html?v=5'});tools.insertBefore(b,tools.firstChild)}}}function openMesasIfNeeded(){try{if(location.hash==='#mesas'&&typeof frame.contentWindow.go==='function')frame.contentWindow.go('mesas',2)}catch(e){}}frame.addEventListener('load',()=>{patchBase();addVisualPlan();openMesasIfNeeded();try{const d=frame.contentDocument;const obs=new MutationObserver(()=>{patchBase();addVisualPlan()});obs.observe(d.body,{childList:true,subtree:true})}catch(e){}})})();</script></body></html>
