<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests v91</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f5f1ea;overflow:hidden}#app{display:block;width:100%;height:100%;border:0;background:#f5f1ea}</style></head><body><iframe id="app" title="Weddly Smart Design Guests" src="guests-v060.html?v=91-import-fixed"></iframe><script>(()=>{const frame=document.getElementById('app'),RSVPKEY='weddly_guests_rsvp_v82';let patching=false,queued=false;
function getR(){try{return JSON.parse(localStorage.getItem(RSVPKEY))||{active:false,responses:[],contacts:{},delivery:{}}}catch(e){return{active:false,responses:[],contacts:{},delivery:{}}}}
function putR(r){localStorage.setItem(RSVPKEY,JSON.stringify(r))}
function schedulePatch(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;patch()})}
function state(w){try{return w.__guestsState?w.__guestsState():null}catch(e){return null}}
function bridge(d,w){if(w.__guestsState)return;const s=d.createElement('script');s.textContent='window.__guestsState=()=>S;';d.body.appendChild(s)}
function setHtmlIfChanged(el,html){if(el.innerHTML!==html)el.innerHTML=html}
function installHooks(w){if(w.__v90Hooks)return;w.__v90Hooks=true;['renderHoy','renderGuests','renderTables','render'].forEach(name=>{const original=w[name];if(typeof original!=='function')return;w[name]=function(){const out=original.apply(this,arguments);schedulePatch();return out}})}
function patch(){if(patching)return;patching=true;let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(e){patching=false;return}if(!d||!d.body){patching=false;return}bridge(d,w);installHooks(w);
if(!d.getElementById('v90style')){const st=d.createElement('style');st.id='v90style';st.textContent='.nav{z-index:999!important;pointer-events:auto!important;transform:translateZ(0)}.nav button{pointer-events:auto!important;touch-action:manipulation!important;position:relative;z-index:1000}.view{padding-bottom:110px!important}.sheet.on{z-index:5000!important;pointer-events:auto!important}.rsvpBox{background:#2c2a26;color:#fff;border-radius:22px;padding:20px;margin:16px 0}.rsvpBox .small{color:#d9d3cb}.rsvpBox .btn{margin-top:8px}.rsvpActions{display:flex;gap:8px;flex-wrap:wrap}.rsvpActions .btn{flex:1;min-width:145px}.rsvpMeta{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px}.rsvpMeta span{font-size:13px;color:#d9d3cb}.rsvpPending{border-left:5px solid #6b7f72}.rsvpPending .row{align-items:flex-start}.importHelp{background:#f7f3ed;border:1px solid #e1d8cc;border-radius:14px;padding:12px;margin:10px 0 14px}.importMsg{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#f4e9dc;color:#7a5539;display:none}.importMsg.on{display:block}.uploadBtn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border:1px solid #ccc5bb;border-radius:13px;background:#fff;color:#2c2a26;font-weight:700;margin:6px 0}.uploadName{font-size:13px;color:#706b65;margin-top:4px;word-break:break-word}';d.head.appendChild(st)}
if(!d.getElementById('v90safe')){const s=d.createElement('script');s.id='v90safe';s.textContent='window.markRead=function(){if(S.activity){S.activity.read=true;save();renderHoy();}};';d.body.appendChild(s)}
addVisual(d);addRsvpEntry(d,w);addPending(d,w);patching=false}
function addVisual(d){const mesas=d.getElementById('mesas');if(!mesas)return;if(!mesas.querySelector('[data-v81-visual]')){const h2=mesas.querySelector('h2');if(h2){const card=d.createElement('div');card.className='card';card.setAttribute('data-v81-visual','1');card.innerHTML='<b>Plano visual interactivo</b><p class="small">Construye el salón, coloca mesas y elementos y organiza invitados visualmente. El plano y este resumen trabajan sobre la misma distribución.</p><button class="btn" type="button">Abrir plano visual</button>';card.querySelector('button').onclick=()=>location.href='guests-v081-visual-seating.html?v=7';h2.insertAdjacentElement('afterend',card)}}const tools=mesas.querySelector('.tools');if(tools&&!tools.querySelector('[data-v81-plan-btn]')){const b=d.createElement('button');b.className='btn';b.type='button';b.textContent='Plano visual';b.setAttribute('data-v81-plan-btn','1');b.onclick=()=>location.href='guests-v081-visual-seating.html?v=7';tools.insertBefore(b,tools.firstChild)}}
function addRsvpEntry(d,w){const r=getR(),S=state(w),guests=Object.values((S&&S.guests)||{}),sent=Object.values(r.delivery||{}).filter(x=>x&&x.status==='sent').length,answered=guests.filter(g=>(r.responses||[]).some(x=>String(x.name||'').trim().toLowerCase()===String(g.name||'').trim().toLowerCase())).length,pending=Math.max(0,sent-answered);[d.getElementById('hoy'),d.getElementById('invitados')].forEach((view,idx)=>{if(!view)return;let box=view.querySelector('[data-rsvp-entry]');if(!box){box=d.createElement('div');box.setAttribute('data-rsvp-entry','1');box.className='rsvpBox';if(idx===0)view.prepend(box);else{const h2=view.querySelector('h2');h2?h2.insertAdjacentElement('afterend',box):view.prepend(box)}}const title=r.active?'RSVP activo':'RSVP conectado',intro=r.active?'Gestiona formulario, contactos, envíos y respuestas desde aquí.':'Puedes crear el RSVP aquí o importar la lista que ya tengas.',meta=r.active?`<div class="rsvpMeta"><span>${guests.length} invitados</span><span>${sent} enviados</span><span>${pending} pendientes</span></div>`:'';setHtmlIfChanged(box,`<div class="sectiontag" style="color:#d9d3cb">RSVP</div><b style="font-size:21px">${title}</b><p class="small">${intro}</p>${meta}<div class="rsvpActions"><button class="btn soft" type="button" data-open-rsvp>${r.active?'Gestionar RSVP':'Crear y enviar RSVP'}</button><button class="btn soft" type="button" data-use-list>Ya tengo mi lista</button></div>`);box.querySelector('[data-open-rsvp]').onclick=()=>location.href='guests-rsvp-v82.html?v=87-phone-fixed';box.querySelector('[data-use-list]').onclick=()=>openImport(d,w)})}
function openImport(d,w){const p=d.getElementById('panel'),sh=d.getElementById('sheet');if(!p||!sh)return;p.innerHTML=`<div class="sectiontag">Trae tu lista</div><h2>Importar invitados</h2><p class="small">No tienes que empezar otra vez. Pega filas de Excel/Google Sheets o sube un CSV/TXT.</p><div class="importHelp"><b>Formato flexible</b><div class="small">Acepta nombres solos o columnas como Nombre, Teléfono, Email, Mesa, RSVP y Menú. No sustituimos silenciosamente datos existentes.</div></div><label class="small">Pegar desde Excel / Sheets</label><textarea id="v90paste" class="field" rows="6" placeholder="Paula Martín&#9;620 000 000&#9;paula@email.com&#10;David Martín&#9;622 000 000"></textarea><div class="small">O subir archivo</div><input id="v90file" type="file" accept=".csv,.txt,text/csv,text/plain" hidden><button type="button" class="uploadBtn" id="v90pick">Subir archivo</button><div id="v90filename" class="uploadName">Ningún archivo seleccionado</div><div id="v90msg" class="importMsg"></div><div class="actions"><button class="btn soft" id="v90cancel">Cancelar</button><button class="btn" id="v90import">Importar</button></div>`;sh.classList.add('on');const nav=d.querySelector('.nav');if(nav)nav.style.pointerEvents='none';const close=()=>{sh.classList.remove('on');p.innerHTML='';if(nav)nav.style.pointerEvents='auto'};p.querySelector('#v90cancel').onclick=close;p.querySelector('#v90pick').onclick=()=>p.querySelector('#v90file').click();sh.onclick=e=>{if(e.target===sh)close()};p.onclick=e=>e.stopPropagation();p.querySelector('#v90file').onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;p.querySelector('#v90filename').textContent=f.name;const rd=new FileReader();rd.onload=()=>{p.querySelector('#v90paste').value=String(rd.result||'')};rd.onerror=()=>showImportMsg(p,'No he podido leer ese archivo. Prueba con CSV o TXT.');rd.readAsText(f)};p.querySelector('#v90import').onclick=()=>importRows(w,p.querySelector('#v90paste').value,close,p)}
function showImportMsg(p,msg){const m=p.querySelector('#v90msg');if(m){m.textContent=msg;m.classList.add('on')}}
function splitCsvLine(line,sep){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===sep&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}
function norm(x){return String(x||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function parseImport(text){let raw=String(text||'').replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!raw.length)return[];let sep=null;const decl=raw[0].trim().match(/^sep=(.)$/i);if(decl){sep=decl[1];raw.shift()}if(!raw.length)return[];if(!sep){const first=raw[0],counts=[['\t',(first.match(/\t/g)||[]).length],[';',(first.match(/;/g)||[]).length],[',',(first.match(/,/g)||[]).length]];counts.sort((a,b)=>b[1]-a[1]);sep=counts[0][1]?counts[0][0]:'\t'}const rows=raw.map(x=>splitCsvLine(x,sep)),h=rows[0].map(norm);const find=keys=>h.findIndex(x=>keys.includes(x));let ni=find(['nombre','nombre y apellidos','name','guest','invitado','invitados']),pi=find(['telefono','teléfono','phone','movil','móvil']),ei=find(['email','e-mail','correo']),ti=find(['mesa','table']),mi=find(['menu','menú','meal']),ri=find(['rsvp','estado','asistencia']);let start=0;if([ni,pi,ei,ti,mi,ri].some(i=>i>=0)){start=1;if(ni<0)ni=0}else{ni=0;pi=1;ei=2}const out=[];for(let i=start;i<rows.length;i++){const r=rows[i],name=String(r[ni]||'').trim();if(!name)continue;const low=norm(name),all=norm(r.join(' '));if(low==='total'||low.includes('resumen')||low==='nombre'||low==='name'||all.includes(' - resumen')||all.startsWith('total ')||all.includes(' total '))continue;const table=ti>=0?String(r[ti]||'').trim():'',meal=mi>=0?String(r[mi]||'').trim():'',rv=ri>=0?norm(r[ri]):'';out.push({name,phone:pi>=0?String(r[pi]||'').trim():'',email:ei>=0?String(r[ei]||'').trim():'',table,meal,rsvp:rv})}return out}
function importRows(w,text,close,p){let rows=[];try{rows=parseImport(text)}catch(e){showImportMsg(p,'No he podido interpretar ese archivo. Prueba pegando solo la columna de nombres.');return}if(!rows.length){showImportMsg(p,'No he encontrado invitados válidos. Prueba pegando solo la columna de nombres.');return}const S=state(w);if(!S||!S.guests){showImportMsg(p,'No he podido acceder a la lista activa. Recarga la página e inténtalo de nuevo.');return}const r=getR();r.contacts=r.contacts||{};let added=0,updated=0;try{for(const row of rows){const existing=Object.entries(S.guests).find(([,g])=>norm(g.name)===norm(row.name));if(existing){const [id,g]=existing;if(row.phone||row.email){const old=r.contacts[id]||{};r.contacts[id]={phone:row.phone||old.phone||'',email:row.email||old.email||''}}if(row.table&&!g.table)g.table=row.table;if(row.meal&&!g.meal)g.meal=row.meal;if(row.rsvp&&(!g.rsvp||g.rsvp==='pending'))g.rsvp=row.rsvp.includes('confirm')?'confirmed':row.rsvp.includes('no')||row.rsvp.includes('declin')?'declined':'pending';updated++;continue}const id='imp'+Date.now()+Math.random().toString(36).slice(2,8);S.guests[id]={name:row.name,rsvp:row.rsvp.includes('confirm')?'confirmed':row.rsvp.includes('no')||row.rsvp.includes('declin')?'declined':'pending',meal:row.meal||'',table:row.table||'',transport:false};if(row.phone||row.email)r.contacts[id]={phone:row.phone,email:row.email};added++}putR(r);if(typeof w.save==='function')w.save();close();if(typeof w.record==='function')w.record('Lista importada',`${added} invitados añadidos${updated?` · ${updated} existentes reconocidos`:''}`,[{title:'Invitados',detail:'Lista incorporada sin sustituir decisiones existentes'}]);if(typeof w.render==='function')w.render();schedulePatch();setTimeout(()=>{try{if(typeof w.go==='function')w.go('invitados',1)}catch(e){}},0)}catch(e){console.error(e);showImportMsg(p,'La importación no se ha aplicado. No se ha modificado tu lista.')}}
function addPending(d,w){const inv=d.getElementById('invitados');if(!inv)return;const r=getR(),pending=(r.responses||[]).filter(x=>!x.applied);let box=inv.querySelector('[data-rsvp-pending]');if(!pending.length){if(box)box.remove();return}if(!box){box=d.createElement('div');box.setAttribute('data-rsvp-pending','1');box.className='card rsvpPending';const entry=inv.querySelector('[data-rsvp-entry]');entry?entry.insertAdjacentElement('afterend',box):inv.prepend(box)}setHtmlIfChanged(box,`<b>${pending.length} respuesta${pending.length===1?' nueva':'s nuevas'}</b><p class="small">Incorpóralas a Invitados cuando quieras.</p>${pending.map((x,i)=>`<div class="row"><div><b>${x.name}</b><div class="small">${x.attend?'Asiste':'No asiste'}${x.meal?' · '+x.meal:''}${x.transport?' · Transporte':''}</div></div><button class="btn soft mini" data-i="${i}">Incorporar</button></div>`).join('')}`);box.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>apply(+b.dataset.i,w))}
function apply(i,w){const r=getR(),pending=(r.responses||[]).filter(x=>!x.applied),x=pending[i],S=state(w);if(!x||!S||!S.guests)return;let match=Object.entries(S.guests).find(([,g])=>norm(g.name)===norm(x.name));if(match){const [,g]=match;g.rsvp=x.attend?'confirmed':'declined';if(x.meal)g.meal=x.meal;g.transport=!!x.transport;if(typeof w.record==='function')w.record(x.name+' · RSVP recibido',x.attend?'Asistirá':'No asistirá',[{title:'Invitados',detail:'RSVP actualizado'}])}else{const id='rsvp'+Date.now();S.guests[id]={name:x.name,rsvp:x.attend?'confirmed':'declined',meal:x.meal||'',table:'',transport:!!x.transport}}x.applied=true;putR(r);if(typeof w.render==='function')w.render();schedulePatch()}
function openHash(){try{if(location.hash==='#invitados'&&typeof frame.contentWindow.go==='function')frame.contentWindow.go('invitados',1);else if(location.hash==='#mesas'&&typeof frame.contentWindow.go==='function')frame.contentWindow.go('mesas',2)}catch(e){}}
frame.addEventListener('load',()=>{patch();openHash()})})();</script></body></html>
