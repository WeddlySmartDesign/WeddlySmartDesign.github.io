<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests v82 RSVP</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f5f1ea;overflow:hidden}#app{display:block;width:100%;height:100%;border:0;background:#f5f1ea}</style></head><body><iframe id="app" title="Weddly Smart Design Guests" src="guests-v060.html?v=84-rsvp"></iframe><script>(()=>{const frame=document.getElementById('app');const RSVPKEY='weddly_guests_rsvp_v82';function getR(){try{return JSON.parse(localStorage.getItem(RSVPKEY))||{active:false,title:'Daniela & Sergio',date:'12 septiembre 2027',intro:'Nos encantará celebrar este día contigo.',questions:{meal:true,allergy:true,transport:true,plusone:true},responses:[]}}catch(e){return{active:false,title:'Daniela & Sergio',date:'12 septiembre 2027',intro:'Nos encantará celebrar este día contigo.',questions:{meal:true,allergy:true,transport:true,plusone:true},responses:[]}}}function putR(r){localStorage.setItem(RSVPKEY,JSON.stringify(r))}function patch(){let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(e){return}if(!d||!d.body)return;if(!d.getElementById('v82style')){const st=d.createElement('style');st.id='v82style';st.textContent='.nav{z-index:999!important;pointer-events:auto!important;transform:translateZ(0)}.nav button{pointer-events:auto!important;touch-action:manipulation!important;position:relative;z-index:1000}.view{padding-bottom:110px!important}.rsvpHero{background:#2c2a26;color:#fff;border-radius:22px;padding:22px;margin:16px 0}.rsvpHero .small{color:#d9d3cb}.rsvpGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.rsvpPreview{background:#f7f3ed;border:1px solid #ddd5c8;border-radius:22px;padding:28px 22px;text-align:center}.rsvpPreview h3{font:500 34px Georgia,serif;margin:10px 0}.rsvpPreview .date{letter-spacing:.08em;text-transform:uppercase;font-size:12px}.toggleRow{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:13px 0;border-bottom:1px solid #eee}.toggleRow input{width:22px;height:22px}.rsvpNew{border-left:5px solid #6b7f72}.field2{width:100%;padding:14px;border:1px solid #ccc5bb;border-radius:13px;font-size:16px;margin:6px 0 13px;background:#fff}.copyBox{background:#f5f1ea;border-radius:12px;padding:12px;font-size:13px;word-break:break-all}.rsvpPublic{position:fixed;z-index:2000;inset:0;background:#f5f1ea;overflow:auto;padding:30px 22px 80px}.rsvpPublic .inner{max-width:520px;margin:auto}.rsvpPublic h1{font:500 50px Georgia,serif;margin:28px 0 8px}.answer{display:block;width:100%;padding:16px;border:1px solid #ccc5bb;border-radius:15px;background:#fff;text-align:left;font-size:16px;margin:8px 0}.answer.sel{outline:2px solid #2c2a26}.success{padding:50px 20px;text-align:center}.success h2{font:500 38px Georgia,serif}';d.head.appendChild(st)}if(!d.getElementById('v82safe')){const s=d.createElement('script');s.id='v82safe';s.textContent='window.markRead=function(){if(S.activity){S.activity.read=true;save();renderHoy();}};';d.body.appendChild(s)}addVisual(d);addRsvp(d,w)}function addVisual(d){const mesas=d.getElementById('mesas');if(mesas&&!mesas.querySelector('[data-v81-visual]')){const h2=mesas.querySelector('h2');if(h2){const card=d.createElement('div');card.className='card';card.setAttribute('data-v81-visual','1');card.innerHTML='<b>Plano visual interactivo</b><p class="small">Construye el salón, coloca mesas y elementos y organiza invitados visualmente. El plano y este resumen trabajan sobre la misma distribución.</p><button class="btn" type="button">Abrir plano visual</button>';card.querySelector('button').onclick=()=>location.href='guests-v081-visual-seating.html?v=7';h2.insertAdjacentElement('afterend',card)}const tools=mesas.querySelector('.tools');if(tools&&!tools.querySelector('[data-v81-plan-btn]')){const b=d.createElement('button');b.className='btn';b.type='button';b.textContent='Plano visual';b.setAttribute('data-v81-plan-btn','1');b.onclick=()=>location.href='guests-v081-visual-seating.html?v=7';tools.insertBefore(b,tools.firstChild)}}}function addRsvp(d,w){const inv=d.getElementById('invitados');if(!inv)return;let r=getR();let host=inv.querySelector('[data-rsvp-v82]');if(!host){host=d.createElement('div');host.setAttribute('data-rsvp-v82','1');inv.prepend(host)}const pending=r.responses.filter(x=>!x.applied);host.innerHTML=`<div class="rsvpHero"><div class="sectiontag" style="color:#d9d3cb">RSVP</div><h3 style="font-size:24px;margin:8px 0">${r.active?'Tu RSVP está recibiendo respuestas':'Recoge las respuestas aquí'}</h3><p class="small">${r.active?'Las respuestas entran directamente en Guests.':'Crea un RSVP bonito y conectado con tu lista. Sin volver a introducir datos.'}</p><div class="rsvpGrid"><button class="btn soft" data-rconfig>${r.active?'Editar RSVP':'Crear RSVP'}</button>${r.active?'<button class="btn soft" data-rpreview>Ver como invitado</button>':''}</div></div>${pending.length?`<div class="card rsvpNew"><b>${pending.length} respuesta${pending.length===1?' nueva':'s nuevas'}</b><p class="small">Revisa antes de incorporar cualquier persona que Guests no reconozca.</p>${pending.map((x,i)=>`<div class="row"><div><b>${x.name}</b><div class="small">${x.attend?'Asiste':'No asiste'}${x.meal?' · '+x.meal:''}${x.transport?' · Transporte':''}</div></div><button class="btn soft mini" data-apply="${i}">Incorporar</button></div>`).join('')}</div>`:''}`;host.querySelector('[data-rconfig]').onclick=()=>config(d,w);const pv=host.querySelector('[data-rpreview]');if(pv)pv.onclick=()=>publicForm(d,w);host.querySelectorAll('[data-apply]').forEach(b=>b.onclick=()=>applyResponse(+b.dataset.apply,d,w))}function config(d,w){let r=getR();w.openSheet(`<div class="sectiontag">RSVP conectado</div><h2>${r.active?'Editar RSVP':'Crear RSVP'}</h2><label>Título</label><input id="rt" class="field" value="${r.title}"><label>Fecha</label><input id="rd" class="field" value="${r.date}"><label>Mensaje</label><textarea id="ri" class="field" rows="3">${r.intro}</textarea><div class="card" style="padding:12px 16px"><b>Preguntas</b><label class="toggleRow"><span>Menú</span><input id="qm" type="checkbox" ${r.questions.meal?'checked':''}></label><label class="toggleRow"><span>Alergias / intolerancias</span><input id="qa" type="checkbox" ${r.questions.allergy?'checked':''}></label><label class="toggleRow"><span>Transporte</span><input id="qt" type="checkbox" ${r.questions.transport?'checked':''}></label><label class="toggleRow"><span>Acompañante / +1</span><input id="qp" type="checkbox" ${r.questions.plusone?'checked':''}></label></div><div class="rsvpPreview"><div class="date">${r.date}</div><h3>${r.title}</h3><p>${r.intro}</p></div><div class="actions"><button class="btn soft" id="rcancel">Cancelar</button><button class="btn" id="rsave">${r.active?'Guardar':'Crear y activar'}</button></div>`);d.getElementById('rcancel').onclick=w.closeSheet;d.getElementById('rsave').onclick=()=>{r.title=d.getElementById('rt').value.trim()||'Nuestra boda';r.date=d.getElementById('rd').value.trim();r.intro=d.getElementById('ri').value.trim();r.questions={meal:d.getElementById('qm').checked,allergy:d.getElementById('qa').checked,transport:d.getElementById('qt').checked,plusone:d.getElementById('qp').checked};r.active=true;putR(r);w.closeSheet();addRsvp(d,w)}}function publicForm(d,w){const r=getR(),ov=d.createElement('div');ov.className='rsvpPublic';ov.innerHTML=`<div class="inner"><button class="btn soft" id="rclose">← Volver</button><div class="sectiontag" style="margin-top:35px">Weddly Smart Design</div><h1>${r.title}</h1><div class="small">${r.date}</div><p style="font-size:18px;line-height:1.5">${r.intro}</p><div class="card"><label>Nombre y apellidos</label><input id="pn" class="field2" placeholder="Tu nombre"><b>¿Asistirás?</b><button class="answer sel" data-att="1">Sí, allí estaré</button><button class="answer" data-att="0">No podré asistir</button>${r.questions.meal?'<label style="display:block;margin-top:18px">Menú</label><select id="pm" class="field2"><option>Estándar</option><option>Vegetariano</option><option>Vegano</option><option>Celíaco</option><option>Sin lactosa</option><option>Infantil</option></select>':''}${r.questions.allergy?'<label>Alergias o intolerancias</label><input id="pa" class="field2" placeholder="Cuéntanos lo que debemos saber">':''}${r.questions.transport?'<label class="toggleRow"><span>Necesito transporte</span><input id="pt" type="checkbox"></label>':''}${r.questions.plusone?'<label style="display:block;margin-top:15px">Acompañante / +1</label><input id="pp" class="field2" placeholder="Nombre, si aplica">':''}<button class="btn" id="psend" style="width:100%;margin-top:18px">Enviar respuesta</button></div></div>`;d.body.appendChild(ov);let attend=true;ov.querySelectorAll('[data-att]').forEach(b=>b.onclick=()=>{attend=b.dataset.att==='1';ov.querySelectorAll('[data-att]').forEach(x=>x.classList.toggle('sel',x===b))});d.getElementById('rclose').onclick=()=>ov.remove();d.getElementById('psend').onclick=()=>{const name=d.getElementById('pn').value.trim();if(!name){d.getElementById('pn').focus();return}r.responses.push({name,attend,meal:d.getElementById('pm')?.value||'',allergy:d.getElementById('pa')?.value.trim()||'',transport:!!d.getElementById('pt')?.checked,plusone:d.getElementById('pp')?.value.trim()||'',applied:false,at:Date.now()});putR(r);ov.innerHTML='<div class="inner success"><div class="sectiontag">Respuesta enviada</div><h2>Gracias</h2><p>Daniela & Sergio ya tienen tu respuesta.</p><button class="btn soft" id="done">Cerrar</button></div>';d.getElementById('done').onclick=()=>{ov.remove();addRsvp(d,w)}}}function applyResponse(i,d,w){let r=getR(),pending=r.responses.filter(x=>!x.applied),x=pending[i];if(!x)return;let match=null;try{match=Object.entries(w.S.guests).find(([,g])=>g.name.toLocaleLowerCase('es')===x.name.toLocaleLowerCase('es'))}catch(e){}if(match){const [id,g]=match;g.rsvp=x.attend?'confirmed':'declined';if(x.meal)g.meal=x.meal;g.transport=x.transport;w.record(x.name+' · RSVP recibido',x.attend?'Asistirá':'No asistirá',[{title:'Invitados',detail:'RSVP actualizado'},{title:'Catering actual',detail:x.meal?'Menú actualizado':'Sin cambios de menú'}]);w.render()}else{const id='rsvp'+Date.now();w.S.guests[id]={name:x.name,rsvp:x.attend?'confirmed':'declined',meal:x.meal||'',table:'',transport:x.transport};w.record(x.name+' · nuevo RSVP',x.attend?'Añadido a invitados':'Registrado como no asistente',[{title:'Invitados',detail:'Nueva persona incorporada'}]);w.render()}x.applied=true;putR(r);addRsvp(d,w)}function openInvIfNeeded(){try{if(location.hash==='#invitados'&&typeof frame.contentWindow.go==='function')frame.contentWindow.go('invitados',1);else if(location.hash==='#mesas'&&typeof frame.contentWindow.go==='function')frame.contentWindow.go('mesas',2)}catch(e){}}frame.addEventListener('load',()=>{patch();openInvIfNeeded();try{const d=frame.contentDocument;const obs=new MutationObserver(()=>patch());obs.observe(d.body,{childList:true,subtree:true})}catch(e){}})})();</script></body></html>
