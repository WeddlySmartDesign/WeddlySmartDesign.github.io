<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests v86</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f5f1ea;overflow:hidden}#app{display:block;width:100%;height:100%;border:0;background:#f5f1ea}</style></head><body><iframe id="app" title="Weddly Smart Design Guests" src="guests-v060.html?v=86-rsvp-flow"></iframe><script>(()=>{const frame=document.getElementById('app');const RSVPKEY='weddly_guests_rsvp_v82';let patching=false,queued=false;function getR(){try{return JSON.parse(localStorage.getItem(RSVPKEY))||{active:false,responses:[],contacts:{},delivery:{}}}catch(e){return{active:false,responses:[],contacts:{},delivery:{}}}}function putR(r){localStorage.setItem(RSVPKEY,JSON.stringify(r))}function schedulePatch(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;patch()})}function setHtmlIfChanged(el,html){if(el.innerHTML!==html)el.innerHTML=html}function installHooks(w){if(w.__v86Hooks)return;w.__v86Hooks=true;['renderHoy','renderGuests','renderTables'].forEach(name=>{const original=w[name];if(typeof original!=='function')return;w[name]=function(){const out=original.apply(this,arguments);schedulePatch();return out}})}function patch(){if(patching)return;patching=true;let d,w;try{d=frame.contentDocument;w=frame.contentWindow}catch(e){patching=false;return}if(!d||!d.body){patching=false;return}installHooks(w);if(!d.getElementById('v86style')){const st=d.createElement('style');st.id='v86style';st.textContent='.nav{z-index:999!important;pointer-events:auto!important;transform:translateZ(0)}.nav button{pointer-events:auto!important;touch-action:manipulation!important;position:relative;z-index:1000}.view{padding-bottom:110px!important}.rsvpBox{background:#2c2a26;color:#fff;border-radius:22px;padding:20px;margin:16px 0}.rsvpBox .small{color:#d9d3cb}.rsvpBox .btn{margin-top:8px}.rsvpActions{display:flex;gap:8px;flex-wrap:wrap}.rsvpActions .btn{flex:1;min-width:145px}.rsvpMeta{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 4px}.rsvpMeta span{font-size:13px;color:#d9d3cb}.rsvpPending{border-left:5px solid #6b7f72}.rsvpPending .row{align-items:flex-start}';d.head.appendChild(st)}if(!d.getElementById('v86safe')){const s=d.createElement('script');s.id='v86safe';s.textContent='window.markRead=function(){if(S.activity){S.activity.read=true;save();renderHoy();}};';d.body.appendChild(s)}addVisual(d);addRsvpEntry(d,w);addPending(d,w);patching=false}function addVisual(d){const mesas=d.getElementById('mesas');if(mesas&&!mesas.querySelector('[data-v81-visual]')){const h2=mesas.querySelector('h2');if(h2){const card=d.createElement('div');card.className='card';card.setAttribute('data-v81-visual','1');card.innerHTML='<b>Plano visual interactivo</b><p class="small">Construye el salón, coloca mesas y elementos y organiza invitados visualmente. El plano y este resumen trabajan sobre la misma distribución.</p><button class="btn" type="button">Abrir plano visual</button>';card.querySelector('button').onclick=()=>location.href='guests-v081-visual-seating.html?v=7';h2.insertAdjacentElement('afterend',card)}const tools=mesas.querySelector('.tools');if(tools&&!tools.querySelector('[data-v81-plan-btn]')){const b=d.createElement('button');b.className='btn';b.type='button';b.textContent='Plano visual';b.setAttribute('data-v81-plan-btn','1');b.onclick=()=>location.href='guests-v081-visual-seating.html?v=7';tools.insertBefore(b,tools.firstChild)}}}function addRsvpEntry(d,w){const r=getR(),guests=Object.values((w.S&&w.S.guests)||{});const sent=Object.values(r.delivery||{}).filter(x=>x&&x.status==='sent').length;const answered=guests.filter(g=>(r.responses||[]).some(x=>String(x.name||'').trim().toLowerCase()===String(g.name||'').trim().toLowerCase())).length;const pending=Math.max(0,sent-answered);[d.getElementById('hoy'),d.getElementById('invitados')].forEach((view,idx)=>{if(!view)return;let box=view.querySelector('[data-rsvp-entry]');if(!box){box=d.createElement('div');box.setAttribute('data-rsvp-entry','1');box.className='rsvpBox';if(idx===0)view.prepend(box);else{const h2=view.querySelector('h2');h2?h2.insertAdjacentElement('afterend',box):view.prepend(box)}}const title=r.active?'RSVP activo':'RSVP conectado';const intro=r.active?'Gestiona formulario, contactos, envíos y respuestas desde aquí.':'Puedes crear el RSVP aquí o seguir trabajando con la lista que ya tienes.';const meta=r.active?`<div class="rsvpMeta"><span>${guests.length} invitados</span><span>${sent} enviados</span><span>${pending} pendientes</span></div>`:'';const html=`<div class="sectiontag" style="color:#d9d3cb">RSVP</div><b style="font-size:21px">${title}</b><p class="small">${intro}</p>${meta}<div class="rsvpActions"><button class="btn soft" type="button" data-open-rsvp>${r.active?'Gestionar RSVP':'Crear y enviar RSVP'}</button><button class="btn soft" type="button" data-use-list>Ya tengo mi lista</button></div>`;setHtmlIfChanged(box,html);const open=box.querySelector('[data-open-rsvp]');if(open&&!open.dataset.bound){open.dataset.bound='1';open.onclick=()=>location.href='guests-rsvp-v82.html?v=86-flow'}const use=box.querySelector('[data-use-list]');if(use&&!use.dataset.bound){use.dataset.bound='1';use.onclick=()=>{try{w.go('invitados',1);setTimeout(()=>{const inv=d.getElementById('invitados');const target=inv&&inv.querySelector('.card:not([data-rsvp-entry]):not([data-rsvp-pending])');target&&target.scrollIntoView({behavior:'smooth',block:'start'})},80)}catch(e){}}}})}function addPending(d,w){const inv=d.getElementById('invitados');if(!inv)return;const r=getR(),p=(r.responses||[]).filter(x=>!x.applied);let box=inv.querySelector('[data-rsvp-pending]');if(!p.length){if(box)box.remove();return}if(!box){box=d.createElement('div');box.setAttribute('data-rsvp-pending','1');box.className='card rsvpPending';const entry=inv.querySelector('[data-rsvp-entry]');entry?entry.insertAdjacentElement('afterend',box):inv.prepend(box)}const html=`<b>${p.length} respuesta${p.length===1?' nueva':'s nuevas'}</b><p class="small">Incorpóralas a Invitados cuando quieras.</p>${p.map((x,i)=>`<div class="row"><div><b>${x.name}</b><div class="small">${x.attend?'Asiste':'No asiste'}${x.meal?' · '+x.meal:''}${x.transport?' · Transporte':''}</div></div><button class="btn soft mini" data-i="${i}">Incorporar</button></div>`).join('')}`;setHtmlIfChanged(box,html);box.querySelectorAll('[data-i]').forEach(b=>{if(!b.dataset.bound){b.dataset.bound='1';b.onclick=()=>apply(+b.dataset.i,d,w)}})}function apply(i,d,w){const r=getR(),p=(r.responses||[]).filter(x=>!x.applied),x=p[i];if(!x)return;let match=null;try{match=Object.entries(w.S.guests).find(([,g])=>g.name.trim().toLocaleLowerCase('es')===x.name.trim().toLocaleLowerCase('es'))}catch(e){}if(match){const [,g]=match;g.rsvp=x.attend?'confirmed':'declined';if(x.meal)g.meal=x.meal;g.transport=!!x.transport;w.record(x.name+' · RSVP recibido',x.attend?'Asistirá':'No asistirá',[{title:'Invitados',detail:'RSVP actualizado'},{title:'Catering actual',detail:x.meal?'Menú actualizado':'Sin cambios de menú'}]);w.render()}else{const id='rsvp'+Date.now();w.S.guests[id]={name:x.name,rsvp:x.attend?'confirmed':'declined',meal:x.meal||'',table:'',transport:!!x.transport};w.record(x.name+' · nuevo RSVP',x.attend?'Añadido a invitados':'Registrado como no asistente',[{title:'Invitados',detail:'Nueva persona incorporada'}]);w.render()}x.applied=true;putR(r);schedulePatch()}function openHash(){try{if(location.hash==='#invitados'&&typeof frame.contentWindow.go==='function')frame.contentWindow.go('invitados',1);else if(location.hash==='#mesas'&&typeof frame.contentWindow.go==='function')frame.contentWindow.go('mesas',2)}catch(e){}}frame.addEventListener('load',()=>{patch();openHash()})})();</script></body></html>
