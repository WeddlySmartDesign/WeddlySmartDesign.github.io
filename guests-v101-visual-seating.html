<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Weddly Smart Design · Guests plano v101</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f1ea}#plan{width:100%;height:100%;border:0;display:block;pointer-events:auto;touch-action:auto}</style></head><body><iframe id="plan" src="guests-v081-visual-seating.html?v=101"></iframe><script>(()=>{const F=document.getElementById('plan');const API='https://dnjsxequwgtyyauuofxj.supabase.co/functions/v1/weddly-guests-structure';const MKEY='weddly_guests_qa_v67',RKEY='weddly_guests_v101_rotations';const token=()=>localStorage.getItem('weddly_shared_wedding_token')||'';const FIXED={'Familia novia':'#a9744d','Familia novio':'#6b7f72','Amigos':'#8b7aa6','Trabajo':'#b28a56','Otros':'#7b8580'},EXTRA=['#8f726f','#708996','#8a806d','#7c7894','#8d7b62','#768c7e'];let rot={},meta={};try{rot=JSON.parse(localStorage.getItem(RKEY))||{}}catch{}const colorFor=n=>{if(FIXED[n])return FIXED[n];let h=0;for(const c of String(n||''))h=(h*31+c.charCodeAt(0))>>>0;return EXTRA[h%EXTRA.length]};function main(){try{return JSON.parse(localStorage.getItem(MKEY))||{}}catch{return{}}}function initials(n){return String(n||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()}async function loadMeta(){const mt=token();if(!mt)return;try{const r=await fetch(API,{headers:{'x-weddly-token':mt}}),x=await r.json();if(r.ok&&x.ok){meta={};(x.people||[]).forEach(p=>meta[p.guest_key]=p);applyColors()}}catch{}}function d(){try{return F.contentDocument}catch{return null}}function keyFor(o){if(!o)return'';if(o.classList.contains('table'))return't:'+String(o.querySelector('.tableCore b')?.textContent||'').trim();return'f:'+String(o.textContent||'').replace('↘','').trim()}function applyRotations(){const doc=d();if(!doc)return;doc.querySelectorAll('.obj').forEach(o=>{const deg=rot[keyFor(o)]||0;o.style.rotate=deg+'deg';o.style.transformOrigin='center center'})}function groupOf(id,g){return meta[id]?.group_name||g.group||'Otros'}function applyColors(){const doc=d();if(!doc||!doc.getElementById('floor'))return;const G=main().guests||{},byName=new Map(),byInit=new Map();for(const [id,g] of Object.entries(G)){const entry={id,g,group:groupOf(id,g)};byName.set(String(g.name||'').trim(),entry);const ini=initials(g.name);if(!byInit.has(ini))byInit.set(ini,[]);byInit.get(ini).push(entry)}doc.querySelectorAll('.guestChip,.personPick').forEach(el=>{const name=String(el.textContent||'').replace(/^[•·]\s*/,'').trim(),e=byName.get(name),dot=el.querySelector('.dot');if(e&&dot)dot.style.background=colorFor(e.group)});doc.querySelectorAll('.seatBadge').forEach(el=>{const a=byInit.get(String(el.textContent||'').trim())||[];if(a.length===1)el.style.background=colorFor(a[0].group)});const groups=[...new Set([...byName.values()].map(e=>e.group).filter(Boolean))];const legend=doc.querySelector('.legend');if(legend&&groups.length&&legend.dataset.v101!=='1'){legend.dataset.v101='1';legend.innerHTML=groups.map(g=>'<span><i class="dot" style="background:'+colorFor(g)+'"></i>'+g+'</span>').join('')}const sel=doc.getElementById('groupFilter');if(sel&&groups.length&&sel.dataset.v101!=='1'){sel.dataset.v101='1';sel.innerHTML='<option value="all">Todos los grupos</option>'+groups.map(g=>'<option value="'+String(g).replace(/"/g,'&quot;')+'">'+g+'</option>').join('')}}function addRotate(){const doc=d();if(!doc)return;const bar=doc.getElementById('selectionBar'),edit=doc.getElementById('editSelected');if(!bar||!edit||bar.querySelector('[data-v101rotate]'))return;const b=doc.createElement('button');b.className='btn';b.type='button';b.dataset.v101rotate='1';b.textContent='Girar 90°';b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();const o=doc.querySelector('.obj.selectedObj');if(!o)return;const k=keyFor(o);rot[k]=((rot[k]||0)+90)%360;localStorage.setItem(RKEY,JSON.stringify(rot));o.style.rotate=rot[k]+'deg';o.style.transformOrigin='center center'});edit.parentNode.insertBefore(b,edit);const note=bar.querySelector('.small');if(note)note.textContent='Puedes moverla, cambiar tamaño, girarla o editarla sin perder invitados. Toca fuera para salir de la selección.'}function wire(){const doc=d();if(!doc||!doc.getElementById('floor')){setTimeout(wire,180);return}const st=doc.createElement('style');st.textContent='.roomViewport,.floor,.obj,.table,.feature{pointer-events:auto!important}.obj{touch-action:none!important}';doc.head.appendChild(st);const back=doc.getElementById('backGuests');if(back)back.onclick=()=>{top.location.href='guests-v101-integrated.html?v=101#mesas'};addRotate();applyColors();applyRotations();doc.addEventListener('click',()=>{setTimeout(()=>{addRotate();applyRotations()},0)},false);doc.addEventListener('pointerup',()=>setTimeout(applyRotations,0),false);setTimeout(applyColors,800);loadMeta()}F.addEventListener('load',()=>setTimeout(wire,500));setTimeout(wire,900);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){loadMeta();applyColors();applyRotations()}})})();</script></body></html>
