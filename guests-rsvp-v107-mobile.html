.textContent='Enviar respuestas';fb.className='notice on';fb.textContent='No se han podido guardar todas las respuestas. Comprueba la conexión e inténtalo de nuevo.'}}async function init(){if(!token){app.innerHTML='<div class="card"><h1>RSVP no disponible</h1><p class="lead">Pide que te reenvíen la invitación.</p></div>';return}try{const x=await j(API+'?token='+encodeURIComponent(token)+'&unit='+encodeURIComponent(unitId));cfg=x.form?.config||{};unit=x.unit;if(!unit?.members?.length)throw new Error('unit_unavailable');render()}catch{app.innerHTML='<div class="card"><h1>RSVP no disponible</h1><p class="lead">Prueba de nuevo o pide que te reenvíen la invitación.</p></div>'}}init()})();</script></body></html>
